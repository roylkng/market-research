name: SS002 P004 native current-event evidence validation

on:
  push:
    branches:
      - research/ss002-p004-native-oct-case-pilot-20261010

permissions:
  contents: read
  actions: read

jobs:
  pilot:
    if: contains(github.event.head_commit.message, '[ss002-p004]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate source-bound native adapter
        run: |
          ruff check \
            src/marketlab/ss002_p004_native.py \
            scripts/materialize_ss002_p004_native.py \
            tests/test_ss002_p004_native.py
          pytest -q \
            tests/test_ss002_p004_native.py \
            tests/test_ss002_llm_contract.py \
            tests/test_ss002_daily_documents.py
      - name: Download exact frozen P003 documents
        uses: actions/download-artifact@v4
        with:
          name: ss002-p003-37982329060
          path: reports/p003
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37982329060
      - name: Freeze exact source ZIP for validator
        run: |
          cd reports/p003
          zip -q -r ../p003-source.zip .
      - name: Validate native source-bound decisions
        run: |
          python scripts/materialize_ss002_p004_native.py \
            --source-artifact reports/p003-source.zip \
            --decisions research/ss002-p004-native-eight-document-decisions-v1.json \
            --out reports/p004/p004-eight-case-sealed.json
      - name: Prove no investment inference
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("reports/p004/p004-eight-case-sealed.json").read_text())
          assert p["pilot_id"] == "SS002-P004-NATIVE-8DOC-v1"
          assert p["selected_document_count"] == 8
          assert p["structurally_validated_document_count"] == 8
          assert p["independently_semantically_audited_document_count"] == 0
          assert p["return_outcomes_opened"] is False
          assert p["market_capitalization_calculated"] is False
          assert p["share_action_clearance_proven"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          for row in p["cases"]:
              assert row["semantic_audit_status"] == "PENDING_INDEPENDENT_SOURCE_REVIEW"
              assert row["validated_extraction"]["portfolio_eligibility_allowed"] is False
          PY
      - name: Upload bounded pilot outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss002-p004-${{ github.run_id }}
          path: reports/p004
          if-no-files-found: warn
          retention-days: 90
