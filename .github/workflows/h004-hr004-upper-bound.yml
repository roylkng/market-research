name: H004 HR004 catalyst upper bound

on:
  push:
    branches:
      - research/h004-catalyst-candidates-v1-20260908
    paths:
      - .github/workflows/h004-hr004-upper-bound.yml
      - scripts/run_h004_catalyst_upper_bound.py
      - research/historical/h004/H004-HR004-catalyst/UPPER-BOUND-CONTRACT.md

permissions:
  contents: write

jobs:
  upper-bound:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h004-catalyst-candidates-v1-20260908
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Load frozen HR003 denominator evidence
        run: |
          git fetch origin research/h004-full-market-denominator-v1-20260908
          git show origin/research/h004-full-market-denominator-v1-20260908:research/historical/h004/H004-HR003-full-market/primary-episodes.json > /tmp/primary-episodes.json
          git show origin/research/h004-full-market-denominator-v1-20260908:research/historical/h004/H004-HR003-full-market/summary.json > /tmp/hr003-summary.json
      - name: Run maximally generous catalyst upper bound
        run: |
          python scripts/run_h004_catalyst_upper_bound.py \
            --candidates research/historical/h004/H004-HR004-catalyst/filtered-candidates.json \
            --episodes /tmp/primary-episodes.json \
            --momentum-summary /tmp/hr003-summary.json \
            --price-start 2025-05-01 \
            --price-end 2026-08-31 \
            --out research/historical/h004/H004-HR004-catalyst/upper-bound-summary.json
      - name: Commit upper-bound evidence
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/historical/h004/H004-HR004-catalyst/upper-bound-*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "H004-HR004: retain catalyst upper-bound falsification"
          git push origin HEAD:research/h004-catalyst-candidates-v1-20260908
