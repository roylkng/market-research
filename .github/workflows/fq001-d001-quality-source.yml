name: FQ001 D001 fundamental quality source feasibility

on:
  push:
    branches:
      - research/fq001-quality-source-feasibility-20261004

permissions:
  contents: read

jobs:
  diagnostic:
    if: contains(github.event.head_commit.message, '[fq001-d001]')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify frozen FQ001 implementation before source access
        run: |
          ruff check \
            src/marketlab/fundamental_quality.py \
            scripts/run_fq001_d001.py \
            tests/test_fundamental_quality.py
          pytest -q \
            tests/test_fundamental_quality.py \
            tests/test_alpha_fundamental.py \
            tests/test_events_xbrl.py

      - name: Run frozen 100-company annual quality source diagnostic
        run: |
          python scripts/run_fq001_d001.py \
            --universe research/prospective/universes/FY27-Q2-2026-09-06.json \
            --raw-dir reports/fq001-d001/raw \
            --output reports/fq001-d001 \
            --attempts 4 \
            --timeout-seconds 20

      - name: Prove outcome-blind diagnostic
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          panel = json.loads(
              Path("reports/fq001-d001/fq001-d001-panel.json").read_text()
          )
          assert panel["return_outcomes_opened"] is False
          assert panel["model_fitted"] is False
          assert panel["portfolio_eligibility_allowed"] is False
          assert panel["live_capital_allowed"] is False
          assert panel["universe_member_count"] == 100
          assert panel["same_basis_pair_count"] + panel["failure_count"] == 100
          print(json.dumps({
              "panel_sha256": panel["panel_sha256"],
              "same_basis_pair_count": panel["same_basis_pair_count"],
              "complete_core_metric_count": panel["complete_core_metric_count"],
              "metric_coverage": panel["metric_coverage"],
              "target_fact_coverage": panel["target_fact_coverage"],
              "baseline_fact_coverage": panel["baseline_fact_coverage"],
              "parser_pair_counts": panel["parser_pair_counts"],
              "failure_stage_counts": panel["failure_stage_counts"],
              "failure_reason_counts": panel["failure_reason_counts"],
              "threshold_passes": panel["threshold_passes"],
              "feasibility_pass": panel["feasibility_pass"],
              "return_outcomes_opened": panel["return_outcomes_opened"],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload exact FQ001 D001 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fq001-d001-${{ github.run_id }}
          path: reports/fq001-d001
          if-no-files-found: warn
          retention-days: 90
