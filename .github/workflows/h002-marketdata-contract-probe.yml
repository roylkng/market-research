name: H002 NSE market-data contract probe

on:
  push:
    branches:
      - probe/h002-marketdata-contracts-20260906
    paths:
      - .github/workflows/h002-marketdata-contract-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Probe current NSE contracts
        run: |
          mkdir -p probe-out
          python - <<'PY'
          import json
          from pathlib import Path
          import requests
          from marketlab.nse import NSEClient

          out = Path('probe-out')
          client = NSEClient(timeout=20.0, attempts=4)
          client._initialize_session()

          probes = {
              'holiday-master': (
                  'https://www.nseindia.com/api/holiday-master',
                  {'type': 'trading'},
              ),
              'equity-securityArchives': (
                  'https://www.nseindia.com/api/historical/securityArchives',
                  {
                      'from': '01-09-2026',
                      'to': '04-09-2026',
                      'symbol': 'RELIANCE',
                      'dataType': 'priceVolumeDeliverable',
                      'series': 'EQ',
                  },
              ),
              'equity-cm-equity': (
                  'https://www.nseindia.com/api/historical/cm/equity',
                  {
                      'from': '01-09-2026',
                      'to': '04-09-2026',
                      'symbol': 'RELIANCE',
                      'series': '["EQ"]',
                  },
              ),
              'index-indicesHistory-nifty50': (
                  'https://www.nseindia.com/api/historical/indicesHistory',
                  {
                      'indexType': 'NIFTY 50',
                      'from': '01-09-2026',
                      'to': '04-09-2026',
                  },
              ),
              'index-indicesHistory-momentum': (
                  'https://www.nseindia.com/api/historical/indicesHistory',
                  {
                      'indexType': 'NIFTY200 MOMENTUM 30',
                      'from': '01-09-2026',
                      'to': '04-09-2026',
                  },
              ),
          }

          summary = {}
          for name, (url, params) in probes.items():
              try:
                  response = client.session.get(url, params=params, timeout=20)
                  raw = response.content
                  record = {
                      'requested_url': response.url,
                      'status': response.status_code,
                      'content_type': response.headers.get('content-type'),
                      'byte_count': len(raw),
                  }
                  if raw:
                      (out / f'{name}.raw').write_bytes(raw)
                  try:
                      payload = response.json()
                      record['json_type'] = type(payload).__name__
                      if isinstance(payload, dict):
                          record['top_keys'] = sorted(payload.keys())
                          for candidate in ('data', 'records', 'CM', 'FO', 'CD'):
                              value = payload.get(candidate)
                              if isinstance(value, list):
                                  record[f'{candidate}_count'] = len(value)
                                  if value and isinstance(value[0], dict):
                                      record[f'{candidate}_first_keys'] = sorted(value[0].keys())
                                      record[f'{candidate}_first'] = value[0]
                      elif isinstance(payload, list):
                          record['count'] = len(payload)
                          if payload and isinstance(payload[0], dict):
                              record['first_keys'] = sorted(payload[0].keys())
                              record['first'] = payload[0]
                  except Exception as exc:
                      record['json_error'] = repr(exc)
                      record['prefix'] = raw[:500].decode('utf-8', errors='replace')
                  summary[name] = record
              except Exception as exc:
                  summary[name] = {'request_error': repr(exc)}

          (out / 'summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True, default=str) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, indent=2, sort_keys=True, default=str))
          PY
      - name: Commit probe summary
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          mkdir -p research/probes/h002-marketdata-2026-09-06
          cp probe-out/summary.json research/probes/h002-marketdata-2026-09-06/summary.json
          git add research/probes/h002-marketdata-2026-09-06/summary.json
          git commit -m "Capture current NSE market-data endpoint contracts" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h002-nse-marketdata-contract-probe-${{ github.run_id }}
          path: probe-out
          if-no-files-found: error
          retention-days: 30
