name: H022 P001 context catch-up

on:
  workflow_dispatch:
  schedule:
    # 00:50 Asia/Kolkata. The gate is forbidden before the frozen
    # 2026-09-15 00:00 IST prospective boundary and becomes idempotent once sealed.
    - cron: '20 19 * * *'

permissions:
  contents: write

concurrency:
  group: h022-p001-context-catchup
  cancel-in-progress: false

jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate frozen P001 core and acquisition invariants
        run: |
          pytest -q \
            tests/test_h022_prospective.py \
            tests/test_h022_p001_acquisition.py

      - name: Resolve catch-up state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          CONTEXT_DIR="research/prospective/h022/P001/context"
          WORK="reports/h022-p001-context/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$WORK"
          NOW="$(python - <<'PY'
          from datetime import UTC, datetime
          print(datetime.now(UTC).isoformat().replace('+00:00', 'Z'))
          PY
          )"
          BEFORE="$(python - <<'PY'
          from datetime import UTC, datetime
          from marketlab.h022_prospective import PROSPECTIVE_START
          print('true' if datetime.now(UTC) < PROSPECTIVE_START else 'false')
          PY
          )"
          if [ -f "$CONTEXT_DIR/operational-context.json" ]; then
            python scripts/verify_h022_p001_context.py \
              --universe research/prospective/universes/FY27-Q2-2026-09-06.json \
              --context-dir "$CONTEXT_DIR"
            STATUS="SEALED"
          elif [ "$BEFORE" = "true" ]; then
            STATUS="BEFORE_BOUNDARY"
          else
            STATUS="RUN"
          fi
          printf '{"checked_at_utc":"%s","status":"%s"}\n' "$NOW" "$STATUS" \
            > "$WORK/workflow-state.json"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "work_dir=$WORK" >> "$GITHUB_OUTPUT"
          echo "context_dir=$CONTEXT_DIR" >> "$GITHUB_OUTPUT"
          echo "H022-P001 context state: $STATUS"

      - name: Build mandatory pre-start context
        if: steps.state.outputs.status == 'RUN'
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ steps.state.outputs.work_dir }}"
          python scripts/build_h022_p001_context.py \
            --universe research/prospective/universes/FY27-Q2-2026-09-06.json \
            --historical-report research/historical/h022/expanded-e002-v1/report.json \
            --store "$WORK/store" \
            --out-dir "$WORK/output" \
            --pause-seconds 0.15 \
            --fetch-attempts 4

      - name: Verify newly built context offline
        if: steps.state.outputs.status == 'RUN'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_h022_p001_context.py \
            --universe research/prospective/universes/FY27-Q2-2026-09-06.json \
            --context-dir "${{ steps.state.outputs.work_dir }}/output"

      - name: Refuse to anchor context on changed rules
        if: steps.state.outputs.status == 'RUN'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          START_SHA="${GITHUB_SHA}"
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [ "$START_SHA" != "$CURRENT_MAIN" ]; then
            echo "main moved during H022-P001 context acquisition; refusing to seal"
            echo "start=$START_SHA current_main=$CURRENT_MAIN"
            exit 1
          fi

      - name: Seal canonical P001 context artifacts
        if: steps.state.outputs.status == 'RUN'
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ steps.state.outputs.work_dir }}"
          CONTEXT_DIR="${{ steps.state.outputs.context_dir }}"
          if [ -e "$CONTEXT_DIR" ]; then
            echo "canonical P001 context path already exists; refusing overwrite"
            exit 1
          fi
          mkdir -p "$CONTEXT_DIR"
          for NAME in \
            discovery-manifest.json \
            catchup-records.json \
            context-gate.json \
            static-prior-index.json \
            operational-context.json \
            summary.json; do
            cp "$WORK/output/$NAME" "$CONTEXT_DIR/$NAME"
          done
          python scripts/verify_h022_p001_context.py \
            --universe research/prospective/universes/FY27-Q2-2026-09-06.json \
            --context-dir "$CONTEXT_DIR"
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add "$CONTEXT_DIR"
          git commit -m "H022: seal P001 mandatory pre-start context [skip ci]"
          git push origin HEAD:main

      - name: Upload catch-up evidence
        if: always() && steps.state.outputs.status == 'RUN'
        uses: actions/upload-artifact@v4
        with:
          name: h022-p001-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.state.outputs.work_dir }}
          if-no-files-found: error
          retention-days: 90

      - name: Report boundary wait
        if: steps.state.outputs.status == 'BEFORE_BOUNDARY'
        run: echo "H022-P001 context gate correctly waiting for prospective boundary"

      - name: Report sealed context
        if: steps.state.outputs.status == 'SEALED'
        run: echo "H022-P001 canonical context already sealed and verified"
