name: HG007 WWIL official BSE PDF source evidence

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hg007-wwil-original-bse-source.yml
  schedule:
    # Oct 10-31 only; the workflow's date gate makes later years no-ops.
    - cron: '30 3 10-31 10 *'

permissions:
  contents: write

concurrency:
  group: hg007-wwil-original-bse-source-once
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify conservative no-bypass PDF byte contract
        run: |
          ruff check scripts/probe_hg007_bse_wwil_original.py tests/test_hg007_bse_source_probe.py
          pytest -q tests/test_hg007_bse_source_probe.py
      - name: Gate exact case, year and unrecorded original source
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=Asia/Kolkata date +%F)"
          STATE=SKIP
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || [[ "$TODAY" > "2026-10-09" && "$TODAY" < "2026-11-01" ]]; then
            git fetch origin main
            DEST="research/hg007/wwil-bse-original/official-source-receipt-v1.json"
            if git cat-file -e "origin/main:$DEST" 2>/dev/null; then
              STATE=ALREADY_RETAINED
            else
              STATE=ATTEMPT
            fi
          fi
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "original PDF state gate=$STATE"
      - name: Probe original BSE attachment once without bypass
        if: steps.gate.outputs.state == 'ATTEMPT'
        shell: bash
        run: |
          set -euo pipefail
          OUT="/tmp/hg007-wwil-bse-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "ORIGINAL_SOURCE_OUT=$OUT" >> "$GITHUB_ENV"
          python scripts/probe_hg007_bse_wwil_original.py \
            --out-dir "$OUT" --attempts 2 --sleep-seconds 3
          test -s "$OUT/receipt.json"
      - name: Retain original PDF byte and source receipt only when available
        if: steps.gate.outputs.state == 'ATTEMPT'
        shell: bash
        run: |
          set -euo pipefail
          STATE="$(python - "$ORIGINAL_SOURCE_OUT/receipt.json" <<'PY'
          import json,sys
          from pathlib import Path
          value=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          print(value['state'])
          PY
          )"
          if [[ "$STATE" != PDF_SOURCE_BYTES_CAPTURED_NOT_SEMANTICALLY_AUDITED ]]; then
            echo "Official BSE original remains unavailable: $STATE; no source approval created"
            exit 0
          fi
          SOURCE="research/hg007/wwil-bse-original"
          TARGET="$SOURCE/official-source-receipt-v1.json"
          mkdir -p "$SOURCE/original-raw/sha256"
          cp "$ORIGINAL_SOURCE_OUT/receipt.json" "$TARGET"
          cp "$ORIGINAL_SOURCE_OUT"/original-raw/sha256/*.pdf "$SOURCE/original-raw/sha256/"
          HASH="$(python - "$TARGET" <<'PY'
          import json,sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          if data['original_page_semantic_audit_approved'] is not False:
              raise SystemExit('semantic approval unexpectedly enabled')
          print(data['original_pdf_sha256'])
          PY
          )"
          [[ -f "$SOURCE/original-raw/sha256/$HASH.pdf" ]]
          [[ "$(sha256sum "$SOURCE/original-raw/sha256/$HASH.pdf" | cut -d' ' -f1)" == "$HASH" ]]
          git config user.name marketlab-research-bot
          git config user.email marketlab-research-bot@users.noreply.github.com
          git add -f "$SOURCE"
          git commit -m "HG007: retain exact original WWIL BSE PDF bytes without semantic approval"

          BASE_SHA="$(git rev-parse HEAD^)"
          for ATTEMPT in 1 2 3; do
            git fetch origin main
            MAIN_SHA="$(git rev-parse origin/main)"
            if git cat-file -e "origin/main:$TARGET" 2>/dev/null; then
              echo "Immutable original receipt already exists; refusing overwrite"
              exit 1
            fi
            if ! git diff --quiet "$BASE_SHA" "$MAIN_SHA" -- \
              scripts/probe_hg007_bse_wwil_original.py \
              .github/workflows/hg007-wwil-original-bse-source.yml \
              research/HG007_P002_INOXGREEN_WWIL_FUNDING_MINORITY_AUDIT_2026_10_10.md; then
              echo "Original source/protocol code changed mid-acquisition"
              exit 1
            fi
            if [[ "$MAIN_SHA" != "$BASE_SHA" ]]; then
              git rebase origin/main
              BASE_SHA="$MAIN_SHA"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((ATTEMPT*2))
          done
          echo "Original PDF bytes could not be anchored after bounded retries"
          exit 1
      - name: Keep independently time-stamped source probe evidence
        if: always() && steps.gate.outputs.state == 'ATTEMPT'
        uses: actions/upload-artifact@v4
        with:
          name: hg007-wwil-bse-original-probe
          path: ${{ env.ORIGINAL_SOURCE_OUT }}
          if-no-files-found: ignore
          retention-days: 90
