name: HG009 P032 official NSE Total Market industry snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - feat/hg009-p032-totalmarket-official-sector-20261021
    paths:
      - .github/workflows/hg009-p032-totalmarket.yml
      - src/marketlab/hg009_p032_totalmarket.py
      - scripts/capture_hg009_p032_totalmarket.py
      - tests/test_hg009_p032_totalmarket.py
  schedule:
    # Weekly refresh on main, not continuous high-frequency API calls.
    - cron: '30 5 * * 2'

permissions:
  contents: write

concurrency:
  group: hg009-p032-static-index-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify official static CSV parser and frozen 300 identities
        shell: bash
        run: |
          set -euo pipefail
          ruff check src/marketlab/hg009_p032_totalmarket.py scripts/capture_hg009_p032_totalmarket.py tests/test_hg009_p032_totalmarket.py
          pytest -q tests/test_hg009_p032_totalmarket.py
          python scripts/capture_hg009_p032_totalmarket.py --check
      - name: Acquire exactly one original NSE Total Market constituent CSV
        shell: bash
        run: |
          set -euo pipefail
          python scripts/capture_hg009_p032_totalmarket.py
          python scripts/capture_hg009_p032_totalmarket.py --check
      - name: Publish verified or blocked original NSE source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          if [ ! -d research/hg009/p032-totalmarket ]; then
            echo "No new NSE report or source-attempt evidence"
            exit 0
          fi
          git add -f research/hg009/p032-totalmarket
          if git diff --cached --quiet; then
            echo "No changed source evidence"
            exit 0
          fi
          git commit -m "HG009 P032: timestamp original NSE index industry CSV receipt [skip ci]"
          TARGET="$GITHUB_REF_NAME"
          git fetch origin "$TARGET"
          git rebase "origin/$TARGET"
          python scripts/capture_hg009_p032_totalmarket.py --check
          git push origin HEAD:"$TARGET"
