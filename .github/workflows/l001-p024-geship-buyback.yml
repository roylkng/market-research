name: L001 P024 original GESHIP issuer share-extinguishment custody

on:
  push:
    branches:
      - research/l001-p024-geship-certified-buyback-capital-20261021
    paths:
      - .github/workflows/l001-p024-geship-buyback.yml
      - src/marketlab/l001_p024_geship_buyback.py
      - scripts/archive_l001_p024_geship.py
      - tests/test_l001_p024_geship_buyback.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l001-p024-original-geship-share-certificates
  cancel-in-progress: false

jobs:
  verify-and-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source replay requirements
        run: python -m pip install -e '.[dev]'
      - name: Verify cash/share inputs cannot be silently inferred
        shell: bash
        run: |
          set -euo pipefail
          ruff check \
            src/marketlab/l001_p024_geship_buyback.py \
            scripts/archive_l001_p024_geship.py \
            tests/test_l001_p024_geship_buyback.py
          pytest -q tests/test_l001_p024_geship_buyback.py
      - name: Fetch exact first party issuer PDF sources and retain attempted source records
        shell: bash
        run: |
          set -euo pipefail
          python scripts/archive_l001_p024_geship.py \
            --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python scripts/archive_l001_p024_geship.py --check
      - name: Seal original source, even when retrieval or identity is blocked
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add -f research/l001/originals/geship_buyback
          if [ -f research/l001/l001-p024-geship-buyback-capital-bridge-v1.json ]; then
            git add research/l001/l001-p024-geship-buyback-capital-bridge-v1.json
          fi
          if git diff --cached --quiet; then
            echo "Issuer original buyback reports are already sealed"
            exit 0
          fi
          git commit -m "L001 P024: preserve original issuer buyback cancellation and purchase receipts [skip ci]"
          git fetch origin research/l001-p024-geship-certified-buyback-capital-20261021
          git rebase origin/research/l001-p024-geship-certified-buyback-capital-20261021
          python scripts/archive_l001_p024_geship.py --check
          git push origin HEAD:research/l001-p024-geship-certified-buyback-capital-20261021
