name: L001 P006 original cashflow quality audit

on:
  pull_request:
    paths:
      - src/marketlab/l001_p006_cash_anomalies.py
      - scripts/materialize_l001_p006_cash_anomalies.py
      - tests/test_l001_p006_cash_anomalies.py
      - .github/workflows/l001-p006-cash-anomaly.yml

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and verify static guards
        run: |
          python -m pip install -e '.[dev]'
          ruff check src/marketlab/l001_p006_cash_anomalies.py scripts/materialize_l001_p006_cash_anomalies.py tests/test_l001_p006_cash_anomalies.py
          pytest -q tests/test_l001_p006_cash_anomalies.py
      - name: Retrieve exact already verified 300-original-file artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/12111414537/zip" \
            --output "$RUNNER_TEMP/p004-verified.zip"
          unzip -j "$RUNNER_TEMP/p004-verified.zip" \
            l001-p004-all100-original-audit.json -d "$RUNNER_TEMP"
          unzip -j "$RUNNER_TEMP/p004-verified.zip" \
            l001-p004-original-300-source-files.zip -d "$RUNNER_TEMP"
      - name: Replay source-original 100-company CFO component table
        run: |
          python scripts/materialize_l001_p006_cash_anomalies.py \
            --p004-report "$RUNNER_TEMP/l001-p004-all100-original-audit.json" \
            --xml-zip "$RUNNER_TEMP/l001-p004-original-300-source-files.zip" \
            --output "$RUNNER_TEMP/l001-p006-original-cash-anomalies-100.json" \
            | tee "$RUNNER_TEMP/l001-p006-summary.json"
      - name: Publish reproducible research-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: l001-p006-source-original-100-cashflow-diagnostics
          path: |
            ${{ runner.temp }}/l001-p006-original-cash-anomalies-100.json
            ${{ runner.temp }}/l001-p006-summary.json
          retention-days: 90
