name: HG007 original Anant Raj QIP cash and demerger source ledger

on:
  pull_request:
    paths:
      - src/marketlab/hg007_anantraj_qip_cash_ledger.py
      - scripts/reconcile_hg007_anantraj_qip_cash.py
      - tests/test_hg007_anantraj_qip_cash_ledger.py
      - .github/workflows/hg007-anantraj-qip-cash-source-review.yml
  push:
    branches:
      - main
    paths:
      - src/marketlab/hg007_anantraj_qip_cash_ledger.py
      - scripts/reconcile_hg007_anantraj_qip_cash.py
      - tests/test_hg007_anantraj_qip_cash_ledger.py
      - .github/workflows/hg007-anantraj-qip-cash-source-review.yml

permissions:
  contents: write

concurrency:
  group: hg007-source-pinned-anantraj-june2026-qip-cash
  cancel-in-progress: false

jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify exact two original source families and no-return gates
        run: |
          ruff check src/marketlab/hg007_anantraj_qip_cash_ledger.py scripts/reconcile_hg007_anantraj_qip_cash.py tests/test_hg007_anantraj_qip_cash_ledger.py
          pytest -q tests/test_hg007_anantraj_qip_cash_ledger.py
      - name: Reproduce 21-page original QIP cash/debt bridge
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reconcile_hg007_anantraj_qip_cash.py \
            --repo-root . \
            --out /tmp/hg007-anantraj-qip-p029-source-ledger-v1.json
          test -s /tmp/hg007-anantraj-qip-p029-source-ledger-v1.json
      - name: Anchor source ledger on main once only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          TARGET="research/hg007/anantraj-qip-monitor-june2026/p029-source-object-cash-ledger-v1.json"
          if [[ -f "$TARGET" ]]; then
            python scripts/reconcile_hg007_anantraj_qip_cash.py \
              --out "$TARGET" --verify-existing
            echo "Original source object cash evidence already anchored"
            exit 0
          fi
          cp /tmp/hg007-anantraj-qip-p029-source-ledger-v1.json "$TARGET"
          git config user.name marketlab-research-bot
          git config user.email marketlab-research-bot@users.noreply.github.com
          git add "$TARGET"
          git commit -m "HG007: source-anchor June QIP cash vs proposed Ashok Cloud transfer [skip ci]"
          BASE_SHA="$(git rev-parse HEAD^)"
          for ATTEMPT in 1 2 3; do
            git fetch origin main
            MAIN_SHA="$(git rev-parse origin/main)"
            if git cat-file -e "origin/main:$TARGET" 2>/dev/null; then
              echo "One-time original report already persisted; refusing overwrites"
              exit 1
            fi
            if ! git diff --quiet "$BASE_SHA" "$MAIN_SHA" -- \
              research/hg007/anantraj-qip-monitor-june2026/nse-original-receipt-v1.json \
              research/hg007/anantraj-qip-monitor-june2026/nse-original \
              research/hg007/anantraj-full-scheme/p026-clause-review-v1.json \
              src/marketlab/hg007_anantraj_qip_cash_ledger.py; then
              echo "Original 21-page PDF or demerger asset/debt scheme changed"
              exit 1
            fi
            if [[ "$MAIN_SHA" != "$BASE_SHA" ]]; then
              git rebase origin/main
              BASE_SHA="$MAIN_SHA"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((ATTEMPT*2))"
          done
          echo "Original June QIP audit anchor failed after bounded retries"
          exit 1
      - name: Retain independent original accounting extraction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hg007-anantraj-21page-june-qip-object-ledger-v1
          path: /tmp/hg007-anantraj-qip-p029-source-ledger-v1.json
          if-no-files-found: ignore
          retention-days: 90
