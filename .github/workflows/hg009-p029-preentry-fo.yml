name: HG009 P029 preentry NSE futures source exposure

on:
  push:
    branches:
      - research/hg009-p029-preentry-fo-microstructure-20261021
    paths:
      - .github/workflows/hg009-p029-preentry-fo.yml
      - src/marketlab/hg009_p029_fo_exposure.py
      - scripts/materialize_hg009_p029.py
      - tests/test_hg009_p029.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hg009-p029-original-fo-exposure
  cancel-in-progress: false

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install source-verification contracts
        run: python -m pip install -e '.[dev]'

      - name: Freeze preentry stock-futures ticker exposure, no outcomes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_hg009_p029.py
          python scripts/materialize_hg009_p029.py --check
          ruff check src/marketlab/hg009_p029_fo_exposure.py scripts/materialize_hg009_p029.py tests/test_hg009_p029.py
          pytest -q tests/test_hg009_p029.py

      - name: Full repository lint, tests, research accounting and registry
        shell: bash
        run: |
          set -euo pipefail
          ruff check src tests scripts
          pytest -q
          python scripts/audit_h021_eps_sign.py --out /tmp/h021-eps-sign-audit.json
          python scripts/validate_rta001_coverage.py --repo-root .
          marketlab validate-registry registry/hypotheses.yaml

      - name: Publish immutable source evidence before any strategy inference
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/hg009/hg009-p029-preentry-fo-microstructure-v1.json
          if git diff --cached --quiet; then
            echo "HG009 P029 original FO source packet already sealed"
            exit 0
          fi
          git commit -m "HG009 P029: seal original preentry futures ticker exposure [skip ci]"
          git fetch origin research/hg009-p029-preentry-fo-microstructure-20261021
          git rebase origin/research/hg009-p029-preentry-fo-microstructure-20261021
          python scripts/materialize_hg009_p029.py --check
          git push origin HEAD:research/hg009-p029-preentry-fo-microstructure-20261021
