name: RM001 D010-R1 duplicate filing semantics

on:
  push:
    branches:
      - feat/rm001-d010-r1-duplicate-semantics-20261002

permissions:
  contents: read

jobs:
  diagnostic:
    if: contains(github.event.head_commit.message, '[rm001-d010-r1]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify R1 implementation before archive access
        run: |
          ruff check \
            src/marketlab/rm001_d010_r1.py \
            scripts/run_rm001_d010_r1.py \
            tests/test_rm001_d010_r1.py
          pytest -q tests/test_rm001_d010_r1.py
          marketlab validate-registry registry/hypotheses.yaml

      - name: Run frozen duplicate filing diagnostic
        run: |
          python scripts/run_rm001_d010_r1.py \
            --output reports/rm001-d010-r1 \
            --attempts 4 \
            --timeout-seconds 90

      - name: Print compact result
        run: cat reports/rm001-d010-r1/summary.json

      - name: Upload exact R1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rm001-d010-r1-${{ github.run_id }}
          path: reports/rm001-d010-r1
          if-no-files-found: warn
          retention-days: 90
