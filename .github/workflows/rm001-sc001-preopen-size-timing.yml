name: RM001 SC001 previous-session size pre-open timing

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - AE001 SC003 previous-session futures pre-open timing
      - H024 prospective insider stream
    types:
      - completed
  schedule:
    # Frozen primary cadence, Asia/Kolkata:
    # 06:30, 07:00, 07:30, 08:00, 08:15, 08:25.
    - cron: '0 1 * * 1-5'
    - cron: '30 1 * * 1-5'
    - cron: '0 2 * * 1-5'
    - cron: '30 2 * * 1-5'
    - cron: '45 2 * * 1-5'
    - cron: '55 2 * * 1-5'

permissions:
  contents: write

concurrency:
  group: rm001-sc001-preopen-size-timing
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh latest canonical main before observation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach origin/main
          echo "OBSERVATION_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify RM001-SC001 implementation before source access
        run: |
          ruff check \
            src/marketlab/rm001_size_timing.py \
            src/marketlab/rm001_size_source.py \
            scripts/probe_rm001_sc001.py \
            scripts/verify_rm001_sc001.py \
            tests/test_rm001_size_timing.py \
            tests/test_rm001_size_source.py
          pytest -q \
            tests/test_rm001_size_timing.py \
            tests/test_rm001_size_source.py \
            tests/test_alpha_sc003_preopen.py
          python scripts/verify_rm001_sc001.py \
            --ledger research/prospective/rm001-sc001/source-ledger.json \
            --summary research/prospective/rm001-sc001/readiness-summary.json

      - name: Resolve observation date and causal window
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=Asia/Kolkata date +%F)"
          NOW_HM="$(TZ=Asia/Kolkata date +%H%M)"
          if [[ "$TODAY" < "2026-10-02" ]]; then
            STATE="BEFORE_START"
          elif [[ "$NOW_HM" > "0830" ]]; then
            STATE="AFTER_PREOPEN_CUTOFF"
          else
            STATE="READY"
          fi
          echo "date=$TODAY" >> "$GITHUB_OUTPUT"
          echo "time_hm=$NOW_HM" >> "$GITHUB_OUTPUT"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "RM001-SC001 gate: observation_date=$TODAY time=$NOW_HM event=${GITHUB_EVENT_NAME} state=$STATE"

      - name: Probe latest completed SC001 session Security File
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/probe_rm001_sc001.py \
            --observation-date "${{ steps.gate.outputs.date }}" \
            --sc001-ledger research/prospective/ae001-sc001/source-ledger.json \
            --size-ledger research/prospective/rm001-sc001/source-ledger.json \
            --summary research/prospective/rm001-sc001/readiness-summary.json \
            --attempts 4 \
            --timeout-seconds 30 | tee rm001-sc001-probe.json
          python scripts/verify_rm001_sc001.py \
            --ledger research/prospective/rm001-sc001/source-ledger.json \
            --summary research/prospective/rm001-sc001/readiness-summary.json

      - name: Anchor append-only RM001-SC001 evidence
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          LEDGER="research/prospective/rm001-sc001/source-ledger.json"
          SUMMARY="research/prospective/rm001-sc001/readiness-summary.json"
          python scripts/verify_rm001_sc001.py \
            --ledger "$LEDGER" \
            --summary "$SUMMARY"

          START_SHA="$OBSERVATION_BASE_SHA"

          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/prospective/rm001-sc001
          if git diff --cached --quiet; then
            echo "No new RM001-SC001 evidence to anchor"
            exit 0
          fi

          git commit -m "RM001 SC001: seal pre-open size timing probe ${{ steps.gate.outputs.date }} [skip ci]"

          CRITICAL_PATHS=(
            ".github/workflows/rm001-sc001-preopen-size-timing.yml"
            "registry/rm001_sc001_preopen_size.yaml"
            "research/RM001_SC001_PREOPEN_SIZE_SOURCE_TIMING_V1.md"
            "research/RM001_SC001_OPERATIONAL_TRIGGER_REDUNDANCY_P1.md"
            "research/prospective/ae001-sc001"
            "research/prospective/rm001-sc001"
            "src/marketlab/rm001_size_timing.py"
            "src/marketlab/rm001_size_source.py"
            "scripts/probe_rm001_sc001.py"
            "scripts/verify_rm001_sc001.py"
          )

          for ATTEMPT in 1 2 3; do
            git fetch origin main
            CURRENT_MAIN="$(git rev-parse origin/main)"
            if [ "$START_SHA" != "$CURRENT_MAIN" ]; then
              if ! git diff --quiet "$START_SHA" "$CURRENT_MAIN" -- "${CRITICAL_PATHS[@]}"; then
                echo "RM001-SC001 rules or canonical source state changed while observation was in flight"
                git diff --stat "$START_SHA" "$CURRENT_MAIN" -- "${CRITICAL_PATHS[@]}"
                exit 1
              fi
              git rebase origin/main
              python scripts/verify_rm001_sc001.py \
                --ledger "$LEDGER" \
                --summary "$SUMMARY"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((ATTEMPT * 2))
          done
          echo "Unable to anchor RM001-SC001 evidence after bounded retries"
          exit 1

      - name: Report non-observation gate
        if: steps.gate.outputs.state != 'READY'
        run: |
          echo "RM001-SC001 did not probe: state=${{ steps.gate.outputs.state }} date=${{ steps.gate.outputs.date }} time=${{ steps.gate.outputs.time_hm }}"
