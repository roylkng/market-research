name: H004 HR004 catalyst candidates

on:
  push:
    branches:
      - research/h004-catalyst-candidates-v1-20260908
    paths:
      - .github/workflows/h004-hr004-catalyst-candidates.yml
      - scripts/build_h004_catalyst_candidates.py
      - research/historical/h004/H004-HR004-catalyst/CONTRACT.md

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h004-catalyst-candidates-v1-20260908
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Extract candidates without future-return inspection
        run: |
          python scripts/build_h004_catalyst_candidates.py \
            --start 2025-10-01 \
            --end 2026-07-31 \
            --out-dir research/historical/h004/H004-HR004-catalyst
      - name: Commit extraction evidence
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/historical/h004/H004-HR004-catalyst
          if git diff --cached --quiet; then
            echo "outputs unchanged"
            exit 0
          fi
          git commit -m "H004-HR004: retain catalyst candidate queue"
          git push origin HEAD:research/h004-catalyst-candidates-v1-20260908
