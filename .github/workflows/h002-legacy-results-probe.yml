name: H002 legacy NSE results probe

on:
  push:
    branches:
      - work/h002-historical-replay-v1-20260907
    paths:
      - scripts/probe_h002_legacy_financial_results.py
      - .github/workflows/h002-legacy-results-probe.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h002-legacy-results-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/h002-historical-replay-v1-20260907
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint probe
        run: ruff check scripts/probe_h002_legacy_financial_results.py
      - name: Probe official legacy financial-results metadata and XBRL
        run: |
          python scripts/probe_h002_legacy_financial_results.py \
            --attempts 5 \
            --timeout 25 \
            --store .marketlab-legacy-results-probe \
            --output research/probes/h002-legacy-results-20260907/report.json
      - name: Validate report has usable legacy XBRL
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('research/probes/h002-legacy-results-20260907/report.json')
          doc = json.loads(path.read_text(encoding='utf-8'))
          results = doc.get('results', [])
          if len(results) != 5:
              raise SystemExit(f'expected 5 symbol probes, got {len(results)}')
          usable = 0
          for result in results:
              probes = result.get('xbrl_probes', [])
              if probes:
                  usable += 1
              print(
                  result.get('symbol'),
                  'rows=', result.get('row_count'),
                  'xbrl=', len(probes),
              )
              for probe in probes:
                  print(
                      ' ', probe.get('period_end'), probe.get('basis'),
                      json.dumps(probe.get('shape'), sort_keys=True),
                  )
          if usable < 3:
              raise SystemExit(f'legacy XBRL coverage too weak: usable symbols={usable}')
          PY
      - name: Upload exact probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h002-legacy-results-probe
          path: |
            .marketlab-legacy-results-probe
            research/probes/h002-legacy-results-20260907/report.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
      - name: Commit probe report
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/probes/h002-legacy-results-20260907/report.json
          if git diff --cached --quiet; then
            echo "legacy probe report unchanged"
            exit 0
          fi
          git commit -m "H002: capture legacy NSE filing taxonomy probe"
          git push origin HEAD:work/h002-historical-replay-v1-20260907
