name: AE001 T006 freeze trial ledger

on:
  push:
    branches:
      - feat/ae001-t006-prospective-futures-20260930

permissions:
  contents: write

jobs:
  freeze:
    if: contains(github.event.head_commit.message, '[t006-freeze-ledger]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Append T006 registration and P1
        run: |
          python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path

          from marketlab.alpha_trials import (
              append_trial_event,
              trial_state,
              validate_trial_ledger,
          )

          path = Path("research/ae001/trial-ledger.json")
          ledger = json.loads(path.read_text(encoding="utf-8"))
          validate_trial_ledger(ledger)

          try:
              trial_state(ledger, "AE001-T006")
          except Exception:
              pass
          else:
              raise SystemExit("AE001-T006 is already registered")

          now = datetime.now(UTC)
          registration_payload = {
              "status": "FROZEN_BEFORE_FIRST_ELIGIBLE_DECISION_SESSION",
              "name": "prospective_stock_futures_5d_confirmation",
              "research_class": "PROSPECTIVE_CONFIRMATORY",
              "predecessor_trial": "AE001-T005",
              "historical_predecessor_outcome_known": True,
              "earliest_calendar_date": "2026-10-01",
              "decision_cutoff_ist": "18:30:00",
              "source_timing_ledgers": [
                  "research/prospective/ae001-sc001/source-ledger.json",
                  "research/prospective/ae001-sc002/source-ledger.json",
              ],
              "base_feature_count": 27,
              "augmented_feature_count": 37,
              "futures_feature_count": 10,
              "model": {"type": "ridge", "l2": 1.0},
              "minimum_common_stocks_per_session": 100,
              "primary": {
                  "horizon_sessions": 5,
                  "minimum_eligible_decision_sessions": 60,
                  "minimum_valid_paired_ic_sessions": 50,
                  "newey_west_lag": 4,
                  "success_requires_both_rank_ic_and_spread": True,
              },
              "secondary": {
                  "horizon_sessions": 1,
                  "newey_west_lag": 5,
                  "rescues_failed_primary": False,
              },
              "live_capital_allowed": False,
          }
          ledger = append_trial_event(
              ledger,
              event_type="TRIAL_REGISTERED",
              trial_id="AE001-T006",
              recorded_at_utc=now.isoformat(),
              payload=registration_payload,
          )

          p1_payload = {
              "protocol_id": "AE001-T006-P1",
              "source_end_date": "2026-09-25",
              "training_horizon_sessions": 5,
              "only_examples_with_exit_on_or_before_source_end_date": True,
              "ridge_l2": 1.0,
              "base_feature_count": 27,
              "augmented_feature_count": 37,
              "futures_feature_count": 10,
              "retraining_during_trial_allowed": False,
              "earliest_eligible_decision_date": "2026-10-01",
              "market_panel_sha256": "9e644012720084a693071a40ce9c592b4586f8c6cee8445fcf7aa599be94b41e",
              "corporate_action_ledger_sha256": "1238ec2c4b2697cf52ea66194aeb0d70171a22071f7249e3fcdc8a8f83ede5c1",
              "delivery_feature_panel_sha256": "99c0c34da30a9318c428d44d68d23360c7588a618e54cad80acde22a959c2e90",
              "futures_panel_sha256": "02656c828a1d5fe22660c154a445ebd69a7492b56f1807da0d8c959a6f0c11d5",
              "futures_feature_panel_sha256": "62dd3c2f50fcaf6d58e47526df76aff41f2a4c2ec43c2a5724f7c23611af803f",
              "live_capital_allowed": False,
          }
          ledger = append_trial_event(
              ledger,
              event_type="TRIAL_PROTOCOL_AMENDED",
              trial_id="AE001-T006",
              recorded_at_utc=datetime.now(UTC).isoformat(),
              payload=p1_payload,
          )

          validate_trial_ledger(ledger)
          path.write_text(
              json.dumps(
                  ledger,
                  indent=2,
                  sort_keys=True,
                  ensure_ascii=False,
                  allow_nan=False,
              )
              + "\n",
              encoding="utf-8",
          )
          print("T006_LEDGER_SHA", ledger["ledger_sha256"])
          print("T006_REGISTRATION_EVENT_SHA", ledger["events"][-2]["event_sha256"])
          print("T006_P1_EVENT_SHA", ledger["events"][-1]["event_sha256"])
          PY

      - name: Commit frozen T006 ledger
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/ae001/trial-ledger.json
          git commit -m "research: freeze AE001 T006 registration and model protocol [skip ci]"
          git push origin HEAD:feat/ae001-t006-prospective-futures-20260930
