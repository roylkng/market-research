name: SS002 P007 official Oct-09 conditional payoff

on:
  push:
    branches:
      - research/ss002-p007-official-price-payoff-20261010

permissions:
  actions: read
  contents: read

jobs:
  price:
    if: contains(github.event.head_commit.message, '[ss002-p007]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Check frozen mathematics and provenance guards
        run: |
          ruff check src/marketlab/ss002_p007_payoff.py tests/test_ss002_p007_payoff.py scripts/run_ss002_p007.py
          pytest -q tests/test_ss002_p007_payoff.py tests/test_ss002_p006_casebook.py
      - name: Download exact passed P006 source packet
        uses: actions/download-artifact@v4
        with:
          name: ss002-p006-37997329162
          path: reports/p006-source
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37997329162
      - name: Official dated price + conditional scenario materialization
        run: |
          python scripts/run_ss002_p007.py \
            --p006-packet reports/p006-source/ss002-p006-casebook.json \
            --raw-dir reports/p007/raw \
            --out reports/p007/ss002-p007-official-price.json
      - name: Research-only assertions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("reports/p007/ss002-p007-official-price.json").read_text())
          assert r["panel_id"] == "SS002-P007-v1"
          assert r["identity_count"] == 8
          assert r["price_session"] == "2026-10-09"
          assert r["post_announcement_price_observed"] is True
          assert r["future_holding_period_return_outcomes_opened"] is False
          assert r["expected_returns_calculated"] is False
          assert r["portfolio_eligibility_allowed"] is False
          assert r["live_capital_allowed"] is False
          print(json.dumps({
            "official_bhavcopy_sha256":r["official_bhavcopy_sha256"],
            "panel_sha256":r["panel_sha256"],
            "matched_price_count":r["matched_price_count"],
            "mechanical_scenario_count":r["mechanical_scenario_count"],
            "feasibility_pass":r["feasibility_pass"],
            "VRLLOG":next((x for x in r["rows"] if x["symbol"]=="VRLLOG"),None),
            "OLAELEC":next((x for x in r["rows"] if x["symbol"]=="OLAELEC"),None)
          },indent=2,sort_keys=True))
          PY
      - name: Preserve P007 exact price evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss002-p007-${{ github.run_id }}
          path: reports/p007
          if-no-files-found: warn
          retention-days: 90
