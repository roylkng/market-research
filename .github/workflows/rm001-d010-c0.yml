name: RM001 D010 Phase C0 BRSR archive inventory

on:
  push:
    branches:
      - feat/rm001-d010-brsr-nic-source-20261002

permissions:
  contents: read

jobs:
  inventory:
    if: contains(github.event.head_commit.message, '[rm001-d010-c0]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify C0 implementation
        run: |
          ruff check scripts/run_rm001_d010_c0.py
          marketlab validate-registry registry/hypotheses.yaml
      - name: Inventory frozen annual archives
        run: |
          python scripts/run_rm001_d010_c0.py \
            --output reports/rm001-d010-c0 \
            --attempts 4 \
            --timeout-seconds 90
      - name: Print compact result
        run: cat reports/rm001-d010-c0/summary.json
      - name: Upload exact C0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rm001-d010-c0-${{ github.run_id }}
          path: reports/rm001-d010-c0
          if-no-files-found: warn
          retention-days: 90
