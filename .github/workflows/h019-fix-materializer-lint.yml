name: H019 repair complete-input materializer lint

on:
  push:
    branches: [research/h019-fundamental-inflection-20260909]
    paths: [.github/workflows/h019-fix-materializer-lint.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h019-fundamental-inflection-20260909
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Apply lint-only corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/h019_complete_input_universe.py')
          text=path.read_text(encoding='utf-8')
          text=text.replace('import argparse\nimport json\n', 'import argparse\nimport io\nimport json\n', 1)
          text=text.replace(
              'from datetime import date, datetime, time as dtime, timedelta\n',
              'from datetime import date, datetime, timedelta\nfrom datetime import time as dtime\n',
              1,
          )
          text=text.replace(', re.I)\n', ', re.IGNORECASE)\n', 1)
          dead='''    try:\n        with zipfile.ZipFile(Path("unused")):\n            pass\n    except (FileNotFoundError, zipfile.BadZipFile):\n        pass\n    import io\n\n'''
          if dead not in text:
              raise SystemExit('expected temporary ZIP probe block not found')
          text=text.replace(dead, '', 1)
          text=text.replace(
              'return datetime.strptime(token, "%d%b%Y").date()\n',
              'return datetime.strptime(token, "%d%b%Y").replace(tzinfo=IST).date()\n',
              1,
          )
          path.write_text(text,encoding='utf-8')
          PY
          ruff check --fix scripts/h019_complete_input_universe.py tests/test_h019_complete_input_universe.py
          ruff format scripts/h019_complete_input_universe.py tests/test_h019_complete_input_universe.py
          ruff check scripts/h019_complete_input_universe.py tests/test_h019_complete_input_universe.py
          pytest -q tests/test_h019_complete_input_universe.py
          git diff --check
      - name: Commit verified mechanical repair
        run: |
          set -euo pipefail
          git config user.name 'marketlab-research-bot'
          git config user.email 'marketlab-research-bot@users.noreply.github.com'
          git add scripts/h019_complete_input_universe.py tests/test_h019_complete_input_universe.py
          git commit -m 'fix: satisfy H019 input materializer lint'
          git push origin HEAD:research/h019-fundamental-inflection-20260909
