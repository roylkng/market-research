name: AE001 ruff import diagnostic

on:
  push:
    branches:
      - feat/ae001-delivery-flow-features-20260927

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ruff
        run: python -m pip install 'ruff==0.16.9'
      - name: Print exact Ruff fix
        run: |
          ruff check --fix scripts/build_ae001_delivery_panel.py || true
          git diff -- scripts/build_ae001_delivery_panel.py
