name: HG005 D002B evidence-bound payoff extraction

on:
  push:
    branches:
      - research/hg005-d002b-execution-20261005

permissions:
  actions: read
  contents: read

jobs:
  extract:
    if: contains(github.event.head_commit.message, '[hg005-d002b]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate implementation
        run: |
          ruff check \
            src/marketlab/hg005_d002b.py \
            scripts/materialize_hg005_d002b_native.py
          pytest -q tests/test_hg005_context.py tests/test_hg005_d002a.py
      - name: Download exact passed D002A corpus
        uses: actions/download-artifact@v4
        with:
          name: hg005-d002a-37308147352
          path: reports/hg005-d002a-source
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37308147352
      - name: Verify exact source corpus
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/hg005-d002a-source/hg005-d002a-corpus.json").read_text())
          assert p["corpus_id"]=="HG005-D002A-v1"
          assert p["corpus_sha256"]=="52405e676c1b76687bb4ea31cc27e1dc18ddc1ffe1d62c4ca5b306098270f135"
          assert p["ready_text_count"]==19
          assert p["promotion_allowed_to_d002b"] is True
          assert p["llm_inference_executed"] is False
          PY
      - name: Materialize native evidence-bound D002B run
        run: |
          python scripts/materialize_hg005_d002b_native.py \
            --corpus reports/hg005-d002a-source/hg005-d002a-corpus.json \
            --output reports/hg005-d002b
      - name: Verify D002B research boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/hg005-d002b/result.json").read_text())
          assert p["run_id"]=="HG005-D002B-GPT56SOL-NATIVE-v1"
          assert p["validated_output_count"]==19
          assert p["manual_audit"]["manual_audit_pass"] is True
          assert p["return_outcomes_opened"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          print(json.dumps({
            "result_sha256":p["result_sha256"],
            "explicit_fact_count":p["explicit_fact_count"],
            "lane_state_counts":p["lane_state_counts"],
            "companies":p["companies"],
          },indent=2,sort_keys=True))
          PY
      - name: Upload exact D002B evidence
        uses: actions/upload-artifact@v4
        with:
          name: hg005-d002b-${{ github.run_id }}
          path: reports/hg005-d002b
          if-no-files-found: error
          retention-days: 90
