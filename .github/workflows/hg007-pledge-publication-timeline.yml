name: HG007 original October4 versus October8 pledge publication timeline

on:
  pull_request:
    paths:
      - src/marketlab/hg007_governance_timeline.py
      - scripts/reconcile_hg007_governance_timeline.py
      - tests/test_hg007_governance_timeline.py
      - .github/workflows/hg007-pledge-publication-timeline.yml
  push:
    branches:
      - main
    paths:
      - src/marketlab/hg007_governance_timeline.py
      - scripts/reconcile_hg007_governance_timeline.py
      - tests/test_hg007_governance_timeline.py
      - .github/workflows/hg007-pledge-publication-timeline.yml

permissions:
  contents: write

concurrency:
  group: hg007-source-chronology-oct04-oct08
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test original source dates, pledge quantity and no sales inference
        run: |
          ruff check src/marketlab/hg007_governance_timeline.py scripts/reconcile_hg007_governance_timeline.py tests/test_hg007_governance_timeline.py
          pytest -q tests/test_hg007_governance_timeline.py
      - name: Materialize no-lookahead original-source review
        run: |
          python scripts/reconcile_hg007_governance_timeline.py \
            --repo-root . \
            --out /tmp/hg007-original-pledge-publication-v1.json
          test -s /tmp/hg007-original-pledge-publication-v1.json
      - name: Append-only original-source timeline after main merge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          TARGET="research/hg007/hg007-p039-inoxgreen-governance-first-seen-timeline-v1.json"
          if [[ -f "$TARGET" ]]; then
            python scripts/reconcile_hg007_governance_timeline.py \
              --out "$TARGET" --verify-existing
            exit 0
          fi
          cp /tmp/hg007-original-pledge-publication-v1.json "$TARGET"
          git config user.name marketlab-research-bot
          git config user.email marketlab-research-bot@users.noreply.github.com
          git add "$TARGET"
          git commit -m "HG007: preserve Oct4 versus Oct8 first-public pledge chronology [skip ci]"
          BASE="$(git rev-parse HEAD^)"
          for RETRY in 1 2 3; do
            git fetch origin main
            UPSTREAM="$(git rev-parse origin/main)"
            if git cat-file -e "origin/main:$TARGET" 2>/dev/null; then
              echo "Original timeline already sealed, no rewrite"
              exit 1
            fi
            if ! git diff --quiet "$BASE" "$UPSTREAM" -- \
              research/hg007/outside-u001-governance-2026-10-04 \
              research/hg007/hg007-p013-28-case-sept29-fd-pledge-overlay-v1.json \
              research/hg007/inoxgreen-post-qip-special/original-receipt-v1.json \
              research/hg007/inoxgreen-post-qip-special/original-promoter-pledge-v1.json \
              src/marketlab/hg007_governance_timeline.py; then
              echo "Source/P039 review changed mid-run"
              exit 1
            fi
            if [[ "$UPSTREAM" != "$BASE" ]]; then
              git rebase origin/main
              BASE="$UPSTREAM"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((RETRY*2))"
          done
          exit 1
      - name: Retain independent source reconciliation packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hg007-oct4-oct8-official-pledge-publication-timeline
          path: /tmp/hg007-original-pledge-publication-v1.json
          if-no-files-found: ignore
          retention-days: 90
