name: L001 P025 Zuari source-pinned Q1 debt and stake falsification

on:
  push:
    branches:
      - research/l001-p025-zuari-debt-stake-falsification-20261021
    paths:
      - .github/workflows/l001-p025-zuari.yml
      - src/marketlab/l001_p025_zuari_falsification.py
      - src/marketlab/l001_p025_zuari_pdf.py
      - scripts/archive_l001_p025_zuari_pdf.py
      - tests/test_l001_p025_zuari_pdf.py
      - scripts/materialize_l001_p025_zuari.py
      - tests/test_l001_p025_zuari.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l001-p025-zuari-original-stake-earnings-research
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed MarketLab test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Recompute original Zuari source-linked debt and stake hurdle
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_l001_p025_zuari.py
          python scripts/materialize_l001_p025_zuari.py --check
          ruff check src/marketlab/l001_p025_zuari_falsification.py src/marketlab/l001_p025_zuari_pdf.py scripts/materialize_l001_p025_zuari.py scripts/archive_l001_p025_zuari_pdf.py tests/test_l001_p025_zuari.py tests/test_l001_p025_zuari_pdf.py
          pytest -q tests/test_l001_p025_zuari.py tests/test_l001_p025_zuari_pdf.py
      - name: Archive exact original August Zuari investor PDF, or preserve blocked receipt
        shell: bash
        run: |
          set -euo pipefail
          python scripts/archive_l001_p025_zuari_pdf.py             --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python scripts/archive_l001_p025_zuari_pdf.py --check
      - name: Commit signed original financial review, not a forecast
        shell: bash
        run: |
          set -euo pipefail
          REPORT="research/l001/l001-p025-zuari-q1-debt-stake-falsification-v1.json"
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add "$REPORT"
          if [ -d research/l001/originals/zuari_q1 ]; then
            git add -f research/l001/originals/zuari_q1
          fi
          if git diff --cached --quiet; then
            echo "P025 source research already recorded"
            exit 0
          fi
          git commit -m "L001 P025: seal Zuari dated debt-versus-stake source hurdle [skip ci]"
          git fetch origin research/l001-p025-zuari-debt-stake-falsification-20261021
          git rebase origin/research/l001-p025-zuari-debt-stake-falsification-20261021
          python scripts/materialize_l001_p025_zuari.py --check
          python scripts/archive_l001_p025_zuari_pdf.py --check
          git push origin HEAD:research/l001-p025-zuari-debt-stake-falsification-20261021
