name: AE001 T009 seal diagnostic amendment P2

on:
  push:
    branches:
      - feat/ae001-t009-stock-options-positioning-20261001

permissions:
  contents: write

jobs:
  seal:
    if: contains(github.event.head_commit.message, '[t009-seal-p2]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Append T009-P2 before retry
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path

          from marketlab.alpha_trials import (
              append_trial_event,
              require_protocol_amendment,
              require_unopened_registered_trial,
              trial_state,
              validate_trial_ledger,
          )

          path = Path("research/ae001/trial-ledger.json")
          ledger = json.loads(path.read_text(encoding="utf-8"))
          validate_trial_ledger(ledger)
          require_unopened_registered_trial(
              ledger,
              trial_id="AE001-T009",
              required_status="FROZEN_BEFORE_OUTCOME_MATERIALIZATION",
          )
          require_protocol_amendment(
              ledger,
              trial_id="AE001-T009",
              protocol_id="AE001-T009-P1",
          )
          state = trial_state(ledger, "AE001-T009")
          if state["result_count"] != 0:
              raise SystemExit("T009 already has a result event")
          if any(
              event["payload"].get("protocol_id") == "AE001-T009-P2"
              for event in state["amendments"]
          ):
              raise SystemExit("T009-P2 already exists")

          payload = {
              "protocol_id": "AE001-T009-P2",
              "reason": (
                  "Freeze non-blocking handling for undefined auxiliary "
                  "single-feature training rank IC after failed run "
                  "36824004775 and before any retry."
              ),
              "failed_outcome_run_id": 36824004775,
              "failed_run_report_emitted": False,
              "failed_run_result_event_recorded": False,
              "failure_feature": "opt_front_log1p_days_to_expiry",
              "failure_class": "AUXILIARY_SINGLE_FEATURE_DIAGNOSTIC_UNDEFINED",
              "repair_scope": "SIGNED_SINGLE_FEATURE_DIAGNOSTICS_ONLY",
              "unlearnable_feature_status": "UNAVAILABLE_TRAINING_RANK_IC",
              "unlearnable_feature_direction": None,
              "unlearnable_feature_oos_prediction_emitted": False,
              "unlearnable_feature_eligible_for_best_single_selection": False,
              "all_unlearnable_fold_policy": "FAIL_CLOSED",
              "multivariate_ridge_feature_retained": True,
              "base_37_features_changed": False,
              "augmented_47_features_changed": False,
              "folds_changed": False,
              "labels_changed": False,
              "ridge_l2_changed": False,
              "primary_success_criteria_changed": False,
              "p1_source_hashes_changed": False,
              "prospective_claim_allowed": False,
              "live_capital_allowed": False,
          }

          updated = append_trial_event(
              ledger,
              event_type="TRIAL_PROTOCOL_AMENDED",
              trial_id="AE001-T009",
              recorded_at_utc=datetime.now(UTC).isoformat(),
              payload=payload,
          )
          path.write_text(
              json.dumps(
                  updated,
                  indent=2,
                  sort_keys=True,
                  ensure_ascii=False,
                  allow_nan=False,
              )
              + "\n",
              encoding="utf-8",
          )
          print("P2_EVENT_SHA", updated["events"][-1]["event_sha256"])
          print("LEDGER_SHA", updated["ledger_sha256"])
          PY

      - name: Commit P2 ledger
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/ae001/trial-ledger.json
          git commit -m "research: seal T009 diagnostic amendment P2 [skip ci]"
          git push origin HEAD:feat/ae001-t009-stock-options-positioning-20261001
