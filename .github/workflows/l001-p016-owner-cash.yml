name: L001 P016 full-100 owner cash source falsification

on:
  push:
    branches:
      - research/l001-p016-owner-cash-source-falsification-20261019
    paths:
      - .github/workflows/l001-p016-owner-cash.yml
      - src/marketlab/l001_p016_owner_cash_gate.py
      - scripts/materialize_l001_p016_owner_cash.py
      - tests/test_l001_p016_owner_cash.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l001-p016-100-source-owner-cash
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact MarketLab dependency set
        run: python -m pip install -e '.[dev]'

      - name: Materialize source signed original hundred and adversarial checks
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_l001_p016_owner_cash.py
          ruff check src/marketlab/l001_p016_owner_cash_gate.py scripts/materialize_l001_p016_owner_cash.py tests/test_l001_p016_owner_cash.py
          pytest -q tests/test_l001_p016_owner_cash.py
          python scripts/materialize_l001_p016_owner_cash.py --check

      - name: Preserve immutable October 19 source-falsification result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/l001/l001-p016-owner-cash-evidence-gates-100-v1.json
          if git diff --cached --quiet; then
            echo "No changes to signed owner-cash report"
            exit 0
          fi
          git commit -m "L001 P016: seal source-only hundred owner-cash admission gaps [skip ci]"
          git fetch origin research/l001-p016-owner-cash-source-falsification-20261019
          git rebase origin/research/l001-p016-owner-cash-source-falsification-20261019
          python scripts/materialize_l001_p016_owner_cash.py --check
          git push origin HEAD:research/l001-p016-owner-cash-source-falsification-20261019
