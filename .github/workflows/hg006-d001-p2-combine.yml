name: HG006 D001 P4 combine existing source shards

on:
  push:
    branches:
      - research/hg006-historical-event-base-rates-20261005

permissions:
  actions: read
  contents: read

jobs:
  combine:
    if: contains(github.event.head_commit.message, '[hg006-d001-p4-combine]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate P4 historical duplicate normalization
        run: |
          ruff check \
            src/marketlab/hg006_historical_events.py \
            scripts/combine_hg006_d001_shards.py \
            tests/test_hg006_historical_events.py
          pytest -q \
            tests/test_hg006_historical_events.py \
            tests/test_alpha_announcements.py
      - name: Download exact four successful source shards from run 37340989709
        uses: actions/download-artifact@v4
        with:
          pattern: hg006-d001-shard-*-37340989709
          path: reports/hg006-shards
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37340989709
      - name: Combine frozen shards under P4 source normalization
        run: |
          python scripts/combine_hg006_d001_shards.py \
            --shards-root reports/hg006-shards \
            --output reports/hg006-d001
      - name: Prove source-only P4 census
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/hg006-d001/hg006-d001-census.json").read_text())
          assert p["census_id"]=="HG006-D001-v1"
          assert p["calendar_day_semantics"]=="NSE_ASIA_KOLKATA"
          assert p["historical_timestamp_authority"]=="an_dt"
          assert p["historical_duplicate_policy"]=="COLLAPSE_EXACT_CANONICAL_WITHIN_DAY"
          assert p["source_semantics_amendment"]=="HG006-D001-P4-v1"
          assert p["acquisition_topology"]=="P1_FOUR_PARALLEL_CALENDAR_SHARDS"
          assert len(p["acquisition_shards"])==4
          assert p["completion_probabilities_assigned"] is False
          assert p["expected_returns_calculated"] is False
          assert p["return_outcomes_opened"] is False
          assert p["model_fitted"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          print(json.dumps({
            "census_sha256":p["census_sha256"],
            "source_row_count":p["source_row_count"],
            "retained_event_count":p["retained_event_count"],
            "retained_symbol_count":p["retained_symbol_count"],
            "historical_chronology_count":p["historical_chronology_count"],
            "historical_chronology_counts_by_family":p["historical_chronology_counts_by_family"],
            "historical_attachment_ready_chronology_ratio":p["historical_attachment_ready_chronology_ratio"],
            "threshold_passes":p["threshold_passes"],
            "feasibility_pass":p["feasibility_pass"],
          },indent=2,sort_keys=True))
          PY
      - name: Upload corrected combined census
        uses: actions/upload-artifact@v4
        with:
          name: hg006-d001-p4-${{ github.run_id }}
          path: reports/hg006-d001
          if-no-files-found: error
          retention-days: 90
