name: H004 NSE API probe

on:
  push:
    branches:
      - research/h004-pre-momentum-v1-20260908
    paths:
      - .github/workflows/h004-nse-api-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Probe dated legacy result discovery
        run: |
          python - <<'PY'
          import json
          from marketlab.nse import NSEClient, NSEEndpoint

          client = NSEClient(timeout=20, attempts=4)
          endpoint = NSEEndpoint('legacy_financials', 'https://www.nseindia.com/api/corporates-financial-results')
          variants = [
              {'index':'equities','period':'Quarterly','from_date':'01-07-2024','to_date':'31-08-2024'},
              {'index':'equities','period':'Quarterly','from_date':'01-10-2024','to_date':'30-11-2024'},
              {'index':'equities','period':'Quarterly','from_date':'01-01-2025','to_date':'28-02-2025'},
          ]
          for params in variants:
              payload, _ = client._json_get_with_raw(endpoint, params=params)
              print('PARAMS', params)
              print('TYPE', type(payload).__name__, 'COUNT', len(payload) if isinstance(payload, list) else None)
              if isinstance(payload, list):
                  print(json.dumps(payload[:5], indent=2)[:20000])
          PY
