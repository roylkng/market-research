name: Temporary v2 September 24 dry run

on:
  push:
    branches: [probe/v2-dry-run-20260924]

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify v2 implementation
        run: |
          ruff check src/marketlab/intelligence_*.py scripts/run_company_news_discovery.py scripts/run_daily_market_audit.py scripts/seal_company_news_capture.py scripts/verify_company_news_ledger.py
          pytest -q tests/test_intelligence_identity.py tests/test_intelligence_news.py tests/test_intelligence_nse_feed.py tests/test_intelligence_prospective_news.py tests/test_intelligence_market_audit.py tests/test_intelligence_market_audit_context.py
      - name: Prepare September 23 identity snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/v2-dry-run/logs
          python - <<'PY'
          from datetime import date
          from pathlib import Path
          import hashlib, json, sys
          sys.path.insert(0, "scripts")
          from run_daily_market_audit import download_udiff
          raw = download_udiff(date(2026, 9, 23), attempts=4, timeout_seconds=45)
          Path("reports/v2-dry-run/identity-udiff.zip").write_bytes(raw)
          Path("reports/v2-dry-run/identity.json").write_text(json.dumps({
              "session":"2026-09-23",
              "sha256":hashlib.sha256(raw).hexdigest()
          }, sort_keys=True)+"\n")
          PY
      - name: Capture current bounded discovery snapshot
        shell: bash
        run: |
          set +e
          python scripts/run_company_news_discovery.py \
            --store reports/v2-dry-run/store \
            --output reports/v2-dry-run/discovery \
            --identity-udiff reports/v2-dry-run/identity-udiff.zip \
            --identity-session 2026-09-23 \
            --collect | tee reports/v2-dry-run/logs/discovery.log
          RC=${PIPESTATUS[0]}
          echo "discovery_rc=$RC" | tee reports/v2-dry-run/logs/discovery.rc
          set -e
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 2 ]; then exit "$RC"; fi
      - name: Seal retrospective first-seen metadata
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(python -c 'import json; print(json.load(open("reports/v2-dry-run/identity.json"))["sha256"])')"
          python scripts/seal_company_news_capture.py \
            --store reports/v2-dry-run/store \
            --ledger reports/v2-dry-run/news-ledger.json \
            --identity-session 2026-09-23 \
            --identity-raw-sha256 "$SHA" | tee reports/v2-dry-run/logs/seal.log
          python scripts/verify_company_news_ledger.py --ledger reports/v2-dry-run/news-ledger.json
      - name: Retrospective linkage audit for September 24
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_daily_market_audit.py \
            --session 2026-09-24 \
            --store reports/v2-dry-run/store \
            --output reports/v2-dry-run/retrospective-audit \
            --liquidity-floor-inr 20000000 \
            --move-threshold-pct 5 \
            --top-abs-movers 25 | tee reports/v2-dry-run/logs/retrospective-audit.log
      - name: Prospective-integrity replay for September 24
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_daily_market_audit.py \
            --session 2026-09-24 \
            --store reports/v2-dry-run/prospective-store \
            --output reports/v2-dry-run/prospective-audit \
            --news-ledger reports/v2-dry-run/news-ledger.json \
            --liquidity-floor-inr 20000000 \
            --move-threshold-pct 5 \
            --top-abs-movers 25 | tee reports/v2-dry-run/logs/prospective-audit.log
      - name: Preserve source commit
        run: |
          git rev-parse HEAD > reports/v2-dry-run/source-commit.txt
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-dry-run-2026-09-24-${{ github.run_id }}
          path: reports/v2-dry-run
          retention-days: 30
          if-no-files-found: error
