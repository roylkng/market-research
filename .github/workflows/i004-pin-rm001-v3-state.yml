name: I004 pin sealed RM001-v3 P001 state

on:
  push:
    branches:
      - feat/po001-i004-rm001-v3-risk-20261002

permissions:
  contents: write
  actions: read

jobs:
  pin:
    if: contains(github.event.head_commit.message, '[i004-pin-rm001-v3]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download sealed RM001-v3 P001 evidence
        uses: actions/download-artifact@v4
        with:
          name: rm001-v3-p001-36958406605
          path: evidence/rm001-v3-p001
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: roylkng/market-research
          run-id: 36958406605

      - name: Locate and pin exact RM001-v3 state
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip
          import hashlib
          import json
          from pathlib import Path

          expected = (
              "32002ec101531c0e28fb551058c79f179fca53aafccf3c36ef07cb0159387441"
          )
          candidates = []
          for path in Path("evidence/rm001-v3-p001").rglob("risk-state.json.gz"):
              try:
                  payload = json.loads(gzip.decompress(path.read_bytes()).decode("utf-8"))
              except Exception:
                  continue
              if (
                  payload.get("model_id") == "RM001-v3-DEVELOPMENT"
                  and payload.get("state_sha256") == expected
              ):
                  candidates.append((path, payload))

          if len(candidates) != 1:
              raise SystemExit(
                  f"expected exactly one sealed RM001-v3 state, got {[str(p) for p, _ in candidates]}"
              )

          source, payload = candidates[0]
          raw = source.read_bytes()
          destination = Path(
              "research/po001-i004/inputs/rm001-v3-p001-risk-state.json.gz"
          )
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_bytes(raw)

          manifest = {
              "schema_version": 1,
              "artifact_id": "PO001-I004-PINNED-RM001-V3-P001-v1",
              "source_workflow_run_id": 36958406605,
              "source_workflow_artifact_id": 11207466879,
              "source_workflow_artifact_name": "rm001-v3-p001-36958406605",
              "source_path": str(source.relative_to(Path("evidence/rm001-v3-p001"))),
              "pinned_path": str(destination),
              "gzip_file_sha256": hashlib.sha256(raw).hexdigest(),
              "internal_rm001_v3_state_sha256": expected,
              "model_id": payload["model_id"],
              "as_of_session": payload["as_of_session"],
              "security_count": payload["security_count"],
              "factor_names": payload["factor_names"],
              "parent_v2_risk_state_sha256": payload[
                  "parent_v2_risk_state_sha256"
              ],
              "parent_v2_factor_history_sha256": payload[
                  "parent_v2_factor_history_sha256"
              ],
              "live_capital_allowed": False,
          }
          manifest_path = Path(
              "research/po001-i004/inputs/"
              "rm001-v3-p001-risk-state-manifest.json"
          )
          manifest_path.write_text(
              json.dumps(
                  manifest,
                  indent=2,
                  sort_keys=True,
                  ensure_ascii=False,
                  allow_nan=False,
              )
              + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, sort_keys=True))
          PY

      - name: Commit pinned state to branch
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/po001-i004/inputs
          git commit -m "research: pin exact RM001-v3 P001 state [skip ci]"
          git push origin HEAD:feat/po001-i004-rm001-v3-risk-20261002
