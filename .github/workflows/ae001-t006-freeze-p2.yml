name: AE001 T006 freeze outcome cohort P2

on:
  push:
    branches:
      - feat/ae001-t006-prospective-futures-20260930

permissions:
  contents: write

jobs:
  freeze:
    if: contains(github.event.head_commit.message, '[t006-freeze-p2]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Append T006 P2
        run: |
          python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path
          from marketlab.alpha_trials import (
              append_trial_event,
              require_protocol_amendment,
              trial_state,
              validate_trial_ledger,
          )

          path=Path("research/ae001/trial-ledger.json")
          ledger=json.loads(path.read_text(encoding="utf-8"))
          validate_trial_ledger(ledger)
          require_protocol_amendment(
              ledger,
              trial_id="AE001-T006",
              protocol_id="AE001-T006-P1",
          )
          state=trial_state(ledger,"AE001-T006")
          if any(
              event["payload"].get("protocol_id")=="AE001-T006-P2"
              for event in state["amendments"]
          ):
              raise SystemExit("AE001-T006-P2 already exists")

          payload={
              "protocol_id":"AE001-T006-P2",
              "primary_horizon_sessions":5,
              "minimum_decision_sessions":60,
              "minimum_valid_paired_ic_sessions":50,
              "cohort_rule":"SMALLEST_CHRONOLOGICAL_CANONICAL_PREFIX",
              "all_primary_outcomes_in_prefix_must_be_mature":True,
              "primary_newey_west_lag":4,
              "success_requires_both_rank_ic_and_spread":True,
              "secondary_horizon_sessions":1,
              "secondary_uses_exact_primary_cohort":True,
              "secondary_newey_west_lag":5,
              "secondary_rescues_failed_primary":False,
              "parameter_change_after_first_eligible_decision":"PROHIBITED",
              "live_capital_allowed":False,
          }
          ledger=append_trial_event(
              ledger,
              event_type="TRIAL_PROTOCOL_AMENDED",
              trial_id="AE001-T006",
              recorded_at_utc=datetime.now(UTC).isoformat(),
              payload=payload,
          )
          validate_trial_ledger(ledger)
          path.write_text(
              json.dumps(
                  ledger,
                  indent=2,
                  sort_keys=True,
                  ensure_ascii=False,
                  allow_nan=False,
              )+"\n",
              encoding="utf-8",
          )
          print("T006_P2_EVENT_SHA",ledger["events"][-1]["event_sha256"])
          print("T006_LEDGER_SHA",ledger["ledger_sha256"])
          PY

      - name: Commit T006 P2
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/ae001/trial-ledger.json
          git commit -m "research: freeze AE001 T006 outcome cohort P2 [skip ci]"
          git push origin HEAD:feat/ae001-t006-prospective-futures-20260930
