name: H022 D005 one-shot within-company diagnostic

on:
  push:
    branches:
      - research/h022-within-company-diagnostic-v1-20260914

permissions:
  contents: write

jobs:
  run-diagnostic:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h022-within-company-diagnostic-v1-20260914
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run frozen H022-D005
        run: |
          python scripts/run_h022_within_company_diagnostic.py \
            --d004-panel research/historical/h022/dependence-diagnostic-v1/diagnostic-panel.json \
            --out research/historical/h022/within-company-diagnostic-v1/diagnostic-summary.json
      - name: Anchor result and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/h022-within-company-diagnostic-once.yml
          git add research/historical/h022/within-company-diagnostic-v1/diagnostic-summary.json
          git commit -m 'H022: anchor frozen D005 within-company result'
          git push origin HEAD:research/h022-within-company-diagnostic-v1-20260914
