name: AE001 T004 P2 protocol sealer

on:
  push:
    branches:
      - feat/ae001-t004-prospective-outcomes-20260929

permissions:
  contents: write

jobs:
  seal:
    if: contains(github.event.head_commit.message, '[ae001-t004-p2-seal]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Append canonical T004-P2 event
        shell: bash
        run: |
          set -euo pipefail
          RECORDED_AT="$(python - <<'PY'
          from datetime import UTC, datetime
          print(datetime.now(UTC).isoformat())
          PY
          )"
          python scripts/append_ae001_trial_event.py \
            --ledger research/ae001/trial-ledger.json \
            --event-type TRIAL_PROTOCOL_AMENDED \
            --trial-id AE001-T004 \
            --recorded-at-utc "$RECORDED_AT" \
            --payload research/ae001/t004-p2-payload.json
      - name: Anchor T004-P2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/ae001/trial-ledger.json
          git commit -m "research: seal AE001 T004-P2 outcome cohort rule [skip ci]"
          git push origin HEAD:feat/ae001-t004-prospective-outcomes-20260929
