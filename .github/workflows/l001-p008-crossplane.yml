name: L001 P008 original cross-plane false-positive audit

on:
  pull_request:
    paths:
      - src/marketlab/l001_p008_crossplane.py
      - scripts/materialize_l001_p008_crossplane.py
      - tests/test_l001_p008_crossplane.py
      - .github/workflows/l001-p008-crossplane.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source-only contracts
        run: |
          python -m pip install -e '.[dev]'
          ruff check src/marketlab/l001_p008_crossplane.py scripts/materialize_l001_p008_crossplane.py tests/test_l001_p008_crossplane.py
          pytest -q tests/test_l001_p008_crossplane.py
      - name: Recover exact pinned source report artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/l001-p008"
          for ID in 12111414537 12112413274 12112643045 12112967877; do
            curl --fail --location --silent --show-error --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" \
              -o "$RUNNER_TEMP/l001-p008/github-actions-artifact-$ID.zip"
            unzip -tq "$RUNNER_TEMP/l001-p008/github-actions-artifact-$ID.zip" >/dev/null
          done
      - name: Replay all 100 source-sealed cohort rows
        run: |
          python scripts/materialize_l001_p008_crossplane.py \
            --artifact-dir "$RUNNER_TEMP/l001-p008" \
            --output "$RUNNER_TEMP/l001-p008-crossplane-100.json" \
            | tee "$RUNNER_TEMP/l001-p008-summary.json"
      - name: Preserve source-only audit without market predictions
        uses: actions/upload-artifact@v4
        with:
          name: l001-p008-original-crossplane-review
          path: |
            ${{ runner.temp }}/l001-p008-crossplane-100.json
            ${{ runner.temp }}/l001-p008-summary.json
          retention-days: 90
