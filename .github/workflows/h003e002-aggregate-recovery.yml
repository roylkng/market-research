name: H003-E002 aggregate completed shard artifacts

on:
  push:
    branches:
      - run/h003-e002-sharded-20260907
    paths:
      - .github/workflows/h003e002-aggregate-recovery.yml

permissions:
  contents: write

env:
  SOURCE_RUN_ID: '34056101474'
  SOURCE_BUNDLE: research/prospective/h003/FY27-Q2-2026-09-06/source-coverage-v1.json
  RULE: registry/h003_extraction_rule.yaml
  OUT: run-out/h003-e002-aggregate-recovery
  ANCHOR: research/prospective/h003/FY27-Q2-2026-09-06/candidates-e002-full-sharded

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/h003-e002-sharded-20260907
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: make validate
      - name: Download the eight already-completed shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: h003-e002-shard-*
          path: shard-downloads
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Merge verified shard stores from artifact roots
        run: |
          mkdir -p "$OUT/store/records" "$OUT/store/raw/sha256" "$OUT/store/text/sha256"
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          destination = Path('run-out/h003-e002-aggregate-recovery/store')
          artifacts = sorted(Path('shard-downloads').glob('h003-e002-shard-*'))
          if len(artifacts) != 8:
              raise SystemExit(f'expected 8 shard artifact directories, found {len(artifacts)}')
          seen_records = set()
          shard_summaries = []
          for artifact in artifacts:
              store = artifact / 'store'
              summary_path = artifact / 'summary.json'
              if not store.is_dir() or not summary_path.is_file():
                  raise SystemExit(
                      f'unexpected shard artifact layout: {artifact}; '
                      f'store={store.exists()}, summary={summary_path.exists()}'
                  )
              summary = json.loads(summary_path.read_text(encoding='utf-8'))
              shard = summary.get('shard_index')
              expected = len(range(int(shard), 794, 8))
              if (
                  summary.get('shard_count') != 8
                  or summary.get('selected_source_count') != expected
                  or summary.get('processed_source_count') != expected
                  or summary.get('source_status_counts') != {'TEXT_READY': expected}
              ):
                  raise SystemExit(f'invalid shard summary for shard={shard}: {summary}')
              shard_summaries.append(summary)
              for record in sorted((store / 'records').glob('*.json')):
                  if record.name in seen_records:
                      raise SystemExit(f'duplicate source checkpoint across shards: {record.name}')
                  seen_records.add(record.name)
                  shutil.copy2(record, destination / 'records' / record.name)
              for category, suffix in (('raw/sha256', '.pdf'), ('text/sha256', '.txt')):
                  source_dir = store / category
                  target_dir = destination / category
                  if not source_dir.exists():
                      continue
                  for source in source_dir.glob(f'*{suffix}'):
                      target = target_dir / source.name
                      if target.exists():
                          if target.read_bytes() != source.read_bytes():
                              raise SystemExit(f'content-addressed collision: {source.name}')
                      else:
                          shutil.copy2(source, target)
          if sorted(summary['shard_index'] for summary in shard_summaries) != list(range(8)):
              raise SystemExit('shard summaries do not cover indices 0..7 exactly once')
          if sum(summary['processed_source_count'] for summary in shard_summaries) != 794:
              raise SystemExit('shard source counts do not sum to 794')
          if len(seen_records) != 794:
              raise SystemExit(f'expected 794 unique source checkpoints, found {len(seen_records)}')
          print(f'merged 8 shards; unique source checkpoints={len(seen_records)}')
          PY
      - name: Reconstruct canonical E002 report entirely from checkpoints
        run: |
          python scripts/build_h003_candidates.py \
            --source-bundle "$SOURCE_BUNDLE" \
            --rule "$RULE" \
            --store "$OUT/store" \
            --report-out "$OUT/report.json" \
            --summary-out "$OUT/summary.json" \
            --fetch-attempts 1 \
            --sleep-seconds 0
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = json.loads((Path(os.environ['OUT']) / 'summary.json').read_text())
          required = {
              'processed_source_count': 794,
              'processed_company_count': 97,
              'resumed_source_count': 794,
              'source_status_counts': {'TEXT_READY': 794},
              'complete': True,
              'freeze_blockers': [],
          }
          for key, value in required.items():
              if summary.get(key) != value:
                  raise SystemExit(f'{key}: expected={value!r}, observed={summary.get(key)!r}')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - name: Anchor canonical full corpus and recovery provenance
        run: |
          mkdir -p "$ANCHOR"
          cp "$OUT/report.json" "$ANCHOR/report.json"
          cp "$OUT/summary.json" "$ANCHOR/summary.json"
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          out = Path(os.environ['OUT'])
          anchor = Path(os.environ['ANCHOR'])
          summary = json.loads((out / 'summary.json').read_text())
          metadata = {
              'schema_version': 2,
              'cohort_id': 'FY27-Q2-2026-09-06',
              'rule_id': 'H003-E002',
              'rule_sha256': '5aff200d6a2222a7cde972ad341bc43b927d9c5b6d26a58766893980515c24a2',
              'source_bundle_sha256': '583af88b3c070e15fe94a7782962c9e1fb1ce167e1412a08fd5c7b2f2dcaf7ee',
              'shard_source_run_id': os.environ['SOURCE_RUN_ID'],
              'shard_count': 8,
              'source_commit_sha': os.environ['GITHUB_SHA'],
              'aggregation_workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'aggregation_workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'workflow_ref': os.environ['GITHUB_WORKFLOW_REF'],
              'anchored_at_utc': datetime.now(UTC).isoformat().replace('+00:00', 'Z'),
              'processed_source_count': summary['processed_source_count'],
              'processed_company_count': summary['processed_company_count'],
              'resumed_source_count': summary['resumed_source_count'],
              'source_status_counts': summary['source_status_counts'],
              'candidate_count': summary['candidate_count'],
              'companies_with_candidates': summary['companies_with_candidates'],
              'complete': summary['complete'],
              'freeze_blockers': summary['freeze_blockers'],
              'report_sha256': summary['report_sha256'],
              'report_file_sha256': hashlib.sha256((out / 'report.json').read_bytes()).hexdigest(),
              'summary_file_sha256': hashlib.sha256((out / 'summary.json').read_bytes()).hexdigest(),
          }
          (anchor / 'run-metadata.json').write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(metadata, indent=2, sort_keys=True))
          PY
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git rm .github/workflows/h003e002-aggregate-recovery.yml
          git add "$ANCHOR"
          git commit -m "Anchor complete recovered sharded H003-E002 candidate corpus"
          git push origin HEAD:run/h003-e002-sharded-20260907
      - name: Preserve complete raw/text/candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: h003-e002-complete-recovered-${{ github.run_id }}
          path: run-out/h003-e002-aggregate-recovery
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
