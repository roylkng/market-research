name: PO001 I003 stock-specific impact snapshot

on:
  push:
    branches:
      - feat/po001-v2-stock-impact-20260929

permissions:
  contents: read

jobs:
  pilot:
    if: contains(github.event.head_commit.message, '[po001-i003]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify I003 implementation before source access
        run: |
          ruff check \
            src/marketlab/po001_v2.py \
            src/marketlab/po001_i003.py \
            scripts/run_po001_i003.py \
            tests/test_po001_v2.py \
            tests/test_po001_i003.py
          pytest -q \
            tests/test_po001.py \
            tests/test_po001_v2.py \
            tests/test_po001_i002.py \
            tests/test_po001_i003.py \
            tests/test_rm001.py \
            tests/test_rm001_historical_state.py

      - name: Rebuild official NSE market panel through 31 Aug only
        run: |
          python scripts/build_ae001_historical_panel.py \
            --start-date 2025-09-01 \
            --end-date 2026-08-31 \
            --store .marketlab/po001-i003 \
            --output reports/po001-i003/panel \
            --attempts 4 \
            --timeout-seconds 30 \
            --pause-seconds 0.05

      - name: Rebuild corporate-action-safe base features
        run: |
          python scripts/build_ae001_action_safe_panel.py \
            --market-panel reports/po001-i003/panel/market-panel.json.gz \
            --feature-panel reports/po001-i003/panel/feature-panel.json.gz \
            --start-date 2025-09-01 \
            --end-date 2026-08-31 \
            --raw-dir reports/po001-i003/corporate-actions/raw \
            --output reports/po001-i003/action-safe \
            --chunk-days 31 \
            --attempts 4 \
            --timeout-seconds 30

      - name: Build reusable delivery features through 31 Aug only
        run: |
          python scripts/build_ae001_delivery_features.py \
            --market-panel reports/po001-i003/panel/market-panel.json.gz \
            --feature-panel reports/po001-i003/action-safe/action-safe-feature-panel.json.gz \
            --store .marketlab/po001-i003 \
            --output reports/po001-i003/delivery \
            --attempts 4 \
            --timeout-seconds 30

      - name: Build RM001 risk state as of 31 Aug
        run: |
          python scripts/build_rm001_historical_state.py \
            --market-panel reports/po001-i003/panel/market-panel.json.gz \
            --feature-panel reports/po001-i003/action-safe/action-safe-feature-panel.json.gz \
            --action-ledger reports/po001-i003/action-safe/corporate-action-ledger.json.gz \
            --as-of-session 2026-08-31 \
            --output reports/po001-i003/risk

      - name: Run frozen I003 stock-impact study
        run: |
          python scripts/run_po001_i003.py \
            --market-panel reports/po001-i003/panel/market-panel.json.gz \
            --feature-panel reports/po001-i003/delivery/delivery-feature-panel.json.gz \
            --action-ledger reports/po001-i003/action-safe/corporate-action-ledger.json.gz \
            --risk-state research/po001-i003/inputs/i002-risk-state-legacy.json.gz \
            --risk-state-manifest research/po001-i003/inputs/i002-risk-state-legacy-manifest.json \
            --canonical-risk-state reports/po001-i003/risk/risk-state.json.gz \
            --alpha-model research/po001-i003/inputs/i002-alpha-model-v1.json \
            --alpha-model-manifest research/po001-i003/inputs/i002-alpha-model-v1-manifest.json \
            --control-artifact research/po001-i003/inputs/i002-integrated-control-v1.json.gz \
            --control-manifest research/po001-i003/inputs/i002-integrated-control-v1-manifest.json \
            --output reports/po001-i003/study

      - name: Print compact result
        run: cat reports/po001-i003/study/summary.json

      - name: Upload exact I003 development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: po001-i003-${{ github.run_id }}
          path: |
            reports/po001-i003
            .marketlab/po001-i003/market-data
          if-no-files-found: warn
          retention-days: 90
