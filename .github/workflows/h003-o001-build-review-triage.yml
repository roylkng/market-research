name: H003-O001 build conservative blind review triage

on:
  push:
    branches:
      - research/h003-v001-outcome-protocol-20260908
    paths:
      - .github/workflows/h003-o001-build-review-triage.yml

permissions:
  contents: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h003-v001-outcome-protocol-20260908
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Verify repository before triage
        run: |
          ruff check src scripts tests
          pytest -q
      - name: Build only fail-safe UNRESOLVED triage
        run: |
          python - <<'PY'
          import json
          import re
          from collections import Counter, defaultdict
          from datetime import date
          from pathlib import Path

          root = Path('research/prospective/h003/FY27-Q2-2026-09-06/outcomes-o001')
          batches = root / 'review-batches'
          cutoff = date(2026, 9, 6)
          fy_pattern = re.compile(r"^FY\s*'?([0-9]{2,4})(?:\s*-\s*FY?\s*'?([0-9]{2,4}))?$", re.I)

          def fiscal_end(source: date) -> date:
              return date(source.year if source.month <= 3 else source.year + 1, 3, 31)

          def normalize_year(token: str) -> int:
              value = int(token)
              return 2000 + value if value < 100 else value

          rows = []
          counts = Counter()
          by_batch = defaultdict(Counter)
          for batch_number in range(4, 45):
              path = batches / f'batch-{batch_number:04d}.json'
              batch = json.loads(path.read_text(encoding='utf-8'))
              for packet in batch['packets']:
                  reason = None
                  source = date.fromisoformat(packet['source_date'])
                  evidence = packet.get('evidence')
                  if not isinstance(evidence, list):
                      raise SystemExit(f"invalid evidence list: {packet['packet_id']}")
                  if not evidence:
                      reason = 'EMPTY_EVIDENCE_NO_NEGATIVE_INFERENCE'
                  deadline = packet.get('target_deadline')
                  if reason is None and deadline:
                      target = date.fromisoformat(str(deadline))
                      if target > cutoff:
                          reason = 'EXPLICIT_DEADLINE_AFTER_SOURCE_CUTOFF'
                  horizon = str(packet.get('target_horizon') or '').strip()
                  if reason is None and horizon:
                      match = fy_pattern.fullmatch(horizon)
                      if match:
                          end_year = normalize_year(match.group(2) or match.group(1))
                          if date(end_year, 3, 31) > cutoff:
                              reason = 'EXPLICIT_FISCAL_HORIZON_AFTER_SOURCE_CUTOFF'
                      elif horizon.casefold() in {'this fiscal year', 'current fiscal year'}:
                          if fiscal_end(source) > cutoff:
                              reason = 'CURRENT_FISCAL_HORIZON_AFTER_SOURCE_CUTOFF'
                      elif horizon.casefold() in {'next fiscal year', 'next fiscal'}:
                          current_end = fiscal_end(source)
                          next_end = date(current_end.year + 1, 3, 31)
                          if next_end > cutoff:
                              reason = 'NEXT_FISCAL_HORIZON_AFTER_SOURCE_CUTOFF'

                  disposition = 'SAFE_UNRESOLVED' if reason else 'MANUAL_SEMANTIC_REVIEW'
                  row = {
                      'batch_number': batch_number,
                      'packet_id': packet['packet_id'],
                      'blind_payload_sha256': packet['payload_sha256'],
                      'disposition': disposition,
                      'reason': reason,
                  }
                  rows.append(row)
                  counts[disposition] += 1
                  by_batch[batch_number][disposition] += 1

          expected = 869 - 60
          if len(rows) != expected:
              raise SystemExit(f'triage coverage mismatch: {len(rows)} expected {expected}')
          if len({row['packet_id'] for row in rows}) != len(rows):
              raise SystemExit('duplicate packet id in triage')
          document = {
              'schema_version': 1,
              'outcome_rule_id': 'H003-O001',
              'outcome_rule_sha256': '36cd0dab185a8f73bc3233cf16bc1685dc9ae9e25c27eb35b305343b1ea028b1',
              'source_blind_package_sha256': 'a21efa55f8d72f3d2ac6ceef56d57b9897232f25f2e4c8f13d6449481ad77cfb',
              'source_cutoff_date': cutoff.isoformat(),
              'covered_batches': [4, 44],
              'packet_count': len(rows),
              'counts': dict(sorted(counts.items())),
              'batch_counts': {
                  str(number): dict(sorted(values.items()))
                  for number, values in sorted(by_batch.items())
              },
              'safe_unresolved_reasons': [
                  'EMPTY_EVIDENCE_NO_NEGATIVE_INFERENCE',
                  'EXPLICIT_DEADLINE_AFTER_SOURCE_CUTOFF',
                  'EXPLICIT_FISCAL_HORIZON_AFTER_SOURCE_CUTOFF',
                  'CURRENT_FISCAL_HORIZON_AFTER_SOURCE_CUTOFF',
                  'NEXT_FISCAL_HORIZON_AFTER_SOURCE_CUTOFF',
              ],
              'semantic_outcomes_assigned': False,
              'private_binding_accessed': False,
              'market_outcomes_accessed': False,
              'live_capital_allowed': False,
              'rows': rows,
          }
          out = root / 'review-triage-v1.json'
          out.write_text(json.dumps(document, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({
              'packet_count': len(rows),
              'counts': document['counts'],
              'batch_counts': document['batch_counts'],
          }, indent=2, sort_keys=True))
          PY
      - name: Verify triage cannot resolve any outcome
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('research/prospective/h003/FY27-Q2-2026-09-06/outcomes-o001/review-triage-v1.json')
          document = json.loads(path.read_text())
          assert document['packet_count'] == 809
          assert document['semantic_outcomes_assigned'] is False
          assert document['private_binding_accessed'] is False
          assert document['market_outcomes_accessed'] is False
          assert document['live_capital_allowed'] is False
          assert all(row['disposition'] in {'SAFE_UNRESOLVED', 'MANUAL_SEMANTIC_REVIEW'} for row in document['rows'])
          assert all(row.get('reason') is not None for row in document['rows'] if row['disposition'] == 'SAFE_UNRESOLVED')
          print('H003 conservative review triage valid')
          PY
      - name: Commit only public blind triage report
        run: |
          TARGET=research/prospective/h003/FY27-Q2-2026-09-06/outcomes-o001/review-triage-v1.json
          git config user.name marketlab-research-bot
          git config user.email marketlab-research-bot@users.noreply.github.com
          git add "$TARGET"
          git commit -m 'H003-O001: freeze conservative blind review triage'
          git push origin HEAD:research/h003-v001-outcome-protocol-20260908
