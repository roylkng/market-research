name: HG007 archived GF001 governance for 28 outside-U001 candidates

on:
  pull_request:
    paths:
      - src/marketlab/hg007_gf001_governance.py
      - scripts/build_hg007_gf001_governance.py
      - tests/test_hg007_gf001_governance.py
      - .github/workflows/hg007-28-governance-gf001.yml
  push:
    branches:
      - main
    paths:
      - src/marketlab/hg007_gf001_governance.py
      - scripts/build_hg007_gf001_governance.py
      - tests/test_hg007_gf001_governance.py
      - .github/workflows/hg007-28-governance-gf001.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: hg007-28-source-governance-gf001-oct04
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and source parser
        run: python -m pip install -e '.[dev]'
      - name: Verify outside-U001 membership and no future-governance claims
        run: |
          ruff check src/marketlab/hg007_gf001_governance.py scripts/build_hg007_gf001_governance.py tests/test_hg007_gf001_governance.py
          pytest -q tests/test_hg007_gf001_governance.py
      - name: Download exact already recorded GF001 full-market original run
        uses: actions/download-artifact@v4
        with:
          name: gf001-d002-37202941712
          run-id: 37202941712
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: /tmp/hg007-original-gf001-d002
      - name: Download original SS001 full-market source census
        uses: actions/download-artifact@v4
        with:
          name: ss001-d002-37198355430
          run-id: 37198355430
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: /tmp/hg007-original-ss001-d002
      - name: Reconcile and retain all 28 exact source XBRL documents
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_hg007_gf001_governance.py \
            --repo-root . \
            --gf001-artifact /tmp/hg007-original-gf001-d002 \
            --ss001-artifact /tmp/hg007-original-ss001-d002 \
            --out-dir /tmp/hg007-p038-source
          test -s /tmp/hg007-p038-source/full-market-governance-28-v1.json
      - name: Anchor only original source-verified October 4 snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          DIR="research/hg007/outside-u001-governance-2026-10-04"
          TARGET="$DIR/28-original-governance-v1.json"
          if [[ -f "$TARGET" ]]; then
            cmp -- "$TARGET" /tmp/hg007-p038-source/full-market-governance-28-v1.json
            echo "Archived original source and 28-company join already retained"
            exit 0
          fi
          mkdir -p "$DIR/raw/sha256"
          cp /tmp/hg007-p038-source/full-market-governance-28-v1.json "$TARGET"
          for original in /tmp/hg007-p038-source/raw/sha256/*.xml; do
            [[ -f "$original" ]] || continue
            sha="$(basename "$original" .xml)"
            cp "$original" "$DIR/raw/sha256/$sha.xml"
            [[ "$(sha256sum "$DIR/raw/sha256/$sha.xml" | cut -d' ' -f1)" == "$sha" ]]
          done
          git config user.name marketlab-research-bot
          git config user.email marketlab-research-bot@users.noreply.github.com
          git add -f "$DIR"
          git commit -m "HG007: retain original 4Oct GF001 XBRL governance on 28 hidden gems [skip ci]"
          BASE_SHA="$(git rev-parse HEAD^)"
          for ATTEMPT in 1 2 3; do
            git fetch origin main
            NEXT_SHA="$(git rev-parse origin/main)"
            if git cat-file -e "origin/main:$TARGET" 2>/dev/null; then
              echo "Original 28-company source already anchored; refuse overwrite"
              exit 1
            fi
            if ! git diff --quiet "$BASE_SHA" "$NEXT_SHA" -- \
              research/hg002-d001-result-v1.json \
              research/prospective/universes/FY27-Q2-2026-09-06.json \
              research/gf001-d002-result-v1.json \
              src/marketlab/hg007_gf001_governance.py \
              src/marketlab/gf001_governance.py \
              scripts/build_hg007_gf001_governance.py; then
              echo "Original official source or audit contract changed mid-run"
              exit 1
            fi
            if [[ "$NEXT_SHA" != "$BASE_SHA" ]]; then
              git rebase origin/main
              BASE_SHA="$NEXT_SHA"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((ATTEMPT * 2))
          done
          echo "Unable to archive original GF001 source with immutable provenance"
          exit 1
      - name: Preserve independent 28-case source results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hg007-original-oct04-28-outside-u001-governance-source
          path: /tmp/hg007-p038-source
          if-no-files-found: ignore
          retention-days: 90
