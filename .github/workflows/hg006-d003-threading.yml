name: HG006 D003 deterministic episode threading

on:
  push:
    branches:
      - research/hg006-d003-threading-20261007

permissions:
  actions: read
  contents: read

jobs:
  thread:
    if: contains(github.event.head_commit.message, '[hg006-d003]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate frozen D003 implementation before labels
        run: |
          ruff check \
            src/marketlab/hg006_d003_generator.py \
            scripts/run_hg006_d003_threading.py \
            tests/test_hg006_d003_generator.py \
            src/marketlab/hg006_episode_threading.py
          pytest -q \
            tests/test_hg006_d003_generator.py \
            tests/test_hg006_episode_threading.py \
            tests/test_hg006_stage_contract.py
      - name: Download exact passed full P2 ingestion
        uses: actions/download-artifact@v4
        with:
          name: hg006-l001-p2-full-37638982587
          path: reports/p2
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37638982587
      - name: Download exact frozen S002 evidence pack
        uses: actions/download-artifact@v4
        with:
          name: hg006-s002-37416075608
          path: reports/s002
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37416075608
      - name: Verify frozen source authorities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p2=json.loads(Path("reports/p2/full/hg006-l001-p2-full-ingestion.json").read_text())
          s002=json.loads(Path("reports/s002/hg006-s002-evidence-pack.json").read_text())
          assert p2["ingestion_sha256"] == "2188bf803f2088cd10f26892f92f1a82fc810543ad9679c4fc20534e2a3e59e6"
          assert p2["full_ingestion_pass"] is True
          assert p2["historical_terminal_labels_opened"] is False
          assert s002["pack_sha256"] == "e99f270bf48b76bb72f3e2734abddd34bcc580cb1583086cc73e50759e23766e"
          assert s002["historical_terminal_labels_opened"] is False
          PY
      - name: Build frozen evidence-anchor episode threads
        run: |
          mkdir -p reports/d003
          python scripts/run_hg006_d003_threading.py \
            --ingestion reports/p2/full/hg006-l001-p2-full-ingestion.json \
            --evidence-pack reports/s002/hg006-s002-evidence-pack.json \
            --out reports/d003/hg006-d003-p1-threading.json
      - name: Prove threading gate before terminal labeling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/d003/hg006-d003-p1-threading.json").read_text())
          assert p["generator_id"] == "HG006-D003-P1-v1"
          assert p["source_event_count"] == 1564
          assert p["feasibility_pass"] is True
          assert p["promotion_allowed_to_d002_terminal_labeling"] is True
          assert p["historical_terminal_labels_opened"] is False
          assert p["completion_probabilities_assigned"] is False
          assert p["return_outcomes_opened"] is False
          print(json.dumps({
            "threading_sha256":p["threading_sha256"],
            "episode_count":p["episode_count"],
            "episode_assigned_event_count":p["episode_assigned_event_count"],
            "thread_ambiguous_event_count":p["thread_ambiguous_event_count"],
            "episode_counts_by_family":p["episode_counts_by_family"],
            "threshold_passes":p["threshold_passes"],
          },indent=2,sort_keys=True))
          PY
      - name: Upload exact D003 evidence
        uses: actions/upload-artifact@v4
        with:
          name: hg006-d003-p1-${{ github.run_id }}
          path: reports/d003
          if-no-files-found: error
          retention-days: 90
