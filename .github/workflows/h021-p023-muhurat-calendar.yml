name: H021 P023 NSE Muhurat original-source H20 clock

on:
  pull_request:
    paths:
      - src/marketlab/h021_muhurat_amendment.py
      - scripts/seal_h021_muhurat_clock.py
      - tests/test_h021_muhurat_amendment.py
      - .github/workflows/h021-p023-muhurat-calendar.yml
  push:
    branches:
      - main
    paths:
      - src/marketlab/h021_muhurat_amendment.py
      - scripts/seal_h021_muhurat_clock.py
      - tests/test_h021_muhurat_amendment.py
      - .github/workflows/h021-p023-muhurat-calendar.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h021-source-proven-nov08-h20-calendar-amendment-v1
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing research package and regression tools
        run: python -m pip install -e '.[dev]'
      - name: Reverify original H021, HG009, NSE PDF and forward-only clock
        run: |
          ruff check src/marketlab/h021_muhurat_amendment.py scripts/seal_h021_muhurat_clock.py tests/test_h021_muhurat_amendment.py
          pytest -q tests/test_h021_muhurat_amendment.py tests/test_h021_horizon_readiness.py
      - name: Materialize original-exchange-source H021 clock without outcomes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/seal_h021_muhurat_clock.py \
            --out /tmp/h021-p023-nse-nov08-calendar-only-v1.json \
            --require-20-calendar-date
          test -s /tmp/h021-p023-nse-nov08-calendar-only-v1.json
      - name: Seal immutable H021 source-clock correction after main merge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          TARGET="research/prospective/h021/amendments/h021-p023-nov08-calendar-v1.json"
          if [[ -f "$TARGET" ]]; then
            python scripts/seal_h021_muhurat_clock.py \
              --out "$TARGET" --verify-existing
            echo "Source-proven Muhurat H20 calendar already sealed"
            exit 0
          fi
          mkdir -p "$(dirname "$TARGET")"
          cp /tmp/h021-p023-nse-nov08-calendar-only-v1.json "$TARGET"
          git config user.name marketlab-research-bot
          git config user.email marketlab-research-bot@users.noreply.github.com
          git add "$TARGET"
          git commit -m "H021: freeze source-proven Nov 8 H20 calendar amendment, no returns [skip ci]"
          BASE_SHA="$(git rev-parse HEAD^)"
          for RETRY in 1 2 3; do
            git fetch origin main
            NEW_MAIN="$(git rev-parse origin/main)"
            if git cat-file -e "origin/main:$TARGET" 2>/dev/null; then
              echo "H021 Muhurat H20 calendar amendment already published; refuse overwrite"
              exit 1
            fi
            if ! git diff --quiet "$BASE_SHA" "$NEW_MAIN" -- \
              research/hg009/hg009-p004-a1-nov08-calendar-v1.json \
              research/hg009/p004-a1/originals \
              research/prospective/calendars/FY27-Q2-2026-09-06/NSE-CM-FY27Q2-v1.json \
              research/prospective/h021/intents/2026-10-09-primary-entry-intent-v1.json \
              research/prospective/h021/comparisons/2026-10-09-primary-revision-v1.json \
              src/marketlab/h021_muhurat_amendment.py \
              src/marketlab/h021_horizon_readiness.py \
              src/marketlab/hg009_p004_a1_muhurat.py; then
              echo "Original NSE calendar/receipt or evaluation protocol changed"
              exit 1
            fi
            if [[ "$NEW_MAIN" != "$BASE_SHA" ]]; then
              git rebase origin/main
              BASE_SHA="$NEW_MAIN"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((RETRY*2))"
          done
          echo "Immutable H021 Nov8 original-source clock could not be anchored"
          exit 1
      - name: Retain independently verifiable source-clock amendment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h021-p023-official-muhurat-calendar-no-market-returns
          path: /tmp/h021-p023-nse-nov08-calendar-only-v1.json
          if-no-files-found: ignore
          retention-days: 90
