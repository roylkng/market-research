name: HG006 L001 P1 historical inference queue

on:
  push:
    branches:
      - research/hg006-l001-inference-queue-20261006

permissions:
  actions: read
  contents: read

jobs:
  materialize:
    if: contains(github.event.head_commit.message, '[hg006-l001-queue]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate frozen queue implementation
        run: |
          ruff check \
            src/marketlab/hg006_inference_queue.py \
            scripts/materialize_hg006_l001_queue.py \
            tests/test_hg006_inference_queue.py
          pytest -q \
            tests/test_hg006_inference_queue.py \
            tests/test_hg006_stage_contract.py \
            tests/test_hg006_evidence_pack.py

      - name: Download exact HG006 S002 evidence pack
        uses: actions/download-artifact@v4
        with:
          name: hg006-s002-37416075608
          path: reports/s002
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37416075608

      - name: Verify frozen S002 source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/s002/hg006-s002-evidence-pack.json").read_text())
          assert p["pack_id"]=="HG006-S002-v1"
          assert p["pack_sha256"]=="e99f270bf48b76bb72f3e2734abddd34bcc580cb1583086cc73e50759e23766e"
          assert p["chronology_count"]==300
          assert p["state_counts"]=={"EVIDENCE_READY":298,"TEXT_UNAVAILABLE":2}
          assert p["historical_terminal_labels_opened"] is False
          assert p["completion_probabilities_assigned"] is False
          PY

      - name: Materialize exact L001 queue
        run: |
          mkdir -p reports/l001-queue
          python scripts/materialize_hg006_l001_queue.py \
            --s002-pack reports/s002/hg006-s002-evidence-pack.json \
            --output reports/l001-queue

      - name: Prove frozen model queue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path("reports/l001-queue/hg006-l001-p1-queue.json").read_text())
          assert q["queue_id"]=="HG006-L001-P1-v1"
          assert q["request_count"]==1448
          assert q["evidence_ready_chronology_count"]==298
          assert len(q["text_unavailable_chronology_ids"])==2
          assert sum(q["request_counts_by_shard"].values())==1448
          assert len(q["request_counts_by_shard"])==16
          assert q["historical_terminal_labels_opened"] is False
          assert q["completion_probabilities_assigned"] is False
          print(json.dumps({
            "queue_sha256":q["queue_sha256"],
            "model_config_sha256":q["model_config_sha256"],
            "request_count":q["request_count"],
            "request_counts_by_shard":q["request_counts_by_shard"],
            "request_counts_by_family":q["request_counts_by_family"],
            "text_unavailable_chronology_ids":q["text_unavailable_chronology_ids"],
          },indent=2,sort_keys=True))
          PY

      - name: Upload exact inference queue
        uses: actions/upload-artifact@v4
        with:
          name: hg006-l001-p1-queue-${{ github.run_id }}
          path: reports/l001-queue
          if-no-files-found: error
          retention-days: 90
