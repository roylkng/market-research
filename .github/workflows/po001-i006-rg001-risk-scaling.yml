name: PO001 I006 RG001 active-risk scaling

on:
  push:
    branches:
      - feat/po001-i006-rg001-risk-scaling-20261003

permissions:
  contents: read
  actions: read

jobs:
  pilot:
    if: contains(github.event.head_commit.message, '[po001-i006]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify I006 implementation before opening sealed outcomes
        run: |
          ruff check \
            src/marketlab/po001_i006.py \
            scripts/run_po001_i006.py \
            tests/test_po001_i006.py
          pytest -q \
            tests/test_po001_i006.py \
            tests/test_ab001_p003.py \
            tests/test_alpha_regime.py

      - name: Download exact sealed P003 evidence
        uses: actions/download-artifact@v4
        with:
          name: ab001-p003-36703199954
          path: evidence/p003
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: roylkng/market-research
          run-id: 36703199954

      - name: Download exact sealed P004 evidence
        uses: actions/download-artifact@v4
        with:
          name: ab001-p004-37096347090
          path: evidence/p004
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: roylkng/market-research
          run-id: 37096347090

      - name: Resolve sealed inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          P003="$(find evidence/p003 -type f -name 'ab001-p003-report.json.gz' -print -quit)"
          RG001="$(find evidence/p004 -type f -name 'regime-panel.json.gz' -print -quit)"
          test -n "$P003"
          test -n "$RG001"
          echo "p003=$P003" >> "$GITHUB_OUTPUT"
          echo "rg001=$RG001" >> "$GITHUB_OUTPUT"

      - name: Run frozen I006 portfolio-context diagnostic
        run: |
          python scripts/run_po001_i006.py \
            --p003-report "${{ steps.inputs.outputs.p003 }}" \
            --rg001-panel "${{ steps.inputs.outputs.rg001 }}" \
            --output reports/po001-i006/study

      - name: Print compact result
        run: cat reports/po001-i006/study/summary.json

      - name: Upload exact I006 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: po001-i006-${{ github.run_id }}
          path: reports/po001-i006
          if-no-files-found: warn
          retention-days: 90
