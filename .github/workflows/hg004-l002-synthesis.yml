name: HG004 L002 deterministic term synthesis

on:
  push:
    branches:
      - research/hg004-l002-term-synthesis-20261005

permissions:
  actions: read
  contents: read

jobs:
  synthesize:
    if: contains(github.event.head_commit.message, '[hg004-l002]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate frozen L002 implementation
        run: |
          ruff check \
            src/marketlab/hg004_l002.py \
            scripts/materialize_hg004_l002.py \
            tests/test_hg004_l002.py
          pytest -q \
            tests/test_hg004_l002.py \
            tests/test_hg004_terms.py
      - name: Download exact passed HG004 L001 artifact
        uses: actions/download-artifact@v4
        with:
          name: hg004-l001-37296227681
          path: reports/hg004-l001-source
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37296227681
      - name: Verify frozen L001 run
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(
              Path("reports/hg004-l001-source/hg004-l001-native-run.json").read_text()
          )
          assert p["run_id"] == "HG004-L001-GPT56SOL-NATIVE-v1"
          assert p["run_sha256"] == (
              "a402b39a8890cd2fac3218bb94673f8b9c00b1f325315f9ec93863c22d9a1d12"
          )
          assert p["validated_output_count"] == 19
          assert p["return_outcomes_opened"] is False
          PY
      - name: Materialize deterministic company synthesis
        run: |
          mkdir -p reports/hg004-l002
          python scripts/materialize_hg004_l002.py \
            --run reports/hg004-l001-source/hg004-l001-native-run.json \
            --out reports/hg004-l002/hg004-l002-synthesis.json
      - name: Prove frozen routing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(
              Path("reports/hg004-l002/hg004-l002-synthesis.json").read_text()
          )
          assert p["synthesis_id"] == "HG004-L002-v1"
          assert p["symbol_count"] == 11
          assert p["payoff_model_ready_symbol_count"] == 5
          assert p["partial_terms_symbol_count"] == 2
          assert p["procedural_or_historical_symbol_count"] == 4
          assert p["return_outcomes_opened"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          print(json.dumps({
              "synthesis_sha256": p["synthesis_sha256"],
              "primary_readiness_state_counts": p["primary_readiness_state_counts"],
              "lane_readiness_state_counts": p["lane_readiness_state_counts"],
              "payoff_model_ready_symbols": p["payoff_model_ready_symbols"],
              "partial_terms_symbols": p["partial_terms_symbols"],
              "procedural_or_historical_symbols": p["procedural_or_historical_symbols"],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload exact L002 synthesis
        uses: actions/upload-artifact@v4
        with:
          name: hg004-l002-${{ github.run_id }}
          path: reports/hg004-l002
          if-no-files-found: error
          retention-days: 90
