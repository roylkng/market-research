name: HG007 original Sep29 FD shares and promoter pledge audit

on:
  pull_request:
    paths:
      - src/marketlab/hg007_sep29_fd_pledge.py
      - scripts/reconcile_hg007_sep29_fd_pledge.py
      - tests/test_hg007_sep29_fd_pledge.py
      - .github/workflows/hg007-sep29-fd-pledge-review.yml
  push:
    branches:
      - main
    paths:
      - src/marketlab/hg007_sep29_fd_pledge.py
      - scripts/reconcile_hg007_sep29_fd_pledge.py
      - tests/test_hg007_sep29_fd_pledge.py
      - .github/workflows/hg007-sep29-fd-pledge-review.yml

permissions:
  contents: write

concurrency:
  group: hg007-sep29-original-fd-promoter-pledge
  cancel-in-progress: false

jobs:
  source_reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify issuer original Reg31 dilution and promoter pledge
        run: |
          ruff check src/marketlab/hg007_sep29_fd_pledge.py scripts/reconcile_hg007_sep29_fd_pledge.py tests/test_hg007_sep29_fd_pledge.py
          pytest -q tests/test_hg007_sep29_fd_pledge.py
      - name: Generate exact-source Sep29 dated issuer-share evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reconcile_hg007_sep29_fd_pledge.py \
            --repo-root . \
            --out /tmp/hg007-sep29-original-fd-pledge-v1.json
          test -s /tmp/hg007-sep29-original-fd-pledge-v1.json
      - name: Anchor append-only original-source report after main merge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          TARGET="research/hg007/inoxgreen-post-qip-reg31/sep29-reported-fd-promoter-pledge-v1.json"
          if [[ -f "$TARGET" ]]; then
            python scripts/reconcile_hg007_sep29_fd_pledge.py \
              --out "$TARGET" --verify-existing
            echo "Exact original Reg31 issuer share facts already anchored"
            exit 0
          fi
          cp /tmp/hg007-sep29-original-fd-pledge-v1.json "$TARGET"
          git config user.name marketlab-research-bot
          git config user.email marketlab-research-bot@users.noreply.github.com
          git add "$TARGET"
          git commit -m "HG007: source-pin Sep29 422070138 FD and 4900000 promoter pledges [skip ci]"
          START_SHA="$(git rev-parse HEAD^)"
          for RETRY in 1 2 3; do
            git fetch origin main
            NEXT="$(git rev-parse origin/main)"
            if git cat-file -e "origin/main:$TARGET" 2>/dev/null; then
              echo "Original Sep29 Reg31 report already published; no overwrite"
              exit 1
            fi
            if ! git diff --quiet "$START_SHA" "$NEXT" -- \
              research/hg007/inoxgreen-post-qip-reg31/original-source-receipt-v1.json \
              research/hg007/inoxgreen-post-qip-reg31/raw/sha256 \
              research/hg007/inoxgreen-sep2026-qip/post-qip-market-cap-audit-v1.json \
              src/marketlab/hg007_sep29_fd_pledge.py \
              scripts/reconcile_hg007_sep29_fd_pledge.py; then
              echo "Original source/issuer term contract changed during fact review"
              exit 1
            fi
            if [[ "$NEXT" != "$START_SHA" ]]; then
              git rebase origin/main
              START_SHA="$NEXT"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((RETRY*2))"
          done
          echo "Unable to anchor original Sep29 issuer facts"
          exit 1
      - name: Retain independent original issuer fact packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hg007-original-sep29-fd-esop-promoter-pledge
          path: /tmp/hg007-sep29-original-fd-pledge-v1.json
          if-no-files-found: ignore
          retention-days: 90
