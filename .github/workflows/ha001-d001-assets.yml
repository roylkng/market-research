name: HA001 D001 full-market asset anomaly routing

on:
  push:
    branches:
      - research/ha001-asset-anomaly-plane-20261004

permissions:
  actions: read
  contents: read

jobs:
  materialize:
    if: contains(github.event.head_commit.message, '[ha001-d001]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate
        run: |
          ruff check src/marketlab/ha001_assets.py scripts/run_ha001_d001.py tests/test_ha001_assets.py
          pytest -q tests/test_ha001_assets.py
      - name: Download exact FA001 D002 panel
        uses: actions/download-artifact@v4
        with:
          name: fa001-d002-merged-37213394690
          path: reports/fa001-source
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37213394690
      - name: Materialize frozen HA001 plane
        run: |
          python scripts/run_ha001_d001.py \
            --fa-panel reports/fa001-source/fa001-d002-panel.json \
            --output reports/ha001-d001
      - name: Prove research-only output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/ha001-d001/ha001-d001-panel.json").read_text())
          assert p["panel_id"]=="HA001-D001-v1"
          assert p["identity_count"]==2319
          assert p["return_outcomes_opened"] is False
          assert p["model_fitted"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          print(json.dumps({
            "panel_sha256":p["panel_sha256"],
            "net_financial_assets_to_equity_ready_count":p["net_financial_assets_to_equity_ready_count"],
            "investments_to_assets_ready_count":p["investments_to_assets_ready_count"],
            "cwip_to_ppe_ready_count":p["cwip_to_ppe_ready_count"],
            "opportunity_flag_counts":p["opportunity_flag_counts"],
            "caution_flag_counts":p["caution_flag_counts"],
            "any_opportunity_flag_count":p["any_opportunity_flag_count"],
            "threshold_passes":p["threshold_passes"],
            "feasibility_pass":p["feasibility_pass"],
          },indent=2,sort_keys=True))
          PY
      - name: Upload HA001 D001
        uses: actions/upload-artifact@v4
        with:
          name: ha001-d001-${{ github.run_id }}
          path: reports/ha001-d001
          if-no-files-found: error
          retention-days: 90
