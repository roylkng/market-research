name: HG009 P010 Mayur source-byte FY26 cash bridge
on:
  push:
    branches:
      - research/hg009-p010-mayur-cash-asset-reconciliation-20261015
    paths:
      - .github/workflows/hg009-p010-mayur.yml
      - src/marketlab/hg009_p010_mayur_cash.py
      - scripts/materialize_hg009_p010_mayur.py
      - tests/test_hg009_p010_mayur.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hg009-p010-source-bound-mayur-research
  cancel-in-progress: false

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned repo code
        run: python -m pip install -e '.[dev]'
      - name: Materialize original archived NSE statement and run synthetic adversarial checks
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_hg009_p010_mayur.py
          python scripts/materialize_hg009_p010_mayur.py --check
          ruff check src/marketlab/hg009_p010_mayur_cash.py scripts/materialize_hg009_p010_mayur.py tests/test_hg009_p010_mayur.py
          pytest -q tests/test_hg009_p010_mayur.py
      - name: Seal original source-byte bridge without modifying P003 or stock ranks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/hg009/hg009-p010-mayur-investing-cash-bridge-v1.json
          if git diff --cached --quiet; then
            echo "P010 signed original-source bridge unchanged"
            exit 0
          fi
          git commit -m "HG009 P010: independently pin FY26 Mayur cash placement and bank balance reconciliation [skip ci]"
          git fetch origin research/hg009-p010-mayur-cash-asset-reconciliation-20261015
          git rebase origin/research/hg009-p010-mayur-cash-asset-reconciliation-20261015
          python scripts/materialize_hg009_p010_mayur.py --check
          git push origin HEAD:research/hg009-p010-mayur-cash-asset-reconciliation-20261015
