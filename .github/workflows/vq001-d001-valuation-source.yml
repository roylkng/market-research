name: VQ001 D001 point-in-time valuation source feasibility

on:
  push:
    branches:
      - research/vq001-normalized-valuation-source-20261004

permissions:
  contents: read

jobs:
  diagnostic:
    if: contains(github.event.head_commit.message, '[vq001-d001]')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate frozen VQ001 implementation before source access
        run: |
          ruff check             src/marketlab/valuation_history.py             scripts/run_vq001_d001.py             tests/test_valuation_history.py
          pytest -q             tests/test_valuation_history.py             tests/test_alpha_fundamental.py             tests/test_marketdata.py             tests/test_fundamental_quality.py
      - name: Run frozen 100-company valuation source diagnostic
        run: |
          python scripts/run_vq001_d001.py             --universe research/prospective/universes/FY27-Q2-2026-09-06.json             --isin-bridges research/fq001/fq001-isin-bridges-v1.json             --raw-dir reports/vq001-d001/raw             --output reports/vq001-d001             --attempts 4             --timeout-seconds 20
      - name: Prove outcome-blind diagnostic
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/vq001-d001/vq001-d001-panel.json").read_text())
          assert p["return_outcomes_opened"] is False
          assert p["model_fitted"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          assert p["universe_member_count"] == 100
          print(json.dumps({
              "panel_sha256": p["panel_sha256"],
              "historical_snapshot_valid_counts": p["historical_snapshot_valid_counts"],
              "companies_with_at_least_3_historical": p["companies_with_at_least_3_historical"],
              "companies_with_all_4_historical": p["companies_with_all_4_historical"],
              "current_snapshot_valid_count": p["current_snapshot_valid_count"],
              "threshold_passes": p["threshold_passes"],
              "feasibility_pass": p["feasibility_pass"],
              "failure_stage_counts": p["failure_stage_counts"],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload exact VQ001 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vq001-d001-${{ github.run_id }}
          path: reports/vq001-d001
          if-no-files-found: warn
          retention-days: 90
