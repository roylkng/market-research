name: HG009 P016 verify original NSE Q1 ACE ACUTAAS HTML

on:
  push:
    branches:
      - research/hg009-p016-q1-original-issuer-source-20261016
    paths:
      - .github/workflows/hg009-p016-q1-originals.yml
      - src/marketlab/hg009_p016_q1_originals.py
      - scripts/capture_hg009_p016_q1.py
      - tests/test_hg009_p016_q1_originals.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hg009-p016-q1-primary-source-attestation
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original-source parsers and test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Validate historical Q1 identity and financial table replay contracts
        shell: bash
        run: |
          set -euo pipefail
          ruff check src/marketlab/hg009_p016_q1_originals.py scripts/capture_hg009_p016_q1.py tests/test_hg009_p016_q1_originals.py
          pytest -q tests/test_hg009_p016_q1_originals.py
          python scripts/capture_hg009_p016_q1.py --run-id verify --verify-only

      - name: Archive exact ACE ACUTAAS Q1 NSE original HTML or failed HTTP receipts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/capture_hg009_p016_q1.py \
            --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python scripts/capture_hg009_p016_q1.py --run-id verify --verify-only

      - name: Preserve original raw source bytes and retrieval timestamps
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add -f research/hg009/p016-originals/attempts
          if [ -d research/hg009/p016-originals/by-symbol ]; then
            git add -f research/hg009/p016-originals/by-symbol
          fi
          if [ -f research/hg009/hg009-p016-q1-source-attestation-v1.json ]; then
            git add research/hg009/hg009-p016-q1-source-attestation-v1.json
          fi
          if git diff --cached --quiet; then
            echo "P016 no new archival source receipts"
            exit 0
          fi
          git commit -m "HG009 P016: archive original Q1 NSE issuer data and factual source receipts [skip ci]"
          git fetch origin research/hg009-p016-q1-original-issuer-source-20261016
          git rebase origin/research/hg009-p016-q1-original-issuer-source-20261016
          python scripts/capture_hg009_p016_q1.py --run-id verify --verify-only
          git push origin HEAD:research/hg009-p016-q1-original-issuer-source-20261016
