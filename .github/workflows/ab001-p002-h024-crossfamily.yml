name: AB001 P002 H024 cross-family pilot

on:
  push:
    branches:
      - feat/ab001-h024-crossfamily-pilot-20260930

permissions:
  contents: read

jobs:
  pilot:
    if: contains(github.event.head_commit.message, '[ab001-p002]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify P002 implementation before source access
        run: |
          ruff check \
            src/marketlab/ab001_p002.py \
            scripts/run_ab001_p002.py \
            tests/test_ab001_p002.py
          pytest -q \
            tests/test_ab001_p002.py \
            tests/test_ab001.py \
            tests/test_alpha_multihorizon.py

      - name: Rebuild frozen official NSE market panel
        run: |
          python scripts/build_ae001_historical_panel.py \
            --start-date 2025-09-01 \
            --end-date 2026-09-25 \
            --store .marketlab/ab001-p002 \
            --output reports/ab001-p002/panel \
            --attempts 4 \
            --timeout-seconds 30 \
            --pause-seconds 0.05

      - name: Rebuild action-safe base features from exact pinned T003 ledger
        run: |
          python scripts/build_ab001_p001_action_safe.py \
            --market-panel reports/ab001-p002/panel/market-panel.json.gz \
            --feature-panel reports/ab001-p002/panel/feature-panel.json.gz \
            --action-ledger research/ab001-p001/inputs/t003-corporate-action-ledger.json.gz \
            --action-ledger-manifest research/ab001-p001/inputs/t003-corporate-action-ledger.manifest.json \
            --output reports/ab001-p002/action-safe

      - name: Build reusable delivery feature panel
        run: |
          python scripts/build_ae001_delivery_features.py \
            --market-panel reports/ab001-p002/panel/market-panel.json.gz \
            --feature-panel reports/ab001-p002/action-safe/action-safe-feature-panel.json.gz \
            --store .marketlab/ab001-p002 \
            --output reports/ab001-p002/delivery \
            --attempts 4 \
            --timeout-seconds 30

      - name: Run frozen P002 cross-family diagnostic
        run: |
          python scripts/run_ab001_p002.py \
            --market-panel reports/ab001-p002/panel/market-panel.json.gz \
            --feature-panel reports/ab001-p002/delivery/delivery-feature-panel.json.gz \
            --action-ledger reports/ab001-p002/action-safe/corporate-action-ledger.json.gz \
            --h024-event-panel research/historical/h024/challenge-2026-09-15/event-panel.json \
            --h024-source-panel research/historical/h024/prefreeze-original-purchase-source-panel-v1.json \
            --output reports/ab001-p002/study

      - name: Print compact result
        run: cat reports/ab001-p002/study/summary.json

      - name: Upload exact P002 development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab001-p002-${{ github.run_id }}
          path: |
            reports/ab001-p002
            .marketlab/ab001-p002/market-data
          if-no-files-found: warn
          retention-days: 90
