name: Company intelligence v2 market-close miss audit

on:
  workflow_dispatch:
    inputs:
      session_date:
        description: NSE completed session in YYYY-MM-DD, blank uses current IST date
        required: false
        type: string
  # GitHub Actions cron is UTC: 13:15 UTC = 18:45 Asia/Kolkata.
  schedule:
    - cron: '15 13 * * 1-5'

permissions:
  contents: read

concurrency:
  group: company-intelligence-v2-market-close-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Verify audit implementation and canonical news state
        run: |
          ruff check \
            src/marketlab/intelligence_market_audit.py \
            src/marketlab/intelligence_market_audit_context.py \
            scripts/run_daily_market_audit.py \
            tests/test_intelligence_market_audit.py \
            tests/test_intelligence_market_audit_context.py
          pytest -q \
            tests/test_intelligence_market_audit.py \
            tests/test_intelligence_market_audit_context.py
          python scripts/verify_company_news_ledger.py \
            --ledger research/prospective/company-intelligence-v2/news-ledger.json
      - name: Resolve NSE session
        id: session
        env:
          INPUT_SESSION: ${{ inputs.session_date }}
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$(python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          from marketlab.calendar_snapshot import load_calendar_snapshot

          calendar = load_calendar_snapshot(
              "research/prospective/calendars/FY27-Q2-2026-09-06/NSE-CM-FY27Q2-v1.json"
          )
          sessions = {row.session_date for row in calendar.sessions}
          requested = (os.environ.get("INPUT_SESSION") or "").strip()
          if requested:
              if requested not in sessions:
                  raise SystemExit(
                      f"manual market-close audit session is not in frozen NSE calendar: {requested}"
                  )
              print(f"RUN|{requested}")
          else:
              today = datetime.now(ZoneInfo("Asia/Kolkata")).date().isoformat()
              state = "RUN" if today in sessions else "NON_SESSION"
              print(f"{state}|{today}")
          PY
          )"
          IFS='|' read -r STATE SESSION <<< "$RESULT"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "session=$SESSION" >> "$GITHUB_OUTPUT"
          echo "Market-close audit gate: state=$STATE session=$SESSION"
      - name: Build official prospective mover/miss audit
        if: steps.session.outputs.state == 'RUN'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/market-close/logs
          python scripts/run_daily_market_audit.py \
            --session '${{ steps.session.outputs.session }}' \
            --store reports/market-close/store \
            --output reports/market-close/audit \
            --news-ledger research/prospective/company-intelligence-v2/news-ledger.json \
            --liquidity-floor-inr 20000000 \
            --move-threshold-pct 5 \
            --top-abs-movers 25 | tee reports/market-close/logs/market-audit.log
      - name: Tracked repository unchanged
        if: always()
        run: git diff --exit-code
      - name: Retain audit evidence
        if: always() && steps.session.outputs.state == 'RUN'
        uses: actions/upload-artifact@v4
        with:
          name: market-close-audit-${{ steps.session.outputs.session }}-${{ github.run_id }}
          path: reports/market-close
          if-no-files-found: error
          retention-days: 30
      - name: Report non-trading day
        if: steps.session.outputs.state == 'NON_SESSION'
        run: echo "Market-close audit skipped because ${{ steps.session.outputs.session }} is not a frozen NSE cash-market session"
