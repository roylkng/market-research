name: H003 content lint fix once

on:
  push:
    branches:
      - feat/h003-transcript-content-v1
    paths:
      - .github/workflows/h003-content-lint-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/h003-transcript-content-v1
      - run: sed -i '/^import os$/d' src/marketlab/h003_content.py
      - name: Commit and remove one-shot workflow
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git rm .github/workflows/h003-content-lint-fix.yml
          git add src/marketlab/h003_content.py
          git commit -m "Fix H003 content lint preflight"
          git push origin HEAD:feat/h003-transcript-content-v1
