name: HG009 P007 P2 original NSE action source probes

on:
  push:
    branches:
      - feat/hg009-p007-p2-original-action-probes-20261019
    paths:
      - .github/workflows/hg009-p007-p2-action-source.yml
      - src/marketlab/hg009_p007_probe.py
      - scripts/probe_hg009_p007_actions.py
      - tests/test_hg009_p007_probe.py
  workflow_dispatch:
  schedule:
    # 20:30 India time on weekdays; source observation only, no EOD trade.
    - cron: '0 15 * * 1-5'

permissions:
  contents: write

concurrency:
  group: hg009-p007-p2-original-nse-actions
  cancel-in-progress: false

jobs:
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Canonical main for scheduled, branch for preregistration CI
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            git fetch origin main
            git checkout --detach origin/main
            echo "P007_SOURCE_TARGET_BRANCH=main" >> "$GITHUB_ENV"
          else
            echo "P007_SOURCE_TARGET_BRANCH=feat/hg009-p007-p2-original-action-probes-20261019" >> "$GITHUB_ENV"
          fi
          echo "P007_SOURCE_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test 300 company source-bound action screen
        shell: bash
        run: |
          set -euo pipefail
          ruff check \
            src/marketlab/hg009_p007_probe.py \
            scripts/probe_hg009_p007_actions.py \
            tests/test_hg009_p007_probe.py
          pytest -q tests/test_hg009_p007_probe.py tests/test_hg009_p007_actions.py
          python scripts/probe_hg009_p007_actions.py --verify

      - name: Observe actual NSE original source or signed blocked receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hg009-p007-p2-source
          python scripts/probe_hg009_p007_actions.py \
            --attempt-id "gha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            | tee /tmp/hg009-p007-p2-source/observation-summary.json
          python scripts/probe_hg009_p007_actions.py --verify \
            | tee /tmp/hg009-p007-p2-source/replayed-original-source.json

      - name: Commit only new actual evidence; never overwrite original P007 baseline
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d research/hg009/p007-originals/attempts ]]; then
            echo "P007 outside finite capture dates, no source work"
            exit 0
          fi
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add -f research/hg009/p007-originals
          if git diff --cached --quiet; then
            echo "No new NSE risk-screen evidence to publish"
            exit 0
          fi
          git commit -m "HG009 P007 P2: seal NSE source discovery attempt [skip ci]"
          CRITICAL=(
            ".github/workflows/hg009-p007-p2-action-source.yml"
            "src/marketlab/hg009_p007_probe.py"
            "src/marketlab/hg009_p007_actions.py"
            "scripts/probe_hg009_p007_actions.py"
            "research/hg009/hg009-d001-100-experimental-companies-v1.json"
            "research/hg009/hg009-p001-matched-300-company-controls-v1.json"
            "research/hg009/hg009-p007-action-hazard-p1-v1.json"
            "research/hg009/p007-originals"
          )
          for RETRY in 1 2 3; do
            git fetch origin "$P007_SOURCE_TARGET_BRANCH"
            LATEST="$(git rev-parse "origin/$P007_SOURCE_TARGET_BRANCH")"
            if [[ "$LATEST" != "$P007_SOURCE_BASE_SHA" ]]; then
              if ! git diff --quiet "$P007_SOURCE_BASE_SHA" "$LATEST" -- "${CRITICAL[@]}"; then
                echo "Frozen source or existing evidence changed during discovery"
                exit 1
              fi
              git rebase "origin/$P007_SOURCE_TARGET_BRANCH"
              python scripts/probe_hg009_p007_actions.py --verify
            fi
            if git push origin "HEAD:$P007_SOURCE_TARGET_BRANCH"; then
              echo "P007 original-source receipt now remotely anchored"
              exit 0
            fi
            sleep "$((RETRY * 2))"
          done
          echo "Original-source attempt not securely anchored"
          exit 1

      - name: Operational logs do not replace original data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hg009-p007-p2-action-source-log
          path: /tmp/hg009-p007-p2-source
          retention-days: 90
          if-no-files-found: ignore
