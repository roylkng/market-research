name: H004 HR002 earnings replay v3

on:
  push:
    branches:
      - research/h004-pre-momentum-v1-20260908
    paths:
      - .github/workflows/h004-hr002-earnings-replay.yml
      - scripts/run_h004_earnings_replay_v2.py
      - scripts/run_h004_earnings_replay_v3.py

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h004-pre-momentum-v1-20260908
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run corrected H004 earnings replay v3
        run: |
          rm -rf research/historical/h004/H004-HR002-earnings
          python scripts/run_h004_earnings_replay_v3.py \
            --event-start 2025-10-01 \
            --event-end 2026-07-31 \
            --price-start 2025-05-01 \
            --price-end 2026-08-31 \
            --out-dir research/historical/h004/H004-HR002-earnings
      - name: Commit replay evidence
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/historical/h004/H004-HR002-earnings
          if git diff --cached --quiet; then
            echo "replay output unchanged"
            exit 0
          fi
          git commit -m "H004-HR002: retain corrected earnings replay v3"
          git fetch origin research/h004-pre-momentum-v1-20260908
          git rebase origin/research/h004-pre-momentum-v1-20260908
          git push origin HEAD:research/h004-pre-momentum-v1-20260908
