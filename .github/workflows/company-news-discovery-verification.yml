name: Company news discovery verification
on:
  workflow_dispatch:
  push:
    branches: [feat/company-news-discovery-v2-20260917]
permissions:
  contents: read
concurrency:
  group: company-news-discovery-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Capture discovery endpoints without manual article selection
        run: |
          mkdir -p reports/news-discovery
          git archive --format=zip HEAD > reports/news-discovery/source.zip
          cp "$(command -v ruff)" reports/news-discovery/ruff
          python - <<'PY'
          import json
          from pathlib import Path
          import marketlab.intelligence_http as http
          http.ALLOWED_HOSTS = http.ALLOWED_HOSTS | {'www.sebi.gov.in', 'pib.gov.in', 'www.pib.gov.in'}
          endpoints = {
              'prn-india-list': 'https://www.prnewswire.com/in/news-releases/news-releases-list/',
              'prn-rss': 'https://www.prnewswire.com/rss/news-releases-list.rss',
              'nse-announcements': 'https://nsearchives.nseindia.com/content/RSS/Online_announcements.xml',
              'sebi-rss': 'https://www.sebi.gov.in/sebirss.xml',
              'pib-rss': 'https://pib.gov.in/RssMain.aspx?ModId=6&Lang=1&Regid=3',
          }
          root = Path('reports/news-discovery')
          fetcher = http.PublicFetcher(read_timeout=12)
          outcomes = []
          for name, url in endpoints.items():
              try:
                  raw, meta = fetcher.fetch(url)
                  (root / (name + '.body')).write_bytes(raw)
                  result = {'source_id': name, 'url': url, 'status': 'ACQUIRED', 'bytes': len(raw), **meta}
              except http.SourceBlocked as exc:
                  result = {'source_id': name, 'url': url, 'status': 'BLOCKED', 'details': exc.details}
              outcomes.append(result)
              print(json.dumps(result), flush=True)
          (root / 'probe.json').write_text(json.dumps({'outcomes': outcomes, 'trace': fetcher.trace}, indent=2))
          PY
      - name: Tracked repository unchanged
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-discovery-${{ github.run_id }}
          path: reports/news-discovery
          retention-days: 30
          if-no-files-found: error
