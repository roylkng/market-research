name: H003 pre-evidence mechanical normalization

on:
  push:
    branches:
      - research/h003-v001-outcome-protocol-20260908
    paths:
      - .github/workflows/h003-outcome-autofix.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h003-v001-outcome-protocol-20260908
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Apply only static mechanical fixes and formatting
        run: |
          ruff check --fix --unsafe-fixes \
            src/marketlab/h003_outcomes.py \
            scripts/build_h003_outcome_packets.py \
            tests/test_h003_outcomes.py
          ruff format \
            src/marketlab/h003_outcomes.py \
            scripts/build_h003_outcome_packets.py \
            tests/test_h003_outcomes.py
          ruff check src scripts tests
          pytest -q
      - name: Commit normalization if needed
        run: |
          git config user.name marketlab-research-bot
          git config user.email marketlab-research-bot@users.noreply.github.com
          git add src/marketlab/h003_outcomes.py scripts/build_h003_outcome_packets.py tests/test_h003_outcomes.py
          if git diff --cached --quiet; then
            echo 'No normalization changes needed'
          else
            git commit -m 'H003-O001: normalize pre-evidence implementation'
            git push origin HEAD:research/h003-v001-outcome-protocol-20260908
          fi
