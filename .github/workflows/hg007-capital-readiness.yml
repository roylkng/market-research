name: HG007 28-case post-QIP capital evidence readiness overlay

on:
  pull_request:
    paths:
      - src/marketlab/hg007_capital_readiness.py
      - scripts/build_hg007_capital_readiness.py
      - tests/test_hg007_capital_readiness.py
      - .github/workflows/hg007-capital-readiness.yml
  push:
    branches:
      - main
    paths:
      - src/marketlab/hg007_capital_readiness.py
      - scripts/build_hg007_capital_readiness.py
      - tests/test_hg007_capital_readiness.py
      - .github/workflows/hg007-capital-readiness.yml

permissions:
  contents: write

concurrency:
  group: hg007-source-backed-capital-readiness-overlay
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify all 28 exact original sources and stale cap treatment
        run: |
          ruff check src/marketlab/hg007_capital_readiness.py scripts/build_hg007_capital_readiness.py tests/test_hg007_capital_readiness.py
          pytest -q tests/test_hg007_capital_readiness.py
      - name: Build source-bound capital readiness overlay
        run: |
          python scripts/build_hg007_capital_readiness.py \
            --repo-root . \
            --out /tmp/hg007-p009-28-case-capital-readiness.json
          test -s /tmp/hg007-p009-28-case-capital-readiness.json
      - name: Commit only once on main after all invariants clear
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          TARGET="research/hg007/hg007-p009-28-case-capital-readiness-overlay-v1.json"
          if [[ -f "$TARGET" ]]; then
            python scripts/build_hg007_capital_readiness.py \
              --out "$TARGET" --verify-existing
            exit 0
          fi
          mkdir -p "$(dirname "$TARGET")"
          cp /tmp/hg007-p009-28-case-capital-readiness.json "$TARGET"
          git config user.name marketlab-research-bot
          git config user.email marketlab-research-bot@users.noreply.github.com
          git add "$TARGET"
          git commit -m "HG007: source-pin post-QIP stale valuation warning across 28-case research [skip ci]"
          BASE_SHA="$(git rev-parse HEAD^)"
          for RETRY in 1 2 3; do
            git fetch origin main
            NEW_MAIN="$(git rev-parse origin/main)"
            if git cat-file -e "origin/main:$TARGET" 2>/dev/null; then
              echo "Capital readiness overlay already published; no overwrite"
              exit 1
            fi
            if ! git diff --quiet "$BASE_SHA" "$NEW_MAIN" -- \
              research/hg002-d001-result-v1.json \
              research/hg003-l002-result-v1.json \
              research/hg004-d001-result-v1.json \
              research/hg005-d001-result-v1.json \
              research/hg005-d003-result-v1.json \
              research/hg006-p001-result-v1.json \
              research/ss002-p005-result-v1.json \
              research/hg007/inoxgreen-sep2026-qip/post-qip-market-cap-audit-v1.json \
              src/marketlab/hg007_casework.py \
              src/marketlab/hg007_capital_readiness.py; then
              echo "Frozen source/cohort contract changed during overlay assembly"
              exit 1
            fi
            if [[ "$NEW_MAIN" != "$BASE_SHA" ]]; then
              git rebase origin/main
              BASE_SHA="$NEW_MAIN"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((RETRY*2))"
          done
          exit 1
      - name: Preserve reviewable full 28-case overlay artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hg007-28-case-capital-evidence-readiness-v1
          path: /tmp/hg007-p009-28-case-capital-readiness.json
          if-no-files-found: ignore
          retention-days: 90
