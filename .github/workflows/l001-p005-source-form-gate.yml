name: L001 P005 accounting-form original source guard

on:
  pull_request:
    paths:
      - src/marketlab/l001_p005_source_form_gate.py
      - scripts/materialize_l001_p005_source_forms.py
      - tests/test_l001_p005_source_form_gate.py
      - .github/workflows/l001-p005-source-form-gate.yml

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and lint source guard
        run: |
          python -m pip install -e '.[dev]'
          ruff check src/marketlab/l001_p005_source_form_gate.py scripts/materialize_l001_p005_source_forms.py tests/test_l001_p005_source_form_gate.py
          pytest -q tests/test_l001_p005_source_form_gate.py
      - name: Download actual previously verified P004 output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/12111414537/zip" \
            --output "$RUNNER_TEMP/l001-p004-proven.zip"
          unzip -j "$RUNNER_TEMP/l001-p004-proven.zip" \
            l001-p004-all100-original-audit.json -d "$RUNNER_TEMP"
      - name: Replay exact issuer financial accounting form
        run: |
          python scripts/materialize_l001_p005_source_forms.py \
            --p004-source "$RUNNER_TEMP/l001-p004-all100-original-audit.json" \
            --output "$RUNNER_TEMP/l001-p005-accounting-format-100.json" \
            | tee "$RUNNER_TEMP/l001-p005-summary.json"
      - name: Retain observed classification diagnostic only
        uses: actions/upload-artifact@v4
        with:
          name: l001-p005-provisional-accounting-format-report
          path: |
            ${{ runner.temp }}/l001-p005-accounting-format-100.json
            ${{ runner.temp }}/l001-p005-summary.json
          retention-days: 90
