name: I003 pin sealed I002 risk input

on:
  push:
    branches:
      - feat/po001-v2-stock-impact-20260929

permissions:
  contents: write
  actions: read

jobs:
  pin:
    if: contains(github.event.head_commit.message, '[i003-pin-i002-risk]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download sealed I002 evidence
        uses: actions/download-artifact@v4
        with:
          name: po001-i002-36570866823
          path: evidence/i002
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: roylkng/market-research
          run-id: 36570866823

      - name: Pin exact legacy RM001 risk state
        run: |
          set -euo pipefail
          SOURCE="evidence/i002/reports/po001-i002/risk-a/risk-state.json.gz"
          TARGET_DIR="research/po001-i003/inputs"
          TARGET="$TARGET_DIR/i002-risk-state-legacy.json.gz"
          MANIFEST="$TARGET_DIR/i002-risk-state-legacy-manifest.json"
          mkdir -p "$TARGET_DIR"
          cp "$SOURCE" "$TARGET"

          python - <<'PY'
          import gzip
          import hashlib
          import json
          from pathlib import Path

          source = Path("research/po001-i003/inputs/i002-risk-state-legacy.json.gz")
          raw = source.read_bytes()
          state = json.loads(gzip.decompress(raw).decode("utf-8"))
          expected = "b1d6898f1083d752ca7db6dc7509b8ef4a2aef0f1543f24fd8b30f07604d80c1"
          if state.get("state_sha256") != expected:
              raise SystemExit(
                  f"legacy risk-state SHA mismatch: {state.get('state_sha256')}"
              )
          manifest = {
              "schema_version": 1,
              "artifact_id": "PO001-I003-PINNED-I002-RISK-v1",
              "source_workflow_run_id": 36570866823,
              "source_workflow_artifact_id": 11036101959,
              "source_workflow_artifact_name": "po001-i002-36570866823",
              "source_path": "reports/po001-i002/risk-a/risk-state.json.gz",
              "pinned_path": str(source),
              "gzip_file_sha256": hashlib.sha256(raw).hexdigest(),
              "internal_rm001_state_sha256": state["state_sha256"],
              "as_of_session": state["as_of_session"],
              "security_count": state["security_count"],
              "live_capital_allowed": False,
          }
          Path(
              "research/po001-i003/inputs/i002-risk-state-legacy-manifest.json"
          ).write_text(
              json.dumps(
                  manifest,
                  indent=2,
                  sort_keys=True,
                  ensure_ascii=False,
                  allow_nan=False,
              ) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, sort_keys=True))
          PY

      - name: Commit pinned evidence
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/po001-i003/inputs
          git commit -m "research: pin exact sealed I002 RM001 risk input [skip ci]"
          git push origin HEAD:feat/po001-v2-stock-impact-20260929
