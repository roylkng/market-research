name: H024 one-time security-master probe 2026-09-17

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/h024-security-master-probe-20260917.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Test exact official MII archive URLs
        shell: bash
        run: |
          python - <<'PY'
          import requests
          BASE='https://www.nseindia.com/'
          s=requests.Session()
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36',
            'Accept':'application/json,text/plain,*/*',
            'Referer':BASE+'all-reports',
          })
          s.get(BASE+'all-reports',timeout=30)
          p=s.get(BASE+'api/daily-reports',params={'key':'CM'},timeout=30).json()
          print('currentDate',p.get('currentDate'),'previousDate',p.get('previousDate'))
          prev=[r for r in (p.get('PreviousDay') or []) if r.get('fileKey')=='NSE-CM-SECURITY-CSV']
          print('previous_exact_count',len(prev))
          for row in prev:
            prev_url=str(row['filePath']).rstrip('/')+'/'+str(row['fileActlName'])
            print('previous_url',prev_url)
            rr=s.get(prev_url,timeout=30)
            print('previous_fetch',rr.status_code,len(rr.content),rr.headers.get('content-type'),rr.content[:4].hex())
            candidate=prev_url.replace('16092026','17092026')
            cr=s.get(candidate,timeout=30)
            print('current_candidate',candidate)
            print('current_fetch',cr.status_code,len(cr.content),cr.headers.get('content-type'),cr.content[:4].hex())
          current=[r for r in (p.get('CurrentDay') or []) if r.get('fileKey')=='NSE-CM-SECURITY-CSV']
          print('current_exact_count',len(current))
          for row in current:
            print('current_row',row)
          PY
