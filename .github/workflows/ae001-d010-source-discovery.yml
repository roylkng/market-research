name: AE001 D010 cash short-borrow source discovery

on:
  push:
    branches:
      - feat/ae001-d010-cash-borrow-flow-source-20261001

permissions:
  contents: read

jobs:
  diagnostic:
    if: contains(github.event.head_commit.message, '[ae001-d010]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify frozen D010 implementation
        run: |
          ruff check \
            src/marketlab/alpha_d010_sources.py \
            scripts/run_ae001_d010.py \
            tests/test_alpha_d010_sources.py
          pytest -q tests/test_alpha_d010_sources.py

      - name: Probe frozen official NSE archive candidates
        run: |
          python scripts/run_ae001_d010.py \
            --output reports/ae001-d010 \
            --timeout-seconds 30

      - name: Print source-only result
        run: cat reports/ae001-d010/report.json

      - name: Upload exact D010 source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae001-d010-${{ github.run_id }}
          path: reports/ae001-d010
          if-no-files-found: warn
          retention-days: 90
