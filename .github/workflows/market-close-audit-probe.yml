name: Temporary market-close audit probe

on:
  push:
    branches: [feat/daily-market-miss-audit-v2c-20260918]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Full repository verification
        run: |
          mkdir -p reports/market-close/logs
          ruff check src tests scripts
          pytest -q
          marketlab validate-registry registry/hypotheses.yaml
      - name: Prepare September 16 official identity snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/market-close/logs
          python - <<'PY'
          from datetime import date
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from run_daily_market_audit import download_udiff
          raw = download_udiff(date(2026, 9, 16), attempts=4, timeout_seconds=45)
          Path("reports/market-close/identity-udiff.zip").write_bytes(raw)
          PY
      - name: Build broad-identity discovery state
        shell: bash
        run: |
          set +e
          python scripts/run_company_news_discovery.py             --store reports/market-close/store             --output reports/market-close/discovery             --identity-udiff reports/market-close/identity-udiff.zip             --identity-session 2026-09-16             --collect | tee reports/market-close/logs/discovery.log
          RC=${PIPESTATUS[0]}
          echo "discovery_rc=$RC" | tee reports/market-close/logs/discovery.rc
          set -e
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 2 ]; then
            exit "$RC"
          fi
      - name: Seal integration-only prospective ledger
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sha256sum reports/market-close/identity-udiff.zip | awk '{print $1}')"
          python scripts/seal_company_news_capture.py             --store reports/market-close/store             --ledger reports/market-close/news-ledger.json             --identity-session 2026-09-16             --identity-raw-sha256 "$SHA" | tee reports/market-close/logs/seal.log
          python scripts/verify_company_news_ledger.py             --ledger reports/market-close/news-ledger.json
      - name: Audit September 17 official NSE session
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_daily_market_audit.py             --session 2026-09-17             --store reports/market-close/audit-store             --output reports/market-close/audit             --news-ledger reports/market-close/news-ledger.json             --liquidity-floor-inr 20000000             --move-threshold-pct 5             --top-abs-movers 25 | tee reports/market-close/logs/market-audit.log
      - name: Preserve source commit
        run: |
          git rev-parse HEAD > reports/market-close/source-commit.txt
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-close-audit-probe-${{ github.run_id }}
          path: reports/market-close
          retention-days: 30
          if-no-files-found: error
