name: H018 apply frozen CNX 500 source compatibility

on:
  push:
    branches:
      - research/h018-promotion-audit-20260908
    paths:
      - .github/workflows/h018-apply-cnx500-source-compat.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h018-promotion-audit-20260908
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repository environment
        run: python -m pip install -e '.[dev]'
      - name: Apply frozen CNX date-delimiter compatibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/h018_checkpoint_market.py')
          text = path.read_text(encoding='utf-8')
          old = '''        parts = str(row.get("Index Date") or "").strip().split("-")\n        if len(parts) != 3 or not all(part.isdigit() for part in parts):\n            raise\n        source_date = date(int(parts[2]), int(parts[1]), int(parts[0]))\n'''
          new = '''        source_token = str(row.get("Index Date") or "").strip()\n        if source_token.count("-") == 2 and "/" not in source_token:\n            delimiter = "-"\n        elif source_token.count("/") == 2 and "-" not in source_token:\n            delimiter = "/"\n        else:\n            raise\n        parts = source_token.split(delimiter)\n        if len(parts) != 3 or not all(part.isdigit() for part in parts):\n            raise\n        source_date = date(int(parts[2]), int(parts[1]), int(parts[0]))\n'''
          if old not in text:
              if new not in text:
                  raise SystemExit('frozen H018 CNX date parser target not found')
          else:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          test = Path('tests/test_h018_source_compat.py')
          test.write_text('''from datetime import date\nimport sys\nfrom pathlib import Path\n\nimport pytest\n\nsys.path.insert(0, str(Path(__file__).resolve().parents[1] / "scripts"))\nimport h018_checkpoint_market as h018\n\n\nHEADER = (\n    "Index Name,Index Date,Open Index Value,High Index Value,Low Index Value,"\n    "Closing Index Value,Points Change,Change(%),Volume,Turnover (Rs. Cr.),P/E,P/B,Div Yield\\n"\n)\n\n\ndef _row(name: str, day: str) -> bytes:\n    return (HEADER + f"{name},{day},6864.15,6944.05,6864.15,6918.05,72.75,1.06,1,1,1,1,1\\n").encode()\n\n\ndef test_h018_accepts_official_cnx500_hyphen_date_before_rename():\n    parsed = h018._parse_nifty500_h018(_row("CNX 500", "28-11-2014"), date(2014, 11, 28))\n    assert parsed == {"open": 6864.15, "close": 6918.05}\n\n\ndef test_h018_accepts_official_cnx500_slash_date_before_rename():\n    parsed = h018._parse_nifty500_h018(_row("CNX 500", "09/06/2014"), date(2014, 6, 9))\n    assert parsed == {"open": 6864.15, "close": 6918.05}\n\n\ndef test_h018_rejects_cnx500_name_on_or_after_rename():\n    with pytest.raises(ValueError):\n        h018._parse_nifty500_h018(_row("CNX 500", "09-11-2015"), date(2015, 11, 9))\n\n\ndef test_h018_rejects_wrong_source_date():\n    with pytest.raises(ValueError):\n        h018._parse_nifty500_h018(_row("CNX 500", "27/11/2014"), date(2014, 11, 28))\n\n\ndef test_h018_rejects_mixed_cnx_date_delimiters():\n    with pytest.raises(ValueError):\n        h018._parse_nifty500_h018(_row("CNX 500", "28/11-2014"), date(2014, 11, 28))\n\n\ndef test_h018_keeps_existing_nifty500_path():\n    parsed = h018._parse_nifty500_h018(_row("Nifty 500", "16-11-2015"), date(2015, 11, 16))\n    assert parsed == {"open": 6864.15, "close": 6918.05}\n''', encoding='utf-8')
          PY
          ruff check --fix scripts/h018_checkpoint_market.py tests/test_h018_source_compat.py
          ruff format scripts/h018_checkpoint_market.py tests/test_h018_source_compat.py
          ruff check scripts/h018_checkpoint_market.py tests/test_h018_source_compat.py
          pytest -q tests/test_h018_source_compat.py
          pytest -q
          marketlab validate-registry registry/hypotheses.yaml
          git diff --check
      - name: Commit verified compatibility repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/h018_checkpoint_market.py tests/test_h018_source_compat.py; then
            echo 'Frozen H018 CNX date compatibility already applied.'
            exit 0
          fi
          git config user.name 'marketlab-research-bot'
          git config user.email 'marketlab-research-bot@users.noreply.github.com'
          git add scripts/h018_checkpoint_market.py tests/test_h018_source_compat.py
          git commit -m 'fix: accept frozen H018 CNX source date formats'
          git push origin HEAD:research/h018-promotion-audit-20260908
