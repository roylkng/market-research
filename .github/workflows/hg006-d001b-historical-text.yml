name: HG006 D001B deterministic historical text corpus

on:
  push:
    branches:
      - research/hg006-historical-text-20261005

permissions:
  actions: read
  contents: read

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[hg006-d001b]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate deterministic text layer
        run: |
          ruff check \
            src/marketlab/hg006_text.py \
            scripts/run_hg006_d001b_shard.py \
            scripts/combine_hg006_d001b_shards.py \
            tests/test_hg006_text.py
          pytest -q \
            tests/test_hg006_text.py \
            tests/test_ss002_text.py \
            tests/test_hg006_documents.py

  extract:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Download exact D001A combined corpus
        uses: actions/download-artifact@v4
        with:
          name: hg006-d001a-combined-37354593321
          path: reports/hg006-d001a-source
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37354593321

      - name: Download exact D001A raw owner shard
        uses: actions/download-artifact@v4
        with:
          name: hg006-d001a-raw-${{ matrix.shard }}-37354593321
          path: reports/hg006-d001a-raw
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37354593321

      - name: Verify passed D001A source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(
              Path(
                  "reports/hg006-d001a-source/hg006-d001a-corpus.json"
              ).read_text()
          )
          assert p["corpus_id"] == "HG006-D001A-P1-v1"
          assert p["feasibility_pass"] is True
          assert p["selected_chronology_count"] == 1043
          assert p["historical_terminal_labels_opened"] is False
          assert p["completion_probabilities_assigned"] is False
          print("source_corpus_sha256=" + p["corpus_sha256"])
          PY

      - name: Extract deterministic text for owner shard
        run: |
          python scripts/run_hg006_d001b_shard.py \
            --d001a-corpus reports/hg006-d001a-source/hg006-d001a-corpus.json \
            --shard-id ${{ matrix.shard }} \
            --raw-root reports/hg006-d001a-raw \
            --output reports/hg006-d001b/shard-${{ matrix.shard }}

      - name: Upload text shard metadata
        uses: actions/upload-artifact@v4
        with:
          name: hg006-d001b-meta-${{ matrix.shard }}-${{ github.run_id }}
          path: reports/hg006-d001b/shard-${{ matrix.shard }}/shard-text-index.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload deterministic document text shard
        uses: actions/upload-artifact@v4
        with:
          name: hg006-d001b-text-${{ matrix.shard }}-${{ github.run_id }}
          path: reports/hg006-d001b/shard-${{ matrix.shard }}/documents
          if-no-files-found: warn
          retention-days: 90

  combine:
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Download exact D001A combined corpus
        uses: actions/download-artifact@v4
        with:
          name: hg006-d001a-combined-37354593321
          path: reports/hg006-d001a-source
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37354593321

      - name: Download only D001B metadata shards
        uses: actions/download-artifact@v4
        with:
          pattern: hg006-d001b-meta-*-${{ github.run_id }}
          path: reports/hg006-d001b/meta
          merge-multiple: false

      - name: Combine deterministic historical text corpus
        run: |
          python scripts/combine_hg006_d001b_shards.py \
            --d001a-corpus reports/hg006-d001a-source/hg006-d001a-corpus.json \
            --shards-root reports/hg006-d001b/meta \
            --output reports/hg006-d001b/combined

      - name: Prove pre-LLM text corpus
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(
              Path(
                  "reports/hg006-d001b/combined/hg006-d001b-text-corpus.json"
              ).read_text()
          )
          assert p["corpus_id"] == "HG006-D001B-v1"
          assert p["historical_terminal_labels_opened"] is False
          assert p["completion_probabilities_assigned"] is False
          assert p["llm_inference_executed"] is False
          assert p["return_outcomes_opened"] is False
          assert p["portfolio_eligibility_allowed"] is False
          print(json.dumps({
              "corpus_sha256": p["corpus_sha256"],
              "source_d001a_corpus_sha256": p["source_d001a_corpus_sha256"],
              "document_count": p["document_count"],
              "hash_reproduced_count": p["hash_reproduced_count"],
              "hash_reproduced_ratio": p["hash_reproduced_ratio"],
              "text_ready_document_count": p["text_ready_document_count"],
              "text_ready_ratio_of_reproduced": p["text_ready_ratio_of_reproduced"],
              "pdf_text_ready_ratio": p["pdf_text_ready_ratio"],
              "segment_count": p["segment_count"],
              "extraction_state_counts": p["extraction_state_counts"],
              "threshold_passes": p["threshold_passes"],
              "feasibility_pass": p["feasibility_pass"],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload combined historical text manifest
        uses: actions/upload-artifact@v4
        with:
          name: hg006-d001b-combined-${{ github.run_id }}
          path: reports/hg006-d001b/combined
          if-no-files-found: error
          retention-days: 90
