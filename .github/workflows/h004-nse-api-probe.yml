name: H004 NSE API probe

on:
  push:
    branches:
      - research/h004-pre-momentum-v1-20260908
    paths:
      - .github/workflows/h004-nse-api-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Probe integrated financial filings and global announcements
        run: |
          python - <<'PY'
          import json
          from marketlab.nse import NSEClient

          client = NSEClient(timeout=20, attempts=4)
          filings = client.integrated_filings(
              from_date='01-08-2026',
              to_date='07-08-2026',
              page=1,
              size=5,
          )
          print('===FILINGS===')
          print(json.dumps(filings, indent=2)[:30000])

          payload, _ = client._json_get_with_raw(
              client.CORPORATE_ANNOUNCEMENT_ENDPOINT,
              params={
                  'index': 'equities',
                  'from_date': '01-08-2026',
                  'to_date': '07-08-2026',
              },
          )
          print('===ANNOUNCEMENTS===')
          print(json.dumps(payload, indent=2)[:30000])
          PY
