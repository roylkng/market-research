name: SS001 D004 official share-count source feasibility

on:
  push:
    branches: [research/ss001-d004-share-count-source-20261008]

permissions:
  actions: read
  contents: read

jobs:
  source:
    if: contains(github.event.head_commit.message, '[ss001-d004]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate frozen parser before opening full source
        run: |
          ruff check src/marketlab/ss001_share_count.py scripts/run_ss001_d004.py tests/test_ss001_share_count.py
          pytest -q tests/test_ss001_share_count.py tests/test_gf001_governance.py
      - name: Download exact GF001 full-market source artifact
        uses: actions/download-artifact@v4
        with:
          name: gf001-d002-37202941712
          path: reports/gf001-source
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37202941712
      - name: Verify source authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/gf001-source/gf001-d002-panel.json").read_text())
          assert p["panel_id"]=="GF001-D002-v1"
          assert p["panel_sha256"]=="dd338cd91f44396278300e27e8cdac1506dae11b63dd31ce827505fe62e8abe7"
          assert p["identity_count"]==2319
          assert p["ready_latest_source_count"]==2050
          assert p["return_outcomes_opened"] is False
          PY
      - name: Run full-market D004 share-count audit
        run: |
          python scripts/run_ss001_d004.py \
            --gf001-panel reports/gf001-source/gf001-d002-panel.json \
            --raw-root reports/gf001-source \
            --out reports/ss001-d004
      - name: Validate outcome-blind output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/ss001-d004/ss001-d004-panel.json").read_text())
          assert p["diagnostic_id"]=="SS001-D004-v1"
          assert p["identity_count"]==2319
          assert p["latest_source_count"]==2050
          assert len(p["rows"])==2319
          assert p["return_outcomes_opened"] is False
          assert p["model_fitted"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          print(json.dumps({k:v for k,v in p.items() if k not in {"rows"}},indent=2,sort_keys=True))
          PY
      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss001-d004-${{ github.run_id }}
          path: reports/ss001-d004
          if-no-files-found: warn
          retention-days: 90
