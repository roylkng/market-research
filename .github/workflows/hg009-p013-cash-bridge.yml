name: HG009 P013 original-source FY26 cashflow reconciliation

on:
  push:
    branches:
      - research/hg009-p013-fy26-cash-use-ledgers-20261016
    paths:
      - .github/workflows/hg009-p013-cash-bridge.yml
      - scripts/inspect_hg009_p013_cash_rows.py
      - src/marketlab/hg009_p013_cash_bridge.py
      - scripts/materialize_hg009_p013.py
      - tests/test_hg009_p013_cash_bridge.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hg009-p013-source-reconciliation
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research package
        run: python -m pip install -e '.[dev]'
      - name: Inspect pinned originals, no downloads or return labels
        run: |
          python scripts/inspect_hg009_p013_cash_rows.py
      - name: Materialize and test source-audited cash uses when implementation present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f src/marketlab/hg009_p013_cash_bridge.py ]; then
            ruff check src/marketlab/hg009_p013_cash_bridge.py scripts/materialize_hg009_p013.py tests/test_hg009_p013_cash_bridge.py
            python scripts/materialize_hg009_p013.py
            python scripts/materialize_hg009_p013.py --check
            pytest -q tests/test_hg009_p013_cash_bridge.py
            git config user.name "marketlab-research-bot"
            git config user.email "marketlab-research-bot@users.noreply.github.com"
            git add research/hg009/hg009-p013-fy26-cash-use-bridge-v1.json
            if ! git diff --cached --quiet; then
              git commit -m "HG009 P013: source-attest original cash use [skip ci]"
              git fetch origin research/hg009-p013-fy26-cash-use-ledgers-20261016
              git rebase origin/research/hg009-p013-fy26-cash-use-ledgers-20261016
              python scripts/materialize_hg009_p013.py --check
              git push origin HEAD:research/hg009-p013-fy26-cash-use-ledgers-20261016
            fi
          fi
