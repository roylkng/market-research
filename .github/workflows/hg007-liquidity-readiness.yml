name: HG007 five-case 20-session liquidity readiness overlay

on:
  pull_request:
    paths:
      - src/marketlab/hg007_liquidity_readiness.py
      - scripts/build_hg007_liquidity_readiness.py
      - tests/test_hg007_liquidity_readiness.py
      - .github/workflows/hg007-liquidity-readiness.yml
  push:
    branches:
      - main
    paths:
      - src/marketlab/hg007_liquidity_readiness.py
      - scripts/build_hg007_liquidity_readiness.py
      - tests/test_hg007_liquidity_readiness.py
      - .github/workflows/hg007-liquidity-readiness.yml

permissions:
  contents: write

concurrency:
  group: hg007-frozen-five-case-liquidity-readiness
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify source hashes and five-case economic invariants
        run: |
          ruff check src/marketlab/hg007_liquidity_readiness.py scripts/build_hg007_liquidity_readiness.py tests/test_hg007_liquidity_readiness.py
          pytest -q tests/test_hg007_liquidity_readiness.py
      - name: Reproduce original 20-session liquidity in all five research cases
        run: |
          python scripts/build_hg007_liquidity_readiness.py \
            --repo-root . \
            --out /tmp/hg007-five-case-20day-readiness-v1.json
          test -s /tmp/hg007-five-case-20day-readiness-v1.json
      - name: Publish immutable source-only overlay after successful merge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          TARGET="research/hg007/hg007-p037-five-case-20day-liquidity-readiness-v1.json"
          if [[ -f "$TARGET" ]]; then
            python scripts/build_hg007_liquidity_readiness.py \
              --out "$TARGET" --verify-existing
            exit 0
          fi
          cp /tmp/hg007-five-case-20day-readiness-v1.json "$TARGET"
          git config user.name marketlab-research-bot
          git config user.email marketlab-research-bot@users.noreply.github.com
          git add "$TARGET"
          git commit -m "HG007: source-pin 20d turnover to five original underwritings [skip ci]"
          BASE_SHA="$(git rev-parse HEAD^)"
          for TRY in 1 2 3; do
            git fetch origin main
            MAIN_SHA="$(git rev-parse origin/main)"
            if git cat-file -e "origin/main:$TARGET" 2>/dev/null; then
              echo "Existing complete liquidity overlay: refuse competing overwrite"
              exit 1
            fi
            if ! git diff --quiet "$BASE_SHA" "$MAIN_SHA" -- \
              research/hg007/hg007-p033-five-case-sambhv-source-timing-v1.json \
              research/hg007/hg007-p035-five-case-liquidity-friction-v1.json \
              research/hg007/twenty-session-liquidity \
              src/marketlab/hg007_liquidity_readiness.py; then
              echo "Original underwriting/market data changed during integration"
              exit 1
            fi
            if [[ "$MAIN_SHA" != "$BASE_SHA" ]]; then
              git rebase origin/main
              BASE_SHA="$MAIN_SHA"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((TRY*2))"
          done
          exit 1
      - name: Preserve source-cited research result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hg007-five-case-twenty-day-source-liquidity
          path: /tmp/hg007-five-case-20day-readiness-v1.json
          if-no-files-found: ignore
          retention-days: 90
