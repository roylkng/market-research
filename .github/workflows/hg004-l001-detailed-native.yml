name: HG004 L001 detailed native term extraction

on:
  push:
    branches:
      - research/hg004-l001-execution-20261005

permissions:
  actions: read
  contents: read

jobs:
  extract:
    if: contains(github.event.head_commit.message, '[hg004-l001]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate frozen detailed extraction implementation
        run: |
          ruff check \
            scripts/materialize_hg004_l001_native.py \
            src/marketlab/ss002_llm_contract.py
          pytest -q \
            tests/test_ss002_llm_contract.py \
            tests/test_hg004_terms.py

      - name: Download exact HG004 D001 P1 selection
        uses: actions/download-artifact@v4
        with:
          name: hg004-d001-37283860083
          path: reports/hg004-selection
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37283860083

      - name: Verify frozen HG004 selection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(
              Path("reports/hg004-selection/hg004-d001-selection.json").read_text()
          )
          assert p["selection_id"] == "HG004-D001-P1-v1"
          assert p["selection_sha256"] == (
              "9b82b337b02d5aa2c58164bf888f76ce50fcd34680077f87f13b0ff5cfc7c102"
          )
          assert p["symbol_count"] == 11
          assert p["semantic_cluster_count"] == 11
          assert p["event_link_count"] == 20
          assert p["unique_document_count"] == 19
          assert p["return_outcomes_opened"] is False
          PY

      - name: Materialize evidence-bound detailed term run
        run: |
          mkdir -p reports/hg004-l001
          python scripts/materialize_hg004_l001_native.py \
            --selection reports/hg004-selection/hg004-d001-selection.json \
            --output reports/hg004-l001

      - name: Prove frozen gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path("reports/hg004-l001/summary.json").read_text())
          assert p["run_id"] == "HG004-L001-GPT56SOL-NATIVE-v1"
          assert p["status"] == "PASSED_DETAILED_TERM_EXTRACTION"
          assert p["validated_output_count"] == 19
          assert p["manual_audit"]["audited_document_count"] == 19
          assert p["manual_audit"]["unsupported_material_fact_count"] == 0
          assert p["manual_audit"]["unretained_material_contradiction_count"] == 0
          assert p["manual_audit"]["material_explicit_term_missed_count"] <= 2
          assert p["promotion_allowed_to_l002"] is True
          assert p["return_outcomes_opened"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          print(json.dumps(p, indent=2, sort_keys=True))
          PY

      - name: Upload exact HG004 L001 evidence
        uses: actions/upload-artifact@v4
        with:
          name: hg004-l001-${{ github.run_id }}
          path: reports/hg004-l001
          if-no-files-found: error
          retention-days: 90
