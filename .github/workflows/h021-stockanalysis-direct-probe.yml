name: H021 StockAnalysis direct source probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/h021-stockanalysis-direct-probe-20260914
    paths:
      - 'src/marketlab/h021_stockanalysis_probe.py'
      - 'scripts/probe_h021_stockanalysis_direct.py'
      - 'tests/test_h021_stockanalysis_probe.py'
      - 'research/prospective/h021/stockanalysis-direct-probe-v1.json'
      - '.github/workflows/h021-stockanalysis-direct-probe.yml'
    paths-ignore:
      - 'reports/h021-stockanalysis-direct-probe/**'

permissions:
  contents: write

concurrency:
  group: h021-stockanalysis-direct-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate direct-probe invariants
        run: pytest -q tests/test_h021_stockanalysis_probe.py

      - name: Run robots-aware direct source probe
        id: direct_probe
        shell: bash
        run: |
          set +e
          OUT="reports/h021-stockanalysis-direct-probe/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}.json"
          python scripts/probe_h021_stockanalysis_direct.py \
            --config research/prospective/h021/stockanalysis-direct-probe-v1.json \
            --out "$OUT"
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "report_path=$OUT" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Anchor source-only probe evidence
        if: always()
        shell: bash
        run: |
          OUT="${{ steps.direct_probe.outputs.report_path }}"
          if [ -z "$OUT" ] || [ ! -f "$OUT" ]; then
            echo "No direct-probe report was produced"
            exit 1
          fi
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then
            echo "No probe evidence changed"
          else
            git commit -m "H021: anchor StockAnalysis direct probe ${GITHUB_RUN_ID} [skip ci]"
            git push origin HEAD:research/h021-stockanalysis-direct-probe-20260914
          fi

      - name: Upload source-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h021-stockanalysis-direct-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.direct_probe.outputs.report_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Enforce probe result
        if: always()
        shell: bash
        run: |
          test "${{ steps.direct_probe.outputs.exit_code }}" = "0"
