  source_bytes_required: true
  official_broadcast_timestamp_required: true
  legacy_and_integrated_xbrl_use_same_normalized_core_concepts: true

signal:
  expectation_model: seasonal_same_quarter_basic_eps_v1
  formula: ue = (actual_basic_eps - prior_year_same_quarter_basic_eps * corporate_action_factor) / price_day_minus_2
  buckets:
    positive: ue > 0
    zero: ue == 0
    negative: ue < 0
  missing_input: NO_SIGNAL
  learned_thresholds: forbidden

execution:
  entry_delay_sessions: 2
  holding_period_sessions: 20
  entry_price: open
  exit_price: close
