name: SS002 L001 native pilot validation

on:
  push:
    branches:
      - research/ss002-l001-native-pilot-run-20261005

permissions:
  actions: read
  contents: read

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[ss002-l001-native]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate native pilot materializer
        run: |
          ruff check \
            scripts/materialize_ss002_l001_native_pilot.py \
            src/marketlab/ss002_llm_contract.py
          pytest -q \
            tests/test_ss002_llm_contract.py \
            tests/test_ss002_l001_pilot.py

      - name: Download exact frozen L001 pilot selection
        uses: actions/download-artifact@v4
        with:
          name: ss002-l001-p1-selection-37224191432
          path: reports/l001-selection
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37224191432

      - name: Verify frozen selection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/l001-selection/ss002-l001-p1-selection.json").read_text())
          assert p["selection_id"]=="SS002-L001-P1-SELECTION-v1"
          assert p["selection_sha256"]=="c040c519b8d28344a607838d2f025555b92fb9391582855e2dab7323aa805bc0"
          assert p["selected_document_count"]==30
          assert all(v==6 for v in p["family_counts"].values())
          assert p["return_outcomes_opened"] is False
          PY

      - name: Materialize frozen GPT-5.6 Sol native pilot outputs
        run: |
          python scripts/materialize_ss002_l001_native_pilot.py \
            --selection reports/l001-selection/ss002-l001-p1-selection.json \
            --output reports/l001-native-run

      - name: Prove frozen pilot gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/l001-native-run/summary.json").read_text())
          assert p["pilot_id"]=="SS002-L001-P1-v1"
          assert p["selected_document_count"]==30
          assert p["validated_output_count"]==30
          assert all(p["mechanical_gates"].values())
          assert p["manual_audit_pass"] is True
          assert p["promotion_allowed"] is True
          assert p["return_outcomes_opened"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          print(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Upload exact native pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss002-l001-native-${{ github.run_id }}
          path: reports/l001-native-run
          if-no-files-found: warn
          retention-days: 90
