covariance:
  factor_count: 11
  trailing_realized_sessions: 60
  estimator: sample_covariance
  ddof: 1
  retain_named_stat_cross_covariance: true
  shrinkage: none

idiosyncratic:
  trailing_post_pc_residual_sessions: 60
  complete_stat_history: post_pc_residual_sample_variance_ddof_1
  incomplete_stat_history: exact_rm001_v2_variance
  imputation: none

deferred_factors:
  sector: POINT_IN_TIME_COMPANY_CLASSIFICATION_SOURCE_NOT_FROZEN

promotion:
  historical_po001_challenger_allowed: true
  prospective_use_requires_separate_protocol: true
  live_capital_directly_allowed: false
