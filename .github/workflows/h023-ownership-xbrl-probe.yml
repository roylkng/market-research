name: H023 ownership XBRL probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/h023-ownership-source-probe-v1-20260914
    paths:
      - '.github/workflows/h023-ownership-xbrl-probe.yml'
      - 'scripts/probe_h023_nse_shareholding.py'
      - 'scripts/probe_h023_nse_shareholding_xbrl.py'

permissions:
  contents: write

concurrency:
  group: h023-ownership-xbrl-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Lint probe
        run: |
          ruff check \
            scripts/probe_h023_nse_shareholding.py \
            scripts/probe_h023_nse_shareholding_xbrl.py

      - name: Acquire official NSE shareholding master responses
        shell: bash
        run: |
          set -euo pipefail
          WORK="reports/h023-ownership-xbrl-probe/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$WORK"
          python scripts/probe_h023_nse_shareholding.py \
            --out-dir "$WORK/source" \
            --attempts 4 \
            --pause-seconds 0.35
          echo "work_dir=$WORK" >> "$GITHUB_ENV"

      - name: Probe official XBRL category semantics
        shell: bash
        run: |
          set -euo pipefail
          test -n "${work_dir:-}"
          python scripts/probe_h023_nse_shareholding_xbrl.py \
            --raw-dir "$work_dir/source/raw" \
            --out "$work_dir/xbrl-report.json" \
            --max-filings-per-symbol 6 \
            --attempts 4 \
            --pause-seconds 0.25

      - name: Retain compact source-only evidence on branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/probes/h023
          cp "$work_dir/source/report.json" \
            research/probes/h023/nse-shareholding-source-probe-v1.json
          cp "$work_dir/xbrl-report.json" \
            research/probes/h023/nse-shareholding-xbrl-probe-v1.json
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/probes/h023
          if ! git diff --cached --quiet; then
            git commit -m "H023: anchor NSE shareholding XBRL source probe [skip ci]"
            git push origin HEAD:research/h023-ownership-source-probe-v1-20260914
          fi

      - name: Upload raw official source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h023-ownership-xbrl-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/h023-ownership-xbrl-probe
          if-no-files-found: error
          retention-days: 90
