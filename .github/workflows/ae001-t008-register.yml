name: AE001 T008 trial registration

on:
  push:
    branches:
      - feat/ae001-t008-fundamental-alpha-20260930

permissions:
  contents: write

jobs:
  register:
    if: contains(github.event.head_commit.message, '[t008-register]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Register frozen T008 before outcomes
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path

          from marketlab.alpha_trials import (
              append_trial_event,
              trial_state,
              validate_trial_ledger,
          )

          path = Path("research/ae001/trial-ledger.json")
          ledger = json.loads(path.read_text(encoding="utf-8"))
          validate_trial_ledger(ledger)
          try:
              trial_state(ledger, "AE001-T008")
          except Exception:
              pass
          else:
              raise SystemExit("AE001-T008 already registered")

          payload = {
              "name": "fundamental_growth_profitability_incremental_alpha",
              "status": "FROZEN_BEFORE_OUTCOME_MATERIALIZATION",
              "research_class": "HISTORICAL_RECONSTRUCTION_DEVELOPMENT",
              "source_panel": {
                  "diagnostic_id": "AE001-T008-D004-v1",
                  "run_id": 36748060295,
                  "artifact_id": 11112604385,
                  "panel_sha256": "35ba8ea6bb87c9c9e39f79b6f9479114d96535cfefecffed4f713b1a362cb5c5",
                  "event_count": 369,
              },
              "base_features": "CORE27",
              "augmented_features": "CORE33_FUND",
              "fundamental_feature_names": [
                  "revenue_yoy",
                  "pbt_change_to_prior_revenue",
                  "total_profit_change_to_prior_revenue",
                  "pbt_margin",
                  "pbt_margin_delta_yoy",
                  "total_profit_margin_delta_yoy",
              ],
              "fundamental_transform": "PURGED_TRAINING_EMPIRICAL_PERCENTILE",
              "same_quarter_cross_sectional_rank": "PROHIBITED",
              "model": {"type": "ridge", "l2": 1.0},
              "primary": {
                  "horizon_sessions": 20,
                  "success_rule": "ALL_8_FROZEN_INCREMENTAL_CONDITIONS",
              },
              "secondary": {
                  "horizon_sessions": 5,
                  "may_rescue_failed_primary": False,
              },
              "excluded_horizons": [1, 60],
              "folds": [
                  {
                      "fold": 1,
                      "validation_target_period": "2026-03-31",
                      "training_target_periods": ["2025-09-30", "2025-12-31"],
                  },
                  {
                      "fold": 2,
                      "validation_target_period": "2026-06-30",
                      "training_target_periods": [
                          "2025-09-30",
                          "2025-12-31",
                          "2026-03-31",
                      ],
                  },
              ],
              "purge_rule": "TRAIN_EXIT_STRICTLY_BEFORE_EARLIEST_VALIDATION_DECISION_SESSION",
              "minimum_purged_training_events": 100,
              "minimum_validation_events": 60,
              "evaluation": {
                  "rank_ic": "SPEARMAN_EVENT_LEVEL",
                  "spread": "TOP_MINUS_BOTTOM_QUINTILE",
                  "quintile_share": 0.20,
                  "bootstrap_cluster": "DECISION_ISO_WEEK",
                  "bootstrap_repetitions": 10000,
                  "bootstrap_seed": 20260930,
                  "minimum_valid_bootstrap_repetitions": 9500,
              },
              "market_support_window": ["2025-06-01", "2026-09-30"],
              "historical_delivery_publication_timing_verified": False,
              "outcomes_opened_before_registration": False,
              "live_capital_allowed": False,
          }

          updated = append_trial_event(
              ledger,
              event_type="TRIAL_REGISTERED",
              trial_id="AE001-T008",
              recorded_at_utc=datetime.now(UTC).isoformat(),
              payload=payload,
          )
          path.write_text(
              json.dumps(
                  updated,
                  indent=2,
                  sort_keys=True,
                  ensure_ascii=False,
                  allow_nan=False,
              )
              + "\n",
              encoding="utf-8",
          )
          validate_trial_ledger(updated)
          print("T008_EVENT_SHA", updated["events"][-1]["event_sha256"])
          print("LEDGER_SHA", updated["ledger_sha256"])
          PY

      - name: Commit registration
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/ae001/trial-ledger.json
          git commit -m "research: register frozen AE001 T008 trial [skip ci]"
          git push origin HEAD:feat/ae001-t008-fundamental-alpha-20260930
