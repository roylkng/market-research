name: AE001 SC003 previous-session futures pre-open timing

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Redundant target-evening / overnight / pre-open probes.
    # All cron values are UTC. Actual capture timestamp remains authoritative.
    # IST: 21:13, 21:43, 22:13, 22:43, 23:13, 23:43.
    - cron: '43 15 * * *'
    - cron: '13 16 * * *'
    - cron: '43 16 * * *'
    - cron: '13 17 * * *'
    - cron: '43 17 * * *'
    - cron: '13 18 * * *'
    # IST next calendar day: 01:33, 03:33, 06:03, 07:03, 07:33,
    # 08:03, 08:18.
    - cron: '3 20 * * *'
    - cron: '3 22 * * *'
    - cron: '33 0 * * *'
    - cron: '33 1 * * *'
    - cron: '3 2 * * *'
    - cron: '33 2 * * *'
    - cron: '48 2 * * *'

permissions:
  contents: write

concurrency:
  group: ae001-sc003-preopen-futures-timing
  cancel-in-progress: false

jobs:
  probe:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh latest canonical main before observation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach origin/main
          echo "OBSERVATION_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify SC003 implementation before source access
        run: |
          ruff check \
            src/marketlab/alpha_sc003_preopen.py \
            scripts/probe_ae001_sc003.py \
            scripts/verify_ae001_sc003.py \
            tests/test_alpha_sc003_preopen.py
          pytest -q \
            tests/test_alpha_sc003_preopen.py \
            tests/test_alpha_prospective_futures_sources.py \
            tests/test_alpha_futures.py
          python scripts/verify_ae001_sc003.py \
            --ledger research/prospective/ae001-sc003/source-ledger.json \
            --summary research/prospective/ae001-sc003/readiness-summary.json

      - name: Resolve frozen start boundary
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=Asia/Kolkata date +%F)"
          if [[ "$TODAY" < "2026-10-02" ]]; then
            STATE="BEFORE_START"
          else
            STATE="READY"
          fi
          echo "date=$TODAY" >> "$GITHUB_OUTPUT"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "SC003-P1 gate: local_date=$TODAY event=${{ github.event_name }} state=$STATE"

      - name: Probe latest SC001 target against next frozen trading morning
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/probe_ae001_sc003.py \
            --calendar research/prospective/calendars/FY27-Q2-2026-09-06/NSE-CM-FY27Q2-v1.json \
            --sc001-ledger research/prospective/ae001-sc001/source-ledger.json \
            --sc003-ledger research/prospective/ae001-sc003/source-ledger.json \
            --summary research/prospective/ae001-sc003/readiness-summary.json \
            --attempts 4 \
            --timeout-seconds 30 | tee sc003-probe.json
          python scripts/verify_ae001_sc003.py \
            --ledger research/prospective/ae001-sc003/source-ledger.json \
            --summary research/prospective/ae001-sc003/readiness-summary.json

      - name: Anchor append-only SC003 evidence
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          LEDGER="research/prospective/ae001-sc003/source-ledger.json"
          SUMMARY="research/prospective/ae001-sc003/readiness-summary.json"
          python scripts/verify_ae001_sc003.py \
            --ledger "$LEDGER" \
            --summary "$SUMMARY"

          START_SHA="$OBSERVATION_BASE_SHA"

          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/prospective/ae001-sc003
          if git diff --cached --quiet; then
            echo "No new SC003 evidence to anchor"
            exit 0
          fi

          git commit -m "AE001 SC003: seal trading-calendar pre-open futures probe [skip ci]"

          CRITICAL_PATHS=(
            ".github/workflows/ae001-sc003-preopen-futures-timing.yml"
            "research/AE001_SC003_PREOPEN_FUTURES_SOURCE_TIMING_V1.md"
            "research/AE001_SC003_PROTOCOL_AMENDMENT_P1_TRADING_CALENDAR_CUTOFF.md"
            "research/prospective/calendars/FY27-Q2-2026-09-06/NSE-CM-FY27Q2-v1.json"
            "research/prospective/ae001-sc001"
            "research/prospective/ae001-sc003"
            "src/marketlab/alpha_sc003_preopen.py"
            "scripts/probe_ae001_sc003.py"
            "scripts/verify_ae001_sc003.py"
          )

          for ATTEMPT in 1 2 3; do
            git fetch origin main
            CURRENT_MAIN="$(git rev-parse origin/main)"
            if [ "$START_SHA" != "$CURRENT_MAIN" ]; then
              if ! git diff --quiet "$START_SHA" "$CURRENT_MAIN" -- "${CRITICAL_PATHS[@]}"; then
                echo "SC003 rules/calendar/canonical state changed while observation was in flight"
                git diff --stat "$START_SHA" "$CURRENT_MAIN" -- "${CRITICAL_PATHS[@]}"
                exit 1
              fi
              git rebase origin/main
              python scripts/verify_ae001_sc003.py \
                --ledger "$LEDGER" \
                --summary "$SUMMARY"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((ATTEMPT * 2))
          done
          echo "Unable to anchor SC003 evidence after bounded retries"
          exit 1

      - name: Report pre-start probe
        if: steps.gate.outputs.state != 'READY'
        run: echo "SC003 has not reached its frozen start boundary"
