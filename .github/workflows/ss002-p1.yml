name: SS002 P1 current actionable census

on:
  push:
    branches:
      - research/ss002-p1-current-actionable-20261004

permissions:
  actions: read
  contents: read

jobs:
  materialize:
    if: contains(github.event.head_commit.message, '[ss002-p1]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate frozen P1 implementation
        run: |
          ruff check \
            src/marketlab/ss002_p1.py \
            scripts/materialize_ss002_p1.py \
            tests/test_ss002_p1.py
          pytest -q \
            tests/test_ss002_p1.py \
            tests/test_ss002_special_situations.py

      - name: Download exact failed D001 source census
        uses: actions/download-artifact@v4
        with:
          name: ss002-d001-37200055447
          path: reports/ss002-d001-source
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37200055447

      - name: Verify exact D001 input
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          census = json.loads(
              Path("reports/ss002-d001-source/ss002-d001-census.json").read_text()
          )
          assert census["census_id"] == "SS002-D001-v1"
          assert census["census_sha256"] == (
              "0e831d4ce29d03e6916d4e244d177f2ee1451ce98d35c0a37e50e0e79b12fa54"
          )
          assert census["candidate_event_count"] == 6435
          assert census["return_outcomes_opened"] is False
          assert census["feasibility_pass"] is False
          PY

      - name: Materialize frozen P1 census
        run: |
          mkdir -p reports/ss002-p1
          python scripts/materialize_ss002_p1.py \
            --d001-census reports/ss002-d001-source/ss002-d001-census.json \
            --out reports/ss002-p1/ss002-d001-p1-census.json

      - name: Prove source-only P1 output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          census = json.loads(
              Path("reports/ss002-p1/ss002-d001-p1-census.json").read_text()
          )
          assert census["census_id"] == "SS002-D001-P1-v1"
          assert census["event_count"] == 6435
          assert census["return_outcomes_opened"] is False
          assert census["model_fitted"] is False
          assert census["portfolio_eligibility_allowed"] is False
          assert census["live_capital_allowed"] is False
          print(json.dumps({
              "census_sha256": census["census_sha256"],
              "category_counts": census["category_counts"],
              "actionability_state_counts": census["actionability_state_counts"],
              "current_actionable_primary_event_count": census["current_actionable_primary_event_count"],
              "current_actionable_primary_symbol_count": census["current_actionable_primary_symbol_count"],
              "current_actionable_primary_attachment_ready_count": census["current_actionable_primary_attachment_ready_count"],
              "threshold_passes": census["threshold_passes"],
              "feasibility_pass": census["feasibility_pass"],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload exact P1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: ss002-p1-${{ github.run_id }}
          path: reports/ss002-p1
          if-no-files-found: error
          retention-days: 90
