name: HG007 Sambhv original steel/power conditional CAPEX sensitivity

on:
  pull_request:
    paths:
      - src/marketlab/hg007_sambhv_phase1_sensitivity.py
      - scripts/reconcile_hg007_sambhv_steel_power.py
      - tests/test_hg007_sambhv_phase1_sensitivity.py
      - .github/workflows/hg007-sambhv-phase1-sensitivity.yml
  push:
    branches:
      - main
    paths:
      - src/marketlab/hg007_sambhv_phase1_sensitivity.py
      - scripts/reconcile_hg007_sambhv_steel_power.py
      - tests/test_hg007_sambhv_phase1_sensitivity.py
      - .github/workflows/hg007-sambhv-phase1-sensitivity.yml

permissions:
  contents: write

concurrency:
  group: hg007-sambhv-source-verified-conditional-capex
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify original P016 document and HG005 scenario ancestry
        run: |
          ruff check src/marketlab/hg007_sambhv_phase1_sensitivity.py scripts/reconcile_hg007_sambhv_steel_power.py tests/test_hg007_sambhv_phase1_sensitivity.py
          pytest -q tests/test_hg007_sambhv_phase1_sensitivity.py
      - name: Produce source-anchored alternative CAPEX scenarios
        run: |
          python scripts/reconcile_hg007_sambhv_steel_power.py \
            --repo-root . \
            --out /tmp/hg007-p017-sambhv-source-capex-v1.json
          test -s /tmp/hg007-p017-sambhv-source-capex-v1.json
      - name: Anchor immutable result after merge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          TARGET="research/hg007/sambhv-aug2026-investor/phase1-steel-power-capex-v1.json"
          if [[ -f "$TARGET" ]]; then
            python scripts/reconcile_hg007_sambhv_steel_power.py \
              --out "$TARGET" --verify-existing
            exit 0
          fi
          cp /tmp/hg007-p017-sambhv-source-capex-v1.json "$TARGET"
          git config user.name marketlab-research-bot
          git config user.email marketlab-research-bot@users.noreply.github.com
          git add "$TARGET"
          git commit -m "HG007: anchor original Sambhv steel-only and power-inclusive capital sensitivity [skip ci]"
          BASE_SHA="$(git rev-parse HEAD^)"
          for RETRY in 1 2 3; do
            git fetch origin main
            NEW_MAIN="$(git rev-parse origin/main)"
            if git cat-file -e "origin/main:$TARGET" 2>/dev/null; then
              echo "Sambhv source-sensitivity packet already exists; refuse overwrite"
              exit 1
            fi
            if ! git diff --quiet "$BASE_SHA" "$NEW_MAIN" -- \
              research/hg007/sambhv-aug2026-investor/source-receipt-v1.json \
              research/hg007/sambhv-aug2026-investor/raw \
              research/hg005-d001-result-v1.json \
              research/hg005-d003-result-v1.json \
              scripts/acquire_hg007_sambhv_original.py \
              src/marketlab/hg007_sambhv_phase1_sensitivity.py; then
              echo "Frozen source, model or original assumptions changed"
              exit 1
            fi
            if [[ "$NEW_MAIN" != "$BASE_SHA" ]]; then
              git rebase origin/main
              BASE_SHA="$NEW_MAIN"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((RETRY*2))"
          done
          echo "Could not durably publish source-only conditional capital result"
          exit 1
      - name: Preserve original document-linked review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hg007-sambhv-steel-and-captive-power-source-review
          path: /tmp/hg007-p017-sambhv-source-capex-v1.json
          if-no-files-found: ignore
          retention-days: 90
