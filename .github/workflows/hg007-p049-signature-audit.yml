name: HG007 P049 legacy signature audit v2

on:
  push:
    branches:
      - fix/hg007-p049-legacy-signature-audit-v2-20261015
    paths:
      - .github/workflows/hg007-p049-signature-audit.yml
      - src/marketlab/hg007_p049_signature_audit.py
      - scripts/audit_hg007_p049_signature.py
      - tests/test_hg007_p049_signature_audit.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hg007-p049-v2-source-integrity-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate original Git blob and v2 canonical SHA
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python scripts/audit_hg007_p049_signature.py
          python scripts/audit_hg007_p049_signature.py --check
          ruff check src/marketlab/hg007_p049_signature_audit.py scripts/audit_hg007_p049_signature.py tests/test_hg007_p049_signature_audit.py
          pytest -q tests/test_hg007_p049_signature_audit.py
      - name: Anchor separate canonical v2 while preserving original P049
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/hg007/hg007-p049-legacy-signature-audit-v2.json
          if git diff --cached --quiet; then
            echo "Legacy SHA audit already sealed"
            exit 0
          fi
          git commit -m "HG007 P049: anchor canonical v2 integrity audit without historical rewrite [skip ci]"
          git fetch origin fix/hg007-p049-legacy-signature-audit-v2-20261015
          git rebase origin/fix/hg007-p049-legacy-signature-audit-v2-20261015
          python scripts/audit_hg007_p049_signature.py --check
          git push origin HEAD:fix/hg007-p049-legacy-signature-audit-v2-20261015
