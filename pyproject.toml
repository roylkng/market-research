[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "marketlab"
version = "0.1.0"
description = "Research harness for falsifiable Indian equity-market experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "numpy>=2.0",
  "pandas>=2.2",
  "pypdf==6.17.0",
  "pyyaml>=6.0",
  "requests>=2.32",
  "scipy>=1.14",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
marketlab = "marketlab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/marketlab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/marketlab/h002_historical.py" = ["I001"]
