name: AE001 T009 options source materialization

on:
  push:
    branches:
      - feat/ae001-t009-stock-options-positioning-20261001

permissions:
  contents: read

jobs:
  source:
    if: contains(github.event.head_commit.message, '[t009-source]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify T009 source implementation before source access
        run: |
          ruff check \
            src/marketlab/alpha_options.py \
            scripts/build_ae001_options_features.py \
            tests/test_alpha_options.py \
            tests/test_alpha_options_source_d006.py
          pytest -q \
            tests/test_alpha_options_source.py \
            tests/test_alpha_options_source_d006.py \
            tests/test_alpha_options.py

      - name: Rebuild fixed official NSE market panel
        run: |
          python scripts/build_ae001_historical_panel.py \
            --start-date 2025-09-01 \
            --end-date 2026-09-25 \
            --store .marketlab/ae001-t009 \
            --output reports/ae001-t009/panel \
            --attempts 4 \
            --timeout-seconds 30 \
            --pause-seconds 0.05

      - name: Rebuild action-safe base from exact pinned T003 ledger
        run: |
          python scripts/build_ab001_p001_action_safe.py \
            --market-panel reports/ae001-t009/panel/market-panel.json.gz \
            --feature-panel reports/ae001-t009/panel/feature-panel.json.gz \
            --action-ledger research/ab001-p001/inputs/t003-corporate-action-ledger.json.gz \
            --action-ledger-manifest research/ab001-p001/inputs/t003-corporate-action-ledger.manifest.json \
            --output reports/ae001-t009/action-safe

      - name: Rebuild reusable delivery features
        run: |
          python scripts/build_ae001_delivery_features.py \
            --market-panel reports/ae001-t009/panel/market-panel.json.gz \
            --feature-panel reports/ae001-t009/action-safe/action-safe-feature-panel.json.gz \
            --store .marketlab/ae001-t009 \
            --output reports/ae001-t009/delivery \
            --attempts 4 \
            --timeout-seconds 30

      - name: Rebuild sealed T005 futures 37-feature panel
        run: |
          python scripts/build_ae001_futures_features.py \
            --market-panel reports/ae001-t009/panel/market-panel.json.gz \
            --feature-panel reports/ae001-t009/delivery/delivery-feature-panel.json.gz \
            --store .marketlab/ae001-t009 \
            --output reports/ae001-t009/futures \
            --attempts 4 \
            --timeout-seconds 30

      - name: Materialize T009 options source and 47-feature panel
        run: |
          python scripts/build_ae001_options_features.py \
            --market-panel reports/ae001-t009/panel/market-panel.json.gz \
            --feature-panel reports/ae001-t009/futures/futures-feature-panel.json.gz \
            --store .marketlab/ae001-t009 \
            --output reports/ae001-t009/options \
            --attempts 4 \
            --timeout-seconds 30

      - name: Print source-only result
        run: cat reports/ae001-t009/options/manifest.json

      - name: Upload exact T009 source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae001-t009-source-${{ github.run_id }}
          path: |
            reports/ae001-t009
            .marketlab/ae001-t009/market-data
          if-no-files-found: warn
          retention-days: 90
