version: 1
live_capital_allowed: false

hypotheses:
  - id: H001
    name: raw_earnings_acceleration
    created: 2026-09-06
    status: REJECTED
    mechanism: >-
      Companies with stronger year-on-year sales growth, operating-profit growth,
      and margin expansion should outperform after the immediate earnings reaction.
    universe:
      market: India
      type: liquid_non_financial_equities
    signal:
      formula: sales_yoy_pct + op_profit_yoy_pct + 5 * opm_change_pp
    decision:
      entry_delay_sessions: 2
      holding_period_sessions: 20
    benchmarks:
      - nifty_50
      - nifty_200_momentum_30
    result:
      pearson_excess_vs_nifty: 0.066
      pearson_p_value: 0.758
      spearman_excess_vs_nifty: 0.035
      spearman_p_value: 0.872
    conclusion: >-
      Raw accounting growth is not a sufficient proxy for information surprise.
      The signal had essentially zero relationship with subsequent excess return.
    live_capital: false

  - id: H002
    name: positive_unexpected_earnings_pead
    created: 2026-09-06
    status: FROZEN
    mechanism: >-
      Positive unexpected earnings may be incorporated into Indian equity prices
      gradually, producing post-earnings-announcement drift.
    universe:
      market: India
      type: frozen_rule
      rule_id: U001
      prospective_only: true
    signal:
      rule_id: H002-R001
      rule_file: registry/h002_signal_rule.yaml
      expectation_model_version: seasonal_same_quarter_basic_eps_v1
      expectation_formula: expected_eps = prior_year_same_quarter_basic_eps * corporate_action_factor
      signal_version: ue_price_normalized_v1
      formula: (actual_basic_eps - expected_eps) / price_day_minus_2
      literature_style: true
      winsorization: none
      buckets:
        positive: ue > 0
        zero: ue == 0
        negative: ue < 0
        missing_input: NO_SIGNAL
      prohibited_factors:
        - momentum
        - valuation
        - guidance_or_llm_score
        - arbitrary_optimized_weights
    decision:
      execution_rule_id: H002-X001
      execution_rule_file: registry/h002_execution_rule.yaml
      entry_delay_sessions: 2
      holding_period_sessions: 20
      entry_price: exact_second_subsequent_session_open
      exit_price: exact_20th_holding_session_close
      paper_only: true
    benchmarks:
      - nifty_50
      - nifty_200_momentum_30
    feasibility_status: INCONCLUSIVE
    feasibility_result:
      exact_return_observations: 24
      positive_ue_observations: 16
      negative_ue_observations: 8
      positive_ue_mean_excess_pp: 1.99
      negative_ue_mean_excess_pp: -1.17
      positive_minus_negative_spread_pp: 3.16
      spread_p_value: 0.233
      positive_ue_beat_rate: 0.625
      negative_ue_beat_rate: 0.375
      bootstrap_95_ci_pp: [-1.67, 7.96]
      ranked_ue_top_quintile_excess_pp: -2.58
      ranked_ue_bottom_quintile_excess_pp: -1.80
    conclusion: >-
      Ranked UE magnitude did not replicate in this small feasibility pilot.
      UE sign moved in the economically expected direction, but uncertainty and
      winner dependence are too large for a tradable conclusion. The prospective
      signal and paper-execution rules are frozen without implying validation.
    next_action: prospective_paper_test
    live_capital: false

  - id: H003
    name: prior_management_delivery_credibility
    created: 2026-09-06
    status: FROZEN
    mechanism: >-
      A documented history of management delivering earlier measurable operating
      commitments may contain persistent execution-quality information that the
      market does not fully price immediately.
    universe:
      market: India
      type: frozen_rule
      rule_id: U001
      prospective_only: true
    signal:
      formula: MET / (MET + PARTIAL + MISSED + LATE)
      feature_name: prior_management_delivery_met_rate_v1
      as_of: universe_snapshot_captured_at_utc
      minimum_resolved_claims: 3
      unresolved_policy: excluded_from_denominator_and_reported_separately
      claim_type_weights: none
    decision:
      entry_delay_sessions: 1
      holding_period_sessions: 120
    benchmarks:
      - nifty_200
      - sector_matched
      - nifty_200_momentum_30
    guardrails:
      - outcome_evidence_after_decision_date_is_excluded
      - current_claim_lifecycle_status_is_not_used_as_a_feature
      - insufficient_prior_history_returns_no_signal
      - historical_claim_reconstruction_does_not_make_historical_returns_out_of_sample
      - h003_must_be_evaluated_independently_before_any_ensemble
    next_action: expand_preexisting_claim_history_then_prospective_return_test
    live_capital: false
