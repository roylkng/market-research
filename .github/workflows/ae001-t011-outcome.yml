name: AE001 T011 lagged-futures incremental trial

on:
  push:
    branches:
      - feat/ae001-t011-lagged-futures-20261001

permissions:
  contents: write
  actions: read

jobs:
  outcome:
    if: contains(github.event.head_commit.message, '[ae001-t011-outcome]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Resolve frozen T011-P1 source artifact
        id: source
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from marketlab.alpha_trials import (
              require_protocol_amendment,
              require_unopened_registered_trial,
              validate_trial_ledger,
          )

          ledger = json.load(open("research/ae001/trial-ledger.json"))
          validate_trial_ledger(ledger)
          require_unopened_registered_trial(
              ledger,
              trial_id="AE001-T011",
              required_status="FROZEN_BEFORE_RETURN_OUTCOMES",
          )
          p1 = require_protocol_amendment(
              ledger,
              trial_id="AE001-T011",
              protocol_id="AE001-T011-P1",
          )
          payload = p1["payload"]
          print(f"run_id={payload['source_run_id']}")
          print(f"artifact_name={payload['source_artifact_name']}")
          PY

      - name: Download frozen T011 source artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          path: evidence/t011
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: roylkng/market-research
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Verify implementation and P1 before opening outcomes
        run: |
          ruff check \
            src/marketlab/alpha_t011.py \
            scripts/run_ae001_t011.py \
            tests/test_alpha_t011.py
          pytest -q \
            tests/test_alpha_t011.py \
            tests/test_alpha_multihorizon.py

      - name: Run frozen T011 comparison
        shell: bash
        run: |
          set -euo pipefail
          MARKET="$(find evidence/t011 -name market-panel.json.gz -print -quit)"
          ACTION="$(find evidence/t011 -name corporate-action-ledger.json.gz -print -quit)"
          PANEL="$(find evidence/t011 -name t011-feature-panel.json.gz -print -quit)"
          test -n "$MARKET"
          test -n "$ACTION"
          test -n "$PANEL"
          python scripts/run_ae001_t011.py \
            --market-panel "$MARKET" \
            --feature-panel "$PANEL" \
            --action-ledger "$ACTION" \
            --trial-ledger research/ae001/trial-ledger.json \
            --output reports/ae001-t011/outcome
          cat reports/ae001-t011/outcome/summary.json

      - name: Upload exact T011 outcome evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ae001-t011-${{ github.run_id }}
          path: reports/ae001-t011/outcome
          if-no-files-found: error
          retention-days: 90

      - name: Seal T011 result
        env:
          PYTHONPATH: src
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_NAME: ae001-t011-${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          from marketlab.alpha import digest
          from marketlab.alpha_trials import (
              append_trial_event,
              trial_state,
              validate_trial_ledger,
          )

          summary = json.load(open("reports/ae001-t011/outcome/summary.json"))
          path = Path("research/ae001/trial-ledger.json")
          ledger = json.loads(path.read_text(encoding="utf-8"))
          validate_trial_ledger(ledger)
          if trial_state(ledger, "AE001-T011")["result_count"] != 0:
              raise SystemExit("T011 result already exists")

          def compact(value):
              inference = value["augmented_minus_base_inference"]["metrics"]
              return {
                  "base_mean_rank_ic": value["base"]["mean_rank_ic"],
                  "augmented_mean_rank_ic": value["augmented"]["mean_rank_ic"],
                  "delta_mean_rank_ic": inference["rank_ic"]["mean"],
                  "delta_rank_ic_p_value": inference["rank_ic"]["p_value_two_sided"],
                  "base_mean_top_decile_excess": value["base"]["mean_top_decile_excess"],
                  "augmented_mean_top_decile_excess": value["augmented"]["mean_top_decile_excess"],
                  "delta_mean_top_decile_excess": inference["top_decile_excess"]["mean"],
                  "delta_top_decile_excess_p_value": inference["top_decile_excess"]["p_value_two_sided"],
                  "base_mean_top_minus_bottom_spread": value["base"]["mean_top_minus_bottom_spread"],
                  "augmented_mean_top_minus_bottom_spread": value["augmented"]["mean_top_minus_bottom_spread"],
                  "delta_mean_top_minus_bottom_spread": inference["top_minus_bottom_spread"]["mean"],
                  "delta_top_minus_bottom_spread_p_value": inference["top_minus_bottom_spread"]["p_value_two_sided"],
                  "prediction_count": value["augmented"]["prediction_count"],
                  "session_count": value["augmented"]["session_count"],
              }

          primary = compact(summary["primary_5d"])
          secondary = compact(summary["secondary_1d"])
          supported = bool(summary["primary_success_criteria_supported"])
          primary["frozen_success_criteria_supported"] = supported
          secondary["rescues_failed_primary"] = False

          interpretation = (
              "PRIMARY_5D_SUPPORTED; PROMOTE_LAGGED_FUTURES_AS_CAUSAL_CANDIDATE; "
              if supported
              else "PRIMARY_5D_NOT_SUPPORTED; DO_NOT_RETUNE_UNDER_T011; "
          )
          interpretation += (
              "HISTORICAL_PREVIOUS_SESSION_FO_PREOPEN_TIMING_UNVERIFIED; "
              "SC003_REQUIRED_BEFORE_PROSPECTIVE_SUCCESSOR_DESIGN; "
              "NO_PROSPECTIVE_OR_LIVE_CAPITAL_CLAIM"
          )

          payload = {
              "status": "COMPLETE_DEVELOPMENT",
              "evidence_class": summary["evidence_class"],
              "successful_run": {
                  "run_id": int(os.environ["RUN_ID"]),
                  "artifact_id": int(os.environ["ARTIFACT_ID"]),
                  "artifact_name": os.environ["ARTIFACT_NAME"],
              },
              "report_sha256": summary["report_sha256"],
              "report_artifact_sha256": summary["report_artifact_sha256"],
              "source_chain": {
                  "market_panel_sha256": summary["market_panel_sha256"],
                  "corporate_action_ledger_sha256": summary["corporate_action_ledger_sha256"],
                  "current27_feature_panel_sha256": summary["current27_feature_panel_sha256"],
                  "t005_same_session37_feature_panel_sha256": summary["t005_same_session37_feature_panel_sha256"],
                  "lagged37_feature_panel_sha256": summary["feature_panel_sha256"],
              },
              "primary_5d": primary,
              "secondary_1d": secondary,
              "medium_horizon_tested": False,
              "historical_previous_session_fo_preopen_timing_verified": False,
              "future_source_timing_gate": "AE001-SC003",
              "prospective_claim_allowed": False,
              "promote_causal_lagged_futures_candidate": supported,
              "interpretation": interpretation,
              "live_capital_allowed": False,
          }
          updated = append_trial_event(
              ledger,
              event_type="TRIAL_RESULT_RECORDED",
              trial_id="AE001-T011",
              recorded_at_utc=datetime.now(UTC).isoformat(),
              payload=payload,
          )
          path.write_text(
              json.dumps(updated, indent=2, sort_keys=True, ensure_ascii=False, allow_nan=False)
              + "\n",
              encoding="utf-8",
          )
          result = {"schema_version": 1, "trial_id": "AE001-T011", **payload}
          result["result_sha256"] = digest(result)
          Path("research/ae001-t011-result-v1.json").write_text(
              json.dumps(result, indent=2, sort_keys=True, ensure_ascii=False, allow_nan=False)
              + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, sort_keys=True))
          PY

      - name: Commit sealed T011 result
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add \
            research/ae001/trial-ledger.json \
            research/ae001-t011-result-v1.json
          git commit -m "research: seal AE001 T011 historical result [skip ci]"
          git push origin HEAD:feat/ae001-t011-lagged-futures-20261001
