name: H021 original Oct12 partial and full attempt byte replay

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/h021-first-entry-attempt-replay.yml
      - research/prospective/h021/entry-observations/attempts/**
  schedule:
    # 21:40 IST after late NSE source publication/retry attempts.
    - cron: '10 16 * * 1-5'

permissions:
  contents: write

concurrency:
  group: h021-entry-attempt-original-byte-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify actual NSE ZIP/attempt/selection SHA and missing-index state
        run: |
          ruff check src/marketlab/h021_entry_attempt_replay.py scripts/replay_h021_entry_attempts.py tests/test_h021_entry_attempt_replay.py
          pytest -q tests/test_h021_entry_attempt_replay.py tests/test_h021_entry_observation.py
      - name: Replay exact raw stock and index sources from every original source attempt
        shell: bash
        run: |
          set -euo pipefail
          ROOT="research/prospective/h021/entry-observations"
          OUTPUT="$ROOT/reconstructed-attempts"
          python scripts/replay_h021_entry_attempts.py \
            --source-root "$ROOT" \
            --out-root "$OUTPUT"
          python scripts/replay_h021_entry_attempts.py \
            --source-root "$ROOT" \
            --out-root "$OUTPUT" \
            --verify-existing
      - name: Anchor reconstructed source status without modifying frozen entry
        shell: bash
        run: |
          set -euo pipefail
          ROOT="research/prospective/h021/entry-observations"
          TARGET="$ROOT/reconstructed-attempts"
          git config user.name marketlab-research-bot
          git config user.email marketlab-research-bot@users.noreply.github.com
          git add -f "$TARGET"
          if git diff --cached --quiet; then
            echo "Every original P004 partial/full source attempt already replayed"
            exit 0
          fi
          git commit -m "H021: replay immutable original entry source attempts without fabricating benchmark [skip ci]"
          BASE_SHA="$(git rev-parse HEAD^)"
          for RETRY in 1 2 3 4 5; do
            git fetch origin main
            MAIN_SHA="$(git rev-parse origin/main)"
            if ! git diff --quiet "$BASE_SHA" "$MAIN_SHA" -- \
              .github/workflows/h021-first-entry-attempt-replay.yml \
              research/prospective/h021/entry-observations/attempts \
              research/prospective/h021/entry-observations/raw \
              research/prospective/h021/intents/2026-10-09-primary-entry-intent-v1.json \
              research/prospective/h021/comparisons/2026-10-09-primary-revision-v1.json \
              research/prospective/universes/FY27-Q2-2026-09-06.json \
              research/prospective/calendars/FY27-Q2-2026-09-06/NSE-CM-FY27Q2-v1.json \
              src/marketlab/h021_entry_attempt_replay.py \
              src/marketlab/h021_entry_observation.py \
              src/marketlab/pf001_marketdata.py \
              scripts/replay_h021_entry_attempts.py; then
              echo "Original H021 raw receipt/source changed while replay was in flight"
              exit 1
            fi
            if [[ "$MAIN_SHA" != "$BASE_SHA" ]]; then
              git rebase origin/main
              BASE_SHA="$MAIN_SHA"
            fi
            if git push origin HEAD:main; then
              echo "Immutable source-only H021 stock observations anchored"
              exit 0
            fi
            sleep "$((RETRY*2))"
          done
          echo "Unable to anchor after bounded retries; original source still preserved"
          exit 1
      - name: Preserve original source replay results on runner
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h021-original-oct12-all-entry-attempt-replays
          path: research/prospective/h021/entry-observations/reconstructed-attempts
          if-no-files-found: ignore
          retention-days: 90
