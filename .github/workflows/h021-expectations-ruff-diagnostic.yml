name: H021 expectations Ruff diagnostic

on:
  push:
    branches:
      - feat/ae001-h021-expectations-family-20261003

permissions:
  contents: read

jobs:
  diff:
    if: contains(github.event.head_commit.message, '[h021-expectations-ruff]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ruff
        run: python -m pip install 'ruff==0.16.10'
      - name: Print exact import fix
        run: |
          ruff check --fix tests/test_alpha_expectations.py || true
          git diff -- tests/test_alpha_expectations.py
