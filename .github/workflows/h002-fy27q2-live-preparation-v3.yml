name: H002 FY27-Q2 decisive preparation v3

on:
  push:
    branches:
      - run/h002-fy27q2-live-preparation-v3
    paths:
      - .github/workflows/h002-fy27q2-live-preparation-v3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h002-fy27q2-live-preparation-v3
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      UNIVERSE: research/prospective/universes/FY27-Q2-2026-09-06.json
      BASELINE_PERIOD_END: '2025-09-30'
      STORE: .marketlab
      OUT_DIR: run-out/FY27-Q2-2026-09-06
      ANCHOR_DIR: research/prospective/preparation/FY27-Q2-2026-09-06

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MarketLab
        run: python -m pip install -e '.[dev]'

      - name: Validate frozen research contracts
        run: make validate

      - name: Prepare all 100 frozen U001 members exactly once
        run: |
          mkdir -p "$OUT_DIR" "$ANCHOR_DIR"
          python scripts/prepare_h002_cohort.py \
            --universe "$UNIVERSE" \
            --baseline-period-end "$BASELINE_PERIOD_END" \
            --store "$STORE" \
            --report-out "$OUT_DIR/preparation-report.json"

      - name: Inspect measured coverage
        id: coverage
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ['OUT_DIR']) / 'preparation-report.json').read_text())
          summary = {
              'cohort_id': report['cohort_id'],
              'captured_count': report['captured_count'],
              'member_count': report['member_count'],
              'uncovered_count': report['uncovered_count'],
              'freeze_ready': report['freeze_ready'],
              'reason_counts': report['reason_counts'],
              'report_sha256': report['report_sha256'],
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"freeze_ready={str(report['freeze_ready']).lower()}\n")
              handle.write(f"captured_count={report['captured_count']}\n")
              handle.write(f"report_sha256={report['report_sha256']}\n")
          PY

      - name: Freeze bundle from the exact measured store
        if: steps.coverage.outputs.freeze_ready == 'true'
        run: |
          python - <<'PY'
          import os
          from datetime import UTC, datetime
          from pathlib import Path
          from marketlab.expectations import ExpectationStore
          from marketlab.preparation import PreparationStore, freeze_complete_bundle, write_json
          from marketlab.universe import load_universe_snapshot

          universe = load_universe_snapshot(os.environ['UNIVERSE'])
          bundle = freeze_complete_bundle(
              universe=universe,
              expectation_store=ExpectationStore(os.environ['STORE']),
              preparation_store=PreparationStore(os.environ['STORE']),
              baseline_period_end=os.environ['BASELINE_PERIOD_END'],
              generated_at=datetime.now(UTC),
          )
          destination = Path(os.environ['OUT_DIR']) / 'expectation-bundle.json'
          write_json(destination, bundle.to_dict())
          print(f"bundle_sha256={bundle.bundle_sha256}")
          print(f"manifest_id={bundle.expectation_manifest.manifest_id}")
          print(f"records={len(bundle.expectations)}")
          print(f"uncovered={len(bundle.expectation_manifest.uncovered_symbols)}")
          no_signal = [
              record.expectation.symbol
              for record in bundle.expectations
              if record.expectation.status == 'NO_SIGNAL'
          ]
          print(f"no_signal_symbols={','.join(sorted(no_signal))}")
          PY

      - name: Anchor report and frozen bundle on the run branch
        run: |
          cp "$OUT_DIR/preparation-report.json" "$ANCHOR_DIR/preparation-report.json"
          if [ -f "$OUT_DIR/expectation-bundle.json" ]; then
            cp "$OUT_DIR/expectation-bundle.json" "$ANCHOR_DIR/expectation-bundle.json"
          fi
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path
          out_dir = Path(os.environ['OUT_DIR'])
          anchor_dir = Path(os.environ['ANCHOR_DIR'])
          report = json.loads((out_dir / 'preparation-report.json').read_text())
          bundle_path = out_dir / 'expectation-bundle.json'
          bundle = json.loads(bundle_path.read_text()) if bundle_path.exists() else None
          metadata = {
              'schema_version': 2,
              'cohort_id': report['cohort_id'],
              'source_commit_sha': os.environ['GITHUB_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'workflow_ref': os.environ['GITHUB_WORKFLOW_REF'],
              'anchored_at_utc': datetime.now(UTC).isoformat().replace('+00:00', 'Z'),
              'preparation_report_sha256': report['report_sha256'],
              'captured_count': report['captured_count'],
              'member_count': report['member_count'],
              'freeze_ready': report['freeze_ready'],
              'expectation_bundle_present': bundle is not None,
              'expectation_bundle_sha256': None if bundle is None else bundle['bundle_sha256'],
              'expectation_manifest_id': None if bundle is None else bundle['expectation_manifest']['manifest_id'],
              'terminal_no_signal_symbols': [] if bundle is None else sorted(
                  item['expectation']['symbol']
                  for item in bundle['expectations']
                  if item['expectation']['status'] == 'NO_SIGNAL'
              ),
          }
          (anchor_dir / 'run-metadata.json').write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Commit timestamp anchor to run branch
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add "$ANCHOR_DIR"
          if git diff --cached --quiet; then
            echo "No new anchor files to commit"
          else
            git commit -m "Anchor decisive FY27-Q2 H002 preparation evidence"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Preserve complete raw acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h002-fy27q2-decisive-preparation-${{ github.run_id }}
          path: |
            .marketlab
            run-out/FY27-Q2-2026-09-06
            research/prospective/preparation/FY27-Q2-2026-09-06
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
