name: HG006 D004 historical base rates

on:
  push:
    branches:
      - research/hg006-d004-base-rates-20261007

permissions:
  actions: read
  contents: read

jobs:
  estimate:
    if: contains(github.event.head_commit.message, '[hg006-d004]')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate frozen D004 implementation
        run: |
          ruff check \
            src/marketlab/hg006_d004_execution.py \
            scripts/run_hg006_d004_base_rates.py \
            tests/test_hg006_d004_execution.py \
            src/marketlab/hg006_base_rates.py \
            tests/test_hg006_base_rates.py
          pytest -q \
            tests/test_hg006_d004_execution.py \
            tests/test_hg006_base_rates.py

      - name: Download exact passed historical terminal labels
        uses: actions/download-artifact@v4
        with:
          name: hg006-d002-p1-37654933457
          path: reports/hg006-d002-source
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37654933457

      - name: Verify frozen label source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path(
              "reports/hg006-d002-source/"
              "hg006-d002-p1-terminal-labels.json"
          )
          panel = json.loads(path.read_text())
          assert panel["labeler_id"] == "HG006-D002-P1-v1"
          assert panel["label_panel_sha256"] == (
              "545532620b409135bd867f633de708cfd441e2c532a5b790afeacef9c7de9874"
          )
          assert panel["episode_count"] == 333
          assert panel["historical_terminal_labels_opened"] is True
          assert panel["completion_probabilities_assigned"] is False
          assert panel["return_outcomes_opened"] is False
          PY

      - name: Execute frozen competing-risk base-rate estimator
        run: |
          mkdir -p reports/hg006-d004
          python scripts/run_hg006_d004_base_rates.py \
            --labels reports/hg006-d002-source/hg006-d002-p1-terminal-labels.json \
            --out reports/hg006-d004/hg006-d004-base-rates.json

      - name: Prove historical-only probability output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          panel = json.loads(
              Path("reports/hg006-d004/hg006-d004-base-rates.json").read_text()
          )
          assert panel["estimator_id"] == "HG006-D004-P1-v1"
          assert panel["historical_base_rates_opened"] is True
          assert panel["current_company_probabilities_assigned"] is False
          assert panel["return_outcomes_opened"] is False
          assert panel["portfolio_eligibility_allowed"] is False
          assert panel["live_capital_allowed"] is False
          print(json.dumps({
              "base_rate_panel_sha256": panel["base_rate_panel_sha256"],
              "family_surfaces": panel["family_surfaces"],
              "publishable_stage_surfaces": [
                  row for row in panel["stage_surfaces"]
                  if row["publication_state"] == "PUBLISHABLE_HISTORICAL_BASE_RATE"
              ],
              "threshold_passes": panel["threshold_passes"],
              "feasibility_pass": panel["feasibility_pass"],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload exact D004 base-rate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hg006-d004-${{ github.run_id }}
          path: reports/hg006-d004
          if-no-files-found: warn
          retention-days: 90
