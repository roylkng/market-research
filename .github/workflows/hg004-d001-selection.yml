name: HG004 D001 detailed term selection

on:
  push:
    branches:
      - research/hg004-detailed-terms-20261005

permissions:
  actions: read
  contents: read

jobs:
  select:
    if: contains(github.event.head_commit.message, '[hg004-d001]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate frozen HG004 selector
        run: |
          ruff check \
            src/marketlab/hg004_terms.py \
            scripts/materialize_hg004_terms.py \
            tests/test_hg004_terms.py
          pytest -q \
            tests/test_hg004_terms.py \
            tests/test_hg003_threads.py \
            tests/test_ss002_llm_contract.py
      - name: Download exact HG003 L002 synthesis
        uses: actions/download-artifact@v4
        with:
          name: hg003-l002-37277006068
          path: reports/hg003-l002
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37277006068
      - name: Download exact SS002 P2 event census
        uses: actions/download-artifact@v4
        with:
          name: ss002-d001-p2-37203696204
          path: reports/ss002-p2
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37203696204
      - name: Download exact SS002 D3 text corpus
        uses: actions/download-artifact@v4
        with:
          name: ss002-d003-37213853198
          path: reports/ss002-d3
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37213853198
      - name: Materialize frozen HG004 detailed term selection
        run: |
          python scripts/materialize_hg004_terms.py \
            --hg003-l002 reports/hg003-l002/hg003-l002-synthesis.json \
            --p2-census reports/ss002-p2/ss002-d001-census.json \
            --d3-corpus reports/ss002-d3/ss002-d003-text-corpus.json \
            --documents-dir reports/ss002-d3/documents \
            --output reports/hg004-d001
      - name: Prove frozen source accounting
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/hg004-d001/hg004-d001-selection.json").read_text())
          assert p["selection_id"] == "HG004-D001-P1-v1"
          assert p["symbol_count"] == 11
          assert p["semantic_cluster_count"] == 11
          assert p["event_link_count"] == 20
          assert p["unique_document_count"] == 19
          assert p["feasibility_pass"] is True
          assert p["return_outcomes_opened"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          print(json.dumps({
            "selection_sha256":p["selection_sha256"],
            "symbol_count":p["symbol_count"],
            "semantic_cluster_count":p["semantic_cluster_count"],
            "event_link_count":p["event_link_count"],
            "unique_document_count":p["unique_document_count"],
            "cluster_event_counts":p["cluster_event_counts"],
            "threshold_passes":p["threshold_passes"],
          },indent=2,sort_keys=True))
          PY
      - name: Upload exact HG004 selection
        uses: actions/upload-artifact@v4
        with:
          name: hg004-d001-${{ github.run_id }}
          path: reports/hg004-d001
          if-no-files-found: error
          retention-days: 90
