name: H024 temporary source closure probe

on:
  push:
    branches:
      - research/h024-insider-prospective-v1-20260915
    paths:
      - '.github/workflows/h024-temp-source-closure.yml'

permissions:
  contents: write

jobs:
  close-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h024-insider-prospective-v1-20260915
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify four derivative-mixed filings and one broken raw source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import time
          from pathlib import Path

          from marketlab.h024_acquisition import H024AcquisitionError, archive_session, fetch_xbrl
          from marketlab.h024_insider import parse_pit_xml, parser_contract

          cases = [
              {
                  "symbol": "PETRONET",
                  "app_id": "1005",
                  "url": "https://nsearchives.nseindia.com/corporate/xbrl/PIT_532522_1262026201427_IT_WebXMLFile_20260612_201432608.xml",
                  "must_parse": True,
              },
              {
                  "symbol": "PETRONET",
                  "app_id": "1006",
                  "url": "https://nsearchives.nseindia.com/corporate/xbrl/PIT_Diclosure72xml_IT_WebXMLFile_20260612_201854562.xml",
                  "must_parse": True,
              },
              {
                  "symbol": "PETRONET",
                  "app_id": "1081",
                  "url": "https://nsearchives.nseindia.com/corporate/xbrl/PIT_532522_1662026185911_IT_WebXMLFile_20260616_185920544.xml",
                  "must_parse": True,
              },
              {
                  "symbol": "PETRONET",
                  "app_id": "1077",
                  "url": "https://nsearchives.nseindia.com/corporate/xbrl/16062026PIT_Diclosure72xml_IT_WebXMLFile_20260616_190420194.xml",
                  "must_parse": True,
              },
              {
                  "symbol": "NURECA",
                  "app_id": "834",
                  "url": "https://nsearchives.nseindia.com/corporate/xbrl/PIT_543264_962026175950_IT_WebXMLFile_20260609_180001758.xml",
                  "must_parse": False,
              },
          ]

          session = archive_session()
          results = []
          for index, case in enumerate(cases):
              if index:
                  time.sleep(1.25)
              result = {key: value for key, value in case.items() if key != "must_parse"}
              try:
                  response = fetch_xbrl(session, url=case["url"], timeout=30.0, attempts=3)
              except H024AcquisitionError as exc:
                  result.update({"status": "SOURCE_BLOCKED", "error": str(exc)})
                  if case["must_parse"]:
                      raise
              else:
                  raw = response.content
                  parsed = parse_pit_xml(raw, expected_symbol=case["symbol"])
                  result.update(
                      {
                          "status": "COMPLETE",
                          "xml_sha256": hashlib.sha256(raw).hexdigest(),
                          "transaction_count": len(parsed.transactions),
                          "direct_market_purchase_count": len(parsed.direct_market_purchases),
                          "revised_filing": parsed.revised_filing,
                      }
                  )
              results.append(result)

          petronet = [row for row in results if row["symbol"] == "PETRONET"]
          if len(petronet) != 4 or any(row["status"] != "COMPLETE" for row in petronet):
              raise SystemExit("PETRONET derivative-context closure did not complete")
          if any(row["direct_market_purchase_count"] != 0 for row in petronet):
              raise SystemExit("PETRONET closure unexpectedly created a primary direct-purchase signal")

          report = {
              "schema_version": 1,
              "hypothesis_id": "H024",
              "probe_id": "H024-SOURCE-CLOSURE-V1",
              "purpose": "Close the five residual source/parser cases from the 2026-05-01..2026-09-15 full Regulation 7(2) raw-XBRL audit without using market outcomes.",
              "full_audit_reference": {
                  "exploratory_branch": "research/h024-insider-source-probe-v1-20260915",
                  "report_blob_sha": "78287cdc6bd323e61a340d5a1956d8b48272f0ec",
                  "eligible_document_count": 2506,
                  "v2_complete_document_count_before_derivative_fix": 2501,
                  "v2_failed_document_count_before_derivative_fix": 5,
                  "v2_transport_failure_count": 1,
                  "v2_derivative_schema_failure_count": 4,
              },
              "parser_contract": parser_contract(),
              "cases": results,
              "summary": {
                  "derivative_mixed_cases": 4,
                  "derivative_mixed_cases_complete": sum(
                      row["status"] == "COMPLETE" for row in petronet
                  ),
                  "unresolved_source_blocked_cases": sum(
                      row["status"] == "SOURCE_BLOCKED" for row in results
                  ),
              },
              "outcome_data_attached": False,
              "live_capital_allowed": False,
          }
          path = Path("research/probes/h024-source-closure-v1.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(report["summary"], sort_keys=True))
          PY
      - name: Commit compact source-closure evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/probes/h024-source-closure-v1.json
          git commit -m "H024: anchor source-feasibility closure"
          git push origin HEAD:research/h024-insider-prospective-v1-20260915
