name: SS002 V001 SHA-bound vision fallback queue
on:
  push:
    branches:
      - research/ss002-v001-vision-fallback-20261010
permissions:
  actions: read
  contents: read
jobs:
  materialize:
    if: contains(github.event.head_commit.message, '[ss002-v001]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate frozen vision-transport contract
        run: |
          ruff check src/marketlab/ss002_v001_visual.py scripts/materialize_ss002_v001.py tests/test_ss002_v001_visual.py
          pytest -q tests/test_ss002_v001_visual.py tests/test_ss002_p009_visual_review.py
      - name: Download exact successful P009 image artifact
        uses: actions/download-artifact@v4
        with:
          name: ss002-p009-38003348976
          path: reports/p009
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 38003348976
      - name: Materialize exact six-image model request queue
        run: |
          python scripts/materialize_ss002_v001.py \
            --p009-root reports/p009 \
            --out reports/v001
      - name: Verify no inference or investment approval
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path("reports/v001/ss002-v001-queue.json").read_text())
          s=json.loads(Path("reports/v001/summary.json").read_text())
          assert q["queue_id"]=="SS002-V001-v1"
          assert q["request_count"]==6
          assert s["sha_verified_image_count"]==6
          assert s["symbols"]==["VRLLOG"]
          assert s["page_numbers"]==[2,3,4,5,6,7]
          assert q["model_inference_completed"] is False
          assert q["independent_semantic_audit_complete"] is False
          assert q["portfolio_eligibility_allowed"] is False
          assert q["live_capital_allowed"] is False
          print(json.dumps(s,indent=2,sort_keys=True))
          PY
      - name: Upload exact V001 image prompt queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss002-v001-${{ github.run_id }}
          path: reports/v001
          if-no-files-found: warn
          retention-days: 90
