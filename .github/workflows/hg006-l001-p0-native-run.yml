name: HG006 L001 P0 native historical extraction

on:
  push:
    branches:
      - research/hg006-l001-p0-execution-20261006

permissions:
  actions: read
  contents: read

jobs:
  pilot:
    if: contains(github.event.head_commit.message, '[hg006-l001-p0-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate P0 implementation
        run: |
          ruff check \
            src/marketlab/hg006_native_pilot.py \
            scripts/materialize_hg006_l001_p0_native_run.py \
            tests/test_hg006_native_pilot.py
          pytest -q \
            tests/test_hg006_native_pilot.py \
            tests/test_hg006_inference_queue.py \
            tests/test_hg006_stage_contract.py
      - name: Download exact frozen P0 selection
        uses: actions/download-artifact@v4
        with:
          name: hg006-l001-p0-selection-37417470195
          path: reports/selection
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37417470195
      - name: Verify frozen selection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/selection/hg006-l001-p0-selection.json").read_text())
          assert p["selection_id"]=="HG006-L001-P0-SELECTION-v1"
          assert p["selection_sha256"]=="e39f0baba4d643fcf9a8bc388806f0f799938be3a399f3b09de20306a601962f"
          assert p["source_queue_sha256"]=="6732f5741ec6d9a2e1926a94d234c642871d454f0354d60dfa87cec3807ce934"
          assert p["model_config_sha256"]=="043ec1f2d38aec7e72b24cfcbe864aebd83cda8b717d3c8c0fac2ecb3cafa51d"
          assert p["selected_request_count"]==20
          assert p["historical_terminal_labels_opened"] is False
          PY
      - name: Materialize and validate native GPT-5.6 Sol P0
        run: |
          mkdir -p reports/p0
          python scripts/materialize_hg006_l001_p0_native_run.py \
            --selection reports/selection/hg006-l001-p0-selection.json \
            --output reports/p0
      - name: Prove frozen P0 gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/p0/summary.json").read_text())
          assert p["pilot_id"]=="HG006-L001-P0-v1"
          assert p["selected_request_count"]==20
          assert p["validated_response_count"]==20
          assert p["explicit_information_count"]>=18
          assert all(p["mechanical_gates"].values())
          assert p["manual_audit_pass"] is True
          assert p["promotion_allowed_to_full_queue"] is True
          assert p["historical_terminal_labels_opened"] is False
          assert p["completion_probabilities_assigned"] is False
          assert p["return_outcomes_opened"] is False
          print(json.dumps(p,indent=2,sort_keys=True))
          PY
      - name: Upload exact P0 evidence
        uses: actions/upload-artifact@v4
        with:
          name: hg006-l001-p0-native-${{ github.run_id }}
          path: reports/p0
          if-no-files-found: error
          retention-days: 90
