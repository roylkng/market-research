name: H023 ownership source probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/h023-ownership-source-probe-v1-20260914
    paths:
      - '.github/workflows/h023-ownership-source-probe.yml'
      - 'scripts/probe_h023_nse_shareholding.py'

permissions:
  contents: write

concurrency:
  group: h023-ownership-source-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Lint probe
        run: ruff check scripts/probe_h023_nse_shareholding.py

      - name: Probe official NSE shareholding endpoint
        shell: bash
        run: |
          set -euo pipefail
          WORK="reports/h023-ownership-source-probe/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          python scripts/probe_h023_nse_shareholding.py \
            --out-dir "$WORK" \
            --attempts 4 \
            --pause-seconds 0.35
          echo "work_dir=$WORK" >> "$GITHUB_ENV"

      - name: Retain compact source-only report on branch
        shell: bash
        run: |
          set -euo pipefail
          test -n "${work_dir:-}"
          REPORT="$work_dir/report.json"
          test -f "$REPORT"
          mkdir -p research/probes/h023
          cp "$REPORT" research/probes/h023/nse-shareholding-source-probe-v1.json
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/probes/h023/nse-shareholding-source-probe-v1.json
          if ! git diff --cached --quiet; then
            git commit -m "H023: anchor NSE shareholding source probe [skip ci]"
            git push origin HEAD:research/h023-ownership-source-probe-v1-20260914
          fi

      - name: Upload raw official responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h023-ownership-source-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/h023-ownership-source-probe
          if-no-files-found: error
          retention-days: 90
