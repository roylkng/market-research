name: Company intelligence v2 market-close miss audit

on:
  workflow_dispatch:
    inputs:
      session_date:
        description: NSE completed session in YYYY-MM-DD, blank uses current IST date
        required: false
        type: string
  schedule:
    - cron: '15 13 * * 1-5'

permissions:
  contents: read

concurrency:
  group: company-intelligence-v2-market-close-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Verify audit implementation
        run: |
          ruff check src/marketlab/intelligence_market_audit.py scripts/run_daily_market_audit.py tests/test_intelligence_market_audit.py
          pytest -q tests/test_intelligence_market_audit.py tests/test_intelligence_news.py
      - name: Resolve session
        id: session
        env:
          INPUT_SESSION: ${{ inputs.session_date }}
          TZ: Asia/Kolkata
        run: |
          if [ -n "$INPUT_SESSION" ]; then
            SESSION="$INPUT_SESSION"
          else
            SESSION="$(date +%F)"
          fi
          echo "session=$SESSION" >> "$GITHUB_OUTPUT"
      - name: Capture bounded discovery state
        id: discovery
        shell: bash
        run: |
          set +e
          python scripts/run_company_news_discovery.py \
            --store reports/market-close/store \
            --output reports/market-close/discovery \
            --collect | tee reports-discovery.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          mkdir -p reports/market-close/logs
          mv reports-discovery.log reports/market-close/logs/discovery.log
      - name: Build official NSE mover/miss audit
        run: |
          python scripts/run_daily_market_audit.py \
            --session '${{ steps.session.outputs.session }}' \
            --store reports/market-close/store \
            --output reports/market-close/audit \
            --liquidity-floor-inr 20000000 \
            --move-threshold-pct 5 \
            --top-abs-movers 25 | tee reports/market-close/logs/market-audit.log
      - name: Tracked repository unchanged
        if: always()
        run: git diff --exit-code
      - name: Retain audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-close-audit-${{ steps.session.outputs.session }}-${{ github.run_id }}
          path: reports/market-close
          if-no-files-found: error
          retention-days: 30
