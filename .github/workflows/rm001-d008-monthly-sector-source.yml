name: RM001 D008 monthly sector source scan

on:
  push:
    branches:
      - feat/rm001-d008-monthly-sector-source-20261002

permissions:
  contents: read

jobs:
  scan:
    if: contains(github.event.head_commit.message, '[rm001-d008]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify D008 implementation before source access
        run: |
          ruff check \
            src/marketlab/rm001_d008.py \
            scripts/run_rm001_d008.py \
            tests/test_rm001_d008.py
          pytest -q tests/test_rm001_d008.py
          python scripts/validate_registry.py

      - name: Run frozen four-workbook source scan
        run: |
          python scripts/run_rm001_d008.py \
            --output reports/rm001-d008 \
            --raw-dir reports/rm001-d008/raw \
            --attempts 4 \
            --timeout-seconds 60

      - name: Print compact result
        run: cat reports/rm001-d008/summary.json

      - name: Upload exact D008 source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rm001-d008-${{ github.run_id }}
          path: reports/rm001-d008
          if-no-files-found: warn
          retention-days: 90
