name: H024 one-time post-close recovery

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/h024-postclose-recovery.yml

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch frozen H024 outcome workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run h024-prospective-outcomes.yml --repo roylkng/market-research --ref main
