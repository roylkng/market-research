name: AE001 trial ledger hash diagnostic

on:
  push:
    branches:
      - feat/ae001-delivery-flow-features-20260927

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Recompute hashes and print exact diff
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from marketlab.alpha import digest

          path = Path("research/ae001/trial-ledger.json")
          ledger = json.loads(path.read_text(encoding="utf-8"))
          for event in ledger["events"]:
              event.pop("event_sha256", None)
              event["event_sha256"] = digest(event)
          ledger.pop("ledger_sha256", None)
          ledger["ledger_sha256"] = digest(ledger)
          path.write_text(
              json.dumps(
                  ledger,
                  indent=2,
                  sort_keys=True,
                  ensure_ascii=False,
                  allow_nan=False,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          git diff -- research/ae001/trial-ledger.json
