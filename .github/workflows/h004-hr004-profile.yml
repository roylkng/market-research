name: H004 HR004 candidate profile

on:
  push:
    branches:
      - research/h004-catalyst-candidates-v1-20260908
    paths:
      - .github/workflows/h004-hr004-profile.yml
      - scripts/profile_h004_catalyst_candidates.py

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h004-catalyst-candidates-v1-20260908
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Profile source categories without returns
        run: |
          python scripts/profile_h004_catalyst_candidates.py \
            --candidates research/historical/h004/H004-HR004-catalyst/candidates.json \
            --out research/historical/h004/H004-HR004-catalyst/profile.json
      - name: Commit profile
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/historical/h004/H004-HR004-catalyst/profile.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "H004-HR004: retain candidate source profile"
          git push origin HEAD:research/h004-catalyst-candidates-v1-20260908
