name: RM001 D010 BRSR NIC source feasibility

on:
  push:
    branches:
      - feat/rm001-d010-brsr-nic-source-20261002

permissions:
  contents: read

jobs:
  diagnostic:
    if: contains(github.event.head_commit.message, '[rm001-d010]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify D010 implementation before source access
        run: |
          ruff check \
            src/marketlab/rm001_d010.py \
            scripts/run_rm001_d010.py \
            tests/test_rm001_d010.py
          pytest -q tests/test_rm001_d010.py
          marketlab validate-registry registry/hypotheses.yaml

      - name: Run frozen D010 phases A and B
        run: |
          python scripts/run_rm001_d010.py \
            --output reports/rm001-d010 \
            --attempts 4 \
            --timeout-seconds 45

      - name: Print compact result
        run: cat reports/rm001-d010/summary.json

      - name: Upload exact D010 source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rm001-d010-${{ github.run_id }}
          path: reports/rm001-d010
          if-no-files-found: warn
          retention-days: 90
