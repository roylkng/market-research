name: T005 Ruff import diagnostic

on:
  push:
    branches:
      - feat/ae001-futures-positioning-features-20260930

permissions:
  contents: read

jobs:
  diff:
    if: contains(github.event.head_commit.message, '[t005-ruff-diagnostic]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ruff
        run: python -m pip install 'ruff==0.16.9'
      - name: Print exact fix
        run: |
          ruff check --fix tests/test_alpha_futures_trial.py || true
          git diff -- tests/test_alpha_futures_trial.py
