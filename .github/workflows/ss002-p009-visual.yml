name: SS002 P009 original-PDF visual review integrity
on:
  push:
    branches:
      - research/ss002-p009-original-page-legibility-20261010
permissions:
  actions: read
  contents: read
jobs:
  visual:
    if: contains(github.event.head_commit.message, '[ss002-p009]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate frozen P009 without external source access
        run: |
          ruff check src/marketlab/ss002_p009_visual_review.py scripts/run_ss002_p009.py tests/test_ss002_p009_visual_review.py
          pytest -q tests/test_ss002_p009_visual_review.py tests/test_ss002_p008_source_review.py
      - name: Download exact P008 source-page review packet
        uses: actions/download-artifact@v4
        with:
          name: ss002-p008-37999289727
          path: reports/p008
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37999289727
      - name: Verify immutable source review input
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/p008/ss002-p008-review.json").read_text())
          assert p["pack_id"]=="SS002-P008-v1"
          assert p["pack_sha256"]=="94b098d24ef6c5eb3482ce4c79ec696c24a6f761a4bc0f3fe6e0e5ae7f985768"
          assert p["case_count"]==4 and p["claim_count"]==35
          assert p["independent_semantic_audit_complete"] is False
          PY
      - name: Render and SHA-verify every original PDF page
        run: |
          command -v pdftoppm
          python scripts/run_ss002_p009.py \
            --p008-review reports/p008/ss002-p008-review.json \
            --out reports/p009 \
            --timeout-seconds 30 \
            --attempts 4
      - name: Verify strict visual-review and investment guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          packet=json.loads(Path("reports/p009/ss002-p009-legibility.json").read_text())
          manifest=json.loads(Path("reports/p009/ss002-p009-visual-manifest.json").read_text())
          assert packet["pack_id"]=="SS002-P009-v1"
          assert packet["claim_count"]==35
          assert packet["original_page_count"]==17
          assert packet["legibility_state_counts"]=={
              "CORRUPTED_TEXT_VISUAL_REVIEW":4,
              "UNEXTRACTED_VISUAL_REVIEW":2,
              "SPARSE_TEXT_VISUAL_REVIEW":0,
              "TEXT_PRESENT_SEMANTICS_UNVERIFIED":11,
          }
          assert manifest["rendered_page_count"]==17
          assert manifest["independent_semantic_review_complete"] is False
          assert packet["portfolio_eligibility_allowed"] is False
          assert packet["live_capital_allowed"] is False
          assert all(
              c["original_pdf_sha256"]==c["document_id"]
              for c in manifest["case_manifests"]
          )
          print(json.dumps({
              "pack_sha256":packet["pack_sha256"],
              "visual_manifest_sha256":manifest["visual_manifest_sha256"],
              "case_symbols":[c["symbol"] for c in manifest["case_manifests"]],
              "legibility_state_counts":packet["legibility_state_counts"],
              "priority_visual_pages_by_symbol":{
                  c["symbol"]:c["priority_visual_pages"] for c in packet["cases"]
              },
              "rendered_page_count":manifest["rendered_page_count"],
          },indent=2,sort_keys=True))
          PY
      - name: Upload original-page visual review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss002-p009-${{ github.run_id }}
          path: reports/p009
          if-no-files-found: warn
          retention-days: 90
