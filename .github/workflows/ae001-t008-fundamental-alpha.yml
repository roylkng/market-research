name: AE001 T008 fundamental alpha trial

on:
  push:
    branches:
      - feat/ae001-t008-fundamental-alpha-20261001

permissions:
  contents: read
  actions: read

jobs:
  trial:
    if: contains(github.event.head_commit.message, '[ae001-t008]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify T008 implementation and registration before outcome access
        env:
          PYTHONPATH: src
        run: |
          ruff check \
            src/marketlab/alpha_fundamental_trial.py \
            scripts/run_ae001_t008.py \
            tests/test_alpha_fundamental_trial.py
          pytest -q \
            tests/test_alpha_fundamental.py \
            tests/test_alpha_fundamental_combined.py \
            tests/test_alpha_fundamental_trial.py
          python - <<'PY'
          import json
          from pathlib import Path
          from marketlab.alpha_trials import trial_state, validate_trial_ledger

          ledger = json.loads(
              Path("research/ae001/trial-ledger.json").read_text(
                  encoding="utf-8"
              )
          )
          validate_trial_ledger(ledger)
          state = trial_state(ledger, "AE001-T008")
          if state["registration"]["payload"]["status"] != (
              "FROZEN_BEFORE_RETURN_OUTCOMES"
          ):
              raise SystemExit("T008 registration status differs from frozen state")
          if state["result_count"] != 0:
              raise SystemExit("T008 already has a result event")
          print("T008 registration event", state["registration"]["event_sha256"])
          PY

      - name: Download exact sealed T008-D004 source panel
        uses: actions/download-artifact@v4
        with:
          name: ae001-t008-d004-36748060295
          path: evidence/t008-d004
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: roylkng/market-research
          run-id: 36748060295

      - name: Verify D004 source artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from marketlab.alpha import digest

          matches = list(
              Path("evidence/t008-d004").rglob("t008-d004-panel.json")
          )
          if len(matches) != 1:
              raise SystemExit(f"expected one D004 panel, got {matches}")
          panel = json.loads(matches[0].read_text(encoding="utf-8"))
          stored = panel["panel_sha256"]
          unsigned = dict(panel)
          unsigned.pop("panel_sha256", None)
          if digest(unsigned) != stored:
              raise SystemExit("D004 panel internal hash mismatch")
          if stored != (
              "35ba8ea6bb87c9c9e39f79b6f9479114d96535cfefecffed4f713b1a362cb5c5"
          ):
              raise SystemExit("D004 panel differs from frozen T008 source")
          if panel["return_outcomes_opened"] is not False:
              raise SystemExit("D004 source unexpectedly contains outcomes")
          print(matches[0])
          PY

      - name: Rebuild official NSE market panel through frozen outcome boundary
        run: |
          python scripts/build_ae001_historical_panel.py \
            --start-date 2025-09-01 \
            --end-date 2026-09-25 \
            --store .marketlab/ae001-t008 \
            --output reports/ae001-t008/panel \
            --attempts 4 \
            --timeout-seconds 30 \
            --pause-seconds 0.05

      - name: Rebuild corporate-action ledger
        run: |
          python scripts/build_ae001_action_safe_panel.py \
            --market-panel reports/ae001-t008/panel/market-panel.json.gz \
            --feature-panel reports/ae001-t008/panel/feature-panel.json.gz \
            --start-date 2025-09-01 \
            --end-date 2026-09-25 \
            --raw-dir reports/ae001-t008/corporate-actions/raw \
            --output reports/ae001-t008/action-safe \
            --chunk-days 31 \
            --attempts 4 \
            --timeout-seconds 30

      - name: Run frozen T008 outcome materialization
        run: |
          D004_PANEL="$(find evidence/t008-d004 -name t008-d004-panel.json -print -quit)"
          test -n "$D004_PANEL"
          python scripts/run_ae001_t008.py \
            --d004-panel "$D004_PANEL" \
            --market-panel reports/ae001-t008/panel/market-panel.json.gz \
            --action-ledger reports/ae001-t008/action-safe/corporate-action-ledger.json.gz \
            --trial-ledger research/ae001/trial-ledger.json \
            --output reports/ae001-t008/study

      - name: Print compact T008 result
        run: cat reports/ae001-t008/study/summary.json

      - name: Upload exact T008 development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae001-t008-${{ github.run_id }}
          path: |
            evidence/t008-d004
            reports/ae001-t008
            .marketlab/ae001-t008/market-data
          if-no-files-found: warn
          retention-days: 90
