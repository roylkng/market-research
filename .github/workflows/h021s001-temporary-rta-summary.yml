name: Temporary H021S001 RTA preregistration summary refresh

on:
  push:
    branches:
      - research/h021s001-signed-eps-prospective-challenger-20261013
    paths:
      - research/rta001-trials-v1.json
      - .github/workflows/h021s001-temporary-rta-summary.yml

permissions:
  contents: write

concurrency:
  group: h021s001-oneoff-rebuild-global-ledger
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h021s001-signed-eps-prospective-challenger-20261013
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Recompute global multiple-trial accounting from exact preregistration
        run: |
          python scripts/build_rta001_summary.py \
            --manifest research/rta001-trials-v1.json \
            --output research/rta001-summary-v1.json \
            --repo-root .
          python scripts/validate_rta001_coverage.py --repo-root .
      - name: Anchor full deterministic summary without rewriting H021 baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name marketlab-research-bot
          git config user.email marketlab-research-bot@users.noreply.github.com
          git add research/rta001-summary-v1.json
          if git diff --cached --quiet; then
            echo "Multiple testing ledger already current"
            exit 0
          fi
          git commit -m "RTA001: account for separately preregistered H021S001 challenger [skip ci]"
          git push origin HEAD:research/h021s001-signed-eps-prospective-challenger-20261013
