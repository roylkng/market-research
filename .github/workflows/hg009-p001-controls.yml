name: HG009 P001 freeze matched comparator arms

on:
  push:
    branches:
      - research/hg009-p001-frozen-matched-controls-20261014
    paths:
      - .github/workflows/hg009-p001-controls.yml
      - src/marketlab/hg009_controls.py
      - scripts/materialize_hg009_controls.py
      - tests/test_hg009_controls.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hg009-p001-control-manifest-freeze
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install marketlab
        run: python -m pip install -e '.[dev]'
      - name: Regenerate and validate 300 source-only identities
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_hg009_controls.py
          python scripts/materialize_hg009_controls.py --check
          ruff check src/marketlab/hg009_controls.py scripts/materialize_hg009_controls.py tests/test_hg009_controls.py
          pytest -q tests/test_hg009_controls.py
      - name: Seal immutable original-source comparator manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/hg009/hg009-p001-matched-300-company-controls-v1.json
          if git diff --cached --quiet; then
            echo "HG009 P001 manifest already sealed"
            exit 0
          fi
          git commit -m "HG009 P001: freeze 300 original-source matched identities [skip ci]"
          git fetch origin research/hg009-p001-frozen-matched-controls-20261014
          git rebase origin/research/hg009-p001-frozen-matched-controls-20261014
          python scripts/materialize_hg009_controls.py --check
          git push origin HEAD:research/hg009-p001-frozen-matched-controls-20261014
