name: SS002 P001 daily special-situation surveillance

on:
  push:
    branches:
      - main
      - feat/ss002-p001-daily-special-situations-20261009
    paths:
      - scripts/run_ss002_p001_daily.py
      - src/marketlab/ss002_p001_source_gaps.py
      - .github/workflows/ss002-p001-daily-special-situations.yml
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: "Optional ISO start date; blank finds oldest missing since 2026-10-05"
        required: false
        type: string
      end_date:
        description: "Optional ISO end date; blank uses yesterday IST"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ss002-p001-capture-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  capture:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[ss002-p001-bootstrap]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate source-only capture before NSE access
        run: |
          ruff check \
            src/marketlab/ss002_daily_capture.py \
            src/marketlab/ss002_p001_source_gaps.py \
            scripts/run_ss002_p001_daily.py \
            tests/test_ss002_daily_capture.py \
            tests/test_ss002_p001_source_gaps.py
          pytest -q \
            tests/test_ss002_daily_capture.py \
            tests/test_ss002_p001_source_gaps.py \
            tests/test_ss002_special_situations.py \
            tests/test_alpha_announcements.py

      - name: Capture missing completed NSE source days
        shell: bash
        env:
          RUN_EVENT: ${{ github.event_name }}
          INPUT_START_DATE: ${{ inputs.start_date }}
          INPUT_END_DATE: ${{ inputs.end_date }}
        run: |
          set -euo pipefail
          ARGS=(--repo-root . --attempts 4 --timeout-seconds 25)
          if [[ "$RUN_EVENT" == "push" ]]; then
            ARGS+=(--start-date 2026-10-05 --end-date 2026-10-08)
          else
            if [[ -n "$INPUT_START_DATE" ]]; then ARGS+=(--start-date "$INPUT_START_DATE"); fi
            if [[ -n "$INPUT_END_DATE" ]]; then ARGS+=(--end-date "$INPUT_END_DATE"); fi
          fi
          python scripts/run_ss002_p001_daily.py "${ARGS[@]}"

      - name: Validate daily raw-byte hashes and safety flags
        run: |
          python - <<'PY'
          import gzip
          import hashlib
          import json
          from pathlib import Path

          root = Path(".")
          captures = sorted(root.glob(
              "research/prospective/ss002-p001/2026-*-v1.json"
          ))
          for path in captures:
              capture = json.loads(path.read_text())
              assert capture["contract_id"] == "SS002-P001-v1"
              assert capture["return_outcomes_opened"] is False
              assert capture["model_inference_executed"] is False
              assert capture["portfolio_eligibility_allowed"] is False
              assert capture["live_capital_allowed"] is False
              assert len(capture["announcements"]) == capture["announcement_count"]
              assert len(capture["candidate_events"]) == capture["candidate_event_count"]
              for meta in capture["sources"].values():
                  archive_bytes = (root / meta["relative_path"]).read_bytes()
                  assert hashlib.sha256(archive_bytes).hexdigest() == meta["gzip_sha256"]
                  raw = gzip.decompress(archive_bytes)
                  assert hashlib.sha256(raw).hexdigest() == meta["raw_sha256"]
          print(f"verified immutable source captures={len(captures)}")
          from datetime import date
          from marketlab.ss002_p001_source_gaps import (
              MAX_AUTOMATED_ATTEMPTS_PER_DAY, source_attempts_for_day
          )
          attempts_root = root / "research/prospective/ss002-p001"
          attempt_days = list((attempts_root / "attempts").glob("????-??-??"))
          blocked = []
          for day_dir in attempt_days:
              day = date.fromisoformat(day_dir.name)
              attempts = source_attempts_for_day(attempts_root, day)
              canonical = attempts_root / f"{day.isoformat()}-v1.json"
              if not canonical.exists():
                  blocked.append((day.isoformat(), len(attempts)))
          print(f"official_source_gap_days={len(blocked)}")
          for day, number in sorted(blocked):
              print(f"SOURCE_GAP {day} attempt_receipts={number} max_automatic={MAX_AUTOMATED_ATTEMPTS_PER_DAY}")
          import os
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as out:
                  out.write("## SS002 official source coverage\n")
                  out.write(f"Valid source captures: {len(captures)}. Unresolved source dates: {len(blocked)}.\n")
                  for day, number in sorted(blocked):
                      out.write(f"- {day}: SOURCE_UNAVAILABLE ({number} run receipts, no zero-event substitution)\n")
          PY

      - name: Commit append-only source evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/prospective/ss002-p001
          if git diff --cached --quiet; then
            echo "P001 ALREADY_CAPTURED"
            exit 0
          fi
          git commit -m "SS002 P001: append completed source days or explicit missing-source receipts [skip ci]"
          BASE_SHA="$(git rev-parse HEAD^)"
          for RETRY in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            MAIN_SHA="$(git rev-parse "origin/$GITHUB_REF_NAME")"
            if ! git diff --quiet "$BASE_SHA" "$MAIN_SHA" -- \
              src/marketlab/ss002_daily_capture.py \
              src/marketlab/ss002_p001_source_gaps.py \
              scripts/run_ss002_p001_daily.py \
              .github/workflows/ss002-p001-daily-special-situations.yml; then
              echo "Official SS002 source or safety protocol changed while acquiring"
              exit 1
            fi
            if [[ "$MAIN_SHA" != "$BASE_SHA" ]]; then
              git rebase "origin/$GITHUB_REF_NAME"
              BASE_SHA="$(git rev-parse HEAD^)"
            fi
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep "$((RETRY*2))"
          done
          echo "Could not anchor original NSE source or honest missing-date receipt"
          exit 1

      - name: Preserve independent source-availability attempt receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss002-p001-original-nse-source-attempts
          path: research/prospective/ss002-p001/attempts
          if-no-files-found: ignore
          retention-days: 90
