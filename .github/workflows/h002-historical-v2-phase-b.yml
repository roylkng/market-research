name: H002-HR002 six-quarter Phase B

on:
  push:
    branches:
      - work/h002-historical-replay-v1-20260907
    paths:
      - registry/h002_hr002_phase_a_freeze.yaml
      - src/marketlab/h002_historical_v2_outcomes.py
      - src/marketlab/h002_historical_outcomes_fast.py
      - scripts/run_h002_historical_v2_phase_b_shard.py
      - scripts/merge_h002_historical_v2_phase_b_shards.py
      - scripts/evaluate_h002_hr002_actionability.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h002-hr002-phase-b
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      phase_a_sha256: ${{ steps.freeze.outputs.phase_a_sha256 }}
      signal_count: ${{ steps.freeze.outputs.signal_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/h002-historical-replay-v1-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify frozen HR002 Phase A and export identity
        id: freeze
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml
          from marketlab.h002_historical_v2_outcomes import load_phase_a_manifest_v2

          freeze = yaml.safe_load(Path('registry/h002_hr002_phase_a_freeze.yaml').read_text())
          if freeze.get('freeze_id') != 'H002-HR002-PHASE-A-FREEZE-V1':
              raise SystemExit('unexpected HR002 Phase-A freeze identity')
          sha = freeze.get('phase_a_manifest_sha256')
          signal_count = int(freeze.get('signal_count', -1))
          doc = load_phase_a_manifest_v2(
              'research/historical/h002/H002-HR002/phase-a/fixed-u001-six-quarter-signals.json',
              expected_sha256=sha,
          )
          if int(doc['status_counts']['SIGNAL']) != signal_count:
              raise SystemExit('frozen HR002 SIGNAL count does not match Phase A')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(f'phase_a_sha256={sha}\n')
              handle.write(f'signal_count={signal_count}\n')
          print('phase_a_sha256', sha)
          print('signal_count', signal_count)
          PY
      - name: Validate Phase B code and frozen gate
        run: |
          ruff check \
            src/marketlab/h002_historical_v2_outcomes.py \
            src/marketlab/h002_historical_outcomes_fast.py \
            scripts/run_h002_historical_v2_phase_b_shard.py \
            scripts/merge_h002_historical_v2_phase_b_shards.py \
            scripts/evaluate_h002_hr002_actionability.py
          python -m py_compile \
            src/marketlab/h002_historical_v2_outcomes.py \
            scripts/run_h002_historical_v2_phase_b_shard.py \
            scripts/merge_h002_historical_v2_phase_b_shards.py \
            scripts/evaluate_h002_hr002_actionability.py
          python - <<'PY'
          import yaml
          from pathlib import Path
          gate = yaml.safe_load(Path('registry/h002_hr002_outcome_gate.yaml').read_text())
          if gate.get('gate_id') != 'H002-HR002-OUTCOME-GATE-V1':
              raise SystemExit('unexpected HR002 outcome gate')
          if gate.get('live_capital_allowed') is not False:
              raise SystemExit('historical gate cannot authorize live capital')
          PY

  shard:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/h002-historical-replay-v1-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Reconstruct historical outcome shard
        run: |
          python scripts/run_h002_historical_v2_phase_b_shard.py \
            --expected-phase-a-sha256 "${{ needs.prepare.outputs.phase_a_sha256 }}" \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 8 \
            --attempts 3 \
            --timeout 20 \
            --sleep 0.05 \
            --store ".marketlab-historical-v2-phase-b-shard-${{ matrix.shard }}" \
            --output "phase-b-shards/shard-${{ matrix.shard }}.json"
      - name: Reject unresolved acquisition or benchmark errors
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          shard = os.environ['SHARD']
          doc = json.loads(Path(f'phase-b-shards/shard-{shard}.json').read_text())
          bad = [
              record for record in doc['records']
              if record.get('status') in {'ERROR', 'MISSING_BENCHMARK'}
          ]
          for record in bad:
              print(record.get('symbol'), record.get('quarter_id'), record.get('status'), record.get('reason'))
          if bad:
              raise SystemExit(f'shard {shard} contains {len(bad)} unresolved records')
          counts = {}
          for record in doc['records']:
              status = record.get('status')
              counts[status] = counts.get(status, 0) + 1
          print('status_counts', json.dumps(counts, sort_keys=True))
          PY
        env:
          SHARD: ${{ matrix.shard }}
      - name: Upload exact shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h002-hr002-phase-b-shard-${{ matrix.shard }}
          path: |
            phase-b-shards/shard-${{ matrix.shard }}.json
            .marketlab-historical-v2-phase-b-shard-${{ matrix.shard }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

  merge-and-gate:
    needs: [prepare, shard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/h002-historical-replay-v1-20260907
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          pattern: h002-hr002-phase-b-shard-*
          path: downloaded-shards
          merge-multiple: true
      - name: Merge frozen six-quarter outcomes
        run: |
          python scripts/merge_h002_historical_v2_phase_b_shards.py \
            --input-dir downloaded-shards \
            --expected-phase-a-sha256 "${{ needs.prepare.outputs.phase_a_sha256 }}" \
            --shard-count 8 \
            --expected-record-count "${{ needs.prepare.outputs.signal_count }}" \
            --output research/historical/h002/H002-HR002/phase-b/fixed-u001-six-quarter-outcomes.json
      - name: Require zero unresolved merged errors
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path(
              'research/historical/h002/H002-HR002/phase-b/fixed-u001-six-quarter-outcomes.json'
          ).read_text())
          status = doc['summary']['status_counts']
          for forbidden in ('ERROR', 'MISSING_BENCHMARK'):
              if int(status.get(forbidden, 0)):
                  raise SystemExit(f'{forbidden}={status.get(forbidden)}')
          print('manifest_sha256', doc['manifest_sha256'])
          print('completed_count', doc['summary']['completed_count'])
          print('status_counts', json.dumps(status, sort_keys=True))
          PY
      - name: Evaluate pre-registered actionability gate
        run: |
          python scripts/evaluate_h002_hr002_actionability.py \
            --phase-b research/historical/h002/H002-HR002/phase-b/fixed-u001-six-quarter-outcomes.json \
            --gate registry/h002_hr002_outcome_gate.yaml \
            --output research/historical/h002/H002-HR002/phase-b/actionability-gate-v1.json
          cat research/historical/h002/H002-HR002/phase-b/actionability-gate-v1.json
      - name: Upload merged result and verdict
        uses: actions/upload-artifact@v4
        with:
          name: h002-hr002-phase-b-result
          path: |
            research/historical/h002/H002-HR002/phase-b/fixed-u001-six-quarter-outcomes.json
            research/historical/h002/H002-HR002/phase-b/actionability-gate-v1.json
          retention-days: 30
      - name: Commit frozen outcomes and verdict
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git pull --rebase origin work/h002-historical-replay-v1-20260907
          git add \
            research/historical/h002/H002-HR002/phase-b/fixed-u001-six-quarter-outcomes.json \
            research/historical/h002/H002-HR002/phase-b/actionability-gate-v1.json
          if git diff --cached --quiet; then
            echo "HR002 Phase-B result already present"
            exit 0
          fi
          git commit -m "H002-HR002: freeze six-quarter outcomes and actionability verdict"
          git push origin HEAD:work/h002-historical-replay-v1-20260907
