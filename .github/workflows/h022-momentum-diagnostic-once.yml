name: H022 one-shot momentum independence diagnostic

on:
  push:
    branches:
      - research/h022-factor-independence-v1-20260913
    paths:
      - .github/workflows/h022-momentum-diagnostic-once.yml

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OUT_DIR: research/historical/h022/momentum-independence-v1
      STORE: run-out/h022-momentum-diagnostic/store
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h022-factor-independence-v1-20260913
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and validate
        run: |
          python -m pip install -e '.[dev]'
          make validate

      - name: Run official NSE momentum diagnostic
        run: |
          mkdir -p "$OUT_DIR" "$STORE"
          python scripts/run_h022_momentum_diagnostic.py \
            --outcome-report research/historical/h022/management-information-delta-v1/challenge-2026-09-11/outcome-report.json \
            --universe research/prospective/universes/FY27-Q2-2026-09-06.json \
            --store "$STORE" \
            --control-panel-out "$OUT_DIR/control-panel.json" \
            --summary-out "$OUT_DIR/diagnostic-summary.json" \
            --evidence-manifest-out "$OUT_DIR/evidence-manifest.json"

      - name: Anchor compact diagnostic and remove one-shot workflow
        run: |
          git config user.name 'marketlab-research-bot'
          git config user.email 'marketlab-research-bot@users.noreply.github.com'
          git add "$OUT_DIR"
          git rm .github/workflows/h022-momentum-diagnostic-once.yml
          git commit -m 'H022: anchor momentum independence diagnostic'
          git push origin HEAD:research/h022-factor-independence-v1-20260913

      - name: Preserve raw official evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h022-momentum-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            run-out/h022-momentum-diagnostic
            research/historical/h022/momentum-independence-v1
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
