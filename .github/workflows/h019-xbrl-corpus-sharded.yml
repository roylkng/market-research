name: H019 complete XBRL corpus acquisition

on:
  push:
    branches: [research/h019-fundamental-inflection-20260909]
    paths: [.github/workflows/h019-xbrl-corpus-sharded.yml]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  acquire:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h019-fundamental-inflection-20260909
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: mkdir -p /tmp/h019-xbrl/input /tmp/h019-xbrl/out/raw
      - name: Restore complete outcome-blind input universe
        uses: actions/download-artifact@v4
        with:
          name: h019-complete-input-universe-v2-34336759431
          path: /tmp/h019-xbrl/input
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 34336759431
      - name: Acquire shard from official NSE archive hosts only
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import threading
          import time
          import xml.etree.ElementTree as ET
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.parse import urlparse, urlunparse

          import requests

          shard = int(os.environ['SHARD'])
          shard_count = 8
          root = pathlib.Path('/tmp/h019-xbrl')
          input_root = root / 'input'
          output_root = root / 'out'
          raw_root = output_root / 'raw'
          urls = json.loads((input_root / 'complete-required-xbrl-urls.json').read_text(encoding='utf-8'))
          summary_in = json.loads((input_root / 'complete-input-universe-summary.json').read_text(encoding='utf-8'))
          if summary_in.get('return_outcomes_opened') is not False:
              raise SystemExit('input universe is not outcome-blind')
          if summary_in.get('selection_score_frozen') is not False:
              raise SystemExit('input universe unexpectedly contains a frozen score')
          if summary_in.get('unique_required_xbrl_urls') != 14938 or len(urls) != 14938:
              raise SystemExit(f'unexpected H019 URL census: summary={summary_in.get("unique_required_xbrl_urls")} urls={len(urls)}')
          if len(set(urls)) != len(urls):
              raise SystemExit('required XBRL URL list contains duplicates')

          assigned = [
              url for url in urls
              if int(hashlib.sha256(url.encode()).hexdigest(), 16) % shard_count == shard
          ]
          assigned.sort()
          print(f'H019 XBRL shard {shard}: {len(assigned)} URLs', flush=True)

          allowed = {'archives.nseindia.com', 'nsearchives.nseindia.com'}
          local = threading.local()

          def session():
              if not hasattr(local, 'session'):
                  s = requests.Session()
                  s.headers.update({
                      'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152.0 Safari/537.36',
                      'Accept': 'application/xml,text/xml,*/*',
                      'Referer': 'https://www.nseindia.com/',
                  })
                  local.session = s
              return local.session

          def with_host(url, host):
              parsed = urlparse(url)
              if (parsed.hostname or '').lower() not in allowed:
                  raise ValueError(f'URL outside official NSE archive hosts: {url}')
              return urlunparse(parsed._replace(netloc=host))

          def valid_xbrl(raw):
              if not raw or len(raw) > 20_000_000:
                  raise ValueError('empty or oversized XBRL')
              document = ET.fromstring(raw)
              if document.tag.rsplit('}',1)[-1].casefold() != 'xbrl':
                  raise ValueError('response root is not XBRL')

          def acquire(url):
              primary = (urlparse(url).hostname or '').lower()
              other = 'archives.nseindia.com' if primary == 'nsearchives.nseindia.com' else 'nsearchives.nseindia.com'
              candidates = [url, with_host(url, other)]
              attempts = []
              for candidate in candidates:
                  for attempt in range(3):
                      try:
                          response = session().get(candidate, timeout=(8,25), allow_redirects=True)
                          final_host = (urlparse(response.url).hostname or '').lower()
                          if final_host not in allowed:
                              raise ValueError(f'redirect outside official hosts: {final_host}')
                          status = response.status_code
                          if status == 404:
                              attempts.append({'url':candidate,'status':'HTTP_404'})
                              break
                          if status in {403,429} or status >= 500:
                              attempts.append({'url':candidate,'status':f'HTTP_{status}'})
                              if attempt < 2:
                                  time.sleep(0.35 * (attempt + 1))
                                  continue
                          response.raise_for_status()
                          raw = response.content
                          valid_xbrl(raw)
                          digest = hashlib.sha256(raw).hexdigest()
                          path = raw_root / digest
                          try:
                              path.write_bytes(raw)
                          except OSError as exc:
                              return {'url':url,'status':'WRITE_FAILED','error':str(exc),'attempts':attempts}
                          return {
                              'url': url,
                              'resolved_url': response.url,
                              'status': 'OK',
                              'sha256': digest,
                              'bytes': len(raw),
                              'raw_path': f'raw/{digest}',
                              'attempts': attempts,
                          }
                      except (requests.RequestException, ET.ParseError, ValueError) as exc:
                          attempts.append({
                              'url': candidate,
                              'status': 'FAILED',
                              'error': f'{type(exc).__name__}: {exc}',
                          })
                          if attempt < 2:
                              time.sleep(0.35 * (attempt + 1))
                  # Try alternate official host after this host is exhausted.
              return {'url':url,'status':'FAILED','attempts':attempts}

          results = []
          with ThreadPoolExecutor(max_workers=5) as pool:
              futures = {pool.submit(acquire, url): url for url in assigned}
              for number, future in enumerate(as_completed(futures), 1):
                  url = futures[future]
                  try:
                      results.append(future.result())
                  except Exception as exc:
                      results.append({
                          'url': url,
                          'status': 'WORKER_FAILED',
                          'error': f'{type(exc).__name__}: {exc}',
                      })
                  if number % 200 == 0:
                      ok = sum(row.get('status') == 'OK' for row in results)
                      print(f'shard {shard}: {number}/{len(assigned)}, OK={ok}', flush=True)

          results.sort(key=lambda row: row['url'])
          ok = [row for row in results if row.get('status') == 'OK']
          failures = [row for row in results if row.get('status') != 'OK']
          if len(results) != len(assigned) or len({row['url'] for row in results}) != len(assigned):
              raise SystemExit('shard result census mismatch')
          manifest = {
              'status': 'H019_XBRL_ACQUISITION_ONLY',
              'return_outcomes_opened': False,
              'selection_score_frozen': False,
              'shard': shard,
              'shard_count': shard_count,
              'assigned': len(assigned),
              'ok': len(ok),
              'failed': len(failures),
              'results': results,
          }
          (output_root / f'shard-{shard}-manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps({k:v for k,v in manifest.items() if k != 'results'}, indent=2), flush=True)
          forbidden = ('h019-selections.json','h019-outcomes.json','h019-challenge-summary.json','selected.csv')
          if any((output_root/name).exists() for name in forbidden):
              raise SystemExit('XBRL acquisition created forbidden outcome artifact')
          PY
      - name: Upload deterministic XBRL shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h019-xbrl-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: /tmp/h019-xbrl/out
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
