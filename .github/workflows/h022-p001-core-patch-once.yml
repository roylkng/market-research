name: H022 P001 pre-start integrity patch

on:
  push:
    branches:
      - research/h022-prospective-signal-v1-20260914

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h022-prospective-signal-v1-20260914
          fetch-depth: 1
      - name: Apply exact pre-start fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          module = Path('src/marketlab/h022_prospective.py')
          text = module.read_text(encoding='utf-8')
          old_timestamp = 'parsed = datetime.fromisoformat(value.strip().replace("Z", "+00:00"))'
          new_timestamp = 'parsed = datetime.fromisoformat(value.strip())'
          if text.count(old_timestamp) != 1:
              raise SystemExit('timestamp replacement target changed')
          text = text.replace(old_timestamp, new_timestamp, 1)

          old = '''    future_hits = [marker for marker in FUTURE_MARKERS if marker in lowered]\n    deadline_hits = [marker for marker in DEADLINE_MARKERS if marker in lowered]\n    domain_hits = [marker for marker in COMMITMENT_DOMAIN_MARKERS if marker in lowered]\n    quantitative_tokens = [\n        token.strip()\n        for token in QUANTITATIVE_PATTERN.findall(excerpt)\n        if token.strip()\n    ]\n    if not future_hits or not domain_hits or not (deadline_hits or quantitative_tokens):\n        raise H022ProspectiveError(f"{source_id}: candidate no longer satisfies E002")\n    if any(marker in lowered for marker in EXCLUDE_MARKERS):\n        raise H022ProspectiveError(f"{source_id}: candidate contains E002 exclusion marker")\n    if candidate.get("future_markers") != future_hits:\n        raise H022ProspectiveError(f"{source_id}: candidate future markers changed")\n'''
          new = '''    stored_future_hits = candidate.get("future_markers")\n    deadline_hits = [marker for marker in DEADLINE_MARKERS if marker in lowered]\n    domain_hits = [marker for marker in COMMITMENT_DOMAIN_MARKERS if marker in lowered]\n    quantitative_tokens = [\n        token.strip()\n        for token in QUANTITATIVE_PATTERN.findall(excerpt)\n        if token.strip()\n    ]\n    if (\n        not isinstance(stored_future_hits, list)\n        or not stored_future_hits\n        or len(stored_future_hits) != len(set(stored_future_hits))\n        or stored_future_hits\n        != [marker for marker in FUTURE_MARKERS if marker in stored_future_hits]\n        or any(marker not in lowered for marker in stored_future_hits)\n    ):\n        raise H022ProspectiveError(f"{source_id}: candidate future markers changed")\n    if not domain_hits or not (deadline_hits or quantitative_tokens):\n        raise H022ProspectiveError(f"{source_id}: candidate no longer satisfies E002")\n    if any(marker in lowered for marker in EXCLUDE_MARKERS):\n        raise H022ProspectiveError(f"{source_id}: candidate contains E002 exclusion marker")\n'''
          if text.count(old) != 1:
              raise SystemExit('future-marker replacement target changed')
          module.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_h022_prospective.py')
          test_text = tests.read_text(encoding='utf-8')
          marker = 'def test_pre_start_source_is_not_prospectively_eligible() -> None:\n'
          if test_text.count(marker) != 1:
              raise SystemExit('test insertion target changed')
          addition = '''def test_e002_accepts_anchor_only_future_markers_when_excerpt_has_more() -> None:\n    record = _e002_record(source_id="anchor-only")\n    candidate = record["candidates"][0]\n    anchor = "We expect revenue growth of 20% next year."\n    excerpt = f"{anchor} We plan capacity expansion."\n    lowered = excerpt.casefold()\n    candidate["excerpt"] = excerpt\n    candidate["line_end"] = 2\n    candidate["future_markers"] = [\n        marker for marker in FUTURE_MARKERS if marker in anchor.casefold()\n    ]\n    candidate["deadline_markers"] = [\n        marker for marker in DEADLINE_MARKERS if marker in lowered\n    ]\n    candidate["domain_markers"] = [\n        marker for marker in COMMITMENT_DOMAIN_MARKERS if marker in lowered\n    ]\n    candidate["quantitative_tokens"] = [\n        token.strip()\n        for token in QUANTITATIVE_PATTERN.findall(excerpt)\n        if token.strip()\n    ]\n    all_excerpt_future = [marker for marker in FUTURE_MARKERS if marker in lowered]\n    assert len(all_excerpt_future) > len(candidate["future_markers"])\n    candidate["candidate_id"] = prospective._canonical_hash(\n        {\n            "rule_id": EXTRACTION_RULE_ID,\n            "rule_sha256": EXTRACTION_RULE_SHA256,\n            "candidate_version": CANDIDATE_VERSION,\n            "source_id": record["source_id"],\n            "symbol": record["symbol"],\n            "raw_sha256": record["raw_sha256"],\n            "page_number": candidate["page_number"],\n            "line_start": candidate["line_start"],\n            "line_end": candidate["line_end"],\n            "excerpt": excerpt,\n        }\n    )\n    unsigned = dict(record)\n    unsigned.pop("record_id")\n    record["record_id"] = prospective._canonical_hash(unsigned)\n    prospective.validate_e002_record(record)\n\n\n'''
          tests.write_text(test_text.replace(marker, addition + marker, 1), encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/h022-p001-core-patch-once.yml
          git add src/marketlab/h022_prospective.py tests/test_h022_prospective.py
          git commit -m 'H022: fix pre-start prospective validator integrity'
          git push origin HEAD:research/h022-prospective-signal-v1-20260914
