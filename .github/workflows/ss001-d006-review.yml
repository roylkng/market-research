name: SS001 D006 dated capital-action review

on:
  push:
    branches:
      - research/ss001-d006-share-action-review-20261008

permissions:
  actions: read
  contents: read

jobs:
  materialize:
    if: contains(github.event.head_commit.message, '[ss001-d006]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate D006 parser and temporal rules
        run: |
          ruff check src/marketlab/ss001_share_action_review.py scripts/materialize_ss001_d006.py tests/test_ss001_share_action_review.py
          pytest -q tests/test_ss001_share_action_review.py
      - name: Download frozen D001 market/action source
        uses: actions/download-artifact@v4
        with:
          name: ss001-d001-37197575401
          path: reports/d001
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37197575401
      - name: Download frozen D005 readiness
        uses: actions/download-artifact@v4
        with:
          name: ss001-d005-37815803355
          path: reports/d005
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37815803355
      - name: Download frozen SS002 P2 events
        uses: actions/download-artifact@v4
        with:
          name: ss002-d001-p2-37203696204
          path: reports/p2
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37203696204
      - name: Materialize dated share-change review queue
        run: |
          python scripts/materialize_ss001_d006.py \
            --d005-panel reports/d005/ss001-d005-panel.json \
            --d001-census reports/d001/ss001-d001-census.json \
            --p2-census reports/p2/ss002-d001-census.json \
            --d001-actions-root reports/d001/raw/corporate-action-discovery/sha256 \
            --output reports/d006
      - name: Prove no automatic share-action clearance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/d006/ss001-d006-review.json").read_text())
          assert p["audit_id"]=="SS001-D006-v1"
          assert len(p["rows"])==2319
          assert p["d005_time_and_price_ready_count"]==1960
          assert p["share_action_clearance_proven"] is False
          assert p["market_capitalization_calculated"] is False
          assert all(row["share_action_clearance_proven"] is False for row in p["rows"])
          assert all(row["capitalization_calculation_allowed"] is False for row in p["rows"])
          assert p["return_outcomes_opened"] is False
          assert p["portfolio_eligibility_allowed"] is False
          print(json.dumps({k:v for k,v in p.items() if k!="rows"},indent=2,sort_keys=True))
          PY
      - name: Upload exact D006 source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss001-d006-${{ github.run_id }}
          path: reports/d006
          if-no-files-found: warn
          retention-days: 90
