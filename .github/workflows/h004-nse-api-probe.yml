name: H004 NSE API probe

on:
  push:
    branches:
      - research/h004-pre-momentum-v1-20260908
    paths:
      - .github/workflows/h004-nse-api-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Probe iXBRL comparative table
        run: |
          python - <<'PY'
          from bs4 import BeautifulSoup
          from marketlab.nse import NSEClient

          client = NSEClient(timeout=20, attempts=4)
          payload = client.integrated_filings(
              symbol='ENTERO',
              from_date='01-08-2026',
              to_date='15-08-2026',
              page=1,
              size=20,
          )
          rows = payload.get('data', []) if isinstance(payload, dict) else []
          rows = [r for r in rows if r.get('consolidated') == 'Consolidated'] or rows
          if not rows:
              raise SystemExit('no ENTERO filing')
          row = rows[0]
          raw = client.archive_bytes(row['ixbrl'])
          print('IXBRL_BYTES', len(raw), row['ixbrl'])
          soup = BeautifulSoup(raw.decode('utf-8', errors='replace'), 'html.parser')
          print('TABLE_COUNT', len(soup.find_all('table')))
          keys = ('revenue from operations', 'finance costs', 'depreciation', 'profit before exceptional', 'profit before tax', 'profit (loss) for period')
          matches = 0
          for tr in soup.find_all('tr'):
              cells = [' '.join(c.get_text(' ', strip=True).split()) for c in tr.find_all(['th','td'])]
              line = ' | '.join(cells)
              low = line.lower()
              if any(k in low for k in keys):
                  print('ROW', line[:6000])
                  matches += 1
          print('MATCHED_ROWS', matches)
          print('INLINE_CONTEXTS')
          for tag in soup.find_all(['ix:nonfraction','ix:nonnumeric']):
              name = tag.get('name') or ''
              if any(k in name.lower() for k in ('revenue','profit','finance','depreciation')):
                  print(name, tag.get('contextref'), ' '.join(tag.get_text(' ', strip=True).split())[:300])
          PY
