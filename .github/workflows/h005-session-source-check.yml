name: H005 session source diagnostic
on:
  push:
    branches: [research/h005-result-repricing-ranker-v1-20260908]
    paths: [.github/workflows/h005-session-source-check.yml]
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          name: h005-native-restoration-delta
          run-id: 34215580937
          github-token: ${{ github.token }}
          path: /tmp/native
      - name: Inspect fixed evenly-spaced unresolved source sample
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,time
          from marketlab.nse import NSEClient
          rows=json.loads(pathlib.Path('/tmp/native/native-restoration-manifest.json').read_text())
          denied=sorted([r for r in rows if r['kind']=='current-native-xbrl' and r['status']!='OK'],key=lambda r:r['url'])
          sample=[denied[int(i*(len(denied)-1)/19)] for i in range(20)]
          client=NSEClient(timeout=12,attempts=1)
          client._initialize_session()
          root=pathlib.Path('/tmp/h005-session-probe'); (root/'raw').mkdir(parents=True)
          output=[]
          for row in sample:
              r=client.session.get(row['url'],timeout=12)
              result={'url':row['url'],'status_code':r.status_code,'content_type':r.headers.get('content-type'),'bytes':len(r.content)}
              sha=hashlib.sha256(r.content).hexdigest()
              if r.status_code==200:
                  (root/'raw'/sha).write_bytes(r.content)
                  result['sha256']=sha
              else:
                  result['error_excerpt']=r.text[:150]
              output.append(result)
              time.sleep(.5)
          (root/'results.json').write_text(json.dumps(output,indent=2)+'\n')
          print(json.dumps(output,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: h005-session-source-probe
          path: /tmp/h005-session-probe
          retention-days: 30
