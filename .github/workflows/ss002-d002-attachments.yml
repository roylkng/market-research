name: SS002 D002 official attachment corpus

on:
  push:
    branches:
      - research/ss002-attachment-corpus-20261004

permissions:
  actions: read
  contents: read

jobs:
  corpus:
    if: contains(github.event.head_commit.message, '[ss002-d002]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate frozen D002 implementation
        run: |
          ruff check \
            src/marketlab/ss002_attachments.py \
            scripts/run_ss002_d002.py \
            tests/test_ss002_attachments.py
          pytest -q \
            tests/test_ss002_attachments.py \
            tests/test_ss002_special_situations.py
      - name: Download exact passed P2 event census
        uses: actions/download-artifact@v4
        with:
          name: ss002-d001-p2-37203696204
          path: reports/ss002-p2-source
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37203696204
      - name: Verify frozen P2 source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("reports/ss002-p2-source/ss002-d001-census.json").read_text())
          assert p["census_id"] == "SS002-D001-P2-v1"
          assert p["census_sha256"] == "ad2722cf2d3605614ae892636f35e44759ec42e5951b4680f0ed270bd1b51071"
          assert p["current_investable_event_count"] == 1666
          assert p["current_attachment_ready_count"] == 1659
          assert p["return_outcomes_opened"] is False
          PY
      - name: Acquire exact official attachments
        run: |
          python scripts/run_ss002_d002.py \
            --p2-census reports/ss002-p2-source/ss002-d001-census.json \
            --raw-dir reports/ss002-d002/raw \
            --output reports/ss002-d002 \
            --attempts 4 \
            --timeout-seconds 30 \
            --pause-seconds 0.01
      - name: Prove source-only corpus
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("reports/ss002-d002/ss002-d002-corpus.json").read_text())
          assert p["corpus_id"] == "SS002-D002-v1"
          assert p["return_outcomes_opened"] is False
          assert p["model_fitted"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          print(json.dumps({
            "corpus_sha256": p["corpus_sha256"],
            "unique_approved_url_count": p["unique_approved_url_count"],
            "ready_url_count": p["ready_url_count"],
            "ready_url_ratio": p["ready_url_ratio"],
            "ready_event_count": p["ready_event_count"],
            "ready_event_ratio_of_attachment_ready": p["ready_event_ratio_of_attachment_ready"],
            "unique_document_id_count": p["unique_document_id_count"],
            "document_family_counts": p["document_family_counts"],
            "fetch_failure_count": p["fetch_failure_count"],
            "threshold_passes": p["threshold_passes"],
            "feasibility_pass": p["feasibility_pass"],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload exact D002 corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss002-d002-${{ github.run_id }}
          path: reports/ss002-d002
          if-no-files-found: warn
          retention-days: 90
