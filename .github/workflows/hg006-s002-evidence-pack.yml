name: HG006 S002 historical stage evidence pack

on:
  push:
    branches:
      - research/hg006-s002-integrated-20261006

permissions:
  actions: read
  contents: read

jobs:
  materialize:
    if: contains(github.event.head_commit.message, '[hg006-s002]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate frozen S002 implementation
        run: |
          ruff check \
            src/marketlab/hg006_evidence_pack.py \
            scripts/materialize_hg006_s002.py \
            tests/test_hg006_evidence_pack.py
          pytest -q \
            tests/test_hg006_evidence_pack.py \
            tests/test_hg006_text.py \
            tests/test_hg006_calibration.py

      - name: Download exact S001 calibration selection
        uses: actions/download-artifact@v4
        with:
          name: hg006-s001-37412353114
          path: reports/s001
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37412353114

      - name: Download exact D001 historical census
        uses: actions/download-artifact@v4
        with:
          name: hg006-d001-p4-37347148756
          path: reports/d001
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37347148756

      - name: Download exact D001B combined corpus
        uses: actions/download-artifact@v4
        with:
          name: hg006-d001b-combined-37413266182
          path: reports/d001b-summary
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37413266182

      - name: Download D001B shard 0
        uses: actions/download-artifact@v4
        with:
          name: hg006-d001b-text-0-37413266182
          path: reports/d001b-shards/0
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37413266182
      - name: Download D001B shard 1
        uses: actions/download-artifact@v4
        with:
          name: hg006-d001b-text-1-37413266182
          path: reports/d001b-shards/1
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37413266182
      - name: Download D001B shard 2
        uses: actions/download-artifact@v4
        with:
          name: hg006-d001b-text-2-37413266182
          path: reports/d001b-shards/2
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37413266182
      - name: Download D001B shard 3
        uses: actions/download-artifact@v4
        with:
          name: hg006-d001b-text-3-37413266182
          path: reports/d001b-shards/3
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37413266182
      - name: Download D001B shard 4
        uses: actions/download-artifact@v4
        with:
          name: hg006-d001b-text-4-37413266182
          path: reports/d001b-shards/4
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37413266182
      - name: Download D001B shard 5
        uses: actions/download-artifact@v4
        with:
          name: hg006-d001b-text-5-37413266182
          path: reports/d001b-shards/5
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37413266182
      - name: Download D001B shard 6
        uses: actions/download-artifact@v4
        with:
          name: hg006-d001b-text-6-37413266182
          path: reports/d001b-shards/6
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37413266182
      - name: Download D001B shard 7
        uses: actions/download-artifact@v4
        with:
          name: hg006-d001b-text-7-37413266182
          path: reports/d001b-shards/7
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37413266182

      - name: Materialize frozen S002 evidence pack
        run: |
          mkdir -p reports/s002
          python scripts/materialize_hg006_s002.py \
            --selection reports/s001/hg006-s001-selection.json \
            --d001-census reports/d001/hg006-d001-census.json \
            --d001b-summary reports/d001b-summary/hg006-d001b-text-corpus.json \
            --shards-root reports/d001b-shards \
            --out reports/s002/hg006-s002-evidence-pack.json

      - name: Prove outcome-blind pack
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/s002/hg006-s002-evidence-pack.json").read_text())
          assert p["pack_id"]=="HG006-S002-v1"
          assert p["chronology_count"]==300
          assert p["historical_terminal_labels_opened"] is False
          assert p["completion_probabilities_assigned"] is False
          assert p["return_outcomes_opened"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          print(json.dumps({
            "pack_sha256":p["pack_sha256"],
            "chronology_count":p["chronology_count"],
            "state_counts":p["state_counts"],
            "retained_document_count":p["retained_document_count"],
            "retained_segment_count":p["retained_segment_count"],
            "text_unavailable_chronology_ids":p["text_unavailable_chronology_ids"],
            "threshold_passes":p["threshold_passes"],
            "feasibility_pass":p["feasibility_pass"],
          },indent=2,sort_keys=True))
          PY

      - name: Upload exact S002 pack
        uses: actions/upload-artifact@v4
        with:
          name: hg006-s002-${{ github.run_id }}
          path: reports/s002
          if-no-files-found: error
          retention-days: 90
