name: I003 pin sealed I002 alpha model

on:
  push:
    branches:
      - feat/po001-v2-stock-impact-20260929

permissions:
  contents: write
  actions: read

jobs:
  pin:
    if: contains(github.event.head_commit.message, '[i003-pin-i002-alpha]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Download failed P3 I003 evidence
        uses: actions/download-artifact@v4
        with:
          name: po001-i003-36581903836
          path: evidence/i003
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: roylkng/market-research
          run-id: 36581903836

      - name: Reconstruct exact sealed I002 model
        run: |
          python - <<'PY'
          import gzip
          import hashlib
          import json
          from dataclasses import asdict
          from pathlib import Path

          from marketlab.alpha_delivery import DELIVERY_DEFINITIONS
          from marketlab.alpha_history import cross_sectionalize_panel
          from marketlab.alpha_model import fit_ridge, project_examples, purge_training_examples
          from marketlab.alpha_multihorizon import build_action_safe_horizon_examples
          from marketlab.alpha_snapshot import PRICE_VOLUME_DEFINITIONS

          SEALED_MODEL_SHA = "179ce84f40c1b6e461d2ff1f4104753381d3327b2dda35814b4a913547f91260"

          def locate(suffix):
              matches = list(Path("evidence/i003").rglob(suffix))
              if len(matches) != 1:
                  raise SystemExit(f"expected one {suffix}, got {matches}")
              return matches[0]

          def load_gzip(path):
              return json.loads(gzip.decompress(path.read_bytes()).decode("utf-8"))

          market = load_gzip(locate("market-panel.json.gz"))
          features = load_gzip(locate("delivery-feature-panel.json.gz"))
          actions = load_gzip(locate("corporate-action-ledger.json.gz"))

          ranked = (
              features
              if features.get("transform") == "WITHIN_SESSION_TIE_AWARE_PERCENTILE_V1"
              else cross_sectionalize_panel(features)
          )
          feature_names = [
              d.name for d in [*PRICE_VOLUME_DEFINITIONS, *DELIVERY_DEFINITIONS]
          ]
          examples_by_horizon, _ = build_action_safe_horizon_examples(
              feature_panel=ranked,
              market_panel=market,
              action_ledger=actions,
              horizons=(5,),
          )
          examples = project_examples(
              examples_by_horizon[5],
              feature_names=feature_names,
          )
          training = purge_training_examples(
              examples,
              validation_start_session="2026-07-01",
          )
          model = fit_ridge(
              training,
              feature_names=feature_names,
              l2=1.0,
              model_id="AE001-T003-H5-F2-AUGMENTED-RIDGE-I002",
          )
          if model.model_sha256 != SEALED_MODEL_SHA:
              raise SystemExit(
                  f"reconstructed model SHA {model.model_sha256} != sealed {SEALED_MODEL_SHA}"
              )

          payload = asdict(model)
          output = Path("research/po001-i003/inputs/i002-alpha-model-v1.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          raw = (
              json.dumps(
                  payload,
                  indent=2,
                  sort_keys=True,
                  ensure_ascii=False,
                  allow_nan=False,
              )
              + "\n"
          ).encode()
          output.write_bytes(raw)

          manifest = {
              "schema_version": 1,
              "artifact_id": "PO001-I003-PINNED-I002-ALPHA-v1",
              "pinned_path": str(output),
              "file_sha256": hashlib.sha256(raw).hexdigest(),
              "internal_model_sha256": model.model_sha256,
              "model_id": model.model_id,
              "training_example_count": model.training_example_count,
              "training_last_exit_session": model.training_last_exit_session,
              "source_workflow_run_id": 36581903836,
              "source_workflow_artifact_name": "po001-i003-36581903836",
              "source_model_provenance": "AE001-T003 fold 2 / sealed PO001-I002 model",
              "live_capital_allowed": False,
          }
          manifest_path = Path(
              "research/po001-i003/inputs/i002-alpha-model-v1-manifest.json"
          )
          manifest_path.write_text(
              json.dumps(
                  manifest,
                  indent=2,
                  sort_keys=True,
                  ensure_ascii=False,
                  allow_nan=False,
              )
              + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, sort_keys=True))
          PY

      - name: Commit pinned alpha model
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/po001-i003/inputs/
          git commit -m "research: pin exact sealed I002 alpha model [skip ci]"
          git push origin HEAD:feat/po001-v2-stock-impact-20260929
