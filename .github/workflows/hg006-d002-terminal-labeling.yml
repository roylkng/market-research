name: HG006 D002 historical terminal labeling

on:
  push:
    branches:
      - research/hg006-d002-terminal-labeling-20261007

permissions:
  actions: read
  contents: read

jobs:
  label:
    if: contains(github.event.head_commit.message, '[hg006-d002-labels]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate frozen labeler before opening labels
        run: |
          ruff check \
            src/marketlab/hg006_terminal_labeling.py \
            scripts/run_hg006_d002_terminal_labeling.py \
            tests/test_hg006_terminal_labeling.py
          pytest -q \
            tests/test_hg006_terminal_labeling.py \
            tests/test_hg006_d003_generator.py \
            tests/test_hg006_stage_contract.py \
            tests/test_hg006_base_rates.py

      - name: Download exact passed D003 threading
        uses: actions/download-artifact@v4
        with:
          name: hg006-d003-p1-37652989339
          path: reports/d003
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37652989339

      - name: Download exact full L001 P2 ingestion
        uses: actions/download-artifact@v4
        with:
          name: hg006-l001-p2-full-37638982587
          path: reports/p2
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37638982587

      - name: Download exact S002 historical evidence pack
        uses: actions/download-artifact@v4
        with:
          name: hg006-s002-37416075608
          path: reports/s002
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37416075608

      - name: Verify frozen source authorities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          d003=json.loads(Path("reports/d003/hg006-d003-p1-threading.json").read_text())
          p2=json.loads(Path("reports/p2/full/hg006-l001-p2-full-ingestion.json").read_text())
          s002=json.loads(Path("reports/s002/hg006-s002-evidence-pack.json").read_text())

          assert d003["threading_sha256"] == "4d4a58bf7179305ee134a098bd063436bef060077b785056e499d9c885a8d250"
          assert d003["episode_count"] == 333
          assert d003["historical_terminal_labels_opened"] is False

          assert p2["ingestion_sha256"] == "2188bf803f2088cd10f26892f92f1a82fc810543ad9679c4fc20534e2a3e59e6"
          assert p2["validated_request_count"] == 1448
          assert p2["historical_terminal_labels_opened"] is False

          assert s002["pack_sha256"] == "e99f270bf48b76bb72f3e2734abddd34bcc580cb1583086cc73e50759e23766e"
          assert s002["historical_terminal_labels_opened"] is False
          PY

      - name: Apply frozen D002 terminal ontology
        run: |
          mkdir -p reports/d002
          python scripts/run_hg006_d002_terminal_labeling.py \
            --threading reports/d003/hg006-d003-p1-threading.json \
            --ingestion reports/p2/full/hg006-l001-p2-full-ingestion.json \
            --evidence-pack reports/s002/hg006-s002-evidence-pack.json \
            --out reports/d002/hg006-d002-p1-terminal-labels.json

      - name: Prove labels are outcome-only and returns remain closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(Path("reports/d002/hg006-d002-p1-terminal-labels.json").read_text())
          assert p["labeler_id"] == "HG006-D002-P1-v1"
          assert p["episode_count"] == 333
          assert p["feasibility_pass"] is True
          assert p["promotion_allowed_to_d004_base_rates"] is True
          assert p["historical_terminal_labels_opened"] is True
          assert p["completion_probabilities_assigned"] is False
          assert p["return_outcomes_opened"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          print(json.dumps({
            "label_panel_sha256":p["label_panel_sha256"],
            "primary_state_counts_by_family":p["primary_state_counts_by_family"],
            "warrant_full_exercise_state_counts":p["warrant_full_exercise_state_counts"],
            "threshold_passes":p["threshold_passes"],
          },indent=2,sort_keys=True))
          PY

      - name: Upload exact D002 labels
        uses: actions/upload-artifact@v4
        with:
          name: hg006-d002-p1-${{ github.run_id }}
          path: reports/d002
          if-no-files-found: error
          retention-days: 90
