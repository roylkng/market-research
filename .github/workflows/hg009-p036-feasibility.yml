name: HG009 P036 source-only next independent cohort feasibility

on:
  push:
    branches:
      - main
      - research/hg009-p036-independent-index-sourced-cohort-feasibility-20261021
    paths:
      - .github/workflows/hg009-p036-feasibility.yml
      - src/marketlab/hg009_p036_independent_pool.py
      - scripts/materialize_hg009_p036.py
      - tests/test_hg009_p036_pool.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hg009-p036-original-index-source-feasibility
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Source-only exact industry and historical-liquidity matching
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_hg009_p036.py
          python scripts/materialize_hg009_p036.py --check
          ruff check src/marketlab/hg009_p036_independent_pool.py scripts/materialize_hg009_p036.py tests/test_hg009_p036_pool.py
          pytest -q tests/test_hg009_p036_pool.py
      - name: Commit source-bound feasibility to research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/hg009/hg009-p036-next-cohort-industry-feasibility-v1.json
          if git diff --cached --quiet; then
            echo "P036 feasibility already signed; no new source selection"
            exit 0
          fi
          git commit -m "HG009 P036: freeze independent source-industry matching limits [skip ci]"
          TARGET_BRANCH="$GITHUB_REF_NAME"
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          python scripts/materialize_hg009_p036.py --check
          git push origin "HEAD:$TARGET_BRANCH"
