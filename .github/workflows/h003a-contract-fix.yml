name: H003-A contract fix once

on:
  push:
    branches:
      - feat/h003-claim-candidates-v1
    paths:
      - .github/workflows/h003a-contract-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/h003-claim-candidates-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Align canonical extraction-rule hash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/marketlab/h003_candidates.py')
          text = path.read_text(encoding='utf-8')
          old = '363880e2a7798f69c5c70f14716ec1e8830e7234c2f7996895f95c6f886db335'
          new = 'db954a0737bf9b049130c899104008479e677460a21c98b6a54855188180def8'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one old extraction-rule hash, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests --fix
      - run: ruff check src tests
      - run: pytest -q
      - run: make validate
      - name: Commit validated contract alignment
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git rm .github/workflows/h003a-contract-fix.yml
          git add src tests pyproject.toml Makefile registry/h003_extraction_rule.yaml scripts/build_h003_candidates.py
          git commit -m "Validate frozen H003 claim-candidate extraction contract"
          git push origin HEAD:feat/h003-claim-candidates-v1
