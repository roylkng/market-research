name: H003-V001 r3 JSONL reviewer view

on:
  push:
    branches:
      - run/h003-v001-blind-review-r3-20260907
    paths:
      - .github/workflows/h003-v001-r3-jsonl-review-view.yml

permissions:
  contents: write

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/h003-v001-blind-review-r3-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build one-candidate-per-line lossless projection
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('research/prospective/h003/FY27-Q2-2026-09-06/review-v001-r3')
          source_root = root / 'batches20'
          out = root / 'review-jsonl'
          out.mkdir(parents=True, exist_ok=True)

          def h(value):
              return hashlib.sha256(
                  json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False, allow_nan=False).encode()
              ).hexdigest()

          manifest = json.loads((source_root / 'manifest.json').read_text(encoding='utf-8'))
          unsigned = dict(manifest)
          declared_manifest_sha = unsigned.pop('manifest_sha256')
          if h(unsigned) != declared_manifest_sha:
              raise SystemExit('source batch manifest hash mismatch')

          entries = []
          total = 0
          for source_entry in manifest['batches']:
              source_path = source_root / source_entry['file']
              items = json.loads(source_path.read_text(encoding='utf-8'))
              if h(items) != source_entry['batch_sha256']:
                  raise SystemExit(f"source batch hash mismatch: {source_entry['file']}")
              filename = source_entry['file'].replace('.json', '.jsonl')
              target = out / filename
              lines = [json.dumps(item, ensure_ascii=False, separators=(',', ':')) for item in items]
              target.write_text('\n'.join(lines) + '\n', encoding='utf-8')
              entries.append({
                  'batch_index': source_entry['batch_index'],
                  'file': filename,
                  'candidate_count': len(items),
                  'source_batch_sha256': source_entry['batch_sha256'],
                  'jsonl_bytes_sha256': hashlib.sha256(target.read_bytes()).hexdigest(),
                  'first_candidate_id': items[0]['candidate_id'],
                  'last_candidate_id': items[-1]['candidate_id'],
              })
              total += len(items)
          if total != manifest['candidate_count']:
              raise SystemExit('JSONL candidate denominator mismatch')
          out_unsigned = {
              'schema_version': 1,
              'source_batch_manifest_sha256': declared_manifest_sha,
              'candidate_count': total,
              'batch_count': len(entries),
              'entries': entries,
          }
          out_manifest = {**out_unsigned, 'manifest_sha256': h(out_unsigned)}
          (out / 'manifest.json').write_text(
              json.dumps(out_manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'candidate_count': total,
              'batch_count': len(entries),
              'manifest_sha256': out_manifest['manifest_sha256'],
          }, indent=2, sort_keys=True))
          PY
      - name: Anchor JSONL projection and remove workflow
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git rm .github/workflows/h003-v001-r3-jsonl-review-view.yml
          git add research/prospective/h003/FY27-Q2-2026-09-06/review-v001-r3/review-jsonl
          git commit -m "Anchor lossless H003-V001 r3 JSONL reviewer view"
          git push origin HEAD:run/h003-v001-blind-review-r3-20260907
