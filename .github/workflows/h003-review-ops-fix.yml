name: H003 review operations fix once

on:
  push:
    branches:
      - feat/h003-review-operations-v1
    paths:
      - .github/workflows/h003-review-ops-fix.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/h003-review-operations-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/h003_ops_fix_once.py
      - run: ruff check src tests scripts --fix
      - run: ruff check src tests scripts
      - run: pytest -q
      - run: make validate
      - name: Commit validated operational fixes
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git rm .github/workflows/h003-review-ops-fix.yml scripts/h003_ops_fix_once.py
          git add src tests scripts/build_h003_review_package.py scripts/chunk_h003_review_queue.py scripts/freeze_h003_review.py
          git commit -m "Harden H003 blind review operations and source denominator"
          git push origin HEAD:feat/h003-review-operations-v1
