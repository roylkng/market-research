name: SS001 D005 point-in-time source readiness

on:
  push:
    branches:
      - research/ss001-d005-asof-source-readiness-20261008

permissions:
  actions: read
  contents: read

jobs:
  materialize:
    if: contains(github.event.head_commit.message, '[ss001-d005]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate implementation before opening source outputs
        run: |
          ruff check src/marketlab/ss001_size_asof.py scripts/materialize_ss001_d005.py tests/test_ss001_size_asof.py
          pytest -q tests/test_ss001_size_asof.py
      - name: Download frozen D001 market census
        uses: actions/download-artifact@v4
        with:
          name: ss001-d001-37197575401
          path: reports/d001
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37197575401
      - name: Download frozen D002 shareholding source census
        uses: actions/download-artifact@v4
        with:
          name: ss001-d002-37198355430
          path: reports/d002
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37198355430
      - name: Download frozen D004 share-count source panel
        uses: actions/download-artifact@v4
        with:
          name: ss001-d004-37719724682
          path: reports/d004
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37719724682
      - name: Materialize frozen source-readiness audit
        run: |
          python scripts/materialize_ss001_d005.py \
            --market-census reports/d001/ss001-d001-census.json \
            --shareholding-census reports/d002/ss001-d002-shareholding-sources.json \
            --share-count-panel reports/d004/ss001-d004-panel.json \
            --output reports/d005
      - name: Assert no capitalization or portfolio decision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path("reports/d005/ss001-d005-panel.json").read_text())
          assert payload["audit_id"]=="SS001-D005-v1"
          assert len(payload["rows"])==2319
          assert payload["market_capitalization_calculated"] is False
          assert all(row["capitalization_calculation_allowed"] is False for row in payload["rows"])
          assert all(row["share_action_clearance_proven"] is False for row in payload["rows"])
          assert payload["return_outcomes_opened"] is False
          assert payload["portfolio_eligibility_allowed"] is False
          assert payload["live_capital_allowed"] is False
          print(json.dumps({key:value for key,value in payload.items() if key!="rows"},indent=2,sort_keys=True))
          PY
      - name: Upload exact D005 source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss001-d005-${{ github.run_id }}
          path: reports/d005
          if-no-files-found: warn
          retention-days: 90
