name: RM001-v2 P001 size attribution

on:
  push:
    branches:
      - feat/rm001-v2-p001-materialization-20261001

permissions:
  contents: read

jobs:
  pilot:
    if: contains(github.event.head_commit.message, '[rm001-v2-p001]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify RM001-v2 P001 implementation before source access
        run: |
          ruff check \
            src/marketlab/rm001_v2.py \
            src/marketlab/rm001_size_panel.py \
            src/marketlab/rm001_v2_p001.py \
            scripts/build_rm001_v2_size_panel.py \
            scripts/build_rm001_v2_historical_state.py \
            scripts/run_rm001_v2_p001.py \
            tests/test_rm001_v2.py \
            tests/test_rm001_size_panel.py \
            tests/test_rm001_v2_p001.py
          pytest -q \
            tests/test_rm001.py \
            tests/test_rm001_v2.py \
            tests/test_rm001_size_panel.py \
            tests/test_rm001_v2_p001.py \
            tests/test_po001_i003.py

      - name: Rebuild fixed official NSE market panel
        run: |
          python scripts/build_ae001_historical_panel.py \
            --start-date 2025-09-01 \
            --end-date 2026-09-25 \
            --store .marketlab/rm001-v2-p001 \
            --output reports/rm001-v2-p001/panel \
            --attempts 4 \
            --timeout-seconds 30 \
            --pause-seconds 0.05

      - name: Rebuild corporate-action-safe AE001 feature plane
        run: |
          python scripts/build_ae001_action_safe_panel.py \
            --market-panel reports/rm001-v2-p001/panel/market-panel.json.gz \
            --feature-panel reports/rm001-v2-p001/panel/feature-panel.json.gz \
            --start-date 2025-09-01 \
            --end-date 2026-09-25 \
            --raw-dir reports/rm001-v2-p001/corporate-actions/raw \
            --output reports/rm001-v2-p001/action-safe \
            --chunk-days 31 \
            --attempts 4 \
            --timeout-seconds 30

      - name: Build D007-bound historical size panel
        run: |
          python scripts/build_rm001_v2_size_panel.py \
            --market-panel reports/rm001-v2-p001/panel/market-panel.json.gz \
            --store .marketlab/rm001-v2-p001 \
            --output reports/rm001-v2-p001/size \
            --attempts 4 \
            --timeout-seconds 30

      - name: Build RM001-v2 risk state as of 31 Aug
        run: |
          python scripts/build_rm001_v2_historical_state.py \
            --market-panel reports/rm001-v2-p001/panel/market-panel.json.gz \
            --feature-panel reports/rm001-v2-p001/action-safe/action-safe-feature-panel.json.gz \
            --action-ledger reports/rm001-v2-p001/action-safe/corporate-action-ledger.json.gz \
            --size-panel reports/rm001-v2-p001/size/size-panel.json.gz \
            --as-of-session 2026-08-31 \
            --output reports/rm001-v2-p001/risk-v2

      - name: Run frozen P001 attribution on exact sealed I002 control
        run: |
          python scripts/run_rm001_v2_p001.py \
            --v1-risk-state research/po001-i003/inputs/i002-risk-state-legacy.json.gz \
            --v2-risk-state reports/rm001-v2-p001/risk-v2/risk-state.json.gz \
            --i002-control research/po001-i003/inputs/i002-integrated-control-v1.json.gz \
            --output reports/rm001-v2-p001/study

      - name: Print compact result
        run: |
          cat reports/rm001-v2-p001/size/manifest.json
          cat reports/rm001-v2-p001/risk-v2/summary.json
          cat reports/rm001-v2-p001/study/summary.json

      - name: Upload exact P001 development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rm001-v2-p001-${{ github.run_id }}
          path: |
            reports/rm001-v2-p001
            .marketlab/rm001-v2-p001/market-data
          if-no-files-found: warn
          retention-days: 90
