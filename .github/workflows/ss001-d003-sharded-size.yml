name: SS001 D003 sharded current company-size source

on:
  push:
    branches:
      - research/ss001-d003-sharded-size-20261004

permissions:
  actions: read
  contents: read

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[ss001-d003-sharded]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate frozen sharded implementation before source access
        run: |
          ruff check \
            src/marketlab/ss001_size.py \
            src/marketlab/nse.py \
            scripts/run_ss001_d003_shard.py \
            scripts/merge_ss001_d003.py \
            tests/test_ss001_size.py \
            tests/test_nse_quote_raw.py
          pytest -q tests/test_ss001_size.py tests/test_nse_quote_raw.py

  shard:
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Download exact passed SS001 D001 census
        uses: actions/download-artifact@v4
        with:
          name: ss001-d001-37197575401
          path: reports/ss001-d001-source
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37197575401
      - name: Run frozen size shard
        run: |
          python scripts/run_ss001_d003_shard.py \
            --d001-census reports/ss001-d001-source/ss001-d001-census.json \
            --raw-dir "reports/ss001-d003-shard-${{ matrix.shard }}/raw" \
            --output "reports/ss001-d003-shard-${{ matrix.shard }}" \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 6 \
            --attempts 3 \
            --timeout-seconds 20 \
            --pause-seconds 0.01
      - name: Upload exact shard evidence
        uses: actions/upload-artifact@v4
        with:
          name: ss001-d003-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: reports/ss001-d003-shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 90

  merge:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Download exact passed SS001 D001 census
        uses: actions/download-artifact@v4
        with:
          name: ss001-d001-37197575401
          path: reports/ss001-d001-source
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37197575401
      - name: Download all size shards
        uses: actions/download-artifact@v4
        with:
          pattern: ss001-d003-shard-*-${{ github.run_id }}
          path: reports/ss001-d003-shards
          merge-multiple: true
      - name: Merge frozen size panel
        run: |
          python scripts/merge_ss001_d003.py \
            --d001-census reports/ss001-d001-source/ss001-d001-census.json \
            --shards-root reports/ss001-d003-shards \
            --output reports/ss001-d003
      - name: Prove outcome-blind size panel
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          panel=json.loads(Path("reports/ss001-d003/ss001-d003-size-panel.json").read_text())
          assert panel["panel_id"]=="SS001-D003-v1"
          assert panel["identity_count"]==2319
          assert panel["return_outcomes_opened"] is False
          assert panel["model_fitted"] is False
          assert panel["portfolio_eligibility_allowed"] is False
          assert panel["live_capital_allowed"] is False
          print(json.dumps({
            "panel_sha256":panel["panel_sha256"],
            "ready_market_cap_count":panel["ready_market_cap_count"],
            "ready_market_cap_ratio":panel["ready_market_cap_ratio"],
            "outside_u001_ready_market_cap_count":panel["outside_u001_ready_market_cap_count"],
            "outside_u001_ready_market_cap_ratio":panel["outside_u001_ready_market_cap_ratio"],
            "size_band_counts":panel["size_band_counts"],
            "outside_u001_size_band_counts":panel["outside_u001_size_band_counts"],
            "threshold_passes":panel["threshold_passes"],
            "feasibility_pass":panel["feasibility_pass"],
          },indent=2,sort_keys=True))
          PY
      - name: Upload merged D003 evidence
        uses: actions/upload-artifact@v4
        with:
          name: ss001-d003-${{ github.run_id }}
          path: reports/ss001-d003
          if-no-files-found: error
          retention-days: 90
