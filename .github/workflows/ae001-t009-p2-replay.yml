name: AE001 T009 P2 comparison replay

on:
  push:
    branches:
      - feat/ae001-t009-stock-options-positioning-20261001

permissions:
  contents: read
  actions: read

jobs:
  replay:
    if: contains(github.event.head_commit.message, '[t009-p2-replay]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify P2 implementation and canonical trial state
        run: |
          ruff check \
            src/marketlab/alpha_diagnostics.py \
            src/marketlab/alpha_options_trial.py \
            scripts/run_ae001_t009.py \
            tests/test_alpha_diagnostics.py \
            tests/test_alpha_options_trial.py
          pytest -q \
            tests/test_alpha_diagnostics.py \
            tests/test_alpha_options_trial.py
          python - <<'PY'
          import json
          from marketlab.alpha_trials import (
              require_protocol_amendment,
              require_unopened_registered_trial,
              validate_trial_ledger,
          )
          ledger=json.load(open("research/ae001/trial-ledger.json"))
          validate_trial_ledger(ledger)
          require_unopened_registered_trial(
              ledger,
              trial_id="AE001-T009",
              required_status="FROZEN_BEFORE_OUTCOME_MATERIALIZATION",
          )
          require_protocol_amendment(
              ledger,
              trial_id="AE001-T009",
              protocol_id="AE001-T009-P1",
          )
          require_protocol_amendment(
              ledger,
              trial_id="AE001-T009",
              protocol_id="AE001-T009-P2",
          )
          print("T009 P1+P2: READY")
          PY

      - name: Download exact failed-run source evidence
        uses: actions/download-artifact@v4
        with:
          name: ae001-t009-36824004775
          path: evidence/t009-failed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: roylkng/market-research
          run-id: 36824004775

      - name: Locate and replay frozen T009 comparison
        shell: bash
        run: |
          set -euo pipefail
          MARKET="$(find evidence/t009-failed -path '*/reports/ae001-t009-outcome/panel/market-panel.json.gz' -print -quit)"
          FEATURE="$(find evidence/t009-failed -path '*/reports/ae001-t009-outcome/options/options-feature-panel.json.gz' -print -quit)"
          ACTION="$(find evidence/t009-failed -path '*/reports/ae001-t009-outcome/action-safe/corporate-action-ledger.json.gz' -print -quit)"
          test -n "$MARKET"
          test -n "$FEATURE"
          test -n "$ACTION"
          python scripts/run_ae001_t009.py \
            --market-panel "$MARKET" \
            --feature-panel "$FEATURE" \
            --action-ledger "$ACTION" \
            --trial-ledger research/ae001/trial-ledger.json \
            --output reports/ae001-t009-p2-replay

      - name: Print compact result
        run: cat reports/ae001-t009-p2-replay/summary.json

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae001-t009-p2-replay-${{ github.run_id }}
          path: reports/ae001-t009-p2-replay
          if-no-files-found: warn
          retention-days: 90
