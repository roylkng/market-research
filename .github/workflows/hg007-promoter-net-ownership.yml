name: HG007 original promoter shares versus QIP denominator

on:
  pull_request:
    paths:
      - src/marketlab/hg007_promoter_net_ownership.py
      - scripts/reconcile_hg007_promoter_net_ownership.py
      - tests/test_hg007_promoter_net_ownership.py
      - .github/workflows/hg007-promoter-net-ownership.yml
  push:
    branches:
      - main
    paths:
      - src/marketlab/hg007_promoter_net_ownership.py
      - scripts/reconcile_hg007_promoter_net_ownership.py
      - tests/test_hg007_promoter_net_ownership.py
      - .github/workflows/hg007-promoter-net-ownership.yml

permissions:
  contents: write

concurrency:
  group: hg007-source-verified-promoter-net-holdings-p040
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Check exact original June and September XBRLs and no-lookahead guard
        run: |
          ruff check src/marketlab/hg007_promoter_net_ownership.py scripts/reconcile_hg007_promoter_net_ownership.py tests/test_hg007_promoter_net_ownership.py
          pytest -q tests/test_hg007_promoter_net_ownership.py
      - name: Reproduce original two-report share count bridge
        run: |
          python scripts/reconcile_hg007_promoter_net_ownership.py \
            --output /tmp/hg007-p040-promoter-net-reconciliation.json
          test -s /tmp/hg007-p040-promoter-net-reconciliation.json
      - name: Append-only original evidence overlay after main merge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          TARGET="research/hg007/hg007-p040-net-promoter-share-reconciliation-v1.json"
          if [[ -f "$TARGET" ]]; then
            python scripts/reconcile_hg007_promoter_net_ownership.py \
              --output "$TARGET" --verify-existing
            echo "P040 immutable evidence already verified"
            exit 0
          fi
          cp /tmp/hg007-p040-promoter-net-reconciliation.json "$TARGET"
          git config user.name marketlab-research-bot
          git config user.email marketlab-research-bot@users.noreply.github.com
          git add "$TARGET"
          git commit -m "HG007: anchor original June-Sep net promoter shares and QIP dilution [skip ci]"
          BASE_SHA="$(git rev-parse HEAD^)"
          for RETRY in 1 2 3; do
            git fetch origin main
            NEW_MAIN="$(git rev-parse origin/main)"
            if git cat-file -e "origin/main:$TARGET" 2>/dev/null; then
              echo "Original promoter bridge already anchored; refusing overwrite"
              exit 1
            fi
            if ! git diff --quiet "$BASE_SHA" "$NEW_MAIN" -- \
              research/hg007/outside-u001-governance-2026-10-04 \
              research/hg007/inoxgreen-post-qip-special \
              research/hg007/hg007-p039-inoxgreen-governance-first-seen-timeline-v1.json \
              src/marketlab/hg007_promoter_net_ownership.py \
              scripts/reconcile_hg007_promoter_net_ownership.py; then
              echo "Pinned XBRL source/rule changed while computing bridge"
              exit 1
            fi
            if [[ "$NEW_MAIN" != "$BASE_SHA" ]]; then
              git rebase origin/main
              BASE_SHA="$NEW_MAIN"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((RETRY*2))"
          done
          echo "Could not anchor original promoter net-share evidence"
          exit 1
      - name: Preserve reviewable original source evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hg007-ino-green-jun-sep-primary-promoter-net-shares
          path: /tmp/hg007-p040-promoter-net-reconciliation.json
          if-no-files-found: ignore
          retention-days: 90
