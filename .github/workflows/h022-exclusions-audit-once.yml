name: H022 one-shot exclusions audit

on:
  push:
    branches:
      - research/h022-historical-return-challenge-v1-20260913
    paths:
      - .github/workflows/h022-exclusions-audit-once.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h022-historical-return-challenge-v1-20260913
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build compact exclusions audit
        run: |
          python scripts/summarize_h022_exclusions.py \
            --report research/historical/h022/management-information-delta-v1/challenge-2026-09-11/outcome-report.json \
            --out research/historical/h022/management-information-delta-v1/challenge-2026-09-11/exclusions-summary.json

      - name: Anchor audit and remove one-shot workflow
        run: |
          git config user.name 'marketlab-research-bot'
          git config user.email 'marketlab-research-bot@users.noreply.github.com'
          git add research/historical/h022/management-information-delta-v1/challenge-2026-09-11/exclusions-summary.json
          git rm .github/workflows/h022-exclusions-audit-once.yml
          git commit -m 'H022: anchor historical exclusions audit'
          git push origin HEAD:research/h022-historical-return-challenge-v1-20260913
