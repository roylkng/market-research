          run-id: 37497193273

      - name: Download shard 05
        uses: actions/download-artifact@v4
        with:
          name: hg006-l001-p2-shard-05-37504647566
          path: reports/shard-05
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37504647566

      - name: Download shard 06
        uses: actions/download-artifact@v4
        with:
          name: hg006-l001-p2-shard-06-37567227703
          path: reports/shard-06
