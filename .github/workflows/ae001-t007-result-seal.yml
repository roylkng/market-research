                  "d003_report_sha256": "7f402beecaf90f054c93ca2ceeaa01f38fcc5cd8f7f8f6391f60791768f8a91f",
              },
              "primary_1d": {
                  "endpoint_supported": False,
                  "base_mean_rank_ic": 0.05057227796742435,
                  "augmented_mean_rank_ic": 0.05048329077707576,
                  "delta_mean_rank_ic": -0.00008898719034858617,
                  "delta_rank_ic_p_value": 0.9380644864094401,
                  "base_top_minus_bottom_spread": 0.002146872816307611,
                  "augmented_top_minus_bottom_spread": 0.002217490371862521,
                  "delta_top_minus_bottom_spread": 0.00007061755555491002,
