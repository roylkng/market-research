name: H018 independent Low Volatility 50 challenge

on:
  push:
    branches:
      - research/h018-promotion-audit-20260908
    paths:
      - .github/workflows/h018-independent-challenge.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h018-promotion-audit-20260908
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen research environment
        run: python -m pip install -e '.[dev]'
      - name: Verify repository before first H018 outcome
        run: |
          ruff check src tests scripts
          pytest -q
          marketlab validate-registry registry/hypotheses.yaml
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import run_h018_low_volatility_50 as h18
          assert h18.MARKET_START.isoformat() == '2013-11-01'
          assert h18.MARKET_END.isoformat() == '2017-05-31'
          assert h18.DECISION_MONTHS == ((2014, 11), (2015, 5), (2015, 11), (2016, 5), (2016, 11))
          assert h18.SELECT_COUNT == 50
          assert h18.RANDOM_SEED == 1818
          assert h18.RANDOM_DRAWS == 10_000
          print('H018 frozen challenge contract verified')
          PY
      - name: Prepare H018 output root
        run: mkdir -p /tmp/h018-independent
      - name: Restore accelerated official-source checkpoints
        uses: actions/download-artifact@v4
        with:
          name: h018-fast-static-checkpoints-34328827482
          path: /tmp/h018-independent
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 34328827482
      - name: Verify restored checkpoints and every retained source byte
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from datetime import date, timedelta
          from pathlib import Path

          root = Path('/tmp/h018-independent').resolve()
          summary_path = root / 'fast-acquisition-summary.json'
          summary = json.loads(summary_path.read_text(encoding='utf-8'))
          if summary.get('status') != 'H018_STATIC_SOURCE_ACQUISITION_ONLY':
              raise SystemExit('unexpected accelerated-source artifact status')
          if summary.get('market_selection_outcomes_opened') is not False:
              raise SystemExit('accelerated-source artifact opened an outcome')
          if summary.get('remaining_unresolved_count') != 328:
              raise SystemExit('accelerated-source unresolved census changed')

          files = sorted((root / 'checkpoints').glob('*.json'))
          if len(files) != 980:
              raise SystemExit(f'expected 980 retained checkpoints, found {len(files)}')

          common = 0
          no_session = 0
          seen_dates = set()
          for path in files:
              doc = json.loads(path.read_text(encoding='utf-8'))
              if doc.get('schema_version') != 1:
                  raise SystemExit(f'bad checkpoint schema: {path}')
              if doc.get('date') != path.stem:
                  raise SystemExit(f'checkpoint date/path mismatch: {path}')
              if path.stem in seen_dates:
                  raise SystemExit(f'duplicate checkpoint date: {path.stem}')
              seen_dates.add(path.stem)
              status = doc.get('status')
              if status == 'NO_SESSION':
                  no_session += 1
                  continue
              if status != 'COMMON_SESSION':
                  raise SystemExit(f'unknown checkpoint status: {path}')
              common += 1
              for key in ('bhavcopy', 'index'):
                  meta = doc.get(key)
                  if not isinstance(meta, dict):
                      raise SystemExit(f'missing {key} metadata: {path}')
                  rel = str(meta.get('raw_path') or '')
                  candidate = (root / rel).resolve()
                  if root not in candidate.parents:
                      raise SystemExit(f'checkpoint path escapes root: {path}')
                  if not candidate.is_file():
                      raise SystemExit(f'missing retained source: {candidate}')
                  raw = candidate.read_bytes()
                  if hashlib.sha256(raw).hexdigest() != meta.get('sha256'):
                      raise SystemExit(f'source hash mismatch: {candidate}')
                  if len(raw) != meta.get('bytes'):
                      raise SystemExit(f'source byte-size mismatch: {candidate}')

          if common != 812 or no_session != 168:
              raise SystemExit(
                  f'unexpected checkpoint status counts: common={common}, no_session={no_session}'
              )

          expected_dates = set()
          cursor = date(2013, 11, 1)
          end = date(2017, 5, 31)
          while cursor <= end:
              expected_dates.add(cursor.isoformat())
              cursor += timedelta(days=1)
          missing = sorted(expected_dates - seen_dates)
          if len(missing) != 328:
              raise SystemExit(f'expected 328 unresolved dates, found {len(missing)}')
          if missing != summary.get('remaining_unresolved_dates'):
              raise SystemExit('accelerated-source missing-date list mismatch')
          if '2016-06-20' not in missing:
              raise SystemExit('known retained-corpus hole is unexpectedly absent')

          forbidden = ('point-in-time-selections.json', 'challenge-summary.json', 'selected.csv')
          if any((root / name).exists() for name in forbidden):
              raise SystemExit('accelerated-source artifact contains outcome files')

          print(
              f'H018 accelerated corpus verified: {len(files)} checkpoints, '
              f'{common} common sessions, {no_session} no-session days, '
              f'{len(missing)} dates left for conservative acquisition'
          )
          PY
      - name: Run frozen H018 challenge with durable market checkpoints
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_h018_low_volatility_50.py --out /tmp/h018-independent \
            | tee /tmp/h018-independent/run.log
          test -s /tmp/h018-independent/point-in-time-selections.json
          test -s /tmp/h018-independent/challenge-summary.json
          test -s /tmp/h018-independent/selected.csv
      - name: Upload H018 results and acquisition diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h018-independent-challenge-results-${{ github.run_id }}
          path: |
            /tmp/h018-independent/point-in-time-selections.json
            /tmp/h018-independent/challenge-summary.json
            /tmp/h018-independent/selected.csv
            /tmp/h018-independent/market-acquisition-diagnostics.json
            /tmp/h018-independent/market-source-manifest.json
            /tmp/h018-independent/source-manifest.json
            /tmp/h018-independent/run.log
          if-no-files-found: warn
          retention-days: 30
      - name: Upload durable market checkpoints and retained official source bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h018-independent-challenge-checkpoints-${{ github.run_id }}
          path: |
            /tmp/h018-independent/checkpoints
            /tmp/h018-independent/raw
            /tmp/h018-independent/fast-acquisition-summary.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
