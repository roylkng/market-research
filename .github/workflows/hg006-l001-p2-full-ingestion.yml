        with:
          name: hg006-l001-p2-shard-12-37623404972
          path: reports/shard-12
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37623404972

      - name: Download shard 13
        uses: actions/download-artifact@v4
        with:
          name: hg006-l001-p2-shard-13-37638051774
          path: reports/shard-13
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37638051774

      - name: Download shard 14
        uses: actions/download-artifact@v4
        with:
          name: hg006-l001-p2-shard-14-37629563767
          path: reports/shard-14
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37629563767

      - name: Download shard 15
        uses: actions/download-artifact@v4
        with:
          name: hg006-l001-p2-shard-15-37638125237
          path: reports/shard-15
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37638125237

      - name: Materialize exact 16-bundle directory
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          manifest=json.loads(
              Path("research/hg006/hg006-l001-p2-full-ingestion-sources-v1.json").read_text()
          )
          assert manifest["execution_id"] == "HG006-L001-P2-v1"
          assert manifest["expected_request_count"] == 1448
          assert len(manifest["shards"]) == 16
          assert manifest["historical_terminal_labels_opened"] is False

          out=Path("reports/bundles")
          out.mkdir(parents=True,exist_ok=True)
          seen=[]
          for row in manifest["shards"]:
              shard=int(row["shard_id"])
              root=Path(f"reports/shard-{shard:02d}")
              name=f"hg006-l001-p2-shard-{shard:02d}.json"
              matches=list(root.rglob(name))
              assert len(matches)==1,(shard,[str(p) for p in matches])
              payload=json.loads(matches[0].read_text())
              assert payload["execution_id"]=="HG006-L001-P2-v1"
              assert payload["shard_id"]==shard
              assert payload["historical_terminal_labels_opened"] is False
              assert payload["completion_probabilities_assigned"] is False
              assert payload["return_outcomes_opened"] is False
              shutil.copyfile(matches[0],out/name)
              seen.append({
                  "shard_id":shard,
                  "bundle_sha256":payload["bundle_sha256"],
                  "request_count":payload["request_count"],
                  "status_counts":payload["status_counts"],
              })
          assert [row["shard_id"] for row in seen] == list(range(16))
          Path("reports/shard-evidence-map.json").write_text(
              json.dumps(seen,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(seen,indent=2,sort_keys=True))
          PY

      - name: Combine exact frozen shard bundles
        run: |
          mkdir -p reports/full
          python scripts/combine_hg006_l001_p2_shards.py \
            --queue reports/queue/hg006-l001-p1-queue.json \
            --p0-run reports/p0/hg006-l001-p0-native-run.json \
            --bundles-dir reports/bundles \
            --out reports/full/hg006-l001-p2-full-ingestion.json

      - name: Prove full P2 gate before outcomes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(
              Path("reports/full/hg006-l001-p2-full-ingestion.json").read_text()
          )
          assert p["execution_id"] == "HG006-L001-P2-v1"
          assert p["request_count"] == 1448
          assert p["full_ingestion_pass"] is True
          assert p["promotion_allowed_to_d003_threading"] is True
          assert p["historical_terminal_labels_opened"] is False
          assert p["completion_probabilities_assigned"] is False
          assert p["return_outcomes_opened"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          print(json.dumps({
              "ingestion_sha256":p["ingestion_sha256"],
              "status_counts":p["status_counts"],
              "validated_request_count":p["validated_request_count"],
              "validated_request_ratio":p["validated_request_ratio"],
              "evidence_ready_chronology_count":p["evidence_ready_chronology_count"],
              "validated_chronology_count":p["validated_chronology_count"],
              "validated_chronology_ratio":p["validated_chronology_ratio"],
              "threshold_passes":p["threshold_passes"],
              "full_ingestion_pass":p["full_ingestion_pass"],
          },indent=2,sort_keys=True))
          PY

      - name: Upload exact full P2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: hg006-l001-p2-full-${{ github.run_id }}
          path: |
            reports/full
            reports/shard-evidence-map.json
          if-no-files-found: error
          retention-days: 90
