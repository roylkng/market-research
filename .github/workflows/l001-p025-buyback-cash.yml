name: L001 P025 original GESHIP buyback rounded cash NAV audit

on:
  push:
    branches:
      - research/l001-p025-geship-buyback-cash-nav-accretion-20261021
    paths:
      - .github/workflows/l001-p025-buyback-cash.yml
      - src/marketlab/l001_p025_nav_accretion.py
      - scripts/archive_l001_p025_nav_accretion.py
      - tests/test_l001_p025_nav_accretion.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l001-p025-geship-issuer-html
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install original source parser and regression suite
        run: python -m pip install -e '.[dev]'

      - name: Verify no assumed cash payouts or fabricated current NAV
        shell: bash
        run: |
          set -euo pipefail
          ruff check \
            src/marketlab/l001_p025_nav_accretion.py \
            scripts/archive_l001_p025_nav_accretion.py \
            tests/test_l001_p025_nav_accretion.py
          pytest -q tests/test_l001_p025_nav_accretion.py
          python scripts/archive_l001_p025_nav_accretion.py --check

      - name: Capture and sign issuer's dated daily HTML source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/archive_l001_p025_nav_accretion.py \
            --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python scripts/archive_l001_p025_nav_accretion.py --check

      - name: Commit original source even if HTTP access or issuer page changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add -f research/l001/originals/geship_2026_buyback_table
          if [ -f research/l001/l001-p025-geship-issuer-buyback-cash-nav-v1.json ]; then
            git add research/l001/l001-p025-geship-issuer-buyback-cash-nav-v1.json
          fi
          if git diff --cached --quiet; then
            echo "No new original issuer source evidence"
            exit 0
          fi
          git commit -m "L001 P025: archive original issuer buyback daily HTML and rounded cash arithmetic [skip ci]"
          git fetch origin research/l001-p025-geship-buyback-cash-nav-accretion-20261021
          git rebase origin/research/l001-p025-geship-buyback-cash-nav-accretion-20261021
          python scripts/archive_l001_p025_nav_accretion.py --check
          git push origin HEAD:research/l001-p025-geship-buyback-cash-nav-accretion-20261021
