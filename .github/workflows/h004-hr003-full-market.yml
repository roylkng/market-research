name: H004 HR003 full-market denominator

on:
  push:
    branches:
      - research/h004-full-market-denominator-v1-20260908
    paths:
      - .github/workflows/h004-hr003-full-market.yml
      - scripts/run_h004_full_market_denominator.py
      - research/historical/h004/H004-HR003-full-market/CONTRACT.md

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h004-full-market-denominator-v1-20260908
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run full-market denominator and momentum baseline
        run: |
          python scripts/run_h004_full_market_denominator.py \
            --start 2025-10-01 \
            --end 2026-07-31 \
            --price-start 2025-05-01 \
            --price-end 2026-08-31 \
            --out-dir research/historical/h004/H004-HR003-full-market
      - name: Commit evidence
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/historical/h004/H004-HR003-full-market
          if git diff --cached --quiet; then
            echo "outputs unchanged"
            exit 0
          fi
          git commit -m "H004-HR003: retain full-market denominator replay"
          git push origin HEAD:research/h004-full-market-denominator-v1-20260908
