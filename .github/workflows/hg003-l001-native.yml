name: HG003 L001 full-cohort native run

on:
  push:
    branches:
      - research/hg003-l001-integrated-20261005

permissions:
  actions: read
  contents: read

jobs:
  materialize:
    if: contains(github.event.head_commit.message, '[hg003-l001]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate frozen implementation
        run: |
          ruff check scripts/materialize_hg003_l001_native.py
          pytest -q tests/test_ss002_llm_contract.py tests/test_hg003_threads.py
      - name: Download exact HG003 thread gate
        uses: actions/download-artifact@v4
        with:
          name: hg003-d001-37267831741
          path: reports/hg003-source
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37267831741
      - name: Verify frozen selection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/hg003-source/hg003-d001-thread-selection.json").read_text())
          assert p["selection_id"]=="HG003-D001-v1"
          assert p["selection_sha256"]=="ebc543464475ff9e409b1795c02272a818a3062cef8ad2bafcfafb5fcc30b536"
          assert p["thread_count"]==35
          assert p["selection_state_counts"]=={"TEXT_READY":34,"TEXT_UNAVAILABLE":1}
          assert p["return_outcomes_opened"] is False
          PY
      - name: Materialize sealed GPT-5.6 Sol cohort decisions
        run: |
          python scripts/materialize_hg003_l001_native.py \
            --selection reports/hg003-source/hg003-d001-thread-selection.json \
            --output reports/hg003-l001
      - name: Prove frozen gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/hg003-l001/hg003-l001-result-v1.json").read_text())
          assert p["status"]=="PASSED_FULL_COHORT_RELEVANCE_STAGE_GATE"
          assert p["validated_output_count"]==34
          assert all(p["mechanical_gates"].values())
          assert p["manual_audit"]["manual_audit_pass"] is True
          assert p["promotion_allowed_to_l002"] is True
          assert p["return_outcomes_opened"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          print(json.dumps(p,indent=2,sort_keys=True))
          PY
      - name: Upload exact HG003 L001 run
        uses: actions/upload-artifact@v4
        with:
          name: hg003-l001-${{ github.run_id }}
          path: reports/hg003-l001
          if-no-files-found: error
          retention-days: 90
