name: H003-B blind review hardening once

on:
  push:
    branches:
      - feat/h003-candidate-review-v1
    paths:
      - .github/workflows/h003-review-harden.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/h003-candidate-review-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/h003_review_harden_once.py
      - run: ruff check src tests --fix
      - run: ruff check src tests
      - run: pytest -q
      - run: make validate
      - name: Commit validated review core and remove patch machinery
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git rm .github/workflows/h003-review-harden.yml scripts/h003_review_harden_once.py
          git add src tests registry/h003_review_rule.yaml Makefile
          git commit -m "Freeze blind H003 candidate review and claim-ledger gate"
          git push origin HEAD:feat/h003-candidate-review-v1
