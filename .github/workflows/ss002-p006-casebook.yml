name: SS002 P006 eight-case review packet

on:
  push:
    branches:
      - research/ss002-p006-source-bound-casebook-20261010

permissions:
  actions: read
  contents: read

jobs:
  materialize:
    if: contains(github.event.head_commit.message, '[ss002-p006]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate before source materialization
        run: |
          ruff check src/marketlab/ss002_p006_casebook.py scripts/materialize_ss002_p006.py tests/test_ss002_p006_casebook.py
          pytest -q tests/test_ss002_p006_casebook.py tests/test_ss002_p005_readiness.py
      - name: Exact P003
        uses: actions/download-artifact@v4
        with:
          name: ss002-p003-37982329060
          path: reports/p003
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37982329060
      - name: Exact P004
        uses: actions/download-artifact@v4
        with:
          name: ss002-p004-37985254672
          path: reports/p004
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37985254672
      - name: Exact HG001
        uses: actions/download-artifact@v4
        with:
          name: hg001-d001-37258053642
          path: reports/hg001
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37258053642
      - name: Exact HA001
        uses: actions/download-artifact@v4
        with:
          name: ha001-d001-37218405833
          path: reports/ha001
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37218405833
      - name: Build frozen P006 source review packet
        run: |
          python scripts/materialize_ss002_p006.py \
            --p003-corpus reports/p003/ss002-p003-corpus.json \
            --p003-documents reports/p003/documents \
            --p004-pilot reports/p004/p004-eight-case-sealed.json \
            --p005-gate research/ss002-p005-result-v1.json \
            --hg001-router reports/hg001/hg001-d001-router.json \
            --ha001-panel reports/ha001/ha001-d001-panel.json \
            --out reports/p006/ss002-p006-casebook.json
      - name: Verify no premature underwriting
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/p006/ss002-p006-casebook.json").read_text())
          assert p["pack_id"] == "SS002-P006-v1"
          assert p["case_count"] == 8
          assert p["explicit_fact_count"] == 52
          assert p["underwriting_ready_count"] == 0
          assert p["independent_semantic_audit_complete"] is False
          assert p["expected_returns_calculated"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          print(json.dumps({
            "pack_sha256":p["pack_sha256"],
            "case_count":p["case_count"],
            "explicit_fact_count":p["explicit_fact_count"],
            "cited_segment_reference_count":p["cited_segment_reference_count"],
            "visual_review_symbols":[r["symbol"] for r in p["cases"] if r["requires_visual_review"]],
            "active_case_symbols":[r["symbol"] for r in p["cases"] if r["active_transaction_research_lens"]],
            "case_lane_counts":p["case_lane_counts"]
          },indent=2,sort_keys=True))
          PY
      - name: Upload P006 exact source packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss002-p006-${{ github.run_id }}
          path: reports/p006
          if-no-files-found: warn
          retention-days: 90
