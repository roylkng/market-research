name: SS001 D007 A002 independent semantic audit sample

on:
  push:
    branches:
      - research/ss001-d007-a002-semantic-audit-20261009

permissions:
  contents: read
  actions: read

jobs:
  sample:
    if: contains(github.event.head_commit.message, '[ss001-a002]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate frozen audit protocol
        run: |
          ruff check \
            src/marketlab/ss001_d007_a002.py \
            scripts/materialize_ss001_d007_a002.py \
            tests/test_ss001_d007_a002.py
          pytest -q tests/test_ss001_d007_a002.py tests/test_ss001_l001_batch.py

      - name: Download exact frozen 1,240-request queue
        uses: actions/download-artifact@v4
        with:
          name: ss001-d007-l001-p2-queue-37884584355
          path: reports/ss001-a002-source
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37884584355

      - name: Produce pre-inference independent audit selection
        run: |
          python scripts/materialize_ss001_d007_a002.py \
            --queue reports/ss001-a002-source/ss001-d007-l001-p2-queue.json \
            --out reports/ss001-a002/selection.json

      - name: Verify all source-only gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path("reports/ss001-a002/selection.json").read_text())
          assert p["audit_id"] == "SS001-D007-A002-v1"
          assert p["source_request_count"] == 1240
          assert p["selected_document_count"] == 70
          assert p["selected_issuer_count"] == 12
          assert 70 <= p["selected_page_count"] <= 420
          assert p["model_inference_executed"] is False
          assert p["independent_semantic_audit_complete"] is False
          assert p["share_action_clearance_proven"] is False
          assert p["market_capitalization_calculated"] is False
          assert p["return_outcomes_opened"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          print(json.dumps({
              "selection_sha256": p["selection_sha256"],
              "selected_page_count": p["selected_page_count"],
              "selected_document_count": p["selected_document_count"],
              "selected_issuer_count": p["selected_issuer_count"],
              "selection_reason_counts": p["selection_reason_counts"],
              "selected_pages_by_issuer": p["selected_pages_by_issuer"],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload source-only audit selection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss001-a002-${{ github.run_id }}
          path: reports/ss001-a002
          if-no-files-found: warn
          retention-days: 90
