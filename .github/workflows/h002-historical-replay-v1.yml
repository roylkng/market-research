name: H002 historical replay v1

on:
  push:
    branches:
      - work/h002-historical-replay-v1-20260907
    paths:
      - pyproject.toml
      - registry/h002_historical_replay_rule.yaml
      - src/marketlab/h002_historical.py
      - scripts/run_h002_historical_replay.py
      - tests/test_h002_historical.py
      - docs/h002-historical-replay-v1.md
      - .github/workflows/h002-historical-replay-v1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h002-historical-replay-v1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/h002-historical-replay-v1-20260907
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint full research harness
        run: ruff check src tests scripts
      - name: Test full research harness
        run: pytest -q
      - name: Validate existing hypothesis registry
        run: marketlab validate-registry registry/hypotheses.yaml
      - name: Validate historical replay rule
        run: |
          python - <<'PY'
          from marketlab.h002_historical import load_and_validate_historical_replay_rule
          rule = load_and_validate_historical_replay_rule('registry/h002_historical_replay_rule.yaml')
          print(rule['id'], rule['sha256'])
          PY

  phase-a:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/h002-historical-replay-v1-20260907
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Capture all historical phase-A signals
        run: |
          python scripts/run_h002_historical_replay.py \
            --attempts 5 \
            --timeout 25 \
            --sleep 0.15 \
            --store .marketlab-historical-replay \
            --output research/historical/h002/H002-HR001/phase-a/fixed-u001-transport-signals.json
      - name: Validate frozen phase-A manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path('research/historical/h002/H002-HR001/phase-a/fixed-u001-transport-signals.json')
          doc = json.loads(path.read_text(encoding='utf-8'))
          declared = doc.pop('manifest_sha256')
          encoded = json.dumps(
              doc,
              sort_keys=True,
              separators=(',', ':'),
              ensure_ascii=False,
              allow_nan=False,
          ).encode('utf-8')
          actual = hashlib.sha256(encoded).hexdigest()
          if actual != declared:
              raise SystemExit(f'manifest hash mismatch: declared={declared} actual={actual}')
          if doc.get('phase') != 'A_SIGNAL_CAPTURE_ONLY':
              raise SystemExit('unexpected replay phase')
          if doc.get('outcome_data_included') is not False:
              raise SystemExit('phase A contains outcome data')
          if doc.get('observation_count_expected') != 200 or doc.get('observation_count') != 200:
              raise SystemExit(
                  f"expected exactly 200 observations, got {doc.get('observation_count')}"
              )
          errors = int(doc.get('status_counts', {}).get('ERROR', 0))
          if errors:
              print(json.dumps(doc.get('status_counts', {}), sort_keys=True))
              for record in doc.get('records', []):
                  if record.get('status') == 'ERROR':
                      print(record.get('symbol'), record.get('quarter_id'), record.get('reason'))
              raise SystemExit(f'phase A has {errors} unresolved ERROR observations')
          print('manifest_sha256', declared)
          print('status_counts', json.dumps(doc.get('status_counts', {}), sort_keys=True))
          print('signal_bucket_counts', json.dumps(doc.get('signal_bucket_counts', {}), sort_keys=True))
          PY
      - name: Upload exact historical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h002-hr001-phase-a-evidence
          path: |
            .marketlab-historical-replay
            research/historical/h002/H002-HR001/phase-a/fixed-u001-transport-signals.json
          if-no-files-found: warn
          retention-days: 30
      - name: Freeze phase-A manifest on replay branch
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/historical/h002/H002-HR001/phase-a/fixed-u001-transport-signals.json
          if git diff --cached --quiet; then
            echo "phase-A manifest unchanged"
            exit 0
          fi
          git commit -m "H002-HR001: freeze historical phase-A signals"
          git push origin HEAD:work/h002-historical-replay-v1-20260907
