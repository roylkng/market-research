name: HG006 P3 RTA001 summary rebuild
on:
  push:
    branches: [research/hg006-l001-p3-full-priority-queue-20261008]
permissions:
  contents: write
jobs:
  rebuild:
    if: contains(github.event.head_commit.message, '[hg006-p3-rta]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Rebuild deterministic RTA001
        run: |
          python scripts/build_rta001_summary.py \
            --manifest research/rta001-trials-v1.json \
            --output research/rta001-summary-v1.json \
            --repo-root .
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/rta001-summary-v1.json
          if git diff --cached --quiet; then echo "already current"; exit 0; fi
          git commit -m "RTA001: rebuild HG006 P3 source ledger [skip ci]"
          git push origin HEAD:research/hg006-l001-p3-full-priority-queue-20261008
