name: HG009 P033 official NSE rowwise industry evidence

on:
  workflow_dispatch:
  push:
    branches:
      - feat/hg009-p033-partial-official-industry-proof-20261021
      - main
    paths:
      - .github/workflows/hg009-p033-rowwise.yml
      - src/marketlab/hg009_p033_rowwise.py
      - scripts/capture_hg009_p033_rowwise.py
      - tests/test_hg009_p033_rowwise.py

permissions:
  contents: write

concurrency:
  group: hg009-p033-one-original-index-file-per-day
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test original NSE rowwise source protocol
        shell: bash
        run: |
          set -euo pipefail
          ruff check src/marketlab/hg009_p033_rowwise.py scripts/capture_hg009_p033_rowwise.py tests/test_hg009_p033_rowwise.py
          pytest -q tests/test_hg009_p033_rowwise.py tests/test_hg009_p032_totalmarket.py
          python scripts/capture_hg009_p033_rowwise.py --check

      - name: One original NSE index request, archive verified bytes or failure
        shell: bash
        run: |
          set -euo pipefail
          python scripts/capture_hg009_p033_rowwise.py
          python scripts/capture_hg009_p033_rowwise.py --check

      - name: Anchor immutable source observation or source failure
        shell: bash
        run: |
          set -euo pipefail
          TARGET="research/hg009/p033-totalmarket-rowwise"
          if [ ! -d "$TARGET" ]; then
            echo "No original source observation to anchor"
            exit 0
          fi
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add -f "$TARGET"
          if git diff --cached --quiet; then
            echo "No new original NSE receipt"
            exit 0
          fi
          git commit -m "HG009 P033: seal one official NSE industry source receipt [skip ci]"
          BRANCH="$GITHUB_REF_NAME"
          BASE_SHA="$(git rev-parse HEAD^)"
          for RETRY in 1 2 3; do
            git fetch origin "$BRANCH"
            REMOTE="$(git rev-parse "origin/$BRANCH")"
            if ! git diff --quiet "$BASE_SHA" "$REMOTE" -- \
              research/hg009/hg009-d001-100-experimental-companies-v1.json \
              research/hg009/hg009-p001-matched-300-company-controls-v1.json \
              research/hg009/p033-totalmarket-rowwise \
              src/marketlab/hg009_p033_rowwise.py \
              scripts/capture_hg009_p033_rowwise.py; then
              echo "Original 300-company evidence or rowwise method changed in flight"
              exit 1
            fi
            if [ "$REMOTE" != "$BASE_SHA" ]; then
              git rebase "origin/$BRANCH"
              python scripts/capture_hg009_p033_rowwise.py --check
              BASE_SHA="$REMOTE"
            fi
            if git push origin "HEAD:$BRANCH"; then
              echo "Original NSE industry evidence remotely anchored"
              exit 0
            fi
            sleep "$((RETRY * 2))"
          done
          echo "NSE original industry receipt not remotely anchored"
          exit 1

      - name: Retain operational audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hg009-p033-industry-source-${{ github.run_id }}
          path: research/hg009/p033-totalmarket-rowwise
          retention-days: 90
          if-no-files-found: ignore
