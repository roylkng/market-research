name: GF001 D001 current shareholding schema audit

on:
  push:
    branches:
      - research/gf001-governance-schema-20261004

permissions:
  actions: read
  contents: read

jobs:
  audit:
    if: contains(github.event.head_commit.message, '[gf001-d001]')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate frozen GF001 implementation before source access
        run: |
          ruff check \
            src/marketlab/gf001_schema_audit.py \
            scripts/run_gf001_d001.py \
            tests/test_gf001_schema_audit.py
          pytest -q \
            tests/test_gf001_schema_audit.py \
            tests/test_h023_acquisition.py \
            tests/test_h023_ownership.py

      - name: Download exact passed SS001 D002 source census
        uses: actions/download-artifact@v4
        with:
          name: ss001-d002-37198355430
          path: reports/ss001-d002-source
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37198355430

      - name: Verify exact frozen D002 input
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "reports/ss001-d002-source/ss001-d002-shareholding-sources.json"
          )
          census = json.loads(path.read_text())
          assert census["census_id"] == "SS001-D002-v1"
          assert census["census_sha256"] == (
              "214c1172491d58800dcded126303e7a2844967e75da57e0e6f666abc3b311293"
          )
          assert census["ready_latest_source_count"] == 2050
          assert census["return_outcomes_opened"] is False
          PY

      - name: Run frozen GF001 current-schema audit
        run: |
          python scripts/run_gf001_d001.py \
            --d002-census reports/ss001-d002-source/ss001-d002-shareholding-sources.json \
            --sample research/gf001/gf001-d001-current-schema-sample-v1.json \
            --raw-dir reports/gf001-d001/raw \
            --output reports/gf001-d001 \
            --attempts 4 \
            --timeout-seconds 25

      - name: Prove outcome-blind schema audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(
              Path("reports/gf001-d001/gf001-d001-schema-audit.json").read_text()
          )
          assert audit["audit_id"] == "GF001-D001-P1-v1"
          assert audit["sample_count"] == 48
          assert audit["return_outcomes_opened"] is False
          assert audit["model_fitted"] is False
          assert audit["portfolio_eligibility_allowed"] is False
          assert audit["live_capital_allowed"] is False
          print(json.dumps({
              "audit_sha256": audit["audit_sha256"],
              "ready_parse_count": audit["ready_parse_count"],
              "fetch_or_parse_failure_count": audit["fetch_or_parse_failure_count"],
              "june_2026_ready_count": audit["june_2026_ready_count"],
              "september_2026_ready_count": audit["september_2026_ready_count"],
              "june_promoter_aggregate_ready_ratio": audit["june_promoter_aggregate_ready_ratio"],
              "june_public_aggregate_ready_ratio": audit["june_public_aggregate_ready_ratio"],
              "june_encumbrance_ready_ratio": audit["june_encumbrance_ready_ratio"],
              "mutual_fund_aggregate_state_counts": audit["mutual_fund_aggregate_state_counts"],
              "aggregate_scale_resolved_ratio": audit["aggregate_scale_resolved_ratio"],
              "aggregate_scale_semantics_counts": audit["aggregate_scale_semantics_counts"],
              "threshold_passes": audit["threshold_passes"],
              "feasibility_pass": audit["feasibility_pass"],
              "keyword_concept_file_counts": audit["keyword_concept_file_counts"],
              "keyword_context_file_counts": audit["keyword_context_file_counts"],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload exact GF001 D001 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gf001-d001-${{ github.run_id }}
          path: reports/gf001-d001
          if-no-files-found: warn
          retention-days: 90
