name: HG002 D001 triple-convergence cohort

on:
  push:
    branches:
      - research/hg002-convergent-cohort-20261005

permissions:
  actions: read
  contents: read

jobs:
  cohort:
    if: contains(github.event.head_commit.message, '[hg002-d001]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate frozen HG002 implementation
        run: |
          ruff check \
            src/marketlab/hg002_cohort.py \
            scripts/materialize_hg002_cohort.py \
            tests/test_hg002_cohort.py
          pytest -q tests/test_hg002_cohort.py tests/test_hg001_router.py
      - name: Download exact HG001 router artifact
        uses: actions/download-artifact@v4
        with:
          name: hg001-d001-37258053642
          path: reports/hg001-source
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37258053642
      - name: Verify exact frozen HG001 source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/hg001-source/hg001-d001-router.json").read_text())
          assert p["router_id"]=="HG001-D001-v1"
          assert p["router_sha256"]=="79e6b068f95c890e4ef88be62ffe2e8dfb94fabbf293770804e64aaa82d6e5ff"
          assert p["identity_count"]==2319
          assert p["return_outcomes_opened"] is False
          PY
      - name: Materialize frozen HG002 cohort
        run: |
          mkdir -p reports/hg002
          python scripts/materialize_hg002_cohort.py \
            --router reports/hg001-source/hg001-d001-router.json \
            --output reports/hg002/hg002-d001-cohort.json
      - name: Prove research-only cohort
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/hg002/hg002-d001-cohort.json").read_text())
          assert p["cohort_id"]=="HG002-D001-v1"
          assert p["cohort_count"]==28
          assert p["return_outcomes_opened"] is False
          assert p["model_fitted"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          print(json.dumps({
            "cohort_sha256":p["cohort_sha256"],
            "cohort_count":p["cohort_count"],
            "l001_p1_validated_family_ready_count":p["l001_p1_validated_family_ready_count"],
            "l001_p1_unvalidated_family_counts":p["l001_p1_unvalidated_family_counts"],
            "liquidity_band_counts":p["liquidity_band_counts"],
            "symbols":[r["symbol"] for r in p["rows"]],
          },indent=2,sort_keys=True))
          PY
      - name: Upload exact cohort
        uses: actions/upload-artifact@v4
        with:
          name: hg002-d001-${{ github.run_id }}
          path: reports/hg002
          if-no-files-found: error
          retention-days: 90
