name: HG009 P027 negative H1 and next independent cohort gate

on:
  push:
    branches:
      - research/hg009-p027-no-alpha-next-cohort-gate-20261021
    paths:
      - .github/workflows/hg009-p027-source-gate.yml
      - src/marketlab/hg009_p027_gate.py
      - scripts/materialize_hg009_p027.py
      - tests/test_hg009_p027_gate.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hg009-p027-fixed-negative-result
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original MarketLab research contracts
        run: python -m pip install -e '.[dev]'
      - name: Replay original negative H1 and source coverage, without future labels
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_hg009_p027.py
          python scripts/materialize_hg009_p027.py --check
          ruff check \
            src/marketlab/hg009_p027_gate.py \
            scripts/materialize_hg009_p027.py \
            tests/test_hg009_p027_gate.py
          pytest -q tests/test_hg009_p027_gate.py
      - name: Publish immutable source-bound scientific assessment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/hg009/hg009-p027-h1-no-alpha-next-cohort-gate-v1.json
          if git diff --cached --quiet; then
            echo "P027 original source-bound result already sealed"
            exit 0
          fi
          git commit -m "HG009 P027: freeze negative H1 and new-cohort gating [skip ci]"
          git fetch origin research/hg009-p027-no-alpha-next-cohort-gate-20261021
          git rebase origin/research/hg009-p027-no-alpha-next-cohort-gate-20261021
          python scripts/materialize_hg009_p027.py --check
          git push origin HEAD:research/hg009-p027-no-alpha-next-cohort-gate-20261021
