name: SC002 post-cutoff availability diagnostic 2026-09-30

on:
  push:
    branches:
      - diag/sc002-postcutoff-availability-20260930

permissions:
  contents: read

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[sc002-postcutoff-diag]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Probe exact 30 Sep FO UDiFF without mutating SC002
        run: |
          python - <<'PY'
          import json
          from datetime import UTC, date, datetime

          from marketlab.alpha_acquisition import http_fetcher
          from marketlab.alpha_futures import (
              fo_udiff_url,
              parse_fo_udiff_stock_futures,
          )
          from marketlab.events import sha256_bytes

          day = date(2026, 9, 30)
          url = fo_udiff_url(day)
          raw = http_fetcher(attempts=4, timeout=30.0)(url)
          captured = datetime.now(UTC)
          result = {
              "captured_at_utc": captured.isoformat(),
              "captured_at_ist": captured.astimezone().isoformat(),
              "source_url": url,
              "available": raw is not None,
          }
          if raw is not None:
              result["raw_sha256"] = sha256_bytes(raw)
              rows, diagnostics = parse_fo_udiff_stock_futures(
                  raw,
                  session_date=day,
              )
              result["accepted_stf_rows"] = len(rows)
              result["diagnostics"] = diagnostics
          print(json.dumps(result, sort_keys=True))
          PY
