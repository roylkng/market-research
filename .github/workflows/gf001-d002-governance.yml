name: GF001 D002 full-market governance parser

on:
  push:
    branches:
      - research/gf001-full-governance-parser-20261004

permissions:
  actions: read
  contents: read

jobs:
  parse:
    if: contains(github.event.head_commit.message, '[gf001-d002]')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate frozen parser before source access
        run: |
          ruff check \
            src/marketlab/gf001_governance.py \
            scripts/run_gf001_d002.py \
            tests/test_gf001_governance.py
          pytest -q \
            tests/test_gf001_governance.py \
            tests/test_gf001_schema_audit.py \
            tests/test_h023_acquisition.py

      - name: Download exact passed SS001 D002 source census
        uses: actions/download-artifact@v4
        with:
          name: ss001-d002-37198355430
          path: reports/ss001-d002-source
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37198355430

      - name: Verify frozen source census
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          census = json.loads(
              Path(
                  "reports/ss001-d002-source/"
                  "ss001-d002-shareholding-sources.json"
              ).read_text()
          )
          assert census["census_id"] == "SS001-D002-v1"
          assert census["census_sha256"] == (
              "214c1172491d58800dcded126303e7a2844967e75da57e0e6f666abc3b311293"
          )
          assert census["ready_latest_source_count"] == 2050
          assert census["adjacent_quarter_source_count"] == 2032
          assert census["return_outcomes_opened"] is False
          PY

      - name: Parse full-market current governance evidence
        run: |
          python scripts/run_gf001_d002.py \
            --d002-census reports/ss001-d002-source/ss001-d002-shareholding-sources.json \
            --raw-dir reports/gf001-d002/raw \
            --output reports/gf001-d002 \
            --attempts 4 \
            --timeout-seconds 25 \
            --pause-seconds 0.01

      - name: Prove outcome-blind governance panel
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          panel = json.loads(
              Path("reports/gf001-d002/gf001-d002-panel.json").read_text()
          )
          assert panel["panel_id"] == "GF001-D002-v1"
          assert panel["identity_count"] == 2319
          assert panel["ready_latest_source_count"] == 2050
          assert panel["return_outcomes_opened"] is False
          assert panel["model_fitted"] is False
          assert panel["portfolio_eligibility_allowed"] is False
          assert panel["live_capital_allowed"] is False
          print(json.dumps({
              "panel_sha256": panel["panel_sha256"],
              "latest_core_ready_count": panel["latest_core_ready_count"],
              "latest_core_ready_ratio": panel["latest_core_ready_ratio"],
              "adjacent_core_ready_count": panel["adjacent_core_ready_count"],
              "adjacent_core_ready_ratio": panel["adjacent_core_ready_ratio"],
              "mutual_fund_state_counts": panel["mutual_fund_state_counts"],
              "promoter_encumbrance_true_counts": panel["promoter_encumbrance_true_counts"],
              "latest_failure_reason_counts": panel["latest_failure_reason_counts"],
              "prior_failure_reason_counts": panel["prior_failure_reason_counts"],
              "threshold_passes": panel["threshold_passes"],
              "feasibility_pass": panel["feasibility_pass"],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload exact GF001 D002 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gf001-d002-${{ github.run_id }}
          path: reports/gf001-d002
          if-no-files-found: warn
          retention-days: 90
