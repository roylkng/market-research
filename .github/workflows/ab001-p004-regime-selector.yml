name: AB001 P004 regime-conditioned alpha selector

on:
  push:
    branches:
      - feat/ab001-p004-regime-selector-20261003

permissions:
  contents: read
  actions: read

jobs:
  pilot:
    if: contains(github.event.head_commit.message, '[ab001-p004]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify P004 implementation before source access
        run: |
          ruff check \
            src/marketlab/ab001_p004.py \
            scripts/run_ab001_p004.py \
            tests/test_ab001_p004.py
          pytest -q \
            tests/test_ab001_p004.py \
            tests/test_ab001.py \
            tests/test_alpha_regime.py

      - name: Download exact sealed AB001 P003 evidence
        uses: actions/download-artifact@v4
        with:
          name: ab001-p003-36703199954
          path: evidence/p003
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: roylkng/market-research
          run-id: 36703199954

      - name: Rebuild exact P003 official NSE market panel
        run: |
          python scripts/build_ae001_historical_panel.py \
            --start-date 2025-09-01 \
            --end-date 2026-09-25 \
            --store .marketlab/ab001-p004 \
            --output reports/ab001-p004/market \
            --attempts 4 \
            --timeout-seconds 30 \
            --pause-seconds 0.05

      - name: Build source-aligned RG001 context
        run: |
          python scripts/build_ae001_regime_panel.py \
            --market-panel reports/ab001-p004/market/market-panel.json.gz \
            --output reports/ab001-p004/regime

      - name: Resolve sealed P003 report
        id: p003
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$(find evidence/p003 -type f -name 'ab001-p003-report.json.gz' -print -quit)"
          test -n "$REPORT"
          echo "report=$REPORT" >> "$GITHUB_OUTPUT"

      - name: Run frozen P004 selector diagnostic
        run: |
          python scripts/run_ab001_p004.py \
            --p003-report "${{ steps.p003.outputs.report }}" \
            --regime-panel reports/ab001-p004/regime/regime-panel.json.gz \
            --output reports/ab001-p004/study

      - name: Print compact result
        run: cat reports/ab001-p004/study/summary.json

      - name: Upload exact P004 development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab001-p004-${{ github.run_id }}
          path: |
            reports/ab001-p004
            .marketlab/ab001-p004/market-data
          if-no-files-found: warn
          retention-days: 90
