name: H004 HR002 July 2026 shard

on:
  push:
    branches:
      - research/h004-earnings-july-shard-v1-20260908
    paths:
      - .github/workflows/h004-hr002-july-shard.yml

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h004-earnings-july-shard-v1-20260908
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run July shard
        run: |
          python scripts/run_h004_earnings_replay_v3.py \
            --event-start 2026-07-01 \
            --event-end 2026-07-31 \
            --price-start 2026-03-01 \
            --price-end 2026-08-31 \
            --out-dir research/historical/h004/H004-HR002-july-shard
      - name: Commit shard evidence
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/historical/h004/H004-HR002-july-shard
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "H004-HR002: retain July 2026 shard"
          git push origin HEAD:research/h004-earnings-july-shard-v1-20260908
