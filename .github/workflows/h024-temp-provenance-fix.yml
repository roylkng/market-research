name: H024 temporary evidence-freeze patcher

on:
  push:
    branches:
      - research/h024-insider-prospective-v1-20260915
    paths:
      - '.github/workflows/h024-temp-provenance-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h024-insider-prospective-v1-20260915
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce pre-entry evidence freeze
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/marketlab/h024_prospective.py')
          text = path.read_text(encoding='utf-8')

          old = '''def evidence_by_source(ledger: dict[str, Any], source_id: str) -> dict[str, Any] | None:\n    validate_evidence_ledger(ledger)\n    matches = [row["evidence"] for row in ledger["records"] if row["evidence"]["source_id"] == source_id]\n    if not matches:\n        return None\n    if len(matches) != 1:\n        raise H024ProspectiveError("H024 source has duplicate evidence")\n    return dict(matches[0])\n'''
          new = '''def evidence_record_by_source(ledger: dict[str, Any], source_id: str) -> dict[str, Any] | None:\n    validate_evidence_ledger(ledger)\n    matches = [row for row in ledger["records"] if row["evidence"]["source_id"] == source_id]\n    if not matches:\n        return None\n    if len(matches) != 1:\n        raise H024ProspectiveError("H024 source has duplicate evidence")\n    return dict(matches[0])\n\n\ndef evidence_by_source(ledger: dict[str, Any], source_id: str) -> dict[str, Any] | None:\n    record = evidence_record_by_source(ledger, source_id)\n    return None if record is None else dict(record["evidence"])\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected H024 evidence lookup shape')
          text = text.replace(old, new)

          old = '''    source = source_by_id(source_ledger, source_id)\n    evidence = evidence_by_source(evidence_ledger, source_id)\n    if evidence is None or evidence["status"] != "READY":\n        return None\n'''
          new = '''    source = source_by_id(source_ledger, source_id)\n    evidence_record = evidence_record_by_source(evidence_ledger, source_id)\n    if evidence_record is None or evidence_record["evidence"]["status"] != "READY":\n        return None\n    evidence = evidence_record["evidence"]\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected H024 signal evidence lookup shape')
          text = text.replace(old, new)

          old = '''    first_seen = _timestamp(source_first_seen(source_ledger, source_id), field="source_first_seen_at_utc")\n    frozen = _timestamp(frozen_at_utc, field="signal_frozen_at_utc")\n    if frozen < first_seen:\n        raise H024ProspectiveError("H024 signal freeze precedes source first-seen")\n    entry = planned_entry_session(calendar, str(source["exchange_disseminated_at_utc"]))\n    entry_open = _timestamp(entry["open_timestamp_utc"], field="entry.open_timestamp_utc")\n    status = "QUALIFYING" if first_seen <= entry_open and frozen <= entry_open else "LATE_SIGNAL_FREEZE"\n'''
          new = '''    first_seen = _timestamp(\n        source_first_seen(source_ledger, source_id), field="source_first_seen_at_utc"\n    )\n    evidence_frozen = _timestamp(\n        evidence_record["evidence_frozen_at_utc"], field="evidence_frozen_at_utc"\n    )\n    frozen = _timestamp(frozen_at_utc, field="signal_frozen_at_utc")\n    if evidence_frozen < first_seen:\n        raise H024ProspectiveError("H024 evidence freeze precedes source first-seen")\n    if frozen < evidence_frozen:\n        raise H024ProspectiveError("H024 signal freeze precedes raw-XBRL evidence freeze")\n    entry = planned_entry_session(calendar, str(source["exchange_disseminated_at_utc"]))\n    entry_open = _timestamp(entry["open_timestamp_utc"], field="entry.open_timestamp_utc")\n    status = (\n        "QUALIFYING"\n        if first_seen <= entry_open and evidence_frozen <= entry_open and frozen <= entry_open\n        else "LATE_SIGNAL_FREEZE"\n    )\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected H024 signal timestamp shape')
          text = text.replace(old, new)

          old = '''        "source_first_seen_at_utc": _utc_text(first_seen),\n        "signal_frozen_at_utc": _utc_text(frozen),\n'''
          new = '''        "source_first_seen_at_utc": _utc_text(first_seen),\n        "evidence_frozen_at_utc": _utc_text(evidence_frozen),\n        "signal_frozen_at_utc": _utc_text(frozen),\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected H024 signal record timestamp fields')
          text = text.replace(old, new)

          old = '''        "source_first_seen_at_utc",\n        "signal_frozen_at_utc",\n'''
          new = '''        "source_first_seen_at_utc",\n        "evidence_frozen_at_utc",\n        "signal_frozen_at_utc",\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected H024 required timestamp fields')
          text = text.replace(old, new)

          old = '''    first_seen = _timestamp(record["source_first_seen_at_utc"], field="signal.first_seen")\n    frozen = _timestamp(record["signal_frozen_at_utc"], field="signal.frozen")\n    entry = _timestamp(record["planned_entry_open_utc"], field="signal.entry_open")\n    if first_seen < disseminated or frozen < first_seen:\n        raise H024ProspectiveError("H024 signal timestamps are inconsistent")\n    expected_status = "QUALIFYING" if first_seen <= entry and frozen <= entry else "LATE_SIGNAL_FREEZE"\n'''
          new = '''    first_seen = _timestamp(record["source_first_seen_at_utc"], field="signal.first_seen")\n    evidence_frozen = _timestamp(\n        record["evidence_frozen_at_utc"], field="signal.evidence_frozen"\n    )\n    frozen = _timestamp(record["signal_frozen_at_utc"], field="signal.frozen")\n    entry = _timestamp(record["planned_entry_open_utc"], field="signal.entry_open")\n    if (\n        first_seen < disseminated\n        or evidence_frozen < first_seen\n        or frozen < evidence_frozen\n    ):\n        raise H024ProspectiveError("H024 signal timestamps are inconsistent")\n    expected_status = (\n        "QUALIFYING"\n        if first_seen <= entry and evidence_frozen <= entry and frozen <= entry\n        else "LATE_SIGNAL_FREEZE"\n    )\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected H024 signal validation timestamp shape')
          text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_h024_prospective.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '''def test_late_signal_freeze_is_retained_but_not_primary_qualifying() -> None:\n'''
          added = '''def test_evidence_frozen_after_entry_is_late_even_when_source_was_seen_before_entry() -> None:\n    source = _source()\n    sources = append_sources(\n        new_source_ledger(), [source], first_seen_at_utc="2026-09-15T19:00:10Z"\n    )\n    evidence = append_evidence(\n        new_evidence_ledger(),\n        sources,\n        _ready(source),\n        frozen_at_utc="2026-09-17T04:00:00Z",\n    )\n    record = build_signal_record(\n        source_ledger=sources,\n        evidence_ledger=evidence,\n        calendar=_calendar(),\n        source_id=source["source_id"],\n        frozen_at_utc="2026-09-17T04:01:00Z",\n    )\n    assert record is not None\n    assert record["status"] == "LATE_SIGNAL_FREEZE"\n    assert record["evidence_frozen_at_utc"] == "2026-09-17T04:00:00Z"\n\n\n'''
          if tests.count(marker) != 1:
              raise SystemExit('unexpected H024 late-signal test marker')
          if added not in tests:
              tests = tests.replace(marker, added + marker)
          test_path.write_text(tests, encoding='utf-8')
          PY
          python -m pip install -e '.[dev]'
          ruff check src/marketlab/h024_prospective.py tests/test_h024_prospective.py
          pytest -q tests/test_h024_prospective.py
      - name: Commit evidence-freeze invariant
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add src/marketlab/h024_prospective.py tests/test_h024_prospective.py
          git commit -m "H024: bind signals to pre-entry raw-XBRL evidence"
          git push origin HEAD:research/h024-insider-prospective-v1-20260915
