name: H024 temporary frozen historical challenge

on:
  push:
    branches:
      - research/h024-historical-challenge-v1-20260915
    paths:
      - '.github/workflows/h024-temp-historical-challenge.yml'
      - 'research/H024_HISTORICAL_CHALLENGE_IMPLEMENTATION_V1.md'
      - 'src/marketlab/h024_historical.py'
      - 'scripts/run_h024_historical_challenge.py'
      - 'tests/test_h024_historical.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h024-frozen-historical-challenge-v1
  cancel-in-progress: false

jobs:
  challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h024-historical-challenge-v1-20260915
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Pre-outcome frozen implementation gate
        shell: bash
        run: |
          set -euo pipefail
          ruff check \
            src/marketlab/h024_historical.py \
            scripts/run_h024_historical_challenge.py \
            tests/test_h024_historical.py \
            src/marketlab/h024_insider.py \
            src/marketlab/h024_acquisition.py \
            src/marketlab/h024_prospective.py \
            tests/test_h024_insider.py \
            tests/test_h024_acquisition.py \
            tests/test_h024_prospective.py \
            tests/test_h024_scan_retry.py
          pytest -q \
            tests/test_h024_historical.py \
            tests/test_h024_insider.py \
            tests/test_h024_acquisition.py \
            tests/test_h024_prospective.py \
            tests/test_h024_scan_retry.py
          python - <<'PY'
          import hashlib
          from pathlib import Path

          path = Path('research/historical/h024/prefreeze-original-purchase-source-panel-v1.json')
          expected = '94bb81839c7d868736f830e88a3feb83538a04dfc7be01d546a7839e2bf3d101'
          observed = hashlib.sha256(path.read_bytes()).hexdigest()
          if observed != expected:
              raise SystemExit(f'H024 frozen source-panel digest mismatch: {observed}')
          print(f'H024 frozen source-panel SHA256: {observed}')
          PY

      - name: Run frozen H024 historical challenge
        shell: bash
        run: |
          set -euo pipefail
          OUT='research/historical/h024/challenge-2026-09-15'
          rm -rf "$OUT" .marketlab/h024-historical
          mkdir -p "$OUT"
          python scripts/run_h024_historical_challenge.py \
            --source-panel research/historical/h024/prefreeze-original-purchase-source-panel-v1.json \
            --store .marketlab/h024-historical \
            --event-panel-out "$OUT/event-panel.json" \
            --report-out "$OUT/outcome-report.json" \
            --summary-out "$OUT/outcome-summary.json" \
            --evidence-manifest-out "$OUT/evidence-manifest.json"

      - name: Verify sealed challenge artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('research/historical/h024/challenge-2026-09-15')
          event_panel = json.loads((root / 'event-panel.json').read_text())
          report = json.loads((root / 'outcome-report.json').read_text())
          summary = json.loads((root / 'outcome-summary.json').read_text())
          manifest = json.loads((root / 'evidence-manifest.json').read_text())
          if event_panel['outcome_data_attached']:
              raise SystemExit('event panel must remain source/eligibility-only')
          if report['event_panel_sha256'] != event_panel['event_panel_sha256']:
              raise SystemExit('outcome report does not bind frozen event panel')
          if summary['outcome_report_sha256'] != report['report_sha256']:
              raise SystemExit('summary does not bind outcome report')
          if manifest['event_panel_sha256'] != event_panel['event_panel_sha256']:
              raise SystemExit('manifest does not bind event panel')
          if manifest['outcome_report_sha256'] != report['report_sha256']:
              raise SystemExit('manifest does not bind outcome report')
          if manifest['outcome_summary_sha256'] != summary['summary_sha256']:
              raise SystemExit('manifest does not bind outcome summary')
          if summary['live_capital_allowed']:
              raise SystemExit('H024 historical challenge cannot authorize live capital')
          print(json.dumps({
              'event_count': event_panel['event_count'],
              'event_symbol_count': event_panel['event_symbol_count'],
              'primary_classification': summary['primary_classification'],
              'primary_60': summary['horizons']['60'],
          }, indent=2, sort_keys=True))
          PY

      - name: Commit compact historical evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'marketlab-research-bot'
          git config user.email 'marketlab-research-bot@users.noreply.github.com'
          git add research/historical/h024/challenge-2026-09-15
          if git diff --cached --quiet; then
            echo 'No H024 historical evidence change'
          else
            git commit -m 'H024: seal frozen historical return challenge'
            git push origin HEAD:research/h024-historical-challenge-v1-20260915
          fi

      - name: Upload exact raw source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h024-frozen-historical-${{ github.run_id }}-${{ github.run_attempt }}
          path: .marketlab/h024-historical
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
