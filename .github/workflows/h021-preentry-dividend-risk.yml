name: H021 Oct12 pre-entry public dividend measurement warning

on:
  pull_request:
    paths:
      - src/marketlab/h021_p011_dividend_alert.py
      - scripts/build_h021_p011_dividend_alert.py
      - tests/test_h021_p011_dividend_alert.py
      - .github/workflows/h021-preentry-dividend-risk.yml
  push:
    branches:
      - main
    paths:
      - src/marketlab/h021_p011_dividend_alert.py
      - scripts/build_h021_p011_dividend_alert.py
      - .github/workflows/h021-preentry-dividend-risk.yml

permissions:
  contents: write

concurrency:
  group: h021-first-cohort-known-preentry-corporate-action
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify source ancestry, original selection and no-return semantics
        run: |
          ruff check src/marketlab/h021_p011_dividend_alert.py scripts/build_h021_p011_dividend_alert.py tests/test_h021_p011_dividend_alert.py
          pytest -q tests/test_h021_p011_dividend_alert.py
      - name: Generate independently replayable action-risk source packet
        run: |
          python scripts/build_h021_p011_dividend_alert.py \
            --output /tmp/h021-p011-first-entry-dividend-risk-v1.json
      - name: Seal P011 only if actual Git publication precedes original next open
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          DEADLINE="2026-10-12T03:45:00Z"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "$NOW" > "$DEADLINE" || "$NOW" == "$DEADLINE" ]]; then
            echo "Missed actual frozen next-open; do not backdate warning as pre-entry"
            exit 0
          fi
          TARGET="research/prospective/h021/pre-entry-risk/2026-10-09-vedl-dividend-alert-v1.json"
          if [[ -f "$TARGET" ]]; then
            python scripts/build_h021_p011_dividend_alert.py \
              --output "$TARGET" --verify-existing
            exit 0
          fi
          mkdir -p "$(dirname "$TARGET")"
          cp /tmp/h021-p011-first-entry-dividend-risk-v1.json "$TARGET"
          git config user.name marketlab-research-bot
          git config user.email marketlab-research-bot@users.noreply.github.com
          git add "$TARGET"
          git commit -m "H021: anchor known VEDL ex-dividend measurement hazard pre-entry [skip ci]"
          BASE_SHA="$(git rev-parse HEAD^)"
          for RETRY in 1 2 3; do
            NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if [[ "$NOW" > "$DEADLINE" || "$NOW" == "$DEADLINE" ]]; then
              echo "Git push is too late for a prospective P011 marker"
              exit 1
            fi
            git fetch origin main
            NEXT="$(git rev-parse origin/main)"
            if git cat-file -e "origin/main:$TARGET" 2>/dev/null; then
              echo "Pre-entry warning already immutable; refuse overwrite"
              exit 1
            fi
            if ! git diff --quiet "$BASE_SHA" "$NEXT" -- \
              research/prospective/h021/intents/2026-10-09-primary-entry-intent-v1.json \
              research/prospective/h021/comparisons/2026-10-09-primary-revision-v1.json \
              research/prospective/universes/FY27-Q2-2026-09-06.json \
              src/marketlab/h021_p011_dividend_alert.py \
              src/marketlab/h021_entry_observation.py; then
              echo "Frozen H021 research rules changed during evidence anchor"
              exit 1
            fi
            if [[ "$NEXT" != "$BASE_SHA" ]]; then
              git rebase origin/main
              BASE_SHA="$NEXT"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((RETRY*2))"
          done
          exit 1
      - name: Preserve independent pre-entry review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h021-vedl-known-preentry-dividend-risk-v1
          path: /tmp/h021-p011-first-entry-dividend-risk-v1.json
          if-no-files-found: ignore
          retention-days: 90
