name: H023 ownership full U001 source probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/h023-ownership-source-probe-v1-20260914
    paths:
      - '.github/workflows/h023-ownership-full-u001-probe.yml'
      - 'scripts/assess_h023_ownership_source_gate.py'
      - 'scripts/probe_h023_full_u001_ownership.py'
      - 'scripts/probe_h023_nse_shareholding.py'
      - 'scripts/probe_h023_nse_shareholding_xbrl.py'
      - 'src/marketlab/h023_ownership.py'
      - 'tests/test_h023_ownership.py'

permissions:
  contents: write

concurrency:
  group: h023-ownership-full-u001-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint source-only parser, probe, and gate
        run: |
          ruff check \
            src/marketlab/h023_ownership.py \
            tests/test_h023_ownership.py \
            scripts/assess_h023_ownership_source_gate.py \
            scripts/probe_h023_nse_shareholding.py \
            scripts/probe_h023_nse_shareholding_xbrl.py \
            scripts/probe_h023_full_u001_ownership.py
      - name: Test frozen parser contract
        run: pytest -q tests/test_h023_ownership.py
      - name: Probe full frozen U001
        shell: bash
        run: |
          set -euo pipefail
          WORK="reports/h023-ownership-full-u001/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$WORK"
          python scripts/probe_h023_full_u001_ownership.py \
            --universe research/prospective/universes/FY27-Q2-2026-09-06.json \
            --out "$WORK/report.json" \
            --filings-per-symbol 2 \
            --attempts 4 \
            --pause-seconds 0.08
          echo "work_dir=$WORK" >> "$GITHUB_ENV"
      - name: Assess frozen source-only evidence
        id: gate
        shell: bash
        run: |
          set +e
          python scripts/assess_h023_ownership_source_gate.py \
            --report "$work_dir/report.json" \
            --out "$work_dir/decision.json"
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Retain atomic source audit and decision
        shell: bash
        run: |
          set -euo pipefail
          test -f "$work_dir/report.json"
          test -f "$work_dir/decision.json"
          mkdir -p research/probes/h023
          cp "$work_dir/report.json" \
            research/probes/h023/nse-shareholding-full-u001-v1.json
          cp "$work_dir/decision.json" \
            research/probes/h023/ownership-source-decision-v1.json
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add \
            research/probes/h023/nse-shareholding-full-u001-v1.json \
            research/probes/h023/ownership-source-decision-v1.json
          if ! git diff --cached --quiet; then
            git commit -m "H023: anchor hardened ownership source decision"
            git push origin HEAD:research/h023-ownership-source-probe-v1-20260914
          fi
      - name: Upload full source-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h023-ownership-full-u001-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/h023-ownership-full-u001
          if-no-files-found: error
          retention-days: 90
      - name: Enforce source gate
        shell: bash
        run: exit "${{ steps.gate.outputs.exit_code }}"
