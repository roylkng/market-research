name: AE001 D010 P3A short parser diagnostic

on:
  push:
    branches:
      - feat/ae001-d010-cash-borrow-flow-source-20261001

permissions:
  contents: read

jobs:
  diagnostic:
    if: contains(github.event.head_commit.message, '[ae001-d010-p3a]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify frozen P3A
        run: |
          ruff check \
            src/marketlab/alpha_d010_p3a.py \
            scripts/run_ae001_d010_p3a.py \
            tests/test_alpha_d010_p3a.py
          pytest -q tests/test_alpha_d010_p3a.py
      - name: Inspect exact frozen short-selling source rows
        run: |
          python scripts/run_ae001_d010_p3a.py \
            --output reports/ae001-d010-p3a \
            --attempts 4 \
            --timeout-seconds 30
      - name: Print result
        run: cat reports/ae001-d010-p3a/report.json
      - name: Upload exact P3A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae001-d010-p3a-${{ github.run_id }}
          path: reports/ae001-d010-p3a
          if-no-files-found: warn
          retention-days: 90
