name: H024 prospective insider stream

on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * *'
    - cron: '45 12 * * *'
    - cron: '30 17 * * *'
  push:
    branches:
      - research/h024-insider-prospective-v1-20260915
    paths:
      - '.github/workflows/h024-prospective-stream.yml'

permissions:
  contents: write

concurrency:
  group: h024-prospective-insider-stream
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify implementation before source access
        shell: bash
        run: |
          set -euo pipefail
          ruff check \
            src/marketlab/h024_insider.py \
            src/marketlab/h024_acquisition.py \
            src/marketlab/h024_prospective.py \
            scripts/run_h024_prospective_scan.py \
            scripts/verify_h024_prospective_state.py \
            tests/test_h024_insider.py \
            tests/test_h024_acquisition.py \
            tests/test_h024_prospective.py
          pytest -q \
            tests/test_h024_insider.py \
            tests/test_h024_acquisition.py \
            tests/test_h024_prospective.py
          python scripts/verify_h024_prospective_state.py \
            --calendar research/prospective/calendars/FY27-Q2-2026-09-06/NSE-CM-FY27Q2-v1.json \
            --state-dir research/prospective/h024

      - name: Resolve prospective boundary
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          STATE=$(python - <<'PY'
          from datetime import UTC, datetime
          import os

          boundary = datetime(2026, 9, 15, 18, 30, tzinfo=UTC)
          now = datetime.now(UTC)
          if now < boundary:
              print('BEFORE_BOUNDARY')
          elif os.environ.get('GITHUB_REF') != 'refs/heads/main':
              print('NON_MAIN_REHEARSAL')
          else:
              print('READY')
          PY
          )
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "H024 workflow state: $STATE"

      - name: Prepare isolated state
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          START_SHA=$(git rev-parse HEAD)
          echo "start_sha=$START_SHA" >> "$GITHUB_ENV"
          WORK="reports/h024-prospective/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$WORK/state" "$WORK/raw"
          cp research/prospective/h024/*.json "$WORK/state/"
          echo "work_dir=$WORK" >> "$GITHUB_ENV"

      - name: Acquire official NSE PIT state
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_h024_prospective_scan.py \
            --calendar research/prospective/calendars/FY27-Q2-2026-09-06/NSE-CM-FY27Q2-v1.json \
            --state-dir "$work_dir/state" \
            --raw-dir "$work_dir/raw" \
            --report "$work_dir/report.json" \
            --lookback-days 7 \
            --discovery-attempts 4 \
            --xbrl-attempts 5

      - name: Verify proposed canonical state offline
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_h024_prospective_state.py \
            --calendar research/prospective/calendars/FY27-Q2-2026-09-06/NSE-CM-FY27Q2-v1.json \
            --state-dir "$work_dir/state"

      - name: Fail closed if main changed during observation
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$start_sha"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$start_sha" || {
            echo "ERROR: main changed while H024 source observation was in flight"
            exit 1
          }

      - name: Seal canonical H024 source state
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          cp "$work_dir/state/source-ledger.json" research/prospective/h024/source-ledger.json
          cp "$work_dir/state/evidence-ledger.json" research/prospective/h024/evidence-ledger.json
          cp "$work_dir/state/signal-ledger.json" research/prospective/h024/signal-ledger.json
          cp "$work_dir/state/scan-ledger.json" research/prospective/h024/scan-ledger.json
          python scripts/verify_h024_prospective_state.py \
            --calendar research/prospective/calendars/FY27-Q2-2026-09-06/NSE-CM-FY27Q2-v1.json \
            --state-dir research/prospective/h024
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/prospective/h024/*.json
          if git diff --cached --quiet; then
            echo "No H024 canonical state change"
          else
            git commit -m "H024: seal prospective insider source scan [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload raw source-only evidence
        if: steps.gate.outputs.state == 'READY' && always()
        uses: actions/upload-artifact@v4
        with:
          name: h024-prospective-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/h024-prospective
          if-no-files-found: error
          retention-days: 90
