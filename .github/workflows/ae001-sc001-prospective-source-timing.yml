name: AE001 SC001 prospective source timing

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Uncommon UTC minutes reduce scheduler contention.
    # UTC -> Asia/Kolkata: 16:37, 17:07, 17:37, 17:57, 18:17, 18:27.
    - cron: '7 11 * * 1-5'
    - cron: '37 11 * * 1-5'
    - cron: '7 12 * * 1-5'
    - cron: '27 12 * * 1-5'
    - cron: '47 12 * * 1-5'
    - cron: '57 12 * * 1-5'

permissions:
  contents: write

concurrency:
  group: ae001-sc001-prospective-source-timing
  cancel-in-progress: false

jobs:
  probe:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh latest canonical main before observation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach origin/main
          echo "OBSERVATION_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify SC001 and T004 implementation before source access
        run: |
          ruff check \
            src/marketlab/alpha_prospective_sources.py \
            src/marketlab/alpha_t004_prospective.py \
            src/marketlab/alpha_t004_readiness.py \
            scripts/probe_ae001_sc001.py \
            scripts/verify_ae001_sc001.py \
            scripts/score_ae001_t004_decision.py \
            scripts/verify_ae001_t004_decisions.py \
            scripts/verify_ae001_t004_readiness.py \
            tests/test_alpha_prospective_sources.py \
            tests/test_alpha_t004_prospective.py \
            tests/test_alpha_t004_readiness.py
          pytest -q \
            tests/test_alpha_prospective_sources.py \
            tests/test_alpha_t004_prospective.py \
            tests/test_alpha_t004_readiness.py \
            tests/test_alpha_t004.py
          python scripts/verify_ae001_sc001.py \
            --ledger research/prospective/ae001-sc001/source-ledger.json
          python scripts/verify_ae001_t004_decisions.py \
            --ledger research/prospective/ae001-t004/decision-ledger.json
          python scripts/verify_ae001_t004_readiness.py \
            --readiness research/prospective/ae001-t004/readiness.json

      - name: Resolve frozen start boundary
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=Asia/Kolkata date +%F)"
          NOW_HM="$(TZ=Asia/Kolkata date +%H%M)"
          EVENT_NAME="${{ github.event_name }}"
          if [[ "$TODAY" < "2026-09-30" ]]; then
            STATE="BEFORE_START"
          elif [[ "$EVENT_NAME" == "push" && ( "$NOW_HM" < "1630" || "$NOW_HM" > "1829" ) ]]; then
            STATE="OUTSIDE_PUSH_WINDOW"
          else
            STATE="READY"
          fi
          echo "date=$TODAY" >> "$GITHUB_OUTPUT"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "SC001 gate: date=$TODAY time=$NOW_HM event=$EVENT_NAME state=$STATE"

      - name: Probe same-session official NSE sources
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/probe_ae001_sc001.py \
            --session-date "${{ steps.gate.outputs.date }}" \
            --ledger research/prospective/ae001-sc001/source-ledger.json \
            --attempts 4 \
            --timeout-seconds 30 | tee sc001-probe.json
          python scripts/verify_ae001_sc001.py \
            --ledger research/prospective/ae001-sc001/source-ledger.json

      - name: Anchor SC001 source evidence immediately
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          LEDGER="research/prospective/ae001-sc001/source-ledger.json"
          BRANCH="main"
          START_SHA="$OBSERVATION_BASE_SHA"

          python scripts/verify_ae001_sc001.py --ledger "$LEDGER"
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/prospective/ae001-sc001

          if ! git diff --cached --quiet; then
            git commit -m "AE001 SC001: seal prospective source probe ${{ steps.gate.outputs.date }} [skip ci]"

            CRITICAL_PATHS=(
              ".github/workflows/ae001-sc001-prospective-source-timing.yml"
              "research/AE001_SC001_PROSPECTIVE_SOURCE_TIMING_PROTOCOL_V1.md"
              "research/prospective/ae001-sc001"
              "src/marketlab/alpha_prospective_sources.py"
              "scripts/probe_ae001_sc001.py"
              "scripts/verify_ae001_sc001.py"
            )

            for ATTEMPT in 1 2 3; do
              git fetch origin "$BRANCH"
              CURRENT_MAIN="$(git rev-parse "origin/$BRANCH")"
              if [ "$START_SHA" != "$CURRENT_MAIN" ]; then
                if ! git diff --quiet "$START_SHA" "$CURRENT_MAIN" -- "${CRITICAL_PATHS[@]}"; then
                  echo "SC001 rules or canonical source state changed while observation was in flight"
                  git diff --stat "$START_SHA" "$CURRENT_MAIN" -- "${CRITICAL_PATHS[@]}"
                  exit 1
                fi
                git rebase "origin/$BRANCH"
                python scripts/verify_ae001_sc001.py --ledger "$LEDGER"
              fi
              if git push origin HEAD:"$BRANCH"; then
                break
              fi
              if [ "$ATTEMPT" -eq 3 ]; then
                echo "Unable to anchor SC001 source evidence after bounded retries"
                exit 1
              fi
              sleep $((ATTEMPT * 2))
            done
          else
            echo "No new SC001 source evidence to anchor"
          fi

          # Ensure downstream T004 scoring starts from the current canonical main.
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [ "$(git rev-parse HEAD)" != "$CURRENT_MAIN" ]; then
            git rebase origin/main
          fi
          python scripts/verify_ae001_sc001.py --ledger "$LEDGER"
          echo "POST_SC001_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Seal fixed-model T004 decision when source timing qualifies
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          T004_WORK="reports/ae001-t004-prospective/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$T004_WORK"
          python scripts/score_ae001_t004_decision.py \
            --session-date "${{ steps.gate.outputs.date }}" \
            --sc001-ledger research/prospective/ae001-sc001/source-ledger.json \
            --decision-ledger research/prospective/ae001-t004/decision-ledger.json \
            --models research/prospective/ae001-t004/frozen-models-v1.json \
            --decision-dir research/prospective/ae001-t004/decisions \
            --support-dir "$T004_WORK" \
            --readiness research/prospective/ae001-t004/readiness.json \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --attempts 4 \
            --timeout-seconds 30 | tee "$T004_WORK/score.json"
          python scripts/verify_ae001_t004_decisions.py \
            --ledger research/prospective/ae001-t004/decision-ledger.json
          python scripts/verify_ae001_t004_readiness.py \
            --readiness research/prospective/ae001-t004/readiness.json

      - name: Anchor T004 decision separately
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          LEDGER="research/prospective/ae001-t004/decision-ledger.json"
          READINESS="research/prospective/ae001-t004/readiness.json"
          BRANCH="main"
          START_SHA="$POST_SC001_SHA"

          python scripts/verify_ae001_t004_decisions.py --ledger "$LEDGER"
          python scripts/verify_ae001_t004_readiness.py --readiness "$READINESS"
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add "$LEDGER" "$READINESS"
          if [ -d research/prospective/ae001-t004/decisions ]; then
            git add research/prospective/ae001-t004/decisions
          fi
          if git diff --cached --quiet; then
            echo "No new T004 decision state to anchor"
            exit 0
          fi

          git commit -m "AE001 T004: seal prospective decision ${{ steps.gate.outputs.date }} [skip ci]"

          CRITICAL_PATHS=(
            ".github/workflows/ae001-sc001-prospective-source-timing.yml"
            "registry/ae001_t004_delivery_confirmatory.yaml"
            "research/AE001_T004_PROSPECTIVE_DELIVERY_CONFIRMATION_V1.md"
            "research/AE001_T004_MODEL_FREEZE_P1.md"
            "research/prospective/ae001-sc001"
            "research/prospective/ae001-t004"
            "src/marketlab/alpha_prospective_sources.py"
            "src/marketlab/alpha_t004.py"
            "src/marketlab/alpha_t004_prospective.py"
            "src/marketlab/alpha_t004_readiness.py"
            "scripts/score_ae001_t004_decision.py"
            "scripts/verify_ae001_t004_decisions.py"
            "scripts/verify_ae001_t004_readiness.py"
          )

          for ATTEMPT in 1 2 3; do
            git fetch origin "$BRANCH"
            CURRENT_MAIN="$(git rev-parse "origin/$BRANCH")"
            if [ "$START_SHA" != "$CURRENT_MAIN" ]; then
              if ! git diff --quiet "$START_SHA" "$CURRENT_MAIN" -- "${CRITICAL_PATHS[@]}"; then
                echo "SC001/T004 rules or canonical state changed while T004 prediction was in flight"
                git diff --stat "$START_SHA" "$CURRENT_MAIN" -- "${CRITICAL_PATHS[@]}"
                exit 1
              fi
              git rebase "origin/$BRANCH"
              python scripts/verify_ae001_sc001.py \
                --ledger research/prospective/ae001-sc001/source-ledger.json
              python scripts/verify_ae001_t004_decisions.py --ledger "$LEDGER"
              python scripts/verify_ae001_t004_readiness.py --readiness "$READINESS"
            fi
            if git push origin HEAD:"$BRANCH"; then
              exit 0
            fi
            sleep $((ATTEMPT * 2))
          done
          echo "Unable to anchor T004 decision after bounded retries"
          exit 1

      - name: Upload T004 prospective support evidence
        if: always() && steps.gate.outputs.state == 'READY'
        uses: actions/upload-artifact@v4
        with:
          name: ae001-t004-prospective-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/ae001-t004-prospective
          if-no-files-found: warn
          retention-days: 90

      - name: Report pre-start probe
        if: steps.gate.outputs.state != 'READY'
        run: echo "SC001 has not reached its frozen start boundary"
