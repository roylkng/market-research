name: HG001 full-market hidden-gem research router

on:
  push:
    branches:
      - research/hg001-hidden-gem-router-20261005

permissions:
  actions: read
  contents: read

jobs:
  route:
    if: contains(github.event.head_commit.message, '[hg001-d001]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate frozen routers
        run: |
          ruff check \
            src/marketlab/ei001_inflection.py \
            src/marketlab/hg001_router.py \
            scripts/materialize_hg001_router.py \
            tests/test_hg001_router.py
          pytest -q tests/test_hg001_router.py
      - name: Download EI001 D002
        uses: actions/download-artifact@v4
        with:
          name: ei001-d002-37217767159
          path: reports/ei
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37217767159
      - name: Download HA001 D001
        uses: actions/download-artifact@v4
        with:
          name: ha001-d001-37218405833
          path: reports/ha
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37218405833
      - name: Download GF001 D002
        uses: actions/download-artifact@v4
        with:
          name: gf001-d002-37202941712
          path: reports/gf
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37202941712
      - name: Download SS001 I001
        uses: actions/download-artifact@v4
        with:
          name: ss001-i001-37198634478
          path: reports/i001
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37198634478
      - name: Download SS002 P2
        uses: actions/download-artifact@v4
        with:
          name: ss002-d001-p2-37203696204
          path: reports/ss002
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37203696204
      - name: Materialize frozen routers
        run: |
          python scripts/materialize_hg001_router.py \
            --ei-panel reports/ei/ei001-d002-panel.json \
            --ha-panel reports/ha/ha001-d001-panel.json \
            --gf-panel reports/gf/gf001-d002-panel.json \
            --investability reports/i001/ss001-i001-context.json \
            --special reports/ss002/ss002-d001-census.json \
            --output reports/hg001
      - name: Prove research-only output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ei=json.loads(Path("reports/hg001/ei001-s001-router.json").read_text())
          hg=json.loads(Path("reports/hg001/hg001-d001-router.json").read_text())
          assert ei["router_id"]=="EI001-S001-v1"
          assert hg["router_id"]=="HG001-D001-v1"
          assert hg["identity_count"]==2319
          assert hg["return_outcomes_opened"] is False
          assert hg["model_fitted"] is False
          assert hg["portfolio_eligibility_allowed"] is False
          assert hg["live_capital_allowed"] is False
          PY
      - name: Upload exact router evidence
        uses: actions/upload-artifact@v4
        with:
          name: hg001-d001-${{ github.run_id }}
          path: reports/hg001
          if-no-files-found: error
          retention-days: 90
