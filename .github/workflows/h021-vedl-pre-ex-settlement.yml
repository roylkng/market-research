name: H021 original VEDL 14 Oct pre-ex settlement chronology

on:
  pull_request:
    paths:
      - src/marketlab/h021_vedl_settlement.py
      - scripts/reconcile_h021_vedl_exdate_settlement.py
      - tests/test_h021_vedl_settlement.py
      - .github/workflows/h021-vedl-pre-ex-settlement.yml
  push:
    branches:
      - main
    paths:
      - src/marketlab/h021_vedl_settlement.py
      - scripts/reconcile_h021_vedl_exdate_settlement.py
      - tests/test_h021_vedl_settlement.py
      - .github/workflows/h021-vedl-pre-ex-settlement.yml

permissions:
  contents: write

concurrency:
  group: h021-vedl-pre-ex-date-original-source-chonology
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify frozen dividend, original price, and T+1 risk conditions
        run: |
          ruff check src/marketlab/h021_vedl_settlement.py scripts/reconcile_h021_vedl_exdate_settlement.py tests/test_h021_vedl_settlement.py
          pytest -q tests/test_h021_vedl_settlement.py
      - name: Generate source-only counterfactual before ex-date
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reconcile_h021_vedl_exdate_settlement.py \
            --repo-root . \
            --out /tmp/h021-vedl-pre-ex-originals-v1.json
          test -s /tmp/h021-vedl-pre-ex-originals-v1.json
      - name: Commit once before 14 Oct ex-session open
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          TARGET="research/prospective/h021/dividend-evidence/vedl-2026-10-08/conditional-t1-exdate-v1.json"
          if [[ -f "$TARGET" ]]; then
            python scripts/reconcile_h021_vedl_exdate_settlement.py \
              --out "$TARGET" --verify-existing
            exit 0
          fi
          if [[ "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "2026-10-14T03:45:00Z" ]]; then
            echo "Too late to label pre-ex source scenario prospective"
            exit 1
          fi
          mkdir -p "$(dirname "$TARGET")"
          cp /tmp/h021-vedl-pre-ex-originals-v1.json "$TARGET"
          git config user.name marketlab-research-bot
          git config user.email marketlab-research-bot@users.noreply.github.com
          git add "$TARGET"
          git commit -m "H021: anchor pre-ex Oct14 VEDL source-only T1 dividend risk [skip ci]"
          BASE_SHA="$(git rev-parse HEAD^)"
          for RETRY in 1 2 3; do
            if [[ "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "2026-10-14T03:45:00Z" ]]; then
              echo "H021 pre-ex report missed source cutoff, not backdating"
              exit 1
            fi
            git fetch origin main
            CURRENT_MAIN="$(git rev-parse origin/main)"
            if git cat-file -e "origin/main:$TARGET" 2>/dev/null; then
              echo "Original T+1 source report already published, refuse overwrite"
              exit 1
            fi
            if ! git diff --quiet "$BASE_SHA" "$CURRENT_MAIN" -- \
              research/prospective/h021/intents/2026-10-09-primary-entry-intent-v1.json \
              research/prospective/h021/entry-observations/2026-10-12-first-entry-v1.json \
              research/prospective/h021/daily-prices/2026-10-13-v1.json \
              research/prospective/h021/dividend-evidence/vedl-2026-10-08 \
              research/prospective/calendars/FY27-Q2-2026-09-06/NSE-CM-FY27Q2-v1.json \
              src/marketlab/h021_vedl_settlement.py; then
              echo "Underlying frozen source changed while writing evidence"
              exit 1
            fi
            if [[ "$CURRENT_MAIN" != "$BASE_SHA" ]]; then
              git rebase origin/main
              BASE_SHA="$CURRENT_MAIN"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((2*RETRY))"
          done
          exit 1
      - name: Retain reproducible full original source exposure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h021-vedl-original-oct14-t1-preex-risk-v1
          path: /tmp/h021-vedl-pre-ex-originals-v1.json
          if-no-files-found: ignore
          retention-days: 90
