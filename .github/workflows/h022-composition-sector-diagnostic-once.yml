name: H022 composition sector diagnostic once

on:
  push:
    branches:
      - research/h022-composition-sector-diagnostic-v1-20260914
    paths:
      - .github/workflows/h022-composition-sector-diagnostic-once.yml

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h022-composition-sector-diagnostic-v1-20260914
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Run frozen H022-D002 diagnostic
        run: |
          set -euo pipefail
          OUT='research/historical/h022/composition-sector-diagnostic-v1'
          mkdir -p "$OUT"
          python scripts/run_h022_composition_diagnostic.py \
            --outcome-report research/historical/h022/expanded-nifty200-challenge-v1/outcome-report.json \
            --reconstruction research/historical/h022/historical-nifty200-universe-v1/membership-reconstruction.json \
            --current-u001 research/prospective/universes/FY27-Q2-2026-09-06.json \
            --panel-out "$OUT/diagnostic-panel.json" \
            --summary-out "$OUT/diagnostic-summary.json"

      - name: Anchor diagnostic and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'marketlab-research-bot'
          git config user.email 'marketlab-research-bot@users.noreply.github.com'
          git add research/historical/h022/composition-sector-diagnostic-v1
          git rm .github/workflows/h022-composition-sector-diagnostic-once.yml
          git commit -m 'H022: anchor composition sector diagnostic results'
          git push origin HEAD:research/h022-composition-sector-diagnostic-v1-20260914
