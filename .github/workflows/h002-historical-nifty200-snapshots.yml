name: H002 historical Nifty 200 snapshots

on:
  push:
    branches:
      - work/h002-historical-replay-v1-20260907
    paths:
      - registry/nifty200_historical_membership_v1.yaml
      - src/marketlab/nifty200_history.py
      - scripts/build_nifty200_historical_snapshots.py
      - tests/test_nifty200_history.py
      - .github/workflows/h002-historical-nifty200-snapshots.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h002-historical-nifty200-snapshots
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/h002-historical-replay-v1-20260907
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint reconstruction path
        run: |
          ruff check \
            src/marketlab/nifty200_history.py \
            scripts/build_nifty200_historical_snapshots.py \
            tests/test_nifty200_history.py
      - name: Test reconstruction invariants
        run: pytest -q tests/test_nifty200_history.py
      - name: Build six point-in-time snapshots
        run: python scripts/build_nifty200_historical_snapshots.py
      - name: Validate snapshot manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('research/historical/nifty200/snapshots-v1/manifest.json')
          doc = json.loads(path.read_text())
          if doc['snapshot_count'] != 6:
              raise SystemExit(f"expected 6 snapshots, got {doc['snapshot_count']}")
          for row in doc['snapshots']:
              if row['regular_member_count'] != 200:
                  raise SystemExit(f"{row['quarter_id']} regular count={row['regular_member_count']}")
              if not 100 <= row['non_financial_member_count'] < 200:
                  raise SystemExit(
                      f"{row['quarter_id']} implausible non-financial count={row['non_financial_member_count']}"
                  )
              print(
                  row['quarter_id'],
                  row['freeze_date'],
                  'regular', row['regular_member_count'],
                  'non_financial', row['non_financial_member_count'],
                  'dummies', row['dummy_symbols'],
                  'sha', row['snapshot_sha256'],
              )
          PY
      - name: Commit frozen snapshots
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git pull --rebase origin work/h002-historical-replay-v1-20260907
          git add research/historical/nifty200/snapshots-v1
          if git diff --cached --quiet; then
            echo "Historical Nifty 200 snapshots already frozen"
            exit 0
          fi
          git commit -m "H002-HR003: freeze point-in-time Nifty 200 snapshots"
          git push origin HEAD:work/h002-historical-replay-v1-20260907
