name: SS001 D003 current company-size source

on:
  push:
    branches:
      - research/ss001-current-size-20261004

permissions:
  actions: read
  contents: read

jobs:
  size:
    if: contains(github.event.head_commit.message, '[ss001-d003]')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate frozen size implementation before source access
        run: |
          ruff check \
            src/marketlab/ss001_size.py \
            src/marketlab/nse.py \
            scripts/run_ss001_d003.py \
            tests/test_ss001_size.py \
            tests/test_nse_quote_raw.py
          pytest -q \
            tests/test_ss001_size.py \
            tests/test_nse_quote_raw.py

      - name: Download exact passed SS001 D001 census
        uses: actions/download-artifact@v4
        with:
          name: ss001-d001-37197575401
          path: reports/ss001-d001-source
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37197575401

      - name: Verify frozen D001 census
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          census=json.loads(
              Path("reports/ss001-d001-source/ss001-d001-census.json").read_text()
          )
          assert census["census_sha256"] == (
              "0cfdc8658873a09f0cfa547467108888523eee88951050acfd2df8bd131829b7"
          )
          assert census["eq_identity_count"] == 2319
          assert census["return_outcomes_opened"] is False
          PY

      - name: Acquire current official NSE company-size context
        run: |
          python scripts/run_ss001_d003.py \
            --d001-census reports/ss001-d001-source/ss001-d001-census.json \
            --raw-dir reports/ss001-d003/raw \
            --output reports/ss001-d003 \
            --attempts 3 \
            --timeout-seconds 20 \
            --pause-seconds 0.02

      - name: Prove outcome-blind size panel
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          panel=json.loads(
              Path("reports/ss001-d003/ss001-d003-size-panel.json").read_text()
          )
          assert panel["panel_id"] == "SS001-D003-v1"
          assert panel["identity_count"] == 2319
          assert panel["return_outcomes_opened"] is False
          assert panel["model_fitted"] is False
          assert panel["portfolio_eligibility_allowed"] is False
          assert panel["live_capital_allowed"] is False
          print(json.dumps({
              "panel_sha256":panel["panel_sha256"],
              "ready_market_cap_count":panel["ready_market_cap_count"],
              "ready_market_cap_ratio":panel["ready_market_cap_ratio"],
              "outside_u001_ready_market_cap_count":panel["outside_u001_ready_market_cap_count"],
              "outside_u001_ready_market_cap_ratio":panel["outside_u001_ready_market_cap_ratio"],
              "size_band_counts":panel["size_band_counts"],
              "outside_u001_size_band_counts":panel["outside_u001_size_band_counts"],
              "financial_source_count_by_size_band":panel["financial_source_count_by_size_band"],
              "special_action_symbol_count_by_size_band":panel["special_action_symbol_count_by_size_band"],
              "threshold_passes":panel["threshold_passes"],
              "feasibility_pass":panel["feasibility_pass"],
          },indent=2,sort_keys=True))
          PY

      - name: Upload exact D003 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss001-d003-${{ github.run_id }}
          path: reports/ss001-d003
          if-no-files-found: warn
          retention-days: 90
