name: L001 P013 exceptional Q1 earnings source replay

on:
  pull_request:
    paths:
      - src/marketlab/l001_p013_exceptional_earnings.py
      - scripts/materialize_l001_p013_exceptionals.py
      - tests/test_l001_p013_exceptional_earnings.py
      - .github/workflows/l001-p013-exceptional-earnings.yml

permissions:
  contents: read
  actions: read

jobs:
  original_replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and validate source-only test contracts
        run: |
          python -m pip install -e '.[dev]'
          ruff check src/marketlab/l001_p013_exceptional_earnings.py scripts/materialize_l001_p013_exceptionals.py tests/test_l001_p013_exceptional_earnings.py
          pytest -q tests/test_l001_p013_exceptional_earnings.py
      - name: Acquire original pinned P007 full-100 XBRL-derived review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/12112967877/zip" \
            --output "$RUNNER_TEMP/l001-p007-original.zip"
          unzip -tq "$RUNNER_TEMP/l001-p007-original.zip" >/dev/null
      - name: Independent full-100 source-PBT bridge
        run: |
          python scripts/materialize_l001_p013_exceptionals.py \
            --p007-artifact "$RUNNER_TEMP/l001-p007-original.zip" \
            --output "$RUNNER_TEMP/l001-p013-original-exceptional-pbt-100.json" \
            | tee "$RUNNER_TEMP/l001-p013-summary.json"
      - name: Preserve posthoc evidence, not forecast
        uses: actions/upload-artifact@v4
        with:
          name: l001-p013-original-100-exceptional-pbt
          path: |
            ${{ runner.temp }}/l001-p013-original-exceptional-pbt-100.json
            ${{ runner.temp }}/l001-p013-summary.json
          retention-days: 90
