name: HG006 D001 historical discrete-event source census

on:
  push:
    branches:
      - research/hg006-historical-event-base-rates-20261005

permissions:
  contents: read

jobs:
  census:
    if: contains(github.event.head_commit.message, '[hg006-d001]')
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate frozen HG006 implementation before source access
        run: |
          ruff check \
            src/marketlab/hg006_historical_events.py \
            scripts/run_hg006_d001.py \
            tests/test_hg006_historical_events.py
          pytest -q \
            tests/test_hg006_historical_events.py \
            tests/test_ss002_special_situations.py \
            tests/test_alpha_announcements.py

      - name: Run frozen historical event source census
        run: |
          python scripts/run_hg006_d001.py \
            --raw-dir reports/hg006-d001/raw \
            --output reports/hg006-d001 \
            --attempts 4 \
            --timeout-seconds 25 \
            --pause-seconds 0.03

      - name: Prove source-only base-rate census
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/hg006-d001/hg006-d001-census.json").read_text())
          assert p["census_id"]=="HG006-D001-v1"
          assert p["completion_probabilities_assigned"] is False
          assert p["expected_returns_calculated"] is False
          assert p["return_outcomes_opened"] is False
          assert p["model_fitted"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          print(json.dumps({
            "census_sha256":p["census_sha256"],
            "source_row_count":p["source_row_count"],
            "retained_event_count":p["retained_event_count"],
            "retained_symbol_count":p["retained_symbol_count"],
            "historical_chronology_count":p["historical_chronology_count"],
            "historical_chronology_counts_by_family":p["historical_chronology_counts_by_family"],
            "historical_attachment_ready_chronology_ratio":p["historical_attachment_ready_chronology_ratio"],
            "threshold_passes":p["threshold_passes"],
            "feasibility_pass":p["feasibility_pass"],
          },indent=2,sort_keys=True))
          PY

      - name: Upload exact HG006 source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hg006-d001-${{ github.run_id }}
          path: reports/hg006-d001
          if-no-files-found: warn
          retention-days: 90
