name: H003-V001 r4 import missing semantic judgments

on:
  push:
    branches:
      - work/h003-complete-review-20260907-import6
    paths:
      - .github/workflows/h003-v001-r4-import-missing.yml

permissions:
  contents: write

jobs:
  import-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/h003-complete-review-20260907-import6
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'

      - name: Reconstruct and verify audited batches 0016-0091
        shell: bash
        run: |
          set -euo pipefail
          declare -A expected
          expected[00]=6b726b2c8d37a9353992b88174e53cadc6be33bf635319717ec91f7d2dc4259d
          expected[01]=426473c29e8e2f0ebdc6d0b770b06c4ed3bf1f1459d695fbcc99a0243041000e
          expected[02]=0720f307c118c3f58297107f9051b092d021f1a9ce2f4d5883672ed3dcca501c
          expected[03]=1349a10b22d71f661a6e252ada21298cbefd44a58ce79607240e7d384e10329d
          expected[04]=cdac34620e6e655afa93ef5ce5da7951e19ef16fa6218d63a292323c969d3328
          expected[05]=5897490ab875cd3240cefc04f2a66948a15fb1908866b3152f7db68f6c7ddac2
          expected[06]=fa3f86712fb147abd21b37e7634972a4b2d56beee42f2f5b689b089626a437fa
          expected[07]=5718107f61ea7ac3b4e44a02079bbbf3e824842538bd8a6cd55969ce4e666292
          expected[08]=efdae0ffe71207e91dc8ed03d3b42e3037574a2fc99f76f1653b37863d4fd6a8

          rm -f /tmp/h003-missing.b64
          for n in 00 01 02 03 04 05 06 07 08; do
            limit=14000
            test "$n" = 08 && limit=11736
            tmp="/tmp/h003-${n}.canon"
            case "$n" in
              02|05|06|07)
                test "$(find .github -maxdepth 1 -name "h003-repair-p${n}-*.b64" | wc -l)" -eq 4
                for sub in 0 1 2 3; do
                  test "$(wc -c < ".github/h003-repair-p${n}-${sub}.b64")" -eq 3500
                done
                cat .github/h003-repair-p${n}-0.b64 \
                    .github/h003-repair-p${n}-1.b64 \
                    .github/h003-repair-p${n}-2.b64 \
                    .github/h003-repair-p${n}-3.b64 \
                  | tr -d ' \t\r\n' > "$tmp"
                ;;
              *)
                tr -d ' \t\r\n' < ".github/h003-bz-part-${n}.b64" > "$tmp"
                ;;
            esac
            actual="$(sha256sum "$tmp" | awk '{print $1}')"
            bytes="$(wc -c < "$tmp")"
            echo "part=${n} bytes=${bytes} sha256=${actual} expected=${expected[$n]}"
            test "$bytes" -eq "$limit"
            test "$actual" = "${expected[$n]}"
            cat "$tmp" >> /tmp/h003-missing.b64
          done

          test "$(wc -c < /tmp/h003-missing.b64)" -eq 123736
          base64 --decode /tmp/h003-missing.b64 > /tmp/h003-missing.tar.bz2
          echo 'b27d4d38f31f82ebbe6765685d164ec452f0cac04511d9d78435b5a2cbead2ad  /tmp/h003-missing.tar.bz2' | sha256sum -c -

          mkdir -p research/prospective/h003/FY27-Q2-2026-09-06/review-v001-r4/semantic-judgments
          tar -xjf /tmp/h003-missing.tar.bz2 \
            -C research/prospective/h003/FY27-Q2-2026-09-06/review-v001-r4/semantic-judgments
          test "$(find research/prospective/h003/FY27-Q2-2026-09-06/review-v001-r4/semantic-judgments -maxdepth 1 -name 'batch-*.json' | wc -l)" -eq 117

      - name: Normalize reason codes and repack by immutable candidate id
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          base = Path('research/prospective/h003/FY27-Q2-2026-09-06/review-v001-r4')
          batch_dir = base / 'batches20'
          judgments_dir = base / 'semantic-judgments'
          manifest = json.loads((batch_dir / 'manifest.json').read_text(encoding='utf-8'))
          aliases = {
              'REJECT_DUPLICATE': 'REJECT_DUPLICATE_OR_RESTATEMENT',
              'REJECT_OTHER_EXPLICIT_NOTE': 'REJECT_OTHER_WITH_EXPLICIT_NOTE',
          }

          def canonical_hash(value):
              raw = json.dumps(
                  value,
                  sort_keys=True,
                  separators=(',', ':'),
                  ensure_ascii=False,
                  allow_nan=False,
              ).encode('utf-8')
              return hashlib.sha256(raw).hexdigest()

          judgments_by_id = {}
          reviewer_versions = set()
          source_docs = {}
          frozen_ids = []

          for entry in manifest['batches']:
              name = entry['file']
              source = json.loads((batch_dir / name).read_text(encoding='utf-8'))
              if canonical_hash(source) != entry['batch_sha256']:
                  raise SystemExit(f'frozen source batch hash mismatch: {name}')
              source_docs[name] = source
              frozen_ids.extend(str(item['candidate_id']) for item in source)

          if len(frozen_ids) != 2322 or len(set(frozen_ids)) != 2322:
              raise SystemExit('frozen source candidate identity/coverage is not exactly 2322 unique ids')
          frozen_set = set(frozen_ids)

          for path in sorted(judgments_dir.glob('batch-*.json')):
              doc = json.loads(path.read_text(encoding='utf-8'))
              reviewer = str(doc.get('reviewer_version') or '').strip()
              if not reviewer:
                  raise SystemExit(f'missing reviewer_version: {path.name}')
              reviewer_versions.add(reviewer)
              for item in doc.get('judgments', []):
                  if not isinstance(item, dict):
                      raise SystemExit(f'non-object judgment in {path.name}')
                  candidate_id = str(item.get('candidate_id') or '')
                  if not candidate_id:
                      raise SystemExit(f'missing candidate_id in {path.name}')
                  if candidate_id in judgments_by_id:
                      raise SystemExit(f'duplicate reviewed candidate id across documents: {candidate_id}')
                  normalized = dict(item)
                  old_reason = normalized.get('reason_code')
                  if old_reason in aliases:
                      normalized['reason_code'] = aliases[old_reason]
                  judgments_by_id[candidate_id] = normalized

          observed_set = set(judgments_by_id)
          missing = sorted(frozen_set - observed_set)
          extra = sorted(observed_set - frozen_set)
          if missing or extra or len(judgments_by_id) != 2322:
              raise SystemExit(
                  f'global judgment coverage mismatch: reviewed={len(judgments_by_id)} '
                  f'missing={len(missing)} extra={len(extra)} '
                  f'missing_sample={missing[:5]} extra_sample={extra[:5]}'
              )
          if len(reviewer_versions) != 1:
              raise SystemExit(f'multiple reviewer versions in frozen review: {sorted(reviewer_versions)}')
          reviewer_version = next(iter(reviewer_versions))

          for entry in manifest['batches']:
              name = entry['file']
              source = source_docs[name]
              ordered = [judgments_by_id[str(item['candidate_id'])] for item in source]
              repacked = {
                  'schema_version': 1,
                  'batch_file': name,
                  'batch_sha256': entry['batch_sha256'],
                  'reviewer_version': reviewer_version,
                  'judgments': ordered,
              }
              (judgments_dir / name).write_text(
                  json.dumps(repacked, indent=2, ensure_ascii=False) + '\n',
                  encoding='utf-8',
              )

          print('global blind review binding proven: 2322/2322 unique frozen candidate ids')
          print('repacked all 117 semantic judgment documents in canonical frozen batch order')
          PY

      - name: Load canonical compiler from main
        run: |
          git fetch origin main --depth=1
          git show origin/main:scripts/compile_h003_review_judgments.py > /tmp/compile_h003_review_judgments.py

      - name: Compile complete blind review
        run: |
          python /tmp/compile_h003_review_judgments.py \
            --batch-manifest research/prospective/h003/FY27-Q2-2026-09-06/review-v001-r4/batches20/manifest.json \
            --batch-dir research/prospective/h003/FY27-Q2-2026-09-06/review-v001-r4/batches20 \
            --blind-payloads research/prospective/h003/FY27-Q2-2026-09-06/review-v001-r4/blind-payloads.json \
            --judgments-dir research/prospective/h003/FY27-Q2-2026-09-06/review-v001-r4/semantic-judgments \
            --out-dir research/prospective/h003/FY27-Q2-2026-09-06/review-v001-r4/compiled-decisions \
            --repo-root .

      - name: Prove completeness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research/prospective/h003/FY27-Q2-2026-09-06/review-v001-r4/compiled-decisions/manifest.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['compiled_batch_count'] == 117, d
          assert d['compiled_candidate_count'] == 2322, d
          assert d['complete'] is True, d
          print(json.dumps({k: d[k] for k in ('compiled_batch_count','compiled_candidate_count','complete')}, indent=2))
          PY

      - name: Commit completed review and remove importer
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          rm -f .github/h003-bz-part-*.b64 \
                .github/h003-repair-p*.b64 \
                .github/h003-staging-marker.txt \
                .github/workflows/h003-v001-r4-import-missing.yml
          git add -A
          git diff --cached --check
          git commit -m "H003-V001: complete blind semantic review"
          git push origin HEAD:work/h003-complete-review-20260907-import6
