name: H019 outcome-blind official filing source feasibility

on:
  push:
    branches:
      - research/h019-fundamental-inflection-source-audit-20260909
    paths:
      - .github/workflows/h019-source-feasibility.yml
      - scripts/h019_source_feasibility.py
      - research/H019_SOURCE_AUDIT_PLAN.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h019-fundamental-inflection-source-audit-20260909
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repository environment
        run: python -m pip install -e '.[dev]'
      - name: Verify outcome-blind source audit
        run: |
          ruff check scripts/h019_source_feasibility.py
          python -m py_compile scripts/h019_source_feasibility.py
          python - <<'PY'
          from pathlib import Path
          text = Path('scripts/h019_source_feasibility.py').read_text(encoding='utf-8').casefold()
          forbidden = ('future_return', 'stock_return', 'nifty_return', 'excess_return', 'selected.csv', 'challenge-summary')
          for token in forbidden:
              assert token not in text, token
          print('H019 source audit contains no outcome calculation contract')
          PY
      - name: Run official NSE filing source audit
        run: |
          rm -rf /tmp/h019-source-audit
          python scripts/h019_source_feasibility.py --out /tmp/h019-source-audit
          test -s /tmp/h019-source-audit/source-audit-summary.json
          test -s /tmp/h019-source-audit/listing-manifest.json
          test -s /tmp/h019-source-audit/filing-sample-manifest.json
      - name: Upload H019 source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h019-source-feasibility-${{ github.run_id }}
          path: /tmp/h019-source-audit
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
