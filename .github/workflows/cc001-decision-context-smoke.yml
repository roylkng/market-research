name: CC001 decision context and identity recovery
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/marketlab/company_change_context.py'
      - 'src/marketlab/company_change_context_quality.py'
      - 'src/marketlab/company_change_decisions.py'
      - 'tests/test_company_change_context_quality.py'
      - 'tests/test_company_change_decisions.py'
      - '.github/workflows/cc001-decision-context-smoke.yml'
permissions:
  contents: read
jobs:
  verify-decision-context:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Restore copy of existing research state
        run: |
          git fetch --depth=1 origin cc001-state
          git show FETCH_HEAD:workspace.zip > /tmp/cc001-decision-input.zip
          python -m marketlab.company_change_checkpoint restore --workspace /tmp/cc001-decision --archive /tmp/cc001-decision-input.zip
      - name: Replay historical identity recovery and accounting gates
        run: python -m marketlab.company_change_context --workspace /tmp/cc001-decision --symbols CONCOR KRSNAA UPL AEROPLANE 'ARE&M' --limit 5
      - name: Export combined decision context
        if: always()
        run: python -m marketlab.company_change_decisions --workspace /tmp/cc001-decision --output-prefix /tmp/cc001-decision/reports/decision-context
      - name: Preserve exact implementation with original evidence
        if: always()
        run: |
          mkdir -p /tmp/cc001-decision/implementation/src/marketlab /tmp/cc001-decision/implementation/tests /tmp/cc001-decision/implementation/data/fixtures /tmp/cc001-decision/implementation/workflows
          cp src/marketlab/*.py /tmp/cc001-decision/implementation/src/marketlab/
          cp tests/test_company_change*.py /tmp/cc001-decision/implementation/tests/
          cp data/fixtures/company_change*.json /tmp/cc001-decision/implementation/data/fixtures/
          cp .github/workflows/cc001*.yml /tmp/cc001-decision/implementation/workflows/
          cp pyproject.toml /tmp/cc001-decision/implementation/
          git rev-parse HEAD > /tmp/cc001-decision/implementation/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cc001-decision-context-evidence
          path: /tmp/cc001-decision
          retention-days: 14
          if-no-files-found: error
