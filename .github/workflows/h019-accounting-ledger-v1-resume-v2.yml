name: H019 accounting ledger v1 frozen replay v2

on:
  push:
    branches:
      - research/h019-fundamental-inflection-source-audit-20260909
    paths:
      - .github/workflows/h019-accounting-ledger-v1-resume-v2.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h019-fundamental-inflection-source-audit-20260909

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install repository environment
        run: python -m pip install -e '.[dev]'

      - name: Normalize lint and verify replay before parent evidence
        run: |
          ruff check --fix scripts/h019_accounting_ledger_v1_resume.py tests/test_h019_accounting_ledger_v1_resume.py
          ruff check scripts/h019_accounting_ledger_v1_resume.py tests/test_h019_accounting_ledger_v1_resume.py
          python -m py_compile scripts/h019_accounting_ledger_v1_resume.py
          pytest -q
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('scripts/h019_accounting_ledger_v1_resume.py').read_text(encoding='utf-8').casefold()
          forbidden = (
              'bhavcopy', 'nifty500', 'gross_excess', 'net_excess',
              'future_return', 'stock_return', 'selected.csv', 'challenge-summary',
          )
          for token in forbidden:
              assert token not in text, token
          print('H019 ledger replay contains no security-outcome calculation path')
          PY
          sha256sum scripts/h019_numeric_extraction_audit_v3.py > /tmp/h019-v3-parser-before.sha256

      - name: Verify parent GitHub artifact digest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          import requests

          url = 'https://api.github.com/repos/roylkng/market-research/actions/runs/34363988787/artifacts'
          response = requests.get(
              url,
              headers={
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
              timeout=30,
          )
          response.raise_for_status()
          artifacts = response.json()['artifacts']
          target = next(a for a in artifacts if a['id'] == 10109147020)
          expected = 'sha256:491d3a77d7bc63935db42d4672fca92638fbc14ad8628c47e6ddeb6e80755ba0'
          assert target['name'] == 'h019-accounting-ledger-v1-34363988787'
          assert target['digest'] == expected, (target['digest'], expected)
          print('Parent H019 ledger artifact digest verified:', expected)
          PY

      - name: Restore frozen parent artifact
        uses: actions/download-artifact@v4
        with:
          name: h019-accounting-ledger-v1-34363988787
          path: /tmp/h019-ledger-parent
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 34363988787

      - name: Verify exact frozen parent cohort and metadata
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / 'scripts'))
          import h019_accounting_ledger_v1_resume as replay

          lineage = replay.verify_parent(Path('/tmp/h019-ledger-parent'))
          assert lineage['status'] == 'PARENT_FROZEN_FILES_VERIFIED'
          assert lineage['frozen_symbol_count'] == 100
          assert lineage['frozen_report_count'] == 157
          assert lineage['symbols_with_selected_reports'] == 81
          assert lineage['report_count_distribution'] == {'0': 19, '1': 5, '2': 76}
          assert lineage['report_rows_by_group'] == {
              'SURVIVOR_PROXY': 100,
              'EXIT_PROXY': 47,
              'NEW_PROXY': 10,
          }
          print(json.dumps(lineage, indent=2))
          PY

      - name: Replay exactly the frozen 157 reports
        run: |
          rm -rf /tmp/h019-accounting-ledger-v1-resumed
          python scripts/h019_accounting_ledger_v1_resume.py \
            --frozen-root /tmp/h019-ledger-parent \
            --out /tmp/h019-accounting-ledger-v1-resumed
          test -s /tmp/h019-accounting-ledger-v1-resumed/parent-artifact-lineage.json
          test -s /tmp/h019-accounting-ledger-v1-resumed/report-source-manifest.json
          test -s /tmp/h019-accounting-ledger-v1-resumed/report-extractions.json
          test -s /tmp/h019-accounting-ledger-v1-resumed/accounting-observations.json
          test -s /tmp/h019-accounting-ledger-v1-resumed/asof-resolved-facts.json
          test -s /tmp/h019-accounting-ledger-v1-resumed/symbol-history-coverage.json
          test -s /tmp/h019-accounting-ledger-v1-resumed/ledger-summary.json

      - name: Verify parser immutability and ledger integrity
        run: |
          sha256sum -c /tmp/h019-v3-parser-before.sha256
          git diff --exit-code -- scripts/h019_numeric_extraction_audit_v3.py
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/h019-accounting-ledger-v1-resumed')
          summary = json.loads((root / 'ledger-summary.json').read_text())
          assert summary['status'] == 'H019_ACCOUNTING_LEDGER_V1_RESUMED_COVERAGE_ONLY'
          assert summary['market_outcomes_opened'] is False
          assert summary['live_capital_allowed'] is False
          assert summary['selected_report_records'] == 157
          assert summary['symbols_with_zero_selected_reports'] == 19
          assert summary['symbols_with_one_selected_report'] == 5
          assert summary['symbols_with_two_selected_reports'] == 76
          assert summary['integrity_pass'] is True, summary['integrity_gates']
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload resumed H019 ledger evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h019-accounting-ledger-v1-resumed-v2-${{ github.run_id }}
          path: /tmp/h019-accounting-ledger-v1-resumed
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
