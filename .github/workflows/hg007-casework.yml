name: HG007 source-pinned hidden-gem casework

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hg007-casework.yml
      - src/marketlab/hg007_casework.py
      - scripts/build_hg007_casework.py
      - tests/test_hg007_casework.py
      - research/hg002-d001-result-v1.json
      - research/hg003-l002-result-v1.json
      - research/hg004-d001-result-v1.json
      - research/hg005-d001-result-v1.json
      - research/hg005-d003-result-v1.json
      - research/hg006-p001-result-v1.json
      - research/ss002-p005-result-v1.json

permissions:
  contents: read

jobs:
  casework:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify exact-source matrix and regression invariants
        run: |
          ruff check src/marketlab/hg007_casework.py scripts/build_hg007_casework.py tests/test_hg007_casework.py
          pytest -q tests/test_hg007_casework.py
      - name: Materialize complete 28-company evidence backlog
        run: |
          mkdir -p reports/generated/hg007
          python scripts/build_hg007_casework.py \
            --repo-root . \
            --out reports/generated/hg007/hg007-p001-casework-v1.json
          python scripts/build_hg007_casework.py \
            --repo-root . \
            --out reports/generated/hg007/hg007-p001-casework-v1.json \
            --verify-existing
          git diff --exit-code
      - name: Retain source-reproducible research-only result
        uses: actions/upload-artifact@v4
        with:
          name: hg007-28-company-source-reproducible-casework
          path: reports/generated/hg007/hg007-p001-casework-v1.json
          retention-days: 90
          if-no-files-found: error
