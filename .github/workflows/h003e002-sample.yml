name: H003-E002 deterministic transcript sample

on:
  push:
    branches:
      - feat/h003-claim-candidates-v1
    paths:
      - .github/workflows/h003e002-sample.yml

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_BUNDLE: research/prospective/h003/FY27-Q2-2026-09-06/source-coverage-v1.json
      RULE: registry/h003_extraction_rule.yaml
      OUT: run-out/h003-e002-sample
      ANCHOR: research/prospective/h003/FY27-Q2-2026-09-06/candidate-sample-v2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/h003-claim-candidates-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: make validate
      - name: Process the identical deterministic 30-source sample
        run: |
          mkdir -p "$OUT" "$ANCHOR"
          set +e
          python scripts/build_h003_candidates.py \
            --source-bundle "$SOURCE_BUNDLE" \
            --rule "$RULE" \
            --store "$OUT/store" \
            --report-out "$OUT/report.json" \
            --summary-out "$OUT/summary.json" \
            --sample-count 30 \
            --fetch-attempts 4 \
            --sleep-seconds 0.1
          code=$?
          set -e
          echo "$code" > "$OUT/extractor-exit-code.txt"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path(os.environ['OUT'])
          anchor = Path(os.environ['ANCHOR'])
          summary = json.loads((out / 'summary.json').read_text(encoding='utf-8'))
          summary['workflow_run_id'] = os.environ['GITHUB_RUN_ID']
          summary['workflow_run_attempt'] = os.environ['GITHUB_RUN_ATTEMPT']
          summary['source_commit_sha'] = os.environ['GITHUB_SHA']
          summary['artifact_name'] = f"h003-e002-sample-{os.environ['GITHUB_RUN_ID']}"
          summary['extractor_exit_code'] = int((out / 'extractor-exit-code.txt').read_text().strip())
          (anchor / 'summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          (anchor / 'report.json').write_text(
              (out / 'report.json').read_text(encoding='utf-8'), encoding='utf-8'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - name: Preserve exact E002 sample evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h003-e002-sample-${{ github.run_id }}
          path: run-out/h003-e002-sample
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Anchor E002 comparison and remove one-shot workflow
        if: always()
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git rm .github/workflows/h003e002-sample.yml
          git add "$ANCHOR"
          git commit -m "Anchor precision-corrected H003-E002 transcript sample"
          git push origin HEAD:feat/h003-claim-candidates-v1
