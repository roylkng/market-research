name: CC001 historical and price context
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/marketlab/company_change_context.py'
      - 'src/marketlab/company_change_prices.py'
      - 'tests/test_company_change_context*.py'
      - 'tests/test_company_change_prices.py'
      - '.github/workflows/cc001-context-smoke.yml'
permissions:
  contents: read
jobs:
  verify-original-context:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Restore a read-only copy of the existing research workspace
        run: |
          git fetch --depth=1 origin cc001-state
          git show FETCH_HEAD:workspace.zip > /tmp/cc001-context-input.zip
          python -m marketlab.company_change_checkpoint restore --workspace /tmp/cc001-context --archive /tmp/cc001-context-input.zip
      - name: Capture historical originals, exchange quotes and corporate actions
        run: python -m marketlab.company_change_context --workspace /tmp/cc001-context --symbols CONCOR KRSNAA UPL --limit 3
      - name: Preserve exact implementation and test sources with the evidence
        if: always()
        run: |
          mkdir -p /tmp/cc001-context/implementation/src/marketlab /tmp/cc001-context/implementation/tests /tmp/cc001-context/implementation/data/fixtures /tmp/cc001-context/implementation/.github/workflows
          cp src/marketlab/*.py /tmp/cc001-context/implementation/src/marketlab/
          cp tests/test_company_change*.py /tmp/cc001-context/implementation/tests/
          cp data/fixtures/company_change*.json /tmp/cc001-context/implementation/data/fixtures/
          cp .github/workflows/cc001*.yml /tmp/cc001-context/implementation/.github/workflows/
          cp pyproject.toml /tmp/cc001-context/implementation/
          git rev-parse HEAD > /tmp/cc001-context/implementation/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cc001-historical-price-evidence
          path: /tmp/cc001-context
          retention-days: 14
          if-no-files-found: error
