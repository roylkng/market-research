name: H019 frozen numeric extraction audit v3

on:
  push:
    branches:
      - research/h019-fundamental-inflection-source-audit-20260909
    paths:
      - .github/workflows/h019-numeric-extraction-audit-v3.yml
      - scripts/h019_numeric_extraction_audit_v3.py
      - tests/test_h019_numeric_extraction_v3.py
      - research/H019_NUMERIC_EXTRACTION_AUDIT_PLAN_V3.md
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h019-fundamental-inflection-source-audit-20260909

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install repository environment
        run: python -m pip install -e '.[dev]'

      - name: Verify v3 before accounting evidence
        run: |
          ruff check --fix scripts/h019_numeric_extraction_audit_v3.py tests/test_h019_numeric_extraction_v3.py
          ruff check scripts/h019_numeric_extraction_audit_v3.py tests/test_h019_numeric_extraction_v3.py
          python -m py_compile scripts/h019_numeric_extraction_audit_v3.py
          pytest -q
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('scripts/h019_numeric_extraction_audit_v3.py').read_text(encoding='utf-8').casefold()
          forbidden = (
              'marketdata', 'bhavcopy', 'nifty500', 'gross_excess', 'net_excess',
              'future_return', 'stock_return', 'selected.csv', 'challenge-summary',
          )
          for token in forbidden:
              assert token not in text, token
          print('H019 v3 numeric audit contains no market-outcome calculation path')
          PY

      - name: Verify frozen source artifact digest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          import requests

          url = 'https://api.github.com/repos/roylkng/market-research/actions/runs/34352537129/artifacts'
          response = requests.get(
              url,
              headers={
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
              timeout=30,
          )
          response.raise_for_status()
          artifacts = response.json()['artifacts']
          target = next(a for a in artifacts if a['name'] == 'h019-annual-report-source-audit-34352537129')
          expected = 'sha256:37aeda56b72b34a74f599ecfbd78a94a68de41d61ff3b96da27dcc8695ecb621'
          assert target['digest'] == expected, (target['digest'], expected)
          print('Frozen H019 v2 source artifact digest verified:', expected)
          PY

      - name: Restore frozen H019 annual-report corpus
        uses: actions/download-artifact@v4
        with:
          name: h019-annual-report-source-audit-34352537129
          path: /tmp/h019-v3-corpus
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 34352537129

      - name: Verify frozen corpus contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/h019-v3-corpus')
          summary = json.loads((root / 'source-audit-v2-summary.json').read_text())
          assert summary['status'] == 'H019_ANNUAL_REPORT_SOURCE_FEASIBILITY_ONLY'
          assert summary['market_outcomes_opened'] is False
          rows = json.loads((root / 'annual-report-content-sample.json').read_text())
          assert len(rows) == 12
          assert sum(row['group'] == 'SURVIVOR_PROXY' for row in rows) == 6
          assert sum(row['group'] == 'EXIT_PROXY' for row in rows) == 6
          print('Frozen 12-report H019 corpus verified')
          PY

      - name: Run frozen v3 numeric extraction audit
        run: |
          rm -rf /tmp/h019-numeric-audit-v3
          python scripts/h019_numeric_extraction_audit_v3.py \
            --corpus-root /tmp/h019-v3-corpus \
            --out /tmp/h019-numeric-audit-v3
          test -s /tmp/h019-numeric-audit-v3/numeric-extraction-summary.json
          test -s /tmp/h019-numeric-audit-v3/pdf-numeric-extractions.json
          test -s /tmp/h019-numeric-audit-v3/structured-crosschecks.json
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/h019-numeric-audit-v3')
          summary = json.loads((root / 'numeric-extraction-summary.json').read_text())
          assert summary['status'] == 'H019_NUMERIC_EXTRACTION_AUDIT_V3_ONLY'
          assert summary['protocol_version'] == 'v3'
          assert summary['market_outcomes_opened'] is False
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload H019 v3 numeric audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h019-numeric-extraction-audit-v3-${{ github.run_id }}
          path: /tmp/h019-numeric-audit-v3
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
