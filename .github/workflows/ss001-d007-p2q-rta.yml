name: SS001 D007 L001 P2 queue RTA001 rebuild
on:
  push:
    branches:
      - research/ss001-d007-l001-p2-chronology-queue-20261009
permissions:
  contents: write
jobs:
  build:
    if: contains(github.event.head_commit.message, '[ss001-d007-p2q-rta]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Rebuild deterministic RTA001 summary
        run: |
          python scripts/build_rta001_summary.py             --manifest research/rta001-trials-v1.json             --output research/rta001-summary-v1.json             --repo-root .
      - name: Commit rebuilt summary
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/rta001-summary-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "RTA001: rebuild summary for D007 P2 queue [skip ci]"
          git push origin HEAD:research/ss001-d007-l001-p2-chronology-queue-20261009
