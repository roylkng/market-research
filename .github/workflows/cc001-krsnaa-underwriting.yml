name: CC001 KRSNAA original-source underwriting
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/cc001_krsnaa*.py'
      - 'tests/test_cc001_krsnaa*.py'
      - 'research/company_cases/krsnaa/**'
      - '.github/workflows/cc001-krsnaa-underwriting.yml'
permissions:
  contents: read
jobs:
  verify-krsnaa-case:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Capture bounded original disclosures and dated official price
        run: python scripts/cc001_krsnaa_capture.py --workspace /tmp/cc001-krsnaa
      - name: Retain exact case implementation
        if: always()
        run: |
          mkdir -p /tmp/cc001-krsnaa/implementation/scripts /tmp/cc001-krsnaa/implementation/tests /tmp/cc001-krsnaa/implementation/workflows
          cp scripts/cc001_krsnaa*.py /tmp/cc001-krsnaa/implementation/scripts/
          cp tests/test_cc001_krsnaa*.py /tmp/cc001-krsnaa/implementation/tests/
          cp .github/workflows/cc001-krsnaa-underwriting.yml /tmp/cc001-krsnaa/implementation/workflows/
          git rev-parse HEAD > /tmp/cc001-krsnaa/implementation/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cc001-krsnaa-source-evidence
          path: /tmp/cc001-krsnaa
          retention-days: 14
          if-no-files-found: error
