name: SS001 D007 source evidence packet queue

on:
  push:
    branches:
      - research/ss001-d007-evidence-routing-20261008

permissions:
  actions: read
  contents: read

jobs:
  queue:
    if: contains(github.event.head_commit.message, '[ss001-d007]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate frozen D007 routing before source access
        run: |
          ruff check src/marketlab/ss001_share_review_queue.py scripts/materialize_ss001_d007_queue.py tests/test_ss001_share_review_queue.py
          pytest -q tests/test_ss001_share_review_queue.py
      - name: Download frozen D006 full-market review
        uses: actions/download-artifact@v4
        with:
          name: ss001-d006-37817153370
          path: reports/d006
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37817153370
      - name: Download frozen P2 event identities
        uses: actions/download-artifact@v4
        with:
          name: ss002-d001-p2-37203696204
          path: reports/p2
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37203696204
      - name: Materialize frozen D007 packets and 50-case pilot
        run: |
          python scripts/materialize_ss001_d007_queue.py \
            --d006-review reports/d006/ss001-d006-review.json \
            --p2-census reports/p2/ss002-d001-census.json \
            --output reports/d007
      - name: Prove source-only output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path("reports/d007/ss001-d007-source-packets.json").read_text())
          assert q["queue_id"]=="SS001-D007-Q001-v1"
          assert q["review_packet_count"]==331
          assert q["pilot_packet_count"]==50
          assert len(q["packets"])==331
          assert q["share_action_clearance_proven"] is False
          assert q["market_capitalization_calculated"] is False
          assert all(packet["capitalization_calculation_allowed"] is False for packet in q["packets"])
          assert q["return_outcomes_opened"] is False
          assert q["portfolio_eligibility_allowed"] is False
          print(json.dumps({k:v for k,v in q.items() if k!="packets"},indent=2,sort_keys=True))
          PY
      - name: Upload full D007 queue evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss001-d007-${{ github.run_id }}
          path: reports/d007
          if-no-files-found: warn
          retention-days: 90
