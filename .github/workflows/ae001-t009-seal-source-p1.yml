name: AE001 T009 seal source hashes P1

on:
  push:
    branches:
      - feat/ae001-t009-stock-options-positioning-20261001

permissions:
  contents: write
  actions: read

jobs:
  seal:
    if: contains(github.event.head_commit.message, '[t009-seal-source]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Download exact source-only evidence
        uses: actions/download-artifact@v4
        with:
          name: ae001-t009-source-36821482949
          path: evidence/t009-source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: roylkng/market-research
          run-id: 36821482949

      - name: Verify source-only evidence and append T009-P1
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import gzip
          import json
          from datetime import UTC, datetime
          from pathlib import Path

          from marketlab.alpha_trials import (
              append_trial_event,
              require_unopened_registered_trial,
              trial_state,
              validate_trial_ledger,
          )

          EXPECTED_MARKET = "9e644012720084a693071a40ce9c592b4586f8c6cee8445fcf7aa599be94b41e"
          EXPECTED_ACTION_SAFE = "300c45cc6cd5f3e0b37dc419c2d6250317175f367bd74757f1ad45b4a4af63c8"
          EXPECTED_ACTION = "1238ec2c4b2697cf52ea66194aeb0d70171a22071f7249e3fcdc8a8f83ede5c1"
          EXPECTED_DELIVERY = "99c0c34da30a9318c428d44d68d23360c7588a618e54cad80acde22a959c2e90"
          EXPECTED_FUTURES = "02656c828a1d5fe22660c154a445ebd69a7492b56f1807da0d8c959a6f0c11d5"
          EXPECTED_FULL37 = "62dd3c2f50fcaf6d58e47526df76aff41f2a4c2ec43c2a5724f7c23611af803f"
          EXPECTED_D006_HASHES = "edf21ed30ea4021a82118c8699f1a7470442bcee29155810772a09c4b24bc6dc"

          root = Path("evidence/t009-source")
          manifests = []
          for path in root.rglob("manifest.json"):
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              if isinstance(payload, dict):
                  manifests.append((path, payload))

          def manifest_by_id(artifact_id):
              matches = [
                  (path, payload)
                  for path, payload in manifests
                  if payload.get("artifact_id") == artifact_id
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"expected one manifest {artifact_id}, got {[str(p) for p,_ in matches]}"
                  )
              return matches[0][1]

          source = manifest_by_id("AE001-T009-SOURCE-MATERIALIZATION-v1")
          delivery = manifest_by_id("AE001-HISTORICAL-DELIVERY-FEATURES-v1")
          futures = manifest_by_id("AE001-HISTORICAL-STOCK-FUTURES-FEATURES-v1")

          action_matches = list(root.rglob("corporate-action-ledger.json.gz"))
          feature_matches = list(root.rglob("action-safe-feature-panel.json.gz"))
          if len(action_matches) != 1 or len(feature_matches) != 1:
              raise SystemExit(
                  f"expected one action ledger/panel, got action={action_matches} feature={feature_matches}"
              )
          action = json.loads(
              gzip.decompress(action_matches[0].read_bytes()).decode("utf-8")
          )
          action_safe = json.loads(
              gzip.decompress(feature_matches[0].read_bytes()).decode("utf-8")
          )

          checks = {
              "market_panel_sha256": (source["market_panel_sha256"], EXPECTED_MARKET),
              "action_safe_feature_panel_sha256": (
                  action_safe["panel_sha256"], EXPECTED_ACTION_SAFE
              ),
              "corporate_action_ledger_sha256": (
                  action["ledger_sha256"], EXPECTED_ACTION
              ),
              "delivery_augmented_feature_panel_sha256": (
                  delivery["augmented_feature_panel_sha256"], EXPECTED_DELIVERY
              ),
              "futures_panel_sha256": (
                  futures["futures_panel_sha256"], EXPECTED_FUTURES
              ),
              "base_37_feature_panel_sha256": (
                  source["base_37_feature_panel_sha256"], EXPECTED_FULL37
              ),
              "options_source_hashes_sha256": (
                  source["options_source_hashes_sha256"], EXPECTED_D006_HASHES
              ),
          }
          for label, (observed, expected) in checks.items():
              if observed != expected:
                  raise SystemExit(
                      f"T009 source reproduction mismatch {label}: {observed} != {expected}"
                  )

          if source["options_ready_session_count"] != 266:
              raise SystemExit("T009 options READY session count changed")
          if source["options_unavailable_session_count"] != 0:
              raise SystemExit("T009 options source has unavailable sessions")
          if source["options_parser_rejected_session_count"] != 0:
              raise SystemExit("T009 options source has parser-rejected sessions")
          if source["outcomes_opened"] is not False:
              raise SystemExit("T009 source stage opened outcomes")
          if source["model_fit_started"] is not False:
              raise SystemExit("T009 source stage started model fitting")

          ledger_path = Path("research/ae001/trial-ledger.json")
          ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
          validate_trial_ledger(ledger)
          require_unopened_registered_trial(
              ledger,
              trial_id="AE001-T009",
              required_status="FROZEN_BEFORE_OUTCOME_MATERIALIZATION",
          )
          state = trial_state(ledger, "AE001-T009")
          if any(
              event["payload"].get("protocol_id") == "AE001-T009-P1"
              for event in state["amendments"]
          ):
              raise SystemExit("AE001-T009-P1 already exists")

          payload = {
              "protocol_id": "AE001-T009-P1",
              "reason": (
                  "Freeze exact source/materialization hashes after source-only "
                  "T009 run and before any future-return label or model fit."
              ),
              "source_run_id": 36821482949,
              "source_artifact_name": "ae001-t009-source-36821482949",
              "market_panel_sha256": source["market_panel_sha256"],
              "action_safe_feature_panel_sha256": action_safe["panel_sha256"],
              "corporate_action_ledger_sha256": action["ledger_sha256"],
              "delivery_augmented_feature_panel_sha256": delivery[
                  "augmented_feature_panel_sha256"
              ],
              "futures_panel_sha256": futures["futures_panel_sha256"],
              "base_37_feature_panel_sha256": source[
                  "base_37_feature_panel_sha256"
              ],
              "options_panel_sha256": source["options_panel_sha256"],
              "options_source_hashes_sha256": source[
                  "options_source_hashes_sha256"
              ],
              "augmented_47_feature_panel_sha256": source[
                  "augmented_47_feature_panel_sha256"
              ],
              "options_ready_session_count": source[
                  "options_ready_session_count"
              ],
              "options_unavailable_session_count": source[
                  "options_unavailable_session_count"
              ],
              "options_parser_rejected_session_count": source[
                  "options_parser_rejected_session_count"
              ],
              "option_complete_feature_row_count": source[
                  "option_complete_feature_row_count"
              ],
              "option_complete_session_count": source[
                  "option_complete_session_count"
              ],
              "exclusion_counts": source["exclusion_counts"],
              "outcomes_opened_before_amendment": False,
              "model_fit_started_before_amendment": False,
              "historical_fo_publication_timestamp_verified": False,
              "live_capital_allowed": False,
          }

          recorded = datetime.now(UTC).isoformat()
          updated = append_trial_event(
              ledger,
              event_type="TRIAL_PROTOCOL_AMENDED",
              trial_id="AE001-T009",
              recorded_at_utc=recorded,
              payload=payload,
          )
          ledger_path.write_text(
              json.dumps(
                  updated,
                  indent=2,
                  sort_keys=True,
                  ensure_ascii=False,
                  allow_nan=False,
              )
              + "\n",
              encoding="utf-8",
          )

          payload_path = Path("research/ae001/t009-p1-payload.json")
          payload_path.parent.mkdir(parents=True, exist_ok=True)
          payload_path.write_text(
              json.dumps(
                  payload,
                  indent=2,
                  sort_keys=True,
                  ensure_ascii=False,
                  allow_nan=False,
              )
              + "\n",
              encoding="utf-8",
          )

          protocol_lines = [
              "# AE001 T009 Protocol Amendment P1: Frozen Source Materialization",
              "",
              "Frozen: 2026-10-01",
              "Status: FROZEN BEFORE OUTCOME MATERIALIZATION",
              "Live capital: DISABLED",
              "",
              "## Purpose",
              "",
              "Freeze the exact T009 source-only materialization from workflow run",
              "`36821482949` before any future-return label is opened or any T009 model is fit.",
              "",
              "## Reproduced upstream lineage",
              "",
              f"- market panel: `{source['market_panel_sha256']}`",
              f"- action-safe feature panel: `{action_safe['panel_sha256']}`",
              f"- corporate-action ledger: `{action['ledger_sha256']}`",
              f"- delivery 27-feature panel: `{delivery['augmented_feature_panel_sha256']}`",
              f"- futures source panel: `{futures['futures_panel_sha256']}`",
              f"- futures 37-feature panel: `{source['base_37_feature_panel_sha256']}`",
              "",
              "## New T009 source artifacts",
              "",
              f"- D006 FO source-hash chain: `{source['options_source_hashes_sha256']}`",
              f"- options panel: `{source['options_panel_sha256']}`",
              "- options-augmented 47-feature panel:",
              f"  `{source['augmented_47_feature_panel_sha256']}`",
              "",
              "## Coverage",
              "",
              f"- READY options sessions: {source['options_ready_session_count']}",
              f"- unavailable sessions: {source['options_unavailable_session_count']}",
              f"- parser-rejected sessions: {source['options_parser_rejected_session_count']}",
              f"- option-complete sessions: {source['option_complete_session_count']}",
              f"- option-complete stock/session rows: {source['option_complete_feature_row_count']}",
              "",
              "Exclusion counts:",
              "",
              "```json",
              json.dumps(source["exclusion_counts"], indent=2, sort_keys=True),
              "```",
              "",
              "## Outcome boundary",
              "",
              "The source-only run explicitly reports:",
              "",
              "- `outcomes_opened = false`",
              "- `model_fit_started = false`",
              "",
              "P1 changes no T009 feature, fold, horizon, ridge parameter or success criterion.",
              "",
              "Historical FO publication timing remains unverified. No prospective or",
              "live-capital claim.",
              "",
          ]
          protocol = "\n".join(protocol_lines)
          Path(
              "research/AE001_T009_PROTOCOL_AMENDMENT_P1_SOURCE_HASHES.md"
          ).write_text(protocol, encoding="utf-8")

          print(json.dumps({
              "t009_p1_event_sha256": updated["events"][-1]["event_sha256"],
              "trial_ledger_sha256": updated["ledger_sha256"],
              **payload,
          }, sort_keys=True))
          PY

      - name: Commit sealed P1 to branch
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add \
            research/AE001_T009_PROTOCOL_AMENDMENT_P1_SOURCE_HASHES.md \
            research/ae001/t009-p1-payload.json \
            research/ae001/trial-ledger.json
          git commit -m "research: seal T009 source hashes P1 [skip ci]"
          git push origin HEAD:feat/ae001-t009-stock-options-positioning-20261001
