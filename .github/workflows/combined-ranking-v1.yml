name: Combined ranking v1 H003 forward features

on:
  push:
    branches:
      - work/combined-ranking-v1-20260907
    paths:
      - scripts/build_combined_ranking_features.py
      - experiments/combined_ranking_v1/SPEC.md
      - .github/workflows/combined-ranking-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/combined-ranking-v1-20260907
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Fetch immutable H003 candidate provenance report
        run: |
          git fetch origin run/h003-e002-full-extraction-20260907 --depth=1
          git show FETCH_HEAD:research/prospective/h003/FY27-Q2-2026-09-06/candidates-e002-full/report.json > /tmp/h003-e002-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/h003-e002-report.json')
          d = json.loads(p.read_text())
          assert d['processed_source_count'] == 794
          assert d['candidate_count'] == 2692
          assert d['complete'] is True
          print({'sources': d['processed_source_count'], 'candidates': d['candidate_count'], 'report_sha256': d['report_sha256']})
          PY
      - name: Build company-level H003 forward evidence features
        run: |
          python scripts/build_combined_ranking_features.py \
            --candidate-report /tmp/h003-e002-report.json \
            --compiled-decisions-dir research/prospective/h003/FY27-Q2-2026-09-06/review-v001-r4/compiled-decisions \
            --universe research/prospective/universes/FY27-Q2-2026-09-06.json \
            --out-json research/derived/combined-ranking-v1/h003-forward-features.json \
            --out-csv research/derived/combined-ranking-v1/h003-forward-features.csv
      - name: Validate repository
        run: |
          python -m pytest -q
          git diff --check
      - name: Commit derived features
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/derived/combined-ranking-v1
          if git diff --cached --quiet; then
            echo 'features unchanged'
            exit 0
          fi
          git commit -m "Combined ranking v1: derive H003 forward evidence features"
          git push origin HEAD:work/combined-ranking-v1-20260907
