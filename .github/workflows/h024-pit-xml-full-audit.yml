name: H024 current PIT XML full audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/h024-insider-source-probe-v1-20260915
    paths:
      - '.github/workflows/h024-pit-xml-full-audit.yml'
      - 'src/marketlab/h024_insider.py'
      - 'tests/test_h024_insider.py'
      - 'scripts/audit_h024_pit_xml_full_corpus.py'
      - 'scripts/audit_h024_pit_xml_full_corpus_v2.py'

permissions:
  contents: write

concurrency:
  group: h024-pit-xml-full-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify strict parser and polite audit transport before source access
        run: |
          ruff check \
            src/marketlab/h024_insider.py \
            tests/test_h024_insider.py \
            scripts/audit_h024_pit_xml_full_corpus.py \
            scripts/audit_h024_pit_xml_full_corpus_v2.py
          pytest -q tests/test_h024_insider.py
      - name: Audit full current Regulation 7(2) XML corpus
        shell: bash
        run: |
          set -euo pipefail
          WORK="reports/h024-pit-xml-full-audit-v2/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$WORK/raw"
          set +e
          python scripts/audit_h024_pit_xml_full_corpus_v2.py \
            --from-date 2026-05-01 \
            --to-date 2026-09-15 \
            --out "$WORK/report.json" \
            --raw-dir "$WORK/raw" \
            --attempts 6 \
            --pause-seconds 0.85
          CODE=$?
          set -e
          echo "audit_exit_code=$CODE" >> "$GITHUB_ENV"
          echo "work_dir=$WORK" >> "$GITHUB_ENV"
      - name: Retain compact full-corpus audit
        shell: bash
        run: |
          set -euo pipefail
          test -f "$work_dir/report.json"
          mkdir -p research/probes/h024
          cp "$work_dir/report.json" \
            research/probes/h024/nse-pit-xml-full-corpus-audit-v2.json
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/probes/h024/nse-pit-xml-full-corpus-audit-v2.json
          if ! git diff --cached --quiet; then
            git commit -m "H024: anchor rate-limited PIT raw-XBRL corpus audit"
            git push origin HEAD:research/h024-insider-source-probe-v1-20260915
          fi
      - name: Upload exact full-corpus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h024-pit-xml-full-audit-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/h024-pit-xml-full-audit-v2
          if-no-files-found: error
          retention-days: 90
      - name: Enforce zero parser/source failures
        shell: bash
        run: exit "$audit_exit_code"
