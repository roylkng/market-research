name: EI001 D001 comparative-quarter XBRL audit

on:
  push:
    branches:
      - research/ei001-comparative-context-audit-20261004

permissions:
  contents: read

jobs:
  audit:
    if: contains(github.event.head_commit.message, '[ei001-d001]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate frozen EI001 audit before source access
        run: |
          ruff check \
            src/marketlab/ei001_context_audit.py \
            scripts/run_ei001_d001.py \
            tests/test_ei001_context_audit.py
          pytest -q tests/test_ei001_context_audit.py tests/test_fa001_schema_audit.py
      - name: Run frozen comparative-quarter audit
        run: |
          python scripts/run_ei001_d001.py \
            --sample research/fa001/fa001-d001-sample-v1.json \
            --raw-dir reports/ei001-d001/raw \
            --output reports/ei001-d001 \
            --attempts 4 \
            --timeout-seconds 25 \
            --pause-seconds 0.03
      - name: Prove source-only audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/ei001-d001/ei001-d001-audit.json").read_text())
          assert p["audit_id"]=="EI001-D001-v1"
          assert p["sample_count"]==48
          assert p["return_outcomes_opened"] is False
          assert p["model_fitted"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          print(json.dumps({
            "audit_sha256":p["audit_sha256"],
            "usable_current_xbrl_count":p["usable_current_xbrl_count"],
            "comparable_family_counts":p["comparable_family_counts"],
            "comparable_revenue_pat_count":p["comparable_revenue_pat_count"],
            "comparable_revenue_pat_pbt_count":p["comparable_revenue_pat_pbt_count"],
            "threshold_passes":p["threshold_passes"],
            "feasibility_pass":p["feasibility_pass"],
          },indent=2,sort_keys=True))
          PY
      - name: Upload exact EI001 D001 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ei001-d001-${{ github.run_id }}
          path: reports/ei001-d001
          if-no-files-found: warn
          retention-days: 90
