name: H022 freeze historical feature panel

on:
  push:
    branches:
      - research/h022-management-information-delta-v1-20260913
    paths:
      - .github/workflows/h022-freeze-feature-panel.yml

permissions:
  contents: write

concurrency:
  group: h022-freeze-feature-panel-v1
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_COMMIT: 2682d91a2be0dc3b69876ef397791515ff9146f2
      SOURCE_PATH: research/prospective/h003/FY27-Q2-2026-09-06/candidates-e002-full-sharded/report.json
      SOURCE_FILE_SHA256: 6bb15c4608e1198698ea9417d132f9392f9df343c9c5190c2ef6fe2c6e689c5c
      OUT_DIR: research/historical/h022/management-information-delta-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h022-management-information-delta-v1-20260913
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Download exact pinned candidate report
        run: |
          URL="https://raw.githubusercontent.com/roylkng/market-research/${SOURCE_COMMIT}/${SOURCE_PATH}"
          curl --fail --location --retry 3 --retry-all-errors "$URL" -o /tmp/h003-e002-report.json
          echo "${SOURCE_FILE_SHA256}  /tmp/h003-e002-report.json" | sha256sum -c -

      - name: Build outcome-free H022 feature panel
        run: |
          mkdir -p "$OUT_DIR"
          python scripts/build_h022_features.py \
            --candidate-report /tmp/h003-e002-report.json \
            --out "$OUT_DIR/feature-panel.json" \
            --summary-out "$OUT_DIR/summary.json"
          python - <<'PY'
          import json
          from pathlib import Path
          panel = json.loads(Path('research/historical/h022/management-information-delta-v1/feature-panel.json').read_text())
          summary = json.loads(Path('research/historical/h022/management-information-delta-v1/summary.json').read_text())
          if panel.get('outcome_data_attached') is not False:
              raise SystemExit('H022 feature panel unexpectedly contains outcome data')
          if panel.get('panel_sha256') != summary.get('panel_sha256'):
              raise SystemExit('H022 panel/summary digest mismatch')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Anchor freeze provenance
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path
          out = Path(os.environ['OUT_DIR'])
          summary = json.loads((out / 'summary.json').read_text())
          metadata = {
              'schema_version': 1,
              'hypothesis_id': 'H022',
              'feature_rule_id': 'H022-R001',
              'source_commit': os.environ['SOURCE_COMMIT'],
              'source_path': os.environ['SOURCE_PATH'],
              'source_file_sha256': os.environ['SOURCE_FILE_SHA256'],
              'source_report_sha256': summary['source_report_sha256'],
              'panel_sha256': summary['panel_sha256'],
              'record_count': summary['record_count'],
              'signal_count': summary['signal_count'],
              'design_signal_count': summary['design_signal_count'],
              'challenge_signal_count': summary['challenge_signal_count'],
              'outcome_data_attached': False,
              'universe_bias': summary['universe_bias'],
              'frozen_at_utc': datetime.now(UTC).isoformat().replace('+00:00', 'Z'),
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
          }
          (out / 'freeze-metadata.json').write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Commit frozen feature panel
        run: |
          git config user.name 'marketlab-research-bot'
          git config user.email 'marketlab-research-bot@users.noreply.github.com'
          git add "$OUT_DIR"
          git commit -m 'H022: freeze outcome-free historical feature panel'
          git push origin HEAD:research/h022-management-information-delta-v1-20260913
