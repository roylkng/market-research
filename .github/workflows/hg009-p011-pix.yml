name: HG009 P011 PIX source-byte symmetric earnings audit
on:
  push:
    branches:
      - research/hg009-p011-pix-symmetric-profit-20261015
    paths:
      - .github/workflows/hg009-p011-pix.yml
      - src/marketlab/hg009_p011_pix_income.py
      - scripts/materialize_hg009_p011_pix.py
      - tests/test_hg009_p011_pix.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hg009-p011-signed-source-pix
  cancel-in-progress: false

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify source row provenance and normalized INR units
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_hg009_p011_pix.py
          python scripts/materialize_hg009_p011_pix.py --check
          ruff check src/marketlab/hg009_p011_pix_income.py scripts/materialize_hg009_p011_pix.py tests/test_hg009_p011_pix.py
          pytest -q tests/test_hg009_p011_pix.py
      - name: Seal archived original-earnings report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/hg009/hg009-p011-pix-symmetric-quarter-profit-v1.json
          if git diff --cached --quiet; then
            echo "P011 original source report already sealed"
            exit 0
          fi
          git commit -m "HG009 P011: seal original source PIX like-for-like pretax income [skip ci]"
          git fetch origin research/hg009-p011-pix-symmetric-profit-20261015
          git rebase origin/research/hg009-p011-pix-symmetric-profit-20261015
          python scripts/materialize_hg009_p011_pix.py --check
          git push origin HEAD:research/hg009-p011-pix-symmetric-profit-20261015
