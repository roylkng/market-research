name: H003-E002 precision fix once

on:
  push:
    branches:
      - feat/h003-claim-candidates-v1
    paths:
      - .github/workflows/h003e002-precision-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/h003-claim-candidates-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/h003e002_patch_once.py
      - run: ruff check src tests --fix
      - run: ruff check src tests
      - run: pytest -q
      - run: make validate
      - name: Commit E002 and remove one-shot patch machinery
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git rm .github/workflows/h003e002-precision-fix.yml scripts/h003e002_patch_once.py
          git add src tests registry/h003_extraction_rule.yaml registry/h003_extraction_rule_v1.yaml
          git commit -m "Freeze precision-corrected H003-E002 claim candidate rule"
          git push origin HEAD:feat/h003-claim-candidates-v1
