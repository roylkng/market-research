name: H003-V001 correct batch 0004 judgments

on:
  push:
    branches:
      - run/h003-v001-blind-review-20260907
    paths:
      - .github/workflows/h003-v001-fix-batch0004.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/h003-v001-blind-review-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch only the two full-context corrections
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('research/prospective/h003/FY27-Q2-2026-09-06/review-v001/semantic-judgments/batch-0004.json')
          doc = json.loads(path.read_text(encoding='utf-8'))
          by_id = {item['candidate_id']: item for item in doc['judgments']}
          if len(by_id) != 20:
              raise SystemExit(f'expected 20 unique judgments, found {len(by_id)}')

          margin_id = '89009405124d2ac8c4c8f8a2085c41a63da7b081a23af89db565863c880b64bd'
          fsa_id = '4a12c4a0feb089130b4b9bc5aa56c2112468d76f688f11868dd5011c7a5d7998'
          for candidate_id in (margin_id, fsa_id):
              if candidate_id not in by_id:
                  raise SystemExit(f'missing expected candidate {candidate_id}')

          by_id[margin_id].update({
              'disposition': 'ACCEPTED',
              'reason_code': 'ACCEPT_MEASURABLE_MANAGEMENT_COMMITMENT',
              'note': 'Full redacted context states 125 to 150 basis points of margin expansion year-on-year for the next three years.',
              'duplicate_of_candidate_id': None,
              'normalized_claim': {
                  'claim_type': 'MARGIN_EXPANSION_TARGET',
                  'metric': 'non_imfl_margin_expansion_yoy',
                  'unit': 'basis points per year',
                  'target_min': 125.0,
                  'target_max': 150.0,
                  'target_deadline': None,
                  'target_horizon': 'each year for the next three years',
                  'normalized_claim': 'Expand non-IMFL margin by 125 to 150 basis points year-on-year for the next three years.'
              }
          })
          by_id[fsa_id].update({
              'disposition': 'ACCEPTED',
              'reason_code': 'ACCEPT_MEASURABLE_MANAGEMENT_COMMITMENT',
              'note': 'Full redacted context identifies around 3 million tons annually as the FSA-sourced portion of the coal requirement.',
              'duplicate_of_candidate_id': None,
              'normalized_claim': {
                  'claim_type': 'PROCUREMENT_VOLUME',
                  'metric': 'fsa_coal_procurement',
                  'unit': 'million tons',
                  'target_min': 3.0,
                  'target_max': 3.0,
                  'target_deadline': None,
                  'target_horizon': 'annually',
                  'normalized_claim': 'Source around 3 million tons of coal annually through the FSA.'
              }
          })
          path.write_text(json.dumps(doc, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Commit correction and remove one-shot workflow
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git rm .github/workflows/h003-v001-fix-batch0004.yml
          git add research/prospective/h003/FY27-Q2-2026-09-06/review-v001/semantic-judgments/batch-0004.json
          git commit -m "Correct H003-V001 batch 0004 full-context judgments"
          git push origin HEAD:run/h003-v001-blind-review-20260907
