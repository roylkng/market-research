name: Temporary H021 P007 research accounting refresh

on:
  push:
    branches:
      - research/h021-p007-eps-sign-audit-20261010
    paths:
      - research/rta001-trials-v1.json

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h021-p007-eps-sign-audit-20261010
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Rebuild and verify global accounting
        run: |
          python scripts/build_rta001_summary.py \
            --manifest research/rta001-trials-v1.json \
            --output research/rta001-summary-v1.json \
            --repo-root .
          python scripts/validate_rta001_coverage.py --repo-root .
      - name: Commit deterministic summary only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/rta001-summary-v1.json
          if git diff --cached --quiet; then
            echo "RTA001 already up to date"
            exit 0
          fi
          git commit -m "H021 P007: refresh global trial accounting [skip ci]"
          git push origin HEAD:research/h021-p007-eps-sign-audit-20261010
