name: H023 XBRL XML fact inventory

on:
  workflow_dispatch:
  push:
    branches:
      - research/h023-ownership-source-probe-v1-20260914
    paths:
      - '.github/workflows/h023-xbrl-xml-fact-inventory.yml'
      - 'scripts/probe_h023_xbrl_fact_inventory.py'

permissions:
  contents: write

concurrency:
  group: h023-xbrl-xml-fact-inventory
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint diagnostic
        run: ruff check scripts/probe_h023_xbrl_fact_inventory.py
      - name: Inventory current official XBRL facts
        run: |
          python scripts/probe_h023_xbrl_fact_inventory.py \
            --out research/probes/h023/xbrl-xml-fact-inventory-v1.json \
            --symbols RELIANCE INFY ABB \
            --filings-per-symbol 2 \
            --attempts 4
      - name: Anchor source-only diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/probes/h023/xbrl-xml-fact-inventory-v1.json
          if ! git diff --cached --quiet; then
            git commit -m "H023: anchor XBRL XML fact inventory [skip ci]"
            git push origin HEAD:research/h023-ownership-source-probe-v1-20260914
          fi
