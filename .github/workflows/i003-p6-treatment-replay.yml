name: I003 P6 treatment replay

on:
  push:
    branches:
      - feat/po001-v2-stock-impact-20260929

permissions:
  contents: read
  actions: read

jobs:
  replay:
    if: contains(github.event.head_commit.message, '[i003-p6-replay]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Download exact reproduced P5 upstream evidence
        uses: actions/download-artifact@v4
        with:
          name: po001-i003-36607668145
          path: evidence/p5
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: roylkng/market-research
          run-id: 36607668145

      - name: Run frozen P6 treatment only
        run: |
          set -euo pipefail
          ROOT="evidence/p5/reports/po001-i003"
          python scripts/run_po001_i003.py \
            --market-panel "$ROOT/panel/market-panel.json.gz" \
            --feature-panel "$ROOT/delivery/delivery-feature-panel.json.gz" \
            --action-ledger "$ROOT/action-safe/corporate-action-ledger.json.gz" \
            --risk-state research/po001-i003/inputs/i002-risk-state-legacy.json.gz \
            --risk-state-manifest research/po001-i003/inputs/i002-risk-state-legacy-manifest.json \
            --canonical-risk-state "$ROOT/risk/risk-state.json.gz" \
            --alpha-model research/po001-i003/inputs/i002-alpha-model-v1.json \
            --alpha-model-manifest research/po001-i003/inputs/i002-alpha-model-v1-manifest.json \
            --control-artifact research/po001-i003/inputs/i002-integrated-control-v1.json.gz \
            --control-manifest research/po001-i003/inputs/i002-integrated-control-v1-manifest.json \
            --output reports/i003-p6-replay

      - name: Print result
        run: cat reports/i003-p6-replay/summary.json

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i003-p6-replay-${{ github.run_id }}
          path: reports/i003-p6-replay
          if-no-files-found: warn
          retention-days: 90
