name: H005 finalize initialized source recovery
on:
  push:
    branches: [research/h005-result-repricing-ranker-v1-20260908]
    paths: [.github/workflows/h005-finalize-sources.yml]
permissions:
  contents: read
  actions: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          name: h005-native-restoration-delta
          run-id: 34215580937
          github-token: ${{ github.token }}
          path: /tmp/h005-final
      - name: Preserve base raw-file identities
        run: find /tmp/h005-final/raw -type f -printf '%f\n' | sort > /tmp/h005-final-base.txt
      - name: Recover original public filings
        run: python scripts/finalize_h005_sources.py --root /tmp/h005-final
      - name: Package content-addressed recovery delta
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,shutil
          root=pathlib.Path('/tmp/h005-final')
          out=pathlib.Path('/tmp/h005-initialized-delta')
          (out/'raw').mkdir(parents=True,exist_ok=True)
          base=set(pathlib.Path('/tmp/h005-final-base.txt').read_text().splitlines())
          for src in (root/'raw').glob('*'):
              if src.name not in base:
                  shutil.copy2(src,out/'raw'/src.name)
          for pattern in ('*-v4.json','initialized-source-*.json'):
              for src in root.glob(pattern):
                  shutil.copy2(src,out/src.name)
          shutil.copy2('scripts/finalize_h005_sources.py',out/'finalize-source.py')
          files={str(p.relative_to(out)):hashlib.sha256(p.read_bytes()).hexdigest() for p in out.rglob('*') if p.is_file()}
          manifest={'source_head':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'base_artifact_ids':[10051043682,10051326136,10051686129],'files':files,'live_capital_allowed':False}
          (out/'initialized-delta-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h005-initialized-source-delta
          path: /tmp/h005-initialized-delta
          retention-days: 30
