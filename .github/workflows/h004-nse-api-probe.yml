name: H004 NSE API probe

on:
  push:
    branches:
      - research/h004-pre-momentum-v1-20260908
    paths:
      - .github/workflows/h004-nse-api-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Inspect legacy and integrated XBRL facts
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from marketlab.nse import NSEClient

          client = NSEClient(timeout=20, attempts=4)
          urls = {
            'legacy_q1_fy25': 'https://nsearchives.nseindia.com/corporate/xbrl/INDAS_112416_1227245_14082024083735.xml',
            'integrated_q1_fy27': 'https://nsearchives.nseindia.com/corporate/xbrl/INDAS_168634_1588632_07082026064009.xml',
          }
          wanted = ('revenue','profit','finance','depreciation','exception','otherincome','rounding','symbol','period')
          for label, url in urls.items():
              raw = client.archive_bytes(url)
              root = ET.fromstring(raw)
              print('===', label, len(raw), '===')
              contexts = []
              for elem in root.iter():
                  tag = elem.tag.rsplit('}',1)[-1]
                  text = (elem.text or '').strip()
                  if tag == 'context':
                      contexts.append(elem.attrib.get('id'))
                  if text and any(k in tag.lower() for k in wanted):
                      print(tag, elem.attrib.get('contextRef'), elem.attrib.get('unitRef'), text[:500])
              print('CONTEXTS', contexts[:100], 'count', len(contexts))
          PY
