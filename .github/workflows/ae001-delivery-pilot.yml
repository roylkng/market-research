name: AE001 delivery incremental pilot

on:
  push:
    branches:
      - feat/ae001-delivery-flow-features-20260927

permissions:
  contents: read

jobs:
  pilot:
    if: contains(github.event.head_commit.message, '[ae001-delivery-pilot]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify T003 implementation before source access
        run: |
          ruff check \
            src/marketlab/alpha.py \
            src/marketlab/alpha_trials.py \
            src/marketlab/alpha_delivery.py \
            src/marketlab/alpha_delivery_trial.py \
            src/marketlab/alpha_multihorizon.py \
            scripts/build_ae001_delivery_panel.py \
            scripts/run_ae001_delivery_trial.py
          pytest -q \
            tests/test_alpha_trials.py \
            tests/test_alpha_delivery.py \
            tests/test_alpha_delivery_trial.py \
            tests/test_alpha_multihorizon.py

      - name: Rebuild fixed official NSE market panel
        run: |
          python scripts/build_ae001_historical_panel.py \
            --start-date 2025-09-01 \
            --end-date 2026-09-25 \
            --store .marketlab/ae001-delivery-pilot \
            --output reports/ae001-delivery-pilot/panel \
            --attempts 4 \
            --timeout-seconds 30 \
            --pause-seconds 0.05

      - name: Rebuild corporate-action-safe base features
        run: |
          python scripts/build_ae001_action_safe_panel.py \
            --market-panel reports/ae001-delivery-pilot/panel/market-panel.json.gz \
            --feature-panel reports/ae001-delivery-pilot/panel/feature-panel.json.gz \
            --start-date 2025-09-01 \
            --end-date 2026-09-25 \
            --raw-dir reports/ae001-delivery-pilot/corporate-actions/raw \
            --output reports/ae001-delivery-pilot/action-safe \
            --chunk-days 31 \
            --attempts 4 \
            --timeout-seconds 30

      - name: Acquire NSE delivery evidence and build augmented features
        run: |
          python scripts/build_ae001_delivery_panel.py \
            --market-panel reports/ae001-delivery-pilot/panel/market-panel.json.gz \
            --feature-panel reports/ae001-delivery-pilot/action-safe/action-safe-feature-panel.json.gz \
            --trial-ledger research/ae001/trial-ledger.json \
            --store .marketlab/ae001-delivery-pilot \
            --output reports/ae001-delivery-pilot/delivery \
            --attempts 4 \
            --timeout-seconds 30

      - name: Run frozen T003 incremental comparison
        run: |
          python scripts/run_ae001_delivery_trial.py \
            --market-panel reports/ae001-delivery-pilot/panel/market-panel.json.gz \
            --feature-panel reports/ae001-delivery-pilot/delivery/delivery-feature-panel.json.gz \
            --action-ledger reports/ae001-delivery-pilot/action-safe/corporate-action-ledger.json.gz \
            --trial-ledger research/ae001/trial-ledger.json \
            --output reports/ae001-delivery-pilot/trial

      - name: Print compact result
        run: |
          cat reports/ae001-delivery-pilot/delivery/manifest.json
          cat reports/ae001-delivery-pilot/trial/summary.json

      - name: Upload exact T003 development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae001-delivery-pilot-${{ github.run_id }}
          path: |
            reports/ae001-delivery-pilot
            .marketlab/ae001-delivery-pilot/market-data
          if-no-files-found: warn
          retention-days: 90
