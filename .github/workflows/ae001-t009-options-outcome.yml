name: AE001 T009 stock-options incremental trial

on:
  push:
    branches:
      - feat/ae001-t009-stock-options-positioning-20261001

permissions:
  contents: read

jobs:
  pilot:
    if: contains(github.event.head_commit.message, '[t009-outcome]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify T009 implementation and frozen P1 before source access
        run: |
          ruff check \
            src/marketlab/alpha_options.py \
            src/marketlab/alpha_options_trial.py \
            scripts/build_ae001_options_features.py \
            scripts/run_ae001_t009.py \
            tests/test_alpha_options.py \
            tests/test_alpha_options_trial.py
          pytest -q \
            tests/test_alpha_options_source.py \
            tests/test_alpha_options_source_d006.py \
            tests/test_alpha_options.py \
            tests/test_alpha_options_trial.py \
            tests/test_alpha_multihorizon.py
          python - <<'PY'
          import json
          from marketlab.alpha_trials import (
              require_protocol_amendment,
              require_unopened_registered_trial,
              validate_trial_ledger,
          )

          ledger = json.load(open("research/ae001/trial-ledger.json"))
          validate_trial_ledger(ledger)
          require_unopened_registered_trial(
              ledger,
              trial_id="AE001-T009",
              required_status="FROZEN_BEFORE_OUTCOME_MATERIALIZATION",
          )
          require_protocol_amendment(
              ledger,
              trial_id="AE001-T009",
              protocol_id="AE001-T009-P1",
          )
          print("T009 registration + P1 source hashes: READY")
          PY

      - name: Rebuild frozen official NSE market panel
        run: |
          python scripts/build_ae001_historical_panel.py \
            --start-date 2025-09-01 \
            --end-date 2026-09-25 \
            --store .marketlab/ae001-t009-outcome \
            --output reports/ae001-t009-outcome/panel \
            --attempts 4 \
            --timeout-seconds 30 \
            --pause-seconds 0.05

      - name: Rebuild corporate-action-safe base features
        run: |
          python scripts/build_ae001_action_safe_panel.py \
            --market-panel reports/ae001-t009-outcome/panel/market-panel.json.gz \
            --feature-panel reports/ae001-t009-outcome/panel/feature-panel.json.gz \
            --start-date 2025-09-01 \
            --end-date 2026-09-25 \
            --raw-dir reports/ae001-t009-outcome/corporate-actions/raw \
            --output reports/ae001-t009-outcome/action-safe \
            --chunk-days 31 \
            --attempts 4 \
            --timeout-seconds 30

      - name: Rebuild delivery features
        run: |
          python scripts/build_ae001_delivery_features.py \
            --market-panel reports/ae001-t009-outcome/panel/market-panel.json.gz \
            --feature-panel reports/ae001-t009-outcome/action-safe/action-safe-feature-panel.json.gz \
            --store .marketlab/ae001-t009-outcome \
            --output reports/ae001-t009-outcome/delivery \
            --attempts 4 \
            --timeout-seconds 30

      - name: Rebuild frozen T005 futures 37-feature panel
        run: |
          python scripts/build_ae001_futures_features.py \
            --market-panel reports/ae001-t009-outcome/panel/market-panel.json.gz \
            --feature-panel reports/ae001-t009-outcome/delivery/delivery-feature-panel.json.gz \
            --store .marketlab/ae001-t009-outcome \
            --output reports/ae001-t009-outcome/futures \
            --attempts 4 \
            --timeout-seconds 30

      - name: Rebuild P1-frozen options 47-feature panel
        run: |
          python scripts/build_ae001_options_features.py \
            --market-panel reports/ae001-t009-outcome/panel/market-panel.json.gz \
            --feature-panel reports/ae001-t009-outcome/futures/futures-feature-panel.json.gz \
            --store .marketlab/ae001-t009-outcome \
            --output reports/ae001-t009-outcome/options \
            --attempts 4 \
            --timeout-seconds 30

      - name: Run frozen T009 comparison
        run: |
          python scripts/run_ae001_t009.py \
            --market-panel reports/ae001-t009-outcome/panel/market-panel.json.gz \
            --feature-panel reports/ae001-t009-outcome/options/options-feature-panel.json.gz \
            --action-ledger reports/ae001-t009-outcome/action-safe/corporate-action-ledger.json.gz \
            --trial-ledger research/ae001/trial-ledger.json \
            --output reports/ae001-t009-outcome/study

      - name: Print compact T009 result
        run: |
          cat reports/ae001-t009-outcome/options/manifest.json
          cat reports/ae001-t009-outcome/study/summary.json

      - name: Upload exact T009 development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae001-t009-${{ github.run_id }}
          path: |
            reports/ae001-t009-outcome
            .marketlab/ae001-t009-outcome/market-data
          if-no-files-found: warn
          retention-days: 90
