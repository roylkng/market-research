name: RM001 C002 prospective variance calibration

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - AE001 SC001 prospective source timing
    types:
      - completed
  schedule:
    # Same-session evening fallback: 19:30 IST.
    - cron: '0 14 * * 1-5'
    # Next-calendar-morning fallbacks: 08:00 and 08:30 IST, Tue-Sat.
    - cron: '30 2 * * 2-6'
    - cron: '0 3 * * 2-6'

permissions:
  contents: write

concurrency:
  group: rm001-c002-prospective-calibration
  cancel-in-progress: false

jobs:
  advance:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh latest canonical main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach origin/main
          echo "C002_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify frozen C002 implementation
        run: |
          ruff check \
            src/marketlab/rm001_calibration.py \
            src/marketlab/rm001_c002.py \
            scripts/build_rm001_c002_forecast.py \
            scripts/advance_rm001_c002_outcomes.py \
            scripts/verify_rm001_c002.py \
            tests/test_rm001_calibration.py \
            tests/test_rm001_c002.py
          pytest -q \
            tests/test_rm001_calibration.py \
            tests/test_rm001_c002.py \
            tests/test_rm001.py \
            tests/test_alpha_prospective_sources.py
          python scripts/verify_rm001_c002.py \
            --forecast-ledger research/prospective/rm001-c002/forecast-ledger.json \
            --outcome-ledger research/prospective/rm001-c002/outcome-ledger.json \
            --summary research/prospective/rm001-c002/prospective-summary.json

      - name: Resolve frozen start boundary
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=Asia/Kolkata date +%F)"
          if [[ "$TODAY" < "2026-10-05" ]]; then
            STATE="BEFORE_START"
          else
            STATE="READY"
          fi
          echo "date=$TODAY" >> "$GITHUB_OUTPUT"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "C002 gate: date=$TODAY event=$GITHUB_EVENT_NAME state=$STATE"

      - name: Advance prior C002 outcome when next-session source is available
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          WORK="reports/rm001-c002/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}/outcome"
          mkdir -p "$WORK"
          python scripts/advance_rm001_c002_outcomes.py \
            --sc001-ledger research/prospective/ae001-sc001/source-ledger.json \
            --forecast-ledger research/prospective/rm001-c002/forecast-ledger.json \
            --outcome-ledger research/prospective/rm001-c002/outcome-ledger.json \
            --outcome-dir research/prospective/rm001-c002/outcomes \
            --summary research/prospective/rm001-c002/prospective-summary.json \
            --work-dir "$WORK" \
            --attempts 4 \
            --timeout-seconds 30 | tee "$WORK/run.log"

      - name: Seal current C002 raw-v1 and CAL1 forecast
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          WORK="reports/rm001-c002/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}/forecast"
          mkdir -p "$WORK"
          python scripts/build_rm001_c002_forecast.py \
            --sc001-ledger research/prospective/ae001-sc001/source-ledger.json \
            --forecast-ledger research/prospective/rm001-c002/forecast-ledger.json \
            --forecast-dir research/prospective/rm001-c002/forecasts \
            --state-dir research/prospective/rm001-c002/states \
            --work-dir "$WORK" \
            --attempts 4 \
            --timeout-seconds 30 | tee "$WORK/run.log"

      - name: Verify post-run canonical C002 state
        if: steps.gate.outputs.state == 'READY'
        run: |
          python scripts/verify_rm001_c002.py \
            --forecast-ledger research/prospective/rm001-c002/forecast-ledger.json \
            --outcome-ledger research/prospective/rm001-c002/outcome-ledger.json \
            --summary research/prospective/rm001-c002/prospective-summary.json

      - name: Anchor append-only C002 evidence
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_rm001_c002.py \
            --forecast-ledger research/prospective/rm001-c002/forecast-ledger.json \
            --outcome-ledger research/prospective/rm001-c002/outcome-ledger.json \
            --summary research/prospective/rm001-c002/prospective-summary.json

          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/prospective/rm001-c002
          if git diff --cached --quiet; then
            echo "No new C002 canonical evidence to anchor"
            exit 0
          fi

          START_SHA="$C002_BASE_SHA"
          git commit -m "RM001 C002: seal prospective calibration evidence ${{ steps.gate.outputs.date }} [skip ci]"

          CRITICAL_PATHS=(
            ".github/workflows/rm001-c002-prospective-calibration.yml"
            "registry/rm001_c002_variance_calibration.yaml"
            "research/RM001_C002_PROSPECTIVE_VARIANCE_CALIBRATION_V1.md"
            "research/prospective/ae001-sc001"
            "research/prospective/rm001-c002"
            "src/marketlab/rm001.py"
            "src/marketlab/rm001_calibration.py"
            "src/marketlab/rm001_c002.py"
            "scripts/build_rm001_c002_forecast.py"
            "scripts/advance_rm001_c002_outcomes.py"
            "scripts/verify_rm001_c002.py"
          )

          for ATTEMPT in 1 2 3; do
            git fetch origin main
            CURRENT_MAIN="$(git rev-parse origin/main)"
            if [ "$START_SHA" != "$CURRENT_MAIN" ]; then
              if ! git diff --quiet "$START_SHA" "$CURRENT_MAIN" -- "${CRITICAL_PATHS[@]}"; then
                echo "C002 rules or causal source state changed while run was in flight"
                git diff --stat "$START_SHA" "$CURRENT_MAIN" -- "${CRITICAL_PATHS[@]}"
                exit 1
              fi
              git rebase origin/main
              python scripts/verify_rm001_c002.py \
                --forecast-ledger research/prospective/rm001-c002/forecast-ledger.json \
                --outcome-ledger research/prospective/rm001-c002/outcome-ledger.json \
                --summary research/prospective/rm001-c002/prospective-summary.json
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((ATTEMPT * 2))
          done
          echo "Unable to anchor C002 evidence after bounded retries"
          exit 1

      - name: Upload C002 prospective support evidence
        if: always() && steps.gate.outputs.state == 'READY'
        uses: actions/upload-artifact@v4
        with:
          name: rm001-c002-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/rm001-c002
          if-no-files-found: warn
          retention-days: 90

      - name: Report pre-start state
        if: steps.gate.outputs.state != 'READY'
        run: echo "C002 prospective validation begins with decision sessions on or after 2026-10-05"
