name: I003 RM001 equivalence diagnostic

on:
  push:
    branches:
      - feat/po001-v2-stock-impact-20260929

permissions:
  contents: read
  actions: read

jobs:
  compare:
    if: contains(github.event.head_commit.message, '[i003-rm001-equivalence]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download sealed I002 evidence
        uses: actions/download-artifact@v4
        with:
          name: po001-i002-36570866823
          path: evidence/i002
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: roylkng/market-research
          run-id: 36570866823

      - name: Download failed I003 evidence
        uses: actions/download-artifact@v4
        with:
          name: po001-i003-36575345889
          path: evidence/i003
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: roylkng/market-research
          run-id: 36575345889

      - name: Compare RM001 economic state
        run: |
          python - <<'PY'
          import gzip
          import json
          import math
          from pathlib import Path

          def locate_i002(root):
              matches = sorted(Path(root).rglob("risk-state.json.gz"))
              if len(matches) != 2:
                  raise SystemExit(f"expected two I002 risk states under {root}, got {matches}")
              left_bytes = matches[0].read_bytes()
              right_bytes = matches[1].read_bytes()
              if left_bytes != right_bytes:
                  raise SystemExit("sealed I002 risk-a and risk-b are not byte-identical")
              return matches[0]

          def locate_i003(root):
              matches = list(Path(root).rglob("risk-state.json.gz"))
              if len(matches) != 1:
                  raise SystemExit(f"expected one I003 risk state under {root}, got {matches}")
              return matches[0]

          def load(path):
              return json.loads(gzip.decompress(path.read_bytes()).decode("utf-8"))

          old_path = locate_i002("evidence/i002")
          new_path = locate_i003("evidence/i003")
          old = load(old_path)
          new = load(new_path)

          print("OLD_PATH", old_path)
          print("NEW_PATH", new_path)
          print("OLD_SHA", old["state_sha256"])
          print("NEW_SHA", new["state_sha256"])

          invariant_fields = [
              "model_id",
              "as_of_session",
              "factor_names",
              "factor_covariance_window",
              "factor_covariance_first_realized_session",
              "factor_covariance_last_realized_session",
              "idiosyncratic_window",
              "minimum_idiosyncratic_observations",
              "security_count",
              "deferred_factors",
          ]
          for field in invariant_fields:
              if old[field] != new[field]:
                  raise SystemExit(
                      f"semantic invariant differs: {field}: {old[field]} != {new[field]}"
                  )

          old_rows = {(r["symbol"], r["isin"]): r for r in old["rows"]}
          new_rows = {(r["symbol"], r["isin"]): r for r in new["rows"]}
          if old_rows.keys() != new_rows.keys():
              missing_old = sorted(new_rows.keys() - old_rows.keys())[:10]
              missing_new = sorted(old_rows.keys() - new_rows.keys())[:10]
              raise SystemExit(
                  f"identity set differs new_only={missing_old} old_only={missing_new}"
              )

          max_exposure = 0.0
          max_idio = 0.0
          status_diff = 0
          for identity in sorted(old_rows):
              left = old_rows[identity]
              right = new_rows[identity]
              for factor in old["factor_names"]:
                  max_exposure = max(
                      max_exposure,
                      abs(
                          float(left["exposures"][factor])
                          - float(right["exposures"][factor])
                      ),
                  )
              max_idio = max(
                  max_idio,
                  abs(
                      float(left["idiosyncratic_variance_daily"])
                      - float(right["idiosyncratic_variance_daily"])
                  ),
              )
              status_diff += (
                  left["idiosyncratic_status"]
                  != right["idiosyncratic_status"]
              )

          max_cov = 0.0
          for old_row, new_row in zip(
              old["factor_covariance_daily"],
              new["factor_covariance_daily"],
              strict=True,
          ):
              for left, right in zip(old_row, new_row, strict=True):
                  max_cov = max(max_cov, abs(float(left) - float(right)))

          fallback_diff = abs(
              float(old["idiosyncratic_fallback_p75"])
              - float(new["idiosyncratic_fallback_p75"])
          )

          print("MAX_EXPOSURE_ABS_DIFF", repr(max_exposure))
          print("MAX_COVARIANCE_ABS_DIFF", repr(max_cov))
          print("MAX_IDIO_VARIANCE_ABS_DIFF", repr(max_idio))
          print("FALLBACK_ABS_DIFF", repr(fallback_diff))
          print("IDIO_STATUS_DIFF_COUNT", status_diff)

          tolerance = 5e-15
          if max_exposure > tolerance:
              raise SystemExit("exposure difference exceeds canonicalization tolerance")
          if max_cov > tolerance:
              raise SystemExit("covariance difference exceeds canonicalization tolerance")
          if max_idio > tolerance:
              raise SystemExit("idio difference exceeds canonicalization tolerance")
          if fallback_diff > tolerance:
              raise SystemExit("fallback difference exceeds canonicalization tolerance")
          if status_diff:
              raise SystemExit("idiosyncratic status assignments differ")

          print("ECONOMIC_EQUIVALENCE", True)
          print("CANONICALIZATION_TOLERANCE", tolerance)
          PY
