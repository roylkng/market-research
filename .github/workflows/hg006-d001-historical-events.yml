name: HG006 D001 historical discrete-event source census

on:
  push:
    branches:
      - research/hg006-historical-event-base-rates-20261005

permissions:
  contents: read
  actions: read

jobs:
  shard:
    if: contains(github.event.head_commit.message, '[hg006-d001-sharded]')
    strategy:
      fail-fast: false
      matrix:
        shard_id: [H2023, H2024, H2025, H2026]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate frozen implementation before source access
        run: |
          ruff check \
            src/marketlab/hg006_historical_events.py \
            src/marketlab/hg006_stage_contract.py \
            src/marketlab/hg006_episode_threading.py \
            src/marketlab/hg006_base_rates.py \
            scripts/run_hg006_d001_shard.py \
            scripts/combine_hg006_d001_shards.py \
            tests/test_hg006_historical_events.py \
            tests/test_hg006_stage_contract.py \
            tests/test_hg006_episode_threading.py \
            tests/test_hg006_base_rates.py
          pytest -q \
            tests/test_hg006_historical_events.py \
            tests/test_hg006_stage_contract.py \
            tests/test_hg006_episode_threading.py \
            tests/test_hg006_base_rates.py \
            tests/test_ss002_special_situations.py \
            tests/test_alpha_announcements.py
      - name: Acquire frozen historical source shard
        run: |
          python scripts/run_hg006_d001_shard.py \
            --shard-id "${{ matrix.shard_id }}" \
            --output "reports/hg006-shard-${{ matrix.shard_id }}" \
            --attempts 4 \
            --timeout-seconds 25 \
            --pause-seconds 0.03
      - name: Upload exact shard evidence
        uses: actions/upload-artifact@v4
        with:
          name: hg006-d001-shard-${{ matrix.shard_id }}-${{ github.run_id }}
          path: reports/hg006-shard-${{ matrix.shard_id }}
          if-no-files-found: error
          retention-days: 90

  combine:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Download exact four source shards
        uses: actions/download-artifact@v4
        with:
          pattern: hg006-d001-shard-*-${{ github.run_id }}
          path: reports/hg006-shards
          merge-multiple: false
      - name: Combine and validate frozen historical census
        run: |
          python scripts/combine_hg006_d001_shards.py \
            --shards-root reports/hg006-shards \
            --output reports/hg006-d001
      - name: Prove source-only base-rate census
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/hg006-d001/hg006-d001-census.json").read_text())
          assert p["census_id"]=="HG006-D001-v1"
          assert p["acquisition_topology"]=="P1_FOUR_PARALLEL_CALENDAR_SHARDS"
          assert len(p["acquisition_shards"])==4
          assert p["completion_probabilities_assigned"] is False
          assert p["expected_returns_calculated"] is False
          assert p["return_outcomes_opened"] is False
          assert p["model_fitted"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          print(json.dumps({
            "census_sha256":p["census_sha256"],
            "source_row_count":p["source_row_count"],
            "retained_event_count":p["retained_event_count"],
            "retained_symbol_count":p["retained_symbol_count"],
            "historical_chronology_count":p["historical_chronology_count"],
            "historical_chronology_counts_by_family":p["historical_chronology_counts_by_family"],
            "historical_attachment_ready_chronology_ratio":p["historical_attachment_ready_chronology_ratio"],
            "threshold_passes":p["threshold_passes"],
            "feasibility_pass":p["feasibility_pass"],
          },indent=2,sort_keys=True))
          PY
      - name: Upload combined census
        uses: actions/upload-artifact@v4
        with:
          name: hg006-d001-${{ github.run_id }}
          path: reports/hg006-d001
          if-no-files-found: error
          retention-days: 90
