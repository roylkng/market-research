name: HG007 NPST June original financial and Reg32 source facts

on:
  pull_request:
    paths:
      - src/marketlab/hg007_npst_june_facts.py
      - scripts/reconcile_hg007_npst_june_facts.py
      - tests/test_hg007_npst_june_facts.py
      - .github/workflows/hg007-npst-june-facts.yml
  push:
    branches:
      - main
    paths:
      - src/marketlab/hg007_npst_june_facts.py
      - scripts/reconcile_hg007_npst_june_facts.py
      - tests/test_hg007_npst_june_facts.py
      - .github/workflows/hg007-npst-june-facts.yml

permissions:
  contents: write

concurrency:
  group: hg007-npst-source-facts-june26
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify exact original BSE page evidence and accounting bridge
        run: |
          ruff check src/marketlab/hg007_npst_june_facts.py scripts/reconcile_hg007_npst_june_facts.py tests/test_hg007_npst_june_facts.py
          pytest -q tests/test_hg007_npst_june_facts.py
      - name: Reproduce consolidated Q1 and Reg32 evidence-only report
        run: |
          python scripts/reconcile_hg007_npst_june_facts.py \
            --repo-root . \
            --out /tmp/hg007-npst-june-source-facts-v1.json
          test -s /tmp/hg007-npst-june-source-facts-v1.json
      - name: Preserve original source fact report as independently retrievable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hg007-npst-june-2026-original-q1-reg32-source-facts
          path: /tmp/hg007-npst-june-source-facts-v1.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Append-only Git research fact record after merge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          DEST="research/hg007/npst-aug2026-originals/june-2026-financial-and-funding-ledger-v1.json"
          if [[ -f "$DEST" ]]; then
            python scripts/reconcile_hg007_npst_june_facts.py \
              --out "$DEST" --verify-existing
            echo "Previous original NPST source facts reproduced"
            exit 0
          fi
          cp /tmp/hg007-npst-june-source-facts-v1.json "$DEST"
          git config user.name marketlab-research-bot
          git config user.email marketlab-research-bot@users.noreply.github.com
          git add "$DEST"
          git commit -m "HG007: anchor NPST original June EBITDA/Reg32 page facts [skip ci]"
          BASE_SHA="$(git rev-parse HEAD^)"
          for RETRY in 1 2 3; do
            git fetch origin main
            NEW_MAIN="$(git rev-parse origin/main)"
            if git cat-file -e "origin/main:$DEST" 2>/dev/null; then
              echo "Source fact packet already anchored; refuse overwrite"
              exit 1
            fi
            if ! git diff --quiet "$BASE_SHA" "$NEW_MAIN" -- \
              research/hg007/npst-aug2026-originals/june-original-page-text-v1.json \
              research/hg007/npst-aug2026-originals/2026-08-11-investor-presentation \
              research/hg007/npst-aug2026-originals/2026-08-11-june-reg32-use-of-funds \
              research/hg005-d003-result-v1.json \
              src/marketlab/hg007_npst_june_facts.py \
              scripts/reconcile_hg007_npst_june_facts.py; then
              echo "Original NPST source or financial review protocol changed"
              exit 1
            fi
            if [[ "$NEW_MAIN" != "$BASE_SHA" ]]; then
              git rebase origin/main
              BASE_SHA="$NEW_MAIN"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((RETRY*2))"
          done
          echo "Cannot anchor original NPST June source facts"
          exit 1
