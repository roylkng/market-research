name: AE001 historical 1D walk-forward pilot

on:
  push:
    branches:
      - feat/ae001-historical-panel-walkforward-20260926

permissions:
  contents: read

jobs:
  pilot:
    if: contains(github.event.head_commit.message, '[ae001-pilot]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify AE001 implementation
        run: |
          ruff check \
            src/marketlab/alpha.py \
            src/marketlab/alpha_market.py \
            src/marketlab/alpha_history.py \
            src/marketlab/alpha_acquisition.py \
            src/marketlab/alpha_model.py \
            src/marketlab/alpha_walkforward.py \
            scripts/build_ae001_historical_panel.py \
            scripts/run_ae001_walkforward.py
          pytest -q \
            tests/test_alpha.py \
            tests/test_alpha_market.py \
            tests/test_alpha_history.py \
            tests/test_alpha_acquisition.py \
            tests/test_alpha_model.py \
            tests/test_alpha_walkforward.py

      - name: Build official NSE historical panel
        run: |
          python scripts/build_ae001_historical_panel.py \
            --start-date 2025-09-01 \
            --end-date 2026-09-25 \
            --store .marketlab/ae001-pilot \
            --output reports/ae001-pilot/panel \
            --attempts 4 \
            --timeout-seconds 30 \
            --pause-seconds 0.05

      - name: Run frozen 1D OOS walk-forward
        run: |
          python scripts/run_ae001_walkforward.py \
            --market-panel reports/ae001-pilot/panel/market-panel.json.gz \
            --feature-panel reports/ae001-pilot/panel/feature-panel.json.gz \
            --output reports/ae001-pilot/walkforward \
            --fold 2026-04-01:2026-06-30 \
            --fold 2026-07-01:2026-09-24 \
            --l2 1.0

      - name: Print compact result
        run: cat reports/ae001-pilot/walkforward/summary.json

      - name: Upload exact development evidence
        uses: actions/upload-artifact@v4
        with:
          name: ae001-historical-1d-pilot-${{ github.run_id }}
          path: |
            reports/ae001-pilot
            .marketlab/ae001-pilot/market-data
          if-no-files-found: error
          retention-days: 90
