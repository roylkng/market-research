name: H004 NSE API probe

on:
  push:
    branches:
      - research/h004-pre-momentum-v1-20260908
    paths:
      - .github/workflows/h004-nse-api-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Probe legacy financial comparison endpoints
        run: |
          python - <<'PY'
          import json
          from marketlab.nse import NSEClient, NSEEndpoint

          client = NSEClient(timeout=20, attempts=4)
          for name, url, params in [
              ('RESULTS_COMPARISON', 'https://www.nseindia.com/api/results-comparision', {'symbol':'ENTERO'}),
              ('LEGACY_ENTERO', 'https://www.nseindia.com/api/corporates-financial-results', {'index':'equities','period':'Quarterly','symbol':'ENTERO'}),
              ('LEGACY_ALL', 'https://www.nseindia.com/api/corporates-financial-results', {'index':'equities','period':'Quarterly'}),
          ]:
              try:
                  payload, _ = client._json_get_with_raw(NSEEndpoint(name, url), params=params)
                  print('===', name, '===')
                  print(json.dumps(payload, indent=2)[:50000])
              except Exception as exc:
                  print('ERROR', name, repr(exc))
          PY
