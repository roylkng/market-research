name: SS001 D002 shareholding source census

on:
  push:
    branches:
      - research/ss001-ownership-governance-20261004

permissions:
  actions: read
  contents: read

jobs:
  census:
    if: contains(github.event.head_commit.message, '[ss001-d002]')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate frozen D002 implementation before source access
        run: |
          ruff check \
            src/marketlab/ss001_shareholding_census.py \
            scripts/run_ss001_d002.py \
            tests/test_ss001_shareholding_census.py
          pytest -q \
            tests/test_ss001_shareholding_census.py \
            tests/test_h023_acquisition.py \
            tests/test_h023_ownership.py

      - name: Download exact passed SS001 D001 census
        uses: actions/download-artifact@v4
        with:
          name: ss001-d001-37197575401
          path: reports/ss001-d001-source
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37197575401

      - name: Verify exact frozen D001 census
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("reports/ss001-d001-source/ss001-d001-census.json")
          census = json.loads(path.read_text())
          assert census["census_id"] == "SS001-D001-v1"
          assert census["census_sha256"] == (
              "0cfdc8658873a09f0cfa547467108888523eee88951050acfd2df8bd131829b7"
          )
          assert census["eq_identity_count"] == 2319
          assert census["return_outcomes_opened"] is False
          PY

      - name: Run frozen full-market shareholding source census
        run: |
          python scripts/run_ss001_d002.py \
            --d001-census reports/ss001-d001-source/ss001-d001-census.json \
            --raw-dir reports/ss001-d002/raw \
            --output reports/ss001-d002 \
            --attempts 3 \
            --timeout-seconds 20

      - name: Prove outcome-blind D002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          census = json.loads(
              Path("reports/ss001-d002/ss001-d002-shareholding-sources.json").read_text()
          )
          assert census["census_id"] == "SS001-D002-v1"
          assert census["identity_count"] == 2319
          assert len(census["rows"]) == 2319
          assert census["return_outcomes_opened"] is False
          assert census["model_fitted"] is False
          assert census["portfolio_eligibility_allowed"] is False
          assert census["live_capital_allowed"] is False
          print(json.dumps({
              "census_sha256": census["census_sha256"],
              "identity_count": census["identity_count"],
              "ready_latest_source_count": census["ready_latest_source_count"],
              "ready_latest_source_ratio": census["ready_latest_source_ratio"],
              "adjacent_quarter_source_count": census["adjacent_quarter_source_count"],
              "adjacent_quarter_source_ratio": census["adjacent_quarter_source_ratio"],
              "source_state_counts": census["source_state_counts"],
              "threshold_passes": census["threshold_passes"],
              "feasibility_pass": census["feasibility_pass"],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload exact D002 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss001-d002-${{ github.run_id }}
          path: reports/ss001-d002
          if-no-files-found: warn
          retention-days: 90
