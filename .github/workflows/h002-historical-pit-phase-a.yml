name: H002-HR003 point-in-time Phase A

on:
  push:
    branches:
      - work/h002-historical-replay-v1-20260907
    paths:
      - src/marketlab/h002_historical_identity.py
      - tests/test_h002_historical_identity.py
      - scripts/run_h002_historical_pit_phase_a_shard.py
      - scripts/merge_h002_historical_pit_phase_a_shards.py
      - research/historical/nifty200/snapshots-v1/**
      - research/historical/h002/H002-HR001/phase-a/fixed-u001-transport-signals.json
      - .github/workflows/h002-historical-pit-phase-a.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h002-hr003-pit-phase-a
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/h002-historical-replay-v1-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint HR003 Phase-A path
        run: |
          ruff check \
            src/marketlab/h002_historical_identity.py \
            scripts/run_h002_historical_pit_phase_a_shard.py \
            scripts/merge_h002_historical_pit_phase_a_shards.py \
            tests/test_h002_historical_identity.py
      - name: Compile HR003 Phase-A path
        run: |
          python -m py_compile \
            scripts/run_h002_historical_pit_phase_a_shard.py \
            scripts/merge_h002_historical_pit_phase_a_shards.py
      - name: Test historical identity contracts
        run: pytest -q tests/test_h002_historical_identity.py tests/test_nifty200_history.py
      - name: Verify immutable HR001 dependency
        run: |
          python - <<'PY'
          from marketlab.h002_historical_outcomes import load_phase_a_manifest

          doc = load_phase_a_manifest(
              'research/historical/h002/H002-HR001/phase-a/fixed-u001-transport-signals.json',
              expected_sha256='2062e21ee1b1cbcd86d758ae3cf9ef9aeb43664c629ca5eb7a22cd885068ef98',
          )
          if doc.get('observation_count') != 200:
              raise SystemExit(f"expected 200 frozen HR001 observations, got {doc.get('observation_count')}")
          if int(doc.get('status_counts', {}).get('ERROR', 0)):
              raise SystemExit('frozen HR001 dependency contains ERROR observations')
          print('hr001_manifest_sha256', doc['manifest_sha256'])
          PY
      - name: Verify frozen snapshot total
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          doc = json.loads(Path('research/historical/nifty200/snapshots-v1/manifest.json').read_text())
          total = sum(int(row['non_financial_member_count']) for row in doc['snapshots'])
          if total != 919:
              raise SystemExit(f'expected 919 point-in-time non-financial observations, found {total}')
          print('planned_observations', total)
          PY

  shard:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        quarter: [FY25-Q4, FY26-Q1, FY26-Q2, FY26-Q3, FY26-Q4, FY27-Q1]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/h002-historical-replay-v1-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Capture point-in-time historical signal shard
        run: |
          python scripts/run_h002_historical_pit_phase_a_shard.py \
            --quarter-id "${{ matrix.quarter }}" \
            --attempts 5 \
            --timeout 25 \
            --sleep 0.03 \
            --store ".marketlab-historical-pit-${{ matrix.quarter }}" \
            --output "phase-a-pit-shards/${{ matrix.quarter }}.json"
      - name: Reject unresolved acquisition or identity errors
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          quarter = os.environ['QUARTER']
          doc = json.loads(Path(f'phase-a-pit-shards/{quarter}.json').read_text())
          errors = [record for record in doc['records'] if record.get('status') == 'ERROR']
          if errors:
              for record in errors:
                  eligibility = record.get('point_in_time_eligibility') or {}
                  print(
                      eligibility.get('symbol_at_freeze'),
                      record.get('symbol'),
                      record.get('reason'),
                  )
              raise SystemExit(f'{quarter} has {len(errors)} unresolved HR003 Phase-A errors')
          print('quarter', quarter)
          print('member_count', doc['member_count_requested'])
          print('status_counts', json.dumps(doc['status_counts'], sort_keys=True))
          print('signal_bucket_counts', json.dumps(doc['signal_bucket_counts'], sort_keys=True))
          print('manifest_sha256', doc['manifest_sha256'])
          PY
        env:
          QUARTER: ${{ matrix.quarter }}
      - name: Upload exact Phase-A shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h002-hr003-phase-a-${{ matrix.quarter }}
          path: |
            phase-a-pit-shards/${{ matrix.quarter }}.json
            .marketlab-historical-pit-${{ matrix.quarter }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

  merge:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/h002-historical-replay-v1-20260907
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          pattern: h002-hr003-phase-a-*
          path: downloaded-hr003-phase-a
          merge-multiple: true
      - name: Merge six frozen membership shards
        run: |
          python scripts/merge_h002_historical_pit_phase_a_shards.py \
            --input-dir downloaded-hr003-phase-a \
            --output research/historical/h002/H002-HR003/phase-a/point-in-time-nifty200-signals.json
      - name: Validate merged point-in-time Phase A
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          doc = json.loads(Path(
              'research/historical/h002/H002-HR003/phase-a/point-in-time-nifty200-signals.json'
          ).read_text())
          if doc['observation_count'] != 919:
              raise SystemExit(f"expected 919 observations, got {doc['observation_count']}")
          if int(doc['status_counts'].get('ERROR', 0)):
              raise SystemExit(f"merged Phase A has ERROR={doc['status_counts'].get('ERROR')}")
          if doc.get('outcome_data_included') is not False:
              raise SystemExit('HR003 Phase A unexpectedly contains outcomes')
          print('manifest_sha256', doc['manifest_sha256'])
          print('status_counts', json.dumps(doc['status_counts'], sort_keys=True))
          print('signal_bucket_counts', json.dumps(doc['signal_bucket_counts'], sort_keys=True))
          print('quarter_status_counts', json.dumps(doc['quarter_status_counts'], sort_keys=True))
          PY
      - name: Upload merged Phase-A manifest
        uses: actions/upload-artifact@v4
        with:
          name: h002-hr003-phase-a-merged
          path: research/historical/h002/H002-HR003/phase-a/point-in-time-nifty200-signals.json
          retention-days: 30
      - name: Commit frozen point-in-time Phase A
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git pull --rebase origin work/h002-historical-replay-v1-20260907
          git add research/historical/h002/H002-HR003/phase-a/point-in-time-nifty200-signals.json
          if git diff --cached --quiet; then
            echo "HR003 Phase-A manifest already present"
            exit 0
          fi
          git commit -m "H002-HR003: freeze point-in-time six-quarter signals"
          git push origin HEAD:work/h002-historical-replay-v1-20260907
