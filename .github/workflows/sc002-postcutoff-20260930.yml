name: SC002 post-cutoff timing probe 2026-09-30

on:
  push:
    branches:
      - ops/sc002-postcutoff-20260930

permissions:
  contents: write

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[sc002-postcutoff]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Probe SC002 after cutoff
        run: |
          python scripts/probe_ae001_sc002.py \
            --session-date 2026-09-30 \
            --ledger research/prospective/ae001-sc002/source-ledger.json \
            --attempts 4 \
            --timeout-seconds 20 | tee sc002-postcutoff.json
          python scripts/verify_ae001_sc002.py \
            --ledger research/prospective/ae001-sc002/source-ledger.json
          cat sc002-postcutoff.json

      - name: Commit timing evidence
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/prospective/ae001-sc002
          if git diff --cached --quiet; then
            echo "No SC002 evidence changed"
            exit 0
          fi
          git commit -m "AE001 SC002: seal 2026-09-30 post-cutoff source probe [skip ci]"
          git push origin HEAD:ops/sc002-postcutoff-20260930
