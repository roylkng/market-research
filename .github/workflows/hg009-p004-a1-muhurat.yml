name: HG009 P004 A1 archive official Nov8 NSE Muhurat circular

on:
  workflow_dispatch:
  push:
    branches:
      - feat/hg009-p004-a1-official-nov08-muhurat-20261020
    paths:
      - .github/workflows/hg009-p004-a1-muhurat.yml
      - src/marketlab/hg009_p004_a1_muhurat.py
      - scripts/collect_hg009_p004_a1_muhurat.py
      - tests/test_hg009_p004_a1_muhurat.py

permissions:
  contents: write

concurrency:
  group: hg009-p004-a1-original-circular-archive
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh latest already-sealed source branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/hg009-p004-a1-official-nov08-muhurat-20261020
          git checkout --detach origin/feat/hg009-p004-a1-official-nov08-muhurat-20261020

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible MarketLab
        run: python -m pip install -e '.[dev]'

      - name: Check original P004 immutability and adverse fixtures
        shell: bash
        run: |
          set -euo pipefail
          ruff check src/marketlab/hg009_p004_a1_muhurat.py scripts/collect_hg009_p004_a1_muhurat.py tests/test_hg009_p004_a1_muhurat.py
          pytest -q tests/test_hg009_p004_a1_muhurat.py tests/test_hg009_p004_clock.py

      - name: Capture exactly the official original NSE circular or a failed receipt
        shell: bash
        run: |
          set -euo pipefail
          RUN_KEY="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python scripts/collect_hg009_p004_a1_muhurat.py --run-id "$RUN_KEY" |
            tee /tmp/hg009-p004-a1-capture-status.json
          if jq -e '.state == "ORIGINAL_NSE_SOURCE_ALREADY_SEALED_AND_VERIFIED"'             /tmp/hg009-p004-a1-capture-status.json > /dev/null; then
            echo "Previously source-sealed PDF independently replayed; no new receipt"
            exit 0
          fi
          RECEIPT="research/hg009/p004-a1/originals/attempts/$RUN_KEY.json"
          if [ ! -f "$RECEIPT" ]; then
            echo "No real source attempt receipt, fail closed"
            exit 1
          fi
          if [ -f research/hg009/hg009-p004-a1-nov08-calendar-v1.json ]; then
            python scripts/collect_hg009_p004_a1_muhurat.py \
              --check --receipt "$RECEIPT"
          else
            echo "Official original source access failed. H20 remains blocked."
          fi

      - name: Publish original source bytes and actual UTC capture receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add -f research/hg009/p004-a1
          if [ -f research/hg009/hg009-p004-a1-nov08-calendar-v1.json ]; then
            git add research/hg009/hg009-p004-a1-nov08-calendar-v1.json
          fi
          if git diff --cached --quiet; then
            echo "No new original NSE circular source"
            exit 0
          fi
          git commit -m "HG009 P004 A1: seal official NSE Nov8 special-session circular and clock [skip ci]"
          git fetch origin feat/hg009-p004-a1-official-nov08-muhurat-20261020
          git rebase origin/feat/hg009-p004-a1-official-nov08-muhurat-20261020
          if [ -f research/hg009/hg009-p004-a1-nov08-calendar-v1.json ]; then
            LAST_RECEIPT="$(find research/hg009/p004-a1/originals/attempts -type f -name '*.json' | sort | tail -n 1)"
            python scripts/collect_hg009_p004_a1_muhurat.py \
              --check --receipt "$LAST_RECEIPT"
          fi
          git push origin HEAD:feat/hg009-p004-a1-official-nov08-muhurat-20261020
