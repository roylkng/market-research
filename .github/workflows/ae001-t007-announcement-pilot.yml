name: AE001 T007 structured announcement pilot

on:
  push:
    branches:
      - feat/ae001-t007-structured-announcement-alpha-20260930

permissions:
  contents: read

jobs:
  pilot:
    if: contains(github.event.head_commit.message, '[ae001-t007]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify T007 implementation before source/outcome access
        run: |
          ruff check \
            src/marketlab/alpha.py \
            src/marketlab/alpha_announcements.py \
            src/marketlab/alpha_announcement_features.py \
            src/marketlab/alpha_announcement_trial.py \
            scripts/build_ae001_announcement_features.py \
            scripts/run_ae001_t007.py \
            tests/test_alpha_announcements.py \
            tests/test_alpha_announcement_features.py \
            tests/test_alpha_announcement_trial.py
          pytest -q \
            tests/test_alpha_announcements.py \
            tests/test_alpha_announcement_features.py \
            tests/test_alpha_announcement_trial.py \
            tests/test_alpha_multihorizon.py

      - name: Rebuild fixed official NSE market panel
        run: |
          python scripts/build_ae001_historical_panel.py \
            --start-date 2025-09-01 \
            --end-date 2026-09-25 \
            --store .marketlab/ae001-t007 \
            --output reports/ae001-t007/panel \
            --attempts 4 \
            --timeout-seconds 30 \
            --pause-seconds 0.05

      - name: Rebuild corporate-action-safe base features
        run: |
          python scripts/build_ae001_action_safe_panel.py \
            --market-panel reports/ae001-t007/panel/market-panel.json.gz \
            --feature-panel reports/ae001-t007/panel/feature-panel.json.gz \
            --start-date 2025-09-01 \
            --end-date 2026-09-25 \
            --raw-dir reports/ae001-t007/corporate-actions/raw \
            --output reports/ae001-t007/action-safe \
            --chunk-days 31 \
            --attempts 4 \
            --timeout-seconds 30

      - name: Build reusable CORE27 delivery feature panel
        run: |
          python scripts/build_ae001_delivery_features.py \
            --market-panel reports/ae001-t007/panel/market-panel.json.gz \
            --feature-panel reports/ae001-t007/action-safe/action-safe-feature-panel.json.gz \
            --store .marketlab/ae001-t007 \
            --output reports/ae001-t007/delivery \
            --attempts 4 \
            --timeout-seconds 30

      - name: Build T007 historical announcement source and CORE43 panel
        run: |
          python scripts/build_ae001_announcement_features.py \
            --market-panel reports/ae001-t007/panel/market-panel.json.gz \
            --feature-panel reports/ae001-t007/delivery/delivery-feature-panel.json.gz \
            --store reports/ae001-t007/announcements \
            --output reports/ae001-t007/announcements \
            --attempts 4 \
            --timeout-seconds 30 \
            --pause-seconds 0.05

      - name: Run frozen T007 CORE27 versus CORE43 trial
        run: |
          python scripts/run_ae001_t007.py \
            --market-panel reports/ae001-t007/panel/market-panel.json.gz \
            --feature-panel reports/ae001-t007/announcements/announcement-feature-panel.json.gz \
            --action-ledger reports/ae001-t007/action-safe/corporate-action-ledger.json.gz \
            --trial-ledger research/ae001/trial-ledger.json \
            --output reports/ae001-t007/trial

      - name: Print compact result
        run: |
          cat reports/ae001-t007/announcements/manifest.json
          cat reports/ae001-t007/trial/summary.json

      - name: Upload exact T007 development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae001-t007-${{ github.run_id }}
          path: |
            reports/ae001-t007
            .marketlab/ae001-t007/market-data
          if-no-files-found: warn
          retention-days: 90
