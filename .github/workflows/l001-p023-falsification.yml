name: L001 P023 cross-company source falsification

on:
  push:
    branches:
      - research/l001-p023-cross-company-falsification-20261020
    paths:
      - .github/workflows/l001-p023-falsification.yml
      - src/marketlab/l001_p023_frontier.py
      - scripts/materialize_l001_p023_frontier.py
      - tests/test_l001_p023_frontier.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l001-p023-source-falsification-freeze
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Reproduce original issuer reverse hurdles with signed receipts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_l001_p023_frontier.py
          python scripts/materialize_l001_p023_frontier.py --check
          ruff check src/marketlab/l001_p023_frontier.py scripts/materialize_l001_p023_frontier.py tests/test_l001_p023_frontier.py
          pytest -q tests/test_l001_p023_frontier.py
          # Run the exact root CI gates too. Some connector-created pull
          # requests do not automatically dispatch pull_request workflows.
          ruff check src tests scripts
          pytest -q
          python scripts/audit_h021_eps_sign.py --out /tmp/h021-eps-sign-audit.json
          python scripts/validate_rta001_coverage.py --repo-root .
          marketlab validate-registry registry/hypotheses.yaml
      - name: Anchor signed four-company research
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/l001/l001-p023-value-falsification-frontier-v1.json
          if git diff --cached --quiet; then
            echo "No change to source-based falsification"
            exit 0
          fi
          git commit -m "L001 P023: seal four original-source falsification hurdles [skip ci]"
          git fetch origin research/l001-p023-cross-company-falsification-20261020
          git rebase origin/research/l001-p023-cross-company-falsification-20261020
          python scripts/materialize_l001_p023_frontier.py --check
          git push origin HEAD:research/l001-p023-cross-company-falsification-20261020
