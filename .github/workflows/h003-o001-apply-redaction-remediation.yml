name: H003-O001 apply identity-redaction remediation

on:
  push:
    branches:
      - research/h003-v001-outcome-protocol-20260908
    paths:
      - src/marketlab/h003_identity_redaction.py
      - tests/test_h003_identity_redaction.py
      - .github/workflows/h003-o001-apply-redaction-remediation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h003-v001-outcome-protocol-20260908
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Patch only blind identity-redaction plumbing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/build_h003_outcome_packets.py')
          text = path.read_text()
          import_anchor = 'from marketlab.h003_review import load_complete_candidate_corpus\n'
          import_replacement = (
              'from marketlab.h003_identity_redaction import (\n'
              '    assert_identity_scrubbed,\n'
              '    combined_redaction_terms,\n'
              ')\n'
              'from marketlab.h003_review import load_complete_candidate_corpus\n'
          )
          if import_replacement not in text:
              if import_anchor not in text:
                  raise SystemExit('builder import anchor not found')
              text = text.replace(import_anchor, import_replacement, 1)

          old = '''        selected = select_evidence_passages(claim, all_passages)\n        terms = redaction_terms(member, symbol)\n        packet = build_blind_outcome_payload(claim, selected, redaction_terms=terms)\n        packet_document = packet.to_dict()\n\n        # Fail if the most explicit frozen identity strings survive the packet.\n        rendered = json.dumps(packet_document, ensure_ascii=False)\n        for forbidden in (symbol, str(member.get("company_name") or "")):\n            forbidden = forbidden.strip()\n            pattern = rf"(?<!\\w){re.escape(forbidden)}(?!\\w)" if forbidden else None\n            if pattern and re.search(pattern, rendered, flags=re.IGNORECASE):\n                raise H003OutcomeError(\n                    f"explicit company identity survived blind packet: {claim['claim_id']}"\n                )\n'''
          new = '''        selected = select_evidence_passages(claim, all_passages)\n        terms = combined_redaction_terms(member, symbol, selected)\n        packet = build_blind_outcome_payload(claim, selected, redaction_terms=terms)\n        packet_document = packet.to_dict()\n\n        # Fail closed on every generated company alias and transcript speaker label.\n        assert_identity_scrubbed(packet_document, terms)\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('builder redaction block anchor not found')
              text = text.replace(old, new, 1)
          path.write_text(text)

          cli = Path('scripts/compile_h003_outcome_judgments.py')
          cli_text = cli.read_text()
          cli_text = cli_text.replace(
              '        raise ValueError(f"JSON root must be an object: {path}")',
              '        raise TypeError(f"JSON root must be an object: {path}")',
          )
          cli.write_text(cli_text)
          PY
      - name: Verify remediation before commit
        run: |
          ruff check src scripts tests
          pytest -q
      - name: Commit only redaction implementation and mechanical compiler lint fix
        run: |
          git config user.name marketlab-research-bot
          git config user.email marketlab-research-bot@users.noreply.github.com
          git add scripts/build_h003_outcome_packets.py scripts/compile_h003_outcome_judgments.py
          if git diff --cached --quiet; then
            echo 'remediation already applied'
            exit 0
          fi
          git commit -m 'H003-O001: harden pre-review identity redaction'
          git push origin HEAD:research/h003-v001-outcome-protocol-20260908
