name: SS001 D001 full-market opportunity census

on:
  push:
    branches:
      - research/ss001-full-market-census-20261004

permissions:
  contents: read

jobs:
  census:
    if: contains(github.event.head_commit.message, '[ss001-d001]')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate frozen census implementation before source access
        run: |
          ruff check \
            src/marketlab/ss001_census.py \
            src/marketlab/nse.py \
            scripts/run_ss001_d001.py \
            tests/test_ss001_census.py
          pytest -q \
            tests/test_ss001_census.py \
            tests/test_alpha_market.py \
            tests/test_nse_quote_raw.py \
            tests/test_universe.py

      - name: Run frozen SS001 full-market census
        run: |
          python scripts/run_ss001_d001.py \
            --raw-dir reports/ss001-d001/raw \
            --output reports/ss001-d001 \
            --attempts 4 \
            --timeout-seconds 25

      - name: Prove outcome-blind census
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          census = json.loads(
              Path("reports/ss001-d001/ss001-d001-census.json").read_text()
          )
          assert census["census_id"] == "SS001-D001-v1"
          assert census["return_outcomes_opened"] is False
          assert census["model_fitted"] is False
          assert census["portfolio_eligibility_allowed"] is False
          assert census["live_capital_allowed"] is False
          assert len(census["rows"]) == census["eq_identity_count"]
          print(json.dumps({
              "census_sha256": census["census_sha256"],
              "eq_identity_count": census["eq_identity_count"],
              "current_udiff_identity_count": census["current_udiff_identity_count"],
              "current_udiff_coverage_ratio": census["current_udiff_coverage_ratio"],
              "at_least_15_of_20_session_count": census["at_least_15_of_20_session_count"],
              "at_least_15_of_20_session_coverage_ratio": census["at_least_15_of_20_session_coverage_ratio"],
              "integrated_financial_coverage_count": census["integrated_financial_coverage_count"],
              "integrated_financial_coverage_ratio": census["integrated_financial_coverage_ratio"],
              "corporate_action_row_count": census["corporate_action_row_count"],
              "existing_u001_overlap_count": census["existing_u001_overlap_count"],
              "outside_existing_u001_count": census["outside_existing_u001_count"],
              "threshold_passes": census["threshold_passes"],
              "feasibility_pass": census["feasibility_pass"],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload exact SS001 census evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss001-d001-${{ github.run_id }}
          path: reports/ss001-d001
          if-no-files-found: warn
          retention-days: 90
