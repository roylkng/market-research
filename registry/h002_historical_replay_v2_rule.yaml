  prospective_equivalence_claimed: false
  live_capital: false

freeze_policy:
  target_period_end_offset_days: -24
  freeze_clock: "20:41:38.303 Asia/Kolkata"
  baseline_revision_cutoff: strictly_at_or_before_freeze
  corporate_action_cutoff: strictly_at_or_before_freeze
  post_freeze_eps_basis_action: SKIP
  price_reference: second NSE trading session strictly before target filing local date

source_policy:
