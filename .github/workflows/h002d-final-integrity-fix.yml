name: H002-D final integrity fix

on:
  push:
    branches:
      - feat/h002-prospective-orchestrator-v1
    paths:
      - .github/workflows/h002d-final-integrity-fix.yml
      - scripts/h002d_finalize_patch_once.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/h002-prospective-orchestrator-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/h002d_finalize_patch_once.py
      - run: ruff check src tests --fix
      - run: ruff check src tests
      - run: pytest -q
      - name: Commit final integrity fixes
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git rm .github/workflows/h002d-final-integrity-fix.yml scripts/h002d_finalize_patch_once.py
          git add src tests
          git commit -m "Close final H002-D orchestrator integrity gaps"
          git push origin HEAD:feat/h002-prospective-orchestrator-v1
