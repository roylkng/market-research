name: AE001 SC003 previous-session futures pre-open timing

on:
  workflow_dispatch:
  schedule:
    # Asia/Kolkata: 06:30, 07:00, 07:30, 08:00, 08:15, 08:25.
    - cron: '0 1 * * 1-5'
    - cron: '30 1 * * 1-5'
    - cron: '0 2 * * 1-5'
    - cron: '30 2 * * 1-5'
    - cron: '45 2 * * 1-5'
    - cron: '55 2 * * 1-5'

permissions:
  contents: write

concurrency:
  group: ae001-sc003-preopen-futures-timing
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh latest canonical main before observation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach origin/main
          echo "OBSERVATION_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify SC003 implementation before source access
        run: |
          ruff check \
            src/marketlab/alpha_sc003_preopen.py \
            scripts/probe_ae001_sc003.py \
            scripts/verify_ae001_sc003.py \
            tests/test_alpha_sc003_preopen.py
          pytest -q \
            tests/test_alpha_sc003_preopen.py \
            tests/test_alpha_prospective_futures_sources.py \
            tests/test_alpha_futures.py
          python scripts/verify_ae001_sc003.py \
            --ledger research/prospective/ae001-sc003/source-ledger.json \
            --summary research/prospective/ae001-sc003/readiness-summary.json

      - name: Resolve observation date
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=Asia/Kolkata date +%F)"
          if [[ "$TODAY" < "2026-10-02" ]]; then
            STATE="BEFORE_START"
          else
            STATE="READY"
          fi
          echo "date=$TODAY" >> "$GITHUB_OUTPUT"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "SC003 gate: observation_date=$TODAY state=$STATE"

      - name: Probe latest completed SC001 session futures file
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/probe_ae001_sc003.py \
            --observation-date "${{ steps.gate.outputs.date }}" \
            --sc001-ledger research/prospective/ae001-sc001/source-ledger.json \
            --sc003-ledger research/prospective/ae001-sc003/source-ledger.json \
            --summary research/prospective/ae001-sc003/readiness-summary.json \
            --attempts 4 \
            --timeout-seconds 30 | tee sc003-probe.json
          python scripts/verify_ae001_sc003.py \
            --ledger research/prospective/ae001-sc003/source-ledger.json \
            --summary research/prospective/ae001-sc003/readiness-summary.json

      - name: Anchor append-only SC003 evidence
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          LEDGER="research/prospective/ae001-sc003/source-ledger.json"
          SUMMARY="research/prospective/ae001-sc003/readiness-summary.json"
          python scripts/verify_ae001_sc003.py \
            --ledger "$LEDGER" \
            --summary "$SUMMARY"

          START_SHA="$OBSERVATION_BASE_SHA"

          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/prospective/ae001-sc003
          if git diff --cached --quiet; then
            echo "No new SC003 evidence to anchor"
            exit 0
          fi

          git commit -m "AE001 SC003: seal pre-open futures timing probe ${{ steps.gate.outputs.date }} [skip ci]"

          CRITICAL_PATHS=(
            ".github/workflows/ae001-sc003-preopen-futures-timing.yml"
            "registry/ae001_sc003_preopen_futures.yaml"
            "research/AE001_SC003_PREOPEN_FUTURES_SOURCE_TIMING_V1.md"
            "research/prospective/ae001-sc001"
            "research/prospective/ae001-sc003"
            "src/marketlab/alpha_sc003_preopen.py"
            "scripts/probe_ae001_sc003.py"
            "scripts/verify_ae001_sc003.py"
          )

          for ATTEMPT in 1 2 3; do
            git fetch origin main
            CURRENT_MAIN="$(git rev-parse origin/main)"
            if [ "$START_SHA" != "$CURRENT_MAIN" ]; then
              if ! git diff --quiet "$START_SHA" "$CURRENT_MAIN" -- "${CRITICAL_PATHS[@]}"; then
                echo "SC003 rules or canonical source state changed while observation was in flight"
                git diff --stat "$START_SHA" "$CURRENT_MAIN" -- "${CRITICAL_PATHS[@]}"
                exit 1
              fi
              git rebase origin/main
              python scripts/verify_ae001_sc003.py \
                --ledger "$LEDGER" \
                --summary "$SUMMARY"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((ATTEMPT * 2))
          done
          echo "Unable to anchor SC003 evidence after bounded retries"
          exit 1

      - name: Report pre-start probe
        if: steps.gate.outputs.state != 'READY'
        run: echo "SC003 has not reached its frozen start boundary"
