name: H020-v2 temporary full integration CI

on:
  push:
    branches:
      - research/h020-v2-downside-guard-20260915
    paths:
      - '.github/workflows/h020-v2-full-ci-temp.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests scripts
      - name: Test
        run: pytest -q
      - name: Validate hypothesis registry
        run: marketlab validate-registry registry/hypotheses.yaml
