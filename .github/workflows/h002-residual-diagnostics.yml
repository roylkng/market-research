name: H002 residual diagnostics

on:
  push:
    branches:
      - run/h002-residual-diagnostics
    paths:
      - .github/workflows/h002-residual-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Capture exact NSE payloads
        run: |
          mkdir -p residual-evidence
          python - <<'PY'
          import json
          from pathlib import Path
          from marketlab.nse import NSEClient

          client = NSEClient(timeout=20.0, attempts=4)
          root = Path('residual-evidence')
          for symbol in ('GVT&D', 'ADANIGREEN', 'POWERINDIA', 'LTM'):
              payload, raw = client.integrated_financial_filings_with_raw(symbol)
              (root / f'{symbol.replace("&", "and")}-filings-raw.json').write_bytes(raw)
              rows = payload.get('data', []) if isinstance(payload, dict) else payload
              selected = []
              for row in rows if isinstance(rows, list) else []:
                  if not isinstance(row, dict):
                      continue
                  if str(row.get('type') or '').strip().casefold() != 'integrated filing- financials':
                      continue
                  selected.append({
                      'symbol': row.get('symbol'),
                      'cmName': row.get('cmName'),
                      'consolidated': row.get('consolidated'),
                      'qe_Date': row.get('qe_Date'),
                      'broadcast_Date': row.get('broadcast_Date'),
                      'xbrl': row.get('xbrl'),
                  })
              (root / f'{symbol.replace("&", "and")}-filings-summary.json').write_text(
                  json.dumps(selected, indent=2, sort_keys=True) + '\n', encoding='utf-8'
              )

          payload, raw = client.corporate_actions_with_raw(
              'ADANIENT', from_date='30-09-2025', to_date='06-09-2026'
          )
          (root / 'ADANIENT-corporate-actions-raw.json').write_bytes(raw)
          (root / 'ADANIENT-corporate-actions-parsed.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: h002-residual-evidence-${{ github.run_id }}
          path: residual-evidence
          if-no-files-found: error
          retention-days: 90
