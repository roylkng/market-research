name: HG007 ANANTRAJ original full-scheme clause audit

on:
  pull_request:
    paths:
      - src/marketlab/hg007_anantraj_scheme_terms.py
      - scripts/audit_hg007_anantraj_scheme_terms.py
      - tests/test_hg007_anantraj_scheme_terms.py
      - .github/workflows/hg007-anantraj-clause-audit.yml
  push:
    branches:
      - main
    paths:
      - src/marketlab/hg007_anantraj_scheme_terms.py
      - scripts/audit_hg007_anantraj_scheme_terms.py
      - tests/test_hg007_anantraj_scheme_terms.py
      - .github/workflows/hg007-anantraj-clause-audit.yml

permissions:
  contents: write

concurrency:
  group: hg007-anantraj-verified-clauses-v1
  cancel-in-progress: false

jobs:
  case-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate original 48-page clause and P022 ownership crosschecks
        run: |
          ruff check src/marketlab/hg007_anantraj_scheme_terms.py scripts/audit_hg007_anantraj_scheme_terms.py tests/test_hg007_anantraj_scheme_terms.py
          pytest -q tests/test_hg007_anantraj_scheme_terms.py
      - name: Reproduce exact original page-based legal clause evidence
        run: |
          python scripts/audit_hg007_anantraj_scheme_terms.py \
            --repo-root . --out /tmp/hg007-anantraj-original-clauses-v1.json
          test -s /tmp/hg007-anantraj-original-clauses-v1.json
      - name: Retain independent source-review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hg007-anantraj-issuer-clauses-verified-pages-no-valuation
          path: /tmp/hg007-anantraj-original-clauses-v1.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Append-only main evidence anchoring
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          TARGET="research/hg007/anantraj-full-scheme/p026-clause-review-v1.json"
          if [[ -f "$TARGET" ]]; then
            python scripts/audit_hg007_anantraj_scheme_terms.py \
              --out "$TARGET" --verify-existing
            exit 0
          fi
          cp /tmp/hg007-anantraj-original-clauses-v1.json "$TARGET"
          git config user.name marketlab-research-bot
          git config user.email marketlab-research-bot@users.noreply.github.com
          git add "$TARGET"
          git commit -m "HG007: anchor exact Anant Raj 48page proposed debt cash and entitlement clauses [skip ci]"
          BASE_SHA="$(git rev-parse HEAD^)"
          for RETRY in 1 2 3; do
            git fetch origin main
            NEW_MAIN="$(git rev-parse origin/main)"
            if git cat-file -e "origin/main:$TARGET" 2>/dev/null; then
              echo "Original scheme clause review already sealed; no overwrite"
              exit 1
            fi
            if ! git diff --quiet "$BASE_SHA" "$NEW_MAIN" -- \
              research/hg007/anantraj-full-scheme/raw \
              research/hg007/anantraj-full-scheme/original-source-v1.json \
              research/hg007/anantraj-full-scheme/page-text-v1 \
              research/hg007/anantraj-july2026-originals/conditional-parent-direct-newco-ownership-v1.json \
              src/marketlab/hg007_anantraj_scheme_terms.py \
              scripts/audit_hg007_anantraj_scheme_terms.py; then
              echo "Original source, page text or typed legal terms modified during audit"
              exit 1
            fi
            if [[ "$NEW_MAIN" != "$BASE_SHA" ]]; then
              git rebase origin/main
              BASE_SHA="$NEW_MAIN"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((RETRY*2))"
          done
          echo "Original scheme clause review could not be durably anchored"
          exit 1
