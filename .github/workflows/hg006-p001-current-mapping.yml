name: HG006 P001 current transaction base-rate mapping

on:
  push:
    branches:
      - research/hg006-p001-current-probability-20261007

permissions:
  actions: read
  contents: read

jobs:
  map:
    if: contains(github.event.head_commit.message, '[hg006-p001]')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate frozen P001 implementation
        run: |
          ruff check \
            src/marketlab/hg006_p001_current_mapping.py \
            scripts/run_hg006_p001_current_mapping.py \
            tests/test_hg006_p001_current_mapping.py
          pytest -q tests/test_hg006_p001_current_mapping.py

      - name: Download HG004 D001 selection
        uses: actions/download-artifact@v4
        with:
          name: hg004-d001-37283860083
          path: reports/hg004-d001
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37283860083

      - name: Download HG004 L001 extraction
        uses: actions/download-artifact@v4
        with:
          name: hg004-l001-37296227681
          path: reports/hg004-l001
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37296227681

      - name: Download HG004 L002 synthesis
        uses: actions/download-artifact@v4
        with:
          name: hg004-l002-37297528769
          path: reports/hg004-l002
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37297528769

      - name: Download HG006 D004 base rates
        uses: actions/download-artifact@v4
        with:
          name: hg006-d004-37657805872
          path: reports/hg006-d004
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37657805872

      - name: Download HG006 D002 historical labels
        uses: actions/download-artifact@v4
        with:
          name: hg006-d002-p1-37654933457
          path: reports/hg006-labels
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37654933457

      - name: Verify frozen source identities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          d001=json.loads(Path("reports/hg004-d001/hg004-d001-selection.json").read_text())
          l001=json.loads(Path("reports/hg004-l001/hg004-l001-native-run.json").read_text())
          l002=json.loads(Path("reports/hg004-l002/hg004-l002-synthesis.json").read_text())
          d004=json.loads(Path("reports/hg006-d004/hg006-d004-base-rates.json").read_text())
          labels=json.loads(Path("reports/hg006-labels/hg006-d002-p1-terminal-labels.json").read_text())

          assert d001["selection_sha256"]=="9b82b337b02d5aa2c58164bf888f76ce50fcd34680077f87f13b0ff5cfc7c102"
          assert l001["run_sha256"]=="a402b39a8890cd2fac3218bb94673f8b9c00b1f325315f9ec93863c22d9a1d12"
          assert l002["synthesis_sha256"]=="6bd1a43d29460fc18389dfdcb7241c95d1de0acb80b769a728946ef81c031683"
          assert d004["base_rate_panel_sha256"]=="08eddc18599b7dcd86c4a688ef46fc6161a1a52cb49b72cf6695ffbc43ce3084"
          assert labels["label_panel_sha256"]=="545532620b409135bd867f633de708cfd441e2c532a5b790afeacef9c7de9874"
          PY

      - name: Map survivor-conditioned current transaction base rates
        run: |
          mkdir -p reports/hg006-p001
          python scripts/run_hg006_p001_current_mapping.py \
            --hg004-d001 reports/hg004-d001/hg004-d001-selection.json \
            --hg004-l001 reports/hg004-l001/hg004-l001-native-run.json \
            --hg004-l002 reports/hg004-l002/hg004-l002-synthesis.json \
            --hg006-d004 reports/hg006-d004/hg006-d004-base-rates.json \
            --hg006-labels reports/hg006-labels/hg006-d002-p1-terminal-labels.json \
            --out reports/hg006-p001/hg006-p001-current-mapping.json

      - name: Prove probability-only current output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/hg006-p001/hg006-p001-current-mapping.json").read_text())
          assert p["mapper_id"]=="HG006-P001-v1"
          assert p["expected_returns_calculated"] is False
          assert p["return_outcomes_opened"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          print(json.dumps({
            "mapping_sha256":p["mapping_sha256"],
            "case_count":p["case_count"],
            "mapping_state_counts":p["mapping_state_counts"],
            "current_company_probability_surfaces_published":p["current_company_probability_surfaces_published"],
            "current_terminal_state_count":p["current_terminal_state_count"],
            "cases":p["cases"],
            "promotion_allowed_to_probability_weighted_payoff":p["promotion_allowed_to_probability_weighted_payoff"],
          },indent=2,sort_keys=True))
          PY

      - name: Upload exact P001 mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hg006-p001-${{ github.run_id }}
          path: reports/hg006-p001
          if-no-files-found: warn
          retention-days: 90
