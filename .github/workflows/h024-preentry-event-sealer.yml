name: H024 pre-entry insider event sealer

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
    - cron: '15 3 * * *'

permissions:
  contents: write

concurrency:
  group: h024-prospective-insider-stream
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify H024 implementation before source access
        shell: bash
        run: |
          set -euo pipefail
          ruff check \
            src/marketlab/h024_insider.py \
            src/marketlab/h024_acquisition.py \
            src/marketlab/h024_prospective.py \
            src/marketlab/h024_events.py \
            scripts/run_h024_prospective_scan.py \
            scripts/seal_h024_prospective_events.py \
            scripts/verify_h024_prospective_state.py \
            tests/test_h024_insider.py \
            tests/test_h024_acquisition.py \
            tests/test_h024_prospective.py \
            tests/test_h024_events.py \
            tests/test_h024_event_sealer.py \
            tests/test_h024_scan_retry.py
          pytest -q \
            tests/test_h024_insider.py \
            tests/test_h024_acquisition.py \
            tests/test_h024_prospective.py \
            tests/test_h024_events.py \
            tests/test_h024_event_sealer.py \
            tests/test_h024_scan_retry.py
          python scripts/verify_h024_prospective_state.py \
            --calendar research/prospective/calendars/FY27-Q2-2026-09-06/NSE-CM-FY27Q2-v1.json \
            --state-dir research/prospective/h024

      - name: Resolve prospective boundary
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          STATE=$(python - <<'PY'
          from datetime import UTC, datetime
          import os

          boundary = datetime(2026, 9, 15, 18, 30, tzinfo=UTC)
          now = datetime.now(UTC)
          if now < boundary:
              print('BEFORE_BOUNDARY')
          elif os.environ.get('GITHUB_REF') != 'refs/heads/main':
              print('NON_MAIN_REHEARSAL')
          else:
              print('READY')
          PY
          )
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "H024 pre-entry workflow state: $STATE"

      - name: Prepare isolated state
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          START_SHA=$(git rev-parse HEAD)
          echo "start_sha=$START_SHA" >> "$GITHUB_ENV"
          WORK="reports/h024-preentry/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$WORK/state" "$WORK/raw"
          cp research/prospective/h024/*.json "$WORK/state/"
          echo "work_dir=$WORK" >> "$GITHUB_ENV"

      - name: Refresh official NSE source state
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_h024_prospective_scan.py \
            --calendar research/prospective/calendars/FY27-Q2-2026-09-06/NSE-CM-FY27Q2-v1.json \
            --state-dir "$work_dir/state" \
            --raw-dir "$work_dir/raw/source-scan" \
            --report "$work_dir/source-scan-report.json" \
            --lookback-days 35 \
            --discovery-attempts 4 \
            --xbrl-attempts 5

      - name: Verify refreshed source state offline
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_h024_prospective_state.py \
            --calendar research/prospective/calendars/FY27-Q2-2026-09-06/NSE-CM-FY27Q2-v1.json \
            --state-dir "$work_dir/state"

      - name: Seal due H024 symbol-entry events
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/seal_h024_prospective_events.py \
            --state-dir "$work_dir/state" \
            --raw-dir "$work_dir/raw/event-seal" \
            --report "$work_dir/event-seal-report.json" \
            --lookback-days 35 \
            --attempts 4 \
            --final-refresh-seconds-before-open 45 \
            --max-completed-sessions 260

      - name: Verify sealed state offline
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_h024_prospective_state.py \
            --calendar research/prospective/calendars/FY27-Q2-2026-09-06/NSE-CM-FY27Q2-v1.json \
            --state-dir "$work_dir/state"

      - name: Fail closed on concurrent H024 state change
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$start_sha"
          git fetch origin main
          if ! git diff --quiet "$start_sha" origin/main -- research/prospective/h024; then
            echo "ERROR: canonical H024 state changed while pre-entry observation was in flight"
            git diff --stat "$start_sha" origin/main -- research/prospective/h024
            exit 1
          fi

      - name: Seal canonical H024 event state
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          cp "$work_dir/state/"*.json research/prospective/h024/
          python scripts/verify_h024_prospective_state.py \
            --calendar research/prospective/calendars/FY27-Q2-2026-09-06/NSE-CM-FY27Q2-v1.json \
            --state-dir research/prospective/h024
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/prospective/h024/*.json
          if git diff --cached --quiet; then
            echo "No H024 canonical state change"
            exit 0
          fi
          git commit -m "H024: seal prospective insider entry event [skip ci]"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git diff --quiet "$start_sha" origin/main -- research/prospective/h024; then
              echo "ERROR: canonical H024 state changed upstream before push"
              exit 1
            fi
            if test "$(git rev-parse origin/main)" != "$(git rev-parse HEAD^)"; then
              git rebase origin/main
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "ERROR: unable to push H024 event state after safe retries"
          exit 1

      - name: Upload exact pre-entry evidence
        if: steps.gate.outputs.state == 'READY' && always()
        uses: actions/upload-artifact@v4
        with:
          name: h024-preentry-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/h024-preentry
          if-no-files-found: error
          retention-days: 90
