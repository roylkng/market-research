name: CC001 semantic handoff and finite event economics
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/marketlab/company_change_semantics.py'
      - 'src/marketlab/company_change_event_bridge.py'
      - 'tests/test_company_change_execution.py'
      - 'data/fixtures/company_change_event_scenarios.json'
      - 'scripts/cc001_execution_replay.py'
      - '.github/workflows/cc001-execution-smoke.yml'
permissions:
  contents: read
jobs:
  verify-event-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Restore isolated research workspace
        run: |
          git fetch --depth=1 origin cc001-state
          git show FETCH_HEAD:workspace.zip > /tmp/cc001-execution-input.zip
          python -m marketlab.company_change_checkpoint restore --workspace /tmp/cc001-execution --archive /tmp/cc001-execution-input.zip
      - name: Verify four original development disclosures and source-bound reviews
        run: python scripts/cc001_execution_replay.py --workspace /tmp/cc001-execution --package data/fixtures/company_change_news_development_reviews.json
      - name: Prepare semantic requests without external model inference
        run: python -m marketlab.company_change_semantics --workspace /tmp/cc001-execution --limit 4 --output /tmp/cc001-execution/reports/semantic-preparation.json
      - name: Capture actual company and price context
        run: python -m marketlab.company_change_context --workspace /tmp/cc001-execution --symbols SEAMECLTD --limit 1 --output-prefix /tmp/cc001-execution/reports/event-company-context
      - name: Compute finite event scenarios and publication-aware timing
        run: python -m marketlab.company_change_event_bridge --workspace /tmp/cc001-execution --plans data/fixtures/company_change_event_scenarios.json --output-prefix /tmp/cc001-execution/reports/event-economics
      - name: Retain exact tested implementation
        if: always()
        run: |
          mkdir -p /tmp/cc001-execution/implementation/src/marketlab /tmp/cc001-execution/implementation/tests /tmp/cc001-execution/implementation/data/fixtures /tmp/cc001-execution/implementation/workflows /tmp/cc001-execution/implementation/scripts
          cp src/marketlab/*.py /tmp/cc001-execution/implementation/src/marketlab/
          cp tests/test_company_change*.py /tmp/cc001-execution/implementation/tests/
          cp data/fixtures/company_change*.json /tmp/cc001-execution/implementation/data/fixtures/
          cp .github/workflows/cc001*.yml /tmp/cc001-execution/implementation/workflows/
          cp scripts/cc001_execution_replay.py /tmp/cc001-execution/implementation/scripts/
          cp pyproject.toml /tmp/cc001-execution/implementation/
          git rev-parse HEAD > /tmp/cc001-execution/implementation/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cc001-event-execution-evidence
          path: /tmp/cc001-execution
          retention-days: 14
          if-no-files-found: error
