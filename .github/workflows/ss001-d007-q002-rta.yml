name: SS001 D007 Q002 RTA001 accounting rebuild

on:
  push:
    branches:
      - research/ss001-d007-q002-document-binding-20261008

permissions:
  contents: write

jobs:
  accounting:
    if: contains(github.event.head_commit.message, '[ss001-q002-rta]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Rebuild deterministic research accounting
        run: |
          python scripts/build_rta001_summary.py \
            --manifest research/rta001-trials-v1.json \
            --output research/rta001-summary-v1.json \
            --repo-root .
      - name: Commit rebuilt summary
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/rta001-summary-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "RTA001: rebuild summary for D007 Q002 [skip ci]"
          git push origin HEAD:research/ss001-d007-q002-document-binding-20261008
