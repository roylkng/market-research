name: H023 ownership iXBRL concept probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/h023-ownership-source-probe-v1-20260914
    paths:
      - '.github/workflows/h023-ownership-ixbrl-concept-probe.yml'
      - 'scripts/probe_h023_nse_shareholding.py'
      - 'scripts/probe_h023_nse_shareholding_xbrl.py'
      - 'scripts/probe_h023_nse_shareholding_ixbrl.py'

permissions:
  contents: write

concurrency:
  group: h023-ownership-ixbrl-concept-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint source-only probes
        run: |
          ruff check \
            scripts/probe_h023_nse_shareholding.py \
            scripts/probe_h023_nse_shareholding_xbrl.py \
            scripts/probe_h023_nse_shareholding_ixbrl.py
      - name: Acquire official NSE shareholding master responses
        shell: bash
        run: |
          set -euo pipefail
          WORK="reports/h023-ownership-ixbrl-concept/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$WORK"
          python scripts/probe_h023_nse_shareholding.py \
            --out-dir "$WORK/source" \
            --attempts 4 \
            --pause-seconds 0.35
          echo "work_dir=$WORK" >> "$GITHUB_ENV"
      - name: Audit inline-XBRL ownership concepts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/probe_h023_nse_shareholding_ixbrl.py \
            --raw-dir "$work_dir/source/raw" \
            --out "$work_dir/ixbrl-concept-report.json" \
            --max-filings-per-symbol 4 \
            --attempts 4 \
            --pause-seconds 0.2
      - name: Retain compact source-only evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/probes/h023
          cp "$work_dir/ixbrl-concept-report.json" \
            research/probes/h023/nse-shareholding-ixbrl-concepts-v1.json
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/probes/h023/nse-shareholding-ixbrl-concepts-v1.json
          if ! git diff --cached --quiet; then
            git commit -m "H023: anchor ownership iXBRL concept audit [skip ci]"
            git push origin HEAD:research/h023-ownership-source-probe-v1-20260914
          fi
      - name: Upload raw official source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h023-ownership-ixbrl-concept-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/h023-ownership-ixbrl-concept
          if-no-files-found: error
          retention-days: 90
