name: H021 weekly consensus capture

on:
  workflow_dispatch:
  schedule:
    # Redundant post-close attempts at 18:15, 18:45 and 19:15 Asia/Kolkata.
    # The frozen NSE calendar still decides whether today is the final
    # completed cash-market session of the week. Redundancy protects the
    # immutable weekly capture from a missed GitHub scheduled event.
    - cron: '45 12 * * 1-5'
    - cron: '15 13 * * 1-5'
    - cron: '45 13 * * 1-5'

permissions:
  contents: write

concurrency:
  group: h021-weekly-consensus-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate H021 acquisition and sealing invariants
        run: |
          pytest -q \
            tests/test_h021_stockanalysis_parser.py \
            tests/test_h021_stockanalysis_acquisition.py \
            tests/test_h021_weekly_calendar_contract.py \
            tests/test_h021_capture_draft.py \
            tests/test_h021_capture_sealing.py \
            tests/test_h021.py \
            tests/test_h021_compare_cli.py \
            tests/test_dr001_h021_gate.py \
            tests/test_dr001_post_h021.py \
            tests/test_alpha_expectations.py

      - name: Resolve India date and weekly session gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          CAPTURE_DATE="$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo('Asia/Kolkata')).date().isoformat())
          PY
          )"
          WORK="reports/h021-weekly-acquisition/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$WORK"
          python scripts/check_h021_weekly_session.py \
            --capture-date "$CAPTURE_DATE" \
            --calendar research/prospective/calendars/FY27-Q2-2026-09-06/NSE-CM-FY27Q2-v1.json \
            --out "$WORK/session-decision.json"
          STATE="$(python - "$WORK/session-decision.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          print(payload['state'])
          PY
          )"
          if [ "$STATE" = "CAPTURE" ]; then
            git fetch origin main
            CAPTURE_PATH="research/prospective/h021/captures/${CAPTURE_DATE}-full-u001-v1.manifest.json"
            if git cat-file -e "origin/main:${CAPTURE_PATH}" 2>/dev/null; then
              STATE="ALREADY_CAPTURED"
              echo "H021 weekly capture already anchored on origin/main: ${CAPTURE_PATH}"
            fi
          fi
          echo "capture_date=$CAPTURE_DATE" >> "$GITHUB_OUTPUT"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "work_dir=$WORK" >> "$GITHUB_OUTPUT"
          echo "H021 weekly gate: date=$CAPTURE_DATE state=$STATE"

      - name: Acquire frozen U001 consensus observations
        if: steps.gate.outputs.state == 'CAPTURE'
        shell: bash
        run: |
          set -euo pipefail
          WORK="${{ steps.gate.outputs.work_dir }}"
          python scripts/acquire_h021_weekly_capture.py \
            --capture-date "${{ steps.gate.outputs.capture_date }}" \
            --universe research/prospective/universes/FY27-Q2-2026-09-06.json \
            --batches research/prospective/h021/capture-batches-v1.json \
            --anchor research/prospective/h021/captures/2026-09-11-full-u001-v1.json.gz \
            --config research/prospective/h021/weekly-acquisition-v1.json \
            --out-draft "$WORK/capture-draft.json" \
            --out-evidence "$WORK/source-evidence.json"

      - name: Seal immutable H021 capture
        if: steps.gate.outputs.state == 'CAPTURE'
        shell: bash
        run: |
          set -euo pipefail
          CAPTURE_DATE="${{ steps.gate.outputs.capture_date }}"
          WORK="${{ steps.gate.outputs.work_dir }}"
          python scripts/seal_h021_capture.py \
            --draft "$WORK/capture-draft.json" \
            --universe research/prospective/universes/FY27-Q2-2026-09-06.json \
            --batches research/prospective/h021/capture-batches-v1.json \
            --out-dir research/prospective/h021/captures
          # Preserve exact machine-sealed bytes in the workflow artifact before
          # any later Git race can prevent the repository anchor.
          cp "research/prospective/h021/captures/${CAPTURE_DATE}-full-u001-v1.json.gz" \
            "$WORK/sealed-capture.json.gz"
          cp "research/prospective/h021/captures/${CAPTURE_DATE}-full-u001-v1.manifest.json" \
            "$WORK/sealed-capture.manifest.json"
          cp "research/prospective/h021/captures/${CAPTURE_DATE}-full-u001-v1.md" \
            "$WORK/sealed-capture.md"

      - name: Build primary revision cohort when the frozen window exists
        if: steps.gate.outputs.state == 'CAPTURE'
        shell: bash
        run: |
          set -euo pipefail
          CAPTURE_DATE="${{ steps.gate.outputs.capture_date }}"
          if [[ "$CAPTURE_DATE" < "2026-10-09" ]]; then
            echo "No H021 primary comparison is permitted before 2026-10-09"
            exit 0
          fi
          mkdir -p research/prospective/h021/comparisons
          python scripts/compare_h021_captures.py \
            --capture-dir research/prospective/h021/captures \
            --current "research/prospective/h021/captures/${CAPTURE_DATE}-full-u001-v1.json.gz" \
            --out "research/prospective/h021/comparisons/${CAPTURE_DATE}-primary-revision-v1.json"

      - name: Materialize DR001 Tier A H021 revision gate
        if: steps.gate.outputs.state == 'CAPTURE'
        shell: bash
        run: |
          set -euo pipefail
          CAPTURE_DATE="${{ steps.gate.outputs.capture_date }}"
          if [[ "$CAPTURE_DATE" < "2026-10-09" ]]; then
            echo "No DR001 Tier A H021 gate is permitted before 2026-10-09"
            exit 0
          fi
          python scripts/materialize_dr001_h021_gate.py \
            --dossiers research/company-dossiers/2026-10-03/dr001-tier-a-v1.json \
            --comparison "research/prospective/h021/comparisons/${CAPTURE_DATE}-primary-revision-v1.json" \
            --out "research/prospective/dr001-h021/gates/${CAPTURE_DATE}-tier-a-gate-v1.json"

      - name: Materialize DR001 post-H021 evidence pack
        if: steps.gate.outputs.state == 'CAPTURE'
        shell: bash
        run: |
          set -euo pipefail
          CAPTURE_DATE="${{ steps.gate.outputs.capture_date }}"
          if [[ "$CAPTURE_DATE" < "2026-10-09" ]]; then
            echo "No DR001 post-H021 evidence pack is permitted before 2026-10-09"
            exit 0
          fi
          python scripts/materialize_dr001_post_h021_pack.py \
            --pre-evidence research/dr001/dr001-pre-h021-evidence-2026-10-04-v1.json \
            --comparison "research/prospective/h021/comparisons/${CAPTURE_DATE}-primary-revision-v1.json" \
            --gate "research/prospective/dr001-h021/gates/${CAPTURE_DATE}-tier-a-gate-v1.json" \
            --out "research/prospective/dr001-h021/evidence-packs/${CAPTURE_DATE}-tier-a-evidence-v1.json"

      - name: Materialize AE001 H021 expectations features when comparison exists
        if: steps.gate.outputs.state == 'CAPTURE'
        shell: bash
        run: |
          set -euo pipefail
          CAPTURE_DATE="${{ steps.gate.outputs.capture_date }}"
          if [[ "$CAPTURE_DATE" < "2026-10-09" ]]; then
            echo "No AE001 H021 expectations artifact is permitted before 2026-10-09"
            exit 0
          fi
          python scripts/materialize_ae001_h021_expectations.py \
            --capture-dir research/prospective/h021/captures \
            --current "research/prospective/h021/captures/${CAPTURE_DATE}-full-u001-v1.json.gz" \
            --comparison "research/prospective/h021/comparisons/${CAPTURE_DATE}-primary-revision-v1.json" \
            --universe research/prospective/universes/FY27-Q2-2026-09-06.json \
            --batches research/prospective/h021/capture-batches-v1.json \
            --calendar research/prospective/calendars/FY27-Q2-2026-09-06/NSE-CM-FY27Q2-v1.json \
            --out "research/prospective/ae001-h021/expectations/${CAPTURE_DATE}-v1.json"

      - name: Refuse to anchor observations if frozen H021 inputs changed
        if: steps.gate.outputs.state == 'CAPTURE'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          START_SHA="${GITHUB_SHA}"
          CURRENT_MAIN="$(git rev-parse origin/main)"
          CRITICAL_PATHS=(
            ".github/workflows/h021-weekly-consensus-capture.yml"
            "pyproject.toml"
            "research/H021_PROSPECTIVE_PROTOCOL_V1.md"
            "research/H021_COMPARISON_CONTRACT_V1.md"
            "research/H021_WEEKLY_ACQUISITION_CONTRACT_V1.md"
            "research/AE001_H021_EXPECTATIONS_FEATURE_FAMILY_V1.md"
            "research/DR001_H021_TIER_A_GATE_V1.md"
            "research/DR001_POST_H021_EVIDENCE_PACK_V1.md"
            "research/dr001/dr001-pre-h021-evidence-2026-10-04-v1.json"
            "research/company-dossiers/2026-10-03/dr001-tier-a-v1.json"
            "registry/ae001_h021_expectations_family.yaml"
            "research/prospective/h021"
            "research/prospective/ae001-h021"
            "research/prospective/dr001-h021"
            "research/prospective/universes/FY27-Q2-2026-09-06.json"
            "research/prospective/calendars/FY27-Q2-2026-09-06/NSE-CM-FY27Q2-v1.json"
            "scripts/check_h021_weekly_session.py"
            "scripts/acquire_h021_weekly_capture.py"
            "scripts/seal_h021_capture.py"
            "scripts/compare_h021_captures.py"
            "scripts/materialize_ae001_h021_expectations.py"
            "scripts/materialize_dr001_h021_gate.py"
            "scripts/materialize_dr001_post_h021_pack.py"
            "src/marketlab/dr001_h021_gate.py"
            "src/marketlab/dr001_post_h021.py"
            "src/marketlab/h021.py"
            "src/marketlab/alpha_expectations.py"
            "src/marketlab/h021_capture.py"
            "src/marketlab/h021_stockanalysis_acquisition.py"
            "src/marketlab/h021_stockanalysis_parser.py"
          )
          if [ "$START_SHA" != "$CURRENT_MAIN" ]; then
            CHANGED="$(git diff --name-only "$START_SHA" "$CURRENT_MAIN" -- "${CRITICAL_PATHS[@]}")"
            if [ -n "$CHANGED" ]; then
              echo "frozen H021 inputs changed during acquisition; refusing to anchor observations"
              echo "start=$START_SHA current_main=$CURRENT_MAIN"
              printf '%s\n' "$CHANGED"
              exit 1
            fi
            echo "main moved only outside frozen H021 inputs; fast-forwarding before anchor"
            echo "start=$START_SHA current_main=$CURRENT_MAIN"
            git merge --ff-only origin/main
          fi

      - name: Anchor immutable capture and source evidence
        if: steps.gate.outputs.state == 'CAPTURE'
        shell: bash
        run: |
          set -euo pipefail
          CAPTURE_DATE="${{ steps.gate.outputs.capture_date }}"
          WORK="${{ steps.gate.outputs.work_dir }}"
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add \
            research/prospective/h021/captures \
            research/prospective/ae001-h021 \
            research/prospective/dr001-h021 \
            "$WORK/session-decision.json" \
            "$WORK/source-evidence.json"
          if [ -d research/prospective/h021/comparisons ]; then
            git add research/prospective/h021/comparisons
          fi
          if git diff --cached --quiet; then
            echo "No new H021 weekly evidence to anchor"
            exit 0
          fi
          git commit -m "H021: seal weekly consensus capture ${CAPTURE_DATE} [skip ci]"

          ANCHOR_BASE_SHA="$(git rev-parse HEAD^)"
          CRITICAL_PATHS=(
            ".github/workflows/h021-weekly-consensus-capture.yml"
            "pyproject.toml"
            "research/H021_PROSPECTIVE_PROTOCOL_V1.md"
            "research/H021_COMPARISON_CONTRACT_V1.md"
            "research/H021_WEEKLY_ACQUISITION_CONTRACT_V1.md"
            "research/AE001_H021_EXPECTATIONS_FEATURE_FAMILY_V1.md"
            "research/DR001_H021_TIER_A_GATE_V1.md"
            "research/DR001_POST_H021_EVIDENCE_PACK_V1.md"
            "research/dr001/dr001-pre-h021-evidence-2026-10-04-v1.json"
            "research/company-dossiers/2026-10-03/dr001-tier-a-v1.json"
            "registry/ae001_h021_expectations_family.yaml"
            "research/prospective/h021"
            "research/prospective/ae001-h021"
            "research/prospective/dr001-h021"
            "research/prospective/universes/FY27-Q2-2026-09-06.json"
            "research/prospective/calendars/FY27-Q2-2026-09-06/NSE-CM-FY27Q2-v1.json"
            "scripts/check_h021_weekly_session.py"
            "scripts/acquire_h021_weekly_capture.py"
            "scripts/seal_h021_capture.py"
            "scripts/compare_h021_captures.py"
            "scripts/materialize_ae001_h021_expectations.py"
            "scripts/materialize_dr001_h021_gate.py"
            "scripts/materialize_dr001_post_h021_pack.py"
            "src/marketlab/dr001_h021_gate.py"
            "src/marketlab/dr001_post_h021.py"
            "src/marketlab/h021.py"
            "src/marketlab/h021_capture.py"
            "src/marketlab/h021_stockanalysis_acquisition.py"
            "src/marketlab/h021_stockanalysis_parser.py"
            "src/marketlab/alpha_expectations.py"
          )
          for ATTEMPT in 1 2 3; do
            git fetch origin main
            CURRENT_MAIN="$(git rev-parse origin/main)"
            if [ "$ANCHOR_BASE_SHA" != "$CURRENT_MAIN" ]; then
              if ! git diff --quiet "$ANCHOR_BASE_SHA" "$CURRENT_MAIN" -- "${CRITICAL_PATHS[@]}"; then
                echo "frozen H021/AE001 expectations state changed before anchor push"
                git diff --stat "$ANCHOR_BASE_SHA" "$CURRENT_MAIN" -- "${CRITICAL_PATHS[@]}"
                exit 1
              fi
              git rebase origin/main
              ANCHOR_BASE_SHA="$CURRENT_MAIN"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((ATTEMPT * 2))
          done
          echo "unable to anchor H021/AE001 expectations evidence after bounded retries"
          exit 1

      - name: Upload acquisition evidence
        if: always() && steps.gate.outputs.state == 'CAPTURE'
        uses: actions/upload-artifact@v4
        with:
          name: h021-weekly-consensus-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.gate.outputs.work_dir }}
          if-no-files-found: error
          retention-days: 90

      - name: Report no-capture day
        if: steps.gate.outputs.state != 'CAPTURE'
        run: |
          echo "No H021 capture today: ${{ steps.gate.outputs.state }}"
