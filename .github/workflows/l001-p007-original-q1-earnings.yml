name: L001 P007 original quarterly earnings quality

on:
  pull_request:
    paths:
      - src/marketlab/l001_p007_earnings_components.py
      - scripts/materialize_l001_p007_q1_earnings.py
      - tests/test_l001_p007_earnings_components.py
      - .github/workflows/l001-p007-original-q1-earnings.yml

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and validate semantic guards
        run: |
          python -m pip install -e '.[dev]'
          ruff check src/marketlab/l001_p007_earnings_components.py scripts/materialize_l001_p007_q1_earnings.py tests/test_l001_p007_earnings_components.py
          pytest -q tests/test_l001_p007_earnings_components.py
      - name: Download verified all-company original source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/12111414537/zip" \
            --output "$RUNNER_TEMP/p004-verified.zip"
          unzip -j "$RUNNER_TEMP/p004-verified.zip" \
            l001-p004-all100-original-audit.json -d "$RUNNER_TEMP"
          unzip -j "$RUNNER_TEMP/p004-verified.zip" \
            l001-p004-original-300-source-files.zip -d "$RUNNER_TEMP"
      - name: Replay 100 original issuer Q1 income statements
        run: |
          python scripts/materialize_l001_p007_q1_earnings.py \
            --p004-report "$RUNNER_TEMP/l001-p004-all100-original-audit.json" \
            --xml-zip "$RUNNER_TEMP/l001-p004-original-300-source-files.zip" \
            --output "$RUNNER_TEMP/l001-p007-original-q1-other-income-100.json" \
            | tee "$RUNNER_TEMP/l001-p007-summary.json"
      - name: Publish source-original earnings diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: l001-p007-original-100-q1-income-components
          path: |
            ${{ runner.temp }}/l001-p007-original-q1-other-income-100.json
            ${{ runner.temp }}/l001-p007-summary.json
          retention-days: 90
