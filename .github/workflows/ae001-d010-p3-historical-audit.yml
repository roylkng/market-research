name: AE001 D010 P3 historical source audit

on:
  push:
    branches:
      - feat/ae001-d010-cash-borrow-flow-source-20261001

permissions:
  contents: read

jobs:
  diagnostic:
    if: contains(github.event.head_commit.message, '[ae001-d010-p3]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify frozen D010 P3 implementation
        run: |
          ruff check \
            src/marketlab/alpha_d010_p3.py \
            scripts/run_ae001_d010_p3.py \
            tests/test_alpha_d010_p3.py
          pytest -q \
            tests/test_alpha_d010_sources.py \
            tests/test_alpha_d010_p1.py \
            tests/test_alpha_d010_p2.py \
            tests/test_alpha_d010_p3.py

      - name: Run full historical source coverage and identity audit
        run: |
          python scripts/run_ae001_d010_p3.py \
            --output reports/ae001-d010-p3 \
            --attempts 4 \
            --timeout-seconds 30

      - name: Print compact result
        run: |
          cat reports/ae001-d010-p3/manifest.json
          cat reports/ae001-d010-p3/report.json

      - name: Upload exact P3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae001-d010-p3-${{ github.run_id }}
          path: reports/ae001-d010-p3
          if-no-files-found: warn
          retention-days: 90
