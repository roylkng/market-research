name: H024 current PIT-GG source probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/h024-insider-source-probe-v1-20260915
    paths:
      - '.github/workflows/h024-pit-gg-source-probe.yml'
      - 'scripts/probe_h024_nse_pit_gg.py'

permissions:
  contents: write

concurrency:
  group: h024-pit-gg-source-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint current-source probe
        run: ruff check scripts/probe_h024_nse_pit_gg.py
      - name: Audit current post-May PIT discovery feed
        shell: bash
        run: |
          set -euo pipefail
          WORK="reports/h024-pit-gg-source-probe/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$WORK/raw"
          python scripts/probe_h024_nse_pit_gg.py \
            --universe research/prospective/universes/FY27-Q2-2026-09-06.json \
            --from-date 2026-05-01 \
            --to-date 2026-09-15 \
            --out "$WORK/report.json" \
            --raw-dir "$WORK/raw" \
            --window-days 28 \
            --attempts 4 \
            --pause-seconds 0.15
          echo "work_dir=$WORK" >> "$GITHUB_ENV"
      - name: Retain compact current-source inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/probes/h024
          cp "$work_dir/report.json" \
            research/probes/h024/nse-pit-gg-source-inventory-v1.json
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/probes/h024/nse-pit-gg-source-inventory-v1.json
          if ! git diff --cached --quiet; then
            git commit -m "H024: anchor current PIT-GG source inventory"
            git push origin HEAD:research/h024-insider-source-probe-v1-20260915
          fi
      - name: Upload exact current-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h024-pit-gg-source-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/h024-pit-gg-source-probe
          if-no-files-found: error
          retention-days: 90
