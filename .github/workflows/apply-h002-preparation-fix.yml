name: Apply H002 preparation coverage corrections

on:
  push:
    branches:
      - fix/h002-preparation-terminal-nosignal
    paths:
      - .github/workflows/apply-h002-preparation-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Apply deterministic source transformation
        run: |
          python scripts/_apply_h002_preparation_fix.py
          rm scripts/_apply_h002_preparation_fix.py
          rm .github/workflows/apply-h002-preparation-fix.yml
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
      - name: Validate frozen contracts
        run: make validate
      - name: Diff sanity
        run: git diff --check
      - name: Commit validated implementation
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add -A
          git commit -m "Freeze terminal NO_SIGNAL preparation semantics"
          git push origin "HEAD:${GITHUB_REF_NAME}"
