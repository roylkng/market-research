name: HG009 P026 original NSE 300-company sector identifiability

on:
  push:
    branches:
      - research/hg009-p026-300-sector-coverage-identifiability-20261021
    paths:
      - .github/workflows/hg009-p026-sector.yml
      - src/marketlab/hg009_p026_sector_coverage.py
      - scripts/materialize_hg009_p026_sector.py
      - tests/test_hg009_p026_sector_coverage.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hg009-p026-postentry-original-nse-sector
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact MarketLab research contracts
        run: python -m pip install -e '.[dev]'
      - name: Replay NSE Oct16 original 755-row industry source, no future returns
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_hg009_p026_sector.py
          python scripts/materialize_hg009_p026_sector.py --check
          ruff check src/marketlab/hg009_p026_sector_coverage.py scripts/materialize_hg009_p026_sector.py tests/test_hg009_p026_sector_coverage.py
          pytest -q tests/test_hg009_p026_sector_coverage.py
      - name: Preserve signed missing-sector disclosure on original 300 companies
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/hg009/hg009-p026-postentry-sector-coverage-v1.json
          if git diff --cached --quiet; then
            echo "Original Oct16 industry coverage already sealed"
            exit 0
          fi
          git commit -m "HG009 P026: seal real NSE 300-company sector coverage failure [skip ci]"
          git fetch origin research/hg009-p026-300-sector-coverage-identifiability-20261021
          git rebase origin/research/hg009-p026-300-sector-coverage-identifiability-20261021
          python scripts/materialize_hg009_p026_sector.py --check
          git push origin HEAD:research/hg009-p026-300-sector-coverage-identifiability-20261021
