name: H002-HR002 six-quarter Phase A

on:
  push:
    branches:
      - work/h002-historical-replay-v1-20260907
    paths:
      - registry/h002_historical_replay_v2_rule.yaml
      - src/marketlab/h002_historical_v2.py
      - src/marketlab/h002_historical_calendar.py
      - src/marketlab/h002_historical_identity.py
      - scripts/run_h002_historical_replay_v2r2.py
      - scripts/run_h002_historical_replay_v2r3.py
      - .github/workflows/h002-historical-v2-phase-a.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h002-hr002-phase-a
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/h002-historical-replay-v1-20260907
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint full HR002 path
        run: |
          ruff check \
            src/marketlab/h002_historical_v2.py \
            src/marketlab/h002_historical_calendar.py \
            src/marketlab/h002_historical_identity.py \
            scripts/run_h002_historical_replay_v2r2.py \
            scripts/run_h002_historical_replay_v2r3.py \
            tests/test_h002_historical_v2.py \
            tests/test_h002_historical_calendar.py \
            tests/test_h002_historical_identity.py
      - name: Test HR002 contracts
        run: |
          pytest -q \
            tests/test_h002_historical_v2.py \
            tests/test_h002_historical_calendar.py \
            tests/test_h002_historical_identity.py

  pilot:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/h002-historical-replay-v1-20260907
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run five-company 30-observation pilot
        run: |
          python scripts/run_h002_historical_replay_v2r3.py \
            --limit 5 \
            --attempts 5 \
            --timeout 25 \
            --sleep 0.05 \
            --store .marketlab-historical-replay-v2-pilot \
            --output /tmp/h002-hr002-pilot.json
      - name: Validate pilot integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          doc = json.loads(Path('/tmp/h002-hr002-pilot.json').read_text())
          if doc.get('outcome_data_included') is not False:
              raise SystemExit('HR002 Phase A unexpectedly contains outcomes')
          if doc.get('observation_count') != 30:
              raise SystemExit(f"expected 30 pilot observations, got {doc.get('observation_count')}")
          errors = int(doc.get('status_counts', {}).get('ERROR', 0))
          if errors:
              for record in doc.get('records', []):
                  if record.get('status') == 'ERROR':
                      print(record.get('symbol'), record.get('quarter_id'), record.get('reason'))
              raise SystemExit(f'HR002 pilot has {errors} ERROR observations')
          print('pilot_manifest', doc['manifest_sha256'])
          print('status_counts', json.dumps(doc['status_counts'], sort_keys=True))
          print('signal_bucket_counts', json.dumps(doc['signal_bucket_counts'], sort_keys=True))
          PY
      - name: Upload pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h002-hr002-phase-a-pilot
          path: |
            .marketlab-historical-replay-v2-pilot
            /tmp/h002-hr002-pilot.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

  full:
    needs: pilot
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/h002-historical-replay-v1-20260907
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Capture all 600 pre-registered historical signals
        run: |
          python scripts/run_h002_historical_replay_v2r3.py \
            --attempts 5 \
            --timeout 25 \
            --sleep 0.05 \
            --store .marketlab-historical-replay-v2 \
            --output research/historical/h002/H002-HR002/phase-a/fixed-u001-six-quarter-signals.json
      - name: Validate frozen 600-observation manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path('research/historical/h002/H002-HR002/phase-a/fixed-u001-six-quarter-signals.json')
          doc = json.loads(path.read_text())
          declared = doc.pop('manifest_sha256')
          encoded = json.dumps(
              doc,
              sort_keys=True,
              separators=(',', ':'),
              ensure_ascii=False,
              allow_nan=False,
          ).encode()
          actual = hashlib.sha256(encoded).hexdigest()
          if actual != declared:
              raise SystemExit(f'manifest hash mismatch: {declared} != {actual}')
          if doc.get('observation_count') != 600:
              raise SystemExit(f"expected 600 observations, got {doc.get('observation_count')}")
          if doc.get('outcome_data_included') is not False:
              raise SystemExit('Phase A contains outcome data')
          errors = int(doc.get('status_counts', {}).get('ERROR', 0))
          if errors:
              for record in doc.get('records', []):
                  if record.get('status') == 'ERROR':
                      print(record.get('symbol'), record.get('quarter_id'), record.get('reason'))
              raise SystemExit(f'HR002 Phase A has {errors} ERROR observations')
          print('manifest_sha256', declared)
          print('status_counts', json.dumps(doc['status_counts'], sort_keys=True))
          print('signal_bucket_counts', json.dumps(doc['signal_bucket_counts'], sort_keys=True))
          print('quarter_status_counts', json.dumps(doc['quarter_status_counts'], sort_keys=True))
          PY
      - name: Upload exact Phase-A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h002-hr002-phase-a-evidence
          path: |
            .marketlab-historical-replay-v2
            research/historical/h002/H002-HR002/phase-a/fixed-u001-six-quarter-signals.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
      - name: Commit frozen Phase-A manifest
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git pull --rebase origin work/h002-historical-replay-v1-20260907
          git add research/historical/h002/H002-HR002/phase-a/fixed-u001-six-quarter-signals.json
          if git diff --cached --quiet; then
            echo "HR002 Phase-A manifest unchanged"
            exit 0
          fi
          git commit -m "H002-HR002: freeze six-quarter historical signals"
          git push origin HEAD:work/h002-historical-replay-v1-20260907
