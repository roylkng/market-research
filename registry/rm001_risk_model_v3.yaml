schema_version: 1
id: RM001-v3-DEVELOPMENT
name: transparent_plus_statistical_residual_equity_risk_model
status: DEVELOPMENT_CHALLENGER
created: 2026-10-02
live_capital_allowed: false

parent_model: RM001-v2-DEVELOPMENT

named_factor_names:
  - MARKET_COMMON
  - BETA60_RELATIVE
  - MOMENTUM20
  - VOLATILITY60
  - LIQUIDITY
  - SIZE

statistical_factor_names:
  - STAT_PC01
  - STAT_PC02
  - STAT_PC03
  - STAT_PC04
  - STAT_PC05

statistical:
  source: RM001_V2_REALIZED_RESIDUAL_HISTORY
  trailing_realized_sessions: 120
  component_count: 5
  basis_estimation_sessions: 120
  risk_estimation_sessions: 60
  minimum_complete_current_identities: 500
  missing_residual_policy: no_imputation
  current_incomplete_identity_policy: preserve_v2_idio_and_zero_stat_exposures
