name: AE001 D010 P4A sealed-source replay

on:
  push:
    branches:
      - feat/ae001-d010-p4-feature-semantics-20261001

permissions:
  contents: read
  actions: read

jobs:
  replay:
    if: contains(github.event.head_commit.message, '[ae001-d010-p4a-replay]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Download sealed original P4 evidence
        uses: actions/download-artifact@v4
        with:
          name: ae001-d010-p4-36888897172
          path: evidence/original-p4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: roylkng/market-research
          run-id: 36888897172

      - name: Replay P4A from exact sealed source inputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from marketlab.alpha_d010_p4 import (
              augment_feature_panel_with_d010,
              summarize_p4,
          )
          from marketlab.alpha_history import (
              canonical_gzip_json,
              load_canonical_gzip_json,
          )
          from marketlab.events import sha256_bytes

          root = Path("evidence/original-p4")

          def one(name):
              matches = list(root.rglob(name))
              if len(matches) != 1:
                  raise SystemExit(f"expected one {name}, got {matches}")
              return matches[0]

          market_path = one("market-panel.json.gz")
          base_path = one("action-safe-feature-panel.json.gz")
          short_path = one("short-panel.json.gz")
          slb_path = one("slb-panel.json.gz")

          market = load_canonical_gzip_json(market_path.read_bytes())
          base = load_canonical_gzip_json(base_path.read_bytes())
          short = load_canonical_gzip_json(short_path.read_bytes())
          slb = load_canonical_gzip_json(slb_path.read_bytes())

          expected = {
              "base": "e81f85974b8692fd2f20f628dd97752184d158da18cf07ebea94e4e84ff02caa",
              "short": "6490b8bced422542564aeaf78e29b11fea596e8d5c0e5b3058964093edb62236",
              "slb": "f9d1353afb2b24f3eb63049380af00a2de022c8bc54b430e159eb58effc2b2b5",
          }
          if base["panel_sha256"] != expected["base"]:
              raise SystemExit("original P4 base panel hash mismatch")
          if short["panel_sha256"] != expected["short"]:
              raise SystemExit("original P4 short panel hash mismatch")
          if slb["panel_sha256"] != expected["slb"]:
              raise SystemExit("original P4 SLB panel hash mismatch")

          augmented = augment_feature_panel_with_d010(
              feature_panel=base,
              market_panel=market,
              short_panel=short,
              slb_panel=slb,
          )
          report = summarize_p4(augmented)

          old_names = {
              "short_volume_share_zscore_20",
              "slb_outstanding_zscore_20",
          }
          definitions = {row["name"] for row in augmented["feature_definitions"]}
          if old_names & definitions:
              raise SystemExit("P4A replay retained removed zscore feature")
          for name in (
              "short_volume_share_percentile_20",
              "slb_outstanding_percentile_20",
          ):
              stats = report["feature_stats"][name]
              if stats["min"] is None or stats["max"] is None:
                  raise SystemExit(f"P4A replay missing {name}")
              if stats["min"] < 0.0 or stats["max"] > 1.0:
                  raise SystemExit(f"P4A replay {name} escaped [0,1]")

          out = Path("reports/p4a-replay")
          out.mkdir(parents=True, exist_ok=True)
          data = canonical_gzip_json(augmented)
          (out / "d010-p4a-feature-panel.json.gz").write_bytes(data)
          (out / "report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          manifest = {
              "schema_version": 1,
              "diagnostic_id": "AE001-D010-P4A-v1",
              "source_run_id": 36888897172,
              "source_artifact_id": 11176118037,
              "market_panel_sha256": market["panel_sha256"],
              "base_feature_panel_sha256": base["panel_sha256"],
              "short_source_panel_sha256": short["panel_sha256"],
              "slb_source_panel_sha256": slb["panel_sha256"],
              "p4a_feature_panel_sha256": augmented["panel_sha256"],
              "p4a_feature_artifact_sha256": sha256_bytes(data),
              "p4a_report_sha256": report["report_sha256"],
              "feature_count": report["feature_count"],
              "feature_session_count": report["feature_session_count"],
              "feature_row_count": report["feature_row_count"],
              "status": report["status"],
              "return_labels_opened": False,
              "model_fit_performed": False,
              "live_capital_allowed": False,
          }
          (out / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, sort_keys=True))
          print(json.dumps({
              name: report["feature_stats"][name]
              for name in (
                  "short_volume_share_percentile_20",
                  "slb_outstanding_percentile_20",
              )
          }, sort_keys=True))
          PY

      - name: Upload exact P4A replay
        uses: actions/upload-artifact@v4
        with:
          name: ae001-d010-p4a-replay-${{ github.run_id }}
          path: reports/p4a-replay
          retention-days: 90
