source:
  corpus: H003-E002 complete transcript candidate report
  report_commit: 2682d91a2be0dc3b69876ef397791515ff9146f2
  report_path: research/prospective/h003/FY27-Q2-2026-09-06/candidates-e002-full-sharded/report.json
  report_sha256: cb48b1e18c76a3ea2d06b13383955c0f0c6efa6d3d65bd132ac3d5e59217ffea
  extraction_rule_id: H003-E002
  extraction_rule_sha256: 5aff200d6a2222a7cde972ad341bc43b927d9c5b6d26a58766893980515c24a2
