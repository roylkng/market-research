name: H003-V001 semantic review triage view

on:
  push:
    branches:
      - run/h003-v001-blind-review-20260907
    paths:
      - .github/workflows/h003-v001-triage-view.yml

permissions:
  contents: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/h003-v001-blind-review-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build hash-bound triage view
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('research/prospective/h003/FY27-Q2-2026-09-06/review-v001')
          compact_root = root / 'compact'
          out = root / 'triage'
          out.mkdir(parents=True, exist_ok=True)

          def h(value):
              return hashlib.sha256(json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False, allow_nan=False).encode()).hexdigest()

          compact_manifest = json.loads((compact_root / 'manifest.json').read_text(encoding='utf-8'))
          unsigned_manifest = dict(compact_manifest)
          declared = unsigned_manifest.pop('manifest_sha256')
          if h(unsigned_manifest) != declared:
              raise SystemExit('compact manifest hash mismatch')

          entries = []
          total = 0
          for source_entry in compact_manifest['chunks']:
              docs = json.loads((compact_root / source_entry['file']).read_text(encoding='utf-8'))
              if h(docs) != source_entry['compact_sha256']:
                  raise SystemExit(f"compact chunk hash mismatch: {source_entry['file']}")
              triage = []
              for item in docs:
                  context = item['context']
                  excerpt = item['excerpt']
                  # Choose nearest distinct context lines around the excerpt. If exact line matching is broken by PDF wrapping,
                  # retain the first/last context lines as conservative orientation rather than inventing text.
                  before = context[0] if context else ''
                  after = context[-1] if context else ''
                  lowered_excerpt = ' '.join(excerpt.split()).casefold()
                  for idx, line in enumerate(context):
                      line_norm = ' '.join(line.split())
                      if line_norm and (line_norm.casefold() in lowered_excerpt or lowered_excerpt in line_norm.casefold()):
                          before = context[max(0, idx - 1)] if idx > 0 else ''
                          after = context[idx + 1] if idx + 1 < len(context) else ''
                          break
                  triage.append({
                      'candidate_id': item['candidate_id'],
                      'excerpt': excerpt,
                      'before': before,
                      'after': after,
                      'future': item['future_markers'],
                      'deadline': item['deadline_markers'],
                      'quant': item['quantitative_tokens'],
                      'domain': item['domain_markers'],
                  })
              (out / source_entry['file']).write_text(json.dumps(triage, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
              entries.append({
                  'file': source_entry['file'],
                  'candidate_count': len(triage),
                  'source_compact_sha256': source_entry['compact_sha256'],
                  'triage_sha256': h(triage),
              })
              total += len(triage)
          unsigned = {
              'schema_version': 1,
              'source_compact_manifest_sha256': declared,
              'candidate_count': total,
              'chunk_count': len(entries),
              'chunks': entries,
          }
          manifest = {**unsigned, 'manifest_sha256': h(unsigned)}
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY
      - name: Anchor triage view
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git rm .github/workflows/h003-v001-triage-view.yml
          git add research/prospective/h003/FY27-Q2-2026-09-06/review-v001/triage
          git commit -m "Anchor H003-V001 semantic review triage view"
          git push origin HEAD:run/h003-v001-blind-review-20260907
