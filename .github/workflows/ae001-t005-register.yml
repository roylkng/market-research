name: AE001 T005 protocol amendment P2

on:
  push:
    branches:
      - feat/ae001-futures-positioning-features-20260930

permissions:
  contents: write

jobs:
  register:
    if: contains(github.event.head_commit.message, '[amend-t005-p2]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Append frozen T005 P2 amendment
        shell: bash
        run: |
          set -euo pipefail
          RECORDED_AT="$(date -u +'%Y-%m-%dT%H:%M:%S+00:00')"
          python scripts/append_ae001_trial_event.py \
            --ledger research/ae001/trial-ledger.json \
            --event-type TRIAL_PROTOCOL_AMENDED \
            --trial-id AE001-T005 \
            --recorded-at-utc "$RECORDED_AT" \
            --payload research/ae001/t005-p2-payload.json

      - name: Commit canonical ledger
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/ae001/trial-ledger.json
          git commit -m "research: append AE001 T005 P2 before outcomes [skip ci]"
          git push origin HEAD:feat/ae001-futures-positioning-features-20260930
