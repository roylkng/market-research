name: CC001 SEAMEC investment underwriting sources
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/cc001_seamec_underwriting*.py'
      - 'tests/test_cc001_seamec_underwriting*.py'
      - 'research/company_cases/seamec/2026-11-09.md'
      - '.github/workflows/cc001-underwriting-case.yml'
permissions:
  contents: read
jobs:
  capture-company-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Capture issuer filings and dated price without altering production state
        run: python scripts/cc001_seamec_underwriting_capture.py --workspace /tmp/cc001-seamec-underwriting
      - name: Verify exact originals and reproduce dated underwriting arithmetic
        run: python scripts/cc001_seamec_underwriting.py --evidence /tmp/cc001-seamec-underwriting --output /tmp/cc001-seamec-underwriting/underwriting.json
      - name: Retain exact case implementation and source commit
        if: always()
        run: |
          mkdir -p /tmp/cc001-seamec-underwriting/implementation/scripts /tmp/cc001-seamec-underwriting/implementation/tests
          cp scripts/cc001_seamec_underwriting*.py /tmp/cc001-seamec-underwriting/implementation/scripts/
          cp tests/test_cc001_seamec_underwriting*.py /tmp/cc001-seamec-underwriting/implementation/tests/
          cp research/company_cases/seamec/2026-11-09.md /tmp/cc001-seamec-underwriting/implementation/
          cp .github/workflows/cc001-underwriting-case.yml /tmp/cc001-seamec-underwriting/implementation/
          git rev-parse HEAD > /tmp/cc001-seamec-underwriting/implementation/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cc001-seamec-underwriting-originals
          path: /tmp/cc001-seamec-underwriting
          retention-days: 14
          if-no-files-found: error
