name: H019 official annual-report source and survivorship audit

on:
  push:
    branches:
      - research/h019-fundamental-inflection-source-audit-20260909
    paths:
      - .github/workflows/h019-annual-report-source-audit.yml
      - scripts/h019_annual_report_feasibility.py
      - research/H019_SOURCE_AUDIT_V2_ANNUAL_REPORTS.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h019-fundamental-inflection-source-audit-20260909
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repository environment
        run: python -m pip install -e '.[dev]'
      - name: Verify source-only contract
        run: |
          ruff check --fix scripts/h019_annual_report_feasibility.py
          ruff check scripts/h019_annual_report_feasibility.py
          python -m py_compile scripts/h019_annual_report_feasibility.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('scripts/h019_annual_report_feasibility.py').read_text(encoding='utf-8').casefold()
          forbidden = (
              'marketdata', 'bhavcopy', 'nifty500', 'gross_excess', 'net_excess',
              'future_return', 'stock_return', 'selected.csv', 'challenge-summary',
          )
          for token in forbidden:
              assert token not in text, token
          print('H019 annual-report audit contains no market-outcome path')
          PY
      - name: Run frozen annual-report source audit
        run: |
          rm -rf /tmp/h019-annual-report-audit
          python scripts/h019_annual_report_feasibility.py --out /tmp/h019-annual-report-audit
          test -s /tmp/h019-annual-report-audit/source-audit-v2-summary.json
          test -s /tmp/h019-annual-report-audit/historical-symbol-samples.json
          test -s /tmp/h019-annual-report-audit/annual-report-api-manifest.json
          test -s /tmp/h019-annual-report-audit/annual-report-content-sample.json
      - name: Upload H019 annual-report audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h019-annual-report-source-audit-${{ github.run_id }}
          path: /tmp/h019-annual-report-audit
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
