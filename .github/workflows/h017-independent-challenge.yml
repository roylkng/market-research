name: H017 independent momentum-low-volatility challenge

on:
  push:
    branches:
      - research/h005-result-repricing-ranker-v1-20260908
    paths:
      - .github/workflows/h017-independent-challenge.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h005-result-repricing-ranker-v1-20260908
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen research environment
        run: python -m pip install -e '.[dev]'
      - name: Normalize only H017 runner formatting before first outcome
        run: |
          ruff check --fix scripts/run_h017_momentum_low_volatility.py
          ruff format scripts/run_h017_momentum_low_volatility.py
          ruff check scripts/run_h017_momentum_low_volatility.py
          if ! git diff --quiet -- scripts/run_h017_momentum_low_volatility.py; then
            git config user.name "marketlab-research-bot"
            git config user.email "marketlab-research-bot@users.noreply.github.com"
            git add scripts/run_h017_momentum_low_volatility.py
            git commit -m "style: normalize frozen H017 runner"
            git push origin HEAD:research/h005-result-repricing-ranker-v1-20260908
          fi
      - name: Verify repository before first H017 outcome
        run: |
          ruff check scripts/run_h017_momentum_low_volatility.py
          ruff check src tests scripts
          pytest -q
          marketlab validate-registry registry/hypotheses.yaml
      - name: Run frozen H017 challenge
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/h017-independent
          mkdir -p /tmp/h017-independent
          python scripts/run_h017_momentum_low_volatility.py --out /tmp/h017-independent \
            | tee /tmp/h017-independent/run.log
          test -s /tmp/h017-independent/point-in-time-selections.json
          test -s /tmp/h017-independent/challenge-summary.json
          test -s /tmp/h017-independent/selected.csv
      - name: Upload H017 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h017-independent-challenge-results
          path: |
            /tmp/h017-independent/point-in-time-selections.json
            /tmp/h017-independent/challenge-summary.json
            /tmp/h017-independent/selected.csv
            /tmp/h017-independent/market-acquisition-diagnostics.json
            /tmp/h017-independent/market-source-manifest.json
            /tmp/h017-independent/source-manifest.json
            /tmp/h017-independent/run.log
          retention-days: 30
      - name: Upload retained official source bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h017-independent-challenge-sources
          path: /tmp/h017-independent/raw
          retention-days: 30
          compression-level: 0
