name: HG009 freeze 100 full-market research companies

on:
  push:
    branches:
      - research/hg009-d001-full-market-100-experiment-20261014
    paths:
      - .github/workflows/hg009-freeze-100.yml
      - src/marketlab/hg009_100.py
      - scripts/materialize_hg009_100.py
      - tests/test_hg009_100.py
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: hg009-freeze-100-source-archive
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen MarketLab parser and validation
        run: python -m pip install -e '.[dev]'
      - name: Acquire exactly October 5 frozen HG001 original artifact, not latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hg009-source
          gh run download 37258053642 \
            --repo "$GITHUB_REPOSITORY" \
            --name hg001-d001-37258053642 \
            --dir /tmp/hg009-source
          test -s /tmp/hg009-source/hg001-d001-router.json
          echo "Pinned HG001 original October 5 source recovered"
      - name: Freeze source archive and deterministic 100 selected companies
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_hg009_100.py \
            --source /tmp/hg009-source/hg001-d001-router.json \
            --archived-original research/hg009/original-hg001-d001-router-20261005.json.gz \
            --output research/hg009/hg009-d001-100-experimental-companies-v1.json
          python scripts/materialize_hg009_100.py --check
          ruff check src/marketlab/hg009_100.py scripts/materialize_hg009_100.py tests/test_hg009_100.py
          pytest -q tests/test_hg009_100.py
      - name: Publish original bytes and 100-name cohort without altering historical studies
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/hg009/original-hg001-d001-router-20261005.json.gz \
                  research/hg009/hg009-d001-100-experimental-companies-v1.json
          if git diff --cached --quiet; then
            echo "HG009 source and 100 cohort already sealed"
            exit 0
          fi
          git commit -m "HG009: retain original 2319-name source and seal 100-name experiment [skip ci]"
          git fetch origin research/hg009-d001-full-market-100-experiment-20261014
          git rebase origin/research/hg009-d001-full-market-100-experiment-20261014
          python scripts/materialize_hg009_100.py --check
          git push origin HEAD:research/hg009-d001-full-market-100-experiment-20261014
