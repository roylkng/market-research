name: H002 historical replay v1 frozen verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-frozen-hr001:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/h002-historical-replay-v1-20260907
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify immutable HR001 Phase-A dependency
        run: |
          python - <<'PY'
          from marketlab.h002_historical_outcomes import load_phase_a_manifest

          path = (
              'research/historical/h002/H002-HR001/phase-a/'
              'fixed-u001-transport-signals.json'
          )
          doc = load_phase_a_manifest(
              path,
              expected_sha256='2062e21ee1b1cbcd86d758ae3cf9ef9aeb43664c629ca5eb7a22cd885068ef98',
          )
          if doc.get('phase') != 'A_SIGNAL_CAPTURE_ONLY':
              raise SystemExit('unexpected HR001 phase')
          if doc.get('outcome_data_included') is not False:
              raise SystemExit('HR001 Phase A contains outcome data')
          if doc.get('observation_count') != 200:
              raise SystemExit(f"expected 200 HR001 observations, got {doc.get('observation_count')}")
          if int(doc.get('status_counts', {}).get('ERROR', 0)):
              raise SystemExit('frozen HR001 Phase A contains ERROR observations')
          print('manifest_sha256', doc['manifest_sha256'])
          print('status_counts', doc['status_counts'])
          print('signal_bucket_counts', doc['signal_bucket_counts'])
          PY
