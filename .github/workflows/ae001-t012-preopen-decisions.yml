name: AE001 T012 causal pre-open decisions

on:
  workflow_dispatch:
  schedule:
    # UTC: D 20:30/23:00 IST, next N 05:45/06:30/07:45 IST.
    # The observed source/decision timestamp, not cron, controls eligibility.
    - cron: '0 15 * * 1-5'
    - cron: '30 17 * * 1-5'
    - cron: '15 0 * * 1-5'
    - cron: '0 1 * * 1-5'
    - cron: '15 2 * * 1-5'

permissions:
  contents: write

concurrency:
  group: ae001-t012-preopen-decisions
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load canonical main, refuse queued frozen-rule changes
        shell: bash
        run: |
          set -euo pipefail
          EVENT_SHA="$GITHUB_SHA"
          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          FROZEN_PATHS=(
            ".github/workflows/ae001-t012-preopen-decisions.yml"
            "registry/ae001_t012_preopen_futures.yaml"
            "research/AE001_T012_PROSPECTIVE_PREOPEN_FUTURES_FREEZE_20261013.md"
            "research/prospective/calendars/FY27-Q2-2026-09-06/NSE-CM-FY27Q2-v1.json"
            "research/prospective/ae001-t006/frozen-models-v1.json"
            "src/marketlab/alpha_t012_preopen.py"
            "src/marketlab/alpha_t012_decisions.py"
            "scripts/score_ae001_t012_preopen.py"
            "scripts/verify_ae001_t012_decisions.py"
          )
          if [ "$EVENT_SHA" != "$MAIN_SHA" ]; then
            if ! git diff --quiet "$EVENT_SHA" "$MAIN_SHA" -- "$FROZEN_PATHS"; then
              echo "Frozen T012 rules changed after scheduling; fail closed"
              exit 1
            fi
          fi
          git checkout --detach "$MAIN_SHA"
          echo "DECISION_BASE_SHA=$MAIN_SHA" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Test prospective and frozen source gates
        shell: bash
        run: |
          set -euo pipefail
          ruff check src/marketlab/alpha_t012_preopen.py src/marketlab/alpha_t012_decisions.py scripts/score_ae001_t012_preopen.py scripts/verify_ae001_t012_decisions.py tests/test_alpha_t012_preopen.py tests/test_alpha_t012_decisions.py
          pytest -q tests/test_alpha_t012_preopen.py tests/test_alpha_t012_decisions.py
          python scripts/verify_ae001_t012_decisions.py

      - name: Compute D-only predictions and reseal at actual completion
        shell: bash
        run: |
          set -euo pipefail
          WORK="reports/ae001-t012-preopen/run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$WORK"
          python scripts/score_ae001_t012_preopen.py --work-dir "$WORK" --attempts 4 --timeout-seconds 30 | tee "$WORK/score.log"
          python scripts/verify_ae001_t012_decisions.py

      - name: Remotely anchor decision before N pre-open or fail closed
        shell: bash
        run: |
          set -euo pipefail
          LEDGER="research/prospective/ae001-t012/decision-ledger.json"
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add "$LEDGER"
          if [ -d research/prospective/ae001-t012/decisions ]; then
            git add research/prospective/ae001-t012/decisions
          fi
          if git diff --cached --quiet; then
            echo "No new T012 decision to anchor"
            exit 0
          fi
          assert_anchor_window() {
            python - <<'PY'
          import json
          from datetime import UTC, datetime, timedelta
          from marketlab.alpha_sc003_preopen import preopen_cutoff_utc
          with open("research/prospective/ae001-t012/decision-ledger.json", encoding="utf-8") as handle:
              ledger = json.load(handle)
          cutoff = preopen_cutoff_utc(ledger["decisions"][-1]["entry_session"])
          if datetime.now(UTC) >= cutoff - timedelta(seconds=120):
              raise SystemExit("T012 anchoring safety window missed; no backfill or late push")
          print("T012 remote anchoring margin valid until:", cutoff.isoformat())
          PY
          }
          assert_anchor_window
          git commit -m "AE001 T012: seal prospective pre-open decision [skip ci]"
          FROZEN_PATHS=(
            ".github/workflows/ae001-t012-preopen-decisions.yml"
            "registry/ae001_t012_preopen_futures.yaml"
            "research/AE001_T012_PROSPECTIVE_PREOPEN_FUTURES_FREEZE_20261013.md"
            "research/prospective/calendars/FY27-Q2-2026-09-06/NSE-CM-FY27Q2-v1.json"
            "research/prospective/ae001-t006/frozen-models-v1.json"
            "research/ae001/trial-ledger.json"
            "research/rta001-trials-v1.json"
            "src/marketlab/alpha_t012_preopen.py"
            "src/marketlab/alpha_t012_decisions.py"
            "scripts/score_ae001_t012_preopen.py"
            "scripts/verify_ae001_t012_decisions.py"
          )
          for RETRY in 1 2 3; do
            assert_anchor_window
            git fetch origin main
            NEW_MAIN="$(git rev-parse origin/main)"
            if [ "$DECISION_BASE_SHA" != "$NEW_MAIN" ]; then
              if ! git diff --quiet "$DECISION_BASE_SHA" "$NEW_MAIN" -- "$FROZEN_PATHS"; then
                echo "T012 frozen protocol/model/registration drift during scoring"
                exit 1
              fi
              git rebase origin/main
              python scripts/verify_ae001_t012_decisions.py
            fi
            assert_anchor_window
            if git push origin HEAD:main; then
              echo "T012 prospective decision remotely anchored"
              exit 0
            fi
            sleep "$((RETRY * 2))"
          done
          echo "T012 remote anchoring failed, decision unregistered"
          exit 1

      - name: Upload diagnostics, not as scientific evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae001-t012-preopen-operational-log
          path: reports/ae001-t012-preopen
          retention-days: 90
          if-no-files-found: warn
