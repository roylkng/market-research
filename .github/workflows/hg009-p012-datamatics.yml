name: HG009 P012 original Datamatics audited FY26 PDF replay

on:
  push:
    branches:
      - research/hg009-p012-datamatics-original-cash-investment-replay-20261015
    paths:
      - .github/workflows/hg009-p012-datamatics.yml
      - src/marketlab/hg009_p012_datamatics_cash.py
      - scripts/materialize_hg009_p012_datamatics.py
      - tests/test_hg009_p012_datamatics_cash.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hg009-p012-original-audited-datamatics-cash-replay
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original NSE PDF source parser
        run: python -m pip install -e '.[dev]'
      - name: Replay only archived source-backed reported FY26 balance and cash
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_hg009_p012_datamatics.py
          python scripts/materialize_hg009_p012_datamatics.py --check
          ruff check src/marketlab/hg009_p012_datamatics_cash.py scripts/materialize_hg009_p012_datamatics.py tests/test_hg009_p012_datamatics_cash.py
          pytest -q tests/test_hg009_p012_datamatics_cash.py
      - name: Preserve immutable first-source economic-cash diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/hg009/hg009-p012-datamatics-fy26-cash-bridge-v1.json
          if git diff --cached --quiet; then
            echo "Original Datamatics source-specific P012 already frozen"
            exit 0
          fi
          git commit -m "HG009 P012: seal archived original Datamatics cash investment bridge [skip ci]"
          git fetch origin research/hg009-p012-datamatics-original-cash-investment-replay-20261015
          git rebase origin/research/hg009-p012-datamatics-original-cash-investment-replay-20261015
          python scripts/materialize_hg009_p012_datamatics.py --check
          git push origin HEAD:research/hg009-p012-datamatics-original-cash-investment-replay-20261015
      - name: Diagnostic extract of audited original cashflow row coordinates on failure
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import gzip,io
          from pathlib import Path
          from pypdf import PdfReader
          p=Path("research/hg009/p009-originals/DATAMATICS/f96ecf4e698b4ee311126479fa20de0e7021449efc50cffa28a069dde40e8c77.pdf.gz")
          raw=gzip.decompress(p.read_bytes())
          pdf=PdfReader(io.BytesIO(raw))
          for page in (6,7):
              print("SOURCE PAGE",page)
              content=pdf.pages[page].extract_text(extraction_mode="layout") or ""
              for line in content.splitlines():
                  if any(keyword in line.casefold() for keyword in ("cash flow","lease liabilities","investments","cash equivalents","net cash","borrowings","dividend","fixed assets","interest received","interest paid","acquisition")):
                      print(repr(line[:340]))
          PY
