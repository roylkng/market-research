name: HG003 D001 cohort thread gate

on:
  push:
    branches:
      - research/hg003-event-thread-gate-20261005

permissions:
  actions: read
  contents: read

jobs:
  select:
    if: contains(github.event.head_commit.message, '[hg003-d001]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate frozen HG003 selector
        run: |
          ruff check \
            src/marketlab/hg003_threads.py \
            scripts/materialize_hg003_threads.py \
            tests/test_hg003_threads.py
          pytest -q \
            tests/test_hg003_threads.py \
            tests/test_ss002_l001_p2.py \
            tests/test_ss002_llm_contract.py
      - name: Download exact HG002 cohort
        uses: actions/download-artifact@v4
        with:
          name: hg002-d001-37260536415
          path: reports/hg002-source
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37260536415
      - name: Download exact P2 event census
        uses: actions/download-artifact@v4
        with:
          name: ss002-d001-p2-37203696204
          path: reports/p2-source
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37203696204
      - name: Download exact D3 text corpus
        uses: actions/download-artifact@v4
        with:
          name: ss002-d003-37213853198
          path: reports/d3-source
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37213853198
      - name: Verify exact sources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          hg = json.loads(Path("reports/hg002-source/hg002-d001-cohort.json").read_text())
          p2 = json.loads(Path("reports/p2-source/ss002-d001-census.json").read_text())
          d3 = json.loads(Path("reports/d3-source/ss002-d003-text-corpus.json").read_text())

          assert hg["cohort_sha256"] == "3937b8cb83ef819ff956af4afebb80cd81d8ef233c1e4dd5b6d3688541a48db1"
          assert p2["census_sha256"] == "ad2722cf2d3605614ae892636f35e44759ec42e5951b4680f0ed270bd1b51071"
          assert d3["corpus_sha256"] == "92d785de20af9bcca370c13a9d410fe98f0728518527285fa15d1490dadd32ce"
          assert hg["cohort_count"] == 28
          assert hg["return_outcomes_opened"] is False
          assert p2["return_outcomes_opened"] is False
          assert d3["return_outcomes_opened"] is False
          PY
      - name: Materialize frozen cohort thread selection
        run: |
          mkdir -p reports/hg003-d001
          python scripts/materialize_hg003_threads.py \
            --hg002 reports/hg002-source/hg002-d001-cohort.json \
            --p2-census reports/p2-source/ss002-d001-census.json \
            --d3-corpus reports/d3-source/ss002-d003-text-corpus.json \
            --documents-dir reports/d3-source/documents \
            --output reports/hg003-d001
      - name: Prove frozen selection expectations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(
              Path("reports/hg003-d001/hg003-d001-thread-selection.json").read_text()
          )
          assert p["selection_id"] == "HG003-D001-v1"
          assert p["symbol_count"] == 28
          assert p["thread_count"] == 35
          assert p["selection_state_counts"] == {
              "TEXT_READY": 34,
              "TEXT_UNAVAILABLE": 1,
          }
          assert p["unresolved_thread_ids"] == ["HINDCOPPER::OFFER_FOR_SALE"]
          assert p["feasibility_pass"] is True
          assert p["return_outcomes_opened"] is False
          assert p["portfolio_eligibility_allowed"] is False
          print(json.dumps({
              "selection_sha256": p["selection_sha256"],
              "symbol_count": p["symbol_count"],
              "thread_count": p["thread_count"],
              "selection_state_counts": p["selection_state_counts"],
              "unresolved_thread_ids": p["unresolved_thread_ids"],
              "promotion_allowed_to_cohort_l001": p["promotion_allowed_to_cohort_l001"],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload exact HG003 selection
        uses: actions/upload-artifact@v4
        with:
          name: hg003-d001-${{ github.run_id }}
          path: reports/hg003-d001
          if-no-files-found: error
          retention-days: 90
