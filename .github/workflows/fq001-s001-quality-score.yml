name: FQ001 S001 accounting quality score

on:
  push:
    branches:
      - research/fq001-quality-source-feasibility-20261004

permissions:
  actions: read
  contents: read

jobs:
  score:
    if: contains(github.event.head_commit.message, '[fq001-s001]')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate frozen S001 implementation
        run: |
          ruff check \
            src/marketlab/fundamental_quality_score.py \
            scripts/materialize_fq001_quality_score.py \
            tests/test_fundamental_quality_score.py
          pytest -q tests/test_fundamental_quality_score.py

      - name: Download exact frozen P2 source artifact
        uses: actions/download-artifact@v4
        with:
          name: fq001-d001-37178986667
          path: reports/fq001-p2
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37178986667

      - name: Materialize frozen quality score
        run: |
          python scripts/materialize_fq001_quality_score.py \
            --panel reports/fq001-p2/fq001-d001-panel.json \
            --out reports/fq001-s001/quality-score-v1.json

      - name: Prove research-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("reports/fq001-s001/quality-score-v1.json").read_text()
          )
          assert result["source_panel_sha256"] == (
              "12aabded6da20d660966fdd9ab0bfd6487dc612137628c2f0b2bbde3d3135f70"
          )
          assert result["return_outcomes_opened"] is False
          assert result["model_fitted"] is False
          assert result["portfolio_eligibility_allowed"] is False
          assert result["live_capital_allowed"] is False
          assert (
              result["scored_count"]
              + result["quality_prerequisite_failed_count"]
              + result["source_unavailable_count"]
              == 100
          )
          print(json.dumps({
              "score_sha256": result["score_sha256"],
              "scored_count": result["scored_count"],
              "quality_prerequisite_failed_count": result[
                  "quality_prerequisite_failed_count"
              ],
              "source_unavailable_count": result["source_unavailable_count"],
              "top_quality_quartile_cutoff": result[
                  "top_quality_quartile_cutoff"
              ],
              "top_quality_quartile_count": result[
                  "top_quality_quartile_count"
              ],
              "top_25": [
                  {
                      "rank": row["quality_rank"],
                      "symbol": row["symbol"],
                      "quality_score": row["quality_score"],
                  }
                  for row in result["scored"][:25]
              ],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload frozen S001 score
        uses: actions/upload-artifact@v4
        with:
          name: fq001-s001-${{ github.run_id }}
          path: reports/fq001-s001
          if-no-files-found: error
          retention-days: 90
