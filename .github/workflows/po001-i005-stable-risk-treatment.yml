name: PO001 I005 stable RM001-v3 risk treatment

on:
  push:
    branches:
      - feat/po001-i005-stable-risk-treatment-20261002

permissions:
  contents: read

jobs:
  study:
    if: contains(github.event.head_commit.message, '[po001-i005]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify I005 implementation
        run: |
          ruff check \
            src/marketlab/po001_i005.py \
            scripts/run_po001_i005.py \
            tests/test_po001_i005.py
          pytest -q \
            tests/test_po001_i005.py \
            tests/test_po001_v4.py \
            tests/test_po001_s001.py

      - name: Run frozen I005 cross-risk evaluation
        run: |
          python scripts/run_po001_i005.py \
            --s001-report research/po001-i005/inputs/s001-replica-1-report.json.gz \
            --s001-manifest research/po001-i005/inputs/s001-replica-1-manifest.json \
            --control-risk research/po001-i003/inputs/i002-risk-state-legacy.json.gz \
            --treatment-risk research/po001-i004/inputs/rm001-v3-p001-risk-state.json.gz \
            --output reports/po001-i005/result.json

      - name: Print I005 result
        run: cat reports/po001-i005/result.json

      - name: Upload exact I005 result
        uses: actions/upload-artifact@v4
        with:
          name: po001-i005-${{ github.run_id }}
          path: reports/po001-i005/result.json
          if-no-files-found: error
          retention-days: 90
