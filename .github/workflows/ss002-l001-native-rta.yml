name: SS002 L001 native RTA001 rebuild
on:
  push:
    branches:
      - research/ss002-l001-native-pilot-run-20261005
permissions:
  contents: write
jobs:
  build:
    if: contains(github.event.head_commit.message, '[l001-native-rta]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Rebuild summary
        run: |
          python scripts/build_rta001_summary.py \
            --manifest research/rta001-trials-v1.json \
            --output research/rta001-summary-v1.json \
            --repo-root .
      - name: Commit summary
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/rta001-summary-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "RTA001: rebuild summary for L001 native pilot [skip ci]"
          git push origin HEAD:research/ss002-l001-native-pilot-run-20261005
