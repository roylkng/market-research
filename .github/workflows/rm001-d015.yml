name: RM001 D015 Nifty Total Market industry source feasibility

on:
  push:
    branches:
      - feat/rm001-d015-nifty-total-market-sector-source-20261002

permissions:
  contents: read

jobs:
  scan:
    if: contains(github.event.head_commit.message, '[rm001-d015]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify frozen D015 implementation before source access
        run: |
          ruff check \
            src/marketlab/rm001_d015.py \
            scripts/run_rm001_d015.py \
            tests/test_rm001_d015.py
          pytest -q tests/test_rm001_d015.py
          marketlab validate-registry registry/hypotheses.yaml

      - name: Run frozen source-only D015 scan
        run: |
          python scripts/run_rm001_d015.py \
            --raw-dir reports/rm001-d015/raw \
            --output reports/rm001-d015/report.json \
            --attempts 4 \
            --timeout-seconds 30

      - name: Print result
        run: cat reports/rm001-d015/report.json

      - name: Upload exact D015 source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rm001-d015-${{ github.run_id }}
          path: reports/rm001-d015
          if-no-files-found: warn
          retention-days: 90
