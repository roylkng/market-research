name: H003 content identity stabilization once

on:
  push:
    branches:
      - feat/h003-transcript-content-v1
    paths:
      - .github/workflows/h003-content-identity-fix2.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/h003-transcript-content-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove acquisition time from semantic content identity
        run: >-
          python -c "from pathlib import Path; p=Path('src/marketlab/h003_content.py'); t=p.read_text(); old='    payload.pop(\"content_id\", None)\n    return _canonical_hash(payload)\n'; new='    payload.pop(\"content_id\", None)\n    payload.pop(\"fetched_at_utc\", None)\n    return _canonical_hash(payload)\n'; assert old in t; p.write_text(t.replace(old,new,1))"
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest -q
      - name: Commit and remove one-shot workflow
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git rm .github/workflows/h003-content-identity-fix2.yml
          git add src tests
          git commit -m "Stabilize H003 content identity across re-fetches"
          git push origin HEAD:feat/h003-transcript-content-v1
