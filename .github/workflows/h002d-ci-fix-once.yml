name: H002-D CI fix once

on:
  push:
    branches:
      - feat/h002-prospective-runner-v1
    paths:
      - .github/workflows/h002d-ci-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/h002-prospective-runner-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Apply exact lint corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old!r}')
              target.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'src/marketlab/calendar_snapshot.py',
              'import json\nfrom dataclasses',
              'import json\nimport time as time_module\nfrom dataclasses',
          )
          replace(
              'src/marketlab/calendar_snapshot.py',
              '    try:\n        return datetime.strptime(value.strip(), "%d-%b-%Y").date()\n    except ValueError as exc:\n',
              '    try:\n        parsed = time_module.strptime(value.strip(), "%d-%b-%Y")\n        return date(parsed.tm_year, parsed.tm_mon, parsed.tm_mday)\n    except ValueError as exc:\n',
          )

          replace(
              'src/marketlab/frozen_bundle.py',
              'import json\nfrom dataclasses',
              'import json\nimport time\nfrom dataclasses',
          )
          replace(
              'src/marketlab/frozen_bundle.py',
              'from datetime import UTC, datetime',
              'from datetime import UTC, date, datetime',
          )
          replace(
              'src/marketlab/frozen_bundle.py',
              '    from datetime import date\n    import time\n\n',
              '',
          )

          replace(
              'src/marketlab/marketdata.py',
              'import os\nimport zipfile',
              'import os\nimport time\nimport zipfile',
          )
          replace(
              'src/marketlab/marketdata.py',
              'from marketlab.execution import PriceBar\nfrom marketlab.events import sha256_bytes',
              'from marketlab.events import sha256_bytes\nfrom marketlab.execution import PriceBar',
          )
          replace(
              'src/marketlab/marketdata.py',
              '                parsed_date = datetime.strptime(raw_date, fmt).date()\n                break',
              '                parsed = time.strptime(raw_date, fmt)\n                parsed_date = date(parsed.tm_year, parsed.tm_mon, parsed.tm_mday)\n                break',
          )
          replace(
              'src/marketlab/marketdata.py',
              '            return datetime.strptime(value.strip(), fmt).date()\n        except ValueError:',
              '            parsed = time.strptime(value.strip(), fmt)\n            return date(parsed.tm_year, parsed.tm_mon, parsed.tm_mday)\n        except ValueError:',
          )

          replace(
              'src/marketlab/prospective.py',
              'import os\nfrom collections',
              'import os\nimport time\nfrom collections',
          )
          replace(
              'src/marketlab/prospective.py',
              'from marketlab.preparation import _parse_exchange_timestamp',
              'from marketlab.preparation import PreparationError, _parse_exchange_timestamp',
          )
          replace(
              'src/marketlab/prospective.py',
              '    last_error: Exception | None = None',
              '    last_error: PreparationError | None = None',
          )
          replace(
              'src/marketlab/prospective.py',
              '        except Exception as exc:\n            last_error = exc',
              '        except PreparationError as exc:\n            last_error = exc',
          )
          replace(
              'src/marketlab/prospective.py',
              '            return datetime.strptime(value.strip(), fmt).date()\n        except ValueError:',
              '            parsed = time.strptime(value.strip(), fmt)\n            return date(parsed.tm_year, parsed.tm_mon, parsed.tm_mday)\n        except ValueError:',
          )

          replace(
              'tests/test_marketdata.py',
              '    raw = (\n        "Index Name,Index Date,Open Index Value,High Index Value,Low Index Value,"\n        "Closing Index Value,Points Change,Change(%),Volume,Turnover (Rs. Cr.),P/E,P/B,Div Yield\\n"\n        "Nifty 50,04-09-2026,23910.9,24005.75,23895.85,23897.7,24.25,.1,1,2,3,4,5\\n"\n        "Nifty200 Momentum 30,04-09-2026,30000,30100,29900,30050,1,.1,1,2,3,4,5\\n"\n    ).encode()',
              '    raw = (\n        b"Index Name,Index Date,Open Index Value,High Index Value,Low Index Value,"\n        b"Closing Index Value,Points Change,Change(%),Volume,Turnover (Rs. Cr.),P/E,P/B,Div Yield\\n"\n        b"Nifty 50,04-09-2026,23910.9,24005.75,23895.85,23897.7,24.25,.1,1,2,3,4,5\\n"\n        b"Nifty200 Momentum 30,04-09-2026,30000,30100,29900,30050,1,.1,1,2,3,4,5\\n"\n    )',
          )
          PY
          ruff check src tests --fix
          ruff check src tests
      - name: Remove one-shot workflow and commit fixes
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git rm .github/workflows/h002d-ci-fix-once.yml
          git add src tests
          git commit -m "Fix H002-D lint blockers"
          git push origin HEAD:feat/h002-prospective-runner-v1
