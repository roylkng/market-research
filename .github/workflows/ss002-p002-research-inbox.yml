name: SS002 P002 first daily research inbox

on:
  push:
    branches:
      - research/ss002-p002-daily-research-inbox-20261010

permissions:
  actions: read
  contents: read

jobs:
  materialize:
    if: contains(github.event.head_commit.message, '[ss002-p002]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test frozen source-only routing
        run: |
          ruff check src/marketlab/ss002_daily_research_inbox.py scripts/materialize_ss002_p002.py tests/test_ss002_daily_research_inbox.py
          pytest -q tests/test_ss002_daily_research_inbox.py tests/test_ss002_daily_capture.py
      - name: Download exact pre-event HG001 research context
        uses: actions/download-artifact@v4
        with:
          name: hg001-d001-37258053642
          path: reports/hg001-source
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37258053642
      - name: Materialize first four-day source inbox
        run: |
          python scripts/materialize_ss002_p002.py \
            --daily-capture-dir research/prospective/ss002-p001 \
            --hg001-router reports/hg001-source/hg001-d001-router.json \
            --out reports/ss002-p002
      - name: Verify complete source-only output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/ss002-p002/ss002-p002-inbox.json").read_text())
          assert p["inbox_id"]=="SS002-P002-v1"
          assert p["source_event_count"]==54
          assert p["current_eq_at_capture_event_count"]==36
          assert p["archival_or_unmatched_count"]==18
          assert p["source_only_gate_pass"] is True
          assert p["model_inference_executed"] is False
          assert p["economic_relevance_verified"] is False
          assert p["market_capitalization_calculated"] is False
          assert p["share_action_clearance_proven"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          print(json.dumps({
             "inbox_sha256":p["inbox_sha256"],
             "source_event_count":p["source_event_count"],
             "current_eq_at_capture_event_count":p["current_eq_at_capture_event_count"],
             "exact_hg001_identity_match_count":p["exact_hg001_identity_match_count"],
             "document_intake_ready_count":p["document_intake_ready_count"],
             "prior_governance_caution_event_count":p["prior_governance_caution_event_count"],
             "research_attention_state_counts":p["research_attention_state_counts"],
             "thread_count":p["thread_count"]
          },indent=2,sort_keys=True))
          PY
      - name: Upload exact source-only inbox
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss002-p002-${{ github.run_id }}
          path: reports/ss002-p002
          if-no-files-found: warn
          retention-days: 90
