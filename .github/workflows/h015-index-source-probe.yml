name: H015 official index fallback probe

on:
  push:
    branches:
      - research/h005-result-repricing-ranker-v1-20260908
    paths:
      - .github/workflows/h015-index-source-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h005-result-repricing-ranker-v1-20260908
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Fetch exact official NSE historical Nifty 500 row
        run: |
          mkdir -p /tmp/h015-index-probe
          python - <<'PY'
          import json
          from pathlib import Path
          from marketlab.nse import NSEClient, NSEEndpoint

          endpoint = NSEEndpoint(
              "historical_index",
              "https://www.nseindia.com/api/historical/indicesHistory",
          )
          client = NSEClient(timeout=20, attempts=4)
          payload, raw = client._json_get_with_raw(
              endpoint,
              params={
                  "indexType": "NIFTY 500",
                  "from": "19-06-2024",
                  "to": "19-06-2024",
              },
          )
          root = Path("/tmp/h015-index-probe")
          (root / "raw.json").write_bytes(raw)
          (root / "parsed.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: h015-official-index-fallback-probe
          path: /tmp/h015-index-probe
          retention-days: 30
