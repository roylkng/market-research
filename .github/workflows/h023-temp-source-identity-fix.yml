name: H023 temporary source identity fix

on:
  push:
    branches:
      - research/h023-prospective-v1-20260914
    paths:
      - '.github/workflows/h023-temp-source-identity-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h023-prospective-v1-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Separate stable filing identity from mutable master-row evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/marketlab/h023_prospective.py')
          text = path.read_text(encoding='utf-8')
          identity_line = '        "master_row_sha256": str(source["master_row_sha256"]),\n'
          if text.count(identity_line) != 1:
              raise SystemExit('unexpected H023 source identity payload shape')
          text = text.replace(identity_line, '')
          old = '''        existing = existing_by_id.get(source_id)\n        if existing is not None:\n            if existing["source"] != source:\n                raise H023ProspectiveError(\n                    f"{source_id}: source reappeared with different immutable identity"\n                )\n            continue\n'''
          new = '''        existing = existing_by_id.get(source_id)\n        if existing is not None:\n            continue\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected H023 source reappearance block')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Validate patched core
        run: |
          python -m pip install -e '.[dev]'
          ruff check src/marketlab/h023_prospective.py
      - name: Commit targeted source identity correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add src/marketlab/h023_prospective.py
          git commit -m "H023: separate stable source identity from row evidence"
          git push origin HEAD:research/h023-prospective-v1-20260914
