name: CC001 daily research operations
on:
  workflow_dispatch:
  schedule:
    - cron: '47 14 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cc001-daily-operations.yml'
      - 'src/marketlab/company_change_discovery.py'
      - 'src/marketlab/company_change_xbrl.py'
      - 'src/marketlab/company_change_comparisons.py'
      - 'src/marketlab/company_change_financials.py'
      - 'src/marketlab/company_change_underwriting.py'
      - 'src/marketlab/company_change_context.py'
      - 'src/marketlab/company_change_prices.py'
      - 'src/marketlab/company_change_context_quality.py'
      - 'src/marketlab/company_change_decisions.py'
      - 'src/marketlab/company_change_report_archive.py'
      - 'src/marketlab/company_change_news.py'
permissions:
  contents: write
concurrency:
  group: cc001-pilot-state
  cancel-in-progress: false
jobs:
  refresh-research-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Initialize runner workspace paths
        shell: bash
        run: |
          printf 'CC_WORKSPACE=%s/cc001-workspace\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CC_STATE=%s/cc001-state\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing dependencies
        run: python -m pip install -e '.[dev]'
      - name: Restore only the dedicated pilot state branch
        id: state
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git ls-remote --exit-code --heads origin cc001-state > "$RUNNER_TEMP/cc001-remote-ref"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch --depth=1 origin cc001-state
            git worktree add --detach "$CC_STATE" FETCH_HEAD
            test "$(cat "$CC_STATE/STATE_FORMAT")" = 'CC001-PILOT-STATE-v1'
            python -m marketlab.company_change_checkpoint restore --workspace "$CC_WORKSPACE" --archive "$CC_STATE/workspace.zip"
          elif [ "$status" -eq 2 ]; then
            git worktree add --detach "$CC_STATE" HEAD
            git -C "$CC_STATE" checkout --orphan cc001-state
            git -C "$CC_STATE" rm -rf .
            printf '%s\n' 'CC001-PILOT-STATE-v1' > "$CC_STATE/STATE_FORMAT"
            mkdir -p "$CC_WORKSPACE"
          else
            echo 'Unable to read state branch. Refusing to reinitialize an unknown workspace.' >&2
            exit 1
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Discover and process a bounded batch of original disclosures
        id: intake
        continue-on-error: true
        run: python -m marketlab.company_change_discovery --workspace "$CC_WORKSPACE" --days 7 --limit 40 --fetch
      - name: Export research desk and checkpoint durable state
        id: export_state
        if: always() && steps.state.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f "$CC_WORKSPACE/evidence.sqlite3"
          python -m marketlab.company_change_app --workspace "$CC_WORKSPACE" --export "$CC_STATE/research-desk.html"
          comparison_ok=true
          if ! python -m marketlab.company_change_comparisons --workspace "$CC_WORKSPACE" --output-prefix "$CC_STATE/business-changes"; then
            comparison_ok=false
          fi
          export CC_COMPARISON_OK="$comparison_ok"
          underwriting_ok=true
          if ! python -m marketlab.company_change_underwriting --workspace "$CC_WORKSPACE" --output-prefix "$CC_STATE/cash-underwriting"; then
            underwriting_ok=false
          fi
          export CC_UNDERWRITING_OK="$underwriting_ok"
          context_ok=true
          if ! python -m marketlab.company_change_context --workspace "$CC_WORKSPACE" --limit 3 --output-prefix "$CC_STATE/price-context"; then
            context_ok=false
          fi
          export CC_CONTEXT_OK="$context_ok"
          decision_ok=true
          if ! python -m marketlab.company_change_decisions --workspace "$CC_WORKSPACE" --output-prefix "$CC_STATE/decision-context"; then
            decision_ok=false
          fi
          export CC_DECISION_OK="$decision_ok"
          news_ok=true
          if ! python -m marketlab.company_change_news --workspace "$CC_WORKSPACE" --limit 4 --output-prefix "$CC_STATE/news-inbox"; then
            news_ok=false
          fi
          export CC_NEWS_OK="$news_ok"
          python -m marketlab.company_change_report_archive archive --workspace "$CC_WORKSPACE" --history "$CC_STATE/report-history"
          python -m marketlab.company_change_checkpoint save --workspace "$CC_WORKSPACE" --archive "$CC_STATE/workspace.zip" > "$CC_STATE/checkpoint.json.tmp"
          mv "$CC_STATE/checkpoint.json.tmp" "$CC_STATE/checkpoint.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from marketlab.company_change_discovery import coverage
          from marketlab.company_change_store import EvidenceStore
          business = json.loads(Path(os.environ['CC_STATE'], 'business-changes.json').read_text()) if os.environ['CC_COMPARISON_OK'] == 'true' else None
          underwriting = json.loads(Path(os.environ['CC_STATE'], 'cash-underwriting.json').read_text()) if os.environ['CC_UNDERWRITING_OK'] == 'true' else None
          context = json.loads(Path(os.environ['CC_STATE'], 'price-context.json').read_text()) if os.environ['CC_CONTEXT_OK'] == 'true' else None
          decision = json.loads(Path(os.environ['CC_STATE'], 'decision-context.json').read_text()) if os.environ['CC_DECISION_OK'] == 'true' else None
          news = json.loads(Path(os.environ['CC_STATE'], 'news-inbox.json').read_text()) if os.environ['CC_NEWS_OK'] == 'true' else None
          with EvidenceStore(Path(os.environ['CC_WORKSPACE'])) as store:
              snapshot = store.snapshot()
              latest = {'coverage': coverage(store), 'active_period_records': len(snapshot['active']),
                        'extraction_versions': len(snapshot['history']), 'recorded_at': snapshot['as_of'],
                        'unreviewed': sum(r['review_status'] == 'UNREVIEWED' for r in snapshot['active']),
                        'business_change_status': 'SUCCESS' if business else 'FAILED',
                        'business_change_counts': business['counts'] if business else None,
                        'business_change_sha256': business['report_sha256'] if business else None,
                        'cash_underwriting_status': 'SUCCESS' if underwriting else 'FAILED',
                        'cash_underwriting_counts': underwriting['counts'] if underwriting else None,
                        'cash_underwriting_sha256': underwriting['report_sha256'] if underwriting else None,
                        'news_reader_status': 'SUCCESS' if news else 'FAILED',
                        'news_reader_coverage': news['coverage'] if news else None,
                        'news_reader_sha256': news['report_sha256'] if news else None,
                        'decision_context_status': 'SUCCESS' if decision else 'FAILED',
                        'decision_context_counts': decision['counts'] if decision else None,
                        'decision_context_sha256': decision['report_sha256'] if decision else None,
                        'price_context_status': 'SUCCESS' if context else 'FAILED',
                        'price_context_issuers': len(context['cards']) if context else None,
                        'price_context_sha256': context['report_sha256'] if context else None,
                        'run_url': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
                        'source_commit': os.environ['GITHUB_SHA'], 'live_capital_allowed': False,
                        'model_endpoint_configured': False, 'validated_predictive_edge': False}
          Path(os.environ['CC_STATE'], 'latest.json').write_text(json.dumps(latest, indent=2) + '\n')
          print('CC001_OPERATIONS=' + json.dumps(latest))
          PY
          git -C "$CC_STATE" config user.name marketlab-research-bot
          git -C "$CC_STATE" config user.email marketlab-research-bot@users.noreply.github.com
          git -C "$CC_STATE" add STATE_FORMAT workspace.zip checkpoint.json latest.json research-desk.html
          if [ -d "$CC_STATE/report-history" ]; then
            git -C "$CC_STATE" add report-history
          fi
          if [ -f "$CC_STATE/business-changes.json" ] && [ -f "$CC_STATE/business-changes.html" ]; then
            git -C "$CC_STATE" add business-changes.json business-changes.html
          fi
          if [ -f "$CC_STATE/cash-underwriting.json" ] && [ -f "$CC_STATE/cash-underwriting.html" ]; then
            git -C "$CC_STATE" add cash-underwriting.json cash-underwriting.html
          fi
          if [ -f "$CC_STATE/price-context.json" ] && [ -f "$CC_STATE/price-context.html" ]; then
            git -C "$CC_STATE" add price-context.json price-context.html
          fi
          if [ -f "$CC_STATE/decision-context.json" ] && [ -f "$CC_STATE/decision-context.html" ]; then
            git -C "$CC_STATE" add decision-context.json decision-context.html
          fi
          if [ -f "$CC_STATE/news-inbox.json" ] && [ -f "$CC_STATE/news-inbox.html" ]; then
            git -C "$CC_STATE" add news-inbox.json news-inbox.html
          fi
          if ! git -C "$CC_STATE" diff --cached --quiet; then
            git -C "$CC_STATE" commit -m "CC001: persist bounded research workspace [skip ci]"
            git -C "$CC_STATE" push origin HEAD:refs/heads/cc001-state
          fi
          test "$comparison_ok" = true
          test "$underwriting_ok" = true
          test "$context_ok" = true
          test "$decision_ok" = true
          test "$news_ok" = true
      - uses: actions/upload-artifact@v4
        if: always() && steps.state.outputs.ready == 'true'
        with:
          name: cc001-daily-workspace
          path: |
            ${{ runner.temp }}/cc001-state/workspace.zip
            ${{ runner.temp }}/cc001-state/checkpoint.json
            ${{ runner.temp }}/cc001-state/latest.json
            ${{ runner.temp }}/cc001-state/research-desk.html
            ${{ runner.temp }}/cc001-state/business-changes.json
            ${{ runner.temp }}/cc001-state/business-changes.html
            ${{ runner.temp }}/cc001-state/cash-underwriting.json
            ${{ runner.temp }}/cc001-state/cash-underwriting.html
            ${{ runner.temp }}/cc001-state/price-context.json
            ${{ runner.temp }}/cc001-state/price-context.html
            ${{ runner.temp }}/cc001-state/decision-context.json
            ${{ runner.temp }}/cc001-state/decision-context.html
            ${{ runner.temp }}/cc001-state/report-history
            ${{ runner.temp }}/cc001-state/news-inbox.json
            ${{ runner.temp }}/cc001-state/news-inbox.html
          retention-days: 14
          if-no-files-found: error
      - name: Preserve uncheckpointed workspace on export failure
        if: always() && steps.state.outputs.ready == 'true' && steps.export_state.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cc001-uncheckpointed-recovery
          path: ${{ runner.temp }}/cc001-workspace
          retention-days: 14
          if-no-files-found: error
      - name: Surface partial intake failures after retaining evidence
        if: steps.intake.outcome == 'failure'
        run: exit 1
