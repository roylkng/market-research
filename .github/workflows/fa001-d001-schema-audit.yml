name: FA001 D001 financial and asset XBRL schema audit

on:
  push:
    branches:
      - research/fa001-full-market-financial-schema-20261004

permissions:
  contents: read

jobs:
  audit:
    if: contains(github.event.head_commit.message, '[fa001-d001]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate frozen FA001 implementation
        run: |
          ruff check \
            src/marketlab/fa001_schema_audit.py \
            scripts/run_fa001_d001.py \
            tests/test_fa001_schema_audit.py
          pytest -q \
            tests/test_fa001_schema_audit.py \
            tests/test_alpha_fundamental.py \
            tests/test_fundamental_quality.py
      - name: Run frozen 48-name schema audit
        run: |
          python scripts/run_fa001_d001.py \
            --sample research/fa001/fa001-d001-sample-v1.json \
            --raw-dir reports/fa001-d001/raw \
            --output reports/fa001-d001 \
            --attempts 4 \
            --timeout-seconds 25 \
            --pause-seconds 0.03
      - name: Prove outcome-blind source audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/fa001-d001/fa001-d001-audit.json").read_text())
          assert p["audit_id"]=="FA001-D001-v1"
          assert p["return_outcomes_opened"] is False
          assert p["model_fitted"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          print(json.dumps({
            "audit_sha256":p["audit_sha256"],
            "annual_ready_count":p["annual_ready_count"],
            "quarter_ready_count":p["quarter_ready_count"],
            "annual_core_assets_ready_count":p["annual_core_assets_ready_count"],
            "annual_borrowings_ready_count":p["annual_borrowings_ready_count"],
            "annual_investments_ready_count":p["annual_investments_ready_count"],
            "quarter_revenue_pat_ready_count":p["quarter_revenue_pat_ready_count"],
            "annual_family_counts":p["annual_family_counts"],
            "quarter_family_counts":p["quarter_family_counts"],
            "source_state_counts":p["source_state_counts"],
            "threshold_passes":p["threshold_passes"],
            "feasibility_pass":p["feasibility_pass"],
          },indent=2,sort_keys=True))
          PY
      - name: Upload exact FA001 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fa001-d001-${{ github.run_id }}
          path: reports/fa001-d001
          if-no-files-found: warn
          retention-days: 90
