name: H003-V001 source-header date redaction fix

on:
  push:
    branches:
      - fix/h003-v001-source-header-date-redaction
    paths:
      - .github/workflows/h003-v001-source-header-date-fix.yml
      - scripts/_one_shot_h003_header_date_fix.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/h003-v001-source-header-date-redaction
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/_one_shot_h003_header_date_fix.py
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts/build_h003_review_package.py --fix
      - run: ruff check src tests scripts/build_h003_review_package.py
      - run: pytest -q
      - run: make validate
      - name: Commit validated fix
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git rm .github/workflows/h003-v001-source-header-date-fix.yml scripts/_one_shot_h003_header_date_fix.py
          git add scripts/build_h003_review_package.py tests/test_h003_review_source_header_date_redaction.py
          git commit -m "Redact standalone source-header dates from H003 blind review"
          git push origin HEAD:fix/h003-v001-source-header-date-redaction
