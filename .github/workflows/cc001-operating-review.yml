name: CC001 decision-first operating review
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/cc001_operating_review.py'
      - 'tests/test_cc001_operating_review.py'
      - 'research/operations/carried-forward-decisions.json'
      - '.github/workflows/cc001-operating-review.yml'
permissions:
  contents: read
jobs:
  review-retained-research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Read one exact saved-state revision, not mixed latest files
        run: |
          set -euo pipefail
          git fetch --depth=1 origin cc001-state
          mkdir -p /tmp/cc001-operating-review/inputs /tmp/cc001-operating-review/results
          git rev-parse FETCH_HEAD > /tmp/cc001-operating-review/state-commit.txt
          for name in latest checkpoint business-changes cash-underwriting decision-context news-inbox; do
            git show "FETCH_HEAD:$name.json" > "/tmp/cc001-operating-review/inputs/$name.json"
          done
      - name: Produce bounded diligence queue and disclose incomplete coverage
        run: |
          python scripts/cc001_operating_review.py --reports /tmp/cc001-operating-review/inputs --decisions research/operations/carried-forward-decisions.json --output-prefix /tmp/cc001-operating-review/results/operating-review
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/cc001-operating-review/results/operating-review.json')
          r=json.loads(p.read_text())
          assert sum(r['lane_counts'].values())==r['funnel']['financial_issuers']
          assert len(r['next_diligence_batch'])<=5
          assert r['funnel']['new_buy_decisions']==0
          assert not r['validated_predictive_edge'] and not r['live_capital_allowed']
          assert all(not c['buy_approved'] for c in r['next_diligence_batch'])
          print(json.dumps({'funnel':r['funnel'],'health':r['health'],'report_sha256':r['report_sha256']}))
          PY
      - name: Retain exact audit implementation
        if: always()
        run: |
          BASE=/tmp/cc001-operating-review/implementation
          mkdir -p "$BASE/scripts" "$BASE/tests" "$BASE/research/operations" "$BASE/workflows"
          cp scripts/cc001_operating_review.py "$BASE/scripts/"
          cp tests/test_cc001_operating_review.py "$BASE/tests/"
          cp research/operations/carried-forward-decisions.json "$BASE/research/operations/"
          cp .github/workflows/cc001-operating-review.yml "$BASE/workflows/"
          git rev-parse HEAD > "$BASE/source-commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cc001-decision-first-review
          path: /tmp/cc001-operating-review
          retention-days: 14
          if-no-files-found: error
