name: H003 decisive exact-cutoff source scan

on:
  push:
    branches:
      - feat/h003-source-corpus-v1
    paths:
      - .github/workflows/h003-full-source-scan.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h003-full-source-coverage-v1
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      UNIVERSE: research/prospective/universes/FY27-Q2-2026-09-06.json
      OUT_DIR: run-out/h003-source-coverage
      DEST_DIR: research/prospective/h003/FY27-Q2-2026-09-06
      STORE: .marketlab
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/h003-source-corpus-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Validate code and frozen contracts before acquisition
        run: |
          ruff check src tests
          ruff check scripts/scan_h003_sources.py
          pytest -q
          make validate
      - name: Scan all 100 frozen U001 members
        run: |
          mkdir -p "$OUT_DIR" "$DEST_DIR"
          python scripts/scan_h003_sources.py \
            --universe "$UNIVERSE" \
            --store "$STORE" \
            --out "$OUT_DIR/source-coverage-v1.json" \
            --pause-seconds 0.20
      - name: Inspect measured coverage and build run metadata
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          out = Path(os.environ['OUT_DIR']) / 'source-coverage-v1.json'
          bundle = json.loads(out.read_text(encoding='utf-8'))
          records = bundle['records']
          distribution = sorted(
              ({'symbol': item['symbol'], 'source_count': item['source_count'], 'coverage_status': item['coverage_status']}
               for item in records),
              key=lambda item: (-item['source_count'], item['symbol']),
          )
          summary = {
              'cohort_id': bundle['cohort_id'],
              'member_count': bundle['member_count'],
              'complete_count': bundle['complete_count'],
              'complete_zero_source_count': bundle['complete_zero_source_count'],
              'incomplete_count': bundle['incomplete_count'],
              'transcript_source_count': bundle['transcript_source_count'],
              'bundle_sha256': bundle['bundle_sha256'],
              'companies_with_3plus_transcripts': sum(item['source_count'] >= 3 for item in records),
              'companies_with_6plus_transcripts': sum(item['source_count'] >= 6 for item in records),
              'source_count_distribution': distribution,
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          destination = Path(os.environ['DEST_DIR'])
          (destination / 'source-coverage-v1.json').write_text(out.read_text(encoding='utf-8'), encoding='utf-8')
          metadata = {
              'schema_version': 2,
              'rule_id': bundle['rule_id'],
              'rule_sha256': bundle['rule_sha256'],
              'cohort_id': bundle['cohort_id'],
              'decision_timestamp_utc': '2026-09-06T12:21:06.431463Z',
              'source_commit_sha': os.environ['GITHUB_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'anchored_at_utc': datetime.now(UTC).isoformat().replace('+00:00', 'Z'),
              **{key: value for key, value in summary.items() if key != 'source_count_distribution'},
          }
          (destination / 'source-coverage-run-metadata.json').write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          (destination / 'source-count-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
      - name: Commit externally anchored coverage bundle
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add "$DEST_DIR"
          git commit -m "Anchor exact-cutoff U001 H003 transcript source coverage v1"
          git push origin HEAD:feat/h003-source-corpus-v1
      - name: Preserve exact discovery bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h003-source-discovery-${{ github.run_id }}
          path: |
            .marketlab/h003-discovery
            run-out/h003-source-coverage
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
