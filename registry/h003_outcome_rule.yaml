evidence_eligibility:
  same_company_only: true
  strictly_after_claim_source_publication: true
  at_or_before_source_cutoff: true
  exchange_source_only: true
  source_hash_verification_required: true
  missing_later_mention_is_failure: false
  outside_web_or_manual_source_substitution_allowed: false
  price_return_benchmark_or_future_market_data_allowed: false
blind_review:
  company_identity_visible: false
  symbol_visible: false
  source_url_or_exchange_sequence_visible: false
  market_outcomes_visible: false
  original_normalized_commitment_visible: true
  original_timing_language_visible: true
  later_evidence_publication_dates_visible: true
  later_evidence_text_visible: true
  review_decisions_frozen_before_return_data_access: true
retrieval:
  method: DETERMINISTIC_LEXICAL_V1
  unit: PARAGRAPH_OR_3_LINE_WINDOW
  query_fields:
    - normalized_claim
    - metric
    - claim_type
    - unit
    - target_min
    - target_max
    - target_deadline
    - target_horizon
  tokenization: CASEFOLD_ALPHANUMERIC
  numeric_tokens_weight: 3.0
  metric_tokens_weight: 2.0
  other_query_tokens_weight: 1.0
  recency_tiebreak: EARLIER_SOURCE_FIRST
  max_passages_per_claim: 12
  max_passages_per_source: 2
  minimum_nonstopword_overlap: 1
  zero_match_behavior: EMPTY_EVIDENCE_PACKET
  retrieval_parameters_may_change_after_review: false
outcomes:
  allowed:
    - MET
    - PARTIAL
    - MISSED
    - LATE
    - UNRESOLVED
  MET: Later eligible evidence explicitly establishes that the frozen commitment was achieved within its applicable commitment horizon.
  PARTIAL: Later eligible evidence explicitly quantifies meaningful partial delivery while establishing that the full frozen commitment was not achieved within the applicable horizon.
  MISSED: Later eligible evidence explicitly establishes that the commitment period ended without achieving the frozen target, or management explicitly reports non-achievement at or after the applicable horizon.
  LATE: Later eligible evidence explicitly establishes achievement after the frozen commitment horizon or explicitly reports delay beyond it.
  UNRESOLVED: Evidence is insufficient, ambiguous, conflicting, not mature, conditionally inapplicable, or timing cannot be mapped without guessing.
  no_negative_inference_from_silence: true
  ambiguous_timing_forces_unresolved: true
  conflicting_evidence_forces_unresolved: true
horizon_policy:
  canonical_deadline_used_when_present: true
  natural_language_horizon_may_be_interpreted_only_if_unambiguous_from_literal_text_and_immutable_source_date: true
  interpretation_must_be_retained_with_decision: true
  otherwise: UNRESOLVED
  current_date_or_post_cutoff_knowledge_may_not_resolve_maturity: true
independence:
  primary_unit: STRICT_PROMISE_FAMILY
  strict_family_rule: H003-A001 strict_promise_key
  strict_repeated_family_count: 2
  strict_repeated_claim_count: 4
  primary_family_representative: EARLIEST_SOURCE_PUBLICATION
  broad_family_collapse: SENSITIVITY_ONLY
  broad_repeated_family_count: 7
  broad_repeated_claim_count: 14
  material_sensitivity_to_broad_collapse: ROBUSTNESS_FAIL
feature_contract:
  resolved_outcomes:
    - MET
    - PARTIAL
    - MISSED
    - LATE
  unresolved_excluded_from_denominator: true
  minimum_resolved_prior_families: 3
  prior_met_rate_formula: MET / (MET + PARTIAL + MISSED + LATE)
  claim_type_weighting: NONE
  only_outcomes_observable_by_asof_enter_feature: true
  family_counted_once: true
fail_closed:
  source_hash_mismatch: ABORT
  input_hash_mismatch: ABORT
  eligible_source_boundary_violation: ABORT
  duplicate_decision: ABORT
  missing_decision_after_full_review: ABORT
  unparseable_or_ambiguous_evidence: UNRESOLVED
live_capital: false
