name: H002-D orchestrator integrity fix

on:
  push:
    branches:
      - feat/h002-prospective-orchestrator-v1
    paths:
      - .github/workflows/h002d-orchestrator-integrity-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/h002-prospective-orchestrator-v1
      - name: Apply evidence and state stability fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected block not found in {path}: {old[:120]!r}')
              target.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'src/marketlab/marketdata.py',
              '''        captured = captured_at.astimezone(UTC).isoformat().replace("+00:00", "Z")\n        identity = {\n            "source_url": source_url,\n            "captured_at_utc": captured,\n            "raw_sha256": digest,\n            "byte_count": len(raw),\n        }\n        artifact_id = _canonical_hash(identity)\n        metadata = MarketArtifact(\n            schema_version=1,\n            artifact_id=artifact_id,\n            source_url=source_url,\n            captured_at_utc=captured,\n            raw_sha256=digest,\n            raw_path=str(raw_path),\n            byte_count=len(raw),\n        )\n        metadata_path = self.root / "market-data" / "artifacts" / f"{artifact_id}.json"\n        metadata_path.parent.mkdir(parents=True, exist_ok=True)\n        content = (json.dumps(metadata.to_dict(), indent=2, sort_keys=True) + "\\n").encode()\n        try:\n            fd = os.open(metadata_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o644)\n        except FileExistsError:\n            if metadata_path.read_bytes() != content:\n                raise MarketDataError("market artifact metadata collision")\n        else:\n            with os.fdopen(fd, "wb") as handle:\n                handle.write(content)\n                handle.flush()\n                os.fsync(handle.fileno())\n        return metadata\n''',
              '''        captured = captured_at.astimezone(UTC).isoformat().replace("+00:00", "Z")\n        identity = {\n            "source_url": source_url,\n            "raw_sha256": digest,\n            "byte_count": len(raw),\n        }\n        artifact_id = _canonical_hash(identity)\n        metadata_path = self.root / "market-data" / "artifacts" / f"{artifact_id}.json"\n        metadata_path.parent.mkdir(parents=True, exist_ok=True)\n        if metadata_path.exists():\n            try:\n                existing = MarketArtifact(**json.loads(metadata_path.read_text(encoding="utf-8")))\n            except (OSError, json.JSONDecodeError, TypeError) as exc:\n                raise MarketDataError(f"invalid retained market artifact: {exc}") from exc\n            if (\n                existing.source_url != source_url\n                or existing.raw_sha256 != digest\n                or existing.byte_count != len(raw)\n                or existing.raw_path != str(raw_path)\n            ):\n                raise MarketDataError("market artifact metadata collision")\n            return existing\n        metadata = MarketArtifact(\n            schema_version=1,\n            artifact_id=artifact_id,\n            source_url=source_url,\n            captured_at_utc=captured,\n            raw_sha256=digest,\n            raw_path=str(raw_path),\n            byte_count=len(raw),\n        )\n        content = (json.dumps(metadata.to_dict(), indent=2, sort_keys=True) + "\\n").encode()\n        try:\n            fd = os.open(metadata_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o644)\n        except FileExistsError:\n            return self.retain(\n                raw,\n                source_url=source_url,\n                captured_at=captured_at,\n                suffix=suffix,\n            )\n        with os.fdopen(fd, "wb") as handle:\n            handle.write(content)\n            handle.flush()\n            os.fsync(handle.fileno())\n        return metadata\n''',
          )

          replace(
              'src/marketlab/runner.py',
              '    ObservationSnapshot,\n',
              '',
          )
          replace(
              'src/marketlab/runner.py',
              '''        identity = {\n            "kind": kind,\n            "source_url": source_url,\n            "captured_at_utc": captured,\n            "raw_sha256": digest,\n            "byte_count": len(raw),\n        }\n        evidence_id = _canonical_hash(identity)\n        evidence = RawEvidence(\n            schema_version=1,\n            evidence_id=evidence_id,\n            kind=kind,\n            source_url=source_url,\n            captured_at_utc=captured,\n            raw_sha256=digest,\n            raw_path=str(raw_path),\n            byte_count=len(raw),\n        )\n        metadata = self.root / "raw-evidence" / kind / "records" / f"{evidence_id}.json"\n        metadata.parent.mkdir(parents=True, exist_ok=True)\n        content = (json.dumps(evidence.to_dict(), indent=2, sort_keys=True) + "\\n").encode()\n        try:\n            fd = os.open(metadata, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o644)\n        except FileExistsError:\n            if metadata.read_bytes() != content:\n                raise RunnerError("raw-evidence metadata collision")\n        else:\n            with os.fdopen(fd, "wb") as handle:\n                handle.write(content)\n                handle.flush()\n                os.fsync(handle.fileno())\n        return evidence\n''',
              '''        identity = {\n            "kind": kind,\n            "source_url": source_url,\n            "raw_sha256": digest,\n            "byte_count": len(raw),\n        }\n        evidence_id = _canonical_hash(identity)\n        metadata = self.root / "raw-evidence" / kind / "records" / f"{evidence_id}.json"\n        metadata.parent.mkdir(parents=True, exist_ok=True)\n        if metadata.exists():\n            try:\n                existing = RawEvidence(**json.loads(metadata.read_text(encoding="utf-8")))\n            except (OSError, json.JSONDecodeError, TypeError) as exc:\n                raise RunnerError(f"invalid retained raw evidence: {exc}") from exc\n            if (\n                existing.kind != kind\n                or existing.source_url != source_url\n                or existing.raw_sha256 != digest\n                or existing.byte_count != len(raw)\n                or existing.raw_path != str(raw_path)\n            ):\n                raise RunnerError("raw-evidence metadata collision")\n            return existing\n        evidence = RawEvidence(\n            schema_version=1,\n            evidence_id=evidence_id,\n            kind=kind,\n            source_url=source_url,\n            captured_at_utc=captured,\n            raw_sha256=digest,\n            raw_path=str(raw_path),\n            byte_count=len(raw),\n        )\n        content = (json.dumps(evidence.to_dict(), indent=2, sort_keys=True) + "\\n").encode()\n        try:\n            fd = os.open(metadata, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o644)\n        except FileExistsError:\n            return self.retain(\n                raw,\n                kind=kind,\n                source_url=source_url,\n                captured_at=captured_at,\n                suffix=suffix,\n            )\n        with os.fdopen(fd, "wb") as handle:\n            handle.write(content)\n            handle.flush()\n            os.fsync(handle.fileno())\n        return evidence\n''',
          )

          replace(
              'src/marketlab/runner.py',
              '        scored_at_utc=_iso(as_of),\n        actual_basic_eps=event.basic_eps,',
              '        scored_at_utc=event.provenance.captured_at_utc,\n        actual_basic_eps=event.basic_eps,',
          )
          replace(
              'src/marketlab/runner.py',
              '''        revisions: list[dict[str, Any]] = []\n        discovery_evidence: dict[str, Any] = {}\n''',
              '''        previous_evidence = (\n            dict(latest.evidence) if latest is not None and isinstance(latest.evidence, dict) else {}\n        )\n        revisions: list[dict[str, Any]] = list(previous_evidence.get("revisions", []))\n        discovery_evidence: dict[str, Any] = {\n            key: previous_evidence[key]\n            for key in ("discovery_sha256", "first_discovery_row_sha256")\n            if key in previous_evidence\n        }\n''',
          )
          replace(
              'src/marketlab/runner.py',
              '''                else:\n                    discovery_evidence = {\n                        "discovery_sha256": hashlib.sha256(discovery_raw).hexdigest(),\n                        "first_discovery_row_sha256": selection.first.discovery_row_sha256,\n                    }\n''',
              '''                else:\n                    discovery_evidence = {\n                        "discovery_sha256": hashlib.sha256(discovery_raw).hexdigest(),\n                        "first_discovery_row_sha256": selection.first.discovery_row_sha256,\n                    }\n                    revisions = []\n''',
          )
          replace(
              'src/marketlab/runner.py',
              '''        base_evidence = {\n            **discovery_evidence,\n''',
              '''        base_evidence = {\n            **previous_evidence,\n            **discovery_evidence,\n''',
          )
          replace(
              'src/marketlab/runner.py',
              '''        action_payload, action_raw, action_artifact = self._corporate_actions(\n            member,\n            from_date=expectation_day,\n            to_date=as_of.astimezone(IST).date(),\n            as_of=as_of,\n        )\n''',
              '''        action_payload, action_raw, action_artifact = self._corporate_actions(\n            member,\n            from_date=expectation_day,\n            to_date=publication_day,\n            as_of=as_of,\n        )\n''',
          )
          replace(
              'src/marketlab/runner.py',
              '        base_evidence["corporate_action_artifact"] = action_artifact.to_dict()\n',
              '        base_evidence["pre_event_corporate_action_artifact"] = action_artifact.to_dict()\n',
          )
          replace(
              'src/marketlab/runner.py',
              '''        base_evidence["price_reference_artifact"] = reference_artifact.to_dict()\n        signal = score_h002(\n            event,\n            expectation,\n            reference,\n            scored_at_utc=_iso(as_of),\n        )\n''',
              '''        base_evidence["price_reference_artifact"] = reference_artifact.to_dict()\n        base_evidence["price_reference"] = reference.to_dict()\n        signal = score_h002(\n            event,\n            expectation,\n            reference,\n            scored_at_utc=event.provenance.captured_at_utc,\n        )\n''',
          )
          replace(
              'src/marketlab/runner.py',
              '''            if entry_price is not None:\n                entry_basis = audit_price_basis_actions(\n                    action_payload,\n                    raw_payload=action_raw,\n                    symbol=symbol,\n                    start_date=publication_day,\n                    end_date=entry_day,\n                )\n                base_evidence["entry_price_basis"] = asdict(entry_basis)\n''',
              '''            if entry_price is not None:\n                entry_action_payload, entry_action_raw, entry_action_artifact = self._corporate_actions(\n                    member,\n                    from_date=publication_day,\n                    to_date=entry_day,\n                    as_of=as_of,\n                )\n                entry_basis = audit_price_basis_actions(\n                    entry_action_payload,\n                    raw_payload=entry_action_raw,\n                    symbol=symbol,\n                    start_date=publication_day,\n                    end_date=entry_day,\n                )\n                base_evidence["entry_corporate_action_artifact"] = entry_action_artifact.to_dict()\n                base_evidence["entry_price_basis"] = asdict(entry_basis)\n''',
          )
          replace(
              'src/marketlab/runner.py',
              '''            if exit_price is not None:\n                exit_basis = audit_price_basis_actions(\n                    action_payload,\n                    raw_payload=action_raw,\n                    symbol=symbol,\n                    start_date=publication_day,\n                    end_date=exit_day,\n                )\n                base_evidence["exit_price_basis"] = asdict(exit_basis)\n''',
              '''            if exit_price is not None:\n                exit_action_payload, exit_action_raw, exit_action_artifact = self._corporate_actions(\n                    member,\n                    from_date=publication_day,\n                    to_date=exit_day,\n                    as_of=as_of,\n                )\n                exit_basis = audit_price_basis_actions(\n                    exit_action_payload,\n                    raw_payload=exit_action_raw,\n                    symbol=symbol,\n                    start_date=publication_day,\n                    end_date=exit_day,\n                )\n                base_evidence["exit_corporate_action_artifact"] = exit_action_artifact.to_dict()\n                base_evidence["exit_price_basis"] = asdict(exit_basis)\n''',
          )

          Path('src/marketlab/runner.py').write_text(\
              Path('src/marketlab/runner.py').read_text(encoding='utf-8').replace(\
                  '\n\ndef _required_benchmark_complete(position: dict[str, Any] | None) -> bool:\n    if not isinstance(position, dict) or position.get("status") != "COMPLETED":\n        return False\n    status = {\n        row.get("benchmark_id"): row.get("status")\n        for row in position.get("benchmarks", [])\n        if isinstance(row, dict)\n    }\n    return status.get("nifty_50") == "COMPLETE" and status.get("nifty_200_momentum_30") == "COMPLETE"\n',\
                  ''\
              ),\
              encoding='utf-8'\
          )
          PY
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git rm .github/workflows/h002d-orchestrator-integrity-fix.yml
          git add src/marketlab/marketdata.py src/marketlab/runner.py
          git commit -m "Stabilize H002-D evidence and phase-specific basis audits"
          git push origin HEAD:feat/h002-prospective-orchestrator-v1
