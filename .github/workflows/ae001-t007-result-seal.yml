name: AE001 T007 result seal

on:
  push:
    branches:
      - feat/ae001-t007-structured-announcement-alpha-20260930

permissions:
  contents: read

jobs:
  render:
    if: contains(github.event.head_commit.message, '[ae001-t007-seal]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Render canonical T007 result ledger
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from marketlab.alpha_trials import append_trial_event, trial_state

          path = Path("research/ae001/trial-ledger.json")
          ledger = json.loads(path.read_text(encoding="utf-8"))
          state = trial_state(ledger, "AE001-T007")
          if state["result_count"] != 0:
              raise SystemExit("T007 already has a result event")

          payload = {
              "status": "COMPLETE_DEVELOPMENT",
              "successful_run_id": 36715752748,
              "report_sha256": "2a38305dd1d5f2a20ffbbf3ecb7ab7a8fac79980928ce74e846875f40af8958b",
