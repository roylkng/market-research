name: HG003 L002 company event-thread synthesis

on:
  push:
    branches:
      - research/hg003-l002-thread-synthesis-20261005

permissions:
  actions: read
  contents: read

jobs:
  synthesize:
    if: contains(github.event.head_commit.message, '[hg003-l002]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate frozen L002 implementation
        run: |
          ruff check \
            src/marketlab/hg003_l002.py \
            scripts/materialize_hg003_l002.py \
            tests/test_hg003_l002.py
          pytest -q \
            tests/test_hg003_l002.py \
            tests/test_hg003_threads.py \
            tests/test_ss002_llm_contract.py

      - name: Download exact HG003 D001 selection
        uses: actions/download-artifact@v4
        with:
          name: hg003-d001-37267831741
          path: reports/hg003-d001
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37267831741

      - name: Download exact HG003 L001 native run
        uses: actions/download-artifact@v4
        with:
          name: hg003-l001-37275845301
          path: reports/hg003-l001
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37275845301

      - name: Verify frozen inputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          selection=json.loads(
              Path("reports/hg003-d001/hg003-d001-thread-selection.json").read_text()
          )
          run=json.loads(
              Path("reports/hg003-l001/hg003-l001-native-run.json").read_text()
          )
          assert selection["selection_id"]=="HG003-D001-v1"
          assert selection["selection_sha256"]=="ebc543464475ff9e409b1795c02272a818a3062cef8ad2bafcfafb5fcc30b536"
          assert selection["thread_count"]==35
          assert run["run_id"]=="HG003-L001-GPT56SOL-NATIVE-v1"
          assert run["run_sha256"]=="ce03af24e2bfa807f619a0db4db562d35cc96748cb0c5f75a1e1d7338c66809a"
          assert run["validated_output_count"]==34
          PY

      - name: Materialize frozen company event-thread synthesis
        run: |
          python scripts/materialize_hg003_l002.py \
            --selection reports/hg003-d001/hg003-d001-thread-selection.json \
            --l001-run reports/hg003-l001/hg003-l001-native-run.json \
            --output reports/hg003-l002

      - name: Prove research-only L002 output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(Path("reports/hg003-l002/hg003-l002-synthesis.json").read_text())
          assert p["synthesis_id"]=="HG003-L002-v1"
          assert p["symbol_count"]==28
          assert p["thread_count"]==35
          assert p["validated_thread_count"]==34
          assert p["pending_thread_count"]==1
          assert all(p["threshold_passes"].values())
          assert p["feasibility_pass"] is True
          assert p["promotion_allowed_to_detailed_term_extraction"] is True
          assert p["return_outcomes_opened"] is False
          assert p["model_fitted"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          print(json.dumps({
              "synthesis_sha256": p["synthesis_sha256"],
              "company_catalyst_state_counts": p["company_catalyst_state_counts"],
              "cluster_stage_group_counts": p["cluster_stage_group_counts"],
              "direct_active_cluster_count": p["direct_active_cluster_count"],
              "company_states": [
                  {
                      "symbol": row["symbol"],
                      "state": row["company_catalyst_state"],
                      "active": row["direct_active_cluster_count"],
                      "completed": row["completed_direct_cluster_count"],
                      "indirect": row["indirect_or_context_cluster_count"],
                      "pending": row["text_pending_thread_count"],
                  }
                  for row in p["rows"]
              ],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload exact L002 synthesis
        uses: actions/upload-artifact@v4
        with:
          name: hg003-l002-${{ github.run_id }}
          path: reports/hg003-l002
          if-no-files-found: error
          retention-days: 90
