name: H023 prospective ownership stream

on:
  workflow_dispatch:
  schedule:
    - cron: '50 2 * * *'
    - cron: '30 3 * * *'
    - cron: '45 12 * * *'

permissions:
  contents: write

concurrency:
  group: h023-prospective-ownership-stream
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh latest canonical main before source observation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach origin/main
          echo "OBSERVATION_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify implementation before source access
        run: |
          set -euo pipefail
          ruff check \
            src/marketlab/h023_ownership.py \
            src/marketlab/h023_prospective.py \
            src/marketlab/h023_selection.py \
            src/marketlab/h023_acquisition.py \
            scripts/run_h023_prospective_scan.py \
            scripts/verify_h023_prospective_state.py \
            tests/test_h023_ownership.py \
            tests/test_h023_acquisition.py \
            tests/test_h023_prospective.py \
            tests/test_h023_selection.py
          pytest -q \
            tests/test_h023_ownership.py \
            tests/test_h023_acquisition.py \
            tests/test_h023_prospective.py \
            tests/test_h023_selection.py
          python scripts/verify_h023_prospective_state.py \
            --universe research/prospective/universes/FY27-Q2-2026-09-06.json \
            --state-dir research/prospective/h023

      - name: Resolve prospective boundary
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          STATE=$(python - <<'PY'
          from datetime import UTC, datetime
          import os

          boundary = datetime(2026, 9, 14, 18, 30, tzinfo=UTC)
          now = datetime.now(UTC)
          if now < boundary:
              print('BEFORE_BOUNDARY')
          elif os.environ.get('GITHUB_REF') != 'refs/heads/main':
              print('NON_MAIN_REHEARSAL')
          else:
              print('READY')
          PY
          )
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "H023 workflow state: $STATE"

      - name: Prepare isolated state
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          START_SHA="$OBSERVATION_BASE_SHA"
          echo "start_sha=$START_SHA" >> "$GITHUB_ENV"
          WORK="reports/h023-prospective/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$WORK/state" "$WORK/raw"
          cp research/prospective/h023/*.json "$WORK/state/"
          echo "work_dir=$WORK" >> "$GITHUB_ENV"

      - name: Acquire official NSE ownership state
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_h023_prospective_scan.py \
            --universe research/prospective/universes/FY27-Q2-2026-09-06.json \
            --state-dir "$work_dir/state" \
            --raw-dir "$work_dir/raw" \
            --report "$work_dir/report.json" \
            --attempts 4 \
            --pause-seconds 0.08

      - name: Verify proposed canonical state offline
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_h023_prospective_state.py \
            --universe research/prospective/universes/FY27-Q2-2026-09-06.json \
            --state-dir "$work_dir/state"

      - name: Reconcile unrelated main movement and fail on H023 drift
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          CRITICAL_PATHS=(
            ".github/workflows/h023-prospective-stream.yml"
            "research/H023_PROSPECTIVE_PROTOCOL_V1.md"
            "research/H023_PROSPECTIVE_PROTOCOL_AMENDMENT_P1_FORMAL_REVISIONS.md"
            "research/prospective/universes/FY27-Q2-2026-09-06.json"
            "research/prospective/h023"
            "src/marketlab/h023_ownership.py"
            "src/marketlab/h023_acquisition.py"
            "src/marketlab/h023_prospective.py"
            "src/marketlab/h023_selection.py"
            "scripts/run_h023_prospective_scan.py"
            "scripts/verify_h023_prospective_state.py"
          )
          if [ "$start_sha" != "$CURRENT_MAIN" ]; then
            if ! git diff --quiet "$start_sha" "$CURRENT_MAIN" -- "${CRITICAL_PATHS[@]}"; then
              echo "ERROR: H023 rules or canonical state changed while source observation was in flight"
              git diff --stat "$start_sha" "$CURRENT_MAIN" -- "${CRITICAL_PATHS[@]}"
              exit 1
            fi
            git rebase origin/main
            python scripts/verify_h023_prospective_state.py \
              --universe research/prospective/universes/FY27-Q2-2026-09-06.json \
              --state-dir research/prospective/h023
          fi
          echo "H023_OBSERVATION_BASE_SHA=$start_sha" >> "$GITHUB_ENV"

      - name: Seal canonical H023 state
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          cp "$work_dir/state/source-ledger.json" research/prospective/h023/source-ledger.json
          cp "$work_dir/state/event-ledger.json" research/prospective/h023/event-ledger.json
          cp "$work_dir/state/scan-ledger.json" research/prospective/h023/scan-ledger.json
          python scripts/verify_h023_prospective_state.py \
            --universe research/prospective/universes/FY27-Q2-2026-09-06.json \
            --state-dir research/prospective/h023
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/prospective/h023/*.json
          if git diff --cached --quiet; then
            echo "No new H023 canonical state"
            exit 0
          fi
          git commit -m "H023: seal prospective ownership scan [skip ci]"

          CRITICAL_PATHS=(
            ".github/workflows/h023-prospective-stream.yml"
            "research/H023_PROSPECTIVE_PROTOCOL_V1.md"
            "research/H023_PROSPECTIVE_PROTOCOL_AMENDMENT_P1_FORMAL_REVISIONS.md"
            "research/prospective/universes/FY27-Q2-2026-09-06.json"
            "research/prospective/h023"
            "src/marketlab/h023_ownership.py"
            "src/marketlab/h023_acquisition.py"
            "src/marketlab/h023_prospective.py"
            "src/marketlab/h023_selection.py"
            "scripts/run_h023_prospective_scan.py"
            "scripts/verify_h023_prospective_state.py"
          )
          for ATTEMPT in 1 2 3; do
            git fetch origin main
            CURRENT_MAIN="$(git rev-parse origin/main)"
            if ! git diff --quiet "$H023_OBSERVATION_BASE_SHA" "$CURRENT_MAIN" -- "${CRITICAL_PATHS[@]}"; then
              echo "ERROR: H023 critical state changed upstream before anchor push"
              git diff --stat "$H023_OBSERVATION_BASE_SHA" "$CURRENT_MAIN" -- "${CRITICAL_PATHS[@]}"
              exit 1
            fi
            if test "$(git rev-parse origin/main)" != "$(git rev-parse HEAD^)"; then
              git rebase origin/main
              python scripts/verify_h023_prospective_state.py \
                --universe research/prospective/universes/FY27-Q2-2026-09-06.json \
                --state-dir research/prospective/h023
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((ATTEMPT * 2))
          done
          echo "ERROR: unable to anchor H023 state after bounded safe retries"
          exit 1

      - name: Upload raw source-only evidence
        if: steps.gate.outputs.state == 'READY' && always()
        uses: actions/upload-artifact@v4
        with:
          name: h023-prospective-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/h023-prospective
          if-no-files-found: error
          retention-days: 90
