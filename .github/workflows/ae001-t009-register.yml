name: AE001 T009 trial registration

on:
  push:
    branches:
      - feat/ae001-t009-stock-options-positioning-20261001

permissions:
  contents: write

jobs:
  register:
    if: contains(github.event.head_commit.message, '[t009-register]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Append canonical T009 registration
        run: |
          python scripts/append_ae001_trial_event.py \
            --ledger research/ae001/trial-ledger.json \
            --event-type TRIAL_REGISTERED \
            --trial-id AE001-T009 \
            --recorded-at-utc 2026-10-01T04:06:00+00:00 \
            --payload research/ae001/t009-registration-payload.json

      - name: Commit canonical ledger
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/ae001/trial-ledger.json
          git commit -m "AE001 T009: register frozen options feature trial [skip ci]"
          git push origin HEAD:feat/ae001-t009-stock-options-positioning-20261001
