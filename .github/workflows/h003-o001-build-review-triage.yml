name: H003-O001 build conservative blind review triage

on:
  push:
    branches:
      - research/h003-v001-outcome-protocol-20260908
    paths:
      - .github/workflows/h003-o001-build-review-triage.yml

permissions:
  contents: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h003-v001-outcome-protocol-20260908
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Verify repository before triage
        run: |
          ruff check src scripts tests
          pytest -q
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/prospective/h003/FY27-Q2-2026-09-06/outcomes-o001')
          audit = json.loads((root / 'contact-leak-audit-a002.json').read_text())
          incident = json.loads((root / 'blindness-incident-20260908.json').read_text())
          assert audit['source_blind_package_sha256'] == '70240c328f1812866b53e97f94b867335eb668f37918e952223d17f9e3fa9b24'
          assert audit['affected_packet_count'] == 0
          assert incident['reviewer_contaminated_source_batches'] == [1, 2, 3, 4]
          print('H003 triage inputs verified')
          PY
      - name: Build only genuinely fail-safe UNRESOLVED triage
        run: |
          python - <<'PY'
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          root = Path('research/prospective/h003/FY27-Q2-2026-09-06/outcomes-o001')
          batches = root / 'review-batches'
          rows = []
          counts = Counter()
          by_batch = defaultdict(Counter)

          for batch_number in range(5, 45):
              path = batches / f'batch-{batch_number:04d}.json'
              batch = json.loads(path.read_text(encoding='utf-8'))
              for packet in batch['packets']:
                  evidence = packet.get('evidence')
                  if not isinstance(evidence, list):
                      raise SystemExit(f"invalid evidence list: {packet['packet_id']}")

                  # Early achievement remains possible even when a stated deadline is
                  # beyond the cutoff. Only zero later evidence is mechanically safe.
                  if not evidence:
                      disposition = 'SAFE_UNRESOLVED'
                      reason = 'EMPTY_EVIDENCE_NO_NEGATIVE_INFERENCE'
                  else:
                      disposition = 'MANUAL_SEMANTIC_REVIEW'
                      reason = None

                  row = {
                      'batch_number': batch_number,
                      'packet_id': packet['packet_id'],
                      'blind_payload_sha256': packet['payload_sha256'],
                      'disposition': disposition,
                      'reason': reason,
                  }
                  rows.append(row)
                  counts[disposition] += 1
                  by_batch[batch_number][disposition] += 1

          expected = 869 - 80
          if len(rows) != expected:
              raise SystemExit(f'triage coverage mismatch: {len(rows)} expected {expected}')
          if len({row['packet_id'] for row in rows}) != len(rows):
              raise SystemExit('duplicate packet id in triage')

          document = {
              'schema_version': 3,
              'triage_revision': 'H003-O001-TRIAGE-V3',
              'supersedes': ['review-triage-v1.json', 'review-triage-v2.json'],
              'supersession_reason': (
                  'V1 incorrectly allowed future horizons as a shortcut. V2 fixed that '
                  'but was bound to the superseded package and began at batch 4. V3 is '
                  'bound to the zero-contact package and starts after the frozen 1-4 quarantine.'
              ),
              'outcome_rule_id': 'H003-O001',
              'outcome_rule_sha256': '36cd0dab185a8f73bc3233cf16bc1685dc9ae9e25c27eb35b305343b1ea028b1',
              'source_blind_package_sha256': '70240c328f1812866b53e97f94b867335eb668f37918e952223d17f9e3fa9b24',
              'zero_contact_audit_id': 'H003-O001-CONTACT-LEAK-A002',
              'source_cutoff_date': '2026-09-06',
              'quarantined_batches': [1, 2, 3, 4],
              'covered_batches': [5, 44],
              'packet_count': len(rows),
              'counts': dict(sorted(counts.items())),
              'batch_counts': {
                  str(number): dict(sorted(values.items()))
                  for number, values in sorted(by_batch.items())
              },
              'safe_unresolved_reasons': ['EMPTY_EVIDENCE_NO_NEGATIVE_INFERENCE'],
              'semantic_outcomes_assigned': False,
              'private_binding_accessed': False,
              'market_outcomes_accessed': False,
              'live_capital_allowed': False,
              'rows': rows,
          }
          out = root / 'review-triage-v3.json'
          out.write_text(json.dumps(document, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({
              'packet_count': len(rows),
              'counts': document['counts'],
              'batch_counts': document['batch_counts'],
          }, indent=2, sort_keys=True))
          PY
      - name: Verify triage cannot suppress early achievement
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('research/prospective/h003/FY27-Q2-2026-09-06/outcomes-o001')
          document = json.loads((root / 'review-triage-v3.json').read_text())
          assert document['schema_version'] == 3
          assert document['packet_count'] == 789
          assert document['quarantined_batches'] == [1, 2, 3, 4]
          assert document['covered_batches'] == [5, 44]
          assert document['source_blind_package_sha256'] == '70240c328f1812866b53e97f94b867335eb668f37918e952223d17f9e3fa9b24'
          assert document['safe_unresolved_reasons'] == ['EMPTY_EVIDENCE_NO_NEGATIVE_INFERENCE']
          assert document['semantic_outcomes_assigned'] is False
          assert document['private_binding_accessed'] is False
          assert document['market_outcomes_accessed'] is False
          assert document['live_capital_allowed'] is False

          by_id = {}
          for batch_number in range(5, 45):
              batch = json.loads((root / 'review-batches' / f'batch-{batch_number:04d}.json').read_text())
              for packet in batch['packets']:
                  by_id[packet['packet_id']] = packet

          for row in document['rows']:
              packet = by_id[row['packet_id']]
              if row['disposition'] == 'SAFE_UNRESOLVED':
                  assert row['reason'] == 'EMPTY_EVIDENCE_NO_NEGATIVE_INFERENCE'
                  assert packet['evidence'] == []
              else:
                  assert row['disposition'] == 'MANUAL_SEMANTIC_REVIEW'
                  assert packet['evidence'] != []
                  assert row['reason'] is None
          print('H003 conservative review triage v3 valid')
          PY
      - name: Commit only corrected public blind triage report
        run: |
          TARGET=research/prospective/h003/FY27-Q2-2026-09-06/outcomes-o001/review-triage-v3.json
          git config user.name marketlab-research-bot
          git config user.email marketlab-research-bot@users.noreply.github.com
          git add "$TARGET"
          git commit -m 'H003-O001: freeze zero-contact blind review triage v3'
          git push origin HEAD:research/h003-v001-outcome-protocol-20260908
