name: AE001 D005-D1 low-coverage diagnostic

on:
  push:
    branches:
      - feat/ae001-d005-options-source-feasibility-20261001

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[ae001-d005-d1]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download sealed D005 evidence
        uses: actions/download-artifact@v4
        with:
          name: ae001-d005-36809535891
          path: evidence/d005
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: roylkng/market-research
          run-id: 36809535891

      - name: Diagnose frozen low-tail coverage
        run: |
          python - <<'PY'
          import gzip
          import json
          from collections import Counter
          from pathlib import Path

          matches = list(Path("evidence/d005").rglob("d005-report.json.gz"))
          if len(matches) != 1:
              raise SystemExit(f"expected one D005 report, got {matches}")
          report = json.loads(gzip.decompress(matches[0].read_bytes()).decode("utf-8"))
          if report["report_sha256"] != "88c609636120983e9954de9c0e68d88b4150a3e1de368513d58b501d24e45b7e":
              raise SystemExit("sealed D005 report SHA mismatch")

          rows = [
              row for row in report["sessions"]
              if row.get("status") == "READY"
          ]
          low = sorted(
              [row for row in rows if int(row.get("usable_symbol_count", 0)) < 75],
              key=lambda row: (
                  int(row.get("usable_symbol_count", 0)),
                  row["session_date"],
              ),
          )
          bottom = sorted(
              rows,
              key=lambda row: (
                  int(row.get("usable_symbol_count", 0)),
                  row["session_date"],
              ),
          )[:40]
          months = Counter(row["session_date"][:7] for row in low)

          def compact(row):
              return {
                  "session_date": row["session_date"],
                  "stock_option_row_count": row.get("stock_option_row_count"),
                  "accepted_contract_row_count": row.get("accepted_contract_row_count"),
                  "invalid_symbol_count": row.get("invalid_symbol_count"),
                  "distinct_option_symbol_count": row.get("distinct_option_symbol_count"),
                  "mapped_eq_symbol_count": row.get("mapped_eq_symbol_count"),
                  "usable_symbol_count": row.get("usable_symbol_count"),
              }

          result = {
              "diagnostic_id": "AE001-D005-D1",
              "source_report_sha256": report["report_sha256"],
              "low_coverage_session_count_lt_75": len(low),
              "low_coverage_month_counts": dict(sorted(months.items())),
              "lowest_40_sessions": [compact(row) for row in bottom],
              "all_low_sessions": [compact(row) for row in low],
              "future_returns_opened": False,
              "model_fit_started": False,
              "live_capital_allowed": False,
          }
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
