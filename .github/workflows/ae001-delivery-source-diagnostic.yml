name: AE001 delivery source diagnostic

on:
  push:
    branches:
      - feat/ae001-delivery-flow-features-20260927

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect NSE delivery reconciliation distribution
        run: |
          python -m pip install requests
          python - <<'PY'
          import csv
          import io
          import statistics
          import requests

          days = ["17102025", "21102025", "01022026", "01042026", "25092026"]
          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 Chrome/152.0 Safari/537.36"
              )
          }
          for day in days:
              url = (
                  "https://nsearchives.nseindia.com/products/content/"
                  f"sec_bhavdata_full_{day}.csv"
              )
              response = requests.get(url, headers=headers, timeout=30)
              print("DAY", day, "STATUS", response.status_code, "BYTES", len(response.content))
              response.raise_for_status()
              diffs = []
              worst = []
              reader = csv.DictReader(
                  io.StringIO(response.content.decode("utf-8-sig"))
              )
              for raw in reader:
                  row = {
                      str(k).strip(): str(v or "").strip()
                      for k, v in raw.items()
                      if k is not None
                  }
                  if row.get("SERIES", "").upper() != "EQ":
                      continue
                  if row.get("DELIV_QTY") in {"", "-"} or row.get("DELIV_PER") in {"", "-"}:
                      continue
                  qty = float(row["TTL_TRD_QNTY"])
                  if qty <= 0:
                      continue
                  delivery = float(row["DELIV_QTY"])
                  reported = float(row["DELIV_PER"])
                  implied = 100.0 * delivery / qty
                  diff = abs(implied - reported)
                  diffs.append(diff)
                  worst.append((diff, row["SYMBOL"], reported, implied, qty, delivery))
              diffs.sort()
              worst.sort(reverse=True)
              def q(frac):
                  return diffs[min(len(diffs)-1, int((len(diffs)-1)*frac))]
              print(
                  "STATS",
                  "N", len(diffs),
                  "MEDIAN", statistics.median(diffs),
                  "P95", q(0.95),
                  "P99", q(0.99),
                  "MAX", max(diffs),
                  "GT_0_05", sum(x > 0.05 for x in diffs),
                  "GT_0_10", sum(x > 0.10 for x in diffs),
                  "GT_0_25", sum(x > 0.25 for x in diffs),
                  "GT_0_50", sum(x > 0.50 for x in diffs),
              )
              for item in worst[:8]:
                  print("WORST", item)
          PY
