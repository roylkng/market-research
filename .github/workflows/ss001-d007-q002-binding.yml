name: SS001 D007 Q002 official document binding

on:
  push:
    branches:
      - research/ss001-d007-q002-document-binding-20261008

permissions:
  contents: read
  actions: read

jobs:
  binding:
    if: contains(github.event.head_commit.message, '[ss001-d007-q002]')
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test frozen Q002 binding before opening source evidence
        run: |
          ruff check \
            src/marketlab/ss001_share_document_binding.py \
            scripts/materialize_ss001_d007_q002.py \
            tests/test_ss001_share_document_binding.py
          pytest -q \
            tests/test_ss001_share_document_binding.py \
            tests/test_ss001_share_review_queue.py \
            tests/test_ss002_text.py

      - name: Download exact passed Q001 first-50 packets
        uses: actions/download-artifact@v4
        with:
          name: ss001-d007-37818227234
          path: reports/ss001-q001
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37818227234

      - name: Download exact passed D003 text corpus manifest
        uses: actions/download-artifact@v4
        with:
          name: ss002-d003-37213853198
          path: reports/ss002-d003
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37213853198

      - name: Bind exact official-source documents to frozen D007 pilot
        run: |
          python scripts/materialize_ss001_d007_q002.py \
            --q001-queue reports/ss001-q001/ss001-d007-source-packets.json \
            --q001-pilot reports/ss001-q001/ss001-d007-pilot-first50.json \
            --d002-manifest research/ss002/ss002-d002-corpus-manifest-v1.json \
            --d003-manifest reports/ss002-d003/ss002-d003-text-corpus.json \
            --output reports/ss001-d007-q002

      - name: Verify frozen source-only feasibility
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(
              Path("reports/ss001-d007-q002/ss001-d007-q002-bound-pilot.json").read_text()
          )
          assert p["binding_id"] == "SS001-D007-Q002-v1"
          assert p["pilot_packet_count"] == 50
          assert p["announcement_reference_count"] == 244
          assert p["share_action_clearance_proven"] is False
          assert p["market_capitalization_calculated"] is False
          assert p["return_outcomes_opened"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          print(json.dumps({
              "binding_sha256": p["binding_sha256"],
              "pilot_packet_count": p["pilot_packet_count"],
              "announcement_reference_count": p["announcement_reference_count"],
              "event_binding_state_counts": p["event_binding_state_counts"],
              "unique_text_ready_document_count": p["unique_text_ready_document_count"],
              "approved_linked_text_ready_ratio": p["approved_linked_text_ready_ratio"],
              "threshold_passes": p["threshold_passes"],
              "feasibility_pass": p["feasibility_pass"],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload exact Q002 pilot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss001-d007-q002-${{ github.run_id }}
          path: reports/ss001-d007-q002
          if-no-files-found: warn
          retention-days: 90
