name: SS001 I001 small-sum investability context

on:
  push:
    branches:
      - research/ss001-small-sum-investability-20261004

permissions:
  actions: read
  contents: read

jobs:
  materialize:
    if: contains(github.event.head_commit.message, '[ss001-i001]')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate frozen I001 implementation
        run: |
          ruff check \
            src/marketlab/ss001_investability.py \
            scripts/materialize_ss001_i001.py \
            tests/test_ss001_investability.py
          pytest -q tests/test_ss001_investability.py

      - name: Download exact passed SS001 D001 census
        uses: actions/download-artifact@v4
        with:
          name: ss001-d001-37197575401
          path: reports/ss001-d001-source
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37197575401

      - name: Verify exact D001 source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          census = json.loads(
              Path("reports/ss001-d001-source/ss001-d001-census.json").read_text()
          )
          assert census["census_id"] == "SS001-D001-v1"
          assert census["census_sha256"] == (
              "0cfdc8658873a09f0cfa547467108888523eee88951050acfd2df8bd131829b7"
          )
          assert census["eq_identity_count"] == 2319
          assert census["return_outcomes_opened"] is False
          PY

      - name: Materialize I001
        run: |
          mkdir -p reports/ss001-i001
          python scripts/materialize_ss001_i001.py \
            --census reports/ss001-d001-source/ss001-d001-census.json \
            --out reports/ss001-i001/ss001-i001-context.json

      - name: Report frozen capacity surface
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("reports/ss001-i001/ss001-i001-context.json").read_text()
          )
          assert payload["context_id"] == "SS001-I001-v1"
          assert len(payload["rows"]) == 2319
          assert payload["return_outcomes_opened"] is False
          assert payload["portfolio_eligibility_allowed"] is False
          print(json.dumps({
              "context_sha256": payload["context_sha256"],
              "liquidity_band_counts": payload["liquidity_band_counts"],
              "research_capacity_state_counts": payload["research_capacity_state_counts"],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload I001 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ss001-i001-${{ github.run_id }}
          path: reports/ss001-i001
          if-no-files-found: error
          retention-days: 90
