name: AE001 action-safe diagnostics pilot

on:
  push:
    branches:
      - feat/ae001-action-safe-multihorizon-diagnostics-20260926

permissions:
  contents: read

jobs:
  pilot:
    if: contains(github.event.head_commit.message, '[ae001-action-pilot]')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify AE001 action-safe implementation
        run: |
          ruff check \
            src/marketlab/alpha_corporate_actions.py \
            src/marketlab/alpha_diagnostics.py \
            src/marketlab/alpha_multihorizon.py \
            src/marketlab/nse.py \
            scripts/build_ae001_action_safe_panel.py \
            scripts/run_ae001_diagnostics.py \
            scripts/run_ae001_multihorizon.py
          pytest -q \
            tests/test_alpha_corporate_actions.py \
            tests/test_alpha_diagnostics.py \
            tests/test_alpha_multihorizon.py \
            tests/test_alpha_history.py \
            tests/test_alpha_walkforward.py

      - name: Rebuild fixed official NSE market panel
        run: |
          python scripts/build_ae001_historical_panel.py \
            --start-date 2025-09-01 \
            --end-date 2026-09-25 \
            --store .marketlab/ae001-action-pilot \
            --output reports/ae001-action-pilot/panel \
            --attempts 4 \
            --timeout-seconds 30 \
            --pause-seconds 0.05

      - name: Acquire official corporate actions and build action-safe features
        run: |
          python scripts/build_ae001_action_safe_panel.py \
            --market-panel reports/ae001-action-pilot/panel/market-panel.json.gz \
            --feature-panel reports/ae001-action-pilot/panel/feature-panel.json.gz \
            --start-date 2025-09-01 \
            --end-date 2026-09-25 \
            --raw-dir reports/ae001-action-pilot/corporate-actions/raw \
            --output reports/ae001-action-pilot/action-safe \
            --chunk-days 31 \
            --attempts 4 \
            --timeout-seconds 30

      - name: Run action-safe 1D diagnostics
        run: |
          python scripts/run_ae001_diagnostics.py \
            --market-panel reports/ae001-action-pilot/panel/market-panel.json.gz \
            --feature-panel reports/ae001-action-pilot/action-safe/action-safe-feature-panel.json.gz \
            --output reports/ae001-action-pilot/diagnostics-1d \
            --fold 2026-04-01:2026-06-30 \
            --fold 2026-07-01:2026-09-24 \
            --l2 1.0 \
            --newey-west-lag 5

      - name: Run action-safe multi-horizon walk-forward
        run: |
          python scripts/run_ae001_multihorizon.py \
            --market-panel reports/ae001-action-pilot/panel/market-panel.json.gz \
            --feature-panel reports/ae001-action-pilot/action-safe/action-safe-feature-panel.json.gz \
            --action-ledger reports/ae001-action-pilot/action-safe/corporate-action-ledger.json.gz \
            --output reports/ae001-action-pilot/multihorizon \
            --fold 5:2026-04-01:2026-06-30 \
            --fold 5:2026-07-01:2026-09-18 \
            --fold 20:2026-04-01:2026-06-30 \
            --fold 20:2026-07-01:2026-08-27 \
            --fold 60:2026-04-01:2026-05-29 \
            --fold 60:2026-06-01:2026-06-30 \
            --l2 1.0

      - name: Print compact results
        run: |
          cat reports/ae001-action-pilot/action-safe/manifest.json
          cat reports/ae001-action-pilot/diagnostics-1d/summary.json
          cat reports/ae001-action-pilot/multihorizon/summary.json

      - name: Upload exact action-safe development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae001-action-safe-pilot-${{ github.run_id }}
          path: |
            reports/ae001-action-pilot
            .marketlab/ae001-action-pilot/market-data
          if-no-files-found: warn
          retention-days: 90
