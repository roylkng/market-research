name: Validate H003 judgment compiler

on:
  push:
    branches:
      - feat/h003-review-judgment-compiler
    paths:
      - scripts/compile_h003_review_judgments.py
      - tests/test_h003_judgment_compiler.py
      - .github/workflows/h003-judgment-compiler-gate.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/h003-review-judgment-compiler
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check scripts/compile_h003_review_judgments.py tests/test_h003_judgment_compiler.py --fix
      - run: ruff check scripts/compile_h003_review_judgments.py tests/test_h003_judgment_compiler.py
      - run: pytest -q
      - run: make validate
      - name: Commit any safe lint fixes and remove one-shot workflow
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git rm .github/workflows/h003-judgment-compiler-gate.yml
          git add scripts/compile_h003_review_judgments.py tests/test_h003_judgment_compiler.py
          if ! git diff --cached --quiet; then
            git commit -m "Validate H003 semantic judgment compiler"
          else
            git commit --allow-empty -m "Validate H003 semantic judgment compiler"
          fi
          git push origin HEAD:feat/h003-review-judgment-compiler
