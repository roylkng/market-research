name: AE001 T004 one-time registration

on:
  push:
    branches:
      - feat/ae001-t004-confirmatory-protocol-20260929

permissions:
  contents: write

jobs:
  register:
    if: contains(github.event.head_commit.message, '[ae001-t004-register]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Register T004 in append-only trial ledger
        shell: bash
        run: |
          set -euo pipefail
          RECORDED_AT="$(date -u +%Y-%m-%dT%H:%M:%S+00:00)"
          python scripts/append_ae001_trial_event.py \
            --ledger research/ae001/trial-ledger.json \
            --event-type TRIAL_REGISTERED \
            --trial-id AE001-T004 \
            --recorded-at-utc "$RECORDED_AT" \
            --payload research/ae001/t004-registration-payload.json
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/ae001/trial-ledger.json
          git commit -m "research: register AE001 T004 prospective trial [skip ci]"
          git push origin HEAD:feat/ae001-t004-confirmatory-protocol-20260929
