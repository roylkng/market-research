name: H019 fix numeric audit pre-evidence lint

on:
  push:
    branches:
      - research/h019-fundamental-inflection-source-audit-20260909
    paths:
      - .github/workflows/h019-fix-numeric-audit-pre-evidence.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h019-fundamental-inflection-source-audit-20260909
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repository environment
        run: python -m pip install -e '.[dev]'
      - name: Apply only the pre-evidence SIM102 control-flow fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/h019_numeric_extraction_audit.py')
          text = path.read_text(encoding='utf-8')
          old = '''            if response.status_code in {403, 429} or response.status_code >= 500:\n                if attempt < 2:\n                    time.sleep(0.5 * (attempt + 1))\n                    continue\n'''
          new = '''            if (\n                response.status_code in {403, 429} or response.status_code >= 500\n            ) and attempt < 2:\n                time.sleep(0.5 * (attempt + 1))\n                continue\n'''
          if old not in text:
              raise SystemExit('expected pre-evidence retry block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          ruff check scripts/h019_numeric_extraction_audit.py
          python -m py_compile scripts/h019_numeric_extraction_audit.py
          pytest -q
          git diff --check
      - name: Commit verified pre-evidence fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'marketlab-research-bot'
          git config user.email 'marketlab-research-bot@users.noreply.github.com'
          git add scripts/h019_numeric_extraction_audit.py
          git commit -m 'fix: normalize H019 numeric audit retry path'
          git push origin HEAD:research/h019-fundamental-inflection-source-audit-20260909
