name: SS001 D007 L001 P2 P0 native page inference

on:
  push:
    branches:
      - research/ss001-d007-l001-p2-p0-native-run-20261009

permissions:
  actions: read
  contents: read

jobs:
  infer:
    if: contains(github.event.head_commit.message, '[ss001-d007-p2-p0-native]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate native pilot implementation
        run: |
          ruff check scripts/materialize_ss001_d007_l001_p2_p0_native.py
          pytest -q tests/test_ss002_llm_contract.py

      - name: Download exact frozen 24-page selection
        uses: actions/download-artifact@v4
        with:
          name: ss001-d007-l001-p2-p0-37885080839
          path: reports/selection
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37885080839

      - name: Verify frozen selection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/selection/ss001-d007-l001-p2-p0-selection.json").read_text())
          assert p["selection_sha256"]=="4f96d494189291972d430dde9d47e9ea4a300cb7425f8c7dff2b2a05f596be0f"
          assert p["selected_request_count"]==24
          assert p["model_inference_executed"] is False
          PY

      - name: Materialize native GPT-5.6 Sol page responses
        run: |
          python scripts/materialize_ss001_d007_l001_p2_p0_native.py             --selection reports/selection/ss001-d007-l001-p2-p0-selection.json             --output reports/pilot

      - name: Prove frozen P2-P0 gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("reports/pilot/summary.json").read_text())
          assert s["pilot_id"]=="SS001-D007-L001-P2-P0-NATIVE-v1"
          assert s["selected_request_count"]==24
          assert s["validated_response_count"]==24
          assert all(s["mechanical_gates"].values())
          assert s["manual_audit_pass"] is True
          assert s["promotion_allowed_to_full_1240_request_execution"] is True
          assert s["share_action_clearance_proven"] is False
          assert s["market_capitalization_calculated"] is False
          assert s["return_outcomes_opened"] is False
          print(json.dumps(s,indent=2,sort_keys=True))
          PY

      - name: Upload exact P2-P0 output
        uses: actions/upload-artifact@v4
        with:
          name: ss001-d007-l001-p2-p0-native-${{ github.run_id }}
          path: reports/pilot
          if-no-files-found: error
          retention-days: 90
