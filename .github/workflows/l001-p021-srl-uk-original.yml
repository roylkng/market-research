name: L001 P021 UK SunRisers Leeds statutory cash proof

on:
  push:
    branches:
      - research/l001-p021-uk-subsidiary-original-cash-20261020
    paths:
      - .github/workflows/l001-p021-srl-uk-original.yml
      - registry/l001_p021_srl_uk_filing_facts.json
      - src/marketlab/l001_p021_srl_uk.py
      - scripts/materialize_l001_p021_srl_uk.py
      - tests/test_l001_p021_srl_uk.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l001-p021-uk-srl-cash-report
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MarketLab and source verification libraries
        run: python -m pip install -e '.[dev]'
      - name: Reconcile audited UK subsidiary reporting period without ROIC inference
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_l001_p021_srl_uk.py
          python scripts/materialize_l001_p021_srl_uk.py --check
          ruff check src/marketlab/l001_p021_srl_uk.py scripts/materialize_l001_p021_srl_uk.py tests/test_l001_p021_srl_uk.py
          pytest -q tests/test_l001_p021_srl_uk.py
      - name: Seal exactly source-verified GBP 14-month economic hurdles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/l001/l001-p021-srl-uk-14month-cash-analysis-v1.json
          if git diff --cached --quiet; then
            echo "P021 source cash already frozen"
            exit 0
          fi
          git commit -m "L001 P021: seal original 14month UK subsidiary cashflow review [skip ci]"
          git fetch origin research/l001-p021-uk-subsidiary-original-cash-20261020
          git rebase origin/research/l001-p021-uk-subsidiary-original-cash-20261020
          python scripts/materialize_l001_p021_srl_uk.py --check
          git push origin HEAD:research/l001-p021-uk-subsidiary-original-cash-20261020
