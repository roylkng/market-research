name: H003 pre-evidence provenance correction

on:
  push:
    branches:
      - research/h003-v001-outcome-protocol-20260908
    paths:
      - .github/workflows/h003-outcome-provenance-fix.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h003-v001-outcome-protocol-20260908
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Correct only immutable H003-A001 provenance pointer
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          import yaml

          actual_audit_sha = '0e14c74b9696b2be8cdf3b68184d423054e0a50ec8ed141cea23edc75948d9a1'
          stale_audit_sha = 'e5828081241005325306644765ddac64300dbc9084315325964873d65071770a'

          audit_path = Path('research/prospective/h003/FY27-Q2-2026-09-06/claim-audit-a001/audit.json')
          audit = json.loads(audit_path.read_text())
          declared = audit.pop('audit_sha256')
          raw = json.dumps(
              audit,
              sort_keys=True,
              separators=(',', ':'),
              ensure_ascii=False,
              allow_nan=False,
          ).encode()
          recomputed = hashlib.sha256(raw).hexdigest()
          assert declared == actual_audit_sha, (declared, actual_audit_sha)
          assert recomputed == actual_audit_sha, (recomputed, actual_audit_sha)

          rule_path = Path('registry/h003_outcome_rule.yaml')
          rule = yaml.safe_load(rule_path.read_text())
          old_rule_sha = rule['sha256']
          assert rule['immutable_inputs']['claim_audit_sha256'] == stale_audit_sha
          rule['immutable_inputs']['claim_audit_sha256'] = actual_audit_sha
          unsigned = dict(rule)
          unsigned.pop('sha256', None)
          raw = json.dumps(
              unsigned,
              sort_keys=True,
              separators=(',', ':'),
              ensure_ascii=False,
              allow_nan=False,
          ).encode()
          new_rule_sha = hashlib.sha256(raw).hexdigest()
          rule['sha256'] = new_rule_sha
          rule_path.write_text(yaml.safe_dump(rule, sort_keys=False, allow_unicode=True))

          module_path = Path('src/marketlab/h003_outcomes.py')
          text = module_path.read_text()
          text = text.replace(stale_audit_sha, actual_audit_sha)
          text = text.replace(old_rule_sha, new_rule_sha)
          module_path.write_text(text)

          print(f'audit_sha={actual_audit_sha}')
          print(f'old_rule_sha={old_rule_sha}')
          print(f'new_rule_sha={new_rule_sha}')
          PY
          ruff check --fix src/marketlab/h003_outcomes.py tests/test_h003_outcomes.py
          ruff format src/marketlab/h003_outcomes.py tests/test_h003_outcomes.py
      - name: Revalidate entire pre-evidence protocol
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from marketlab.h003_outcomes import load_and_validate_outcome_rule
          d = load_and_validate_outcome_rule('registry/h003_outcome_rule.yaml')
          audit = json.loads(Path('research/prospective/h003/FY27-Q2-2026-09-06/claim-audit-a001/audit.json').read_text())
          assert d['immutable_inputs']['claim_audit_sha256'] == audit['audit_sha256']
          assert d['live_capital'] is False
          print(f"H003-O001 corrected rule sha256={d['sha256']}")
          PY
          ruff check src scripts tests
          pytest -q
      - name: Commit normal repository files only
        run: |
          git config user.name marketlab-research-bot
          git config user.email marketlab-research-bot@users.noreply.github.com
          git add registry/h003_outcome_rule.yaml src/marketlab/h003_outcomes.py
          git commit -m 'H003-O001: correct frozen audit provenance pointer'
          git push origin HEAD:research/h003-v001-outcome-protocol-20260908
