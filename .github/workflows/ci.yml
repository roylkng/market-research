name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      # Executable research scripts carry frozen acquisition/review logic too.
      - name: Lint
        run: ruff check src tests scripts
      - name: Test
        run: pytest -q
      - name: Validate global research accounting
        run: python scripts/validate_rta001_coverage.py --repo-root .

      - name: Validate hypothesis registry
        run: marketlab validate-registry registry/hypotheses.yaml
