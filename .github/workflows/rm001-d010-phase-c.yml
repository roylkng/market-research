name: RM001 D010 Phase C BRSR coverage

on:
  push:
    branches:
      - feat/rm001-d010-brsr-nic-source-20261002

permissions:
  contents: read

jobs:
  coverage:
    if: contains(github.event.head_commit.message, '[rm001-d010-phase-c]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify Phase C implementation before archive access
        run: |
          ruff check \
            src/marketlab/rm001_d010.py \
            scripts/run_rm001_d010_phase_c.py \
            tests/test_rm001_d010.py
          pytest -q tests/test_rm001_d010.py
          marketlab validate-registry registry/hypotheses.yaml
      - name: Run frozen Phase C coverage diagnostic
        run: |
          python scripts/run_rm001_d010_phase_c.py \
            --output reports/rm001-d010-phase-c \
            --attempts 4 \
            --timeout-seconds 90
      - name: Print compact result
        run: cat reports/rm001-d010-phase-c/summary.json
      - name: Upload exact Phase C evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rm001-d010-phase-c-${{ github.run_id }}
          path: reports/rm001-d010-phase-c
          if-no-files-found: warn
          retention-days: 90
