name: H024 one-time security-master probe 2026-09-17

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/h024-security-master-probe-20260917.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Probe official NSE daily-report API
        shell: bash
        run: |
          python - <<'PY'
          import json
          import requests

          BASE='https://www.nseindia.com/'
          TARGET='CM - MII - Security File (.gz) (NSE Listed securities)'
          s=requests.Session()
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36',
            'Accept':'application/json,text/plain,*/*',
            'Referer':BASE+'all-reports',
          })
          page=s.get(BASE+'all-reports',timeout=30)
          print('all_reports',page.status_code,len(page.content))
          r=s.get(BASE+'api/daily-reports',params={'key':'CM'},timeout=30)
          print('daily_reports',r.status_code,r.url,len(r.content),r.headers.get('content-type'))
          r.raise_for_status()
          payload=r.json()
          print('top_keys',sorted(payload.keys()))
          print('currentDate',payload.get('currentDate'))
          print('previousDate',payload.get('previousDate'))
          for bucket in ('CurrentDay','PreviousDay','FutureDay'):
            rows=payload.get(bucket) or []
            print('bucket',bucket,'count',len(rows))
            for row in rows:
              name=str(row.get('name') or row.get('reportName') or '')
              if 'MII' in name or 'Security File' in name or name==TARGET:
                print('MATCH',bucket,json.dumps(row,sort_keys=True))
                link=row.get('link') or row.get('filePath') or row.get('url')
                if link:
                  rr=s.get(link,timeout=30)
                  print('LINK_FETCH',rr.status_code,rr.url,len(rr.content),rr.headers.get('content-type'),rr.content[:4].hex())
          PY
