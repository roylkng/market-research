name: AE001 T007 P1 freeze

on:
  push:
    branches:
      - feat/ae001-t007-structured-announcement-alpha-20260930

permissions:
  contents: write

jobs:
  freeze:
    if: contains(github.event.head_commit.message, '[ae001-t007-p1]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh latest T007 branch
        run: |
          set -euo pipefail
          git fetch origin feat/ae001-t007-structured-announcement-alpha-20260930
          git checkout -B feat/ae001-t007-structured-announcement-alpha-20260930 \
            origin/feat/ae001-t007-structured-announcement-alpha-20260930

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Append frozen T007 P1
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import hashlib
          import json
          from datetime import UTC, datetime
          from pathlib import Path

          from marketlab.alpha_announcement_features import (
              ANNOUNCEMENT_DEFINITIONS,
              ANNOUNCEMENT_FEATURE_DEFINITION_SHA256,
              ANNOUNCEMENT_TAXONOMY_SHA256,
              SOURCE_END,
              SOURCE_START,
          )
          from marketlab.alpha_trials import (
              append_trial_event,
              require_unopened_registered_trial,
              trial_state,
              validate_trial_ledger,
          )

          path = Path("research/ae001/trial-ledger.json")
          ledger = json.loads(path.read_text(encoding="utf-8"))
          validate_trial_ledger(ledger)
          require_unopened_registered_trial(
              ledger,
              trial_id="AE001-T007",
              required_status="FROZEN_BEFORE_OUTCOME_MATERIALIZATION",
          )
          state = trial_state(ledger, "AE001-T007")
          if any(
              event["payload"].get("protocol_id") == "AE001-T007-P1"
              for event in state["amendments"]
          ):
              raise SystemExit("AE001-T007-P1 already exists")

          protocol_path = Path(
              "research/AE001_T007_STRUCTURED_ANNOUNCEMENT_FEATURES_V1.md"
          )
          registry_path = Path(
              "registry/ae001_t007_announcement_features.yaml"
          )
          payload = {
              "protocol_id": "AE001-T007-P1",
              "status": "FROZEN_BEFORE_OUTCOME_MATERIALIZATION",
              "announcement_taxonomy_sha256": ANNOUNCEMENT_TAXONOMY_SHA256,
              "announcement_feature_definition_sha256": (
                  ANNOUNCEMENT_FEATURE_DEFINITION_SHA256
              ),
              "announcement_feature_names": [
                  definition.name
                  for definition in ANNOUNCEMENT_DEFINITIONS
              ],
              "source_window": [
                  SOURCE_START.isoformat(),
                  SOURCE_END.isoformat(),
              ],
              "d003_report_sha256": (
                  "7f402beecaf90f054c93ca2ceeaa01f38fcc5cd8f7f8f6391f60791768f8a91f"
              ),
              "source_query_granularity": (
                  "ONE_WHOLE_MARKET_QUERY_PER_CALENDAR_DATE"
              ),
              "zero_event_policy": (
                  "VALID_ONLY_WITH_COMPLETE_DAILY_SOURCE_WINDOW"
              ),
              "protocol_document_sha256": hashlib.sha256(
                  protocol_path.read_bytes()
              ).hexdigest(),
              "registry_document_sha256": hashlib.sha256(
                  registry_path.read_bytes()
              ).hexdigest(),
              "outcome_materialization_started": False,
              "live_capital_allowed": False,
          }
          updated = append_trial_event(
              ledger,
              event_type="TRIAL_PROTOCOL_AMENDED",
              trial_id="AE001-T007",
              recorded_at_utc=datetime.now(UTC).isoformat(),
              payload=payload,
          )
          path.write_text(
              json.dumps(
                  updated,
                  indent=2,
                  sort_keys=True,
                  ensure_ascii=False,
                  allow_nan=False,
              )
              + "\n",
              encoding="utf-8",
          )
          validate_trial_ledger(updated)
          print(
              json.dumps(
                  {
                      "event_count": updated["event_count"],
                      "ledger_sha256": updated["ledger_sha256"],
                      "event_sha256": updated["events"][-1]["event_sha256"],
                      "taxonomy_sha256": ANNOUNCEMENT_TAXONOMY_SHA256,
                      "feature_definition_sha256": (
                          ANNOUNCEMENT_FEATURE_DEFINITION_SHA256
                      ),
                  },
                  sort_keys=True,
              )
          )
          PY

      - name: Commit P1 to trial branch
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/ae001/trial-ledger.json
          git commit -m "research: freeze AE001 T007 protocol P1 [skip ci]"
          git push origin HEAD:feat/ae001-t007-structured-announcement-alpha-20260930
