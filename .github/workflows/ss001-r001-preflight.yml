name: SS001 R001 frozen queue transport preflight

on:
  push:
    branches:
      - research/ss001-d007-l001-batch-transport-20261009

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    if: contains(github.event.head_commit.message, '[r001-preflight]')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate unit/integrity suite
        run: |
          ruff check \
            src/marketlab/ss001_l001_batch.py \
            scripts/run_ss001_l001_batch.py \
            tests/test_ss001_l001_batch.py
          pytest -q tests/test_ss001_l001_batch.py
      - name: Download exact frozen 1240-page queue
        uses: actions/download-artifact@v4
        with:
          name: ss001-d007-l001-p2-queue-37884584355
          path: reports/source
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37884584355
      - name: Materialize no-inference configuration
        run: |
          mkdir -p reports/r001
          python - <<'PY'
          import json
          from pathlib import Path

          config = {
              "schema_version": 1,
              "provider_runtime": "OPENAI_COMPATIBLE_CHAT",
              "model_id": "PREFLIGHT_ONLY_NO_INFERENCE",
              "api_endpoint": "http://127.0.0.1:8080/v1/chat/completions",
              "temperature": 0.0,
              "top_p": 1.0,
              "max_completion_tokens": 4096,
              "timeout_seconds": 15,
              "auth_env": "MARKETLAB_LLM_API_KEY",
              "token_parameter": "max_tokens",
              "json_object_mode": True,
          }
          Path("reports/r001/config.json").write_text(json.dumps(config))
          PY
      - name: Execute source-only frozen queue preflight
        run: |
          python scripts/run_ss001_l001_batch.py \
            --queue reports/source/ss001-d007-l001-p2-queue.json \
            --config reports/r001/config.json \
            --output-dir reports/r001/output \
            --dry-run
      - name: Assert no model execution or capital decisions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("reports/r001/output/preflight.json").read_text())
          assert p["status"] == "PREFLIGHT_PASS_NO_INFERENCE"
          assert p["source_queue_sha256"] == "59929004bcc5a5eae4491cadc237aa1bb26b822102d56b5b50cf61fb6b667618"
          assert p["request_count"] == 1240
          assert p["shard_count"] == 16
          assert sum(p["shard_request_counts"].values()) == 1240
          assert p["model_inference_executed"] is False
          assert p["share_action_clearance_proven"] is False
          assert p["market_capitalization_calculated"] is False
          assert p["return_outcomes_opened"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          print(json.dumps({
              "preflight_sha256": p["preflight_sha256"],
              "runtime_model_config_sha256": p["runtime_model_config_sha256"],
              "shard_request_counts": p["shard_request_counts"],
              "model_inference_executed": p["model_inference_executed"],
          }, sort_keys=True))
          PY
      - name: Upload source-only preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss001-r001-preflight-${{ github.run_id }}
          path: reports/r001/output
          if-no-files-found: warn
          retention-days: 90
