name: H022 expanded feature freeze once

on:
  push:
    branches:
      - research/h022-expanded-feature-panel-v1-20260913
    paths:
      - .github/workflows/h022-expanded-feature-freeze-once.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OUT_DIR: research/historical/h022/expanded-feature-panel-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h022-expanded-feature-panel-v1-20260913
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and validate
        run: |
          python -m pip install -e '.[dev]'
          make validate

      - name: Build expanded outcome-free H022 panel
        run: |
          mkdir -p "$OUT_DIR"
          python scripts/build_h022_expanded_features.py \
            --candidate-report research/historical/h022/expanded-e002-v1/report.json \
            --out "$OUT_DIR/feature-panel.json" \
            --summary-out "$OUT_DIR/summary.json"

      - name: Anchor freeze provenance
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          out = Path(os.environ['OUT_DIR'])
          summary = json.loads((out / 'summary.json').read_text(encoding='utf-8'))
          metadata = {
              'schema_version': 1,
              'feature_rule_id': 'H022-UF001',
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'frozen_at_utc': datetime.now(UTC).isoformat().replace('+00:00', 'Z'),
              **summary,
          }
          (out / 'freeze-metadata.json').write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          if summary['outcome_data_attached'] is not False:
              raise SystemExit('expanded feature panel unexpectedly contains outcomes')
          PY

      - name: Commit frozen panel and remove one-shot workflow
        run: |
          git config user.name 'marketlab-research-bot'
          git config user.email 'marketlab-research-bot@users.noreply.github.com'
          git add "$OUT_DIR"
          git rm .github/workflows/h022-expanded-feature-freeze-once.yml
          git commit -m 'H022: freeze expanded outcome-free feature panel'
          git push origin HEAD:research/h022-expanded-feature-panel-v1-20260913
