name: H018 resolve remaining official sessions

on:
  push:
    branches: [research/h018-promotion-audit-20260908]
    paths: [.github/workflows/h018-resolve-remaining-sessions.yml]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h018-promotion-audit-20260908
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: mkdir -p /tmp/h018-resolve
      - name: Restore second accelerated source corpus
        uses: actions/download-artifact@v4
        with:
          name: h018-fast-static-checkpoints-34329703489
          path: /tmp/h018-resolve
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 34329703489
      - name: Resolve remaining dates without opening outcomes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys, threading, time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import date
          from pathlib import Path
          from urllib.parse import urlparse, urlunparse
          import requests

          sys.path.insert(0, 'scripts')
          import h018_checkpoint_market as h18
          import run_h015_independent_challenge as h15

          ROOT = Path('/tmp/h018-resolve')
          NSE = ('archives.nseindia.com', 'nsearchives.nseindia.com')
          NIFTY = ('www.niftyindices.com', 'niftyindices.com')
          ALLOWED = set(NSE + NIFTY)
          LOCAL = threading.local()
          diagnostics = {k: [] for k in (
              'serial_retries','fetch_failures','source_mismatches','parse_errors',
              'worker_errors','hard_timeouts','unresolved_dates'
          )}

          def sess():
              if not hasattr(LOCAL, 's'):
                  s = requests.Session()
                  s.headers.update({
                      'User-Agent': h15.base.USER_AGENT,
                      'Accept': 'text/csv,application/zip,application/octet-stream,*/*',
                      'Referer': 'https://www.nseindia.com/',
                  })
                  LOCAL.s = s
              return LOCAL.s

          def host(url, h):
              p = urlparse(url)
              return urlunparse(p._replace(netloc=h))

          def get(url):
              last = None
              for attempt in range(3):
                  try:
                      r = sess().get(url, timeout=(6,20), allow_redirects=True)
                      if (urlparse(r.url).hostname or '').lower() not in ALLOWED:
                          raise ValueError('redirect outside frozen official hosts')
                      if r.status_code == 404:
                          return {'status':'HTTP_404','url':r.url,'raw':None}
                      if r.status_code in {403,429} or r.status_code >= 500:
                          last = f'HTTP_{r.status_code}'
                          if attempt < 2:
                              time.sleep(0.5*(attempt+1)); continue
                      r.raise_for_status()
                      if not r.content:
                          raise ValueError('empty response')
                      return {'status':'HTTP_200','url':r.url,'raw':r.content}
                  except (requests.RequestException, ValueError) as exc:
                      last = f'{type(exc).__name__}: {exc}'
                      if attempt < 2:
                          time.sleep(0.5*(attempt+1))
              return {'status':'FETCH_FAILED','url':url,'raw':None,'error':last}

          def valid_bhav(item, day):
              if item['raw'] is None: return False
              try:
                  h15.parse_legacy_bhavcopy(item['raw'], day); return True
              except ValueError as exc:
                  item['parse_error'] = str(exc); return False

          def valid_index(item, day):
              if item['raw'] is None: return False
              try:
                  h18._parse_nifty500_h018(item['raw'], day); return True
              except (UnicodeDecodeError, ValueError) as exc:
                  item['parse_error'] = str(exc); return False

          def resolve(day):
              bbase = h15.legacy_bhavcopy_url(day)
              ibase = h15.base.index_snapshot_url(day)
              ba=[]; ia=[]; vb=None; vi=None
              for h in NSE:
                  x=get(host(bbase,h)); x['valid']=valid_bhav(x,day); ba.append(x)
                  if x['valid']: vb=x; break
              for h in NSE:
                  x=get(host(ibase,h)); x['valid']=valid_index(x,day); ia.append(x)
                  if x['valid']: vi=x; break
              if vi is None:
                  stamp=day.strftime('%d%m%Y')
                  for h in NIFTY:
                      x=get(f'https://{h}/Daily_Snapshot/ind_close_all_{stamp}.csv')
                      x['valid']=valid_index(x,day); ia.append(x)
                      if x['valid']: vi=x; break
              return {'date':day.isoformat(),'vb':vb,'vi':vi,'ba':ba,'ia':ia}

          incoming=json.loads((ROOT/'fast-acquisition-summary.json').read_text())
          if incoming.get('market_selection_outcomes_opened') is not False or incoming.get('total_checkpoints') != 1029:
              raise SystemExit('unexpected restored acquisition corpus')
          forbidden=('point-in-time-selections.json','challenge-summary.json','selected.csv')
          if any((ROOT/x).exists() for x in forbidden):
              raise SystemExit('outcome artifact present before resolver')

          days=h15.calendar_days(date(2013,11,1),date(2017,5,31))
          pending=[d for d in days if h18._complete_checkpoint(ROOT,d) is None]
          if len(pending)!=279: raise SystemExit(f'expected 279 unresolved, found {len(pending)}')
          print(f'resolving {len(pending)} dates',flush=True)
          rows=[]
          with ThreadPoolExecutor(max_workers=8) as pool:
              fs={pool.submit(resolve,d):d for d in pending}
              for n,f in enumerate(as_completed(fs),1):
                  try: rows.append(f.result())
                  except Exception as exc:
                      diagnostics['worker_errors'].append({'date':fs[f].isoformat(),'error':f'{type(exc).__name__}: {exc}'})
                  if n%50==0: print(f'resolver {n}/{len(pending)}',flush=True)

          new_common=new_no=0; unresolved=[]
          for row in sorted(rows,key=lambda r:r['date']):
              day=date.fromisoformat(row['date']); vb=row['vb']; vi=row['vi']
              if vb is not None and vi is not None:
                  if h18._retain_result(ROOT,{
                      'date':day.isoformat(),'bhavcopy_url':vb['url'],'bhavcopy_raw':vb['raw'],
                      'bhavcopy_meta':{'status':'OK'},'index_url':vi['url'],'index_raw':vi['raw'],
                      'index_meta':{'status':'OK'},'serial_retries':[]},diagnostics):
                      new_common+=1; continue
              bv=any(x.get('valid') for x in row['ba']); iv=any(x.get('valid') for x in row['ia'])
              b404=any(x.get('status')=='HTTP_404' for x in row['ba'])
              first_two=row['ia'][:2]
              i404=len(first_two)==2 and all(x.get('status')=='HTTP_404' for x in first_two)
              if not bv and not iv and b404 and i404:
                  h18._atomic_json(h18._checkpoint_path(ROOT,day),{
                      'schema_version':h18.CHECKPOINT_SCHEMA,'date':day.isoformat(),'status':'NO_SESSION',
                      'bhavcopy_status':'NO_VALID_BHAVCOPY_WITH_OFFICIAL_404',
                      'index_status':'BOTH_NSE_INDEX_ARCHIVES_HTTP_404_NO_VALID_NIFTY_SNAPSHOT',
                      'no_session_confirmation':'FROZEN_MULTI_HOST_OFFICIAL_ABSENCE_RULE'})
                  new_no+=1; continue
              unresolved.append({
                  'date':day.isoformat(),'has_valid_bhavcopy':bv,'has_valid_index':iv,
                  'bhavcopy':[{k:v for k,v in x.items() if k!='raw'} for x in row['ba']],
                  'index':[{k:v for k,v in x.items() if k!='raw'} for x in row['ia']]})

          cps=list((ROOT/'checkpoints').glob('*.json')); common=no=0
          for p in cps:
              st=json.loads(p.read_text()).get('status')
              common+=st=='COMMON_SESSION'; no+=st=='NO_SESSION'
          remaining=[d.isoformat() for d in days if h18._complete_checkpoint(ROOT,d) is None]
          if remaining != [x['date'] for x in unresolved]: raise SystemExit('remaining census mismatch')
          summary={
              'status':'H018_REMAINING_SESSION_RESOLUTION_ONLY','market_selection_outcomes_opened':False,
              'restored_checkpoint_count':1029,'new_common_sessions':new_common,'new_no_session_days':new_no,
              'total_checkpoints':len(cps),'total_common_sessions':common,'total_no_session_days':no,
              'remaining_unresolved_count':len(remaining),'remaining_unresolved_dates':remaining,
              'remaining_details':unresolved,'parser_diagnostics':diagnostics}
          (ROOT/'remaining-session-resolution-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:summary[k] for k in (
              'status','new_common_sessions','new_no_session_days','total_checkpoints',
              'total_common_sessions','total_no_session_days','remaining_unresolved_count')},indent=2),flush=True)
          if any((ROOT/x).exists() for x in forbidden): raise SystemExit('resolver opened an outcome')
          PY
      - name: Upload resolved checkpoint corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h018-resolved-session-checkpoints-${{ github.run_id }}
          path: |
            /tmp/h018-resolve/checkpoints
            /tmp/h018-resolve/raw
            /tmp/h018-resolve/remaining-session-resolution-summary.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
