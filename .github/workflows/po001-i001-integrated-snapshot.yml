name: PO001 I001 integrated snapshot

on:
  push:
    branches:
      - feat/po001-integrated-state-20260929

permissions:
  contents: read

jobs:
  pilot:
    if: contains(github.event.head_commit.message, '[po001-i001]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify integrated implementation before source access
        run: |
          ruff check \
            src/marketlab/po001.py \
            src/marketlab/po001_i001.py \
            scripts/build_ae001_delivery_features.py \
            scripts/run_po001_i001.py \
            tests/test_po001.py \
            tests/test_po001_i001.py
          pytest -q \
            tests/test_po001.py \
            tests/test_po001_i001.py \
            tests/test_rm001.py \
            tests/test_rm001_historical_state.py

      - name: Rebuild fixed official NSE market panel
        run: |
          python scripts/build_ae001_historical_panel.py \
            --start-date 2025-09-01 \
            --end-date 2026-09-25 \
            --store .marketlab/po001-i001 \
            --output reports/po001-i001/panel \
            --attempts 4 \
            --timeout-seconds 30 \
            --pause-seconds 0.05

      - name: Rebuild corporate-action-safe AE001 base features
        run: |
          python scripts/build_ae001_action_safe_panel.py \
            --market-panel reports/po001-i001/panel/market-panel.json.gz \
            --feature-panel reports/po001-i001/panel/feature-panel.json.gz \
            --start-date 2025-09-01 \
            --end-date 2026-09-25 \
            --raw-dir reports/po001-i001/corporate-actions/raw \
            --output reports/po001-i001/action-safe \
            --chunk-days 31 \
            --attempts 4 \
            --timeout-seconds 30

      - name: Build reusable AE001 delivery feature panel
        run: |
          python scripts/build_ae001_delivery_features.py \
            --market-panel reports/po001-i001/panel/market-panel.json.gz \
            --feature-panel reports/po001-i001/action-safe/action-safe-feature-panel.json.gz \
            --store .marketlab/po001-i001 \
            --output reports/po001-i001/delivery \
            --attempts 4 \
            --timeout-seconds 30

      - name: Build RM001 25 Sep risk state
        run: |
          python scripts/build_rm001_historical_state.py \
            --market-panel reports/po001-i001/panel/market-panel.json.gz \
            --feature-panel reports/po001-i001/action-safe/action-safe-feature-panel.json.gz \
            --action-ledger reports/po001-i001/action-safe/corporate-action-ledger.json.gz \
            --as-of-session 2026-09-25 \
            --output reports/po001-i001/risk

      - name: Run frozen I001 portfolio comparisons
        run: |
          python scripts/run_po001_i001.py \
            --feature-panel reports/po001-i001/delivery/delivery-feature-panel.json.gz \
            --risk-state reports/po001-i001/risk/risk-state.json.gz \
            --models research/prospective/ae001-t004/frozen-models-v1.json \
            --output reports/po001-i001/study

      - name: Print compact result
        run: cat reports/po001-i001/study/summary.json

      - name: Upload exact I001 development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: po001-i001-${{ github.run_id }}
          path: |
            reports/po001-i001
            .marketlab/po001-i001/market-data
          if-no-files-found: warn
          retention-days: 90
