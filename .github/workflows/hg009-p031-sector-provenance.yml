name: HG009 P031 official four-tier NSE industry provenance

on:
  workflow_dispatch:
  push:
    branches:
      - feat/hg009-p031-official-nse-industry-source-20261021
    paths:
      - .github/workflows/hg009-p031-sector-provenance.yml
      - src/marketlab/hg009_p031_industry.py
      - scripts/capture_hg009_p031_industry.py
      - tests/test_hg009_p031_industry.py
  schedule:
    # Small, rate-limited batches for future independent cohort only.
    # Scheduled workflows execute on default branch only after merge.
    - cron: '15 6,10,14 * * 1-5'

permissions:
  contents: write

concurrency:
  group: hg009-p031-industry-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify canonical cohort and original-source parser
        shell: bash
        run: |
          set -euo pipefail
          ruff check \
            src/marketlab/hg009_p031_industry.py \
            scripts/capture_hg009_p031_industry.py \
            tests/test_hg009_p031_industry.py
          pytest -q tests/test_hg009_p031_industry.py
          python scripts/capture_hg009_p031_industry.py --check

      - name: Capture conservative NSE issuer industry probe
        shell: bash
        run: |
          set -euo pipefail
          COUNT=4
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            COUNT=12
          fi
          python scripts/capture_hg009_p031_industry.py \
            --max-symbols "$COUNT" \
            --attempts 1 \
            --timeout-seconds 10 \
            --pause-seconds 1.5
          python scripts/capture_hg009_p031_industry.py --check

      - name: Anchor successful or blocked original evidence without backdating
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add -f research/hg009/p031-industry
          if git diff --cached --quiet; then
            echo "No new NSE issuer industry-source evidence"
            exit 0
          fi
          git commit -m "HG009 P031: timestamp actual NSE issuer industry source receipts [skip ci]"
          TARGET="$GITHUB_REF_NAME"
          git fetch origin "$TARGET"
          git rebase "origin/$TARGET"
          python scripts/capture_hg009_p031_industry.py --check
          git push origin HEAD:"$TARGET"
