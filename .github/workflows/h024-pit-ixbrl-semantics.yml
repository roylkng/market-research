name: H024 current PIT iXBRL semantics

on:
  workflow_dispatch:
  push:
    branches:
      - research/h024-insider-source-probe-v1-20260915
    paths:
      - '.github/workflows/h024-pit-ixbrl-semantics.yml'
      - 'scripts/probe_h024_pit_ixbrl_semantics.py'
      - 'scripts/probe_h024_nse_pit_gg.py'

permissions:
  contents: write

concurrency:
  group: h024-pit-ixbrl-semantics
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint source-only semantic probe
        run: |
          ruff check scripts/probe_h024_nse_pit_gg.py
          # I001 is import-grouping style only. Keep the committed probe bytes unchanged while
          # running this source-only experiment, then normalize imports before integration.
          ruff check --ignore I001 scripts/probe_h024_pit_ixbrl_semantics.py
      - name: Inventory current Regulation 7(2) iXBRL semantics
        shell: bash
        run: |
          set -euo pipefail
          WORK="reports/h024-pit-ixbrl-semantics/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$WORK/raw"
          python scripts/probe_h024_pit_ixbrl_semantics.py \
            --from-date 2026-05-01 \
            --to-date 2026-09-15 \
            --out "$WORK/report.json" \
            --raw-dir "$WORK/raw" \
            --originals-per-month 6 \
            --revision-limit 8 \
            --attempts 4 \
            --pause-seconds 0.08
          echo "work_dir=$WORK" >> "$GITHUB_ENV"
      - name: Retain compact iXBRL semantic inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/probes/h024
          cp "$work_dir/report.json" \
            research/probes/h024/nse-pit-ixbrl-semantics-v1.json
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/probes/h024/nse-pit-ixbrl-semantics-v1.json
          if ! git diff --cached --quiet; then
            git commit -m "H024: anchor PIT iXBRL semantic inventory"
            git push origin HEAD:research/h024-insider-source-probe-v1-20260915
          fi
      - name: Upload exact iXBRL source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h024-pit-ixbrl-semantics-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/h024-pit-ixbrl-semantics
          if-no-files-found: error
          retention-days: 90
