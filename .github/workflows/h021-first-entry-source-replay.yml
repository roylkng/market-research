name: H021 independent Oct12 original market entry source replay

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - H021 first official entry source observation
    types:
      - completed
    branches:
      - main
  schedule:
    # 21:30 IST catch-up, after all scheduled post-close source attempts.
    - cron: '0 16 * * 1-5'

permissions:
  contents: write

concurrency:
  group: h021-first-entry-independent-raw-source-replay-v1
  cancel-in-progress: false

jobs:
  replay:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify source replay code and original frozen selection
        run: |
          ruff check src/marketlab/h021_entry_replay.py scripts/replay_h021_first_official_entry.py tests/test_h021_entry_replay.py
          pytest -q tests/test_h021_entry_replay.py tests/test_h021_entry_observation.py tests/test_h021_first_entry_intent.py

      - name: Resolve real first-source availability without fictitious OHLC
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=Asia/Kolkata date +%F)"
          STATE=SKIP
          OUT="research/prospective/h021/entry-observations/replays/2026-10-12-source-raw-replay-v1.json"
          FIRST="research/prospective/h021/entry-observations/2026-10-12-first-entry-v1.json"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || ( "$TODAY" > "2026-10-11" && "$TODAY" < "2026-10-31" ) ]]; then
            git fetch origin main
            if git cat-file -e "origin/main:$OUT" 2>/dev/null; then
              STATE=ALREADY_REPLAYED
            elif git cat-file -e "origin/main:$FIRST" 2>/dev/null; then
              STATE=REPLAY
            else
              STATE=WAITING_FOR_REAL_OFFICIAL_POST_CLOSE_SOURCES
            fi
          fi
          echo "status=$STATE" >> "$GITHUB_OUTPUT"
          echo "First source replay gate=$STATE"
      - name: Recheck stored original exchange bytes independently of summary
        if: steps.gate.outputs.status == 'REPLAY'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          OUTPUT="/tmp/h021-first-raw-source-replay-v1.json"
          python scripts/replay_h021_first_official_entry.py --out "$OUTPUT"
          test -s "$OUTPUT"
          python - "$OUTPUT" <<'PY'
          import json,sys
          from pathlib import Path
          from marketlab.h021_entry_replay import validate_first_h021_replay
          p=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          validate_first_h021_replay(p)
          assert p['selected_stock_source_count']==10
          assert p['proves_first_open_was_executable_fill'] is False
          assert p['expected_returns_calculated'] is False
          assert p['live_capital_allowed'] is False
          print("Replayed all ten source bars and Nifty500 original index; returns/portfolio blocked")
          PY
      - name: Anchor exact original-source replay once without mutating first capture
        if: steps.gate.outputs.status == 'REPLAY'
        shell: bash
        run: |
          set -euo pipefail
          TARGET="research/prospective/h021/entry-observations/replays/2026-10-12-source-raw-replay-v1.json"
          mkdir -p "$(dirname "$TARGET")"
          if [[ -f "$TARGET" ]]; then
            echo "Duplicate source replay path; no overwrites"
            exit 1
          fi
          cp /tmp/h021-first-raw-source-replay-v1.json "$TARGET"
          git config user.name marketlab-research-bot
          git config user.email marketlab-research-bot@users.noreply.github.com
          git add -f "$TARGET"
          git commit -m "H021: independently replay original Oct12 ten EQ opens and index bytes [skip ci]"
          BASE_SHA="$(git rev-parse HEAD^)"
          for RETRY in 1 2 3 4 5; do
            git fetch origin main
            MAIN_SHA="$(git rev-parse origin/main)"
            if git cat-file -e "origin/main:$TARGET" 2>/dev/null; then
              echo "Original replay already published; never overwrite or recalculate"
              exit 1
            fi
            if ! git diff --quiet "$BASE_SHA" "$MAIN_SHA" -- \
              research/prospective/h021/entry-observations/2026-10-12-first-entry-v1.json \
              research/prospective/h021/entry-observations/raw/sha256 \
              research/prospective/h021/intents/2026-10-09-primary-entry-intent-v1.json \
              research/prospective/h021/comparisons/2026-10-09-primary-revision-v1.json \
              research/prospective/universes/FY27-Q2-2026-09-06.json \
              research/prospective/calendars/FY27-Q2-2026-09-06/NSE-CM-FY27Q2-v1.json \
              src/marketlab/h021_entry_observation.py \
              src/marketlab/h021_entry_replay.py \
              src/marketlab/pf001_marketdata.py \
              scripts/replay_h021_first_official_entry.py; then
              echo "Original captured market data/selection/parser changed while being replayed"
              exit 1
            fi
            if [[ "$MAIN_SHA" != "$BASE_SHA" ]]; then
              git rebase origin/main
              BASE_SHA="$MAIN_SHA"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((RETRY * 2))"
          done
          echo "Source replay bytes safely preserved in Actions artifact; Git anchor exhausted"
          exit 1
      - name: Retain original replay evidence if Git anchoring fails
        if: always() && steps.gate.outputs.status == 'REPLAY'
        uses: actions/upload-artifact@v4
        with:
          name: h021-first-real-entry-original-source-replay
          path: /tmp/h021-first-raw-source-replay-v1.json
          if-no-files-found: ignore
          retention-days: 90
