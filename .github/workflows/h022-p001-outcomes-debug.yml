name: H022 P001 outcome debug

on:
  push:
    branches:
      - research/h022-p001-prospective-outcomes-v1-20260914
    paths:
      - '.github/workflows/h022-p001-outcomes-debug.yml'
      - 'src/marketlab/h022_p001_outcomes.py'
      - 'src/marketlab/h022_p001_outcomes_impl.py'
      - 'tests/test_h022_p001_outcomes.py'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Capture focused pytest
        id: test
        shell: bash
        run: |
          set +e
          pytest -vv --tb=long tests/test_h022_p001_outcomes.py > h022-p001-outcomes-pytest.txt 2>&1
          CODE=$?
          cat h022-p001-outcomes-pytest.txt
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: h022-p001-outcomes-debug-${{ github.run_id }}
          path: h022-p001-outcomes-pytest.txt
          if-no-files-found: error
      - name: Preserve test result
        shell: bash
        run: exit "${{ steps.test.outputs.exit_code }}"
