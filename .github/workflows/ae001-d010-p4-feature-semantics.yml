name: AE001 D010 P4 feature semantics

on:
  push:
    branches:
      - feat/ae001-d010-p4-feature-semantics-20261001

permissions:
  contents: read

jobs:
  materialize:
    if: contains(github.event.head_commit.message, '[ae001-d010-p4]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify frozen P4 implementation
        run: |
          ruff check             src/marketlab/alpha_d010_p4.py             scripts/run_ae001_d010_p4.py             tests/test_alpha_d010_p4.py
          pytest -q             tests/test_alpha_d010_p3.py             tests/test_alpha_d010_p3b.py             tests/test_alpha_d010_p4.py

      - name: Rebuild official NSE market panel with support history
        run: |
          python scripts/build_ae001_historical_panel.py             --start-date 2025-06-01             --end-date 2026-09-25             --store .marketlab/ae001-d010-p4             --output reports/ae001-d010-p4/panel             --attempts 4             --timeout-seconds 30             --pause-seconds 0.05

      - name: Rebuild action-safe 18-feature base
        run: |
          python scripts/build_ae001_action_safe_panel.py             --market-panel reports/ae001-d010-p4/panel/market-panel.json.gz             --feature-panel reports/ae001-d010-p4/panel/feature-panel.json.gz             --start-date 2025-06-01             --end-date 2026-09-25             --raw-dir reports/ae001-d010-p4/corporate-actions/raw             --output reports/ae001-d010-p4/action-safe             --chunk-days 31             --attempts 4             --timeout-seconds 30

      - name: Materialize frozen D010 P4 features
        run: |
          python scripts/run_ae001_d010_p4.py             --market-panel reports/ae001-d010-p4/panel/market-panel.json.gz             --feature-panel reports/ae001-d010-p4/action-safe/action-safe-feature-panel.json.gz             --output reports/ae001-d010-p4/features             --attempts 4             --timeout-seconds 30

      - name: Print compact result
        run: |
          cat reports/ae001-d010-p4/features/manifest.json
          cat reports/ae001-d010-p4/features/report.json

      - name: Upload exact P4 development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae001-d010-p4-${{ github.run_id }}
          path: |
            reports/ae001-d010-p4
            .marketlab/ae001-d010-p4/market-data
          if-no-files-found: warn
          retention-days: 90
