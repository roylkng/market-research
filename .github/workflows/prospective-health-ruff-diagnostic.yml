name: Prospective health Ruff diagnostic

on:
  push:
    branches:
      - feat/prospective-health-rm001-sources-20261002

permissions:
  contents: read

jobs:
  diff:
    if: contains(github.event.head_commit.message, '[health-ruff-diagnostic]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ruff
        run: python -m pip install 'ruff==0.16.10'
      - name: Print exact Ruff fix
        run: |
          ruff check --fix src/marketlab/prospective_health.py || true
          git diff -- src/marketlab/prospective_health.py
