name: HG009 P009 archive remaining original NSE issuer filings

on:
  push:
    branches:
      - research/hg009-p009-original-filing-archive-20261014
    paths:
      - .github/workflows/hg009-p009-issuer-originals.yml
      - src/marketlab/hg009_p009_originals.py
      - scripts/archive_hg009_p009_originals.py
      - scripts/verify_hg009_p009_originals.py
      - tests/test_hg009_p009_originals.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hg009-p009-original-nse-filing-custody
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and test original source guards
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          ruff check src/marketlab/hg009_p009_originals.py scripts/archive_hg009_p009_originals.py scripts/verify_hg009_p009_originals.py tests/test_hg009_p009_originals.py
          pytest -q tests/test_hg009_p009_originals.py
          python scripts/verify_hg009_p009_originals.py

      - name: Attempt five exact original NSE issuer HTML/PDF filings
        shell: bash
        run: |
          set -euo pipefail
          python scripts/archive_hg009_p009_originals.py \
            --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python scripts/verify_hg009_p009_originals.py

      - name: Anchor original source bytes and true-UTC fail-closed receipts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add -f research/hg009/p009-originals
          if git diff --cached --quiet; then
            echo "No new original issuer evidence to anchor"
            exit 0
          fi
          git commit -m "HG009 P009: retain dated original NSE issuer bytes and failures [skip ci]"
          git fetch origin research/hg009-p009-original-filing-archive-20261014
          git rebase origin/research/hg009-p009-original-filing-archive-20261014
          python scripts/verify_hg009_p009_originals.py
          git push origin HEAD:research/hg009-p009-original-filing-archive-20261014
