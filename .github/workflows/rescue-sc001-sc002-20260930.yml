name: Rescue SC001 SC002 2026-09-30

on:
  push:
    branches:
      - ops/rescue-sc001-sc002-20260930

permissions:
  contents: write

jobs:
  capture:
    if: contains(github.event.head_commit.message, '[rescue-sc001-sc002]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify frozen source-probe code
        run: |
          python scripts/verify_ae001_sc001.py \
            --ledger research/prospective/ae001-sc001/source-ledger.json
          python scripts/verify_ae001_sc002.py \
            --ledger research/prospective/ae001-sc002/source-ledger.json
          pytest -q \
            tests/test_alpha_prospective_sources.py \
            tests/test_alpha_prospective_futures_sources.py

      - name: Capture SC001 exact current-session sources
        run: |
          python scripts/probe_ae001_sc001.py \
            --session-date 2026-09-30 \
            --ledger research/prospective/ae001-sc001/source-ledger.json \
            --attempts 4 \
            --timeout-seconds 20 | tee rescue-sc001.json

      - name: Capture SC002 exact current-session futures source
        run: |
          python scripts/probe_ae001_sc002.py \
            --session-date 2026-09-30 \
            --ledger research/prospective/ae001-sc002/source-ledger.json \
            --attempts 4 \
            --timeout-seconds 20 | tee rescue-sc002.json

      - name: Verify captured source ledgers
        run: |
          python scripts/verify_ae001_sc001.py \
            --ledger research/prospective/ae001-sc001/source-ledger.json
          python scripts/verify_ae001_sc002.py \
            --ledger research/prospective/ae001-sc002/source-ledger.json
          cat rescue-sc001.json
          cat rescue-sc002.json

      - name: Commit rescue evidence to rescue branch
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add \
            research/prospective/ae001-sc001 \
            research/prospective/ae001-sc002
          if git diff --cached --quiet; then
            echo "No source evidence changed"
            exit 0
          fi
          git commit -m "ops: seal 2026-09-30 SC001 SC002 rescue capture [skip ci]"
          git push origin HEAD:ops/rescue-sc001-sc002-20260930
