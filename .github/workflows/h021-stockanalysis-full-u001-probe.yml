name: H021 StockAnalysis full U001 parser probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/h021-stockanalysis-full-u001-probe-20260914
    paths:
      - 'src/marketlab/h021_stockanalysis_full_probe.py'
      - 'scripts/probe_h021_stockanalysis_full_u001.py'
      - 'scripts/aggregate_h021_stockanalysis_full_u001_probe.py'
      - 'tests/test_h021_stockanalysis_full_probe.py'
      - 'research/prospective/h021/stockanalysis-full-u001-probe-v1.json'
      - '.github/workflows/h021-stockanalysis-full-u001-probe.yml'

permissions:
  contents: write

concurrency:
  group: h021-stockanalysis-full-u001-probe
  cancel-in-progress: true

jobs:
  probe-shard:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        batch_id: [B01, B02]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate dry-run invariants
        run: pytest -q tests/test_h021_stockanalysis_full_probe.py tests/test_h021_stockanalysis_parser.py

      - name: Run low-rate source-only shard
        shell: bash
        run: |
          OUT="/tmp/h021-full-u001-${{ matrix.batch_id }}.json"
          python scripts/probe_h021_stockanalysis_full_u001.py \
            --config research/prospective/h021/stockanalysis-full-u001-probe-v1.json \
            --batch-id "${{ matrix.batch_id }}" \
            --out "$OUT"

      - name: Upload shard evidence
        uses: actions/upload-artifact@v4
        with:
          name: h021-full-u001-${{ matrix.batch_id }}
          path: /tmp/h021-full-u001-${{ matrix.batch_id }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: probe-shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Download shard evidence
        uses: actions/download-artifact@v4
        with:
          pattern: h021-full-u001-*
          path: /tmp/h021-full-u001-shards
          merge-multiple: true

      - name: Aggregate exact frozen U001 coverage
        id: aggregate
        shell: bash
        run: |
          OUT="reports/h021-stockanalysis-full-u001-probe/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}.json"
          python scripts/aggregate_h021_stockanalysis_full_u001_probe.py \
            --config research/prospective/h021/stockanalysis-full-u001-probe-v1.json \
            --shard-dir /tmp/h021-full-u001-shards \
            --out "$OUT"
          echo "report_path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Anchor combined source-only evidence
        shell: bash
        run: |
          OUT="${{ steps.aggregate.outputs.report_path }}"
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add "$OUT"
          if ! git diff --cached --quiet; then
            git commit -m "H021: anchor full-U001 parser probe ${GITHUB_RUN_ID} [skip ci]"
            git push origin HEAD:research/h021-stockanalysis-full-u001-probe-20260914
          fi

      - name: Upload combined evidence
        uses: actions/upload-artifact@v4
        with:
          name: h021-stockanalysis-full-u001-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.aggregate.outputs.report_path }}
          if-no-files-found: error
          retention-days: 90
