name: HA001 D001 broad-market asset source census

on:
  push:
    branches:
      - research/ha001-asset-anomaly-census-20261010

permissions:
  actions: read
  contents: read

jobs:
  source-census:
    if: contains(github.event.head_commit.message, '[ha001-d001]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate frozen implementation before panel access
        run: |
          ruff check src/marketlab/ha001_asset_census.py scripts/materialize_ha001_d001.py tests/test_ha001_asset_census.py
          pytest -q tests/test_ha001_asset_census.py tests/test_fa001_facts.py
      - name: Download the exact passed FA001 source panel
        uses: actions/download-artifact@v4
        with:
          name: fa001-d002-merged-37213394690
          path: reports/fa001-d002-source
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37213394690
      - name: Verify fixed source identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("reports/fa001-d002-source/fa001-d002-panel.json").read_text())
          assert p["panel_id"] == "FA001-D002-v1"
          assert p["panel_sha256"] == "cb8a408b6904799750a5aa08210f909ae8b285005273b5588fb1f8b7a6019124"
          assert p["identity_count"] == 2319
          assert p["feasibility_pass"] is True
          assert p["return_outcomes_opened"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          PY
      - name: Materialize pre-registered source-only research census
        run: |
          python scripts/materialize_ha001_d001.py \
            --fa001-panel reports/fa001-d002-source/fa001-d002-panel.json \
            --out reports/ha001-d001
      - name: Validate research-only and complete census
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("reports/ha001-d001/ha001-d001-census.json").read_text())
          assert p["census_id"] == "HA001-D001-v1"
          assert p["identity_count"] == 2319
          assert len(p["rows"]) == 2319
          assert p["source_only_gate_pass"] is True
          assert p["market_capitalization_calculated"] is False
          assert p["return_outcomes_opened"] is False
          assert p["model_fitted"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          assert all(all(s["state"] != "FLAGGED" or s["ratio"] is not None for s in r["signals"].values()) for r in p["rows"])
          print(json.dumps({
            "census_sha256": p["census_sha256"],
            "identity_count": p["identity_count"],
            "any_signal_flagged_count": p["any_signal_flagged_count"],
            "signal_state_counts": p["signal_state_counts"],
            "source_only_gate_pass": p["source_only_gate_pass"]
          }, indent=2, sort_keys=True))
          PY
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ha001-d001-${{ github.run_id }}
          path: reports/ha001-d001
          if-no-files-found: warn
          retention-days: 90
