name: AE001 T011 register frozen trial

on:
  push:
    branches:
      - feat/ae001-t011-lagged-futures-20261001

permissions:
  contents: write

jobs:
  register:
    if: contains(github.event.head_commit.message, '[t011-register]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Register T011 before outcomes
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path

          from marketlab.alpha_trials import (
              append_trial_event,
              trial_state,
              validate_trial_ledger,
          )

          path = Path("research/ae001/trial-ledger.json")
          ledger = json.loads(path.read_text(encoding="utf-8"))
          validate_trial_ledger(ledger)

          try:
              state = trial_state(ledger, "AE001-T011")
              if state["registration"] is not None:
                  print("T011 already registered")
                  raise SystemExit(0)
          except Exception as exc:
              if "trial is not registered" not in str(exc):
                  raise

          payload = {
              "name": "lagged_previous_session_stock_futures_incremental_feature_family",
              "status": "FROZEN_BEFORE_RETURN_OUTCOMES",
              "evidence_class": (
                  "HISTORICAL_RECONSTRUCTION_DEVELOPMENT_"
                  "SOURCE_TIMING_UNVERIFIED"
              ),
              "live_capital_allowed": False,
              "outcomes_for_t011_opened_before_registration": False,
              "information_timing": {
                  "decision_session": "D",
                  "decision_cutoff": "18:30:00 Asia/Kolkata",
                  "base_features_session": "D",
                  "futures_features_session": "PREVIOUS_COMPLETED_NSE_SESSION_D_MINUS_1",
                  "entry": "NEXT_COMPLETED_NSE_SESSION_OPEN",
              },
              "upstream": {
                  "trial": "AE001-T005",
                  "workflow_run_id": 36696476204,
                  "market_panel_sha256": (
                      "9e644012720084a693071a40ce9c592b4586f8c6cee8445fcf7aa599be94b41e"
                  ),
                  "corporate_action_ledger_sha256": (
                      "1238ec2c4b2697cf52ea66194aeb0d70171a22071f7249e3fcdc8a8f83ede5c1"
                  ),
                  "current_27_feature_panel_sha256": (
                      "99c0c34da30a9318c428d44d68d23360c7588a618e54cad80acde22a959c2e90"
                  ),
                  "t005_37_feature_panel_sha256": (
                      "62dd3c2f50fcaf6d58e47526df76aff41f2a4c2ec43c2a5724f7c23611af803f"
                  ),
              },
              "join": {
                  "current_identity": "SYMBOL_PLUS_ISIN",
                  "previous_session": "ORDERED_MARKET_PANEL_PREVIOUS_COMPLETED_SESSION",
                  "lagged_identity": "EXACT_SAME_SYMBOL_PLUS_ISIN_ON_D_MINUS_1",
                  "missing_lagged_futures_policy": "EXCLUDE_NO_IMPUTATION",
              },
              "base_feature_count": 27,
              "lagged_futures_feature_count": 10,
              "augmented_feature_count": 37,
              "model": {
                  "type": "ridge",
                  "l2": 1.0,
                  "hyperparameter_search": False,
              },
              "source_only_gate": {
                  "amendment_required_before_outcomes": True,
                  "minimum_feature_sessions": 150,
                  "minimum_feature_rows": 30000,
              },
              "primary": {
                  "horizon_sessions": 5,
                  "folds": [
                      ["2026-04-01", "2026-06-30"],
                      ["2026-07-01", "2026-09-18"],
                  ],
                  "newey_west_lag": 4,
                  "success_requires": [
                      "PAIRED_MEAN_RANK_IC_DELTA_GT_0_AND_P_LT_0_05",
                      "PAIRED_TOP_MINUS_BOTTOM_SPREAD_DELTA_GT_0_AND_P_LT_0_05",
                  ],
              },
              "secondary": {
                  "horizon_sessions": 1,
                  "folds": [
                      ["2026-04-01", "2026-06-30"],
                      ["2026-07-01", "2026-09-24"],
                  ],
                  "newey_west_lag": 5,
                  "rescues_failed_primary": False,
              },
              "medium_horizon": {
                  "tested": False,
                  "reason": "T005_20D_UNSUPPORTED",
              },
              "prospective": {
                  "source_timing_gate": "AE001-SC003",
                  "minimum_distinct_ready_preopen_sessions_before_successor_design": 3,
                  "historical_t011_prospective_claim_allowed": False,
              },
              "multiple_testing": {
                  "trial_count_increment": 1,
                  "parameter_sweep_allowed": False,
              },
          }

          updated = append_trial_event(
              ledger,
              event_type="TRIAL_REGISTERED",
              trial_id="AE001-T011",
              recorded_at_utc=datetime.now(UTC).isoformat(),
              payload=payload,
          )
          path.write_text(
              json.dumps(
                  updated,
                  indent=2,
                  sort_keys=True,
                  ensure_ascii=False,
                  allow_nan=False,
              )
              + "\n",
              encoding="utf-8",
          )
          print("T011_REGISTERED", updated["ledger_sha256"])
          PY

      - name: Commit registration
        run: |
          set -euo pipefail
          if git diff --quiet -- research/ae001/trial-ledger.json; then
            echo "No ledger change"
            exit 0
          fi
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/ae001/trial-ledger.json
          git commit -m "research: register frozen AE001 T011 trial [skip ci]"
          git push origin HEAD:feat/ae001-t011-lagged-futures-20261001
