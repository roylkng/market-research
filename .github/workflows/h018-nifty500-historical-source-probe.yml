name: H018 official Nifty 500 historical source probe

on:
  push:
    branches:
      - research/h018-promotion-audit-20260908
    paths:
      - scripts/h018_nifty500_historical_source.py
      - tests/test_h018_nifty500_historical_source.py
      - .github/workflows/h018-nifty500-historical-source-probe.yml

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h018-promotion-audit-20260908
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Verify source-probe code before network access
        run: |
          ruff check scripts/h018_nifty500_historical_source.py tests/test_h018_nifty500_historical_source.py
          PYTHONPATH=scripts pytest -q tests/test_h018_nifty500_historical_source.py
      - name: Download retained 2016-2017 H018 checkpoints
        uses: actions/download-artifact@v4
        with:
          name: h018-independent-challenge-checkpoints-34265875607
          path: /tmp/h018-run2
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 34265875607
      - name: Probe official NSE Indices NIFTY 500 history and cross-validate overlap
        run: |
          rm -rf /tmp/h018-nifty500-probe
          python scripts/h018_nifty500_historical_source.py \
            --out /tmp/h018-nifty500-probe \
            --checkpoint-root /tmp/h018-run2 \
            --start 2013-11-01 \
            --end 2017-05-31
          test -s /tmp/h018-nifty500-probe/probe-summary.json
      - name: Retain source-equivalence summary without benchmark values
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src = Path('/tmp/h018-nifty500-probe/probe-summary.json')
          d = json.loads(src.read_text())
          assert d['status'] == 'SOURCE_EQUIVALENCE_PROBE_ONLY'
          assert d['live_capital_allowed'] is False
          assert d['market_selection_outcomes_opened'] is False
          assert d['row_count'] >= 800
          assert d['overlap_common_sessions'] >= 300
          assert d['max_open_abs_difference'] <= 0.011
          assert d['max_close_abs_difference'] <= 0.011
          target = Path('experiments/H018_nse_style_low_volatility_50/BENCHMARK_SOURCE_PROBE.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(d, indent=2, sort_keys=True) + '\n')
          print(json.dumps(d, indent=2, sort_keys=True))
          PY
      - name: Upload retained official NSE Indices response
        uses: actions/upload-artifact@v4
        with:
          name: h018-nifty500-historical-source-probe-${{ github.run_id }}
          path: /tmp/h018-nifty500-probe
          retention-days: 30
          compression-level: 0
      - name: Commit only source-equivalence summary
        run: |
          git config user.name marketlab-research-bot
          git config user.email marketlab-research-bot@users.noreply.github.com
          git add experiments/H018_nse_style_low_volatility_50/BENCHMARK_SOURCE_PROBE.json
          git commit -m 'H018: retain official Nifty 500 source equivalence probe'
          git push origin HEAD:research/h018-promotion-audit-20260908
