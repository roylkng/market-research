name: Temporary market-close audit probe

on:
  push:
    branches: [feat/daily-market-miss-audit-v2c-20260918]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Verify implementation
        run: |
          ruff check src/marketlab/intelligence_market_audit.py scripts/run_daily_market_audit.py tests/test_intelligence_market_audit.py
          pytest -q tests/test_intelligence_market_audit.py tests/test_intelligence_news.py
      - name: Build fresh discovery state
        shell: bash
        run: |
          mkdir -p reports/market-close/logs
          set +e
          python scripts/run_company_news_discovery.py \
            --store reports/market-close/store \
            --output reports/market-close/discovery \
            --collect | tee reports/market-close/logs/discovery.log
          echo "discovery_rc=${PIPESTATUS[0]}" | tee reports/market-close/logs/discovery.rc
          set -e
      - name: Audit September 17 official NSE session
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_daily_market_audit.py \
            --session 2026-09-17 \
            --store reports/market-close/store \
            --output reports/market-close/audit \
            --liquidity-floor-inr 20000000 \
            --move-threshold-pct 5 \
            --top-abs-movers 25 | tee reports/market-close/logs/market-audit.log
      - name: Preserve source commit
        run: |
          git rev-parse HEAD > reports/market-close/source-commit.txt
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-close-audit-probe-${{ github.run_id }}
          path: reports/market-close
          retention-days: 30
          if-no-files-found: error
