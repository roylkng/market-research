name: SS002 L001 P1 pilot selection

on:
  push:
    branches:
      - research/ss002-l001-selection-20261004

permissions:
  actions: read
  contents: read

jobs:
  select:
    if: contains(github.event.head_commit.message, '[ss002-l001-select]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate selector
        run: |
          ruff check \
            src/marketlab/ss002_l001_pilot.py \
            scripts/materialize_ss002_l001_pilot.py \
            tests/test_ss002_l001_pilot.py
          pytest -q tests/test_ss002_l001_pilot.py tests/test_ss002_llm_contract.py
      - name: Download exact P2 census
        uses: actions/download-artifact@v4
        with:
          name: ss002-d001-p2-37203696204
          path: reports/p2
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37203696204
      - name: Download exact D3 text corpus
        uses: actions/download-artifact@v4
        with:
          name: ss002-d003-37213853198
          path: reports/d3
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37213853198
      - name: Materialize frozen pilot selection
        run: |
          python scripts/materialize_ss002_l001_pilot.py \
            --p2-census reports/p2/ss002-d001-census.json \
            --d3-corpus reports/d3/ss002-d003-text-corpus.json \
            --documents-dir reports/d3/documents \
            --output reports/l001-selection
      - name: Prove frozen selection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/l001-selection/ss002-l001-p1-selection.json").read_text())
          assert p["selection_id"]=="SS002-L001-P1-SELECTION-v1"
          assert p["selected_document_count"]==30
          assert all(v==6 for v in p["family_counts"].values())
          assert p["return_outcomes_opened"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          print(json.dumps({
            "selection_sha256":p["selection_sha256"],
            "selected_document_count":p["selected_document_count"],
            "family_counts":p["family_counts"],
            "rows":[{
              "pilot_family":r["pilot_family"],
              "symbol":r["symbol"],
              "announcement_id":r["announcement_id"],
              "document_id":r["document_id"],
              "prompt_sha256":r["prompt_sha256"],
              "segment_count":r["segment_count"],
            } for r in p["rows"]]
          },indent=2,sort_keys=True))
          PY
      - name: Upload selection
        uses: actions/upload-artifact@v4
        with:
          name: ss002-l001-p1-selection-${{ github.run_id }}
          path: reports/l001-selection
          if-no-files-found: error
          retention-days: 90
