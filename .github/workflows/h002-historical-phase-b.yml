name: H002 historical replay Phase B

on:
  push:
    branches:
      - work/h002-historical-replay-v1-20260907
    paths:
      - src/marketlab/h002_historical_outcomes.py
      - scripts/run_h002_historical_phase_b.py
      - tests/test_h002_historical_outcomes.py
      - .github/workflows/h002-historical-phase-b.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h002-historical-replay-phase-b
  cancel-in-progress: false

env:
  PHASE_A_SHA256: 2062e21ee1b1cbcd86d758ae3cf9ef9aeb43664c629ca5eb7a22cd885068ef98

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/h002-historical-replay-v1-20260907
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint full research harness
        run: ruff check src tests scripts
      - name: Test full research harness
        run: pytest -q
      - name: Verify frozen Phase-A identity before outcome access
        run: |
          python - <<'PY'
          import os
          from marketlab.h002_historical_outcomes import load_phase_a_manifest

          doc = load_phase_a_manifest(
              'research/historical/h002/H002-HR001/phase-a/fixed-u001-transport-signals.json',
              expected_sha256=os.environ['PHASE_A_SHA256'],
          )
          print('phase_a_manifest_sha256', doc['manifest_sha256'])
          print('signal_count', doc['status_counts']['SIGNAL'])
          PY

  phase-b:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/h002-historical-replay-v1-20260907
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Reconstruct frozen historical outcomes
        run: |
          python scripts/run_h002_historical_phase_b.py \
            --expected-phase-a-sha256 "$PHASE_A_SHA256" \
            --attempts 5 \
            --timeout 25 \
            --sleep 0.12 \
            --store .marketlab-historical-phase-b \
            --output research/historical/h002/H002-HR001/phase-b/fixed-u001-transport-outcomes.json
      - name: Validate Phase-B result
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path(
              'research/historical/h002/H002-HR001/phase-b/'
              'fixed-u001-transport-outcomes.json'
          )
          doc = json.loads(path.read_text(encoding='utf-8'))
          declared = doc.pop('manifest_sha256')
          encoded = json.dumps(
              doc,
              sort_keys=True,
              separators=(',', ':'),
              ensure_ascii=False,
              allow_nan=False,
          ).encode('utf-8')
          actual = hashlib.sha256(encoded).hexdigest()
          if actual != declared:
              raise SystemExit(
                  f'Phase-B manifest hash mismatch: declared={declared} actual={actual}'
              )
          if doc.get('phase') != 'B_OUTCOME_RECONSTRUCTION':
              raise SystemExit('unexpected Phase-B identity')
          if doc.get('phase_a_manifest_sha256') != os.environ['PHASE_A_SHA256']:
              raise SystemExit('Phase-B is not bound to the frozen Phase-A manifest')
          if doc.get('outcome_data_included') is not True:
              raise SystemExit('Phase-B does not declare outcome data')
          if doc.get('live_capital_allowed') is not False:
              raise SystemExit('historical replay must not authorize live capital')
          summary = doc['summary']
          status = summary['status_counts']
          if int(status.get('ERROR', 0)):
              for record in doc.get('records', []):
                  if record.get('status') == 'ERROR':
                      print(record.get('symbol'), record.get('quarter_id'), record.get('reason'))
              raise SystemExit(f"Phase-B has unresolved ERROR records: {status.get('ERROR')}")
          if int(status.get('MISSING_BENCHMARK', 0)):
              raise SystemExit(
                  f"Phase-B benchmark coverage incomplete: {status.get('MISSING_BENCHMARK')}"
              )
          print('manifest_sha256', declared)
          print('status_counts', json.dumps(status, sort_keys=True))
          print('completed_count', summary['completed_count'])
          for benchmark_id, result in summary['by_benchmark'].items():
              print(benchmark_id, json.dumps(result['evaluation'], sort_keys=True))
          PY
      - name: Upload exact Phase-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h002-hr001-phase-b-evidence
          path: |
            .marketlab-historical-phase-b
            research/historical/h002/H002-HR001/phase-b/fixed-u001-transport-outcomes.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
      - name: Commit historical Phase-B result
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/historical/h002/H002-HR001/phase-b/fixed-u001-transport-outcomes.json
          if git diff --cached --quiet; then
            echo "Phase-B result unchanged"
            exit 0
          fi
          git commit -m "H002-HR001: reconstruct frozen historical outcomes"
          git push origin HEAD:work/h002-historical-replay-v1-20260907
