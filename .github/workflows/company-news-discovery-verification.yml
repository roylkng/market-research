name: Company news discovery verification
on:
  workflow_dispatch:
  push:
    branches: [feat/company-news-discovery-v2-20260917]
    paths:
      - '.github/workflows/company-news-discovery-verification.yml'
      - 'src/marketlab/intelligence_news.py'
      - 'src/marketlab/intelligence_discovery.py'
      - 'src/marketlab/intelligence_http.py'
      - 'tests/test_intelligence_news.py'
      - 'scripts/run_company_news_discovery.py'
      - 'registry/company_news_discovery_v2.json'
permissions:
  contents: read
concurrency:
  group: company-news-discovery-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Verify implementation and preserve exact code
        run: |
          ruff check src/marketlab/intelligence_*.py scripts/run_company_news_discovery.py tests/test_intelligence*.py
          pytest -q tests/test_intelligence*.py
          mkdir -p reports/news-discovery
          git archive --format=zip HEAD > reports/news-discovery/source.zip
      - name: Discover sources and retrieve dynamically selected articles
        run: |
          python scripts/run_company_news_discovery.py \
            --store reports/news-discovery/store \
            --output reports/news-discovery/report \
            --collect
      - name: Tracked repository unchanged
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-discovery-${{ github.run_id }}
          path: reports/news-discovery
          retention-days: 30
          if-no-files-found: error
