name: H003 source integration once

on:
  push:
    branches:
      - feat/h003-source-corpus-v1
    paths:
      - .github/workflows/h003-source-integration-once.yml
      - scripts/h003_source_integrate_once.py

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/h003-source-corpus-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/h003_source_integrate_once.py
      - run: ruff check src tests scripts --fix
      - run: ruff check src tests scripts
      - run: pytest -q
      - run: make validate
      - name: Commit integration and remove one-shot files
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git rm .github/workflows/h003-source-integration-once.yml scripts/h003_source_integrate_once.py
          git add Makefile src tests scripts registry
          git commit -m "Integrate frozen H003 source coverage contract"
          git push origin HEAD:feat/h003-source-corpus-v1
