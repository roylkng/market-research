name: H002-D freeze calendar once

on:
  push:
    branches:
      - feat/h002-prospective-orchestrator-v1
    paths:
      - .github/workflows/h002d-freeze-calendar-once.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/h002-prospective-orchestrator-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Freeze exact-source calendar
        run: |
          python scripts/freeze_h002_calendar.py \
            --output research/prospective/calendars/FY27-Q2-2026-09-06/NSE-CM-FY27Q2-v1.json \
            --source-out research/prospective/calendars/FY27-Q2-2026-09-06/sources/holiday-master.json \
            --start 2026-09-01 \
            --end 2026-12-31 \
            --version NSE-CM-FY27Q2-v1
      - name: Commit calendar evidence
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git rm .github/workflows/h002d-freeze-calendar-once.yml
          git add research/prospective/calendars
          git commit -m "Freeze FY27-Q2 NSE calendar evidence v1"
          git push origin HEAD:feat/h002-prospective-orchestrator-v1
