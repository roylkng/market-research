name: AE001 D001 futures source discovery

on:
  push:
    branches:
      - feat/ae001-futures-positioning-features-20260930

permissions:
  contents: read

jobs:
  discover:
    if: contains(github.event.head_commit.message, '[ae001-d001]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Discover FO UDiFF source and schema
        run: |
          python - <<'PY'
          import collections
          import csv
          import io
          import json
          import urllib.request
          import zipfile

          url = (
              "https://nsearchives.nseindia.com/content/fo/"
              "BhavCopy_NSE_FO_0_0_0_20260925_F_0000.csv.zip"
          )
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              raw = response.read()
              status = response.status
              content_type = response.headers.get("content-type")
          print("SOURCE_URL", url)
          print("HTTP_STATUS", status)
          print("CONTENT_TYPE", content_type)
          print("BYTE_COUNT", len(raw))

          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              names = archive.namelist()
              print("ZIP_MEMBERS", json.dumps(names))
              if len(names) != 1:
                  raise SystemExit("expected one CSV in FO UDiFF archive")
              text = archive.read(names[0]).decode("utf-8-sig")

          reader = csv.DictReader(io.StringIO(text))
          print("HEADER", json.dumps(reader.fieldnames))
          rows = list(reader)
          print("ROW_COUNT", len(rows))

          counters = {}
          for key in ["FinInstrmTp", "Sgmt", "Src"]:
              counters[key] = collections.Counter(
                  str(row.get(key) or "").strip()
                  for row in rows
              )
          print(
              "COUNTS",
              json.dumps(
                  {
                      key: dict(value.most_common())
                      for key, value in counters.items()
                  },
                  sort_keys=True,
              ),
          )

          candidate = None
          for row in rows:
              instrument = str(row.get("FinInstrmTp") or "").upper()
              if instrument in {"STF", "FUTSTK", "FUTSTOCK"}:
                  candidate = row
                  break
          if candidate is None:
              # Fall back to first row whose instrument is not an index option/future.
              for row in rows:
                  instrument = str(row.get("FinInstrmTp") or "").upper()
                  symbol = str(
                      row.get("TckrSymb")
                      or row.get("UndrlygInstrm")
                      or row.get("Undrlyg")
                      or ""
                  )
                  if symbol and "IDX" not in instrument and "OPT" not in instrument:
                      candidate = row
                      break
          if candidate is None:
              raise SystemExit("could not identify a stock-futures candidate row")
          print(
              "SAMPLE_NON_INDEX_FUTURE",
              json.dumps(candidate, sort_keys=True),
          )
          PY
