name: Temporary H021 FDR pending-family summary regeneration

on:
  push:
    branches:
      - research/rta001-h021-pending-family-20261013
    paths:
      - research/rta001-trials-v1.json
      - .github/workflows/rta001-h021-family-temporary.yml

permissions:
  contents: write

jobs:
  recompute:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rta001-h021-pending-family-20261013
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify empty-family scientific invariants first
        run: |
          ruff check src/marketlab/rta001.py tests/test_rta001.py
          pytest -q tests/test_rta001.py
      - name: Recompute global 68-trial accounting and verify
        run: |
          python scripts/build_rta001_summary.py --repo-root .
          python scripts/validate_rta001_coverage.py --repo-root .
      - name: Commit only source-derived global accounting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name marketlab-research-bot
          git config user.email marketlab-research-bot@users.noreply.github.com
          git add research/rta001-summary-v1.json
          if git diff --cached --quiet; then
            echo "Already reproducible"
            exit 0
          fi
          git commit -m "RTA001: anchor zero-outcome pending H021 paired FDR family [skip ci]"
          git push origin HEAD:research/rta001-h021-pending-family-20261013
