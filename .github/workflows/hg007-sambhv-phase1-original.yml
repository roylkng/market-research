name: HG007 SAMBHV issuer Aug original Phase-I source

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/acquire_hg007_sambhv_original.py
      - .github/workflows/hg007-sambhv-phase1-original.yml
  schedule:
    - cron: '20 5 10-20 10 *'

permissions:
  contents: write

concurrency:
  group: hg007-sambhv-original-aug03-phase1-capex
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify original issuer and source bytes contract
        run: |
          ruff check scripts/acquire_hg007_sambhv_original.py tests/test_hg007_sambhv_original.py
          pytest -q tests/test_hg007_sambhv_original.py
      - name: Check source not already retained, future dates blocked
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=Asia/Kolkata date +%F)"
          STATE=SKIP
          DEST="research/hg007/sambhv-aug2026-investor/source-receipt-v1.json"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || [[ "$TODAY" > "2026-10-09" && "$TODAY" < "2026-10-21" ]]; then
            git fetch origin main
            if git cat-file -e "origin/main:$DEST" 2>/dev/null; then
              STATE=ALREADY_RETAINED
            else
              STATE=FETCH
            fi
          fi
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "Sambhv original-source check=$STATE"
      - name: Acquire exact original issuer PDF without redirects or bypass
        if: steps.gate.outputs.state == 'FETCH'
        shell: bash
        run: |
          set -euo pipefail
          OUT="/tmp/hg007-sambhv-original-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "SAMBHV_SOURCE_OUT=$OUT" >> "$GITHUB_ENV"
          python scripts/acquire_hg007_sambhv_original.py \
            --out-dir "$OUT" --attempts 2 --sleep-seconds 3
          test -s "$OUT/source-receipt-v1.json"
      - name: Anchor immutable original only after issuer CAPEX schema checks
        if: steps.gate.outputs.state == 'FETCH'
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(python - "$SAMBHV_SOURCE_OUT/source-receipt-v1.json" <<'PY'
          import json,sys
          from pathlib import Path
          source=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert source["live_capital_allowed"] is False
          print(source["status"])
          PY
          )"
          if [[ "$STATUS" != ORIGINAL_ISSUER_PDF_BYTES_AND_ROADMAP_IDENTITY_VERIFIED ]]; then
            echo "Original Q1FY27 issuer PDF unavailable or changed; state=$STATUS"
            exit 0
          fi
          DEST="research/hg007/sambhv-aug2026-investor"
          TARGET="$DEST/source-receipt-v1.json"
          mkdir -p "$DEST/raw/sha256"
          cp "$SAMBHV_SOURCE_OUT/source-receipt-v1.json" "$TARGET"
          cp "$SAMBHV_SOURCE_OUT"/raw/sha256/*.pdf "$DEST/raw/sha256/"
          python - "$TARGET" "$DEST/raw/sha256" <<'PY'
          import json,hashlib,sys
          from pathlib import Path
          from scripts.acquire_hg007_sambhv_original import verify_original_issuer_roadmap
          receipt=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          raw=(Path(sys.argv[2])/f"{receipt['raw_sha256']}.pdf").read_bytes()
          assert hashlib.sha256(raw).hexdigest() == receipt["raw_sha256"]
          assert verify_original_issuer_roadmap(raw) == receipt["document_identity_evidence"]
          assert receipt["steel_power_budget_aggregation_authorized"] is False
          print("Sambhv original Aug presentation anchored, SHA",receipt["raw_sha256"])
          PY
          git config user.name marketlab-research-bot
          git config user.email marketlab-research-bot@users.noreply.github.com
          git add -f "$DEST"
          git commit -m "HG007: anchor original issuer Aug Sambhv 810cr steel plus 125cr power budgets [skip ci]"
          BASE_SHA="$(git rev-parse HEAD^)"
          for RETRY in 1 2 3; do
            git fetch origin main
            HEAD_MAIN="$(git rev-parse origin/main)"
            if git cat-file -e "origin/main:$TARGET" 2>/dev/null; then
              echo "Original already committed, refusing overwrite"
              exit 1
            fi
            if ! git diff --quiet "$BASE_SHA" "$HEAD_MAIN" -- \
              scripts/acquire_hg007_sambhv_original.py \
              .github/workflows/hg007-sambhv-phase1-original.yml; then
              echo "Original source acquisition code changed before commit"
              exit 1
            fi
            if [[ "$HEAD_MAIN" != "$BASE_SHA" ]]; then
              git rebase origin/main
              BASE_SHA="$HEAD_MAIN"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((RETRY*2))"
          done
          exit 1
      - name: Preserve immutable original access attempt evidence
        if: always() && steps.gate.outputs.state == 'FETCH'
        uses: actions/upload-artifact@v4
        with:
          name: hg007-sambhv-q1fy27-issuer-aug-original-source
          path: ${{ env.SAMBHV_SOURCE_OUT }}
          if-no-files-found: ignore
          retention-days: 90
