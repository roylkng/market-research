name: AE001 T009 seal result

on:
  push:
    branches:
      - feat/ae001-t009-stock-options-positioning-20261001

permissions:
  contents: write
  actions: read

jobs:
  seal:
    if: contains(github.event.head_commit.message, '[t009-seal-result]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Download successful P2 replay
        uses: actions/download-artifact@v4
        with:
          name: ae001-t009-p2-replay-36829163944
          path: evidence/t009
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: roylkng/market-research
          run-id: 36829163944

      - name: Verify and seal T009 result
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path

          from marketlab.alpha import digest
          from marketlab.alpha_trials import (
              append_trial_event,
              require_protocol_amendment,
              require_unopened_registered_trial,
              trial_state,
              validate_trial_ledger,
          )

          EXPECTED_REPORT_SHA = (
              "c5b7cc8d6adc0f82ea7524084fce78a3b97b8de62d5e59f73d0334e6ce916611"
          )
          EXPECTED_REPORT_ARTIFACT_SHA = (
              "fd3f0412cc37f6851aeea9bf299b1485983f1510d942ac3d2dac1f299b82c634"
          )

          matches = list(Path("evidence/t009").rglob("summary.json"))
          if len(matches) != 1:
              raise SystemExit(f"expected one T009 summary, got {matches}")
          summary = json.loads(matches[0].read_text(encoding="utf-8"))

          if summary["report_sha256"] != EXPECTED_REPORT_SHA:
              raise SystemExit("T009 report SHA changed")
          if summary["report_artifact_sha256"] != EXPECTED_REPORT_ARTIFACT_SHA:
              raise SystemExit("T009 report artifact SHA changed")
          if summary["primary_success_criteria_supported"] is not False:
              raise SystemExit("T009 frozen primary unexpectedly passed")
          if summary["prospective_claim_allowed"] is not False:
              raise SystemExit("T009 unexpectedly permits prospective claim")

          def flatten(block, *, primary=False):
              base = block["base"]
              aug = block["augmented"]
              metrics = block["augmented_minus_base_inference"]["metrics"]
              rank = metrics["rank_ic"]
              top = metrics["top_decile_excess"]
              spread = metrics["top_minus_bottom_spread"]
              supported = (
                  float(rank["mean"]) > 0
                  and float(rank["p_value_two_sided"]) < 0.05
                  and float(spread["mean"]) > 0
                  and float(spread["p_value_two_sided"]) < 0.05
              )
              result = {
                  "base_mean_rank_ic": base["mean_rank_ic"],
                  "augmented_mean_rank_ic": aug["mean_rank_ic"],
                  "delta_mean_rank_ic": rank["mean"],
                  "delta_rank_ic_p_value": rank["p_value_two_sided"],
                  "base_mean_top_decile_excess": base["mean_top_decile_excess"],
                  "augmented_mean_top_decile_excess": aug["mean_top_decile_excess"],
                  "delta_mean_top_decile_excess": top["mean"],
                  "delta_top_decile_excess_p_value": top["p_value_two_sided"],
                  "base_mean_top_minus_bottom_spread": base[
                      "mean_top_minus_bottom_spread"
                  ],
                  "augmented_mean_top_minus_bottom_spread": aug[
                      "mean_top_minus_bottom_spread"
                  ],
                  "delta_mean_top_minus_bottom_spread": spread["mean"],
                  "delta_top_minus_bottom_spread_p_value": spread[
                      "p_value_two_sided"
                  ],
                  "prediction_count": aug["prediction_count"],
                  "session_count": aug["session_count"],
                  "incremental_signal_supported": supported,
              }
              if primary:
                  result["frozen_success_criteria_supported"] = supported
              return result

          primary = flatten(summary["primary_5d"], primary=True)
          secondary = flatten(summary["secondary_1d"])
          diagnostic = flatten(summary["diagnostic_20d"])

          if primary["frozen_success_criteria_supported"] is not False:
              raise SystemExit("T009 primary classification mismatch")
          if secondary["incremental_signal_supported"] is not False:
              raise SystemExit("T009 secondary unexpectedly supported")
          if diagnostic["incremental_signal_supported"] is not False:
              raise SystemExit("T009 diagnostic unexpectedly supported")

          result = {
              "schema_version": 1,
              "trial_id": "AE001-T009",
              "status": "COMPLETE_DEVELOPMENT",
              "evidence_class": summary["evidence_class"],
              "successful_run": {
                  "run_id": 36829163944,
                  "artifact_id": 11147065650,
                  "artifact_name": "ae001-t009-p2-replay-36829163944",
              },
              "failed_initial_outcome_run": {
                  "run_id": 36824004775,
                  "report_emitted": False,
                  "result_event_recorded": False,
                  "failure_class": "AUXILIARY_SINGLE_FEATURE_DIAGNOSTIC_UNDEFINED",
                  "failure_feature": "opt_front_log1p_days_to_expiry",
                  "repaired_by_protocol": "AE001-T009-P2",
              },
              "report_sha256": summary["report_sha256"],
              "report_artifact_sha256": summary["report_artifact_sha256"],
              "source_chain": {
                  "market_panel_sha256": summary["market_panel_sha256"],
                  "corporate_action_ledger_sha256": summary[
                      "corporate_action_ledger_sha256"
                  ],
                  "base_37_feature_panel_sha256": summary[
                      "base_37_feature_panel_sha256"
                  ],
                  "options_panel_sha256": summary["options_panel_sha256"],
                  "options_source_hashes_sha256": summary[
                      "options_source_hashes_sha256"
                  ],
                  "augmented_47_feature_panel_sha256": summary[
                      "feature_panel_sha256"
                  ],
              },
              "options_source": summary["source_materialization"],
              "primary_5d": primary,
              "secondary_1d": {
                  **secondary,
                  "rescues_failed_primary": False,
              },
              "diagnostic_20d": {
                  **diagnostic,
                  "rescues_failed_primary": False,
              },
              "historical_fo_publication_timestamp_verified": False,
              "prospective_claim_allowed": False,
              "promote_to_ab001": False,
              "interpretation": (
                  "PRIMARY_5D_NOT_SUPPORTED; "
                  "SECONDARY_1D_NOT_SUPPORTED; "
                  "20D_DIAGNOSTIC_NOT_SUPPORTED; "
                  "FROZEN_OPTIONS_FEATURE_FAMILY_DOES_NOT_ADD_CLEAR_INCREMENTAL_"
                  "INFORMATION_BEYOND_T005_FUTURES; "
                  "DO_NOT_PROMOTE_T009_TO_AB001; "
                  "DO_NOT_RETUNE_UNDER_T009; "
                  "NEW_TRIAL_REQUIRED_FOR_ANY_REVISED_OPTIONS_SIGNAL; "
                  "HISTORICAL_FO_PUBLICATION_TIMING_UNVERIFIED; "
                  "NO_PROSPECTIVE_OR_LIVE_CAPITAL_CLAIM"
              ),
              "live_capital_allowed": False,
          }
          result["result_sha256"] = digest(result)

          result_path = Path("research/ae001-t009-result-v1.json")
          result_path.write_text(
              json.dumps(
                  result,
                  indent=2,
                  sort_keys=True,
                  ensure_ascii=False,
                  allow_nan=False,
              ) + "\n",
              encoding="utf-8",
          )

          ledger_path = Path("research/ae001/trial-ledger.json")
          ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
          validate_trial_ledger(ledger)
          require_unopened_registered_trial(
              ledger,
              trial_id="AE001-T009",
              required_status="FROZEN_BEFORE_OUTCOME_MATERIALIZATION",
          )
          require_protocol_amendment(
              ledger,
              trial_id="AE001-T009",
              protocol_id="AE001-T009-P1",
          )
          require_protocol_amendment(
              ledger,
              trial_id="AE001-T009",
              protocol_id="AE001-T009-P2",
          )
          state = trial_state(ledger, "AE001-T009")
          if state["result_count"] != 0:
              raise SystemExit("T009 already has a result event")

          event_payload = {
              key: value
              for key, value in result.items()
              if key not in {"schema_version", "trial_id"}
          }
          event_payload["result_file"] = str(result_path)
          updated = append_trial_event(
              ledger,
              event_type="TRIAL_RESULT_RECORDED",
              trial_id="AE001-T009",
              recorded_at_utc=datetime.now(UTC).isoformat(),
              payload=event_payload,
          )
          ledger_path.write_text(
              json.dumps(
                  updated,
                  indent=2,
                  sort_keys=True,
                  ensure_ascii=False,
                  allow_nan=False,
              ) + "\n",
              encoding="utf-8",
          )
          print("RESULT_SHA", result["result_sha256"])
          print("RESULT_EVENT_SHA", updated["events"][-1]["event_sha256"])
          print("LEDGER_SHA", updated["ledger_sha256"])
          PY

      - name: Commit sealed result
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/ae001-t009-result-v1.json research/ae001/trial-ledger.json
          git commit -m "research: seal failed T009 stock-options result [skip ci]"
          git push origin HEAD:feat/ae001-t009-stock-options-positioning-20261001
