name: H004 NSE API probe

on:
  push:
    branches:
      - research/h004-pre-momentum-v1-20260908
    paths:
      - .github/workflows/h004-nse-api-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Probe integrated filing XBRL taxonomy
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from marketlab.nse import NSEClient

          client = NSEClient(timeout=20, attempts=4)
          payload = client.integrated_filings(
              symbol='ENTERO',
              from_date='01-08-2026',
              to_date='15-08-2026',
              page=1,
              size=20,
          )
          rows = payload.get('data', []) if isinstance(payload, dict) else []
          rows = [r for r in rows if r.get('consolidated') == 'Consolidated'] or rows
          if not rows:
              raise SystemExit('no ENTERO filing')
          row = rows[0]
          print('FILING', row)
          raw = client.archive_bytes(row['xbrl'])
          print('XBRL_BYTES', len(raw))
          root = ET.fromstring(raw)
          wanted = ('revenue','income','profit','expense','tax','ebit','finance','operation','segment')
          seen = []
          for elem in root.iter():
              tag = elem.tag.rsplit('}', 1)[-1]
              text = (elem.text or '').strip()
              if text and any(k in tag.lower() for k in wanted):
                  seen.append((tag, elem.attrib.get('contextRef'), text))
          for item in seen[:500]:
              print('|'.join(str(x) for x in item))
          PY
