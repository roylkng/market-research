name: SS001 R001 exact queue zero-config preflight proof

on:
  push:
    branches:
      - research/ss001-r001-real-source-preflight-20261009

permissions:
  actions: read
  contents: read

jobs:
  prove-source:
    if: contains(github.event.head_commit.message, '[ss001-r001-real-preflight]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify no-inference source preflight code
        run: |
          ruff check src/marketlab/ss001_l001_batch.py scripts/run_ss001_l001_batch.py
          pytest -q tests/test_ss001_l001_batch.py tests/test_ss001_r001_workflow_contract.py
      - name: Download exact frozen D007 P2 source queue
        uses: actions/download-artifact@v4
        with:
          name: ss001-d007-l001-p2-queue-37884584355
          path: reports/r001-source
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37884584355
      - name: Run source-only preflight without model configuration
        run: |
          python scripts/run_ss001_l001_batch.py \
            --queue reports/r001-source/ss001-d007-l001-p2-queue.json \
            --output-dir reports/r001-preflight \
            --source-preflight
      - name: Prove exact source and no provider/capitalization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("reports/r001-preflight/source-preflight.json")
          p = json.loads(path.read_text())
          assert p["source_queue_sha256"] == "59929004bcc5a5eae4491cadc237aa1bb26b822102d56b5b50cf61fb6b667618"
          assert p["request_count"] == 1240
          assert p["shard_count"] == 16
          assert set(p["shard_request_counts"]) == {str(i) for i in range(16)}
          assert p["status"] == "SOURCE_PREFLIGHT_PASS_NO_MODEL_CONFIG"
          assert p["model_configured"] is False
          assert p["model_inference_executed"] is False
          assert p["share_action_clearance_proven"] is False
          assert p["market_capitalization_calculated"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          assert not Path("reports/r001-preflight/run-config.json").exists()
          print(json.dumps(p, indent=2, sort_keys=True))
          PY
      - name: Preserve exact real-queue preflight artifact
        uses: actions/upload-artifact@v4
        with:
          name: ss001-r001-real-source-preflight-${{ github.run_id }}
          path: reports/r001-preflight/source-preflight.json
          if-no-files-found: error
          retention-days: 30
