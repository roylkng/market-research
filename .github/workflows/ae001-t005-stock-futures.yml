name: AE001 T005 stock-futures incremental pilot

on:
  push:
    branches:
      - feat/ae001-futures-positioning-features-20260930

permissions:
  contents: read

jobs:
  pilot:
    if: contains(github.event.head_commit.message, '[ae001-t005]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify T005 implementation and frozen ledger before source access
        run: |
          ruff check \
            src/marketlab/alpha_futures.py \
            src/marketlab/alpha_futures_trial.py \
            scripts/build_ae001_futures_features.py \
            scripts/run_ae001_t005.py \
            tests/test_alpha_futures.py \
            tests/test_alpha_futures_trial.py
          pytest -q \
            tests/test_alpha_futures.py \
            tests/test_alpha_futures_trial.py \
            tests/test_alpha_multihorizon.py
          python - <<'PY'
          import json
          from marketlab.alpha_trials import (
              require_protocol_amendment,
              require_unopened_registered_trial,
              validate_trial_ledger,
          )

          ledger = json.load(open("research/ae001/trial-ledger.json"))
          validate_trial_ledger(ledger)
          require_unopened_registered_trial(
              ledger,
              trial_id="AE001-T005",
              required_status="FROZEN_BEFORE_OUTCOME_MATERIALIZATION",
          )
          require_protocol_amendment(
              ledger,
              trial_id="AE001-T005",
              protocol_id="AE001-T005-P1",
          )
          require_protocol_amendment(
              ledger,
              trial_id="AE001-T005",
              protocol_id="AE001-T005-P2",
          )
          print("T005 ledger gates: READY")
          PY

      - name: Rebuild frozen official NSE market panel
        run: |
          python scripts/build_ae001_historical_panel.py \
            --start-date 2025-09-01 \
            --end-date 2026-09-25 \
            --store .marketlab/ae001-t005 \
            --output reports/ae001-t005/panel \
            --attempts 4 \
            --timeout-seconds 30 \
            --pause-seconds 0.05

      - name: Rebuild action-safe base features from exact pinned T003 ledger
        run: |
          python scripts/build_ab001_p001_action_safe.py \
            --market-panel reports/ae001-t005/panel/market-panel.json.gz \
            --feature-panel reports/ae001-t005/panel/feature-panel.json.gz \
            --action-ledger research/ab001-p001/inputs/t003-corporate-action-ledger.json.gz \
            --action-ledger-manifest research/ab001-p001/inputs/t003-corporate-action-ledger.manifest.json \
            --output reports/ae001-t005/action-safe

      - name: Rebuild frozen 27-feature delivery panel
        run: |
          python scripts/build_ae001_delivery_features.py \
            --market-panel reports/ae001-t005/panel/market-panel.json.gz \
            --feature-panel reports/ae001-t005/action-safe/action-safe-feature-panel.json.gz \
            --store .marketlab/ae001-t005 \
            --output reports/ae001-t005/delivery \
            --attempts 4 \
            --timeout-seconds 30

      - name: Build new stock-futures feature panel
        run: |
          python scripts/build_ae001_futures_features.py \
            --market-panel reports/ae001-t005/panel/market-panel.json.gz \
            --feature-panel reports/ae001-t005/delivery/delivery-feature-panel.json.gz \
            --store .marketlab/ae001-t005 \
            --output reports/ae001-t005/futures \
            --attempts 4 \
            --timeout-seconds 30

      - name: Run frozen T005 incremental comparison
        run: |
          python scripts/run_ae001_t005.py \
            --market-panel reports/ae001-t005/panel/market-panel.json.gz \
            --feature-panel reports/ae001-t005/futures/futures-feature-panel.json.gz \
            --action-ledger reports/ae001-t005/action-safe/corporate-action-ledger.json.gz \
            --trial-ledger research/ae001/trial-ledger.json \
            --output reports/ae001-t005/study

      - name: Print compact result
        run: |
          cat reports/ae001-t005/futures/manifest.json
          cat reports/ae001-t005/study/summary.json

      - name: Upload exact T005 development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae001-t005-${{ github.run_id }}
          path: |
            reports/ae001-t005
            .marketlab/ae001-t005/market-data
          if-no-files-found: warn
          retention-days: 90
