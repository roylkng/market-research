name: H004 HR004 family diagnostic

on:
  push:
    branches:
      - research/h004-catalyst-candidates-v1-20260908
    paths:
      - .github/workflows/h004-hr004-family-diagnostic.yml
      - scripts/diagnose_h004_catalyst_families.py

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h004-catalyst-candidates-v1-20260908
          fetch-depth: 0
      - name: Diagnose already-frozen upper-bound family outcomes
        run: |
          python scripts/diagnose_h004_catalyst_families.py \
            --signals research/historical/h004/H004-HR004-catalyst/upper-bound-stage2-signals.json \
            --recalled research/historical/h004/H004-HR004-catalyst/upper-bound-recalled-episodes.json \
            --out research/historical/h004/H004-HR004-catalyst/family-diagnostic.json
      - name: Commit diagnostic
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/historical/h004/H004-HR004-catalyst/family-diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "H004-HR004: retain post-hoc catalyst family diagnostic"
          git push origin HEAD:research/h004-catalyst-candidates-v1-20260908
