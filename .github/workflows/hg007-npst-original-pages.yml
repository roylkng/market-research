name: HG007 NPST Q1 original June filing page evidence

on:
  pull_request:
    paths:
      - src/marketlab/hg007_npst_original_pages.py
      - scripts/extract_hg007_npst_original_pages.py
      - tests/test_hg007_npst_original_pages.py
      - .github/workflows/hg007-npst-original-pages.yml
  push:
    branches:
      - main
    paths:
      - src/marketlab/hg007_npst_original_pages.py
      - scripts/extract_hg007_npst_original_pages.py
      - tests/test_hg007_npst_original_pages.py
      - .github/workflows/hg007-npst-original-pages.yml

permissions:
  contents: write

concurrency:
  group: hg007-npst-first-quarter-source-page-custody
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test original page identity and strict source constraints
        run: |
          ruff check src/marketlab/hg007_npst_original_pages.py scripts/extract_hg007_npst_original_pages.py tests/test_hg007_npst_original_pages.py
          pytest -q tests/test_hg007_npst_original_pages.py
      - name: Extract original Q1 investor and Reg32 25 pages
        shell: bash
        run: |
          set -euo pipefail
          python scripts/extract_hg007_npst_original_pages.py \
            --repo-root . \
            --out /tmp/hg007-npst-q1-original-page-evidence.json \
            --print-matches > /tmp/hg007-npst-original-source-review-excerpts.txt
          head -n 25 /tmp/hg007-npst-original-source-review-excerpts.txt
          test -s /tmp/hg007-npst-q1-original-page-evidence.json
      - name: Anchor page evidence only after merge on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          TARGET="research/hg007/npst-aug2026-originals/june-original-page-text-v1.json"
          if [[ -f "$TARGET" ]]; then
            python scripts/extract_hg007_npst_original_pages.py \
              --repo-root . --out "$TARGET" --verify-existing
            exit 0
          fi
          cp /tmp/hg007-npst-q1-original-page-evidence.json "$TARGET"
          git config user.name marketlab-research-bot
          git config user.email marketlab-research-bot@users.noreply.github.com
          git add "$TARGET"
          git commit -m "HG007: preserve original NPST Q1 investor and June Reg32 page text no alpha [skip ci]"
          BASE_SHA="$(git rev-parse HEAD^)"
          for RETRY in 1 2 3; do
            git fetch origin main
            NEW_MAIN="$(git rev-parse origin/main)"
            if git cat-file -e "origin/main:$TARGET" 2>/dev/null; then
              echo "Immutable original NPST page evidence already published"
              exit 1
            fi
            if ! git diff --quiet "$BASE_SHA" "$NEW_MAIN" -- \
              research/hg007/npst-aug2026-originals/2026-08-11-investor-presentation \
              research/hg007/npst-aug2026-originals/2026-08-11-june-reg32-use-of-funds \
              src/marketlab/hg007_npst_original_pages.py; then
              echo "An original issuer PDF/source parser changed while reviewing"
              exit 1
            fi
            if [[ "$NEW_MAIN" != "$BASE_SHA" ]]; then
              git rebase origin/main
              BASE_SHA="$NEW_MAIN"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((2*RETRY))"
          done
          exit 1
      - name: Preserve full page text and matching source snippets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hg007-npst-original-25-june-quarter-source-pages
          path: |
            /tmp/hg007-npst-q1-original-page-evidence.json
            /tmp/hg007-npst-original-source-review-excerpts.txt
          if-no-files-found: ignore
          retention-days: 90
