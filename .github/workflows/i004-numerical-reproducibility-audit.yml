name: I004 numerical reproducibility audit

on:
  push:
    branches:
      - feat/po001-i004-rm001-v3-risk-20261002

permissions:
  contents: read
  actions: read

jobs:
  replicate:
    if: contains(github.event.head_commit.message, '[i004-numeric-audit]')
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Download exact pre-result I004 source evidence
        uses: actions/download-artifact@v4
        with:
          name: po001-i004-36967854755
          path: replay
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: roylkng/market-research
          run-id: 36967854755

      - name: Run exact control and treatment without exact-count gate
        env:
          REPLICA: ${{ matrix.replica }}
        run: |
          python - <<'PY'
          import gzip
          import json
          import os
          from pathlib import Path

          from marketlab.alpha_history import load_canonical_gzip_json
          import marketlab.po001_i004 as i004

          def load_json(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          market = load_canonical_gzip_json(
              Path("replay/reports/po001-i004/panel/market-panel.json.gz").read_bytes()
          )
          features = load_canonical_gzip_json(
              Path(
                  "replay/reports/po001-i004/delivery/delivery-feature-panel.json.gz"
              ).read_bytes()
          )
          alpha = load_json(
              "research/po001-i003/inputs/i002-alpha-model-v1.json"
          )
          control_risk = load_canonical_gzip_json(
              Path(
                  "research/po001-i003/inputs/i002-risk-state-legacy.json.gz"
              ).read_bytes()
          )
          treatment_risk = load_canonical_gzip_json(
              Path(
                  "research/po001-i004/inputs/rm001-v3-p001-risk-state.json.gz"
              ).read_bytes()
          )

          captured = []
          original_optimizer = i004.optimize_portfolio_v3
          original_gate = i004._validate_control_reproduction

          def capture_optimizer(**kwargs):
              artifact = original_optimizer(**kwargs)
              captured.append(artifact)
              return artifact

          i004.optimize_portfolio_v3 = capture_optimizer
          i004._validate_control_reproduction = lambda summary: None
          try:
              i004.run_po001_i004(
                  delivery_feature_panel=features,
                  market_panel=market,
                  pinned_alpha_model=alpha,
                  control_risk_state=control_risk,
                  treatment_risk_state=treatment_risk,
              )
          finally:
              i004.optimize_portfolio_v3 = original_optimizer
              i004._validate_control_reproduction = original_gate

          if len(captured) != 2:
              raise SystemExit(f"expected control+treatment artifacts, got {len(captured)}")

          def compact(artifact):
              weights = {
                  f"{row['symbol']}|{row['isin']}": float(row["target_weight"])
                  for row in artifact["rows"]
              }
              active_12 = sum(value > 1e-12 for value in weights.values())
              active_8 = sum(value > 1e-8 for value in weights.values())
              return {
                  "artifact_sha256": artifact["artifact_sha256"],
                  "holding_count_gt_1e12": active_12,
                  "holding_count_gt_1e8": active_8,
                  "invested_weight": float(artifact["invested_weight"]),
                  "expected_5d_excess_return": float(
                      artifact["expected_excess_return"]
                  ),
                  "annualized_volatility": (
                      float(artifact["total_variance_daily"]) * 252.0
                  ) ** 0.5,
                  "total_variance_daily": float(
                      artifact["total_variance_daily"]
                  ),
                  "risk_penalty": float(artifact["risk_penalty"]),
                  "total_transaction_cost_fraction": float(
                      artifact["total_transaction_cost_fraction"]
                  ),
                  "objective_utility": float(artifact["objective_utility"]),
                  "solver_iterations": int(artifact["solver"]["iterations"]),
                  "weights": weights,
              }

          payload = {
              "schema_version": 1,
              "replica": int(os.environ["REPLICA"]),
              "control": compact(captured[0]),
              "treatment": compact(captured[1]),
              "live_capital_allowed": False,
          }
          out = Path("numeric-audit")
          out.mkdir(parents=True, exist_ok=True)
          path = out / f"replica-{os.environ['REPLICA']}.json"
          path.write_text(
              json.dumps(payload, indent=2, sort_keys=True, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "replica": payload["replica"],
              "control": {k: v for k, v in payload["control"].items() if k != "weights"},
              "treatment": {k: v for k, v in payload["treatment"].items() if k != "weights"},
          }, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: i004-numeric-replica-${{ matrix.replica }}
          path: numeric-audit/replica-${{ matrix.replica }}.json
          retention-days: 90

  compare:
    needs: replicate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: i004-numeric-replica-*
          path: replicas
          merge-multiple: true

      - name: Compare frozen numerical reproducibility bounds
        run: |
          python - <<'PY'
          import itertools
          import json
          from pathlib import Path

          replicas = [
              json.loads(path.read_text(encoding="utf-8"))
              for path in sorted(Path("replicas").glob("replica-*.json"))
          ]
          if len(replicas) != 3:
              raise SystemExit(f"expected three replicas, got {len(replicas)}")

          scalar_limits = {
              "expected_5d_excess_return": 1e-8,
              "annualized_volatility": 1e-6,
              "total_variance_daily": 1e-10,
              "risk_penalty": 1e-9,
              "total_transaction_cost_fraction": 1e-8,
              "objective_utility": 1e-8,
          }

          summary = {
              "schema_version": 1,
              "audit_id": "PO001-I004-NUMERICAL-REPRODUCIBILITY-v1",
              "replica_count": 3,
              "control": {},
              "treatment": {},
              "live_capital_allowed": False,
          }

          overall_scalar_pass = True
          overall_weight_pass = True

          for side in ("control", "treatment"):
              scalar_ranges = {}
              for field, limit in scalar_limits.items():
                  values = [float(row[side][field]) for row in replicas]
                  observed = max(values) - min(values)
                  scalar_ranges[field] = {
                      "min": min(values),
                      "max": max(values),
                      "range": observed,
                      "frozen_limit": limit,
                      "passed": observed <= limit,
                  }
                  overall_scalar_pass &= observed <= limit

              max_abs_pairwise = 0.0
              max_l1_pairwise = 0.0
              for left, right in itertools.combinations(replicas, 2):
                  lw = left[side]["weights"]
                  rw = right[side]["weights"]
                  if lw.keys() != rw.keys():
                      raise SystemExit(f"{side} identity sets differ across replicas")
                  differences = [abs(float(lw[k]) - float(rw[k])) for k in lw]
                  max_abs_pairwise = max(max_abs_pairwise, max(differences))
                  max_l1_pairwise = max(max_l1_pairwise, sum(differences))

              holding_12 = [int(row[side]["holding_count_gt_1e12"]) for row in replicas]
              holding_8 = [int(row[side]["holding_count_gt_1e8"]) for row in replicas]
              weight_pass = (
                  max_abs_pairwise <= 1e-4
                  and max_l1_pairwise <= 0.01
              )
              threshold_only = (
                  len(set(holding_12)) > 1
                  and len(set(holding_8)) == 1
                  and weight_pass
              )
              overall_weight_pass &= weight_pass

              summary[side] = {
                  "artifact_sha256_values": [
                      row[side]["artifact_sha256"] for row in replicas
                  ],
                  "holding_count_gt_1e12_values": holding_12,
                  "holding_count_gt_1e8_values": holding_8,
                  "solver_iterations": [
                      row[side]["solver_iterations"] for row in replicas
                  ],
                  "scalar_ranges": scalar_ranges,
                  "max_pairwise_absolute_weight_diff": max_abs_pairwise,
                  "max_pairwise_l1_weight_diff": max_l1_pairwise,
                  "weight_stability_passed": weight_pass,
                  "threshold_only_holding_noise": threshold_only,
              }

          summary["economic_scalar_stability_passed"] = overall_scalar_pass
          summary["exact_weight_interpretation_reproducible"] = overall_weight_pass
          summary["interpretation"] = (
              "SCALARS_AND_WEIGHTS_REPRODUCIBLE"
              if overall_scalar_pass and overall_weight_pass
              else (
                  "SCALARS_REPRODUCIBLE_WEIGHT_LEVEL_UNSTABLE"
                  if overall_scalar_pass
                  else "ECONOMIC_SCALARS_NUMERICALLY_UNSTABLE"
              )
          )

          Path("i004-numerical-audit-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: i004-numerical-reproducibility-summary
          path: i004-numerical-audit-summary.json
          retention-days: 90
