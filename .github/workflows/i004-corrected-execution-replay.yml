name: I004 corrected execution replay

on:
  push:
    branches:
      - feat/po001-i004-rm001-v3-risk-20261002

permissions:
  contents: read
  actions: read

jobs:
  replay:
    if: contains(github.event.head_commit.message, '[i004-corrected-replay]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Download exact failed-run source evidence
        uses: actions/download-artifact@v4
        with:
          name: po001-i004-36967854755
          path: replay
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: roylkng/market-research
          run-id: 36967854755

      - name: Verify replay source files
        run: |
          set -euo pipefail
          test -f replay/reports/po001-i004/panel/market-panel.json.gz
          test -f replay/reports/po001-i004/delivery/delivery-feature-panel.json.gz
          echo "Using exact source evidence from failed pre-result run 36967854755"

      - name: Run corrected frozen I004 only
        run: |
          python scripts/run_po001_i004.py \
            --market-panel replay/reports/po001-i004/panel/market-panel.json.gz \
            --feature-panel replay/reports/po001-i004/delivery/delivery-feature-panel.json.gz \
            --alpha-model research/po001-i003/inputs/i002-alpha-model-v1.json \
            --alpha-model-manifest research/po001-i003/inputs/i002-alpha-model-v1-manifest.json \
            --control-risk research/po001-i003/inputs/i002-risk-state-legacy.json.gz \
            --control-risk-manifest research/po001-i003/inputs/i002-risk-state-legacy-manifest.json \
            --treatment-risk research/po001-i004/inputs/rm001-v3-p001-risk-state.json.gz \
            --treatment-risk-manifest research/po001-i004/inputs/rm001-v3-p001-risk-state-manifest.json \
            --output reports/po001-i004-corrected-replay

      - name: Print result
        run: cat reports/po001-i004-corrected-replay/summary.json

      - name: Upload corrected replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: po001-i004-corrected-replay-${{ github.run_id }}
          path: reports/po001-i004-corrected-replay
          if-no-files-found: warn
          retention-days: 90
