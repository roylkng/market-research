name: H004 HR003 price-basis audit

on:
  push:
    branches:
      - research/h004-full-market-denominator-v1-20260908
    paths:
      - .github/workflows/h004-hr003-price-basis-audit.yml
      - scripts/audit_h004_full_market_corporate_actions.py

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h004-full-market-denominator-v1-20260908
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Audit corporate-action contamination
        run: |
          python scripts/audit_h004_full_market_corporate_actions.py \
            --episodes research/historical/h004/H004-HR003-full-market/primary-episodes.json \
            --out research/historical/h004/H004-HR003-full-market/price-basis-audit.json
      - name: Commit audit
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/historical/h004/H004-HR003-full-market/price-basis-audit.json
          if git diff --cached --quiet; then
            echo "audit unchanged"
            exit 0
          fi
          git commit -m "H004-HR003: retain price-basis audit"
          git push origin HEAD:research/h004-full-market-denominator-v1-20260908
