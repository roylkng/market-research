name: D004 Ruff import diagnostic

on:
  push:
    branches:
      - research/t008-combined-four-period-panel-20260930

permissions:
  contents: read

jobs:
  diff:
    if: contains(github.event.head_commit.message, '[d004-ruff]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ruff
        run: python -m pip install 'ruff==0.16.9'
      - name: Print exact Ruff fix
        run: |
          ruff check --fix tests/test_alpha_fundamental_combined.py || true
          git diff -- tests/test_alpha_fundamental_combined.py
