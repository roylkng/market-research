name: H002 NSE market-data contract probe

on:
  push:
    branches:
      - probe/h002-marketdata-contracts-20260906
    paths:
      - .github/workflows/h002-marketdata-contract-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Probe official archive and holiday contracts
        run: |
          mkdir -p probe-out
          python - <<'PY'
          import csv
          import io
          import json
          import zipfile
          from pathlib import Path
          import requests
          from marketlab.nse import NSEClient

          out = Path('probe-out')
          client = NSEClient(timeout=20.0, attempts=4)
          client._initialize_session()
          headers = {'User-Agent': client.session.headers['User-Agent']}

          urls = {
              'udiff-20260904': 'https://nsearchives.nseindia.com/content/cm/BhavCopy_NSE_CM_0_0_0_20260904_F_0000.csv.zip',
              'full-bhav-20260904': 'https://archives.nseindia.com/products/content/sec_bhavdata_full_04092026.csv',
              'index-snapshot-20260904': 'https://archives.nseindia.com/content/indices/ind_close_all_04092026.csv',
              'udiff-known-20260820': 'https://nsearchives.nseindia.com/content/cm/BhavCopy_NSE_CM_0_0_0_20260820_F_0000.csv.zip',
              'full-bhav-known-20260820': 'https://archives.nseindia.com/products/content/sec_bhavdata_full_20082026.csv',
              'index-snapshot-known-20260820': 'https://archives.nseindia.com/content/indices/ind_close_all_20082026.csv',
          }
          summary = {}
          for name, url in urls.items():
              try:
                  response = requests.get(url, headers=headers, timeout=20)
                  raw = response.content
                  record = {
                      'url': url,
                      'status': response.status_code,
                      'content_type': response.headers.get('content-type'),
                      'byte_count': len(raw),
                  }
                  if raw:
                      (out / f'{name}.raw').write_bytes(raw)
                  if response.status_code == 200 and raw:
                      data = raw
                      if raw[:2] == b'PK':
                          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                              record['zip_names'] = archive.namelist()
                              if archive.namelist():
                                  data = archive.read(archive.namelist()[0])
                                  (out / f'{name}.csv').write_bytes(data)
                      text = data.decode('utf-8-sig', errors='replace')
                      rows = list(csv.reader(io.StringIO(text)))
                      if rows:
                          record['header'] = rows[0]
                          record['first_row'] = rows[1] if len(rows) > 1 else None
                          record['row_count'] = max(0, len(rows)-1)
                  summary[name] = record
              except Exception as exc:
                  summary[name] = {'url': url, 'error': repr(exc)}

          try:
              response = client.session.get(
                  'https://www.nseindia.com/api/holiday-master',
                  params={'type': 'trading'},
                  timeout=20,
              )
              raw = response.content
              (out / 'holiday-master.raw').write_bytes(raw)
              payload = response.json()
              cm = payload.get('CM', []) if isinstance(payload, dict) else []
              summary['holiday-master'] = {
                  'status': response.status_code,
                  'byte_count': len(raw),
                  'cm_count': len(cm),
                  'cm_rows': cm,
              }
          except Exception as exc:
              summary['holiday-master'] = {'error': repr(exc)}

          (out / 'summary-v2.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True, default=str) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, indent=2, sort_keys=True, default=str))
          PY
      - name: Commit probe summary
        run: |
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          mkdir -p research/probes/h002-marketdata-2026-09-06
          cp probe-out/summary-v2.json research/probes/h002-marketdata-2026-09-06/summary-v2.json
          git add research/probes/h002-marketdata-2026-09-06/summary-v2.json
          git commit -m "Capture NSE static market-data archive contracts" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h002-nse-marketdata-contract-probe-${{ github.run_id }}
          path: probe-out
          if-no-files-found: error
          retention-days: 30
