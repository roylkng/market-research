name: HG007 P030 original-source five-case underwriting readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/marketlab/hg007_p030_underwriting_readiness.py
      - scripts/build_hg007_p030_underwriting.py
      - tests/test_hg007_p030_underwriting_readiness.py
      - .github/workflows/hg007-five-case-underwriting-readiness.yml
  push:
    branches:
      - main
    paths:
      - src/marketlab/hg007_p030_underwriting_readiness.py
      - scripts/build_hg007_p030_underwriting.py
      - tests/test_hg007_p030_underwriting_readiness.py
      - .github/workflows/hg007-five-case-underwriting-readiness.yml

permissions:
  contents: write

concurrency:
  group: hg007-p030-five-case-underwriting-readiness
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify original eleven source records and five-company non-capital rules
        run: |
          ruff check src/marketlab/hg007_p030_underwriting_readiness.py scripts/build_hg007_p030_underwriting.py tests/test_hg007_p030_underwriting_readiness.py
          pytest -q tests/test_hg007_p030_underwriting_readiness.py
      - name: Generate immutable five-stock source-aware underwriting blockers
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_hg007_p030_underwriting.py \
            --repo-root . \
            --out /tmp/hg007-p030-underwriting-v1.json
          test -s /tmp/hg007-p030-underwriting-v1.json
      - name: Anchor immutable source-verified blocker packet to main only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          DEST="research/hg007/hg007-p030-five-case-underwriting-readiness-v1.json"
          if [[ -f "$DEST" ]]; then
            python scripts/build_hg007_p030_underwriting.py \
              --out "$DEST" --verify-existing
            echo "P030 five-case source blockers already anchored"
            exit 0
          fi
          mkdir -p "$(dirname "$DEST")"
          cp /tmp/hg007-p030-underwriting-v1.json "$DEST"
          git config user.name marketlab-research-bot
          git config user.email marketlab-research-bot@users.noreply.github.com
          git add "$DEST"
          git commit -m "HG007: anchor five primary-source underwriting blockers [skip ci]"
          BASE_SHA="$(git rev-parse HEAD^)"
          for ATTEMPT in 1 2 3; do
            git fetch origin main
            NEW_MAIN="$(git rev-parse origin/main)"
            if git cat-file -e "origin/main:$DEST" 2>/dev/null; then
              echo "Original source report already exists, refusing overwrite"
              exit 1
            fi
            if ! git diff --quiet "$BASE_SHA" "$NEW_MAIN" -- \
              research/hg005-d001-result-v1.json \
              research/hg005-d003-result-v1.json \
              research/hg007/hg007-p013-28-case-sept29-fd-pledge-overlay-v1.json \
              research/hg007/anantraj-full-scheme/p026-clause-review-v1.json \
              research/hg007/anantraj-qip-monitor-june2026/p029-source-object-cash-ledger-v1.json \
              research/hg007/devx-originals/lease-cash-credit-gate-v1.json \
              research/hg007/npst-aug2026-originals/june-2026-financial-and-funding-ledger-v1.json \
              research/hg007/npst-aug2026-originals/june-visual-financial-review-v1.json \
              research/hg007/sambhv-aug2026-investor/phase1-steel-power-capex-v1.json \
              research/hg007/wwil-bse-original/reconciled-issuer-terms-v1.json \
              research/hg007/wwil-oct7-press/source-bound-post-synergy-hurdle-v1.json \
              src/marketlab/hg007_p030_underwriting_readiness.py; then
              echo "Frozen underlying issuer evidence changed while report was assembled"
              exit 1
            fi
            if [[ "$NEW_MAIN" != "$BASE_SHA" ]]; then
              git rebase origin/main
              BASE_SHA="$NEW_MAIN"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((ATTEMPT*2))"
          done
          echo "Failed to anchor P030 exact source underwriter after bounded attempts"
          exit 1
      - name: Retain reviewer-readable source-backed underwriting board
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hg007-p030-five-source-verified-underwriting-readiness
          path: /tmp/hg007-p030-underwriting-v1.json
          if-no-files-found: ignore
          retention-days: 90
