name: SS002 D001 special-situation announcement census

on:
  push:
    branches:
      - research/ss002-special-situations-census-20261004

permissions:
  actions: read
  contents: read

jobs:
  census:
    if: contains(github.event.head_commit.message, '[ss002-d001]')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate frozen D001 implementation
        run: |
          ruff check \
            src/marketlab/ss002_special_situations.py \
            scripts/run_ss002_d001.py \
            tests/test_ss002_special_situations.py
          pytest -q \
            tests/test_ss002_special_situations.py \
            tests/test_alpha_announcements.py

      - name: Download exact passed SS001 D001 census
        uses: actions/download-artifact@v4
        with:
          name: ss001-d001-37197575401
          path: reports/ss001-d001-source
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37197575401

      - name: Verify exact SS001 census
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          census = json.loads(
              Path("reports/ss001-d001-source/ss001-d001-census.json").read_text()
          )
          assert census["census_sha256"] == (
              "0cfdc8658873a09f0cfa547467108888523eee88951050acfd2df8bd131829b7"
          )
          assert census["eq_identity_count"] == 2319
          assert census["return_outcomes_opened"] is False
          PY

      - name: Run frozen special-situation census
        run: |
          python scripts/run_ss002_d001.py \
            --ss001-census reports/ss001-d001-source/ss001-d001-census.json \
            --raw-dir reports/ss002-d001/raw \
            --output reports/ss002-d001 \
            --attempts 4 \
            --timeout-seconds 25 \
            --pause-seconds 0.05

      - name: Prove outcome-blind special-situation source census
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          census = json.loads(
              Path("reports/ss002-d001/ss002-d001-census.json").read_text()
          )
          assert census["census_id"] == "SS002-D001-v1"
          assert census["return_outcomes_opened"] is False
          assert census["model_fitted"] is False
          assert census["portfolio_eligibility_allowed"] is False
          assert census["live_capital_allowed"] is False
          print(json.dumps({
              "census_sha256": census["census_sha256"],
              "source_row_count": census["source_row_count"],
              "candidate_event_count": census["candidate_event_count"],
              "distinct_candidate_symbol_count": census["distinct_candidate_symbol_count"],
              "mapped_candidate_event_count": census["mapped_candidate_event_count"],
              "mapped_candidate_event_ratio": census["mapped_candidate_event_ratio"],
              "category_counts": census["category_counts"],
              "threshold_passes": census["threshold_passes"],
              "feasibility_pass": census["feasibility_pass"],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload exact SS002 D001 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss002-d001-${{ github.run_id }}
          path: reports/ss002-d001
          if-no-files-found: warn
          retention-days: 90
