name: RM001-v3 prospective risk state

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - RM001 SC001 previous-session size pre-open timing
    types:
      - completed
  schedule:
    # Independent fallbacks after the final frozen size-source probes.
    # Asia/Kolkata: 08:33 and 08:43.
    - cron: '3 3 * * 1-5'
    - cron: '13 3 * * 1-5'

permissions:
  contents: write

concurrency:
  group: rm001-v3-prospective-risk-state
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh latest canonical main before risk construction
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach origin/main
          echo "RISK_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Verify frozen prospective RM001-v3 implementation
        run: |
          ruff check \
            src/marketlab/rm001_v3_prospective.py \
            scripts/build_rm001_v3_prospective_state.py \
            scripts/verify_rm001_v3_prospective.py \
            tests/test_rm001_v3_prospective.py
          pytest -q \
            tests/test_rm001_v3_prospective.py \
            tests/test_rm001_v2.py \
            tests/test_rm001_v3.py \
            tests/test_rm001_size_timing.py \
            tests/test_rm001_size_source.py
          python scripts/verify_rm001_sc001.py \
            --ledger research/prospective/rm001-sc001/source-ledger.json \
            --summary research/prospective/rm001-sc001/readiness-summary.json
          python scripts/verify_rm001_v3_prospective.py \
            --ledger research/prospective/rm001-v3/risk-ledger.json

      - name: Resolve prospective risk-state window
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=Asia/Kolkata date +%F)"
          NOW_HM="$(TZ=Asia/Kolkata date +%H%M)"
          if [[ "$TODAY" < "2026-10-02" ]]; then
            STATE="BEFORE_START"
          elif [[ "$NOW_HM" > "0905" ]]; then
            STATE="AFTER_RISK_SEAL_CUTOFF"
          else
            STATE="READY"
          fi
          echo "date=$TODAY" >> "$GITHUB_OUTPUT"
          echo "time_hm=$NOW_HM" >> "$GITHUB_OUTPUT"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "RM001-v3 prospective gate: date=$TODAY time=$NOW_HM event=${GITHUB_EVENT_NAME} state=$STATE"

      - name: Build prospective RM001-v3 state when timing gate is mature
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          WORK="reports/rm001-v3-prospective/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$WORK"
          python scripts/build_rm001_v3_prospective_state.py \
            --sc001-ledger research/prospective/ae001-sc001/source-ledger.json \
            --size-ledger research/prospective/rm001-sc001/source-ledger.json \
            --readiness-summary research/prospective/rm001-sc001/readiness-summary.json \
            --risk-ledger research/prospective/rm001-v3/risk-ledger.json \
            --state-dir research/prospective/rm001-v3/states \
            --work-dir "$WORK" \
            --attempts 4 \
            --timeout-seconds 30 | tee "$WORK/run.log"
          python scripts/verify_rm001_v3_prospective.py \
            --ledger research/prospective/rm001-v3/risk-ledger.json

      - name: Anchor append-only prospective RM001-v3 state
        if: steps.gate.outputs.state == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          LEDGER="research/prospective/rm001-v3/risk-ledger.json"
          python scripts/verify_rm001_v3_prospective.py --ledger "$LEDGER"

          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add "$LEDGER"
          if [ -d research/prospective/rm001-v3/states ]; then
            git add research/prospective/rm001-v3/states
          fi
          if git diff --cached --quiet; then
            echo "No new prospective RM001-v3 canonical state"
            exit 0
          fi

          START_SHA="$RISK_BASE_SHA"
          git commit -m "RM001-v3: seal prospective risk state ${{ steps.gate.outputs.date }} [skip ci]"

          CRITICAL_PATHS=(
            ".github/workflows/rm001-v3-prospective-risk.yml"
            ".github/workflows/rm001-sc001-preopen-size-timing.yml"
            "registry/rm001_v3_prospective.yaml"
            "research/RM001_V3_PROSPECTIVE_RISK_STATE_V1.md"
            "research/RM001_RISK_MODEL_V3.md"
            "research/RM001_V3_PROTOCOL_AMENDMENT_P1_MATCH_PARENT_CLOCK.md"
            "research/prospective/ae001-sc001"
            "research/prospective/rm001-sc001"
            "research/prospective/rm001-v3"
            "src/marketlab/rm001_v2.py"
            "src/marketlab/rm001_v3.py"
            "src/marketlab/rm001_v3_prospective.py"
            "src/marketlab/rm001_size_panel.py"
            "src/marketlab/rm001_size_source.py"
            "scripts/build_rm001_v3_prospective_state.py"
            "scripts/verify_rm001_v3_prospective.py"
          )

          for ATTEMPT in 1 2 3; do
            git fetch origin main
            CURRENT_MAIN="$(git rev-parse origin/main)"
            if [ "$START_SHA" != "$CURRENT_MAIN" ]; then
              if ! git diff --quiet "$START_SHA" "$CURRENT_MAIN" -- "${CRITICAL_PATHS[@]}"; then
                echo "RM001-v3 rules or causal source state changed while risk construction was in flight"
                git diff --stat "$START_SHA" "$CURRENT_MAIN" -- "${CRITICAL_PATHS[@]}"
                exit 1
              fi
              git rebase origin/main
              python scripts/verify_rm001_v3_prospective.py --ledger "$LEDGER"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((ATTEMPT * 2))
          done
          echo "Unable to anchor prospective RM001-v3 state after bounded retries"
          exit 1

      - name: Upload prospective RM001-v3 support evidence
        if: always() && steps.gate.outputs.state == 'READY'
        uses: actions/upload-artifact@v4
        with:
          name: rm001-v3-prospective-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/rm001-v3-prospective
          if-no-files-found: warn
          retention-days: 90

      - name: Report non-build gate
        if: steps.gate.outputs.state != 'READY'
        run: |
          echo "RM001-v3 prospective state not built: state=${{ steps.gate.outputs.state }} date=${{ steps.gate.outputs.date }} time=${{ steps.gate.outputs.time_hm }}"
