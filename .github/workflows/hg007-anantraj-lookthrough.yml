name: HG007 ANANTRAJ original source ownership lookthrough

on:
  pull_request:
    paths:
      - src/marketlab/hg007_anantraj_lookthrough.py
      - scripts/build_hg007_anantraj_lookthrough.py
      - tests/test_hg007_anantraj_lookthrough.py
      - .github/workflows/hg007-anantraj-lookthrough.yml
  push:
    branches:
      - main
    paths:
      - src/marketlab/hg007_anantraj_lookthrough.py
      - scripts/build_hg007_anantraj_lookthrough.py
      - tests/test_hg007_anantraj_lookthrough.py
      - .github/workflows/hg007-anantraj-lookthrough.yml

permissions:
  contents: write

concurrency:
  group: hg007-anantraj-parent-direct-shareholder-lookthrough
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate exact original source/payout contract
        run: |
          ruff check src/marketlab/hg007_anantraj_lookthrough.py scripts/build_hg007_anantraj_lookthrough.py tests/test_hg007_anantraj_lookthrough.py
          pytest -q tests/test_hg007_anantraj_lookthrough.py
      - name: Materialize read-only parent/direct ownership
        run: |
          python scripts/build_hg007_anantraj_lookthrough.py \
            --repo-root . \
            --out /tmp/hg007-anantraj-lookthrough-v1.json
          test -s /tmp/hg007-anantraj-lookthrough-v1.json
      - name: Anchor source-backed scenario once after merge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          DEST="research/hg007/anantraj-july2026-originals/conditional-parent-direct-newco-ownership-v1.json"
          if [[ -f "$DEST" ]]; then
            python scripts/build_hg007_anantraj_lookthrough.py \
              --out "$DEST" --verify-existing
            exit 0
          fi
          cp /tmp/hg007-anantraj-lookthrough-v1.json "$DEST"
          git config user.name marketlab-research-bot
          git config user.email marketlab-research-bot@users.noreply.github.com
          git add "$DEST"
          git commit -m "HG007: retain source-pinned conditional ANANTRAJ parent/direct newco share bridge [skip ci]"
          BASE_SHA="$(git rev-parse HEAD^)"
          for RETRY in 1 2 3; do
            git fetch origin main
            HEAD_NOW="$(git rev-parse origin/main)"
            if git cat-file -e "origin/main:$DEST" 2>/dev/null; then
              echo "Original look-through is already anchored"
              exit 1
            fi
            if ! git diff --quiet "$BASE_SHA" "$HEAD_NOW" -- \
              research/hg007/anantraj-july2026-originals/raw \
              research/hg007/anantraj-july2026-originals/verified-original-source-receipts-v1.json \
              research/hg005-d001-result-v1.json \
              src/marketlab/hg007_anantraj_lookthrough.py; then
              echo "Original source or approved model changed mid-analysis"
              exit 1
            fi
            if [[ "$HEAD_NOW" != "$BASE_SHA" ]]; then
              git rebase origin/main
              BASE_SHA="$HEAD_NOW"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((RETRY*2))"
          done
          exit 1
      - name: Retain derived source-verified analysis independently
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hg007-anantraj-parent-direct-ownership-not-a-stock-target
          path: /tmp/hg007-anantraj-lookthrough-v1.json
          retention-days: 90
          if-no-files-found: ignore
