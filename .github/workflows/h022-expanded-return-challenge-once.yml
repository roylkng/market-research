name: H022 expanded Nifty 200 challenge once

on:
  push:
    branches:
      - research/h022-expanded-return-challenge-v1-20260913
    paths:
      - .github/workflows/h022-expanded-return-challenge-once.yml

permissions:
  contents: write

jobs:
  challenge:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h022-expanded-return-challenge-v1-20260913
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Run frozen expanded historical challenge
        run: |
          set -euo pipefail
          OUT='research/historical/h022/expanded-nifty200-challenge-v1'
          STORE='run-out/h022-expanded-nifty200-challenge/store'
          mkdir -p "$OUT" "$STORE"
          python scripts/run_h022_expanded_historical_challenge.py \
            --feature-panel research/historical/h022/expanded-feature-panel-v1/feature-panel.json \
            --reconstruction research/historical/h022/historical-nifty200-universe-v1/membership-reconstruction.json \
            --store "$STORE" \
            --report-out "$OUT/outcome-report.json" \
            --summary-out "$OUT/outcome-summary.json" \
            --evidence-manifest-out "$OUT/evidence-manifest.json"
          python scripts/summarize_h022_exclusions.py \
            --report "$OUT/outcome-report.json" \
            --out "$OUT/exclusions-summary.json"

      - name: Upload raw official evidence
        uses: actions/upload-artifact@v4
        with:
          name: h022-expanded-nifty200-raw-evidence
          path: run-out/h022-expanded-nifty200-challenge/store
          if-no-files-found: error
          retention-days: 90

      - name: Anchor results and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'marketlab-research-bot'
          git config user.email 'marketlab-research-bot@users.noreply.github.com'
          git add research/historical/h022/expanded-nifty200-challenge-v1
          git rm .github/workflows/h022-expanded-return-challenge-once.yml
          git commit -m 'H022: anchor expanded Nifty 200 challenge results'
          git push origin HEAD:research/h022-expanded-return-challenge-v1-20260913
