name: HG009 P005 source-only cohort confounder baseline

on:
  push:
    branches:
      - research/hg009-p005-source-baseline-confounders-20261014
    paths:
      - .github/workflows/hg009-p005-baseline.yml
      - src/marketlab/hg009_p005_baseline.py
      - scripts/materialize_hg009_p005.py
      - tests/test_hg009_p005_baseline.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hg009-p005-300-original-source-baseline
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MarketLab
        run: python -m pip install -e '.[dev]'
      - name: Compute original October 5 source-only baseline across three frozen arms
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_hg009_p005.py
          python scripts/materialize_hg009_p005.py --check
          ruff check src/marketlab/hg009_p005_baseline.py scripts/materialize_hg009_p005.py tests/test_hg009_p005_baseline.py
          pytest -q tests/test_hg009_p005_baseline.py
      - name: Anchor immutable diagnostic baseline with no opened future prices
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketlab-research-bot"
          git config user.email "marketlab-research-bot@users.noreply.github.com"
          git add research/hg009/hg009-p005-source-baseline-300-v1.json
          if git diff --cached --quiet; then
            echo "HG009 P005 original source diagnostic already sealed"
            exit 0
          fi
          git commit -m "HG009 P005: original Oct5 300-company pre-entry source confounders [skip ci]"
          git fetch origin research/hg009-p005-source-baseline-confounders-20261014
          git rebase origin/research/hg009-p005-source-baseline-confounders-20261014
          python scripts/materialize_hg009_p005.py --check
          git push origin HEAD:research/hg009-p005-source-baseline-confounders-20261014
