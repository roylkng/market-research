name: HG005 D002A payoff enrichment source corpus

on:
  push:
    branches:
      - research/hg005-d002-integrated-20261005

permissions:
  contents: read

jobs:
  acquire:
    if: contains(github.event.head_commit.message, '[hg005-d002a]')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate frozen D002A implementation before source access
        run: |
          ruff check \
            src/marketlab/hg005_d002a.py \
            scripts/run_hg005_d002a.py \
            tests/test_hg005_d002a.py
          pytest -q \
            tests/test_hg005_d002a.py \
            tests/test_ss002_text.py \
            tests/test_alpha_announcements.py

      - name: Acquire official HG005 enrichment sources
        run: |
          python scripts/run_hg005_d002a.py \
            --manifest research/hg005/hg005-d002-source-manifest-v1.json \
            --raw-dir reports/hg005-d002a/raw \
            --output reports/hg005-d002a \
            --attempts 4 \
            --timeout-seconds 30

      - name: Prove source-only corpus
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(
              Path("reports/hg005-d002a/hg005-d002a-corpus.json").read_text()
          )
          assert p["corpus_id"] == "HG005-D002A-v1"
          assert p["source_count"] == 19
          assert p["return_outcomes_opened"] is False
          assert p["model_fitted"] is False
          assert p["llm_inference_executed"] is False
          assert p["portfolio_eligibility_allowed"] is False
          assert p["live_capital_allowed"] is False
          print(json.dumps({
              "corpus_sha256": p["corpus_sha256"],
              "manifest_sha256": p["manifest_sha256"],
              "ready_source_count": p["ready_source_count"],
              "ready_text_count": p["ready_text_count"],
              "mandatory_text_ready": p["mandatory_text_ready"],
              "symbol_ready_source_counts": p["symbol_ready_source_counts"],
              "document_family_counts": p["document_family_counts"],
              "failure_reason_counts": p["failure_reason_counts"],
              "threshold_passes": p["threshold_passes"],
              "feasibility_pass": p["feasibility_pass"],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload exact D002A corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hg005-d002a-${{ github.run_id }}
          path: reports/hg005-d002a
          if-no-files-found: warn
          retention-days: 90
