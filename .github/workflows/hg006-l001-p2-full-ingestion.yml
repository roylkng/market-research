name: HG006 L001 P2 full historical ingestion

on:
  push:
    branches:
      - research/hg006-l001-p2-full-ingestion-20261007

permissions:
  actions: read
  contents: read

jobs:
  combine:
    if: contains(github.event.head_commit.message, '[hg006-p2-combine]')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate frozen combination infrastructure
        run: |
          ruff check \
            src/marketlab/hg006_full_inference.py \
            scripts/combine_hg006_l001_p2_shards.py \
            tests/test_hg006_full_inference.py
          pytest -q \
            tests/test_hg006_full_inference.py \
            tests/test_hg006_inference_queue.py \
            tests/test_hg006_stage_contract.py

      - name: Download exact frozen queue
        uses: actions/download-artifact@v4
        with:
          name: hg006-l001-p1-queue-37416900979
          path: reports/queue
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37416900979

      - name: Download exact passed P0
        uses: actions/download-artifact@v4
        with:
          name: hg006-l001-p0-native-37421844965
          path: reports/p0
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37421844965

      - name: Download shard 00
        uses: actions/download-artifact@v4
        with:
          name: hg006-l001-p2-shard-00-37430920224
          path: reports/shard-00
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37430920224

      - name: Download shard 01
        uses: actions/download-artifact@v4
        with:
          name: hg006-l001-p2-shard-01-37443983343
          path: reports/shard-01
          github-token: ${{ github.token }}
          repository: roylkng/market-research
          run-id: 37443983343

      - name: Download shard 02
        uses: actions/download-artifact@v4
