name: H002-HR003 frozen Phase A verification

on:
  push:
    branches:
      - work/h002-historical-replay-v1-20260907
    paths:
      - .github/workflows/h002-historical-pit-phase-a.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h002-hr003-pit-phase-a
  cancel-in-progress: true

jobs:
  verify-frozen-phase-a:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/h002-historical-replay-v1-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify immutable HR001 dependency
        run: |
          python - <<'PY'
          from marketlab.h002_historical_outcomes import load_phase_a_manifest
          doc = load_phase_a_manifest(
              'research/historical/h002/H002-HR001/phase-a/fixed-u001-transport-signals.json',
              expected_sha256='2062e21ee1b1cbcd86d758ae3cf9ef9aeb43664c629ca5eb7a22cd885068ef98',
          )
          if doc.get('observation_count') != 200:
              raise SystemExit('frozen HR001 observation count changed')
          PY
      - name: Verify immutable HR003 Phase-A manifest
        run: |
          python - <<'PY'
          from marketlab.h002_historical_pit_outcomes import load_phase_a_manifest_pit
          doc = load_phase_a_manifest_pit(
              'research/historical/h002/H002-HR003/phase-a/point-in-time-nifty200-signals.json',
              expected_sha256='77104e3f675578c6b756c950a96a3e13e64fe133c25b48249df68484f25fa3d9',
          )
          print('manifest_sha256', doc['manifest_sha256'])
          print('status_counts', doc['status_counts'])
          print('signal_bucket_counts', doc['signal_bucket_counts'])
          PY
      - name: Verify point-in-time membership snapshots
        run: pytest -q tests/test_nifty200_history.py tests/test_h002_historical_identity.py
